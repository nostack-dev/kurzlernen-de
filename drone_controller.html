<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<link rel="icon" href="data:,">
<title>Arondight45 Remote Controller</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#070a0f;color:#eef4ff;--safe-t:max(10px,env(safe-area-inset-top));--safe-b:max(10px,env(safe-area-inset-bottom));--safe-l:max(10px,env(safe-area-inset-left));--safe-r:max(10px,env(safe-area-inset-right))}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a0f;touch-action:none;overscroll-behavior:none}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}.top{display:grid;grid-template-columns:auto minmax(120px,1fr) auto auto;gap:8px;align-items:center}.brand{font-weight:800;font-size:14px;white-space:nowrap}.pill{border:1px solid #32415c;border-radius:999px;padding:7px 10px;background:#111a29;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.good{color:#64e0ae;border-color:#2d8266}.warn{color:#ffd06d;border-color:#836b34}.bad{color:#ff7185;border-color:#8b3443}button,input{font:inherit;color:inherit}button{border:1px solid #3a4964;border-radius:10px;background:#182235;padding:9px 12px;font-weight:700}button:active{transform:scale(.98)}input{min-width:0;background:#0d1420;border:1px solid #303a4e;border-radius:9px;padding:8px}.sticks{display:grid;grid-template-columns:1fr 1fr;gap:min(5vw,48px);align-items:center;justify-items:center;min-height:0}.stick-wrap{width:min(42vw,420px);aspect-ratio:1;display:grid;place-items:center;position:relative}.stick{position:relative;width:100%;height:100%;border-radius:50%;border:2px solid #2c3951;background:radial-gradient(circle at center,#162033 0 8%,#0d1522 9% 35%,#0a101b 36% 100%);box-shadow:inset 0 0 50px #0008,0 12px 40px #0008;touch-action:none}.stick:before,.stick:after{content:"";position:absolute;background:#26344d;opacity:.8}.stick:before{left:50%;top:8%;bottom:8%;width:1px}.stick:after{top:50%;left:8%;right:8%;height:1px}.knob{position:absolute;width:27%;aspect-ratio:1;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(145deg,#3a4e70,#172237);border:2px solid #5b7197;box-shadow:0 8px 18px #000a;pointer-events:none}.axis-label{position:absolute;font-size:10px;color:#71819a;letter-spacing:.08em}.axis-top{top:-18px}.axis-bottom{bottom:-18px}.axis-left{left:-28px}.axis-right{right:-28px}.bottom{display:grid;grid-template-columns:minmax(210px,1fr) auto minmax(260px,1fr);gap:8px;align-items:stretch}.telemetry{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.metric{background:#0d1522;border:1px solid #263148;border-radius:9px;padding:7px 9px;min-width:0}.metric b{display:block;font-size:10px;color:#8fa1bb;font-weight:600}.metric span{display:block;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.safety{display:flex;gap:8px}.arm{min-width:112px;background:#153624;border-color:#2b7d56;color:#6be4b0}.arm.high{background:#6e2d22;border-color:#d26a55;color:#fff}.kill{min-width:88px;background:#571e2a;border-color:#a73b50;color:#fff}.pair{display:grid;grid-template-columns:80px 1fr auto;gap:6px;align-items:center}.pair label{font-size:10px;color:#8fa1bb}.pair-status{grid-column:1/-1;font-size:10px;color:#8fa1bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{position:absolute;bottom:-34px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#9aacc5}@media(max-width:800px) and (orientation:portrait){.app{grid-template-rows:auto 1fr auto}.top{grid-template-columns:1fr auto}.top .brand{display:none}.top .pill{grid-column:1/2}.sticks{gap:12px}.stick-wrap{width:min(45vw,330px)}.bottom{grid-template-columns:1fr;gap:6px}.telemetry{grid-template-columns:repeat(4,1fr)}.safety{position:absolute;left:50%;bottom:calc(var(--safe-b) + 6px);transform:translateX(-50%);z-index:5}.pair{display:none}}@media(max-height:500px){.app{gap:4px}.top{height:36px}.sticks{gap:36px}.stick-wrap{width:min(35vw,330px)}.bottom{min-height:46px}.metric{padding:5px}.axis-label,.value{display:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">ARONDIGHT45 · REMOTE</div>
    <div id="connection" class="pill warn">DISCONNECTED</div>
    <button id="connect">Connect</button>
    <button id="fullscreen">Fullscreen</button>
  </header>

  <section class="sticks">
    <div class="stick-wrap">
      <div id="leftStick" class="stick"><div id="leftKnob" class="knob"></div></div>
      <span class="axis-label axis-top">THROTTLE +</span><span class="axis-label axis-bottom">THROTTLE −</span><span class="axis-label axis-left">YAW L</span><span class="axis-label axis-right">YAW R</span>
      <span id="leftValue" class="value">T 0% · Y 0%</span>
    </div>
    <div class="stick-wrap">
      <div id="rightStick" class="stick"><div id="rightKnob" class="knob"></div></div>
      <span class="axis-label axis-top">PITCH +</span><span class="axis-label axis-bottom">PITCH −</span><span class="axis-label axis-left">ROLL L</span><span class="axis-label axis-right">ROLL R</span>
      <span id="rightValue" class="value">R 0% · P 0%</span>
    </div>
  </section>

  <footer class="bottom">
    <div class="telemetry">
      <div class="metric"><b>FC</b><span id="fcState">—</span></div>
      <div class="metric"><b>ALT</b><span id="altitude">—</span></div>
      <div class="metric"><b>BAT</b><span id="battery">—</span></div>
      <div class="metric"><b>MOTORS μs</b><span id="motors">—</span></div>
    </div>
    <div class="safety"><button id="arm" class="arm">ARM LOW</button><button id="kill" class="kill">DISARM</button></div>
    <div class="pair"><label>ROOM</label><input id="room" maxlength="12" autocomplete="off" autocapitalize="characters"><button id="copyLink">Copy link</button><div id="pairStatus" class="pair-status">Open this page from the same LAN server as the simulator.</div></div>
  </footer>
</main>
<script type="module" src="./sim/controller.mjs"></script>
</body>
</html>
