<div id="app">
<nav class="menubar" aria-label="Main menu"><button data-menu="File">File</button><button data-menu="Edit">Edit</button><button data-menu="View">View</button><button data-menu="Scene">Scene</button><button data-menu="Window">Window</button><button data-menu="Tools">Tools</button><button data-menu="Help">Help</button><span class="brand">Editor2D · kurzlernen.de</span></nav>

<main class="work">
<aside class="dock" id="leftDock">
<section class="panel" id="itemsPanel"><div class="paneltitle"><span class="title">Items</span><button data-float="itemsPanel" title="Float / dock panel">▣</button><button data-hide="itemsPanel" title="Hide panel">×</button></div><div class="filterbar"><label for="itemFilter">Filter</label><input id="itemFilter" placeholder="Name…" aria-label="Filter items"><select id="itemKind" aria-label="Item type"><option value="all">All</option><option value="body">Bodies</option><option value="fixture">Fixtures</option><option value="joint">Joints</option><option value="image">Images</option><option value="sampler">Samplers</option></select></div><div class="panelbody tree" id="itemTree"></div></section>
<section class="panel active-panel" id="contextPanel"><div class="paneltitle"><span class="title">Editor context help</span><button data-float="contextPanel" title="Float / dock">▣</button><button data-hide="contextPanel" title="Hide">×</button></div><div class="panelbody help" id="contextHelp"></div></section>
<section class="panel" id="undoPanel"><div class="paneltitle"><span class="title">Undo stack</span><button data-hide="undoPanel" title="Hide">×</button></div><div class="panelbody" id="undoList"></div></section>
</aside>
<div class="splitter" id="leftSplit"></div>
<section id="workspace"><div id="tabs" role="tablist"></div><div class="views" id="views"></div></section>
<div class="splitter" id="rightSplit"></div>
<aside class="dock" id="rightDock">
<section class="panel" id="propertiesPanel"><div class="paneltitle"><span class="title">Properties</span><button data-float="propertiesPanel" title="Float / dock">▣</button><button data-hide="propertiesPanel" title="Hide">×</button></div><div class="panelbody" id="properties"></div></section>
<section class="panel" id="helpPanel"><div class="paneltitle"><span class="title">Help</span><button data-float="helpPanel" title="Float / dock">▣</button><button data-hide="helpPanel" title="Hide">×</button></div><div class="panelbody help" id="generalHelp"></div></section>
</aside>
<div class="splitter" id="bottomSplit"></div><aside class="dock" id="bottomDock"><section class="panel" id="logPanel"><div class="paneltitle"><span class="title">Message log</span><button id="clearLog" title="Clear log">Clear</button><button data-hide="logPanel" title="Hide">×</button></div><div class="panelbody" id="log" role="log"></div></section></aside>
</main>
<footer class="statusbar"><span id="modeStatus">Body edit</span><span id="coordStatus">World location: 0, 0</span><span id="statusMessage">Ready</span><span id="counts"></span><span id="zoomStatus">100%</span></footer>
</div>
<input type="file" id="sceneFile" accept=".json,.e2d,.rube" multiple hidden><input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input type="file" id="assetFiles" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>

<script>
'use strict';
/* Editor2D: independently implemented, R.U.B.E-inspired UI. Native document is

   or imported executable code are evaluated. All authoring code is in this file. */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clone=o=>structuredClone(o), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V=(x=0,y=0)=>({x,y}), add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,k)=>V(a.x*k,a.y*k), dot=(a,b)=>a.x*b.x+a.y*b.y, cross=(a,b)=>a.x*b.y-a.y*b.x, len=a=>Math.hypot(a.x,a.y), rot=(p,a)=>V(p.x*Math.cos(a)-p.y*Math.sin(a),p.x*Math.sin(a)+p.y*Math.cos(a));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), round=x=>Math.round(x*1e6)/1e6, fmt=x=>Number(x.toFixed(4)).toString();
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
const modes={body:'Body',fixture:'Fixture',vertex:'Vertex',joint:'Joint',image:'Image',sampler:'Sampler',world:'World'};
const jointTypes=['revolute','distance','prismatic','wheel','rope','weld','friction','motor'];
const defaults={gravity:V(0,-10),allowSleep:true,autoClearForces:true,positionIterations:3,velocityIterations:8,stepsPerSecond:60,warmStarting:true,continuousPhysics:true,subStepping:false};
const options={grid:true,labels:false,shapes:true,joints:true,images:true,centers:true,decomposition:false,angleUnit:'degrees',snap:0.25,angleSnap:15,scaleSnap:0.1,snapMode:'delta',pivot:'selection',reverseZoom:false};
let documents=[],views=[],activeView=null,mode='body',operation=null,drawTool=null,insertMode=0,hover=null,clipboard=null,menu=null,tiled=false,dirtyRender=true,mouse=V(),lastScreen=V(),engine=window.planck,storageTimer=null;
const imageCache=new Map(), collapsed=new Set(), allMessages=[];
function scene(name='Untitled'){return {format:'editor2d',version:1,id:uid(),name,world:clone(defaults),bodies:[],joints:[],images:[],samplers:[],cursor:V(),extra:{}}}
function doc(){return activeView?.doc||documents[0]}
function S(){return doc()?.scene}
function selection(m=mode){return doc()?.selection[m]||[]}
function allItems(s=S(),m=mode){if(m==='body')return s.bodies;if(m==='fixture')return s.bodies.flatMap(b=>b.fixtures);if(m==='joint')return s.joints;if(m==='image')return s.images;if(m==='sampler')return s.samplers;if(m==='vertex')return s.bodies.flatMap(b=>b.fixtures.flatMap(f=>f.vertices.map((p,i)=>({id:f.id+':'+i,fixture:f.id,index:i,position:p}))));return []}
function bodyOf(id,s=S()){return s.bodies.find(b=>b.id===id)||s.bodies.find(b=>b.fixtures.some(f=>f.id===id))}
function find(id,s=S()){return s.bodies.find(b=>b.id===id)||s.bodies.flatMap(b=>b.fixtures).find(f=>f.id===id)||s.joints.find(j=>j.id===id)||s.images.find(i=>i.id===id)||s.samplers.find(i=>i.id===id)}
function chosen(s=S(),m=mode){return allItems(s,m).filter(i=>selection(m).includes(i.id))}
function toWorld(p,b){return b?add(b.position,rot(p,b.angle)):V(p.x,p.y)}
function toLocal(p,b){return b?rot(sub(p,b.position),-b.angle):V(p.x,p.y)}
function itemPoint(i,m=mode,s=S()){if(m==='body')return i.position;if(m==='fixture')return toWorld(average(i.vertices),bodyOf(i.id,s));if(m==='vertex')return toWorld(i.position,bodyOf(i.fixture,s));if(m==='joint')return toWorld(i.anchorA,bodyOf(i.bodyA,s));if(m==='image'||m==='sampler')return toWorld(i.center,bodyOf(i.body,s));return V()}
function average(points){return points.length?mul(points.reduce(add,V()),1/points.length):V()}
function center(s=S(),m=mode){return average(chosen(s,m).map(i=>itemPoint(i,m,s)))}
function newBody(type=2,p=V(),name){return {id:uid(),name:name||['staticbody','kinematicbody','dynamicbody'][type]+S().bodies.length,type,position:clone(p),angle:0,linearVelocity:V(),angularVelocity:0,linearDamping:0,angularDamping:0,gravityScale:1,allowSleep:true,awake:true,active:true,bullet:false,fixedRotation:false,fixtures:[],customProperties:[],extra:{}}}
function newFixture(shape='polygon',points=[V(-.5,-.5),V(.5,-.5),V(.5,.5),V(-.5,.5)]){return {id:uid(),name:'fixture'+allItems(S(),'fixture').length,shape,vertices:clone(points),radius:shape==='circle'?.5:0,density:1,friction:.3,restitution:.1,sensor:false,categoryBits:1,maskBits:65535,groupIndex:0,customProperties:[],extra:{}}}
function snapshot(d=doc()){return {scene:clone(d.scene),selection:clone(d.selection)}}
function restore(state,d=doc()){d.scene=clone(state.scene);d.selection=clone(state.selection);dirtyRender=true}
function commit(label,before,d=doc()){for(const b of d.scene.bodies){const old=before.scene.bodies.find(x=>x.id===b.id),physical=fs=>fs.map(f=>({vertices:f.vertices,shape:f.shape,radius:f.radius,density:f.density,additionalShapes:f.additionalShapes}));if(old&&b.massData&&JSON.stringify(physical(old.fixtures))!==JSON.stringify(physical(b.fixtures)))delete b.massData;}const after=snapshot(d);if(JSON.stringify(before)===JSON.stringify(after))return;d.history.splice(d.index);d.history.push({label,before,after});if(d.history.length>150)d.history.shift();d.index=d.history.length;d.dirty=true;update();scheduleSave()}
function edit(label,fn){if(operation)finishOperation(false);const before=snapshot();try{fn();commit(label,before)}catch(e){restore(before);report(e.message,'error');update();return false}return true}
function undo(){if(operation){finishOperation(false);return}const d=doc();if(d.index){restore(d.history[--d.index].before);d.dirty=true;update();scheduleSave()}}
function redo(){const d=doc();if(d.index<d.history.length){restore(d.history[d.index++].after);d.dirty=true;update();scheduleSave()}}
function setSelection(ids,{shift=false,toggle=false,m=mode,record=true}={}){const d=doc(),before=snapshot();let result=[...ids];if(shift)result=[...new Set([...d.selection[m],...ids])];if(toggle){const set=new Set(d.selection[m]);ids.forEach(id=>set.has(id)?set.delete(id):set.add(id));result=[...set]}d.selection[m]=result;if(record)commit('Select '+m,before);else update();}
function report(message,type='info'){const row=document.createElement('div');row.className='log-line '+type;row.textContent=new Date().toLocaleTimeString()+'  '+message;$('#log').append(row);while($('#log').children.length>250)$('#log').firstChild.remove();$('#log').scrollTop=$('#log').scrollHeight;$('#statusMessage').textContent=message;allMessages.push({message,type});if(type==='error')$('#logPanel').hidden=false}
function scheduleSave(){clearTimeout(storageTimer);storageTimer=setTimeout(()=>{try{localStorage.setItem('editor2d.workspace.v1',JSON.stringify(documents.map(d=>d.scene)))}catch(e){report('Autosave unavailable or full. Use File → Save scene.','warn')}},350)}
function area(p){return p.reduce((s,a,i)=>s+cross(a,p[(i+1)%p.length]),0)/2}
function orient(a,b,c){return cross(sub(b,a),sub(c,a))}
function onSegment(p,a,b){return Math.abs(orient(a,b,p))<1e-8&&dot(sub(p,a),sub(p,b))<=1e-8}

function fieldsFor(m){const f=[];const group=label=>f.push({group:label}),field=(label,path,type='number',extra={})=>f.push({label,path,type,...extra}),vector=(label,path)=>{field(label+' X',path+'.x');field(label+' Y',path+'.y')};if(m!=='world'&&m!=='vertex')field('Name','name','text');

if(m==='fixture'){field('Friction','friction','number',{min:0});field('Restitution','restitution','number',{min:0,max:1});field('Density','density','number',{min:0});field('Sensor','sensor','checkbox');field('Filter category bits','categoryBits','number',{min:0,max:65535,step:1});field('Filter mask bits','maskBits','number',{min:0,max:65535,step:1});field('Filter group index','groupIndex','number',{min:-32768,max:32767,step:1});group('Shape');field('Type','shape','select',{choices:[['circle','Circle'],['polygon','Polygon'],['chain','Line'],['loop','Loop']]});field('Radius','radius','number',{min:0})}

if(m==='image'||m==='sampler'){field('Body','body','select',{choices:[['','(none)'],...S().bodies.map(b=>[b.id,b.name||'(unnamed)'])]});vector('Center','center');field('Angle','angle','angle');if(m==='image'){field('Height / scale','scale','number',{min:.001});field('Aspect scale','aspectScale','number',{min:.001});field('Render order','renderOrder');field('Filter','filter','select',{choices:[[0,'Linear'],[1,'Nearest']]})}else{field('Width','width','number',{min:.001});field('Height','height','number',{min:.001});field('Pixels / meter','resolution','number',{min:1,max:500,step:1});field('Alpha threshold','threshold','number',{min:1,max:255,step:1});field('Contour tolerance','tolerance','number',{min:.001,max:1})}field('Opacity','opacity','number',{min:0,max:1,step:.05});field('Flip','flip','checkbox');field('Tint','colorTint','color');field('File','file','text')}

function updateProperties(){const root=$('#properties'),items=mode==='world'?[S().world]:chosen();if(!items.length){root.innerHTML='<div class="empty">No '+esc(mode)+' selected.<br>Select an item in the view or Items panel.</div>';return}const fields=fieldsFor(mode);root.innerHTML=`<div class="proptitle">${mode==='world'?'World parameters':items.length+' '+mode+(items.length===1?'':'s')+' selected'}</div><table class="props"><thead><tr><th>Property</th><th>Value</th></tr></thead><tbody></tbody></table>`;const tbody=root.querySelector('tbody');for(const f of fields){if(f.group){const tr=document.createElement('tr');tr.className='group';tr.innerHTML=`<td colspan="2">▾ ${esc(f.group)}</td>`;tbody.append(tr);continue}const values=items.map(i=>getPath(i,f.path)),mixed=values.some(v=>JSON.stringify(v)!==JSON.stringify(values[0]));let value=values[0];if(f.type==='angle')value=(value||0)*(options.angleUnit==='degrees'?180/Math.PI:1);const tr=document.createElement('tr'),td=document.createElement('td'),cell=document.createElement('td');td.textContent=f.label+(f.type==='angle'?(options.angleUnit==='degrees'?' (°)':' (rad)'):'');tr.append(td,cell);let input;if(f.type==='select'){input=document.createElement('select');for(const [v,l]of f.choices){const o=document.createElement('option');o.value=v;o.textContent=l;input.append(o)}if(mixed){const o=document.createElement('option');o.value='__mixed';o.textContent='— multiple —';input.prepend(o);input.value='__mixed'}else input.value=value??''}else{input=document.createElement('input');input.type=f.type==='angle'?'number':f.type;input.step=f.step||'any';if(f.min!==undefined)input.min=f.min;if(f.max!==undefined)input.max=f.max;if(f.type==='checkbox'){input.checked=!!value;input.indeterminate=mixed}else if(f.type==='color'){input.value='#'+(value||[255,255,255]).slice(0,3).map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}else{input.value=mixed?'':f.type==='number'||f.type==='angle'?round(value??0):value??'';input.placeholde function updateTree(){const root=$('#itemTree'),query=$('#itemFilter').value.toLowerCase(),kind=$('#itemKind').value;root.replaceChildren();const row=(item,m,cls='',depth=0)=>{if(kind!=='all'&&kind!==m)return;if(query&&!item.name?.toLowerCase().includes(query))return;const r=document.createElement('div');r.className='tree-row '+cls+(selection(m).includes(item.id)?' selected':'');r.setAttribute('role','treeitem');r.innerHTML=`${m==='body'?`<button class="disclose" title="Expand body">${collapsed.has(item.id)?'▸':'▾'}</button>`:'<span style="width:12px"></span>'}<input type="checkbox" aria-label="Select ${esc(item.name||m)}" ${selection(m).includes(item.id)?'checked':''}><span class="dot ${m}"></span><span class="name">${esc(item.name||'(unnamed)')}</span>`;if(m==='body')r.querySelector('.disclose').onclick=e=>{e.stopPropagation();collapsed.has(item.id)?collapsed.delete(item.id):collapsed.add(item.id);updateTree()};r.onclick=e=>{setMode(m);setSelection([item.id],{shift:e.shiftKey,toggle:e.target.type==='checkbox'||e.ctrlKey||e.metaKey});};r.ondblclick=()=>renameDialog(item);r.onpointerenter=()=>{hover=item.id;dirtyRender=true};r.onpointerleave=()=>{hover=null;dirtyRender=true};root.append(r)};for(const b of S().bodies){row(b,'body');if(!collapsed.has(b.id)||query||kind==='fixture')for(const f of b.fixtures)row(f,'fixture','fixture')}for(const j of S().joints)row(j,'joint');for(const i of S().images)row(i,'image');for(const i of S().samplers)row(i,'sampler');if(!root.children.length)root.innerHTML='<div class="empty">No items. Space → Add → Body.</div>'}

function updateHistory(){const root=$('#undoList'),d=doc();root.replaceChildren();const r=document.createElement('div');r.className='undo-row'+(d.index===0?' current':'');r.textContent='Initial state';r.onclick=()=>{if(d.history.length){restore(d.history[0].before);d.index=0;update();scheduleSave()}};root.append(r);d.history.forEach((h,i)=>{const el=document.createElement('div');el.className='undo-row'+(d.index===i+1?' current':d.index<i+1?' future':'');el.textContent=h.label;el.onclick=()=>{restore(h.after);d.index=i+1;update();scheduleSave()};root.append(el)});root.querySelector('.current')?.scrollIntoView({block:'nearest'})}
function updateContext(){let text;if(activeView?.type==='player')text='<h3>Player view</h3><p>This player runs a copy of the scene. Editing never changes its running state.</p><ul><li><span class="key">Left mouse:</span> drag dynamic bodies</li><li><span class="key">Right mouse:</span> pan</li><li><span class="key">Wheel:</span> zoom</li><li><span class="key">Ctrl+R:</span> reload latest scene</li><li><span class="key">Space:</span> pause; when paused, single step</li></ul>';else if(operation){text=`<h3>${esc(operation.kind)} ${modes[mode].toLowerCase()}s</h3><p>Move the mouse to change the selection.</p><ul><li><span class="key">Left click / Enter:</span> confirm</li><li><span class="key">Esc:</span> cancel</li><li><span class="key">X / Y:</span> restrict axis</li><li><span class="key">Ctrl:</span> discrete steps</li><li><span class="key">Shift:</span> fine control (10×)</li><li>Type a number for exact values.</li></ul>`;if(operation.kind==='rotate'||operation.kind==='scale')text+='<p>Press the same key again to switch between selection center and cursor.</p>';if(operation.kind==='cursor')text+='<p><span class="key">C:</span> exact position dialog<br><span class="key">S:</span> cursor to selection</p>';if(mode==='joint')text+=`<p>Repeated <span class="key">T:</span> anchor A → anchor B → length / both anchors.<br><span class="key">R:</span> anchor A → anchor B → axis.<br><span class="key">L:</span> lower → upper limit.<br>Current stage: ${operation.stage+1}</p>`}else text=`<h3>${modes[mode]} edit mode</h3><ul><li><span class="key">Left click:</span> select ${mode==='body'?'body nub':'item'}</li><li><span class="key">Drag left:</span> box selection</li><li><span class="key">Shift:</span> add to selection</li><li><span class="key">Ctrl:</span> toggle selection</li><li><span class="key">T / G:</span> translate</li><li><span class="key">R:</span> rotate</li><li><span class="key">S:</span> scale</li><li><span class="key">Shift+D:</span> duplicate and translate</li><li><span class="key">Delete:</span> delete selection</li></ul><p><span class="key">C:</span> move cursor · <span class="key">Space:</span> action menu<br><span class="key">Home:</span> fit scene</p>${mode==='vertex'?'<p><span class="key">E:</span> insert on edge → freehand → reverse. <span class="key">Esc:</span> finish.</p>':''}${mode==='joint'?'<p><span class="key">L:</span> edit limits. Repeat T/R to cycle anchors, length and axis.</p>':''}<p class="muted">Right-drag: pan · Ctrl+right-drag: zoom · Shift+right-drag: zoom rectangle</p>`;$('#contextHelp').innerHTML=text;$('#modeStatus').textContent=modes[mode]+' edit'+(operation?' · '+operation.kind:'')}
function update(){if(!doc())return;updateTabs();updateTree();updateProperties();updateHistory();updateContext();for(const v of views)updateViewbar(v);$$('[data-mode]').forEach(b=>{b.classList.toggle('on',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$('#counts').textContent=`${S().bodies.length} bodies · ${allItems(S(),'fixture').length} fixtures · ${S().joints.length} joints`;dirtyRender=true}
function dialog(title,html,buttons=[{label:'Close'}]){closeMenu();$('.modal-back')?.remove();const back=document.createElement('div');back.className='modal-back';back.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-title"><span>${esc(title)}</span><button aria-label="Close dialog">×</button></div><div class="dialog-body">${html}<div class="errorbox"></div></div><div class="dialog-footer"></div></section>`;document.body.append(back);back.querySelector('.dialog-title button').onclick=()=>back.remove();const footer=back.querySelector('.dialog-footer');for(const {label,run} of buttons){const b=document.createElement('button');b.className='plain';b.textContent=label;b.onclick=async()=>{try{const result=await run?.();if(result!==false)back.remove()}catch(e){back.querySelector('.errorbox').textContent=e.message}};footer.append(b)}setTimeout(()=>back.querySelector('input,select,textarea,.dialog-footer button')?.focus(),0);return back}
function numberDialog(title,label,value,fn){dialog(title,`<label>${esc(label)} <input id="dialogNumber" type="number" step="any" value="${value}"></label>`,[{label:'Cancel'},{label:'OK',run:()=>{const n=Number($('#dialogNumber').value);if(!Number.isFinite(n)||!$('#dialogNumber').value)throw Error('Enter a finite number');fn(n)}}])}
function cursorDialog(){if(operation)finishOperation(false);dialog('Set cursor position',`<label>X <input id="cursorX" type="number" step="any" value="${S().cursor.x}"></label><label>Y <input id="cursorY" type="number" step="any" value="${S().cursor.y}"></label>`,[{label:'Cancel'},{label:'OK',run:()=>{const p=V(Number($('#cursorX').value),Number($('#cursorY').value));if(!Number.isFinite(p.x)||!Number.isFinite(p.y))throw Error('Invalid position');edit('Set cursor',()=>S().cursor=p)}}])}
