<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kern3d — kurzlernen.de</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1116; color: #d5dde8; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hint {
      position: fixed; left: 16px; top: 14px; max-width: 440px;
      padding: 10px 12px; border-radius: 8px;
      background: rgba(8, 10, 14, 0.72); border: 1px solid rgba(255,255,255,0.08);
    }
    #hint b { color: #fff; }
    #hint a { color: #8eb6ff; }
    #hud {
      position: fixed; left: 16px; bottom: 14px;
      padding: 8px 10px; border-radius: 8px;
      background: rgba(8, 10, 14, 0.72); border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hint">
    <b>kern3d</b> auf kurzlernen.de. Eine Datei, Vanilla-JS, CDN wie Three.js.
    Ziehen dreht, Shift-Ziehen schiebt, Rad zoomt.
    <a href="https://cdn.jsdelivr.net/gh/ChristianHohlfeld/kern3d@0.1.1/dist/kern3d.js">CDN</a>
  </div>
  <div id="hud">lädt…</div>

  <script src="https://cdn.jsdelivr.net/gh/ChristianHohlfeld/kern3d@0.1.1/dist/kern3d.js"></script>
  <script>
    var canvas = document.getElementById("view");
    var hud = document.getElementById("hud");
    var renderer = new KERN.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setClearColor(0x0e1116);

    var scene = new KERN.Scene();
    scene.fog = new KERN.Fog(0x0e1116, 18, 46);
    scene.background = new KERN.Color(0x0e1116);

    var camera = new KERN.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(7.5, 4.2, 9);
    var controls = new KERN.OrbitControls(camera, canvas);
    controls.target.set(0, 0.8, 0);
    controls.update();

    scene.add(new KERN.AmbientLight(0x8aa0c8, 0.28));
    var sun = new KERN.DirectionalLight(0xfff4e0, 0.7);
    sun.position.set(6, 10, 4);
    scene.add(sun);
    scene.add(sun.target);

    var warm = new KERN.PointLight(0xff7a3c, 1.1, 16);
    warm.position.set(-3.2, 2.2, 2.4);
    scene.add(warm);
    var cool = new KERN.PointLight(0x4aa3ff, 0.9, 16);
    cool.position.set(3.4, 1.6, -2.6);
    scene.add(cool);

    scene.add(new KERN.GridHelper(20, 20, 0x6d7c90, 0x2a3340));

    var floor = new KERN.Mesh(
      new KERN.PlaneGeometry(20, 20),
      new KERN.MeshPhongMaterial({ color: 0x1a212b, shininess: 40, specular: 0x222222 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    var checker = document.createElement("canvas");
    checker.width = checker.height = 128;
    var ctx = checker.getContext("2d");
    var y, x;
    for (y = 0; y < 8; y++) {
      for (x = 0; x < 8; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? "#e8d7bf" : "#8d5a3c";
        ctx.fillRect(x * 16, y * 16, 16, 16);
      }
    }
    var map = new KERN.Texture(checker);

    var box = new KERN.Mesh(
      new KERN.BoxGeometry(1.4, 1.4, 1.4),
      new KERN.MeshPhongMaterial({ color: 0xffffff, map: map, shininess: 24, specular: 0x333333 })
    );
    box.position.set(-2.2, 0.7, 0.4);
    scene.add(box);

    var sphere = new KERN.Mesh(
      new KERN.SphereGeometry(0.85, 48, 24),
      new KERN.MeshPhongMaterial({ color: 0xd7e4f5, shininess: 90, specular: 0xffffff })
    );
    sphere.position.set(0.4, 0.85, 1.3);
    scene.add(sphere);

    var torus = new KERN.Mesh(
      new KERN.TorusGeometry(0.7, 0.26, 20, 48),
      new KERN.MeshPhongMaterial({ color: 0x3ddc97, shininess: 50, specular: 0x88ffcc })
    );
    torus.position.set(2.4, 0.9, -0.6);
    scene.add(torus);

    var colors = [0xf2c14e, 0xe85d4c, 0x6c8cff, 0xc084fc, 0x5eead4];
    var cubes = [];
    for (var i = 0; i < 5; i++) {
      var cube = new KERN.Mesh(
        new KERN.BoxGeometry(0.45, 0.45 + i * 0.12, 0.45),
        new KERN.MeshPhongMaterial({ color: colors[i], shininess: 40, specular: 0x444444 })
      );
      cube.position.set(-1.6 + i * 0.85, 0.25 + i * 0.06, -2.2);
      scene.add(cube);
      cubes.push(cube);
    }

    function resize() {
      var w = canvas.clientWidth || window.innerWidth;
      var h = canvas.clientHeight || window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    var frames = 0;
    var last = performance.now();
    var acc = 0;
    function tick(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      box.rotation.y += dt * 0.45;
      box.rotation.x += dt * 0.18;
      torus.rotation.x += dt * 0.7;
      torus.rotation.y += dt * 0.35;
      sphere.position.y = 0.85 + Math.sin(now * 0.0016) * 0.18;
      warm.position.x = Math.sin(now * 0.0007) * 3.2;
      cool.position.z = Math.cos(now * 0.0009) * 3.0;
      for (var n = 0; n < cubes.length; n++) cubes[n].rotation.y += dt * (0.4 + n * 0.12);
      controls.update();
      renderer.render(scene, camera);
      frames++;
      acc += dt;
      if (acc >= 0.4) {
        hud.textContent = Math.round(frames / acc) + " fps · kern3d " + KERN.REVISION;
        frames = 0;
        acc = 0;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
