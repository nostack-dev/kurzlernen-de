(()=>{'use strict';const C=document.getElementById('c'),X=C.getContext('2d'),D=Math.PI/180,V=(x=0,y=0,z=0)=>({x,y,z}),A=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),S=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),M=(a,s)=>V(a.x*s,a.y*s,a.z*s),Q=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,L=a=>Math.hypot(a.x,a.y,a.z),N=a=>{let l=L(a)||1;return M(a,1/l)},CR=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x),CL=(x,a,b)=>Math.max(a,Math.min(b,x)),LR=(a,b,t)=>V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,a.z+(b.z-a.z)*t);

const W={sr:3.7,er:1.4,mr:.5,eo:30,mo:4.05,win:.65},U={ey:document.getElementById('ey'),st:document.getElementById('st'),su:document.getElementById('su'),time:document.getElementById('time'),tl:document.getElementById('tl'),spd:document.getElementById('spd'),speed:document.getElementById('speed'),play:document.getElementById('play'),cm:document.getElementById('cm')};let R=V(1,0,0),UP=V(0,1,0),F=V(0,0,-1),fov=42*D;

function label(txt,p,r){let q=proj(p);if(!q)return;let z=rr(p,r);X.font='700 9px system-ui';X.textAlign='center';X.fillStyle='#eef2ffcc';X.fillText(txt,q.x,q.y-z-10)}

function free(){let c=Math.cos(fp);cp=A(ct,V(Math.sin(fy)*c*fd,Math.sin(fp)*fd,Math.cos(fy)*c*fd))}
function setFree(){if(cam!=='free'){let d=S(cp,ct);fd=L(d);fp=Math.asin(CL(d.y/fd,-.99,.99));fy=Math.atan2(d.x,d.z);cam='free';mark()}}
function mark(){document.querySelectorAll('.cams button').forEach(b=>b.classList.toggle('on',b.dataset.c===cam));U.cm.textContent=cam==='free'?'Freie Kamera':'Preset-Kamera aktiv'}
function status(f){let a=Math.abs(t);U.ey.textContent=mode==='solar'?'SONNENFINSTERNIS':'MONDFINSTERNIS';if(a<.045){U.st.textContent='Maximalphase';U.su.textContent=mode==='solar'?'Mondschatten trifft die Erde':'Mond im Erdschatten'}else if(a<.25){U.st.textContent='Partielle Phase';U.su.textContent=mode==='solar'?'Mond schiebt sich vor die Sonne':'Mond durchquert den Erdschatten'}else{U.st.textContent=t<0?'Annäherung':'Finsternis klingt ab';U.su.textContent=mode==='solar'?'Mond bewegt sich vor die Sonne':'Mond nähert sich dem Erdschatten'}}
function time(){let m=Math.round(t*1440),sg=m<0?'−':m>0?'+':'±',a=Math.abs(m);U.time.textContent=a<1?'MAXIMALPHASE':sg+Math.floor(a/60)+' h '+String(a%60).padStart(2,'0')+' min';U.tl.value=Math.round(t/W.win*1000)}
function resize(){let d=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(C.width!==w||C.height!==h){C.width=w;C.height=h;C.style.width=innerWidth+'px';C.style.height=innerHeight+'px'}X.setTransform(d,0,0,d,0,0)}

document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;t=-.42;play=1;U.play.textContent='❚❚';document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('on',x===b));time()});

function ti(){let a=[...pts.values()];if(a.length<2)return null;let dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;return{d:Math.hypot(dx,dy),c:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}}
C.onpointerdown=e=>{C.setPointerCapture?.(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY});setFree();if(pts.size===2){let i=ti();pin=i.d;pc=i.c}};C.onpointermove=e=>{let p=pts.get(e.pointerId);if(!p)return;p.px=p.x;p.py=p.y;p.x=e.clientX;p.y=e.clientY;if(pts.size===1){fy-=(p.x-p.px)*.006;fp=CL(fp-(p.y-p.py)*.006,-1.4,1.4)}else{let i=ti();if(i){if(pin)fd=CL(fd*pin/i.d,2.2,100);if(pc){let s=fd*.0018;ct=A(ct,A(M(R,-(i.c.x-pc.x)*s),M(UP,(i.c.y-pc.y)*s)))}pin=i.d;pc=i.c}}};C.onpointerup=C.onpointercancel=e=>{pts.delete(e.pointerId);if(pts.size<2){pin=0;pc=null}};C.onwheel=e=>{e.preventDefault();setFree();fd=CL(fd*Math.exp(e.deltaY*.0012),2.2,100)};
