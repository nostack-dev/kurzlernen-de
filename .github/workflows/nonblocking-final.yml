# final measured-response gate: preserve proven translation and strict 0.22 s / 4 degree yaw contract
name: Nonblocking flight final
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nonblocking-final.yml
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal measured candidate
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sim=Path("sim/simulator.mjs");s=sim.read_text();old='function exportSession(){downloadJson(`arondight45-${mode}-${new Date().toISOString().replace(/[:.]/g,"-")}.json`,{schema:"arondight45-flight-log-v1",mode,samples:sessionLog,physics:defaultParams()});}';new='''function exportSession(){
            if((latest.state&STATE_ARMED)&&inputSource==="remote"){
              setStatus("Disarm before exporting a full flight log during P2P control.","warn");
              return;
            }
            downloadJson(`arondight45-${mode}-${new Date().toISOString().replace(/[:.]/g,"-")}.json`,{schema:"arondight45-flight-log-v1",mode,samples:sessionLog,physics:defaultParams()});
          }''';
          if new not in s:
              assert s.count(old)==1,s.count(old);s=s.replace(old,new,1)
          sim.write_text(s)
          state=Path("esp32/Arondight45_StateControl.hpp");s=state.read_text();old_rate="constexpr float kStateMaxYawRateDps = 100.0f;";new_rate="constexpr float kStateMaxYawRateDps = 140.0f;";
          if new_rate not in s:
              assert s.count(old_rate)==1,s.count(old_rate);s=s.replace(old_rate,new_rate,1)
          assert "kHorizontalVelocityGain = 0.80f" in s
          assert "kHorizontalAccelerationDamping = 0.55f" in s
          assert "const float measured_right = s * nav.velocity_world_mps.x - c * nav.velocity_world_mps.y;" in s
          state.write_text(s)
          unit=Path("tests/state_control_test.cpp");s=unit.read_text();old_assert="CHECK(controller.debug().target_yaw_deg > 90.0f);";new_assert="CHECK(controller.debug().target_yaw_deg > 135.0f && controller.debug().target_yaw_deg < 145.0f);";
          if new_assert not in s:
              assert s.count(old_assert)==1,s.count(old_assert);s=s.replace(old_assert,new_assert,1)
          unit.write_text(s)
          test=Path("tests/dual_phone_smoke.mjs");s=test.read_text()
          old_args='const args=["--no-sandbox","--disable-dev-shm-usage","--enable-webgl","--ignore-gpu-blocklist","--use-gl=angle","--use-angle=swiftshader","--use-fake-ui-for-media-stream","--use-fake-device-for-media-stream"];'
          new_args='const args=["--no-sandbox","--disable-dev-shm-usage","--enable-webgl","--ignore-gpu-blocklist","--use-gl=angle","--use-angle=swiftshader","--use-fake-ui-for-media-stream","--use-fake-device-for-media-stream","--disable-background-timer-throttling","--disable-backgrounding-occluded-windows","--disable-renderer-backgrounding","--disable-features=CalculateNativeWinOcclusion"];'
          if new_args not in s:
              assert s.count(old_args)==1,s.count(old_args);s=s.replace(old_args,new_args,1)
          assert 'await controller.mouse.move(rcx+rr*.65,rcy,{steps:4});' in s
          assert 'const turnStart=await simTime(view);await waitSim(view,turnStart+.22,25000);await controller.mouse.up();' in s
          assert 'if(Math.abs(yawDelta)<4)' in s
          helper='''async function liveMotion(view,controller){
            const ist=await controller.$eval("#stateVectorDebug [data-vector-ist-text]",element=>element.textContent||"");
            const match=ist.match(/v\\[F\\s*([+-]?\\d+(?:\\.\\d+)?)\\s*\\|\\s*R\\s*([+-]?\\d+(?:\\.\\d+)?)\\s*\\|\\s*Z\\s*([+-]?\\d+(?:\\.\\d+)?)\\]\\s*m\\/s.*?AGL\\s*([+-]?\\d+(?:\\.\\d+)?)\\s*m\\s*R\\/P\\/Y\\s*([+-]?\\d+(?:\\.\\d+)?)\\s*\\/\\s*([+-]?\\d+(?:\\.\\d+)?)\\s*\\/\\s*([+-]?\\d+(?:\\.\\d+)?)°/);
            if(!match)throw new Error(`cannot parse live measured-state telemetry: ${ist}`);
            const viewState=await view.evaluate(()=>({altitude:parseFloat(document.querySelector("#altitude")?.textContent||"NaN"),speed:parseFloat(document.querySelector("#velocity")?.textContent||"NaN"),state:document.querySelector("#fcState")?.textContent||"",motors:(document.querySelector("#motors")?.textContent||"").trim().split(/\\s+/).map(Number)}));
            const forward=Number(match[1]),right=Number(match[2]),vertical=Number(match[3]);
            return{forward,right,horizontal:Math.hypot(forward,right),vertical,speed:viewState.speed,altitude:viewState.altitude,roll:Number(match[5]),pitch:Number(match[6]),yaw:Number(match[7]),state:viewState.state,motors:viewState.motors};
          }
          async function liveTrace(view,controller,start,offsets,timeout=90000){const trace=[];for(const offset of offsets){await waitSim(view,start+offset,timeout);trace.push({offset,...await liveMotion(view,controller)});}return trace;}
          '''
          if "async function liveMotion(view,controller)" not in s:
              marker="function traceAtOffsets(samples,start,offsets){";assert s.count(marker)==1,s.count(marker);s=s.replace(marker,helper+marker,1)
          for old_text,new_text in [("const hold=bodyMotion(await latestFlightSample(view));","const hold=await liveMotion(view,controller);"),("const clearanceRise=bodyMotion(await latestFlightSample(view));","const clearanceRise=await liveMotion(view,controller);"),("const moving=bodyMotion(await latestFlightSample(view));","const moving=await liveMotion(view,controller);")]:
              if new_text not in s: assert s.count(old_text)==1,(old_text,s.count(old_text));s=s.replace(old_text,new_text,1)
          old_text='''  const brakeStart=await simTime(view);await waitSim(view,brakeStart+4.0,90000);
            const samples=await flightSamples(view),trace=traceAtOffsets(samples,brakeStart,[0,.4,.8,1.2,1.6,2.4,3.2,4.0]);
          ''';new_text='''  const brakeStart=await simTime(view);
            const trace=await liveTrace(view,controller,brakeStart,[0,.4,.8,1.2,1.6,2.4,3.2,4.0]);
          '''
          if new_text not in s: assert s.count(old_text)==1,s.count(old_text);s=s.replace(old_text,new_text,1)
          old_text='''  const strafeStart=await simTime(view);await waitSim(view,strafeStart+1.0,45000);
            const strafeCommandSamples=await flightSamples(view),strafeCommandTrace=traceAtOffsets(strafeCommandSamples,strafeStart,[0,.1,.2,.35,.5,.65,.8,1.0]);
            const strafing=strafeCommandTrace[strafeCommandTrace.length-1];
          ''';new_text='''  const strafeStart=await simTime(view);
            const strafeCommandTrace=await liveTrace(view,controller,strafeStart,[0,.1,.2,.35,.5,.65,.8,1.0],45000);
            const strafing=strafeCommandTrace[strafeCommandTrace.length-1];
          '''
          if new_text not in s: assert s.count(old_text)==1,s.count(old_text);s=s.replace(old_text,new_text,1)
          old_text='''  const strafeBrakeStart=await simTime(view);await waitSim(view,strafeBrakeStart+4.0,90000);
            const strafeSamples=await flightSamples(view),strafeTrace=traceAtOffsets(strafeSamples,strafeBrakeStart,[0,.4,.8,1.2,1.6,2.4,3.2,4.0]),strafeBraked=strafeTrace[strafeTrace.length-1];
          ''';new_text='''  const strafeBrakeStart=await simTime(view);
            const strafeTrace=await liveTrace(view,controller,strafeBrakeStart,[0,.4,.8,1.2,1.6,2.4,3.2,4.0]),strafeBraked=strafeTrace[strafeTrace.length-1];
          '''
          if new_text not in s: assert s.count(old_text)==1,s.count(old_text);s=s.replace(old_text,new_text,1)
          armed=s[s.index('const left=await stickBox(controller,"#leftStick")'):s.index('const stall=controller.evaluate')]
          assert "flightSamples(view)" not in armed
          assert "latestFlightSample(view)" not in armed
          assert "liveTrace(view,controller" in armed
          test.write_text(s)
          PY
      - name: Stage clean production tree
        run: |
          set -euxo pipefail
          for path in .github/workflows/*; do
            case "$path" in
              .github/workflows/deploy.yml|.github/workflows/s31-hil.yml) ;;
              *) git rm -f --ignore-unmatch "$path" ;;
            esac
          done
          git rm -f --ignore-unmatch tools/apply_nonblocking_e2e_patch.py
          git diff --check
      - name: Validate sources
        run: |
          set -euxo pipefail
          node --check sim/simulator.mjs
          node --check tests/dual_phone_smoke.mjs
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core && /tmp/fc-core
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state-control && /tmp/state-control
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil && ASAN_OPTIONS=detect_leaks=1 /tmp/hil
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
      - name: Build browser pair
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' -o generated/flight_core.mjs
          BUILD_DIR=/tmp/arondight45-nonblocking; rm -rf "$BUILD_DIR"; mkdir -p "$BUILD_DIR"; cd "$BUILD_DIR"; npm init -y >/dev/null; npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"; cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/simulator.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-controller.bundle.mjs
          python3 -c 'from pathlib import Path; pairs=[("drone_simulator.html","<script type=\"module\" src=\"./sim/simulator.mjs\"></script>","/tmp/arondight45-simulator.bundle.mjs"),("drone_controller.html","<script type=\"module\" src=\"./sim/controller.mjs\"></script>","/tmp/arondight45-controller.bundle.mjs")]; [(lambda p,m,b: p.write_text(p.read_text().replace(m,"<script type=\"module\">\n"+Path(b).read_text().replace("</script","<\\/script")+"\n</script>")))(Path(h),m,b) for h,m,b in pairs]'
          rm -rf generated
      - name: Run complete browser tests
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME_BIN"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/arondight45-static.log 2>&1 & HTTP_PID=$!; trap 'kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules' EXIT; sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/dual_phone_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/browser_sim_smoke.mjs http://127.0.0.1:4174/drone_simulator.html
      - name: Promote exact green patch
        run: |
          set -euxo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git diff --check
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -m "Finalize nonblocking GAME control response"; git push origin HEAD:main
