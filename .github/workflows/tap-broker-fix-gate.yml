name: Tap broker rendezvous fix gate

on:
  push:
    branches: ["fix/tap-broker-rendezvous"]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[tap-broker-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/tap-broker-rendezvous

      - name: Patch broker fallback for gesture rooms
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lan = Path('sim/lan_vs.mjs')
          s = lan.read_text()
          old = '{name:"Broker",load:()=>import("./mqtt_data_relay.mjs"),trustedOnly:true},'
          new = '{name:"Broker",load:()=>import("./mqtt_data_relay.mjs")},'
          assert old in s, 'expected Broker trustedOnly gate not found'
          s = s.replace(old, new, 1)
          lan.write_text(s)

          relay = Path('sim/mqtt_data_relay.mjs')
          s = relay.read_text()
          old = 'export function joinRoom(config,roomId,callbacks={}){if(!String(roomId||"").startsWith("net-"))throw Error("MQTT data relay requires a trusted network/proximity room");return new RelayRoom(config,roomId,callbacks);}'
          new = 'export function joinRoom(config,roomId,callbacks={}){const id=String(roomId||"");if(!/^(?:net|tap)-/.test(id))throw Error("MQTT data relay requires an automatic network/proximity/gesture room");return new RelayRoom(config,id,callbacks);}'
          assert old in s, 'expected MQTT relay net-only gate not found'
          s = s.replace(old, new, 1)
          relay.write_text(s)

          smoke = Path('tests/mqtt_data_relay_browser_smoke.mjs')
          s = smoke.read_text()
          old = 'const roomId=`net-ci-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;'
          new = 'const roomId=`tap-ci-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;'
          assert old in s, 'expected broker browser smoke net room not found'
          s = s.replace(old, new, 1)
          smoke.write_text(s)
          PY

          grep -q '{name:"Broker",load:()=>import("./mqtt_data_relay.mjs")}' sim/lan_vs.mjs
          ! grep -q 'Broker",load:()=>import("./mqtt_data_relay.mjs"),trustedOnly:true' sim/lan_vs.mjs
          grep -q '/^(?:net|tap)-/' sim/mqtt_data_relay.mjs
          grep -q 'tap-ci-' tests/mqtt_data_relay_browser_smoke.mjs
          node --check sim/lan_vs.mjs
          node --check sim/mqtt_data_relay.mjs
          node --check tests/mqtt_data_relay_browser_smoke.mjs
          node tests/architecture_invariants.mjs
          node tests/lan_vs_smoke.mjs

      - name: Real public-broker two-browser tap fallback
        run: |
          set -euxo pipefail
          TMP=/tmp/tap-broker-node
          mkdir -p "$TMP"
          cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund mqtt@5.15.2 esbuild@0.25.8 puppeteer-core@24.16.0
          ln -s "$TMP/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          mkdir -p generated
          ./node_modules/.bin/esbuild sim/mqtt_data_relay.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=generated/mqtt_data_relay_probe.mjs
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/tap-broker-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules; rm -rf generated' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/mqtt_data_relay_browser_smoke.mjs http://127.0.0.1:4174

      - name: Commit validated fix to branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/lan_vs.mjs sim/mqtt_data_relay.mjs tests/mqtt_data_relay_browser_smoke.mjs
          git commit -m "Fix static broker fallback when network identity is unavailable [tap-broker-fixed]"
          git push origin HEAD:fix/tap-broker-rendezvous
