name: Verify live car touch and imagery once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-car-touch-imagery-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependency
        run: |
          set -euxo pipefail
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0
      - name: Verify real mobile steering and satellite startup
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/player_car_touch_browser_smoke.mjs https://kurzlernen.de/drone_simulator.html
          CHROME_BIN="$CHROME_BIN" node tests/world_imagery_default_browser_smoke.mjs https://kurzlernen.de/drone_simulator.html
