name: Diagnose car pose once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose_car_pose_once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic browser bundle
        run: |
          set -euo pipefail
          TMP=/tmp/car-diag
          rm -rf "$TMP" && mkdir -p "$TMP" && cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1 qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3 >/dev/null
          ln -s "$TMP/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/sim.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html'); h=p.read_text(); marker='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>'; assert marker in h
          b=Path('/tmp/sim.bundle.mjs').read_text().replace('</script','<\\/script');p.write_text(h.replace(marker,'<script type="module">'+b+'</script>'))
          PY
      - name: Inspect hardcoded smoke position and body quaternion
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome)"; export CHROME_BIN
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/http.log 2>&1 & HTTP_PID=$!; trap 'kill $HTTP_PID 2>/dev/null || true' EXIT; sleep 1
          cat > /tmp/car_diag.mjs <<'EOF'
          import puppeteer from '/tmp/car-diag/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader']});
          const page=await browser.newPage();await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1');await page.setViewport({width:844,height:390,deviceScaleFactor:1,hasTouch:true,isMobile:true});
          await page.goto('http://127.0.0.1:4174/drone_simulator.html',{waitUntil:'load',timeout:40000});await page.waitForFunction(()=>document.querySelector('#status')?.textContent?.includes('SIM ready')&&globalThis.__arondightWorldRigidBodies&&globalThis.__arondightVehicleDrive&&globalThis.__arondightWalkMode,{timeout:40000});
          if(await page.evaluate(()=>globalThis.__arondightWalkMode?.mode!=='foot'))await page.click('#playerModeButton');await page.waitForFunction(()=>globalThis.__arondightWalkMode?.mode==='foot',{timeout:8000});
          const result=await page.evaluate(async()=>{
            const scene=globalThis.__arondightRealWorld?.threeScene,p=globalThis.__arondightWorldRigidBodies,w=globalThis.__arondightWalkMode,d=globalThis.__arondightVehicleDrive,b=globalThis.__arondightRealWorld;const vehicles=[];scene.traverse(n=>{const k=String(n?.userData?.worldPopulationKind||''),id=String(n?.userData?.worldPopulationId||n?.userData?.worldProceduralId||'');if(n?.isGroup&&k==='car'&&id){const pose=p.pose(id);if(pose?.position)vehicles.push({id,root:n,pose});}});const c=vehicles.find(x=>x.root.visible!==false)||vehicles[0];if(!c)return{error:'no-car'};
            const pointIn=(x,y,pts)=>{let inside=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],q=pts[j];if((a[1]>y)!==(q[1]>y)&&x<(q[0]-a[0])*(y-a[1])/((q[1]-a[1])||1e-12)+a[0])inside=!inside;}return inside;};const blockers=(b?.buildingCollisionSnapshot?.prisms||[]).filter(pr=>pointIn(640,640,pr.points||[])).map(pr=>({key:pr.buildingKey,base:pr.base,top:pr.top,points:pr.points}));
            for(const x of vehicles)if(x!==c){x.root.userData.remotePlayerDriven='diag';p.clearTarget(x.id,{force:true});}
            p.clearTarget(c.id,{force:true});p.setPose(c.id,{position:[640,640,.42],yaw:0,velocity:[0,0,0],angularVelocity:[0,0,0]});w.setPose({x:640,y:640,yaw:0,pitch:0});const pre=p.pose(c.id);const entered=d.nearestVehicle(performance.now()+1000)?.id===c.id&&d.enterNearest();const afterEnter=p.pose(c.id);await new Promise(r=>setTimeout(r,180));const after180=p.pose(c.id);return{id:c.id,blockers,prismCount:b?.buildingCollisionSnapshot?.prisms?.length||0,entered,pre,afterEnter,after180,targetOwner:p.targetOwner?.(c.id)||'',rootQuat:[c.root.quaternion.x,c.root.quaternion.y,c.root.quaternion.z,c.root.quaternion.w]};
          });console.log(JSON.stringify(result,null,2));await browser.close();
          EOF
          node /tmp/car_diag.mjs
