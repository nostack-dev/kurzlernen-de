name: Repair component patch gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair component patch gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix BOM count gate and retrigger component patch
        run: |
          set -euxo pipefail
          sed -i 's/assert.equal(base.components.length,16)/assert.equal(base.components.length,17)/' .github/workflows/apply-component-derived-physics.yml
          grep -q 'base.components.length,17' .github/workflows/apply-component-derived-physics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-component-derived-physics.yml
          git commit -m 'Apply component-derived physics'
          git push origin HEAD:main
