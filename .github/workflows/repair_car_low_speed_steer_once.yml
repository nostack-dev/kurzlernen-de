name: Repair low speed car steering once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_car_low_speed_steer_once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen physical low-speed steering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/world_rigid_body_physics.mjs')
          s=p.read_text()
          old='Math.sign(driveSpeed)*Math.max(Math.abs(driveSpeed),1.05)'
          new='Math.sign(driveSpeed)*Math.max(Math.abs(driveSpeed),1.25)'
          assert s.count(old)==1, f'low-speed steering floor occurrences={s.count(old)}'
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/world_rigid_body_physics.mjs
          grep -q 'Math.max(Math.abs(driveSpeed),1.25)' sim/world_rigid_body_physics.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/world_rigid_body_physics.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Strengthen low-speed physical car steering'
          git push origin HEAD:main