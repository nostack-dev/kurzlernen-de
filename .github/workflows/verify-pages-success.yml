name: Verify Pages deploy success

on:
  workflow_run:
    workflows: ["Deploy static site"]
    types: [completed]

permissions:
  issues: write

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record Pages deploy conclusion
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const conclusion = String(run.conclusion || 'unknown').toUpperCase();
            const title = `PAGES_DEPLOY_${conclusion} ${sha}`;
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            if (existing.data.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Deploy static site completed with conclusion ${run.conclusion} for ${sha}. Workflow run: ${run.id}`
            });
