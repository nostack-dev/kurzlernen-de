name: vs-gps-origin-live
on:
  push:
    branches: ["fix/vs-gps-optional-origin"]
    paths: [".github/workflows/vs-gps-origin-live.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production transport browser harness
        run: |
          set -euxo pipefail
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund esbuild@0.25.8 puppeteer-core@24.16.0 trystero@0.25.1
          cat > .vs-origin-entry.mjs <<'EOF'
          import {LanVsSession,sameNetworkRoomKey} from './sim/lan_vs.mjs';
          const q=new URL(location.href).searchParams,role=q.get('role'),run=q.get('run');
          globalThis.live={peer:null,origin:null,pose:null,error:null,room:null};
          try{
            const room=`${await sameNetworkRoomKey()}-gps-ci-${run}`;live.room=room;
            const session=new LanVsSession({
              onPeer:id=>{live.peer=id;if(role==='gps')session.setOrigin({lon:9.17,lat:47.66,alt:411});},
              onOrigin:o=>live.origin=o,
              onPose:p=>live.pose=p,
              onError:e=>live.error=String(e?.message||e)
            });
            live.session=session;live.send=p=>session.setPose(p);await session.start(room);
          }catch(e){live.error=String(e?.message||e)}
          EOF
          ./node_modules/.bin/esbuild .vs-origin-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=vs-origin.js
          printf '%s\n' '<!doctype html><script type="module" src="/vs-origin.js"></script>' > vs-origin.html
      - name: Verify one GPS peer and one GPS-less peer live
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euxo pipefail
          cat > .vs-origin-test.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const chrome=process.env.CHROME_BIN||'/usr/bin/google-chrome',run=encodeURIComponent(process.env.RUN_KEY);
          const launch=()=>puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-setuid-sandbox']});
          const a=await launch(),b=await launch(),pa=await a.newPage(),pb=await b.newPage();
          const base='http://127.0.0.1:4176/vs-origin.html';
          const wait=(p,fn,t=45000)=>p.waitForFunction(fn,{timeout:t});
          try{
            await Promise.all([pa.goto(`${base}?role=gps&run=${run}`),pb.goto(`${base}?role=nogps&run=${run}`)]);
            await Promise.all([wait(pa,()=>!!live.peer),wait(pb,()=>!!live.peer)]);
            await wait(pb,()=>live.origin?.lon===9.17&&live.origin?.lat===47.66,15000);
            const noGpsOrigin=await pb.evaluate(()=>live.origin);
            const gpsReceived=await pa.evaluate(()=>live.origin);
            if(gpsReceived!==null)throw new Error(`GPS-less peer invented origin: ${JSON.stringify(gpsReceived)}`);
            await pa.evaluate(()=>live.send({p:[1,2,3],q:[0,0,0,1],g:[9.1701,47.6601]}));
            await pb.evaluate(()=>live.send({p:[4,5,6],q:[0,0,0,1]}));
            await Promise.all([wait(pa,()=>live.pose?.p?.[0]===4,15000),wait(pb,()=>live.pose?.p?.[0]===1,15000)]);
            console.log('LIVE VS GPS-optional origin PASS',JSON.stringify({sharedOrigin:noGpsOrigin,aRx:await pa.evaluate(()=>live.pose),bRx:await pb.evaluate(()=>live.pose)}));
          }finally{await Promise.allSettled([a.close(),b.close()]);}
          EOF
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/vs-origin-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT; sleep 1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node .vs-origin-test.mjs
