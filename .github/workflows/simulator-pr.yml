name: Simulator PR gates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Install simulator dependencies
        run: |
          npm install --prefix /tmp/simulator-deps --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1 qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3
          ln -s /tmp/simulator-deps/node_modules node_modules
      - name: Run deployment-equivalent deterministic gates
        run: python3 tools/validate-simulator.py
      - name: Verify mobile multiplayer marker safe areas
        run: node tests/mobile_peer_marker_layout_test.mjs
      - name: Verify mobile edge-only voice layout
        run: node tests/mobile_voice_layout_test.mjs
      - name: Verify RMB held + LMB shoots in Chromium
        timeout-minutes: 4
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/mouse-chord-pr.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/desktop_mouse_chord_harness_smoke.mjs http://127.0.0.1:4176
      - name: Verify desktop weapon STOP and EMP controls with real keyboard input
        timeout-minutes: 3
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_BIN="$CHROME_BIN" node tests/desktop_controls_live_smoke.mjs https://kurzlernen.de/drone_simulator.html
      - name: F jet boarding and thumb-zone regression tests
        run: |
          set -euo pipefail
          node tests/jet_f_interact_test.mjs
          node tests/mobile_vehicle_entry_layout_test.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Verify simulator live-smoke assertion invariants
        run: node tests/ci_smoke_contract_test.mjs
      - name: Verify current live terrain, renderer and update notice
        run: CHROME_BIN="$(command -v google-chrome || command -v chromium)" node tests/simulator_live_regression_smoke.mjs
