name: Verify live car steering once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-car-steering-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed simulator and physical mobile steering
        run: |
          set -euxo pipefail
          LIVE='https://kurzlernen.de/drone_simulator.html'
          curl -fsSL "$LIVE?verify=$GITHUB_SHA" | grep -q 'ARONDIGHT45_BUILD_SHA:'
          npm ci --ignore-scripts
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/player_car_touch_browser_smoke.mjs "$LIVE?physical-steering=1"
