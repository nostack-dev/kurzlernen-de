name: Verify live car steering once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-car-steering-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify inverted deployed mobile steering
        run: |
          set -euxo pipefail
          LIVE='https://kurzlernen.de/drone_simulator.html'
          curl -fsSL "$LIVE?verify=inverted-steer-$GITHUB_SHA" -o /tmp/live-simulator.html
          grep -q 'ARONDIGHT45_BUILD_SHA:' /tmp/live-simulator.html
          BUILD_DIR=/tmp/car-smoke-node
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/player_car_touch_browser_smoke.mjs "$LIVE?physical-steering=inverted"
