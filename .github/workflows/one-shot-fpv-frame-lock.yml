name: one-shot WORLD FPV frame lock

on:
  push:
    branches: ["fix/world-fpv-frame-lock"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-frame-lock
          fetch-depth: 0
      - name: Patch WORLD FPV camera sync
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p=Path(path); s=p.read_text(); n=s.count(old)
              assert n==1, f"{label}: expected one occurrence, got {n}"
              p.write_text(s.replace(old,new,1))

          p=Path('sim/real_world_bootstrap.mjs')
          s=p.read_text()
          old='if(!forceMode&&now-this.lastMapSyncMs<this.mapFrameMs)return;'
          new='const fpvFrameLocked=cameraMode==="fpv";if(!forceMode&&!fpvFrameLocked&&now-this.lastMapSyncMs<this.mapFrameMs)return;'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='if(last&&!forceMode){const latM='
          new='if(last&&!forceMode&&!fpvFrameLocked){const latM='
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='viewport.dataset.worldCameraMode=cameraMode;viewport.dataset.worldMapCenter='
          new='viewport.dataset.worldCameraMode=cameraMode;viewport.dataset.worldMapSyncMode=fpvFrameLocked?"frame-locked":"budgeted";viewport.dataset.worldMapCenter='
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='delete viewport.dataset.worldMapBearing;delete viewport.dataset.worldThreeFrames;'
          assert s.count(old)==2
          s=s.replace(old,'delete viewport.dataset.worldMapBearing;delete viewport.dataset.worldMapSyncMode;delete viewport.dataset.worldThreeFrames;')
          p.write_text(s)

          p=Path('tests/real_world_ui_smoke.mjs')
          s=p.read_text()
          anchor='if(!bootstrapSource.includes("WORLD_MAP_FRAME_MS=1000/30")||!bootstrapSource.includes("pixelRatio:Math.min(devicePixelRatio||1,WORLD_MAP_PIXEL_RATIO)")||!bootstrapSource.includes("setSky({\\"sky-color\\":\\"#0a2845\\""))throw new Error("WORLD mobile render/contrast budget missing");\n'
          extra='if(!bootstrapSource.includes(\'const fpvFrameLocked=cameraMode==="fpv"\')||!bootstrapSource.includes(\'!forceMode&&!fpvFrameLocked&&now-this.lastMapSyncMs<this.mapFrameMs\')||!bootstrapSource.includes(\'last&&!forceMode&&!fpvFrameLocked\'))throw new Error("WORLD FPV must frame-lock map camera sync while FOLLOW/THIRD remain budgeted");\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+extra,1)
          anchor='''  const fpv=await cameraSnapshot();\n  if(fpv.mode!=="fpv"||fpv.worldCameraMode!=="fpv")throw new Error(`FPV camera mode did not propagate to WORLD: ${JSON.stringify(fpv)}`);\n  if(fpv.center===third.center&&fpv.zoom===third.zoom&&fpv.pitch===third.pitch&&fpv.bearing===third.bearing)throw new Error(`FPV geospatial camera stayed frozen: ${JSON.stringify({third,fpv})}`);\n'''
          insert='''  const fpv=await cameraSnapshot();\n  if(fpv.mode!=="fpv"||fpv.worldCameraMode!=="fpv")throw new Error(`FPV camera mode did not propagate to WORLD: ${JSON.stringify(fpv)}`);\n  if(fpv.center===third.center&&fpv.zoom===third.zoom&&fpv.pitch===third.pitch&&fpv.bearing===third.bearing)throw new Error(`FPV geospatial camera stayed frozen: ${JSON.stringify({third,fpv})}`);\n  const fpvSyncStart=await page.$eval("#viewport",e=>({frames:Number(e.dataset.worldThreeFrames||0),updates:Number(e.dataset.worldMapUpdates||0),mode:e.dataset.worldMapSyncMode||""}));\n  if(fpvSyncStart.mode!=="frame-locked")throw new Error(`FPV WORLD sync is not frame-locked: ${JSON.stringify(fpvSyncStart)}`);\n  await page.waitForFunction(start=>Number(document.querySelector("#viewport")?.dataset.worldThreeFrames||0)>start+6,{timeout:5000},fpvSyncStart.frames);\n  const fpvSyncEnd=await page.$eval("#viewport",e=>({frames:Number(e.dataset.worldThreeFrames||0),updates:Number(e.dataset.worldMapUpdates||0),mode:e.dataset.worldMapSyncMode||""}));\n  const fpvFrameDelta=fpvSyncEnd.frames-fpvSyncStart.frames,fpvMapDelta=fpvSyncEnd.updates-fpvSyncStart.updates;\n  if(fpvSyncEnd.mode!=="frame-locked"||fpvFrameDelta<6||fpvMapDelta<fpvFrameDelta-1)throw new Error(`FPV WORLD camera is not synchronized to visible flight frames: ${JSON.stringify({fpvSyncStart,fpvSyncEnd,fpvFrameDelta,fpvMapDelta})}`);\n'''
          assert s.count(anchor)==1
          s=s.replace(anchor,insert,1)
          old='adaptive 15/20/30Hz map budget, live camera sync, clean fallback.'
          new='adaptive 15/20/30Hz FOLLOW/THIRD map budget, frame-locked FPV camera sync, clean fallback.'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s)

          Path('.github/workflows/one-shot-fpv-frame-lock.yml').unlink()
          PY
          node --check sim/real_world_bootstrap.mjs
          node --check tests/real_world_ui_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Frame-lock WORLD FPV camera sync"
          git push origin HEAD:fix/world-fpv-frame-lock
