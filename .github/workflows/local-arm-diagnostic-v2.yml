name: Exact local ARM fallback diagnostic
on:
  push:
    paths:
      - '.github/workflows/local-arm-diagnostic-v2.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Diagnose exact no-GPS local fallback arm
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          TMP=/tmp/arondight45-local-arm-v2
          rm -rf "$TMP"; mkdir -p "$TMP"; cd "$TMP"; npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$TMP/node_modules" "$GITHUB_WORKSPACE/node_modules"; cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/sim.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html'); h=p.read_text(); m='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>'
          b=Path('/tmp/sim.bundle.mjs').read_text().replace('</script','<\\/script'); assert m in h
          p.write_text(h.replace(m,'<script type="module">\n'+b+'\n</script>'))
          PY
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          HTTP=$!; trap 'kill $HTTP 2>/dev/null || true' EXIT; sleep 1
          cat >tests/.local-arm-v2.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const chrome=process.env.CHROME_BIN,errors=[];
          const browser=await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader']});
          const page=await browser.newPage();
          page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
          await page.evaluateOnNewDocument(()=>{Object.defineProperty(navigator,'geolocation',{configurable:true,value:{getCurrentPosition(_s,e){queueMicrotask(()=>e?.({code:1,message:'CI geolocation denied'}));}}});});
          await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4174/drone_simulator.html',{waitUntil:'load',timeout:30000});
          await page.waitForFunction(()=>document.querySelector('#status')?.textContent.includes('SIM ready'),{timeout:30000});
          await page.waitForFunction(()=>document.body.classList.contains('solo-flight'),{timeout:5000});
          await page.click('#soloExit'); await page.waitForFunction(()=>!document.body.classList.contains('solo-flight'),{timeout:5000});
          await page.click('#reset'); await page.select('#inputSource','local'); await page.$eval('#inputSource',e=>e.dispatchEvent(new Event('change',{bubbles:true}))); await page.click('#run');
          const sim=()=>page.evaluate(()=>Number(globalThis.__arondightDiagnostics?.simTime||0));
          const waitSim=async target=>{const until=Date.now()+45000;while(Date.now()<until){if(await sim()>=target)return;await new Promise(r=>setTimeout(r,20));}throw Error(`sim timeout ${await sim()} < ${target}`)};
          const snap=()=>page.evaluate(()=>({sim:Number(globalThis.__arondightDiagnostics?.simTime||0),fc:Number(globalThis.__arondightDiagnostics?.fcState||0),state:document.querySelector('#fcState')?.textContent||'',armSwitch:document.querySelector('#armSwitch')?.textContent||'',armButton:document.querySelector('#touchArm')?.textContent||'',input:document.querySelector('#inputSource')?.value||'',focus:document.activeElement?.id||document.activeElement?.tagName||'',run:document.querySelector('#run')?.textContent||'',motors:document.querySelector('#motors')?.textContent||'',throttle:document.querySelector('#throttle')?.textContent||'',roll:document.querySelector('#touchRoll')?.value,pitch:document.querySelector('#touchPitch')?.value,yaw:document.querySelector('#touchYaw')?.value,touchThrottle:document.querySelector('#touchThrottle')?.value}));
          await waitSim(2.2); const before=await snap(); const start=await sim();
          await page.keyboard.press('Space'); const afterSpace=await snap(); await waitSim(start+1.25); const keyboardResult=await snap();
          if(keyboardResult.armButton.includes('ON')){await page.click('#touchArm');const t=await sim();await waitSim(t+.15);}
          const preClick=await snap(); await page.click('#touchArm'); const clickStart=await sim(); const afterClick=await snap(); await waitSim(clickStart+1.25); const clickResult=await snap();
          console.log('LOCAL_ARM_V2 '+JSON.stringify({before,afterSpace,keyboardResult,preClick,afterClick,clickResult,errors}));
          await browser.close();
          if(keyboardResult.state!=='ARMED'||clickResult.state!=='ARMED')process.exit(2);
          JS
          CHROME_BIN="$(command -v google-chrome)" node tests/.local-arm-v2.mjs
      - name: Cleanup diagnostic scaffolding
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git checkout -- drone_simulator.html 2>/dev/null || true
          rm -rf generated node_modules tests/.local-arm-v2.mjs
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/local-arm-diagnostic-v2.yml
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Remove exact local ARM diagnostic'; git push origin HEAD:main; fi
