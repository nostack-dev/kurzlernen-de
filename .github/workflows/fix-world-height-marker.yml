name: Fix WORLD height marker

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == 'FIX_WORLD_HEIGHT_MARKER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add truthful OSM height-field diagnostic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/real_world_bootstrap.mjs')
          s=p.read_text()
          if 'worldBuildingHeightFields' not in s:
              old='this.buildingSourceId=sourceId;this.buildingCollisionDirty=true;const existing=this.map.getLayer("arondight45-buildings-3d");'
              new='this.buildingSourceId=sourceId;this.buildingCollisionDirty=true;const viewport=$("viewport");if(viewport)viewport.dataset.worldBuildingHeightFields="render_height,render_min_height";const existing=this.map.getLayer("arondight45-buildings-3d");'
              if old not in s: raise SystemExit('addBuildings anchor missing')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          node --check sim/real_world_bootstrap.mjs
          grep -q 'render_height' sim/real_world_bootstrap.mjs
          grep -q 'render_min_height' sim/real_world_bootstrap.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/real_world_bootstrap.mjs
          git commit -m 'Expose OSM building height fields in WORLD diagnostics'
          git push origin HEAD:main
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "WORLD_HEIGHT_MARKER_OK $PATCH_SHA"
