name: Repair landscape gate test once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_landscape_gate_test_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make portrait gate test semantic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/solo_layout_smoke.mjs')
          s=p.read_text()
          old='||!portraitGate.ownsCenter||!portraitGate.text.includes("QUERFORMAT"))'
          new='||!portraitGate.ownsCenter||!/(LANDSCAPE|QUERFORMAT)/i.test(portraitGate.text))'
          assert old in s, 'portrait gate assertion changed'
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/solo_layout_smoke.mjs
          grep -q 'LANDSCAPE|QUERFORMAT' tests/solo_layout_smoke.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/solo_layout_smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Make landscape gate smoke semantic'
          git push origin HEAD:main