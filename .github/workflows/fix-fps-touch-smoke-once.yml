name: Fix FPS touch smoke once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-fps-touch-smoke-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix active touch pointer semantics
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/fps_first_person_browser_smoke.mjs')
          s=p.read_text()
          old='down=new PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",clientX:r.left+r.width/2,clientY:r.top+r.height/2}),move=new PointerEvent("pointermove",{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",clientX:r.right-2,clientY:r.top+r.height/2})'
          new='down=new PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",button:0,buttons:1,clientX:r.left+r.width/2,clientY:r.top+r.height/2}),move=new PointerEvent("pointermove",{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",button:0,buttons:1,clientX:r.right-2,clientY:r.top+r.height/2})'
          assert old in s and new not in s
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/fps_first_person_browser_smoke.mjs
          grep -q 'pointerType:"touch",button:0,buttons:1' tests/fps_first_person_browser_smoke.mjs
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fps_first_person_browser_smoke.mjs
          git commit -m 'Use active touch semantics in FPS browser smoke'
          git push origin HEAD:main
