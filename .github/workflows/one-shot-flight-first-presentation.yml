name: One-shot flight-first presentation patch

on:
  push:
    branches: [perf/flight-first-presentation]
    paths:
      - ".github/workflows/one-shot-flight-first-presentation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply flight-first presentation budget
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tools/flight_first_patch.py")
          s=p.read_text()
          old="""anchor = '''requireText(\"sim/simulator.mjs\",\"physics.p.imuValid\");
          forbidText(\"sim/simulator.mjs\",\"(sequence&7)===0\", \"simulator fixed-step cadence must not be display-Hz divided\");
          '''"""
          new="""anchor = '''requireText(\"sim/simulator.mjs\",\"physics.p.imuValid\");
          '''"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          duplicate="""requireText(\"sim/simulator.mjs\",\"viewport.dataset.presentationDraws\");
          forbidText(\"sim/simulator.mjs\",\"(sequence&7)===0\", \"simulator fixed-step cadence must not be display-Hz divided\");
          const presentationStart"""
          replacement="""requireText(\"sim/simulator.mjs\",\"viewport.dataset.presentationDraws\");
          const presentationStart"""
          assert s.count(duplicate)==1, s.count(duplicate)
          s=s.replace(duplicate,replacement,1)
          boundary_start=s.index('const presentationStart=simulatorSource.indexOf("function render(){")')
          boundary_end=s.index("'''",boundary_start)
          s=s[:boundary_start]+s[boundary_end:]
          old_doc='p.write_text(doc + note + "\\n")'
          new_doc='p.write_text(doc + note.rstrip() + "\\n")'
          assert s.count(old_doc)==1, s.count(old_doc)
          s=s.replace(old_doc,new_doc,1)
          p.write_text(s)
          PY
          python3 tools/flight_first_patch.py
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Prioritize exact 1kHz twin over presentation load"
          git push origin HEAD:perf/flight-first-presentation
