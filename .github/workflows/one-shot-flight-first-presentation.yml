name: One-shot flight-first presentation patch

on:
  push:
    branches: [perf/flight-first-presentation]
    paths:
      - ".github/workflows/one-shot-flight-first-presentation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply flight-first presentation budget
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/flight_first_patch.py
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Prioritize exact 1kHz twin over presentation load"
          git push origin HEAD:perf/flight-first-presentation
