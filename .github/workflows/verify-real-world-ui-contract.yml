name: Verify real WORLD UI contract

on:
  push:
    branches: ["verify/real-world-ui-contract"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser build dependencies
        run: |
          set -euxo pipefail
          BUILD_DIR=/tmp/arondight-world-ui
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1 \
            qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Build exact shared WASM core
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
      - name: Patch stale fixture and run exact WORLD UI gate
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke.mjs')
          s=p.read_text()
          old='''  if(["data:","blob:","about:"].includes(parsed.protocol)||["127.0.0.1","localhost"].includes(parsed.hostname)){request.continue();return;}\n  external.push(url);\n  if(url.startsWith(OPENFREEMAP_STYLE)){providerRequests.push(url);request.respond({status:200,contentType:"application/json",headers:{"access-control-allow-origin":"*","cache-control":"no-store"},body:JSON.stringify(fixtureStyle)});return;}\n  if(url.startsWith(WORLD_IMAGERY_PREFIX)){imageryRequests.push(url);request.respond({status:200,contentType:"image/png",headers:{"access-control-allow-origin":"*","cache-control":"public,max-age=3600"},body:fixtureTile});return;}\n  request.abort();'''
          new='''  if(["data:","blob:","about:"].includes(parsed.protocol)||["127.0.0.1","localhost"].includes(parsed.hostname)){request.continue();return;}\n  external.push(url);\n  if(url.startsWith(OPENFREEMAP_STYLE)){providerRequests.push(url);request.continue();return;}\n  if(["tiles.openfreemap.org","tiles.mapterhorn.com"].includes(parsed.hostname)){request.continue();return;}\n  if(url.startsWith(WORLD_IMAGERY_PREFIX)){imageryRequests.push(url);request.respond({status:200,contentType:"image/png",headers:{"access-control-allow-origin":"*","cache-control":"public,max-age=3600"},body:fixtureTile});return;}\n  request.abort();'''
          assert old in s
          s=s.replace(old,new,1)
          old='const waitWorld=()=>page.waitForFunction(()=>{const v=document.querySelector("#viewport");return v?.dataset.worldMode==="real"&&v?.dataset.worldProvider==="openfreemap-esri-imagery"&&v?.dataset.worldImageryLayer==="ready"&&Number(v?.dataset.worldMinimapImageryTiles||0)>0&&Number(v?.dataset.worldThreeFrames||0)>4;},{timeout:20000});'
          new='const waitWorld=()=>page.waitForFunction(()=>{const v=document.querySelector("#viewport"),b=globalThis.__arondightRealWorld;return v?.dataset.worldMode==="real"&&v?.dataset.worldProvider==="openfreemap-esri-imagery"&&v?.dataset.worldImageryLayer==="ready"&&v?.dataset.worldTerrainStatus==="box3d-active"&&v?.dataset.worldBuildingCollisionStatus==="box3d-active"&&Number(v?.dataset.worldMinimapImageryTiles||0)>0&&Number(v?.dataset.worldTerrainTriangles||0)>=4000&&Number(v?.dataset.worldThreeFrames||0)>=1&&Number(v?.dataset.presentationDraws||0)>=10&&b?.map&&b?.threeRenderer;},{timeout:30000});'
          assert old in s
          s=s.replace(old,new,1)
          assert 'const externalAfterAutoWorld=external.length;' in s
          s=s.replace('const externalAfterAutoWorld=external.length;','const providerRequestsAfterAutoWorld=providerRequests.length;',1)
          old='const unexpectedSettingsNetwork=external.slice(externalAfterAutoWorld).filter(url=>!url.startsWith(WORLD_IMAGERY_PREFIX));if(unexpectedSettingsNetwork.length)throw new Error(`settings path triggered unexpected external network: ${JSON.stringify(unexpectedSettingsNetwork)}`);'
          new='if(providerRequests.length!==providerRequestsAfterAutoWorld)throw new Error(`settings path reloaded the WORLD style: ${providerRequestsAfterAutoWorld} -> ${providerRequests.length}`);'
          assert old in s
          s=s.replace(old,new,1)
          old='const low=run(5),high=run(50);c.position.copy(saved.p);c.quaternion.copy(saved.q);c.up.copy(saved.u);v.dataset.cameraMode=saved.mode;b.lastMapSyncMs=-Infinity;return{low,high};'
          new='const low=run(5),high=run(50);c.position.copy(saved.p);c.quaternion.copy(saved.q);c.up.copy(saved.u);v.dataset.cameraMode=saved.mode;b.lastMapSyncMs=-Infinity;return{low,high,origin:Number(b.terrainOriginElevationM)};'
          assert old in s
          s=s.replace(old,new,1)
          old='if(Math.abs(eyeHeights.low.eye-5)>.01||Math.abs(eyeHeights.high.eye-50)>.01||eyeHeights.low.sync!=="rigid-eye-target"||eyeHeights.high.sync!=="rigid-eye-target"||eyeHeights.high.eye-eyeHeights.low.eye<44.9)throw new Error(`FPV eye altitude not preserved: ${JSON.stringify(eyeHeights)}`);'
          new='if(!Number.isFinite(eyeHeights.origin)||Math.abs(eyeHeights.low.eye-(eyeHeights.origin+5))>.01||Math.abs(eyeHeights.high.eye-(eyeHeights.origin+50))>.01||eyeHeights.low.sync!=="rigid-eye-target"||eyeHeights.high.sync!=="rigid-eye-target"||eyeHeights.high.eye-eyeHeights.low.eye<44.9)throw new Error(`FPV MSL eye altitude not preserved: ${JSON.stringify(eyeHeights)}`);'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check tests/real_world_ui_smoke.mjs
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight-world-ui.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html');html=p.read_text();marker='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>';assert marker in html
          bundle=Path('/tmp/arondight-world-ui.bundle.mjs').read_text().replace('</script','<\\/script')
          p.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/world-ui-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/real_world_ui_smoke.mjs http://127.0.0.1:4174
