          fpv_test='''\n  const fpvLookBefore=await page.$eval("#viewport",e=>Number(e.dataset.worldLookYaw||0));const fpvBox=await page.$eval("#worldLookHud",element=>{const r=element.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height};});await page.mouse.move(fpvBox.x+fpvBox.w/2,fpvBox.y+fpvBox.h/2);await page.mouse.down();await page.mouse.move(fpvBox.x+fpvBox.w*.82,fpvBox.y+fpvBox.h*.35,{steps:4});await page.mouse.up();await new Promise(resolve=>setTimeout(resolve,180));const fpvLookAfter=await page.$eval("#viewport",e=>Number(e.dataset.worldLookYaw||0));if(Math.abs(fpvLookAfter-fpvLookBefore)>.1)throw new Error(`FPV was virtually panned by WORLD look: ${JSON.stringify({fpvLookBefore,fpvLookAfter})}`);'''
          assert s.count(fpv_anchor)==1;s=s.replace(fpv_anchor,fpv_anchor+fpv_test,1)
          s=s.replace('SNAP/KEEP 360 look HUD','cached MINI 3D + SNAP/KEEP 360 look, rigid FPV',1)
          p.write_text(s)

          p=Path('REAL_WORLD_DIGITAL_TWIN.md');doc=p.read_text().rstrip()+'''\n\n### Mini 3D map and rigid FPV\n\nThe top-right WORLD control is a lightweight **MINI 3D** map built from the already loaded MapLibre/OpenMapTiles vector features. It reuses cached rendered water, vegetation, road and building geometry at a throttled cadence and draws it into one small 2D canvas; it creates **no second MapLibre instance, WebGL renderer, tile stream or network request**. **MINIMAP FOLLOWS 360° CAMERA** defaults ON; OFF keeps the mini-map north-up. Query/draw cadence is reduced further by the existing critical FPS governor.\n\nFree 360° look applies only to FOLLOW/THIRD presentation cameras. **FPV remains rigidly mounted to the simulated airframe**, matching the physical camera contract; WORLD cannot virtually yaw/pitch FPV. Camera-only look is restored after each render and never reaches controller, sensor or plant state.\n''';p.write_text(doc)

