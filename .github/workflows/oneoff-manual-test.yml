name: One-off MANUAL semantics test correction

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tools/oneoff_manual_semantics_test_patch.py
      - run: |
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git rm .github/workflows/oneoff-manual-test.yml tools/oneoff_manual_semantics_test_patch.py
          git add tests/drone_fc_core_test.cpp
          git commit -m "Test exact preserved MANUAL attitude semantics"
          git push origin HEAD:main
