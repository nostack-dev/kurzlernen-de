name: ESP32-S31 flight stack

on:
  push:
    branches: [main]
    paths:
      - "esp32/Arondight45_DroneFC_Core.hpp"
      - "esp32/Arondight45_HIL_Protocol.hpp"
      - "esp32/Arondight45_DroneFC_S31.cpp"
      - "esp32/Arondight45_DroneFC_HIL_S31.cpp"
      - "sim/**"
      - "tests/**"
      - "tools/s31_hil_bridge.mjs"
      - "drone_simulator.html"
      - "drone_controller.html"
      - ".github/workflows/s31-hil.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared runtime and protocol tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core-tests
          /tmp/fc-core-tests
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil-tests
          ASAN_OPTIONS=detect_leaks=1 /tmp/hil-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil-host-tests
          /tmp/sil-host-tests
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core-clang
          /tmp/fc-core-clang
          node tests/control_semantics_test.mjs
      - name: Architecture and JavaScript validation
        run: |
          set -euxo pipefail
          node --check sim/simulator.mjs
          node --check sim/controller.mjs
          node --check sim/p2p_link.mjs
          node --check sim/control_semantics.mjs
          node --check sim/control_settings.mjs
          node --check tests/control_semantics_test.mjs
          node --check tests/sil_wasm_smoke.mjs
          node --check tests/browser_sim_smoke.mjs
          node --check tests/dual_phone_smoke.mjs
          node --check tools/s31_hil_bridge.mjs
          ! grep -R --line-number -E '#[[:space:]]*include[[:space:]]+["<][^">]*\.cpp[">]' esp32 sim
          ! grep -R --line-number -E '#[[:space:]]*define[[:space:]]+main' esp32 sim
          grep -q 'Arondight45_DroneFC_Core.hpp' esp32/Arondight45_DroneFC_S31.cpp
          grep -q 'Arondight45_DroneFC_Core.hpp' esp32/Arondight45_HIL_Protocol.hpp
          grep -q 'Arondight45_HIL_Protocol.hpp' esp32/Arondight45_DroneFC_HIL_S31.cpp
          grep -q 'Arondight45_HIL_Protocol.hpp' sim/Arondight45_DroneFC_SIL_WASM.cpp
          grep -q 'uart_set_line_inverse' esp32/Arondight45_DroneFC_S31.cpp
          grep -q 'kIntSource' esp32/Arondight45_DroneFC_S31.cpp
          grep -q 'esp_task_wdt' esp32/Arondight45_DroneFC_S31.cpp
          grep -q 'fc::Runtime runtime' esp32/Arondight45_DroneFC_S31.cpp
          grep -q 'hil::RuntimeAdapter runtime' esp32/Arondight45_DroneFC_HIL_S31.cpp
          grep -q 'usb_serial_jtag' esp32/Arondight45_DroneFC_HIL_S31.cpp
          grep -q 'src="./sim/simulator.mjs"' drone_simulator.html
          grep -q 'src="./sim/controller.mjs"' drone_controller.html
          grep -q 'new ViewPeerLink()' sim/simulator.mjs
          grep -q 'ControllerPeerLink' sim/controller.mjs
          grep -q 'control_semantics.mjs' sim/simulator.mjs sim/controller.mjs
          grep -q 'arondight45PhoneControlSettingsV3' sim/control_settings.mjs tests/browser_sim_smoke.mjs
          grep -q 'MIN_PHONE_GAIN=0.25' sim/control_semantics.mjs
          grep -q 'FPV_CAMERA_UPTILT_DEG=30' sim/simulator.mjs
          grep -Fq 'shape(centered(r.ch[FC_SBUS_ROLL]), 0.0f, 0.3f)' esp32/Arondight45_DroneFC_Core.hpp
          grep -Fq 'shape(centered(r.ch[FC_SBUS_YAW]), 0.0f, 0.2f)' esp32/Arondight45_DroneFC_Core.hpp
          grep -q 'new RTCPeerConnection' sim/p2p_link.mjs
          grep -q 'iceServers:\[\]' sim/p2p_link.mjs
          grep -q 'CONTROL_STALE_MS = 350' sim/p2p_link.mjs
          ! grep -q 'WebSocket' sim/controller.mjs
          ! grep -q 'WebSocket' sim/p2p_link.mjs
          ! grep -q '/control"' sim/simulator.mjs sim/controller.mjs sim/p2p_link.mjs
          ! grep -q "/control'" sim/simulator.mjs sim/controller.mjs sim/p2p_link.mjs

  esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf@sha256:68085df693b34bacfd69984ae05bb1e3b475ea3d4684943cfeed5a39954850e7
    steps:
      - uses: actions/checkout@v4
      - name: Activate ESP-IDF
        shell: bash
        run: |
          set -euxo pipefail
          . "$IDF_PATH/export.sh"
          python "$IDF_PATH/tools/idf.py" --version
      - name: Build production firmware for ESP32-S31
        shell: bash
        run: |
          set -euxo pipefail
          . "$IDF_PATH/export.sh"
          rm -rf /tmp/arondight45-production
          mkdir -p /tmp/arondight45-production/main
          cp esp32/Arondight45_DroneFC_Core.hpp /tmp/arondight45-production/main/
          cp esp32/Arondight45_DroneFC_S31.cpp /tmp/arondight45-production/main/
          cat > /tmp/arondight45-production/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(arondight45_s31_production)
          EOF
          cat > /tmp/arondight45-production/main/CMakeLists.txt <<'EOF'
          idf_component_register(SRCS "Arondight45_DroneFC_S31.cpp" INCLUDE_DIRS ".")
          EOF
          cd /tmp/arondight45-production
          python "$IDF_PATH/tools/idf.py" --preview set-target esp32s31
          python "$IDF_PATH/tools/idf.py" --preview build
      - name: Build functional HIL firmware for ESP32-S31
        shell: bash
        run: |
          set -euxo pipefail
          . "$IDF_PATH/export.sh"
          rm -rf /tmp/arondight45-hil
          mkdir -p /tmp/arondight45-hil/main
          cp esp32/Arondight45_DroneFC_Core.hpp /tmp/arondight45-hil/main/
          cp esp32/Arondight45_HIL_Protocol.hpp /tmp/arondight45-hil/main/
          cp esp32/Arondight45_DroneFC_HIL_S31.cpp /tmp/arondight45-hil/main/
          cat > /tmp/arondight45-hil/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(arondight45_s31_hil)
          EOF
          cat > /tmp/arondight45-hil/main/CMakeLists.txt <<'EOF'
          idf_component_register(SRCS "Arondight45_DroneFC_HIL_S31.cpp" INCLUDE_DIRS ".")
          EOF
          cd /tmp/arondight45-hil
          python "$IDF_PATH/tools/idf.py" --preview set-target esp32s31
          python "$IDF_PATH/tools/idf.py" --preview build
