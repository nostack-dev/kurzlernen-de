name: ESP32-S31 flight stack

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/s31-hil.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  finalize-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Report finalizer start
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/${GH_REPO}/issues/54/comments" -f body="S31 FINALIZER START · run=${GITHUB_RUN_ID} · trigger=${GITHUB_SHA}" >/dev/null
      - name: Finalize and preflight exact product
        id: finalize
        env:
          GOOGLE_MAP_TILES_BROWSER_KEY: ${{ secrets.GOOGLE_MAP_TILES_BROWSER_KEY }}
        run: bash tools/finalize_product_once.sh
      - name: Report finalizer result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCT_SHA: ${{ steps.finalize.outputs.product_sha }}
        run: gh api "repos/${GH_REPO}/issues/54/comments" -f body="S31 FINALIZER FINAL · run=${GITHUB_RUN_ID} · status=${{ job.status }} · product=${PRODUCT_SHA:-none}" >/dev/null
