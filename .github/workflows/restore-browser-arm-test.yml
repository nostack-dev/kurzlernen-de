name: Restore full browser gate and patch ARM block only
on:
  push:
    paths:
      - '.github/workflows/restore-browser-arm-test.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Restore parent test and apply surgical ARM migration
        shell: bash
        run: |
          set -euxo pipefail
          git show HEAD^:tests/browser_sim_smoke.mjs > tests/browser_sim_smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_sim_smoke.mjs');s=p.read_text()
          old='''  const localArmStart=await simTime();await page.keyboard.press("Space");await waitForSimTime(localArmStart+1.1,45000);\n  state=await page.$eval("#fcState",e=>e.textContent||"");\n  if(state!=="ARMED")throw new Error(`local fallback ARM failed: ${JSON.stringify(await snapshot())}`);\n'''
          new='''  // Keep the desktop Space shortcut tested independently from physical arming.\n  // The visible ARM control then exercises the real SBUS -> FirmwareRuntime ->\n  // ArmState path with the unchanged 1 s low-throttle dwell.\n  await page.keyboard.press("Space");\n  let localArmText=await page.$eval("#touchArm",e=>e.textContent||"");\n  if(!localArmText.includes("ON"))throw new Error(`Space did not set local ARM request ON: ${localArmText}`);\n  await page.keyboard.press("Space");\n  localArmText=await page.$eval("#touchArm",e=>e.textContent||"");\n  if(!localArmText.includes("OFF"))throw new Error(`Space did not set local ARM request OFF: ${localArmText}`);\n\n  await page.click("#touchArm");\n  localArmText=await page.$eval("#touchArm",e=>e.textContent||"");\n  if(!localArmText.includes("ON"))throw new Error(`local ARM button did not set request ON: ${localArmText}`);\n  const localArmStart=await simTime();await waitForSimTime(localArmStart+1.2,45000);\n  state=await page.$eval("#fcState",e=>e.textContent||"");\n  if(state!=="ARMED")throw new Error(`local fallback ARM failed through visible ARM control: ${JSON.stringify(await snapshot())}`);\n'''
          if s.count(old)!=1: raise SystemExit(f'ARM block expected exactly once, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/restore-browser-arm-test.yml
          node --check tests/browser_sim_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore full browser gate and isolate local ARM input'
          git push origin HEAD:main
