name: one-shot-vs-combat-live
on:
  push:
    branches:
      - fix/vs-signaling-fallback
    paths:
      - .github/workflows/one-shot-vs-combat-live.yml
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install real P2P test dependencies
        run: |
          set -euxo pipefail
          mkdir -p /tmp/vs-live
          cd /tmp/vs-live
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund esbuild@0.25.8 puppeteer-core@24.16.0 trystero@0.25.1 @trystero-p2p/mqtt@0.25.1
          ln -s /tmp/vs-live/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Real two-browser same-network combat over WebRTC
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cat >/tmp/vs-live/entry.mjs <<'JS'
          import {LanVsSession,sameNetworkRoomKey} from '/workspace/sim/lan_vs.mjs';
          import * as mqtt from '@trystero-p2p/mqtt';
          globalThis.VS={
            key:()=>sameNetworkRoomKey(),
            async start(suffix){
              const state={peer:false,combat:null,left:false};
              const base=await sameNetworkRoomKey();
              const session=new LanVsSession({loadTransport:async()=>mqtt,loadFallbackTransport:null,onPeer:()=>state.peer=true,onCombat:p=>state.combat=p,onLeave:()=>state.left=true});
              await session.start(`${base}-${suffix}`);
              globalThis.__session=session;globalThis.__state=state;return base;
            },
            combat:p=>globalThis.__session.sendCombat(p),
            state:()=>globalThis.__state,
            stop:()=>globalThis.__session?.stop()
          };
          JS
          sed -i "s#/workspace#$GITHUB_WORKSPACE#" /tmp/vs-live/entry.mjs
          "$GITHUB_WORKSPACE/node_modules/.bin/esbuild" /tmp/vs-live/entry.mjs --bundle --format=iife --platform=browser --target=es2022 --outfile=/tmp/vs-live/app.js
          printf '<!doctype html><meta charset="utf-8"><script src="app.js"></script>\n' >/tmp/vs-live/index.html
          cat >/tmp/vs-live/test.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const exe=process.env.CHROME_BIN,base='http://127.0.0.1:4188',suffix=`combat-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const launch=()=>puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-dev-shm-usage']});
          const a=await launch(),b=await launch();
          const wait=async(page,predicate,ms=20000)=>{const end=Date.now()+ms;while(Date.now()<end){const state=await page.evaluate(()=>VS.state());if(predicate(state))return state;await new Promise(r=>setTimeout(r,100));}throw Error('timeout waiting for P2P combat state');};
          try{
            const pa=await a.newPage(),pb=await b.newPage();await Promise.all([pa.goto(base),pb.goto(base)]);
            const [ka,kb]=await Promise.all([pa.evaluate(()=>VS.key()),pb.evaluate(()=>VS.key())]);if(ka!==kb)throw Error(`same-network keys differ: ${ka} ${kb}`);
            await Promise.all([pa.evaluate(s=>VS.start(s),suffix),pb.evaluate(s=>VS.start(s),suffix)]);await Promise.all([wait(pa,s=>s.peer),wait(pb,s=>s.peer)]);
            const sent=await pa.evaluate(()=>VS.combat({type:'hit',id:'live-hit',damage:25}));if(!sent)throw Error('hit send rejected');
            const hit=await wait(pb,s=>s.combat?.type==='hit'&&s.combat.id==='live-hit');if(hit.combat.damage!==25)throw Error('hit payload corrupted');
            const ackSent=await pb.evaluate(()=>VS.combat({type:'state',id:'live-hit',hp:75,killed:false}));if(!ackSent)throw Error('state send rejected');
            const ack=await wait(pa,s=>s.combat?.type==='state'&&s.combat.id==='live-hit');if(ack.combat.hp!==75||ack.combat.killed)throw Error('state payload corrupted');
            await pb.evaluate(()=>VS.stop());await wait(pa,s=>s.left,5000);
            console.log('LIVE VS same-network -> MQTT -> WebRTC -> combat hit/state -> leave PASS',JSON.stringify({room:ka,hit:hit.combat,ack:ack.combat}));
          }finally{await a.close();await b.close();}
          JS
          cd /tmp/vs-live
          python3 -m http.server 4188 --bind 127.0.0.1 >/tmp/vs-live-http.log 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true; rm -f "$GITHUB_WORKSPACE/node_modules"' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" node test.mjs
