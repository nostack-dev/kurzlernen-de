name: One-shot fullscreen race
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-fullscreen-race.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fullscreen race integration
        run: |
          set -euxo pipefail
          python3 tools/patch_fullscreen_race.py
          node --check sim/race_track.mjs
          node --check sim/simulator.mjs
          node --check tests/browser_sim_smoke.mjs
          grep -q 'new RaceTrack' sim/simulator.mjs
          grep -q 'raceTrack.update' sim/simulator.mjs
          grep -q 'soloReset' sim/simulator.mjs tests/browser_sim_smoke.mjs
          grep -q 'soloRaceTime' sim/simulator.mjs tests/browser_sim_smoke.mjs
      - name: Commit integrated product code
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/simulator.mjs tests/browser_sim_smoke.mjs
          git commit -m "Add three-lap fullscreen race and reset"
          git push
