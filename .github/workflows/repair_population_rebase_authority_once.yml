name: Repair population rebase authority once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_population_rebase_authority_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce body lifecycle and world-rebase authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sim/world_rigid_body_runtime.mjs')
          s=p.read_text()
          old='function removeBody(id){const key=String(id||"");pendingBodies.delete(key);pendingTargets.delete(key);targetLeases.delete(key);return ensureEngine()?.removeBody(key)??false;}'
          new='function removeBody(id,{owner=null,force=false}={}){const key=String(id||""),lease=targetLeases.get(key),now=performance.now(),requestOwner=String(owner||"");if(!key)return false;if(!force&&lease&&lease.expiresAt>now&&lease.owner!==requestOwner){targetRejects++;const v=viewport();if(v){v.dataset.worldPhysicsRemoveRejects=String((Number(v.dataset.worldPhysicsRemoveRejects)||0)+1);v.dataset.worldPhysicsRemoveBlocked=`${requestOwner||"unowned"}->${lease.owner}`;v.dataset.worldPhysicsRemoveBlockedId=key;}return false;}pendingBodies.delete(key);pendingTargets.delete(key);targetLeases.delete(key);const v=viewport();if(v){v.dataset.worldPhysicsLastRemoveOwner=force?"force":requestOwner||"unowned";v.dataset.worldPhysicsLastRemoveId=key;}return ensureEngine()?.removeBody(key)??false;}'
          assert old in s, 'removeBody contract changed'
          s=s.replace(old,new,1)
          s=s.replace('v.dataset.worldPhysicsControlDetail="force+torque+impulse+target+pose-authority-lease-v3";','v.dataset.worldPhysicsControlDetail="force+torque+impulse+target+pose+body-lifecycle-authority-v4";',1)
          p.write_text(s)

          p=Path('sim/world_procedural_population.mjs')
          s=p.read_text()
          marker='function configureWorld(){const b=bridge(),v=viewport(),real=Boolean(b?.active&&Number.isFinite(b.originLon)&&Number.isFinite(b.originLat));'
          assert marker in s, 'configureWorld header changed'
          helper='function externallyOwnedVehicleRecord(){const physics=rigidBodies();return records.find(record=>{if(!record?.id||(record.kind!=="car"&&record.kind!=="bus"))return false;const data=record.group?.userData||{},owner=String(physics?.targetOwner?.(record.id)||"");return Boolean(data.playerDriven||data.remotePlayerDriven||(owner&&owner!=="world-ai"));})||null;}\n'
          s=s.replace(marker,helper+marker,1)
          old='if(key===worldKey)return true;anchorX=east;anchorY=north;'
          new='if(key===worldKey)return true;const pinned=worldKey?externallyOwnedVehicleRecord():null;if(pinned){if(v){v.dataset.worldPopulationReconfigureDeferred="external-vehicle-authority-v1";v.dataset.worldPopulationReconfigureDeferredId=pinned.id;v.dataset.worldPopulationReconfigureRequested=key;}return true;}if(v){delete v.dataset.worldPopulationReconfigureDeferred;delete v.dataset.worldPopulationReconfigureDeferredId;delete v.dataset.worldPopulationReconfigureRequested;}anchorX=east;anchorY=north;'
          assert old in s, 'world-key transition branch changed'
          s=s.replace(old,new,1)
          old='v.dataset.worldTrafficContinuity="persistent-body+route-lease+retire-hysteresis-v4";'
          new='v.dataset.worldTrafficContinuity="persistent-body+route-lease+retire-hysteresis+rebase-authority-v5";v.dataset.worldPopulationRebaseAuthority="defer-while-external-vehicle-owned-v1";'
          assert old in s, 'traffic continuity telemetry changed'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check sim/world_rigid_body_runtime.mjs
          node --check sim/world_procedural_population.mjs
          grep -q 'worldPhysicsRemoveBlocked' sim/world_rigid_body_runtime.mjs
          grep -q 'external-vehicle-authority-v1' sim/world_procedural_population.mjs
          grep -q 'defer-while-external-vehicle-owned-v1' sim/world_procedural_population.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/world_rigid_body_runtime.mjs sim/world_procedural_population.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Protect driven vehicles across world rebase'
          git push origin HEAD:main
