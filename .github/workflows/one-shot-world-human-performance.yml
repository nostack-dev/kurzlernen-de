name: One-shot WORLD human-control performance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hardware-faithful WORLD UX and performance pass
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          def one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              assert n==1, f"{path}: expected one occurrence, got {n}: {old[:120]!r}"
              p.write_text(s.replace(old,new,1))

          # Shared human altitude-command semantics. This changes only the target
          # the user asks the FC to hold; no motor, state, position or physics is
          # written from the browser.
          one('sim/control_semantics.mjs',
              'export const MAX_GAME_CLEARANCE_M=50.0;\n// UI/transport range mirrors the FC\'s hardware-side GAME clearance envelope.\n',
              '''export const MAX_GAME_CLEARANCE_M=50.0;\nexport const MAX_GAME_CLEARANCE_RATE_MPS=5.0;\nexport const GAME_CLEARANCE_RATE_DEADBAND=0.08;\n// UI/transport range mirrors the FC's hardware-side GAME clearance envelope.\n// Height input is spring-centred target slew: release means HOLD. It never writes\n// vehicle position/velocity and still crosses SBUS -> StateController -> motors.\n''')
          one('sim/control_semantics.mjs',
              'export function clampControl(value,lo=-1,hi=1){return Math.max(lo,Math.min(hi,value));}\n',
              '''export function clampControl(value,lo=-1,hi=1){return Math.max(lo,Math.min(hi,value));}\nexport function clearanceRateMps(input){\n  const x=clampControl(Number(input)||0),magnitude=Math.abs(x);\n  if(magnitude<=GAME_CLEARANCE_RATE_DEADBAND)return 0;\n  const unit=(magnitude-GAME_CLEARANCE_RATE_DEADBAND)/(1-GAME_CLEARANCE_RATE_DEADBAND);\n  const human=unit*(0.25+0.75*unit);\n  return Math.sign(x)*MAX_GAME_CLEARANCE_RATE_MPS*human;\n}\nexport function stepGroundClearanceTarget(current,input,dtSeconds){\n  const base=clampControl(Number(current)||MIN_GAME_CLEARANCE_M,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);\n  // Never integrate a stale held input across a long browser pause. Real command\n  // sampling is fresh/periodic too; a delayed UI frame must not create a target jump.\n  const dt=clampControl(Number(dtSeconds)||0,0,0.05);\n  return Math.round(clampControl(base+clearanceRateMps(input)*dt,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M)*100)/100;\n}\n''')

          # One-phone control: replace absolute 0.5..50 native range slider with a
          # spring-centred climb/HOLD/descend target-rate control.
          one('sim/simulator.mjs',
              'import {neutralControls,copyControls,armReady as sharedArmReady,normalizedPointer,endPointerDrag,applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M} from "./control_semantics.mjs";',
              'import {neutralControls,copyControls,armReady as sharedArmReady,normalizedPointer,endPointerDrag,applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M,clearanceRateMps,stepGroundClearanceTarget} from "./control_semantics.mjs";')
          one('sim/simulator.mjs',
              'const range=clamp(Number(maxRange)||12,.05,50),origin=this.worldPoint([0,0,-.018]),down=this.worldVector([0,0,-1]),verticalProjection=-down[2];',
              'const range=clamp(Number(maxRange)||12,.05,NAV_AGL_RAY_MAX_M),origin=this.worldPoint([0,0,-.018]),down=this.worldVector([0,0,-1]),verticalProjection=-down[2];')
          one('sim/simulator.mjs',
              '<div id="soloClearance"><small>FLY HEIGHT</small><strong id="soloClearanceValue">2.0 m</strong><div class="solo-range-shell"><input id="soloClearanceSlider" type="range" min="0.5" max="50" step="0.1"></div><span id="soloRangeStatus">AGL —</span></div>',
              '<div id="soloClearance"><small>ALT TARGET</small><strong id="soloClearanceValue">1.2 m</strong><div id="soloHeightPad" class="solo-height-pad" aria-label="Climb or descend altitude target"><span class="solo-height-up">CLIMB</span><div class="solo-height-track"></div><div id="soloHeightKnob" class="solo-height-knob"></div><span class="solo-height-hold">HOLD</span><span class="solo-height-down">DESCEND</span></div><span id="soloRangeStatus">AGL —</span></div>')
          one('sim/simulator.mjs',
              '.solo-range-shell{height:98px;width:36px;display:grid;place-items:center;overflow:visible}.solo-range-shell input{width:98px;transform:rotate(-90deg);accent-color:#6be4b0}',
              '.solo-height-pad{position:relative;height:98px;width:50px;touch-action:none;border-radius:10px;background:linear-gradient(180deg,#174f70aa 0%,#102236bb 46%,#102236bb 54%,#70402aaa 100%);border:1px solid #ffffff33;overflow:hidden}.solo-height-track{position:absolute;left:50%;top:14px;bottom:14px;width:3px;transform:translateX(-50%);background:#ffffff35;border-radius:4px}.solo-height-knob{position:absolute;left:50%;top:50%;width:28px;height:20px;transform:translate(-50%,-50%);border-radius:999px;background:#effaff;border:2px solid #8fe8ff;box-shadow:0 2px 10px #0009;pointer-events:none}.solo-height-up,.solo-height-hold,.solo-height-down{position:absolute!important;left:50%!important;transform:translateX(-50%)!important;font:800 6px/1 system-ui,-apple-system,sans-serif!important;letter-spacing:.04em!important;color:#d9f4ff!important;pointer-events:none!important}.solo-height-up{top:4px!important}.solo-height-hold{top:50%!important;transform:translate(-50%,-50%)!important;color:#7ff0c5!important}.solo-height-down{bottom:4px!important;color:#ffc29b!important}')
          old='''let soloMode=false,soloPreviousInputSource="remote",phoneSettings=loadPhoneControlSettings();\nlet soloGroundClearance=phoneSettings.defaultHoverAgl;\nfunction neutralSoloControls(){return{...neutralControls(),gameMode:true,groundClearance:soloGroundClearance};}\nlet soloControls=neutralSoloControls();\nconst soloClearanceSlider=$("soloClearanceSlider"),soloClearanceValue=$("soloClearanceValue"),soloRangeStatus=$("soloRangeStatus");soloClearanceSlider.value=String(soloGroundClearance);\nfunction updateSoloSticks(){\n  const left=gameKnobAxes(soloControls,"left",phoneSettings);\n  const right=gameKnobAxes(soloControls,"right",phoneSettings);\n  for(const [id,axes] of [["soloLeft",left],["soloRight",right]]){const knob=$(id).querySelector(".solo-knob");knob.style.left=`${knobPercent(axes.x)}%`;knob.style.top=`${knobPercent(axes.y)}%`;}\n  soloClearanceValue.textContent=`${soloGroundClearance.toFixed(1)} m`;\n}\n'''
          new='''let soloMode=false,soloPreviousInputSource="remote",phoneSettings=loadPhoneControlSettings();\nlet soloGroundClearance=phoneSettings.defaultHoverAgl;\nfunction neutralSoloControls(){return{...neutralControls(),gameMode:true,groundClearance:soloGroundClearance};}\nlet soloControls=neutralSoloControls();\nconst soloHeightPad=$("soloHeightPad"),soloHeightKnob=$("soloHeightKnob"),soloClearanceValue=$("soloClearanceValue"),soloRangeStatus=$("soloRangeStatus");\nlet soloHeightAxis=0,soloHeightPointer=null,soloHeightLastMs=performance.now();\nfunction renderSoloHeightControl(){\n  soloHeightKnob.style.top=`${50-soloHeightAxis*38}%`;soloClearanceValue.textContent=`${soloGroundClearance.toFixed(1)} m`;\n  const rate=clearanceRateMps(soloHeightAxis);soloHeightPad.dataset.rateMps=rate.toFixed(2);$("soloClearance").dataset.targetAglM=soloGroundClearance.toFixed(2);\n}\nfunction setSoloHeightAxis(value){soloHeightAxis=clamp(Number(value)||0,-1,1);renderSoloHeightControl();}\nfunction applySoloHeightPointer(event){const r=soloHeightPad.getBoundingClientRect(),cy=r.top+r.height/2,span=Math.max(1,r.height*.40);setSoloHeightAxis((cy-event.clientY)/span);event.preventDefault();}\nsoloHeightPad.addEventListener("pointerdown",event=>{if(soloHeightPointer!==null)return;soloHeightPointer=event.pointerId;soloHeightPad.setPointerCapture?.(soloHeightPointer);applySoloHeightPointer(event);});\nsoloHeightPad.addEventListener("pointermove",event=>{if(event.pointerId===soloHeightPointer)applySoloHeightPointer(event);});\nconst releaseSoloHeight=event=>{if(soloHeightPointer===null||(event?.pointerId!=null&&event.pointerId!==soloHeightPointer))return;try{soloHeightPad.releasePointerCapture?.(soloHeightPointer);}catch{}soloHeightPointer=null;setSoloHeightAxis(0);event?.preventDefault();};\nsoloHeightPad.addEventListener("pointerup",releaseSoloHeight);soloHeightPad.addEventListener("pointercancel",releaseSoloHeight);soloHeightPad.addEventListener("lostpointercapture",releaseSoloHeight);\nfunction stepSoloHeightTarget(now){\n  const dt=Math.max(0,(now-soloHeightLastMs)/1000);soloHeightLastMs=now;if(!soloMode||Math.abs(soloHeightAxis)<1e-4)return;\n  const next=stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,dt);if(next===soloGroundClearance)return;soloGroundClearance=next;soloControls.groundClearance=next;renderSoloHeightControl();\n}\nfunction updateSoloSticks(){\n  const left=gameKnobAxes(soloControls,"left",phoneSettings);\n  const right=gameKnobAxes(soloControls,"right",phoneSettings);\n  for(const [id,axes] of [["soloLeft",left],["soloRight",right]]){const knob=$(id).querySelector(".solo-knob");knob.style.left=`${knobPercent(axes.x)}%`;knob.style.top=`${knobPercent(axes.y)}%`;}\n  renderSoloHeightControl();\n}\n'''
          one('sim/simulator.mjs',old,new)
          one('sim/simulator.mjs',
              'soloClearanceSlider.oninput=()=>{soloGroundClearance=clamp(Number(soloClearanceSlider.value),MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);soloControls.groundClearance=soloGroundClearance;updateSoloSticks();};\n',
              '')
          one('sim/simulator.mjs',
              'onChange:next=>{phoneSettings=next;const keepArm=soloControls.arm;if(!keepArm){soloGroundClearance=next.defaultHoverAgl;soloClearanceSlider.value=String(soloGroundClearance);}soloControls=neutralSoloControls();soloControls.arm=keepArm;updateSoloSticks();arm=keepArm;throttle=0;},',
              'onChange:next=>{phoneSettings=next;const keepArm=soloControls.arm;if(!keepArm)soloGroundClearance=next.defaultHoverAgl;setSoloHeightAxis(0);soloControls=neutralSoloControls();soloControls.arm=keepArm;updateSoloSticks();arm=keepArm;throttle=0;},')
          one('sim/simulator.mjs',
              'soloMode=true;soloPreviousInputSource=inputSource;phoneSettings=loadPhoneControlSettings();soloGroundClearance=phoneSettings.defaultHoverAgl;soloClearanceSlider.value=String(soloGroundClearance);soloControls=neutralSoloControls();updateSoloSticks();',
              'soloMode=true;soloPreviousInputSource=inputSource;phoneSettings=loadPhoneControlSettings();soloGroundClearance=phoneSettings.defaultHoverAgl;setSoloHeightAxis(0);soloHeightLastMs=performance.now();soloControls=neutralSoloControls();updateSoloSticks();')
          one('sim/simulator.mjs',
              'soloControls=neutralSoloControls();updateSoloSticks();localArm=false;arm=false;localThrottle=0;inputSource=soloPreviousInputSource;',
              'setSoloHeightAxis(0);soloControls=neutralSoloControls();updateSoloSticks();localArm=false;arm=false;localThrottle=0;inputSource=soloPreviousInputSource;')
          one('sim/simulator.mjs',
              'phoneSettings=loadPhoneControlSettings();soloGroundClearance=phoneSettings.defaultHoverAgl;soloClearanceSlider.value=String(soloGroundClearance);\n  physics.reset',
              'phoneSettings=loadPhoneControlSettings();soloGroundClearance=phoneSettings.defaultHoverAgl;setSoloHeightAxis(0);soloHeightLastMs=performance.now();\n  physics.reset')
          one('sim/simulator.mjs',
              '$("soloKill").onclick=()=>{soloControls=neutralSoloControls();updateSoloSticks();arm=false;throttle=0;};',
              '$("soloKill").onclick=()=>{setSoloHeightAxis(0);soloControls=neutralSoloControls();updateSoloSticks();arm=false;throttle=0;};')
          one('sim/simulator.mjs',
              'requestAnimationFrame(render);physics.render();updateCamera();const fcState=latest.state;',
              'requestAnimationFrame(render);const renderNow=performance.now();stepSoloHeightTarget(renderNow);physics.render();updateCamera();const fcState=latest.state;')
          one('sim/simulator.mjs','const now=performance.now();if(now-lastRemoteTelemetry>=100){','const now=renderNow;if(now-lastRemoteTelemetry>=100){')

          # Compact one-phone layout keeps a fat touch target but no absolute slider.
          p=Path('sim/solo_layout.mjs');s=p.read_text()
          s=s.replace('''    body.solo-flight .solo-range-shell{height:72px;width:70px;margin-left:-11px;margin-right:-11px;touch-action:none;overflow:visible}\n    body.solo-flight .solo-range-shell input{width:72px;height:70px;margin:0;transform:rotate(-90deg);touch-action:none;cursor:ns-resize}''','''    body.solo-flight .solo-height-pad{height:72px;width:58px;margin-left:-5px;margin-right:-5px;touch-action:none;overflow:hidden}''')
          s=s.replace('''      body.solo-flight .solo-range-shell{height:58px;width:66px;margin-left:-12px;margin-right:-12px}\n      body.solo-flight .solo-range-shell input{width:58px;height:66px}''','''      body.solo-flight .solo-height-pad{height:58px;width:54px;margin-left:-6px;margin-right:-6px}''')
          assert 'solo-range-shell' not in s
          p.write_text(s)

          # Two-phone controller gets the exact same spring-centred target-rate semantics.
          one('drone_controller.html',
              '.game-clearance input{flex:1;width:32px;min-height:64px;margin:2px 0;accent-color:#64e0ae;writing-mode:vertical-lr;direction:rtl}',
              '.height-rate-pad{position:relative;flex:1;width:46px;min-height:76px;margin:3px 0;border:1px solid #ffffff2b;border-radius:9px;background:linear-gradient(180deg,#174f70aa 0%,#101a29 46%,#101a29 54%,#70402aaa 100%);touch-action:none;overflow:hidden}.height-rate-track{position:absolute;left:50%;top:12px;bottom:12px;width:3px;transform:translateX(-50%);border-radius:4px;background:#ffffff35}.height-rate-knob{position:absolute;left:50%;top:50%;width:28px;height:18px;transform:translate(-50%,-50%);border-radius:999px;background:#effaff;border:2px solid #8fe8ff;box-shadow:0 2px 9px #0009;pointer-events:none}.height-rate-pad:after{content:"HOLD";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 6px system-ui;color:#7ff0c5;pointer-events:none}')
          one('drone_controller.html',
              '<input id="gameClearanceSlider" type="range" min="0.5" max="50" step="0.1" value="2" aria-label="Flight height target">',
              '<div id="gameHeightPad" class="height-rate-pad" aria-label="Climb or descend altitude target"><div class="height-rate-track"></div><div id="gameHeightKnob" class="height-rate-knob"></div></div>')
          p=Path('drone_controller.html');s=p.read_text().replace('.game-clearance input{min-height:48px}','.height-rate-pad{min-height:58px}')
          p.write_text(s)

          one('sim/controller.mjs',
              'import {neutralControls,armReady as sharedArmReady,normalizedPointer,endPointerDrag,applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M} from "./control_semantics.mjs";',
              'import {neutralControls,armReady as sharedArmReady,normalizedPointer,endPointerDrag,applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M,clearanceRateMps,stepGroundClearanceTarget} from "./control_semantics.mjs";')
          one('sim/controller.mjs',
              '"rightTopLabel","rightBottomLabel","rightLeftLabel","rightRightLabel","gameClearance","gameClearanceValue",\n  "gameClearanceSlider","gameUp","gameDown","gameSensorStatus","gameNav","arm"',
              '"rightTopLabel","rightBottomLabel","rightLeftLabel","rightRightLabel","gameClearance","gameClearanceValue",\n  "gameHeightPad","gameHeightKnob","gameUp","gameDown","gameSensorStatus","gameNav","arm"')
          one('sim/controller.mjs',
              'function setGroundClearance(value){\n  const numeric=Number(value);\n  if(!Number.isFinite(numeric))return;\n  groundClearance=clamp(Math.round(numeric*10)/10,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);\n  controls.groundClearance=groundClearance;\n  renderClearance();publish();\n}\nfunction renderClearance(){\n  ui.gameClearanceSlider.value=groundClearance.toFixed(1);\n  ui.gameClearanceValue.textContent=`${groundClearance.toFixed(1)} m`;\n}\nui.gameClearanceSlider.addEventListener("input",event=>setGroundClearance(event.currentTarget.value));\n',
              '''function setGroundClearance(value,send=true){\n  const numeric=Number(value);\n  if(!Number.isFinite(numeric))return;\n  groundClearance=clamp(Math.round(numeric*20)/20,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);\n  controls.groundClearance=groundClearance;\n  renderClearance();if(send)publish();\n}\nlet heightAxis=0,heightPointer=null,heightLastMs=performance.now();\nfunction renderHeightControl(){ui.gameHeightKnob.style.top=`${50-heightAxis*38}%`;ui.gameHeightPad.dataset.rateMps=clearanceRateMps(heightAxis).toFixed(2);}\nfunction renderClearance(){\n  ui.gameClearanceValue.textContent=`${groundClearance.toFixed(1)} m`;ui.gameClearance.dataset.targetAglM=groundClearance.toFixed(2);renderHeightControl();\n}\nfunction setHeightAxis(value){heightAxis=clamp(Number(value)||0,-1,1);renderHeightControl();}\nfunction applyHeightPointer(event){const r=ui.gameHeightPad.getBoundingClientRect(),cy=r.top+r.height/2,span=Math.max(1,r.height*.40);setHeightAxis((cy-event.clientY)/span);event.preventDefault();}\nui.gameHeightPad.addEventListener("pointerdown",event=>{if(heightPointer!==null)return;heightPointer=event.pointerId;ui.gameHeightPad.setPointerCapture?.(heightPointer);applyHeightPointer(event);});\nui.gameHeightPad.addEventListener("pointermove",event=>{if(event.pointerId===heightPointer)applyHeightPointer(event);});\nconst releaseHeightPointer=event=>{if(heightPointer===null||(event?.pointerId!=null&&event.pointerId!==heightPointer))return;try{ui.gameHeightPad.releasePointerCapture?.(heightPointer);}catch{}heightPointer=null;setHeightAxis(0);event?.preventDefault();};\nui.gameHeightPad.addEventListener("pointerup",releaseHeightPointer);ui.gameHeightPad.addEventListener("pointercancel",releaseHeightPointer);ui.gameHeightPad.addEventListener("lostpointercapture",releaseHeightPointer);\nfunction stepHeightTarget(now){const dt=Math.max(0,(now-heightLastMs)/1000);heightLastMs=now;if(gameMode&&Math.abs(heightAxis)>1e-4)setGroundClearance(stepGroundClearanceTarget(groundClearance,heightAxis,dt),false);requestAnimationFrame(stepHeightTarget);}\nrequestAnimationFrame(stepHeightTarget);\n''')
          one('sim/controller.mjs','const nudge=()=>setGroundClearance(groundClearance+direction*.1);','const nudge=()=>setGroundClearance(groundClearance+direction*.2);')
          one('sim/controller.mjs','function safetyNeutral(send=true){stopHeightUp();stopHeightDown();controls=neutralForMode();updateSticks();if(send)publish();}','function safetyNeutral(send=true){stopHeightUp();stopHeightDown();setHeightAxis(0);controls=neutralForMode();updateSticks();if(send)publish();}')

          # WORLD: one-time semantic palette, no extra renderer, adaptive visual
          # budget that sacrifices map refresh/resolution before flight rendering.
          p=Path('sim/real_world_bootstrap.mjs');s=p.read_text()
          s=s.replace('const WORLD_MAP_FRAME_MS=1000/30;','const WORLD_MAP_FRAME_MS=1000/30;\nconst WORLD_MAP_FRAME_MS_CONSTRAINED=1000/20;\nconst WORLD_MAP_FRAME_MS_CRITICAL=1000/15;\nconst WORLD_PERF_WINDOW_MS=1000;\nconst WORLD_FPS_CONSTRAINED=50;\nconst WORLD_FPS_CRITICAL=36;\nconst WORLD_FPS_RECOVER=57;',1)
          s=s.replace('this.lookHud=null;this.lookPlane=null;this.lookReadout=null;this.airframe=null;', 'this.lookHud=null;this.lookPlane=null;this.lookReadout=null;this.mapLegend=null;this.airframe=null;this.mapFrameMs=WORLD_MAP_FRAME_MS;this.perfMode="nominal";this.perfWindowStart=performance.now();this.perfFrames=0;this.perfGoodWindows=0;this.flightFps=60;',1)
          s=s.replace('#worldLookHud{display:none;position:absolute;z-index:4;right:max(10px,env(safe-area-inset-right));top:max(48px,calc(env(safe-area-inset-top) + 42px));width:116px;height:116px;border:1px solid #8cdcff88;border-radius:16px;background:#071522d9;box-shadow:0 8px 26px #0008,inset 0 0 22px #2f9bd322;backdrop-filter:blur(7px);touch-action:none;user-select:none;overflow:hidden;color:#dff7ff}', '#worldLookHud{display:none;position:absolute;z-index:4;right:max(10px,env(safe-area-inset-right));top:max(48px,calc(env(safe-area-inset-top) + 42px));width:116px;height:116px;border:1px solid #8cdcff88;border-radius:16px;background:#071522ee;box-shadow:0 8px 26px #0008,inset 0 0 22px #2f9bd322;touch-action:none;user-select:none;overflow:hidden;color:#dff7ff}',1)
          css_anchor='      #worldLookHud .world-look-cardinal{position:absolute;font:900 7px system-ui,-apple-system,sans-serif;color:#72d9ff;opacity:.85;pointer-events:none}.world-look-n{top:22px;left:53px}.world-look-e{top:62px;right:12px}.world-look-s{bottom:9px;left:54px}.world-look-w{top:62px;left:12px}\n'
          css_add='''      #worldLookHud .world-look-cardinal{position:absolute;font:900 7px system-ui,-apple-system,sans-serif;color:#72d9ff;opacity:.85;pointer-events:none}.world-look-n{top:22px;left:53px}.world-look-e{top:62px;right:12px}.world-look-s{bottom:9px;left:54px}.world-look-w{top:62px;left:12px}\n      #worldMapLegend{display:none;position:absolute;z-index:4;left:max(10px,env(safe-area-inset-left));top:max(52px,calc(env(safe-area-inset-top) + 46px));padding:5px 7px;border-radius:8px;background:#071522e8;border:1px solid #ffffff25;color:#dce9f2;font:800 7px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:.03em;pointer-events:none}\n      body.solo-flight #viewport[data-world-mode="real"] #worldMapLegend{display:grid;grid-template-columns:auto auto;gap:2px 7px}\n      #worldMapLegend i{width:9px;height:6px;border-radius:2px;display:inline-block;margin-right:4px}.legend-water i{background:#237db0}.legend-green i{background:#4f7b55}.legend-road i{background:#e3c56b}.legend-building i{background:#bdcbd3}\n      body.solo-flight #viewport[data-world-mode="real"] #soloTopbar span,body.solo-flight #viewport[data-world-mode="real"] #soloTopbar button,body.solo-flight #viewport[data-world-mode="real"] #soloRaceHud,body.solo-flight #viewport[data-world-mode="real"] #soloClearance,body.solo-flight #viewport[data-world-mode="real"] .solo-action{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}\n'''
          assert s.count(css_anchor)==1;s=s.replace(css_anchor,css_add,1)
          old='viewport.appendChild(hud);this.lookHud=hud;this.lookPlane=hud.querySelector(".world-look-plane");this.lookReadout=hud.querySelector("[data-world-look-readout]");'
          new='viewport.appendChild(hud);this.lookHud=hud;this.lookPlane=hud.querySelector(".world-look-plane");this.lookReadout=hud.querySelector("[data-world-look-readout]");const legend=document.createElement("div");legend.id="worldMapLegend";legend.innerHTML=\'<span class="legend-water"><i></i>WATER</span><span class="legend-green"><i></i>GREEN</span><span class="legend-road"><i></i>ROADS</span><span class="legend-building"><i></i>BUILDINGS</span>\';viewport.appendChild(legend);this.mapLegend=legend;'
          assert s.count(old)==1;s=s.replace(old,new,1)
          s=s.replace('viewport.dataset.worldLookKeep=this.keepLookOrientation?"1":"0";viewport.dataset.worldGrid=this.gridEnabled?"1":"0";', 'viewport.dataset.worldLookKeepEnabled=this.keepLookOrientation?"1":"0";viewport.dataset.worldGridEnabled=this.gridEnabled?"1":"0";',1)
