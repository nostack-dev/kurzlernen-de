name: Fix multiplayer presence once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-multiplayer-presence-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate drone human and vehicle presence replication
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sim/vs_player_state_replication.mjs'); s=p.read_text()
          a='function posePosition(pose){const b=bridge();if(Array.isArray(pose?.g)&&pose.g.length===2&&Number.isFinite(b?.originLon)&&Number.isFinite(b?.originLat)){const local=lngLatToMeters(b.originLon,b.originLat,Number(pose.g[0]),Number(pose.g[1]));return[local[0],local[1],Number(pose.p?.[2])||0];}return canonicalToLocal(pose?.p);}'
          b=a+'\nfunction humanAnchorPosition(pose){const b=bridge();if(Array.isArray(pose?.ag)&&pose.ag.length===2&&Number.isFinite(b?.originLon)&&Number.isFinite(b?.originLat)){const local=lngLatToMeters(b.originLon,b.originLat,Number(pose.ag[0]),Number(pose.ag[1]));return[local[0],local[1],0];}return canonicalToLocal(pose?.av);}'
          assert a in s and 'function humanAnchorPosition' not in s
          s=s.replace(a,b,1)

          a='record={id,mode:"drone",vehicleId:"",timeline:new VsPoseTimeline(),lastPoseMs:-Infinity,ph:null,dead:false,avatar:createAvatar(id)};'
          b='record={id,mode:"drone",vehicleId:"",timeline:new VsPoseTimeline(),lastPoseMs:-Infinity,anchor:[0,0,0],anchorYaw:0,anchorVelocity:[0,0,0],anchorLastMs:-Infinity,ph:null,dead:false,avatar:createAvatar(id)};'
          assert a in s
          s=s.replace(a,b,1)

          a='function onPose(event){const peerId=String(event?.detail?.peerId||""),pose=event?.detail?.pose;if(!peerId||!pose||peerId===selfId())return;const record=recordFor(peerId);if(!record)return;record.mode=["foot","vehicle","drone"].includes(String(pose.pm))?String(pose.pm):"drone";record.ph=pose.ph&&typeof pose.ph==="object"?{...pose.ph}:null;record.vehicleId=String(pose.pv?.id||pose.cv?.id||record.vehicleId||"");if(typeof record.ph?.dead==="boolean")record.dead=record.ph.dead;const p=posePosition(pose);record.timeline.push({...pose,p},performance.now());record.lastPoseMs=performance.now();const view=viewport();if(view){view.dataset.vsPlayerStateRx=String((Number(view.dataset.vsPlayerStateRx)||0)+1);view.dataset.vsLastRemoteMode=record.mode;}}'
          b='function onPose(event){const peerId=String(event?.detail?.peerId||""),pose=event?.detail?.pose;if(!peerId||!pose||peerId===selfId())return;const record=recordFor(peerId);if(!record)return;const now=performance.now();record.mode=["foot","vehicle","drone"].includes(String(pose.pm))?String(pose.pm):"drone";record.ph=pose.ph&&typeof pose.ph==="object"?{...pose.ph}:null;record.vehicleId=String(pose.pv?.id||pose.cv?.id||record.vehicleId||"");if(typeof record.ph?.dead==="boolean")record.dead=record.ph.dead;if(finiteArray(pose.av,3)){record.anchor=humanAnchorPosition(pose);record.anchorYaw=Number(pose.ay)||0;record.anchorVelocity=finiteArray(pose.avv,3)?[...pose.avv]:[0,0,0];record.anchorLastMs=now;}const p=posePosition(pose);record.timeline.push({...pose,p},now);record.lastPoseMs=now;const view=viewport();if(view){view.dataset.vsPlayerStateRx=String((Number(view.dataset.vsPlayerStateRx)||0)+1);view.dataset.vsLastRemoteMode=record.mode;view.dataset.vsRemoteHumanAnchor=record.anchorLastMs===now?"fresh":"unchanged";}}'
          assert a in s
          s=s.replace(a,b,1)

          a='function renderHuman(record,now){\n  const avatar=record.avatar;if(!avatar)return;const active=record.mode==="foot"&&now-record.lastPoseMs<=STALE_MS,sample=active?record.timeline.sample(now):null;if(!sample||sample.stale){avatar.group.visible=false;if(record.mode==="vehicle")hideLegacyPeer(record.id);return;}\n  const ph=record.ph||{},yaw=Number(ph.yaw)||0,pitch=clamp(Number(ph.pitch)||0,-1.48,1.48),speed=Math.max(0,Number(ph.speed)||0),moving=Boolean(ph.moving)||speed>.12,dead=Boolean(record.dead||ph.dead);setPlayerHumanFootParent(avatar,bridge()?.threeScene);avatar.group.position.set(...sample.p);avatar.group.rotation.set(dead?Math.PI*.48:0,0,-yaw);avatar.group.visible=true;const gait=moving&&!dead?Math.sin(now*.0105+hashId(record.id)%17)*Math.min(.72,.18+speed*.075):0;avatar.leftLeg.rotation.x=gait;avatar.rightLeg.rotation.x=-gait;avatar.leftArm.rotation.x=-gait*.72;avatar.rightArm.rotation.x=gait*.72;avatar.aimRig.rotation.x=pitch;const weapon=String(ph.weapon||"pistol");avatar.pistol.visible=!dead&&weapon!=="smg";avatar.smg.visible=!dead&&weapon==="smg";avatar.aimRig.visible=!dead;avatar.group.userData.vsRemotePlayerMode="foot";avatar.group.userData.vsRemoteWeapon=weapon;avatar.group.userData.vsRemoteDead=dead;hideLegacyPeer(record.id);\n}'
          b='function renderHuman(record,now){\n  const avatar=record.avatar;if(!avatar)return;const droneAnchor=record.mode==="drone"&&now-record.anchorLastMs<=STALE_MS,footActive=record.mode==="foot"&&now-record.lastPoseMs<=STALE_MS,sample=droneAnchor?{p:record.anchor,stale:false}:footActive?record.timeline.sample(now):null;if(!sample||sample.stale){avatar.group.visible=false;avatar.hitbox.visible=false;if(record.mode!=="drone")hideLegacyPeer(record.id);return;}\n  const ph=record.ph||{},yaw=droneAnchor?record.anchorYaw:Number(ph.yaw)||0,pitch=droneAnchor?0:clamp(Number(ph.pitch)||0,-1.48,1.48),anchorSpeed=droneAnchor?Math.hypot(...record.anchorVelocity.slice(0,2)):0,speed=droneAnchor?anchorSpeed:Math.max(0,Number(ph.speed)||0),moving=!droneAnchor&&(Boolean(ph.moving)||speed>.12),dead=Boolean(record.dead||ph.dead);setPlayerHumanFootParent(avatar,bridge()?.threeScene);avatar.group.position.set(...sample.p);avatar.group.rotation.set(dead?Math.PI*.48:0,0,-yaw);avatar.group.visible=true;avatar.hitbox.visible=!dead;const gait=moving&&!dead?Math.sin(now*.0105+hashId(record.id)%17)*Math.min(.72,.18+speed*.075):0;avatar.leftLeg.rotation.x=gait;avatar.rightLeg.rotation.x=-gait;avatar.leftArm.rotation.x=-gait*.72;avatar.rightArm.rotation.x=gait*.72;avatar.aimRig.rotation.x=pitch;const weapon=droneAnchor?"none":String(ph.weapon||"pistol");avatar.pistol.visible=!dead&&!droneAnchor&&weapon!=="smg";avatar.smg.visible=!dead&&!droneAnchor&&weapon==="smg";avatar.aimRig.visible=!dead&&!droneAnchor;avatar.group.userData.vsRemotePlayerMode=record.mode;avatar.group.userData.vsRemotePresence=droneAnchor?"stationary-human-while-drone":"active-human";avatar.group.userData.vsRemoteWeapon=weapon;avatar.group.userData.vsRemoteDead=dead;if(record.mode!=="drone")hideLegacyPeer(record.id);\n}'
          assert a in s
          s=s.replace(a,b,1)

          a='function renderVehicleHuman(record,now){const avatar=record.avatar;if(!avatar)return false;const fresh=now-record.lastPoseMs<=STALE_MS,root=fresh?vehicleRootForRecord(record):null;if(!root){avatar.group.visible=false;return false;}setPlayerHumanVehiclePose(avatar,root,{driverSide:-1});avatar.group.userData.vsRemotePlayerMode="vehicle";avatar.group.userData.vsRemoteVehicleId=record.vehicleId||String(root.userData?.worldPopulationId||"");hideLegacyPeer(record.id);return true;}'
          b='function renderVehicleHuman(record,now){const avatar=record.avatar;if(!avatar)return false;const fresh=now-record.lastPoseMs<=STALE_MS,root=fresh?vehicleRootForRecord(record):null;if(!root){avatar.group.visible=false;return false;}setPlayerHumanVehiclePose(avatar,root,{driverSide:-1});avatar.group.userData.vsRemotePlayerMode="vehicle";avatar.group.userData.vsRemotePresence="vehicle-occupant";avatar.group.userData.vsRemoteVehicleId=record.vehicleId||String(root.userData?.worldPopulationId||"");if(record.mode!=="drone")hideLegacyPeer(record.id);return true;}'
          assert a in s
          s=s.replace(a,b,1)

          a='function frame(now=performance.now()){\n  patchSession(now);let humans=0,vehicles=0,drones=0;for(const record of records.values()){if(record.mode==="foot"){renderHuman(record,now);if(record.avatar?.group?.visible)humans++;}else if(record.mode==="vehicle"){vehicles++;renderVehicleHuman(record,now);}else{if(record.avatar)record.avatar.group.visible=false;drones++;}}\n  const view=viewport();if(view){view.dataset.vsRemoteHumanAvatars=String(humans);view.dataset.vsRemoteVehiclePlayers=String(vehicles);view.dataset.vsRemoteDronePlayers=String(drones);view.dataset.vsPlayerReplication="drone+foot+vehicle-seated+weapon+death-v3";view.dataset.vsLocalPlayerMode=localMode;}\n  requestAnimationFrame(frame);\n}\nexport function installVsPlayerStateReplication(){if(installed)return;installed=true;addEventListener(VS_POSE_EVENT,onPose);addEventListener(VS_PEER_EVENT,onPeer);addEventListener(VS_GAME_EVENT,onGame);requestAnimationFrame(frame);}'
          b='function frame(now=performance.now()){\n  patchSession(now);let humans=0,vehicles=0,drones=0;for(const record of records.values()){if(record.mode==="vehicle"){vehicles++;renderVehicleHuman(record,now);}else{renderHuman(record,now);if(record.avatar?.group?.visible)humans++;if(record.mode==="drone")drones++;}}\n  const view=viewport();if(view){view.dataset.vsRemoteHumanAvatars=String(humans);view.dataset.vsRemoteVehiclePlayers=String(vehicles);view.dataset.vsRemoteDronePlayers=String(drones);view.dataset.vsPlayerReplication="drone+stationary-human+foot+vehicle-seated+weapon+death-v4";view.dataset.vsPresenceContract="control-mode-independent-physical-presence-v1";view.dataset.vsLocalPlayerMode=localMode;}\n  requestAnimationFrame(frame);\n}\nexport function installVsPlayerStateReplication(){if(installed)return;installed=true;globalThis.__arondightVsPlayerStateReplicationV4=true;addEventListener(VS_POSE_EVENT,onPose);addEventListener(VS_PEER_EVENT,onPeer);addEventListener(VS_GAME_EVENT,onGame);requestAnimationFrame(frame);}'
          assert a in s
          s=s.replace(a,b,1)
          s=s.replace('drone+foot+vehicle-seated+weapon+death-v3','drone+stationary-human+foot+vehicle-seated+weapon+death-v4')
          p.write_text(s)

          # The older vehicle runtime remains the authority for the local human anchor,
          # but it must not create a second remote human mesh once v4 replication owns that presentation.
          p=Path('sim/player_vehicle_runtime_v2.mjs'); s=p.read_text()
          a='function onPose(event){const peerId=String(event?.detail?.peerId||""),pose=event?.detail?.pose;if(!peerId||!pose||!Array.isArray(pose.av)||!(pose.pm==="foot"||pose.pm==="drone"))return;'
          b='function onPose(event){if(globalThis.__arondightVsPlayerStateReplicationV4)return;const peerId=String(event?.detail?.peerId||""),pose=event?.detail?.pose;if(!peerId||!pose||!Array.isArray(pose.av)||!(pose.pm==="foot"||pose.pm==="drone"))return;'
          assert a in s
          s=s.replace(a,b,1)
          a='function renderRemoteAvatars(now,dt){refreshPeerDrones(now);let visible=0,vr=0;'
          b='function renderRemoteAvatars(now,dt){if(globalThis.__arondightVsPlayerStateReplicationV4){for(const r of remoteAvatars.values())r.root.visible=false;const v=viewport();if(v){v.dataset.vsLegacyHumanAvatarsSuppressed="1";v.dataset.vsHumanAvatarsVisible="0";}return;}refreshPeerDrones(now);let visible=0,vr=0;'
          assert a in s
          s=s.replace(a,b,1)
          p.write_text(s)

          p=Path('tests/player_multiplayer_replication_contract_test.mjs'); s=p.read_text()
          s=s.replace("'drone+foot+vehicle-seated+weapon+death-v3'","'drone+stationary-human+foot+vehicle-seated+weapon+death-v4'")
          extra='''\nassert.ok(replication.includes('finiteArray(pose.av,3)')&&replication.includes('humanAnchorPosition(pose)'),"stationary human anchor is not consumed from replicated drone pose");\nassert.ok(replication.includes('record.mode==="drone"&&now-record.anchorLastMs<=STALE_MS'),"drone control does not keep the human physical presence alive");\nassert.ok(replication.includes('vsRemotePresence=droneAnchor?"stationary-human-while-drone":"active-human"'),"remote human presence telemetry is missing");\nassert.ok(replication.includes('if(record.mode!=="drone")hideLegacyPeer(record.id)'),"drone mesh is hidden while stationary human presence is rendered");\nassert.ok(humanRig.includes('hitbox.userData.vsCombatHitbox=true')&&replication.includes('avatar.hitbox.visible=!dead'),"stationary multiplayer human is not shootable");\nconst vehicleRuntime=readFileSync("sim/player_vehicle_runtime_v2.mjs","utf8");\nassert.ok(vehicleRuntime.includes('av:canonical')&&vehicleRuntime.includes('vr:mode==="drone"?1:0'),"local stationary human anchor is not transmitted while drone flies");\nassert.ok(vehicleRuntime.includes('__arondightVsPlayerStateReplicationV4')&&vehicleRuntime.includes('vsLegacyHumanAvatarsSuppressed'),"legacy duplicate remote human renderer is still active");\nassert.ok(network.includes('if(pose.cm==="vehicle"&&pose.cv)')&&network.includes('remotePlayerDriven'),"stationary active vehicles are not continuously retained by remote physics ownership");\n'''
          marker='console.log("Player multiplayer replication contract passed:'
          assert marker in s and 'stationary human anchor is not consumed' not in s
          s=s.replace(marker,extra+'\n'+marker,1)
          s=s.replace('drone/foot/vehicle modes, full remote human rig, weapon/death state, vehicle authority and touch ownership are wired.','drone plus stationary shootable human presence, foot/vehicle modes, full remote human rig, weapon/death state, vehicle authority and touch ownership are wired.')
          p.write_text(s)
          PY
          node --check sim/vs_player_state_replication.mjs
          node --check sim/player_vehicle_runtime_v2.mjs
          node tests/player_multiplayer_replication_contract_test.mjs
      - name: Commit runtime repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/vs_player_state_replication.mjs sim/player_vehicle_runtime_v2.mjs tests/player_multiplayer_replication_contract_test.mjs
          git commit -m 'Keep multiplayer body present while flying drone'
          git push origin HEAD:main
