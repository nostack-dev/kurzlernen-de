name: One-shot landscape scale
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-landscape-scale.yml'
      - 'sim/race_track.mjs'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply world-scale-only migration
        run: |
          set -euxo pipefail
          python3 tools/patch_landscape_scale.py
          git diff --check
          git diff -- sim/simulator.mjs
      - name: Commit product change
        run: |
          set -euxo pipefail
          git config user.name 'Christian Heinrich Hohlfeld'
          git config user.email 'chris.hohlfeld@gmail.com'
          git add sim/simulator.mjs
          git commit -m 'Scale simulator landscape to race speed'
          git push
