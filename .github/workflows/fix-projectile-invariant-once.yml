name: Fix projectile invariant once

on:
  push:
    branches: ["fix-projectile-invariant"]
    paths: [".github/workflows/fix-projectile-invariant-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-projectile-invariant
      - name: Replace stale hitscan invariant with physical projectile invariant
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          old='for(const marker of ["installFlightFireFx","THREE.Raycaster","addVisualShotImpact","SHOT_INTERVAL_MS","DECAL_POOL_SIZE=32","touch-action:none"])requireText("sim/flight_fire_fx.mjs",marker);'
          new='for(const marker of ["installFlightFireFx","THREE.Raycaster","traceProjectileWorldSegment","resolveProjectileHit","registerVsHit?.(sceneHit)","SHOT_INTERVAL_MS","PROJECTILE_POOL_SIZE=36","TRACER_SPEED_MPS=210","PROJECTILE_TTL_MS=1800","DECAL_POOL_SIZE=32","touch-action:none"])requireText("sim/flight_fire_fx.mjs",marker);\nfor(const marker of ["PROJECTILE_GRAVITY_MPS2","integrateProjectile","traceProjectileWorldSegment"])requireText("sim/projectile_ballistics.mjs",marker);\nforbidText("sim/flight_fire_fx.mjs","addVisualShotImpact","instant WORLD hitscan path must not return; impacts come from projectile segment collision");'
          if s.count(old)!=1: raise SystemExit(f'expected one stale fire invariant, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/architecture_invariants.mjs
          node tests/architecture_invariants.mjs
          rm .github/workflows/fix-projectile-invariant-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/architecture_invariants.mjs .github/workflows/fix-projectile-invariant-once.yml
          git commit -m "Gate physical projectile path instead of legacy hitscan"
          git push origin HEAD:fix-projectile-invariant
