name: Fix car touch parked interaction once v2
on:
  push:
    paths:
      - '.github/workflows/fix-car-touch-parked-interact-once-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply vehicle interaction fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(s, old, new, name):
              if old not in s:
                  raise SystemExit(f'missing marker in {name}: {old[:120]!r}')
              return s.replace(old,new,1)

          p=Path('sim/player_car_mode.mjs'); s=p.read_text()
          s=must_replace(s,'const target=new THREE.Vector3();\n','const target=new THREE.Vector3();\nconst raycaster=new THREE.Raycaster();\nconst pickNdc=new THREE.Vector2();\n','player_car_mode')
          s=must_replace(s,'let touchSteer=0,touchPedal=0,handbrake=false,lastNearestScan=-Infinity,nearest=null;','let touchSteer=0,touchPedal=0,touchGas=false,touchBrake=false,handbrake=false,lastNearestScan=-Infinity,nearest=null,lastGamepadInteract=false;','player_car_mode')

          insert='''function logicalScreenPoint(clientX,clientY){const view=viewport(),screen=view?.getBoundingClientRect();if(!view||!screen)return null;const width=Math.max(1,view.clientWidth),height=Math.max(1,view.clientHeight),cx=Number(clientX),cy=Number(clientY),rotated=view.dataset.soloOrientation==="css-landscape",x=rotated?cy-screen.top:cx-screen.left,y=rotated?screen.right-cx:cy-screen.top;return{x:clamp(x,0,width),y:clamp(y,0,height),width,height};}\nfunction vehicleAtScreenPoint(clientX,clientY){if(active||walk()?.mode!=="foot")return null;const camera=bridge()?.threeCamera,point=logicalScreenPoint(clientX,clientY),w=walk();if(!camera||!point||!w?.position)return null;const roots=vehicleRoots();if(!roots.length)return null;pickNdc.set(point.x/point.width*2-1,1-point.y/point.height*2);raycaster.setFromCamera(pickNdc,camera);const hits=raycaster.intersectObjects(roots.map(item=>item.root),true);for(const hit of hits){let node=hit.object,id="";while(node&&!id){id=String(node.userData?.worldPopulationId||node.userData?.worldProceduralId||"");node=node.parent;}if(!id)continue;const record=roots.find(item=>item.id===id);if(!record)continue;record.root.getWorldPosition(tmp);const distance=Math.hypot(tmp.x-w.position.x,tmp.y-w.position.y);if(distance<=ENTER_RADIUS_M)return{...record,distance,screenHitDistance:Number(hit.distance)||0};}return null;}\nfunction tryEnterAtScreenPoint(clientX,clientY){const record=vehicleAtScreenPoint(clientX,clientY);if(!record)return false;const ok=enter(record),v=viewport();if(v){v.dataset.vehicleInteract=ok?"screen-car-raycast-enter-v1":"screen-car-raycast-gated-v1";v.dataset.vehicleInteractId=record.id;}return ok;}\n'''
          marker='function clearFootKeys(){'
          if marker not in s: raise SystemExit('clearFootKeys marker missing')
          s=s.replace(marker,insert+marker,1)

          s=re.sub(r'function resetPads\(\)\{.*?\}\nfunction suppressFootGamepad', '''function resetPads(){touchSteer=0;touchPedal=0;touchGas=false;touchBrake=false;handbrake=false;keys.clear();const knob=document.querySelector("#vehicleSteer .knob");if(knob)knob.style.left="50%";for(const id of["vehicleGas","vehicleBrake"])document.getElementById(id)?.classList.remove("held");const v=viewport();if(v){v.dataset.vehicleInputLifecycle="released";v.dataset.vehicleTouchThrottle="0";}}\nfunction suppressFootGamepad''', s, count=1, flags=re.S)

          s=must_replace(s,'function controls(){let steer=(keys.has("KeyD")?1:0)-(keys.has("KeyA")?1:0)+touchSteer,pedal=(keys.has("KeyW")?1:0)-(keys.has("KeyS")?1:0)+touchPedal,brake=handbrake||keys.has("Space");','function controls(){let steer=(keys.has("KeyD")?1:0)-(keys.has("KeyA")?1:0)+touchSteer,pedal=(keys.has("KeyW")?1:0)-(keys.has("KeyS")?1:0)+touchPedal+(touchGas?1:0)-(touchBrake?1:0),brake=handbrake||keys.has("Space");','player_car_mode')

          axis_marker='function axis(value,dead=.08){const v=clamp(value,-1,1),a=Math.abs(v);return a<=dead?0:Math.sign(v)*(a-dead)/(1-dead);}\n'
          poll='''function pollGamepadInteract(){const pad=sampleGamepad(),held=button(pad,3)>.55;if(held&&!lastGamepadInteract){const record=nearestVehicle();if(active)exit();else if(record)enter(record);const v=viewport();if(v){v.dataset.vehicleInteract="gamepad-standard-button3-y-v1";v.dataset.vehicleInteractButton="3";}}lastGamepadInteract=held;}\n'''
          s=must_replace(s,axis_marker,axis_marker+poll,'player_car_mode')
          s=s.replace('view.dataset.vehicleDriveController="keyboard+touch+xbox-v2"','view.dataset.vehicleDriveController="keyboard+multitouch+xbox-v3"')

          style_start=s.index('function installStyle()')
          bind_start=s.index('function bindPad(',style_start)
          new_style='''function installStyle(){if(document.querySelector("style[data-player-car-mode]"))return;const style=document.createElement("style");style.dataset.playerCarMode="gta-physical-touch-v3";style.textContent=`\nbody.player-driving #footHud,body.player-driving #soloLeft,body.player-driving #soloRight,body.player-driving #soloClearance,body.player-driving .solo-action{display:none!important;pointer-events:none!important}#vehicleHud{display:none;position:absolute;inset:0;z-index:10030;pointer-events:none;font-family:system-ui,-apple-system,sans-serif}body.player-driving #vehicleHud{display:block}.vehicle-pad{position:absolute;bottom:max(18px,var(--solo-safe-bottom,env(safe-area-inset-bottom)));width:min(25vw,142px);aspect-ratio:1;border-radius:50%;border:1px solid #a9e6ff66;background:#071522b8;box-shadow:inset 0 0 30px #2db7ff22,0 6px 20px #0007;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none}.vehicle-pad .knob{position:absolute;left:50%;top:50%;width:31%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#e9f8ffdd;border:1px solid #fff}.vehicle-pad span{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);color:#eaf8ff;font:900 8px/1 system-ui;letter-spacing:.1em}#vehicleSteer{left:max(14px,var(--solo-safe-left,env(safe-area-inset-left)))}#vehicleTouchPedals{position:absolute;right:max(14px,var(--solo-safe-right,env(safe-area-inset-right)));bottom:max(18px,var(--solo-safe-bottom,env(safe-area-inset-bottom)));display:grid;grid-template-columns:1fr;gap:8px;pointer-events:auto}#vehicleTouchPedals button{width:min(21vw,116px);height:58px;border:1px solid #ffffff45;border-radius:14px;background:#10283ee8;color:#fff;font:950 11px/1 system-ui;letter-spacing:.08em;touch-action:none;-webkit-user-select:none;user-select:none}#vehicleGas{border-color:#70e6a477!important;background:#174c35e8!important}#vehicleBrake{border-color:#ff9a8177!important;background:#52251fe8!important}#vehicleTouchPedals button.held{transform:scale(.96);filter:brightness(1.35);box-shadow:inset 0 0 20px #ffffff24}#vehicleReadout{position:absolute;left:50%;bottom:max(18px,var(--solo-safe-bottom,env(safe-area-inset-bottom)));transform:translateX(-50%);padding:7px 10px;border:1px solid #ffffff2c;border-radius:9px;background:#071522d8;color:#dff5ff;font:900 9px/1 system-ui;letter-spacing:.07em}#driveModeButton[data-near="1"]{border-color:#7de7b988!important;background:#154932e8!important}body.player-driving #driveModeButton{border-color:#ffcf6f88!important;background:#52350fe8!important}@media(max-height:340px){.vehicle-pad{width:min(21vw,116px);bottom:max(10px,var(--solo-safe-bottom,env(safe-area-inset-bottom)))}#vehicleTouchPedals{bottom:max(10px,var(--solo-safe-bottom,env(safe-area-inset-bottom)));gap:5px}#vehicleTouchPedals button{height:46px;width:min(18vw,96px);font-size:9px}#vehicleReadout{bottom:max(8px,var(--solo-safe-bottom,env(safe-area-inset-bottom)));font-size:8px}}\n`;document.head.appendChild(style);}\n'''
          s=s[:style_start]+new_style+s[bind_start:]

          bind_start=s.index('function bindPad(')
          mount_start=s.index('function mountUi()',bind_start)
          new_bind='''function bindPad(el,kind){if(!el||el.dataset.bound)return;el.dataset.bound="1";let pointer=null;const knob=el.querySelector(".knob");const apply=e=>{if(!active)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2;if(kind==="steer"){touchSteer=clamp((Number(e.clientX)-cx)/(r.width*.38),-1,1);if(knob)knob.style.left=`${50+touchSteer*31}%`;const v=viewport();if(v)v.dataset.vehicleTouchSteer=touchSteer.toFixed(3);}e.preventDefault();e.stopPropagation();};const release=e=>{if(pointer===null||(e&&e.pointerId!==pointer))return;pointer=null;touchSteer=0;if(knob)knob.style.left="50%";const v=viewport();if(v)v.dataset.vehicleTouchSteer="0.000";e?.preventDefault?.();e?.stopPropagation?.();};el.addEventListener("pointerdown",e=>{if(!active)return;pointer=e.pointerId;try{el.setPointerCapture?.(pointer);}catch{}apply(e);},{passive:false});window.addEventListener("pointermove",e=>{if(e.pointerId===pointer)apply(e);},{capture:true,passive:false});window.addEventListener("pointerup",release,{capture:true,passive:false});window.addEventListener("pointercancel",release,{capture:true,passive:false});el.addEventListener("lostpointercapture",e=>{if(e.pointerId===pointer)release(e);});}\nfunction bindPedalButton(el,which){if(!el||el.dataset.bound)return;el.dataset.bound="1";let pointer=null;const set=value=>{if(which==="gas")touchGas=value;else touchBrake=value;el.classList.toggle("held",value);const v=viewport();if(v)v.dataset.vehicleTouchThrottle=(touchGas?"1":touchBrake?"-1":"0");};const release=e=>{if(pointer===null||(e&&e.pointerId!==pointer))return;pointer=null;set(false);e?.preventDefault?.();e?.stopPropagation?.();};el.addEventListener("pointerdown",e=>{if(!active)return;pointer=e.pointerId;set(true);try{el.setPointerCapture?.(pointer);}catch{}e.preventDefault();e.stopPropagation();},{passive:false});window.addEventListener("pointerup",release,{capture:true,passive:false});window.addEventListener("pointercancel",release,{capture:true,passive:false});el.addEventListener("lostpointercapture",e=>{if(e.pointerId===pointer)release(e);});}\n'''
          s=s[:bind_start]+new_bind+s[mount_start:]

          mount_start=s.index('function mountUi()')
          render_start=s.index('function renderUi(',mount_start)
          new_mount='''function mountUi(){const view=viewport(),top=document.getElementById("soloTopbarActions")||document.getElementById("soloTopbar");if(view&&!document.getElementById("vehicleHud")){const hud=document.createElement("div");hud.id="vehicleHud";hud.innerHTML='<div id="vehicleSteer" class="vehicle-pad"><div class="knob"></div><span>STEER</span></div><div id="vehicleTouchPedals"><button id="vehicleGas" type="button">GAS</button><button id="vehicleBrake" type="button">BRAKE / R</button></div><div id="vehicleReadout">CAR · 0 km/h · E / Y EXIT</div>';view.appendChild(hud);bindPad(hud.querySelector("#vehicleSteer"),"steer");bindPedalButton(hud.querySelector("#vehicleGas"),"gas");bindPedalButton(hud.querySelector("#vehicleBrake"),"brake");}if(top&&!document.getElementById("driveModeButton")){const b=document.createElement("button");b.id="driveModeButton";b.type="button";b.addEventListener("click",()=>active?exit():enter());top.insertBefore(b,document.getElementById("soloCamera")?.parentElement===top?document.getElementById("soloCamera"):null);}}\n'''
          s=s[:mount_start]+new_mount+s[render_start:]
          s=s.replace('readout.textContent=`CAR · ${Math.round(Math.abs(commandSpeed)*3.6)} km/h · E EXIT`','readout.textContent=`CAR · ${Math.round(Math.abs(commandSpeed)*3.6)} km/h · E / Y EXIT`')
          s=s.replace('function frame(now=performance.now()){const dt=clamp((now-lastFrame)/1000,0,.05);lastFrame=now;ensureCameraProvider();renderUi(now);updateDrive(now,dt);requestAnimationFrame(frame);}','function frame(now=performance.now()){const dt=clamp((now-lastFrame)/1000,0,.05);lastFrame=now;ensureCameraProvider();renderUi(now);pollGamepadInteract();updateDrive(now,dt);requestAnimationFrame(frame);}')
          s=s.replace('nearestVehicle};globalThis.__arondightVehicleDrive=api;','nearestVehicle,vehicleAtScreenPoint,tryEnterAtScreenPoint};globalThis.__arondightVehicleDrive=api;')
          s=s.replace('view.dataset.vehicleDriveOwner=DRIVE_OWNER;','view.dataset.vehicleDriveOwner=DRIVE_OWNER;view.dataset.vehicleTouchControls="steer+gas+brake-multitouch-v1";view.dataset.vehicleEnterInteraction="screen-raycast+keyboard-e+gamepad-y-v1";')
          s=s.replace('if(root){delete root.userData.playerDriven;delete root.userData.worldTrafficControlOwner;}','if(root){delete root.userData.playerDriven;delete root.userData.worldTrafficControlOwner;if(root.userData.worldParked)root.userData.worldParkedReanchor=true;}')
          p.write_text(s)

          p=Path('sim/foot_look_capture.mjs'); s=p.read_text()
          old='''    if(!target?.closest("#footLookZone"))return;\n    if(event.pointerType==="mouse"){'''
          new='''    if(!target?.closest("#footLookZone"))return;\n    const vehicleDrive=globalThis.__arondightVehicleDrive||null;if(!vehicleDrive?.active&&vehicleDrive?.tryEnterAtScreenPoint?.(event.clientX,event.clientY)){const v=viewport();if(v)v.dataset.walkTouchTapRoute="vehicle-screen-interact-before-fire-v1";consume(event);return;}\n    if(event.pointerType==="mouse"){'''
          s=must_replace(s,old,new,'foot_look_capture')
          p.write_text(s)

          p=Path('sim/world_procedural_population.mjs'); s=p.read_text()
          s=must_replace(s,'const CAR_COUNT=MOBILE?14:24;\n','const CAR_COUNT=MOBILE?14:24;\nconst PARKED_CAR_FRACTION=.33;\nconst PARKED_CURB_MULTIPLIER=2.75;\n','world_procedural_population')
          s=s.replace('routeKey:""};}','routeKey:"",parked:false,parkPose:null};}',1)
          old='function makeCar(index){ensureShared();const s=hashText(`car:${index}`),group=new THREE.Group(),bodyMat=shared.carMats[s%shared.carMats.length],body=new THREE.Mesh(shared.carBody,bodyMat),cab=new THREE.Mesh(shared.carCabin,shared.window),r=baseRecord("car",index,group,bodyMat.color.getHex());body.position.z=.48;cab.position.set(-.1,0,.93);group.add(body,cab);for(const x of[-1.18,1.18])for(const y of[-.86,.86]){const wheel=new THREE.Mesh(shared.wheel,shared.wheelMat);wheel.position.set(x,y,.28);group.add(wheel);}return r;}'
          new='function makeCar(index){ensureShared();const s=hashText(`car:${index}`),group=new THREE.Group(),bodyMat=shared.carMats[s%shared.carMats.length],body=new THREE.Mesh(shared.carBody,bodyMat),cab=new THREE.Mesh(shared.carCabin,shared.window),r=baseRecord("car",index,group,bodyMat.color.getHex());r.parked=u(s,97)<PARKED_CAR_FRACTION;group.userData.worldParked=r.parked;body.position.z=.48;cab.position.set(-.1,0,.93);group.add(body,cab);for(const x of[-1.18,1.18])for(const y of[-.86,.86]){const wheel=new THREE.Mesh(shared.wheel,shared.wheelMat);wheel.position.set(x,y,.28);group.add(wheel);}return r;}'
          s=must_replace(s,old,new,'world_procedural_population')
          s=s.replace('record.routeKey="";if(record.physicsRegistered)','record.routeKey="";record.parkPose=null;if(record.physicsRegistered)',1)
          old='function initialVehicleSample(record,route,fallback){if(!route)return fallback;const a=recordAnchor(record),nearest=nearestRouteDistance(route,a.x,a.y),seed=hashText(`${record.id}:spawn:${record.streamGeneration}`),along=range(seed,41,-28,28),distance=clamp(nearest.distance+along,0,route.length);return sampleRoadRoute(route,distance,laneWidth(route,record)*record.routeDirection,record.routeDirection)||fallback;}'
          new='function initialVehicleSample(record,route,fallback){if(!route)return fallback;const a=recordAnchor(record),nearest=nearestRouteDistance(route,a.x,a.y),seed=hashText(`${record.id}:spawn:${record.streamGeneration}`),along=range(seed,41,record.parked?-46:-28,record.parked?46:28),distance=clamp(nearest.distance+along,0,route.length),offset=record.parked?laneWidth(route,record)*PARKED_CURB_MULTIPLIER:laneWidth(route,record)*record.routeDirection;return sampleRoadRoute(route,distance,offset,record.routeDirection)||fallback;}'
          s=must_replace(s,old,new,'world_procedural_population')

          start=s.index('function updatePhysicalVehicle(record,epoch,now){')
          end=s.index('\n\nfunction respawnAllowed',start)
          new_func='''function updatePhysicalVehicle(record,epoch,now){if(!respawnAllowed(record)){record.group.visible=false;if(record.physicsRegistered){rigidBodies()?.removeBody?.(record.id);record.physicsRegistered=false;}return;}if(shouldRecycleRecord(record,now))recycleRecord(record);const physics=rigidBodies(),route=routeFor(record),shape=vehicleShape(record),fallback=fallbackVehicleSample(record,epoch),initial=initialVehicleSample(record,route,fallback);if(!record.physicsRegistered){physics?.upsertBody?.({id:record.id,kind:record.kind,position:[initial.x,initial.y,shape.half[2]],yaw:initial.yaw,halfExtents:shape.half,massKg:shape.mass});record.physicsRegistered=true;if(record.parked)record.parkPose={x:initial.x,y:initial.y,yaw:initial.yaw};}let pose=physics?.pose?.(record.id)||record.physicsPose;if(pose?.position?.[2]<-2){physics?.removeBody?.(record.id);record.physicsRegistered=false;record.parkPose=null;pose=null;}const externallyDriven=Boolean(record.group.userData.playerDriven||record.group.userData.remotePlayerDriven);if(!externallyDriven){const current=pose?.position||[initial.x,initial.y,shape.half[2]];if(record.parked){if(record.group.userData.worldParkedReanchor&&pose?.position){const q=pose.rotation||[0,0,0,1],yaw=Math.atan2(2*((Number(q[3])||0)*(Number(q[2])||0)+(Number(q[0])||0)*(Number(q[1])||0)),1-2*((Number(q[1])||0)**2+(Number(q[2])||0)**2));record.parkPose={x:pose.position[0],y:pose.position[1],yaw};delete record.group.userData.worldParkedReanchor;}const park=record.parkPose||{x:initial.x,y:initial.y,yaw:initial.yaw};physics?.setTarget?.(record.id,{position:[park.x,park.y,shape.half[2]],yaw:park.yaw,speedMps:0,response:4.8,maxAccelerationMps2:9,owner:"world-ai",priority:10});}else{let targetPoint;if(route){const nearest=nearestRouteDistance(route,current[0],current[1]);if(nearest.distance>route.length-2.5)record.routeDirection=-1;else if(nearest.distance<2.5)record.routeDirection=1;const lookahead=Math.max(5.5,record.speed*1.15),targetDistance=clamp(nearest.distance+record.routeDirection*lookahead,0,route.length),offset=laneWidth(route,record)*record.routeDirection;targetPoint=sampleRoadRoute(route,targetDistance,offset,record.routeDirection);}else targetPoint=fallbackVehicleSample(record,epoch+1.1);physics?.setTarget?.(record.id,{position:[targetPoint.x,targetPoint.y,shape.half[2]],yaw:targetPoint.yaw,speedMps:record.speed,response:record.kind==="bus"?2.1:2.8,maxAccelerationMps2:record.kind==="bus"?3.4:5.2,owner:"world-ai",priority:10});}pose=physics?.pose?.(record.id)||pose;}record.physicsPose=pose;record.group.userData.worldParked=Boolean(record.parked);if(pose){record.group.position.set(pose.position[0],pose.position[1],pose.position[2]-shape.half[2]);record.group.quaternion.set(pose.rotation[0],pose.rotation[1],pose.rotation[2],pose.rotation[3]);}else{record.group.position.set(initial.x,initial.y,0);record.group.rotation.set(0,0,initial.yaw);}record.group.visible=true;}'''
          s=s[:start]+new_func+s[end:]
          s=s.replace('v.dataset.worldCars=String(CAR_COUNT);','v.dataset.worldCars=String(CAR_COUNT);v.dataset.worldParkedCars=String(records.filter(record=>record.kind==="car"&&record.parked).length);v.dataset.worldParkedCarFraction=String(PARKED_CAR_FRACTION);v.dataset.worldParkingModel="deterministic-curb-static-box3d-v1";')
          p.write_text(s)

          Path('tests/player_car_touch_contract_test.mjs').write_text('''import assert from "node:assert/strict";import {readFileSync} from "node:fs";\nconst car=readFileSync("sim/player_car_mode.mjs","utf8"),look=readFileSync("sim/foot_look_capture.mjs","utf8"),pop=readFileSync("sim/world_procedural_population.mjs","utf8");\nfor(const marker of ["steer+gas+brake-multitouch-v1","screen-raycast+keyboard-e+gamepad-y-v1","vehicleAtScreenPoint","tryEnterAtScreenPoint","vehicleGas","vehicleBrake","z-index:10030","button(pad,3)","keyboard+multitouch+xbox-v3"])assert.ok(car.includes(marker),`missing car touch/interact marker: ${marker}`);\nassert.ok(look.includes("vehicle-screen-interact-before-fire-v1"),"car tap is not routed before foot fire");\nfor(const marker of ["PARKED_CAR_FRACTION=.33","PARKED_CURB_MULTIPLIER=2.75","worldParked","speedMps:0","deterministic-curb-static-box3d-v1"])assert.ok(pop.includes(marker),`missing parked-car marker: ${marker}`);\nassert.ok(pop.includes("record.parkPose"),"parked cars do not retain a stable physical pose");\nconsole.log("Player car touch contract passed: multitouch steering/pedals, screen/Xbox interaction and deterministic parked cars are wired.");\n''')
          PY

          node --check sim/player_car_mode.mjs
          node --check sim/foot_look_capture.mjs
          node --check sim/world_procedural_population.mjs
          node tests/player_car_touch_contract_test.mjs
          git config user.name 'Christian Heinrich Hohlfeld'
          git config user.email 'chris.hohlfeld@gmail.com'
          git add sim tests
          git commit -m 'Fix touch driving, parked cars and vehicle interaction'
          git push origin HEAD:main
