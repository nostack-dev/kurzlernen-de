name: One-off speed saturation fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Patch
        run: python3 tools/oneoff_speed_saturation_patch.py
      - name: Commit
        run: |
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git rm .github/workflows/oneoff-speed-saturation.yml tools/oneoff_speed_saturation_patch.py
          git add esp32/Arondight45_DroneFC_Core.hpp esp32/Arondight45_StateControl.hpp tests/drone_fc_core_test.cpp tests/state_control_test.cpp tests/architecture_invariants.mjs tests/game_speed_envelope_smoke.mjs
          git commit -m "Remove GAME speed saturation bottlenecks"
          git push origin HEAD:main
