name: Restore WORLD palette assertion
on:
  workflow_dispatch:
  push:
    branches: ["fix/world-fpv-eye-altitude"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-eye-altitude
          fetch-depth: 0
      - run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          needle='const browser=await puppeteer.launch('
          block='''for(const marker of ["#086a9d","#2f7044","#ffd34f","#dbe4e9","WATER","GREEN","ROADS","BUILDINGS"])\n  if(!bootstrap.includes(marker))throw new Error(`WORLD semantic palette/legend marker missing: ${marker}`);\n\n'''
          assert s.count(needle)==1
          p.write_text(s.replace(needle,block+needle,1))
          PY
          rm -f .github/workflows/one-shot-restore-palette-test.yml
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore explicit WORLD palette E2E coverage'
          git push origin HEAD:fix/world-fpv-eye-altitude
