name: Refresh ratio market data

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_ratio_data.py"
      - ".github/workflows/ratio-data.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ratio-data-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and validate real market data
        run: |
          set -euxo pipefail
          python3 scripts/update_ratio_data.py --output /tmp/ratio-data.json
          python3 - <<'PY'
          import json, math
          p=json.load(open('/tmp/ratio-data.json', encoding='utf-8'))
          assert p['schemaVersion'] == 2
          assert p['stocks'], 'no stocks'
          assert not p['errors'], p['errors']
          required=('capexCurrentBn','capex2YBn','growthPct','demandBn','coverage','peg','price','score')
          for s in p['stocks']:
              for k in required:
                  v=s.get(k)
                  assert isinstance(v,(int,float)) and math.isfinite(v), (s.get('ticker'),k,v)
              assert s['sources']['capex']['url']
              assert s['sources']['demand']['url']
              assert s['sources']['price']['url']
          print('validated', len(p['stocks']), 'stocks')
          PY

      - name: Publish data branch
        run: |
          set -euxo pipefail
          git config user.name "ratio-data-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/ratio-data-branch
          if git ls-remote --exit-code --heads origin ratio-data >/dev/null 2>&1; then
            git fetch origin ratio-data
            git worktree add /tmp/ratio-data-branch origin/ratio-data
            cd /tmp/ratio-data-branch
            git switch -C ratio-data
          else
            git worktree add --detach /tmp/ratio-data-branch
            cd /tmp/ratio-data-branch
            git switch --orphan ratio-data
            git rm -rf . || true
          fi
          cp /tmp/ratio-data.json ratio-data.json
          cat > README.md <<'EOF'
          # Ratio data feed
          Machine-generated data for https://kurzlernen.de/ratio.html.
          Methodology lives on main in scripts/update_ratio_data.py.
          No synthetic/random fallback values are permitted.
          EOF
          git add ratio-data.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh ratio data"
          git push origin HEAD:ratio-data
