name: One-shot single-phone fullscreen migration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-single-phone.yml"
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply single-phone fullscreen patch
        run: |
          set -euxo pipefail
          python3 tools/patch_single_phone_fullscreen.py
          node --check sim/simulator.mjs
          node --check tests/browser_sim_smoke.mjs
          grep -q '1 PHONE' sim/simulator.mjs
          grep -q 'screen.orientation?.lock?.("landscape")' sim/simulator.mjs
          grep -q 'solo-flight' sim/simulator.mjs
      - name: Commit migrated simulator and test
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/simulator.mjs tests/browser_sim_smoke.mjs
          git commit -m "Add landscape single-phone fullscreen flight controls"
          git push
