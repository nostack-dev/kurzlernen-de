name: Ratio income semantic diagnostic

on:
  push:
    branches: ["fix/ratio-income-concept-20260827"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate current 45 of 45 feed
        run: |
          set -euxo pipefail
          python3 scripts/ratio_feed_all.py --output /tmp/ratio-data.json --min-complete 45
          python3 - <<'PY'
          import json, math
          p=json.load(open('/tmp/ratio-data.json', encoding='utf-8'))
          assert p['completeCount']==45 and p['excludedCount']==0 and p['errors']==[]
          by={s['ticker']:s for s in p['stocks']}
          ceg=by['CEG']
          assert 'comprehensiveincome' not in ''.join(ch.lower() for ch in str(ceg['sources']['peg'].get('details') or {}) if ch.isalpha()), ceg
          assert 0 < ceg['peg'] < 5 and ceg['pegMeaningful'], ceg
          for ticker in ('HPE','SMCI'):
            assert 0 < by[ticker]['peg'] < 5, by[ticker]
          assert math.isfinite(by['SMR']['peg']) and not by['SMR']['pegMeaningful'], by['SMR']
          print('RATIO_45_45_OK', ceg['peg'], ceg['sources']['peg']['provider'])
          PY
