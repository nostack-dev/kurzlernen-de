name: One-shot audio invariant fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-audio-invariant-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update invariant and commit
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/architecture_invariants.mjs')
          s=p.read_text()
          old='this.viewport.dataset.motorAudioSource="motorOmega+motorTorque+propTorque"'
          new='this.viewport.dataset.motorAudioSource="motorOmega+motorTorque+propTorque:2bladeBPF"'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          node tests/architecture_invariants.mjs
          git diff --check
          rm .github/workflows/one-shot-audio-invariant-fix.yml
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add tests/architecture_invariants.mjs .github/workflows/one-shot-audio-invariant-fix.yml
          git commit -m "Align audio architecture invariant"
          git push
