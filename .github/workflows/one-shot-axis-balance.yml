name: Equal axis response diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["fix/world-fpv-eye-altitude"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-eye-altitude
      - name: Apply diagnostic-only pitch inertia compensation
        run: |
          set -euxo pipefail
          python3 -c 'from pathlib import Path; p=Path("esp32/Arondight45_DroneFC_Core.hpp"); s=p.read_text(); old="PID pitch_pid_{Gains{0.0030f, 0.0007f, 0.000010f, 0.18f, 0.38f, 55.0f}};"; new="PID pitch_pid_{Gains{0.003428571f, 0.000800f, 0.000011429f, 0.205714f, 0.38f, 55.0f}};"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
      - name: Host controller tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
      - name: Build browser SIL and probe equal forward/strafe commands
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          BUILD_DIR=/tmp/arondight45-axis-probe
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-controller.bundle.mjs
          python3 -c 'from pathlib import Path; p=Path("drone_simulator.html"); s=p.read_text(); m="<script type=\"module\" src=\"./sim/real_world_bootstrap.mjs\"></script>"; b=Path("/tmp/arondight45-simulator.bundle.mjs").read_text().replace("</script","<\\/script"); assert m in s; p.write_text(s.replace(m,"<script type=\"module\">\n"+b+"\n</script>"))'
          python3 -c 'from pathlib import Path; p=Path("drone_controller.html"); s=p.read_text(); m="<script type=\"module\" src=\"./sim/controller.mjs\"></script>"; b=Path("/tmp/arondight45-controller.bundle.mjs").read_text().replace("</script","<\\/script"); assert m in s; p.write_text(s.replace(m,"<script type=\"module\">\n"+b+"\n</script>"))'
          python3 -c 'from pathlib import Path; p=Path("tests/dual_phone_smoke.mjs"); s=p.read_text(); a="lcx,lcy-lr*.72"; b="lcx+lr*.65,lcy"; assert s.count(a)==1 and s.count(b)==1; p.write_text(s.replace(a,"lcx,lcy-lr*.70",1).replace(b,"lcx+lr*.70,lcy",1))'
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/arondight45-axis-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/dual_phone_smoke.mjs http://127.0.0.1:4174
