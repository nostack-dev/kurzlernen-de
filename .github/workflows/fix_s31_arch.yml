name: Repair stale S31 architecture invariant
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/fix_s31_arch.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Remove obsolete Pages browser-smoke coupling and verify all invariants
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/architecture_invariants.mjs')
          s=p.read_text()
          old='requireText(".github/workflows/deploy.yml","world_building_collision_browser_smoke.mjs");\n'
          if s.count(old)!=1:
              raise SystemExit(f'expected one obsolete invariant, found {s.count(old)}')
          p.write_text(s.replace(old,''))
          PY
          set +e
          node tests/architecture_invariants.mjs > /tmp/arch.out 2>&1
          code=$?
          set -e
          cat /tmp/arch.out
          { cat /tmp/arch.out; printf '\nEXIT_CODE=%s\n' "$code"; } > S31_ARCH_DIAG.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix_s31_arch.yml
          git add tests/architecture_invariants.mjs S31_ARCH_DIAG.txt
          git commit -m 'Align S31 architecture gate with release workflow'
          git push origin HEAD:main
