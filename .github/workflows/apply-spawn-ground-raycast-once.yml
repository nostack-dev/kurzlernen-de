name: Apply spawn ground raycast once

on:
  push:
    paths:
      - '.github/workflows/apply-spawn-ground-raycast-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch simulator spawn against actual Box3D ground
        run: |
          python3 - <<'PY'
          from pathlib import Path

          simulator=Path('sim/simulator.mjs')
          text=simulator.read_text()

          marker='  groundRange(maxRange=12){\n'
          insert='''  spawnGroundRaycast(point=this.position()){
    const x=Number(point?.[0])||0,y=Number(point?.[1])||0,currentZ=Number(point?.[2])||0,top=Math.max(256,currentZ+128),bottom=-256,translation=[0,0,bottom-top],filter=b3.b3DefaultQueryFilter();filter.categoryBits=QUERY_CAMERA;filter.maskBits=COLLISION_TERRAIN;const hit=b3.b3World_CastRayClosest(this.world,[x,y,top],translation,filter),fraction=Number(hit?.fraction);if(!hit?.hit||!Number.isFinite(fraction)||fraction<0||fraction>1)return{valid:false,groundZ:0,spawnZ:AIRFRAME_SPAWN_Z_M,fraction:1};const groundZ=top+translation[2]*fraction,spawnZ=groundZ+AIRFRAME_GROUND_SUPPORT_M+AIRFRAME_SPAWN_SEPARATION_M;return{valid:Number.isFinite(groundZ)&&Number.isFinite(spawnZ),groundZ,spawnZ,fraction};
  }
  snapSpawnToGround(){
    if(!this.body)return false;const position=this.position(),velocity=this.linear(),angular=this.angular(),reference=Array.isArray(this.worldBuildingLaunchPoint)&&this.worldBuildingLaunchPoint.length===2&&this.worldBuildingLaunchPoint.every(Number.isFinite)?this.worldBuildingLaunchPoint:[position[0],position[1]],nearLaunch=Math.hypot(position[0]-reference[0],position[1]-reference[1])<.14,idle=norm(velocity)<.20&&norm(angular)<.80;if(!nearLaunch||!idle)return false;const ray=this.spawnGroundRaycast(position),viewport=$("viewport");if(!ray.valid){if(viewport)viewport.dataset.airframeSpawnGroundRaycast="miss";return false;}const moved=Math.abs(position[2]-ray.spawnZ)>.0005;if(moved){b3.b3Body_SetTransform(this.body,[position[0],position[1],ray.spawnZ],this.rotation());b3.b3Body_SetLinearVelocity(this.body,[0,0,0]);b3.b3Body_SetAngularVelocity(this.body,[0,0,0]);this.syncPresentationSnapshots();}if(viewport){viewport.dataset.airframeSpawnGroundRaycast="hit";viewport.dataset.airframeSpawnGroundZ=ray.groundZ.toFixed(4);viewport.dataset.airframeSpawnZ=ray.spawnZ.toFixed(4);viewport.dataset.airframeSpawnGroundClearanceM=(ray.spawnZ-ray.groundZ).toFixed(4);viewport.dataset.airframeSpawnGroundAdjusted=moved?"1":"0";}return moved;
  }
'''
          if marker not in text:
              raise SystemExit('groundRange marker not found')
          if 'spawnGroundRaycast(point=this.position())' not in text:
              text=text.replace(marker,insert+marker,1)

          old='  rebuildWorldBuildingCollisions(){if(!this.world)return;destroyWorldBuildingCollisionBodies(b3,this.worldBuildingCollisionState);this.resolveWorldBuildingLaunch();this.worldBuildingCollisionState=createWorldBuildingCollisionBodies(b3,this.world,this.worldBuildingCollisionSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,launchExclusionPoint:this.worldBuildingLaunchPoint||[Infinity,Infinity]});this.worldBuildingCollisionRevision++;}\n'
          new='''  rebuildWorldBuildingCollisions(){
    if(!this.world)return;destroyWorldBuildingCollisionBodies(b3,this.worldBuildingCollisionState);this.resolveWorldBuildingLaunch();this.worldBuildingCollisionState=createWorldBuildingCollisionBodies(b3,this.world,this.worldBuildingCollisionSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,launchExclusionPoint:this.worldBuildingLaunchPoint||[Infinity,Infinity]});this.snapSpawnToGround();this.worldBuildingCollisionRevision++;
  }
'''
          if old not in text:
              if 'this.snapSpawnToGround();this.worldBuildingCollisionRevision++' not in text:
                  raise SystemExit('rebuildWorldBuildingCollisions marker not found')
          else:
              text=text.replace(old,new,1)
          simulator.write_text(text)

          test=Path('tests/takeoff_agl_browser_smoke.mjs')
          t=test.read_text()
          old_field='    targetAgl:parseFloat(document.querySelector("#soloClearance")?.dataset.targetAglM||"NaN"),\n'
          new_field='''    targetAgl:parseFloat(document.querySelector("#soloClearance")?.dataset.targetAglM||"NaN"),
    spawnRaycast:document.querySelector("#viewport")?.dataset.airframeSpawnGroundRaycast||"",
    spawnGroundZ:parseFloat(document.querySelector("#viewport")?.dataset.airframeSpawnGroundZ||"NaN"),
    spawnZ:parseFloat(document.querySelector("#viewport")?.dataset.airframeSpawnZ||"NaN"),
'''
          if old_field not in t:
              if 'spawnRaycast:document.querySelector' not in t:
                  raise SystemExit('takeoff read marker not found')
          else:
              t=t.replace(old_field,new_field,1)
          old_assert='''  const groundVisualSamples=[];for(let i=0;i<20;i++){groundVisualSamples.push((await read()).visualSupport);await wait(50);}
'''
          new_assert='''  if(before.spawnRaycast!=="hit"||!Number.isFinite(before.spawnGroundZ)||!Number.isFinite(before.spawnZ))throw new Error(`spawn was not resolved from the active Box3D ground ray: ${JSON.stringify(before)}`);
  const spawnClearance=before.spawnZ-before.spawnGroundZ;if(!(spawnClearance>.020&&spawnClearance<.030))throw new Error(`spawn clearance is not derived from the airframe support envelope: ${spawnClearance} ${JSON.stringify(before)}`);
  const groundVisualSamples=[];for(let i=0;i<20;i++){groundVisualSamples.push((await read()).visualSupport);await wait(50);}
'''
          if old_assert not in t:
              if 'spawn was not resolved from the active Box3D ground ray' not in t:
                  raise SystemExit('takeoff pre-arm marker not found')
          else:
              t=t.replace(old_assert,new_assert,1)
          test.write_text(t)
          PY
          node --check sim/simulator.mjs
          node --check tests/takeoff_agl_browser_smoke.mjs
          git rm .github/workflows/apply-spawn-ground-raycast-once.yml
          git config user.name 'Christian Heinrich Hohlfeld'
          git config user.email 'chris.hohlfeld@gmail.com'
          git add sim/simulator.mjs tests/takeoff_agl_browser_smoke.mjs
          git commit -m 'Raycast drone spawn onto active Box3D ground'
          git push origin HEAD:main
