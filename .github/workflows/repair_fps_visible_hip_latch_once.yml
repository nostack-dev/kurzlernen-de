name: Repair FPS visible hip latch once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_fps_visible_hip_latch_once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latch last actually presented hip grip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=p.read_text()
          old='if(!aimPivotLatched||aimPivotMode!==mode){lastHipPivotValid=false;latchAimPivot(gun,pivot,camera,mode);}'
          new='if(!aimPivotLatched||aimPivotMode!==mode)latchAimPivot(gun,pivot,camera,mode);'
          assert s.count(old)==1, f'visible latch invalidation occurrences={s.count(old)}'
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          ! grep -q 'lastHipPivotValid=false;latchAimPivot' sim/first_person_weapon_runtime_v3.mjs
          grep -q 'last-presented-hip-v1' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Latch FPS aim from last presented hip grip'
          git push origin HEAD:main
