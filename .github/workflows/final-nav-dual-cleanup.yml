name: Final NAV and auto-start gate cleanup

on:
  push:
    paths:
      - '.github/workflows/final-nav-dual-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply exact product and gate fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p=Path(path); s=p.read_text(); count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, got {count}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          # Physical TRAINING terrain must not disappear under a 90 km/h aircraft.
          # Keep 5 m debug-grid spacing while extending the collision/visual plane.
          replace_one('sim/simulator.mjs',
              'const TERRAIN_SIZE = 600;',
              'const TERRAIN_SIZE = 20000;\nconst TERRAIN_GRID_DIVISIONS = 4000;')
          replace_one('sim/simulator.mjs',
              'const grid=new THREE.GridHelper(TERRAIN_SIZE,120,0x6b7d89,0xa7b6bd);',
              'const grid=new THREE.GridHelper(TERRAIN_SIZE,TERRAIN_GRID_DIVISIONS,0x6b7d89,0xa7b6bd);')
          replace_one('sim/simulator.mjs',
              'this.last={vx:this.filtered[0],vy:this.filtered[1],vz:this.filtered[2],agl,valid:velocityValid&&aglValid,velocityValid,aglValid,headingDeg,headingValid};',
              'this.last={vx:this.filtered[0],vy:this.filtered[1],vz:this.filtered[2],agl,valid:velocityValid&&aglValid&&headingValid,velocityValid,aglValid,headingDeg,headingValid};')
          replace_one('sim/simulator.mjs',
              'navigation_valid:latestNavigation.valid,nav_velocity_valid:latestNavigation.velocityValid,nav_agl_valid:latestNavigation.aglValid});',
              'navigation_valid:latestNavigation.valid,nav_velocity_valid:latestNavigation.velocityValid,nav_agl_valid:latestNavigation.aglValid,nav_heading_valid:latestNavigation.headingValid});')
          replace_one('sim/simulator.mjs',
              'nav_velocity_valid:Boolean(latestNavigation.velocityValid),nav_agl_valid:Boolean(latestNavigation.aglValid),target_ground_clearance:',
              'nav_velocity_valid:Boolean(latestNavigation.velocityValid),nav_agl_valid:Boolean(latestNavigation.aglValid),nav_heading_valid:Boolean(latestNavigation.headingValid),target_ground_clearance:')
          replace_one('sim/simulator.mjs',
              'soloRangeStatus.textContent=latestNavigation.valid?`AGL ${latestNavigation.agl.toFixed(1)} m`:latestNavigation.velocityValid?"NAV DEGRADED · AGL LOST":"NAV DEGRADED · ATTITUDE HOLD";',
              'soloRangeStatus.textContent=latestNavigation.valid?`AGL ${latestNavigation.agl.toFixed(1)} m`:!latestNavigation.velocityValid?"NAV DEGRADED · VELOCITY LOST":!latestNavigation.headingValid?"NAV DEGRADED · HEADING LOST":!latestNavigation.aglValid?"NAV DEGRADED · AGL LOST":"NAV DEGRADED · SENSOR STATE";')

          # Make the strict speed gate prove NAV continuity, including beyond the
          # previous ±300 m terrain boundary at 90 km/h.
          test=Path('tests/game_speed_envelope_smoke.mjs'); t=test.read_text()
          marker='const page=await browser.newPage(),errors=[];'
          if t.count(marker)!=1: raise SystemExit('speed page marker missing')
          t=t.replace(marker,marker+'\nconst STATE_NAVIGATION_DEGRADED=1<<7;',1)
          marker='const all=motion.filter(x=>x.time>=start&&x.time<=start+holdS+.15);'
          if t.count(marker)!=1: raise SystemExit('speed all-samples marker missing')
          t=t.replace(marker,marker+'\n  const degraded=all.filter(x=>x.fcState&STATE_NAVIGATION_DEGRADED);\n  if(degraded.length)throw new Error(`${direction.name}: NAV DEGRADED for ${degraded.length} samples during ${label}; velocity/heading/AGL continuity is a release requirement`);',1)
          old='maxResults.push(await runDirection(direction,{label:"90 km/h",targetMps:25.0,minSteadyMps:24.25,maxSteadyMps:25.75,holdS:12.0,t90LimitS:6.0}));'
          new='maxResults.push(await runDirection(direction,{label:"90 km/h",targetMps:25.0,minSteadyMps:24.25,maxSteadyMps:25.75,holdS:direction.name==="forward"?15.0:12.0,t90LimitS:6.0}));'
          if t.count(old)!=1: raise SystemExit('speed max marker missing')
          test.write_text(t.replace(old,new,1))

          # P2P begins from the user-visible startup contract: automatic FPV/Solo,
          # then EXIT reveals the main menu and its remote-first pairing path.
          replace_one('tests/dual_phone_smoke.mjs',
              '  await waitText(view,"#status","SIM ready",30000);\n  if(await view.$eval("#inputSource",element=>element.value)!=="remote")throw new Error("remote phone is not primary input");\n',
              '  await waitText(view,"#status","SIM ready",30000);\n  await view.waitForFunction(()=>document.body.classList.contains("solo-flight")&&document.querySelector("#viewport")?.dataset.cameraMode==="fpv",{timeout:5000});\n  await invoke(view,"#soloExit");\n  await view.waitForFunction(()=>!document.body.classList.contains("solo-flight"),{timeout:5000});\n  const menuState=await view.evaluate(()=>({input:document.querySelector("#inputSource")?.value||"",panel:getComputedStyle(document.querySelector(".panel")).display}));\n  if(menuState.input!=="remote"||menuState.panel==="none")throw new Error(`EXIT did not restore the remote-first main menu: ${JSON.stringify(menuState)}`);\n')
          PY

          # All one-shot workflows must be absent before hygiene/invariant tests.
          rm -f .github/workflows/nav-degraded-terrain-fix.yml
          rm -f .github/workflows/dual-phone-autostart-migration.yml
          rm -f .github/workflows/final-nav-dual-cleanup.yml

          node --check sim/simulator.mjs
          node --check tests/game_speed_envelope_smoke.mjs
          node --check tests/dual_phone_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check

          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Keep NAV valid across full flight envelope'
          git push origin HEAD:main
