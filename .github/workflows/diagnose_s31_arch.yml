name: Diagnose S31 architecture gate
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/diagnose_s31_arch.yml"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Capture architecture invariant failure
        run: |
          set -u
          set +e
          node tests/architecture_invariants.mjs > S31_ARCH_DIAG.txt 2>&1
          code=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$code" >> S31_ARCH_DIAG.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose_s31_arch.yml
          git add S31_ARCH_DIAG.txt
          git commit -m 'Record S31 architecture gate failure'
          git push origin HEAD:main
