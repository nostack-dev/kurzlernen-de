name: One-off speed authority

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use full physical inner-loop authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f"{path}: expected one match, got {n}: {old!r}")
              p.write_text(s.replace(old,new))

          state="esp32/Arondight45_StateControl.hpp"
          replace_one(state,"still under the same 5.5 m/s²\n        // and 30° physical envelopes.","still under the same 6.0 m/s²\n        // and 32° physical envelopes.")
          replace_one(state,"static constexpr float kMaxTiltDeg = 30.0f;","static constexpr float kMaxTiltDeg = 32.0f;")
          replace_one(state,"static constexpr float kMaxTiltTangent = 0.57735027f;","static constexpr float kMaxTiltTangent = 0.62486935f;")
          replace_one(state,"static constexpr float kMaxHorizontalAccelerationMps2 = 5.5f;","static constexpr float kMaxHorizontalAccelerationMps2 = 6.0f;")

          test="tests/state_control_test.cpp"
          p=Path(test); s=p.read_text()
          replacements={
            "CHECK(controller.debug().forward_accel_mps2 > 5.4f);":"CHECK(controller.debug().forward_accel_mps2 > 5.9f);",
            "// Nominal hover plus the full 5.5 m/s^2 horizontal request must still leave":"// Nominal hover plus the full 6.0 m/s^2 horizontal request must still leave",
            "CHECK(accel_norm > 5.4f && accel_norm < 5.6f);":"CHECK(accel_norm > 5.9f && accel_norm < 6.1f);",
            "CHECK(controller.debug().right_accel_mps2 > 5.4f);":"CHECK(controller.debug().right_accel_mps2 > 5.9f);",
          }
          for old,new in replacements.items():
              n=s.count(old)
              if n!=1: raise SystemExit(f"{test}: expected one match, got {n}: {old!r}")
              s=s.replace(old,new)
          p.write_text(s)

          arch="tests/architecture_invariants.mjs"
          p=Path(arch); s=p.read_text()
          anchor='requireText("esp32/Arondight45_StateControl.hpp","kStateMaxHorizontalSpeedMps = 25.0f");'
          addition='''requireText("esp32/Arondight45_StateControl.hpp","kStateMaxHorizontalSpeedMps = 25.0f");
          requireText("esp32/Arondight45_StateControl.hpp","kInnerAttitudeRangeDeg = 32.0f");
          requireText("esp32/Arondight45_StateControl.hpp","kMaxTiltDeg = 32.0f");
          requireText("esp32/Arondight45_StateControl.hpp","kMaxHorizontalAccelerationMps2 = 6.0f");
          forbidText("esp32/Arondight45_StateControl.hpp","kMaxTiltDeg = 30.0f", "GAME must retain the full physically representable 32-degree inner-loop attitude authority");'''
          if s.count(anchor)!=1: raise SystemExit('architecture speed anchor mismatch')
          p.write_text(s.replace(anchor,addition))
          PY
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git rm .github/workflows/oneoff-speed-authority.yml
          git add esp32/Arondight45_StateControl.hpp tests/state_control_test.cpp tests/architecture_invariants.mjs
          git commit -m "Use full GAME tilt authority for speed tracking"
          git push origin HEAD:main
