name: one-shot-vs-pair-ui
on:
  push:
    branches: ["fix/vs-room-pairing"]
    paths: [".github/workflows/one-shot-vs-pair-ui.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reliable pair-code fallback UI
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/real_world_bootstrap.mjs');s=p.read_text()
          old='import {LanVsSession,sameNetworkRoomKey} from "./lan_vs.mjs";'
          new='import {LanVsSession,sameNetworkRoomKey,manualRoomKey} from "./lan_vs.mjs";'
          assert s.count(old)==1,s.count(old);s=s.replace(old,new,1)

          old='''  installVsUi(){\n    const viewport=$("viewport");if(!viewport||$("lanVsButton"))return;const button=document.createElement("button");button.id="lanVsButton";button.type="button";button.textContent="FIND MATE · VS";button.style.cssText="position:absolute;z-index:6;left:max(10px,env(safe-area-inset-left));bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));padding:9px 12px;border:1px solid #70ddff88;border-radius:10px;background:#071522e8;color:#dff7ff;font:800 10px system-ui;letter-spacing:.05em;touch-action:manipulation";viewport.appendChild(button);const status=document.createElement("div");status.id="lanVsStatus";status.style.cssText="position:absolute;z-index:6;left:max(10px,env(safe-area-inset-left));bottom:max(52px,calc(env(safe-area-inset-bottom) + 48px));padding:5px 8px;border-radius:8px;background:#071522d9;color:#aeeaff;font:800 9px system-ui;display:none";viewport.appendChild(status);button.onclick=()=>this.toggleVs();\n  }\n  toggleVs(){if(this.vsSession||this.vsStarting)this.stopVs();else this.startVs();}\n  async startVs(){\n    if(this.vsSession||this.vsStarting)return;this.vsStarting=true;const button=$("lanVsButton"),status=$("lanVsStatus");if(button)button.textContent="VS · CONNECTING";if(status){status.style.display="block";status.textContent="Same network · finding mate…";}\n    try{const roomId=await sameNetworkRoomKey();if(!this.vsStarting)return;const session=new LanVsSession({onPeer:()=>{this.vsConnected=true;if(button)button.textContent="VS · CONNECTED";if(status)status.textContent="Same network · mate connected";this.ensureVsPeerMesh();},onPose:pose=>this.applyVsPose(pose),onOrigin:origin=>this.acceptVsOrigin(origin,status),onLeave:()=>{const mateWorld=this.vsWorldFromMate;this.vsConnected=false;this.vsSharedOrigin=null;this.vsSharedWorldAttempted=false;this.vsWorldFromMate=false;this.clearVsPeerPresentation();if(mateWorld){if(this.active)this.deactivate();this.originLon=null;this.originLat=null;}if(button)button.textContent="VS · WAITING";if(status){status.style.display="block";status.textContent="Same network · waiting for mate";}},onError:error=>{if(button)button.textContent="VS · RETRY";if(status)status.textContent=`VS unavailable · ${error?.message||error}`;}});this.vsSession=session;await session.start(roomId);if(!this.vsConnected){if(button)button.textContent="VS · WAITING";if(status)status.textContent="Same network · waiting for mate";}}catch(error){this.vsSession?.stop();this.vsSession=null;if(button)button.textContent="VS · RETRY";if(status){status.style.display="block";status.textContent=`VS unavailable · ${error?.message||error}`;}}finally{this.vsStarting=false;}\n  }'''
          new='''  installVsUi(){\n    const viewport=$("viewport");if(!viewport||$("lanVsButton"))return;const button=document.createElement("button");button.id="lanVsButton";button.type="button";button.textContent="FIND MATE · VS";button.style.cssText="position:absolute;z-index:6;left:max(10px,env(safe-area-inset-left));bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));padding:9px 12px;border:1px solid #70ddff88;border-radius:10px;background:#071522e8;color:#dff7ff;font:800 10px system-ui;letter-spacing:.05em;touch-action:manipulation";viewport.appendChild(button);const pair=document.createElement("button");pair.id="lanVsPairCode";pair.type="button";pair.textContent="PAIR CODE";pair.style.cssText="position:absolute;z-index:6;left:max(138px,calc(env(safe-area-inset-left) + 128px));bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));padding:9px 11px;border:1px solid #70ddff55;border-radius:10px;background:#071522d8;color:#aeeaff;font:800 10px system-ui;letter-spacing:.05em;touch-action:manipulation";viewport.appendChild(pair);const status=document.createElement("div");status.id="lanVsStatus";status.style.cssText="position:absolute;z-index:6;left:max(10px,env(safe-area-inset-left));bottom:max(52px,calc(env(safe-area-inset-bottom) + 48px));padding:5px 8px;border-radius:8px;background:#071522d9;color:#aeeaff;font:800 9px system-ui;display:none";viewport.appendChild(status);button.onclick=()=>this.toggleVs();pair.onclick=()=>this.startVsWithCode();\n  }\n  toggleVs(){if(this.vsSession||this.vsStarting)this.stopVs();else this.startVs();}\n  async startVsWithCode(){\n    const status=$("lanVsStatus");const raw=prompt("Enter the SAME VS pair code on both phones (4-12 letters or digits)","");if(raw===null)return;let roomId;try{roomId=await manualRoomKey(raw);}catch(error){if(status){status.style.display="block";status.textContent=error?.message||"Invalid pair code";}return;}this.stopVs();return this.startVs(roomId,"Pair code");\n  }\n  async startVs(roomId=null,label="Same network"){\n    if(this.vsSession||this.vsStarting)return;this.vsStarting=true;const button=$("lanVsButton"),status=$("lanVsStatus");if(button)button.textContent="VS · CONNECTING";if(status){status.style.display="block";status.textContent=`${label} · finding mate…`;}\n    try{roomId=roomId||await sameNetworkRoomKey();if(!this.vsStarting)return;const session=new LanVsSession({onPeer:()=>{this.vsConnected=true;if(button)button.textContent="VS · CONNECTED";if(status)status.textContent=`${label} · mate connected`;this.ensureVsPeerMesh();},onPose:pose=>this.applyVsPose(pose),onOrigin:origin=>this.acceptVsOrigin(origin,status),onLeave:()=>{const mateWorld=this.vsWorldFromMate;this.vsConnected=false;this.vsSharedOrigin=null;this.vsSharedWorldAttempted=false;this.vsWorldFromMate=false;this.clearVsPeerPresentation();if(mateWorld){if(this.active)this.deactivate();this.originLon=null;this.originLat=null;}if(button)button.textContent="VS · WAITING";if(status){status.style.display="block";status.textContent=`${label} · waiting for mate`; }},onError:error=>{if(button)button.textContent="VS · RETRY";if(status)status.textContent=`VS unavailable · ${error?.message||error}`;}});this.vsSession=session;await session.start(roomId);if(!this.vsConnected){if(button)button.textContent="VS · WAITING";if(status)status.textContent=`${label} · waiting for mate · use PAIR CODE if auto-find differs`;}}catch(error){this.vsSession?.stop();this.vsSession=null;if(button)button.textContent="VS · RETRY";if(status){status.style.display="block";status.textContent=`VS unavailable · ${error?.message||error} · try PAIR CODE`;}}finally{this.vsStarting=false;}\n  }'''
          assert s.count(old)==1,('vs block',s.count(old));s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check sim/real_world_bootstrap.mjs
          node --check sim/lan_vs.mjs
          node tests/lan_vs_smoke.mjs
      - name: Commit UI patch
        run: |
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sim/real_world_bootstrap.mjs
          git commit -m 'Add reliable VS pair-code fallback UI'
          git push
