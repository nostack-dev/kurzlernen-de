name: One-shot physics audio runtime fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-audio-runtime-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audio patch
        run: python3 tools/one_shot_audio_fix.py
      - name: Validate and commit
        run: |
          set -euxo pipefail
          node --check sim/simulator.mjs
          git diff --check
          rm tools/one_shot_audio_fix.py
          rm .github/workflows/one-shot-audio-runtime-fix.yml
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim/simulator.mjs tools/one_shot_audio_fix.py .github/workflows/one-shot-audio-runtime-fix.yml
          git commit -m "Fix live physics audio on iOS"
          git push
