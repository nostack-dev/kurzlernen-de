name: One-shot apply final SIL performance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-apply-final-sil-perf.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply tested performance patch
        run: |
          set -euxo pipefail
          python3 tools/apply_final_sil_perf.py
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Optimize browser SIL without changing flight truth"
          git push origin HEAD:main
