name: one-shot-vs-topbar-fix2
on:
  push:
    branches: ["fix/vs-signaling-fallback"]
    paths: [".github/workflows/one-shot-vs-topbar-fix2.yml"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch deterministic topbar attachment
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/real_world_bootstrap.mjs');s=p.read_text()
          old='''  installVsUi(){\n    const viewport=$("viewport");if(!viewport||$("lanVsButton"))return;const button=document.createElement("button");button.id="lanVsButton";button.type="button";button.textContent="FIND MATE";button.setAttribute("aria-label","Find nearby mate on the same network");button.style.cssText="border:1px solid #70ddff88;background:#071522e8;color:#dff7ff;font-weight:800;letter-spacing:.04em;touch-action:manipulation;white-space:nowrap";const attach=()=>{const topbar=$("soloTopbar");if(topbar&&button.parentNode!==topbar)topbar.appendChild(button);else if(!button.parentNode)viewport.appendChild(button);};attach();setTimeout(attach,0);button.onclick=()=>this.toggleVs();\n  }'''
          new='''  installVsUi(){\n    const viewport=$("viewport");if(!viewport||$("lanVsButton"))return;const button=document.createElement("button");button.id="lanVsButton";button.type="button";button.textContent="FIND MATE";button.setAttribute("aria-label","Find nearby mate on the same network");button.style.cssText="border:1px solid #70ddff88;background:#071522e8;color:#dff7ff;font-weight:800;letter-spacing:.04em;touch-action:manipulation;white-space:nowrap";button.onclick=()=>this.toggleVs();const attach=()=>{const topbar=$("soloTopbar");if(!topbar)return false;if(button.parentNode!==topbar)topbar.appendChild(button);return true;};if(!attach()){const observer=new MutationObserver(()=>{if(attach())observer.disconnect();});observer.observe(document.documentElement,{childList:true,subtree:true});}\n  }'''
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/real_world_bootstrap.mjs
          node tests/lan_vs_smoke.mjs
      - name: Build exact web WASM and Production simulator bundle
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          BUILD_DIR=/tmp/arondight45-topbar-build
          mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 \
            qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.1 @trystero-p2p/mqtt@0.25.1
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html');html=p.read_text();marker='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>'
          assert marker in html
          bundle=Path('/tmp/arondight45-simulator.bundle.mjs').read_text().replace('</script','<\\/script')
          p.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
      - name: Real browser layout regression
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/topbar-http.log 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true; rm -f "$GITHUB_WORKSPACE/node_modules"' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/solo_layout_smoke.mjs http://127.0.0.1:4174
      - name: Commit validated fix
        run: |
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -- drone_simulator.html
          rm -rf generated node_modules
          git add sim/real_world_bootstrap.mjs
          git commit -m 'Attach FIND MATE to flight topbar deterministically'
          git push
