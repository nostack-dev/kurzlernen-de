name: Repair FPS provider-owned viewmodel once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_fps_provider_owned_viewmodel_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make walk camera provider sole viewmodel transform owner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          weapon=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=weapon.read_text()
          old_hook='function ensureRenderHook(scene){if(!scene)return false;if(hookedScene===scene&&scene.onBeforeRender===renderHook)return true;if(hookedScene&&renderHook&&hookedScene.onBeforeRender===renderHook)hookedScene.onBeforeRender=previousSceneOnBeforeRender||(()=>{});hookedScene=scene;previousSceneOnBeforeRender=typeof scene.onBeforeRender==="function"?scene.onBeforeRender:null;renderHook=function(...args){previousSceneOnBeforeRender?.apply(this,args);const camera=args[2];if(!camera?.isPerspectiveCamera)return;const gun=scene.getObjectByName?.("WALK_PISTOL_3D");if(!gun)return;const mode=String(footWeapons()?.mode||"pistol");setWeaponModeVisual(gun,mode);applyLatchedAimTransform(gun,camera,performance.now());const view=viewport();if(view)view.dataset.walkWeaponPresentationCamera="player-perspective-render-camera-v3";};scene.onBeforeRender=renderHook;return true;}'
          new_hook='function ensureRenderHook(){return false;}\nfunction applyProviderPresentation({camera,scene,gun=null,now=performance.now()}={}){const root=gun||scene?.getObjectByName?.("WALK_PISTOL_3D");if(!camera||!root)return false;const mode=String(footWeapons()?.mode||"pistol");setWeaponModeVisual(root,mode);const applied=applyLatchedAimTransform(root,camera,now);const view=viewport();if(view){view.dataset.walkWeaponPresentationCamera="walk-camera-provider-v1";view.dataset.walkWeaponPresentationOwner="walk-camera-provider+weapon-runtime-v1";}return applied;}'
          assert old_hook in s, 'render hook contract changed'
          s=s.replace(old_hook,new_hook,1)
          s=s.replace('ensureRenderHook(scene);if(gun){','if(gun){',1)
          old_install='export function installFirstPersonWeaponRuntimeV3(){if(installed)return;installed=true;ensureAimStyle();addEventListener("arondight:foot-screen-aim",onScreenAim);'
          new_install='export function installFirstPersonWeaponRuntimeV3(){if(installed)return;installed=true;globalThis.__arondightFootWeaponPresentationV1=Object.freeze({apply:applyProviderPresentation});ensureAimStyle();addEventListener("arondight:foot-screen-aim",onScreenAim);'
          assert old_install in s, 'weapon runtime install contract changed'
          s=s.replace(old_install,new_install,1)
          weapon.write_text(s)

          walk=Path('sim/player_walk_mode_v4.mjs')
          w=walk.read_text()
          old_dead='if(isPlayerDead()){gun.visible=false;if(muzzleFlash)muzzleFlash.visible=false;return;}'
          assert old_dead in w, 'walk dead viewmodel branch changed'
          w=w.replace(old_dead,'if(isPlayerDead()){gun.visible=false;if(muzzleFlash)muzzleFlash.visible=false;return null;}',1)
          old_tail='gun.visible=true;if(muzzleFlash)muzzleFlash.visible=age>=0&&age<MUZZLE_FLASH_MS;}'
          assert old_tail in w, 'walk viewmodel tail changed'
          w=w.replace(old_tail,'gun.visible=true;if(muzzleFlash)muzzleFlash.visible=age>=0&&age<MUZZLE_FLASH_MS;return gun;}',1)
          old_provider='const walkCameraProvider=Object.freeze({isActive:()=>mode==="foot",apply:({camera,scene,now})=>{applyFootCamera(camera,now);placeWeapon(camera,scene,now);return WALK_CAMERA_PRESENTATION;}});'
          new_provider='const walkCameraProvider=Object.freeze({isActive:()=>mode==="foot",apply:({camera,scene,now})=>{applyFootCamera(camera,now);const gun=placeWeapon(camera,scene,now);globalThis.__arondightFootWeaponPresentationV1?.apply?.({camera,scene,gun,now});return WALK_CAMERA_PRESENTATION;}});'
          assert old_provider in w, 'walk camera provider contract changed'
          w=w.replace(old_provider,new_provider,1)
          walk.write_text(w)
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          node --check sim/player_walk_mode_v4.mjs
          grep -q 'walk-camera-provider+weapon-runtime-v1' sim/first_person_weapon_runtime_v3.mjs
          grep -q '__arondightFootWeaponPresentationV1?.apply' sim/player_walk_mode_v4.mjs
          ! grep -q 'scene.onBeforeRender=renderHook' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs sim/player_walk_mode_v4.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Make walk camera provider own FPS viewmodel transform'
          git push origin HEAD:main