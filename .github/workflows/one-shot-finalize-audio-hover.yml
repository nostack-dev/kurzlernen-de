name: One-shot finalize audio and hover

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-finalize-audio-hover.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final audio and hover changes
        run: |
          python3 tools/finalize_audio_hover.py
          node --check sim/simulator.mjs
          node --check sim/controller.mjs
          node --check sim/control_settings.mjs
          node --check sim/control_semantics.mjs
          git diff --check
      - name: Commit product and permanent tests
        run: |
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim tests
          git commit -m "Make rotor audio physical and add default hover AGL"
          git push
