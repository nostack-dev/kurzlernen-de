name: Repair synchronous aim latch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_aim_event_latch_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latch visible grip in pointer event
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=p.read_text()
          anchor='function latchedPivotLocal(camera,out=desiredPivotCameraLocal){return out.copy(latchedPivotCameraLocal);}'
          helper='function latchVisibleAimPivot(){const scene=bridge()?.threeScene,camera=bridge()?.threeCamera,gun=scene?.getObjectByName?.("WALK_PISTOL_3D"),mode=String(footWeapons()?.mode||"pistol"),pivot=gun?pivotNode(gun,mode):null;if(!gun||!camera||!pivot||gun.visible===false)return false;gun.updateMatrixWorld(true);camera.updateMatrixWorld?.(true);if(!aimPivotLatched||aimPivotMode!==mode)latchAimPivot(gun,pivot,camera,mode);return aimPivotLatched;}'
          assert anchor in s, 'camera-local latch anchor missing'
          s=s.replace(anchor,anchor+'\n'+helper,1)
          old='if(updateScreenVector(d,d.source||"touch-screen-drag",true))document.body.classList.add("foot-ads-active");'
          new='if(updateScreenVector(d,d.source||"touch-screen-drag",true)){latchVisibleAimPivot();document.body.classList.add("foot-ads-active");}'
          assert old in s, 'screen aim activation contract changed'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          grep -q 'function latchVisibleAimPivot' sim/first_person_weapon_runtime_v3.mjs
          grep -q 'latchVisibleAimPivot();document.body.classList.add' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Latch FPS grip at touch event time'
          git push origin HEAD:main
