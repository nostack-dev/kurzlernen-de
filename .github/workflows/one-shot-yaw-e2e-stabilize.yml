name: One-shot yaw E2E stabilization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-yaw-e2e-stabilize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend real yaw command duration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/dual_phone_smoke.mjs')
          s=p.read_text()
          old='const turnStart=await simTime(view);await waitSim(view,turnStart+.22,25000);'
          new='const turnStart=await simTime(view);await waitSim(view,turnStart+.30,25000);'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/dual_phone_smoke.mjs
          git diff --check
      - name: Commit test only
        run: |
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add tests/dual_phone_smoke.mjs
          git commit -m "Stabilize real yaw E2E command duration"
          git push
