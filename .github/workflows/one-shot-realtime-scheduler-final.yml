name: One-shot exact realtime scheduler final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-realtime-scheduler-final.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Decouple 1kHz simulation clock from display waits
        shell: bash
        run: |
          set -euxo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Decouple exact 1kHz SIL from display waits"
          git push origin HEAD:main
