name: Repair FPS camera world origin once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_fps_camera_world_origin_once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use world-space camera origin for FPS anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=p.read_text()
          old='desiredPivotWorld.set(latchedPivotNdc.x,latchedPivotNdc.y,.5).unproject(camera).sub(camera.position).normalize().multiplyScalar(Math.max(.05,latchedPivotCameraLocal.length())).add(camera.position);desiredPivotCameraLocal.copy(desiredPivotWorld);camera.worldToLocal(desiredPivotCameraLocal);keepPivotAt(gun,pivot,desiredPivotWorld);'
          new='camera.getWorldPosition(rootWorldPosition);desiredPivotWorld.set(latchedPivotNdc.x,latchedPivotNdc.y,.5).unproject(camera).sub(rootWorldPosition).normalize().multiplyScalar(Math.max(.05,latchedPivotCameraLocal.length())).add(rootWorldPosition);desiredPivotCameraLocal.copy(desiredPivotWorld);camera.worldToLocal(desiredPivotCameraLocal);keepPivotAt(gun,pivot,desiredPivotWorld);'
          assert s.count(old)==1, f'FPS NDC anchor occurrences={s.count(old)}'
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          grep -q 'camera.getWorldPosition(rootWorldPosition)' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Use world camera origin for FPS grip anchor'
          git push origin HEAD:main