name: One-shot exact realtime SIM optimization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply and validate realtime optimization
        shell: bash
        run: |
          set -euxo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim/simulator.mjs tests/architecture_invariants.mjs REAL_WORLD_DIGITAL_TWIN.md
          git commit -m "Make 1kHz SIL execution realtime without changing physics"
          git pull --rebase origin main
          git push origin HEAD:main
