name: One-shot critical descent damping fix

on:
  push:
    branches: [main]

concurrency:
  group: vertical-damping-once
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply critically damped descent controller and permanent gates
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, got {n}: {old[:180]!r}')
              p.write_text(s.replace(old,new,1))

          replace_once(
              'esp32/Arondight45_StateControl.hpp',
              '''        const float vz_error = target_vz - nav.velocity_world_mps.z;
        const float requested_vertical_accel = clamp(kVerticalVelocityGain * vz_error,
                                                     -kMaxVerticalAccelerationMps2,
                                                     kMaxVerticalAccelerationMps2);''',
              '''        const float vz_error = target_vz - nav.velocity_world_mps.z;
        // The altitude/vertical-speed cascade is deliberately critically damped on descent.
        // With kAglToVerticalSpeed=2, a descent velocity gain of 8 gives zeta=1 for the
        // unsaturated second-order loop (s^2 + 8s + 16). Climb keeps the existing gain so
        // takeoff authority/feel is unchanged. This prevents high-AGL descents carrying
        // excess downward velocity through the 0.5 m AGL floor.
        const float vertical_velocity_gain = target_vz < 0.0f
            ? kVerticalDescentVelocityGain
            : kVerticalVelocityGain;
        const float requested_vertical_accel = clamp(vertical_velocity_gain * vz_error,
                                                     -kMaxVerticalAccelerationMps2,
                                                     kMaxVerticalAccelerationMps2);'''
          )
          replace_once(
              'esp32/Arondight45_StateControl.hpp',
              '''    static constexpr float kVerticalVelocityGain = 4.0f;
    static constexpr float kMaxVerticalAccelerationMps2 = 50.0f;''',
              '''    static constexpr float kVerticalVelocityGain = 4.0f;
    static constexpr float kVerticalDescentVelocityGain = 8.0f;
    static constexpr float kMaxVerticalAccelerationMps2 = 50.0f;'''
          )

          p=Path('tests/state_control_test.cpp'); s=p.read_text()
          marker='''    // Vertical controller ceilings are deliberately above nominal plant authority.
    // Full-clearance error must be able to saturate the physical motor path rather
    // than an old 2 m/s / 4 m/s^2 camera-drone software envelope.
    controller.reset();
    auto high_clearance = base_rc(true);high_clearance.ch[fc::kStateClearanceChannel] = 1811;
    nav = {{0.0f,0.0f,0.0f},0.5f,true};cmd=controller.run(high_clearance,nav,0.0f,true,0.001f);
    CHECK(controller.debug().target_vz_mps > 29.9f);CHECK(controller.debug().vertical_accel_mps2 > 49.9f);CHECK(cmd.throttle > 0.99f);
'''
          addition='''
    // Regression for the real UP->DOWN ground strike: a descent from 6 m to the
    // 0.5 m floor must be non-overshooting in the controller's own vertical plant.
    // The old 2x/4x cascade is underdamped and reaches about 0.26 m in this model;
    // the descent-only 8x velocity damping is critically damped and stays >= target.
    controller.reset();
    auto floor_clearance = base_rc(true);
    floor_clearance.ch[fc::kStateClearanceChannel] = 172;
    nav = {{0.0f, 0.0f, 0.0f}, 6.0f, true};
    float minimum_agl = nav.agl_m;
    for (int i = 0; i < 6000; ++i) {
        cmd = controller.run(floor_clearance, nav, 0.0f, true, 0.001f);
        nav.velocity_world_mps.z += controller.debug().vertical_accel_mps2 * 0.001f;
        nav.agl_m += nav.velocity_world_mps.z * 0.001f;
        minimum_agl = std::min(minimum_agl, nav.agl_m);
    }
    CHECK(minimum_agl >= fc::kStateMinClearanceM - 0.002f);
    CHECK(std::fabs(nav.agl_m - fc::kStateMinClearanceM) < 0.01f);
    CHECK(std::fabs(nav.velocity_world_mps.z) < 0.01f);

    // While already descending faster than the local target, descent damping must
    // request a strong upward brake immediately rather than carry momentum downward.
    controller.reset();
    nav = {{0.0f, 0.0f, -5.0f}, 2.0f, true};
    cmd = controller.run(floor_clearance, nav, 0.0f, true, 0.001f);
    CHECK(controller.debug().target_vz_mps < -2.9f && controller.debug().target_vz_mps > -3.1f);
    CHECK(controller.debug().vertical_accel_mps2 > 15.9f);
'''
          if addition not in s:
              if marker not in s: raise SystemExit('vertical test insertion marker missing')
              s=s.replace(marker,marker+addition,1)
          p.write_text(s)

          # Make WORLD FPV/FOLLOW/THIRD frame-registration jitter a blocking release gate.
          p=Path('.github/workflows/deploy.yml'); s=p.read_text()
          marker='          CHROME_BIN="$CHROME_BIN" node tests/android_render_browser_smoke.mjs http://127.0.0.1:4174\n'
          line='          CHROME_BIN="$CHROME_BIN" node tests/world_fpv_frame_lock_smoke.mjs http://127.0.0.1:4174\n'
          if line not in s:
              if marker not in s: raise SystemExit('deploy browser insertion marker missing')
              s=s.replace(marker,marker+line,1)
          p.write_text(s)
          PY

          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state-control-test
          /tmp/state-control-test
          node --check tests/takeoff_agl_browser_smoke.mjs
          node --check tests/world_fpv_frame_lock_smoke.mjs

          rm -f .github/vertical-damping.trigger
          rm -f .github/workflows/vertical-damping-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A esp32/Arondight45_StateControl.hpp tests/state_control_test.cpp .github/workflows/deploy.yml .github
          git diff --cached --check
          git commit -m 'Critically damp descent and gate world frame jitter'
          git push origin HEAD:main

      - name: Report one-shot result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="VERTICAL DAMPING · source=${GH_SHA} · patch=${PATCH_OUTCOME} · job=${JOB_STATUS} · https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
