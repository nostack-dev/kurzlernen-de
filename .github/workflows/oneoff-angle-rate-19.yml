name: Validate final attitude bandwidth

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-angle-rate-19.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bandwidth correction
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('esp32/Arondight45_DroneFC_Core.hpp')
          s = p.read_text()
          old = 'constexpr float kAngleToRate = 2.2f;'
          new = 'constexpr float kAngleToRate = 1.9f;'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit product correction
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add esp32/Arondight45_DroneFC_Core.hpp
          git commit -m "Refine attitude-loop bandwidth for state control"
          git pull --rebase origin main
          git push origin HEAD:main
