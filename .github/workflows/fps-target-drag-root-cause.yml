name: FPS target drag root cause

on:
  push:
    branches: ["diag/fps-target-drag-root-cause"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-fps-target-drag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run one focused live browser diagnostic
        run: |
          set -euxo pipefail
          TMP=/tmp/fps-target-drag-diag
          rm -rf "$TMP" && mkdir -p "$TMP" && cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0
          ln -s "$TMP/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/fps_target_drag_root_cause_browser_diag.mjs "https://kurzlernen.de/drone_simulator.html?fps-target-diag=${GITHUB_SHA}"
