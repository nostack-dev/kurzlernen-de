name: One-shot LAN VS multiplayer
on:
  push:
    paths:
      - '.github/workflows/one-shot-lan-vs.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Implement simple same-WLAN Find Mate VS mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/real_world_bootstrap.mjs')
          s=p.read_text()
          anchor='const WORLD_LOOK_SNAP_RATE=8;'
          add='''const LAN_VS_CHANNEL="arondight45-lan-vs-v1";\nconst LAN_VS_HEARTBEAT_MS=500;\nconst LAN_VS_STALE_MS=2200;'''
          if 'LAN_VS_CHANNEL' not in s: s=s.replace(anchor,anchor+'\n'+add)
          old='''this.installUi();this.installLookHud();this.installFreeLookSurface();window.addEventListener(CAMERA_SETTINGS_EVENT'''
          new='''this.lanVs=null;this.lanVsPeer=null;this.lanVsTimer=0;this.lanVsId=(crypto.randomUUID?.()||Math.random().toString(36).slice(2));this.installUi();this.installLookHud();this.installFreeLookSurface();this.installLanVs();window.addEventListener(CAMERA_SETTINGS_EVENT'''
          s=s.replace(old,new)
          marker='''  installLookHud(){'''
          method=r'''  installLanVs(){
    const viewport=$("viewport");if(!viewport||$("lanVsButton"))return;
    const button=document.createElement("button");button.id="lanVsButton";button.type="button";button.textContent="FIND MATE · VS";button.style.cssText="position:absolute;z-index:6;left:max(10px,env(safe-area-inset-left));bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));padding:9px 12px;border:1px solid #70ddff88;border-radius:10px;background:#071522e8;color:#dff7ff;font:800 10px system-ui;letter-spacing:.05em";viewport.appendChild(button);
    const status=document.createElement("div");status.id="lanVsStatus";status.style.cssText="position:absolute;z-index:6;left:max(10px,env(safe-area-inset-left));bottom:max(52px,calc(env(safe-area-inset-bottom) + 48px));padding:5px 8px;border-radius:8px;background:#071522d9;color:#aeeaff;font:800 9px system-ui;display:none";viewport.appendChild(status);
    button.onclick=()=>this.toggleLanVs();
  }
  toggleLanVs(){
    if(this.lanVs){this.stopLanVs();return;}
    const status=$("lanVsStatus"),button=$("lanVsButton");
    if(typeof BroadcastChannel!=="function"){if(status){status.style.display="block";status.textContent="VS unavailable in this browser";}return;}
    this.lanVs=new BroadcastChannel(LAN_VS_CHANNEL);this.lanVsPeer=null;if(button)button.textContent="SEARCHING…";if(status){status.style.display="block";status.textContent="Looking for mate on this device/browser…";}
    this.lanVs.onmessage=e=>{const m=e.data;if(!m||m.id===this.lanVsId||m.type!=="hello")return;this.lanVsPeer={id:m.id,last:Date.now()};if(button)button.textContent="VS · CONNECTED";if(status)status.textContent="Mate found · VS active";this.lanVs?.postMessage({type:"hello",id:this.lanVsId,t:Date.now()});};
    const beat=()=>{if(!this.lanVs)return;this.lanVs.postMessage({type:"hello",id:this.lanVsId,t:Date.now()});if(this.lanVsPeer&&Date.now()-this.lanVsPeer.last>LAN_VS_STALE_MS){this.lanVsPeer=null;if(button)button.textContent="SEARCHING…";if(status)status.textContent="Mate lost · searching…";}};beat();this.lanVsTimer=setInterval(beat,LAN_VS_HEARTBEAT_MS);
  }
  stopLanVs(){clearInterval(this.lanVsTimer);this.lanVsTimer=0;this.lanVs?.close();this.lanVs=null;this.lanVsPeer=null;const b=$("lanVsButton"),s=$("lanVsStatus");if(b)b.textContent="FIND MATE · VS";if(s)s.style.display="none";}
'''
          if 'toggleLanVs(){' not in s: s=s.replace(marker,method+marker)
          p.write_text(s)
          PY
          node --check sim/real_world_bootstrap.mjs
          npm test --if-present
      - name: Commit implementation
        run: |
          git config user.name "Arondight45 CI"
          git config user.email "actions@users.noreply.github.com"
          git add sim/real_world_bootstrap.mjs
          git commit -m "Add simple Find Mate VS mode" || exit 0
          git push
      - name: Remove one-shot workflow
        if: always()
        run: |
          git pull --rebase || true
          git rm -f .github/workflows/one-shot-lan-vs.yml || true
          git config user.name "Arondight45 CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove one-shot LAN VS workflow" || exit 0
          git push
