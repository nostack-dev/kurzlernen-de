name: One-off speed hardening

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Apply reviewed speed/physics hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {n}: {old[:100]!r}")
              p.write_text(s.replace(old, new))

          # Linear drag is an airframe translation parameter. Do not use the same
          # fit knob to mutate angular damping, and keep the baseline 225 mm quad
          # horizontally symmetric until a REAL LOG fit proves anisotropy.
          replace_one(
              "sim/simulator.mjs",
              '    const relative=this.localVector(sub(this.linear(),p.wind)),cdA=[.035,.04,.07].map(x=>x*p.dragScale),drag=relative.map((v,i)=>-.5*p.rho*cdA[i]*v*Math.abs(v));b3.b3Body_ApplyForceToCenter(this.body,this.worldVector(drag),true);\n    const omega=this.localVector(this.angular()),angularDrag=omega.map(v=>-.0012*p.dragScale*v*Math.abs(v));b3.b3Body_ApplyTorque(this.body,this.worldVector(angularDrag),true);',
              '    const relative=this.localVector(sub(this.linear(),p.wind)),cdA=[.035,.035,.07].map(x=>x*p.dragScale),drag=relative.map((v,i)=>-.5*p.rho*cdA[i]*v*Math.abs(v));b3.b3Body_ApplyForceToCenter(this.body,this.worldVector(drag),true);\n    const omega=this.localVector(this.angular()),angularDrag=omega.map(v=>-.0012*v*Math.abs(v));b3.b3Body_ApplyTorque(this.body,this.worldVector(angularDrag),true);'
          )
          sim = Path("sim/simulator.mjs")
          text = sim.read_text()
          if text.count('arondight45FittedPhysics') != 2:
              raise SystemExit(f"unexpected fitted-physics key count: {text.count('arondight45FittedPhysics')}")
          sim.write_text(text.replace('arondight45FittedPhysics', 'arondight45FittedPhysicsV2'))

          replace_one("drone_simulator.html", '<label>Drag scale<input id="dragScale"', '<label>Linear drag scale<input id="dragScale"')

          rw = Path("tests/real_world_ui_smoke.mjs")
          rw_text = rw.read_text()
          if 'persisted 5-54 km/h GAME speed' not in rw_text:
              raise SystemExit('stale 5-54 success marker not found')
          rw.write_text(rw_text.replace('persisted 5-54 km/h GAME speed', 'persisted 5-90 km/h GAME speed'))

          speed = Path("tests/game_speed_envelope_smoke.mjs")
          s = speed.read_text()
          old_dirs = '''const directions=[
            {name:"forward",dx:0,dy:-1,axis:"forward",sign:1},
            {name:"backward",dx:0,dy:1,axis:"forward",sign:-1},
            {name:"right",dx:1,dy:0,axis:"right",sign:1},
            {name:"left",dx:-1,dy:0,axis:"right",sign:-1},
          ];'''
          new_dirs = '''const directions=[
            {name:"forward",dx:0,dy:-1,forwardUnit:1,rightUnit:0},
            {name:"backward",dx:0,dy:1,forwardUnit:-1,rightUnit:0},
            {name:"right",dx:1,dy:0,forwardUnit:0,rightUnit:1},
            {name:"left",dx:-1,dy:0,forwardUnit:0,rightUnit:-1},
            {name:"forward-right",dx:Math.SQRT1_2,dy:-Math.SQRT1_2,forwardUnit:Math.SQRT1_2,rightUnit:Math.SQRT1_2},
            {name:"forward-left",dx:-Math.SQRT1_2,dy:-Math.SQRT1_2,forwardUnit:Math.SQRT1_2,rightUnit:-Math.SQRT1_2},
            {name:"backward-right",dx:Math.SQRT1_2,dy:Math.SQRT1_2,forwardUnit:-Math.SQRT1_2,rightUnit:Math.SQRT1_2},
            {name:"backward-left",dx:-Math.SQRT1_2,dy:Math.SQRT1_2,forwardUnit:-Math.SQRT1_2,rightUnit:-Math.SQRT1_2},
          ];'''
          if s.count(old_dirs) != 1:
              raise SystemExit('direction block mismatch')
          s = s.replace(old_dirs, new_dirs)
          old_measure = '''  const signed=samples.map(x=>direction.sign*x[direction.axis]);
            const average=signed.reduce((a,b)=>a+b,0)/signed.length;
            const orthogonal=samples.reduce((a,x)=>a+Math.abs(direction.axis==="forward"?x.right:x.forward),0)/samples.length;
            const vertical=samples.reduce((a,x)=>a+Math.abs(x.vertical),0)/samples.length;
            const all=motion.filter(x=>x.time>=start&&x.time<=start+holdS+.15);
            const t90=all.find(x=>direction.sign*x[direction.axis]>=targetMps*.90)?.time-start;'''
          new_measure = '''  const signed=samples.map(x=>x.forward*direction.forwardUnit+x.right*direction.rightUnit);
            const average=signed.reduce((a,b)=>a+b,0)/signed.length;
            const orthogonal=samples.reduce((a,x)=>a+Math.abs(-x.forward*direction.rightUnit+x.right*direction.forwardUnit),0)/samples.length;
            const vertical=samples.reduce((a,x)=>a+Math.abs(x.vertical),0)/samples.length;
            const all=motion.filter(x=>x.time>=start&&x.time<=start+holdS+.15);
            const t90=all.find(x=>x.forward*direction.forwardUnit+x.right*direction.rightUnit>=targetMps*.90)?.time-start;'''
          if s.count(old_measure) != 1:
              raise SystemExit('measurement block mismatch')
          s = s.replace(old_measure, new_measure)
          s = s.replace('minSteadyMps:8.7,maxSteadyMps:10.9,holdS:7.0,t90LimitS:5.0', 'minSteadyMps:9.5,maxSteadyMps:10.5,holdS:8.0,t90LimitS:5.0')
          s = s.replace('if(defaultSpread>1.0)', 'if(defaultSpread>0.75)')
          s = s.replace('for(const direction of directions.slice(0,2)){', 'for(const direction of directions){')
          s = s.replace('minSteadyMps:22.5,maxSteadyMps:26.5,holdS:12.0,t90LimitS:10.0', 'minSteadyMps:23.75,maxSteadyMps:26.25,holdS:12.0,t90LimitS:10.0')
          old_spread = '  const maxSpread=Math.abs(maxResults[0].average-maxResults[1].average);\n  if(maxSpread>1.2)throw new Error(`90 km/h forward/backward asymmetry exceeds 1.2 m/s: ${JSON.stringify(maxResults)}`);'
          new_spread = '  const maxSpeeds=maxResults.map(x=>x.average),maxSpread=Math.max(...maxSpeeds)-Math.min(...maxSpeeds);\n  if(maxSpread>0.75)throw new Error(`90 km/h directional steady-state spread exceeds 0.75 m/s: ${JSON.stringify(maxResults)}`);'
          if s.count(old_spread) != 1:
              raise SystemExit('max spread block mismatch')
          s = s.replace(old_spread, new_spread)
          speed.write_text(s)

          arch = Path("tests/architecture_invariants.mjs")
          a = arch.read_text()
          anchor = 'requireText("sim/simulator.mjs","b3.b3World_Step(this.world,dt,4)");'
          addition = '''requireText("sim/simulator.mjs","b3.b3World_Step(this.world,dt,4)");
          requireText("sim/simulator.mjs","cdA=[.035,.035,.07].map(x=>x*p.dragScale)");
          requireText("sim/simulator.mjs","angularDrag=omega.map(v=>-.0012*v*Math.abs(v))");
          forbidText("sim/simulator.mjs","angularDrag=omega.map(v=>-.0012*p.dragScale", "linear drag fit must not mutate angular damping");
          requireText("sim/simulator.mjs",'localStorage.getItem("arondight45FittedPhysicsV2")');
          requireText("sim/simulator.mjs",'localStorage.setItem("arondight45FittedPhysicsV2"');
          forbidText("sim/simulator.mjs",'localStorage.getItem("arondight45FittedPhysics")', "stale fitted-physics model key can silently override current baseline");'''
          if a.count(anchor) != 1:
              raise SystemExit('architecture anchor mismatch')
          arch.write_text(a.replace(anchor, addition))
          PY
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git rm .github/workflows/oneoff-speed-hardening.yml
          git add sim/simulator.mjs drone_simulator.html tests/real_world_ui_smoke.mjs tests/game_speed_envelope_smoke.mjs tests/architecture_invariants.mjs
          git commit -m "Harden 90 kmh speed physics and acceptance"
          git push origin HEAD:main
