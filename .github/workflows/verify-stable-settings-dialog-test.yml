name: Verify stable settings dialog test

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply asserted test-only patch
        run: |
          set -euxo pipefail
          python3 tools/patch_stable_settings_dialog_test.py
          node --check tests/real_world_ui_smoke.mjs
          test "$(grep -o 'await openSettings();' tests/real_world_ui_smoke.mjs | wc -l)" -eq 8
          ! grep -Fq 'await page.click("#soloTopbar .phone-settings-button");await page.waitForFunction(()=>document.querySelector(".phone-settings-dialog")?.open,{timeout:5000});' tests/real_world_ui_smoke.mjs
      - name: Commit verified test blob to branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/real_world_ui_smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize repeated settings dialog E2E input"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
