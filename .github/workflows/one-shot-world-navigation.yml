          new='''    <div class="world-settings-status" data-world-status>TRAINING RANGE · local metric world</div>\n    <label class="phone-settings-toggle"><span>WORLD GRID</span><input data-world-grid type="checkbox"></label>\n    <label class="phone-settings-toggle"><span>360° VIEW · SNAP BACK ON RELEASE</span><input data-world-snapback type="checkbox"></label>\n    <label class="phone-settings-toggle"><span>MINIMAP FOLLOWS 360 CAMERA</span><input data-world-minimap-follow type="checkbox"></label>\n    <div class="world-settings-actions"><button type="button" data-world-use>USE MY GPS LOCATION</button><button type="button" data-world-training>TRAINING RANGE</button></div>\n    <p class="phone-settings-note">Drag the WORLD background for free 360° look. SNAP BACK off keeps the released view. MINIMAP follow off keeps the mini 3D map north-up. OSM map/building data is render/geospatial context only; motor, sensor, FC and rigid-body physics stay unchanged.</p>`;'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='''  const status=section.querySelector("[data-world-status]"),use=section.querySelector("[data-world-use]"),training=section.querySelector("[data-world-training]");'''
          new='''  const status=section.querySelector("[data-world-status]"),use=section.querySelector("[data-world-use]"),training=section.querySelector("[data-world-training]"),grid=section.querySelector("[data-world-grid]"),snapback=section.querySelector("[data-world-snapback]"),minimapFollow=section.querySelector("[data-world-minimap-follow]");'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='''  const renderButton=()=>{worldButton.dataset.active=bridge.active?"1":"0";worldButton.dataset.loading=bridge.loading?"1":"0";worldButton.textContent=bridge.loading?"WORLD…":bridge.active?"WORLD ✓":"WORLD";syncStatus();};'''
          new='''  const renderButton=()=>{worldButton.dataset.active=bridge.active?"1":"0";worldButton.dataset.loading=bridge.loading?"1":"0";worldButton.textContent=bridge.loading?"WORLD…":bridge.active?"WORLD ✓":"WORLD";const view=bridge.getViewSettings?.();if(view){grid.checked=Boolean(view.grid);snapback.checked=Boolean(view.snapBack);minimapFollow.checked=Boolean(view.minimapFollow360);}syncStatus();};'''
          assert s.count(old)==1;s=s.replace(old,new,1)
