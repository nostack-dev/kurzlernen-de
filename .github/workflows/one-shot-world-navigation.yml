          new='''  grid.addEventListener("change",()=>{bridge.setViewSettings?.({grid:grid.checked});renderButton();});snapback.addEventListener("change",()=>{bridge.setViewSettings?.({snapBack:snapback.checked});renderButton();});minimapFollow.addEventListener("change",()=>{bridge.setViewSettings?.({minimapFollow360:minimapFollow.checked});renderButton();});\n  use.addEventListener("click",activate);training.addEventListener("click",()=>{bridge.deactivate();renderButton();});'''
