name: Add pedestrian panic once
on:
  push:
    paths:
      - '.github/workflows/add-pedestrian-panic-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply panic FSM and combat danger events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(s, old, new, name):
              if old not in s:
                  raise SystemExit(f'missing marker in {name}: {old[:160]!r}')
              return s.replace(old,new,1)

          p=Path('sim/world_procedural_population.mjs'); s=p.read_text()
          import_marker='import {distanceToFoci,retentionDecision} from "./world_streaming_policy.mjs";\n'
          imports='''import {AUDIO_SETTINGS_EVENT,loadAudioSettings,normalizeAudioSettings} from "./audio_settings.mjs";\nimport {getSharedCombatAudioContext,playCombatAudio} from "./combat_audio_bank.mjs";\nimport {PEDESTRIAN_PANIC_GUNSHOT_RADIUS_M,PEDESTRIAN_PANIC_EXPLOSION_RADIUS_M,PEDESTRIAN_PANIC_RECOVER_MS,pedestrianFleeHeading,pedestrianPanicDurationMs,pedestrianPanicSpeedMps,pedestrianRecoveryWeight,pedestrianShouldPanic} from "./world_pedestrian_panic_logic.mjs";\n'''
          s=must_replace(s,import_marker,import_marker+imports,'world_procedural_population imports')
          s=must_replace(s,'const EARTH_RADIUS_M=6378137;\n','''const EARTH_RADIUS_M=6378137;\nconst WORLD_GUNSHOT_EVENT="arondight:world-gunshot";\nconst WORLD_EXPLOSION_EVENT="arondight:world-explosion";\nconst PANIC_SCREAM_MIN_GAP_MS=420;\n''','world_procedural_population constants')
          s=must_replace(s,'let populationAnchors=[{id:"world-origin",x:0,y:0}];','let populationAnchors=[{id:"world-origin",x:0,y:0}];\nlet audioSettings=loadAudioSettings(),lastPanicScreamAt=-Infinity,panicScreams=0,panicEvents=0;','world_procedural_population state')
          s=must_replace(s,'routeKey:"",parked:false,parkPose:null};}','routeKey:"",parked:false,parkPose:null,panicState:"calm",panicUntil:0,panicFromX:0,panicFromY:0,panicX:0,panicY:0,panicHeading:0,panicSpeed:0,panicLastAt:0,panicRecoverAt:0,panicRecoverX:0,panicRecoverY:0,nextPanicScreamAt:0};}','baseRecord')

          pattern=r'function makePerson\(index\)\{.*?return r;\}'
          replacement='''function makePerson(index){ensureShared();const s=hashText(`person:${index}`),group=new THREE.Group(),shirt=shared.shirts[s%shared.shirts.length],pants=shared.pants[(s>>>2)%shared.pants.length],skin=shared.skins[(s>>>4)%shared.skins.length],torso=new THREE.Mesh(shared.torso,shirt),head=new THREE.Mesh(shared.head,skin),r=baseRecord("person",index,group,shirt.color.getHex());torso.name="WORLD_PERSON_TORSO";head.name="WORLD_PERSON_HEAD";torso.position.z=1.05;head.position.z=1.58;group.add(torso,head);for(const y of[-.11,.11]){const leg=new THREE.Mesh(shared.leg,pants);leg.name=y<0?"WORLD_PERSON_LEG_L":"WORLD_PERSON_LEG_R";leg.position.set(0,y,.48);group.add(leg);}for(const y of[-.31,.31]){const arm=new THREE.Mesh(shared.arm,shirt);arm.name=y<0?"WORLD_PERSON_ARM_L":"WORLD_PERSON_ARM_R";arm.userData.worldPersonArm=true;arm.position.set(0,y,1.07);group.add(arm);}group.userData.worldPedestrianFsm="calm+panic+recover-v1";return r;}'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('makePerson replacement failed')

          s=s.replace('record.physicsPose=null;record.routeDirection=record.seed&1?-1:1;','record.physicsPose=null;record.panicState="calm";record.panicUntil=0;record.panicLastAt=0;record.routeDirection=record.seed&1?-1:1;',1)

          marker='function respawnAllowed(record){'
          if marker not in s: raise SystemExit('respawnAllowed marker missing')
          panic_code='''function pointInPolygon(x,y,points){if(!Array.isArray(points)||points.length<3)return false;let inside=false;for(let i=0,j=points.length-1;i<points.length;j=i++){const a=points[i],b=points[j],xi=Number(a?.[0]),yi=Number(a?.[1]),xj=Number(b?.[0]),yj=Number(b?.[1]);if(![xi,yi,xj,yj].every(Number.isFinite))continue;const cross=(yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/((yj-yi)||1e-12)+xi;if(cross)inside=!inside;}return inside;}\nfunction panicBlocked(x,y){for(const prism of bridge()?.buildingCollisionSnapshot?.prisms||[])if(pointInPolygon(x,y,prism.points))return true;return false;}\nfunction turnToward(current,target,maxStep){const delta=Math.atan2(Math.sin(target-current),Math.cos(target-current));return current+clamp(delta,-maxStep,maxStep);}\nfunction setPersonPanicPose(record,weight,epoch=0){const w=clamp(weight,0,1),leftArm=record.group.getObjectByName?.("WORLD_PERSON_ARM_L"),rightArm=record.group.getObjectByName?.("WORLD_PERSON_ARM_R"),leftLeg=record.group.getObjectByName?.("WORLD_PERSON_LEG_L"),rightLeg=record.group.getObjectByName?.("WORLD_PERSON_LEG_R"),run=Math.sin(epoch*12+record.index*.9);for(const arm of[leftArm,rightArm])if(arm){const side=Math.sign(arm.position.y)||1;arm.position.z=1.07+w*(.45+.025*Math.sin(epoch*9+record.index));arm.rotation.x=side*w*(.22+.07*Math.sin(epoch*7+record.index));arm.rotation.y=w*.08*run;}if(leftLeg){leftLeg.rotation.x=run*.62*w;leftLeg.rotation.y=0;}if(rightLeg){rightLeg.rotation.x=-run*.62*w;rightLeg.rotation.y=0;}record.group.userData.worldPedestrianHandsUp=w>.45;record.group.userData.worldPedestrianPanicWeight=w.toFixed(2);}\nfunction dangerPosition(detail){const p=detail?.position??detail?.origin;if(Array.isArray(p)&&p.length>=2&&Number.isFinite(Number(p[0]))&&Number.isFinite(Number(p[1])))return{x:Number(p[0]),y:Number(p[1]),z:Number(p[2])||0};if(p&&Number.isFinite(Number(p.x))&&Number.isFinite(Number(p.y)))return{x:Number(p.x),y:Number(p.y),z:Number(p.z)||0};return null;}\nfunction playPanicScream(record,now,seed){if(now-lastPanicScreamAt<PANIC_SCREAM_MIN_GAP_MS||now<record.nextPanicScreamAt||!audioSettings.soundEnabled||audioSettings.fxVolume<=0)return false;const ctx=getSharedCombatAudioContext({resume:true});if(!ctx||ctx.state!=="running")return false;const camera=bridge()?.threeCamera;if(!camera)return false;camera.getWorldPosition(cameraPos);record.group.getWorldPosition(tmp);const distance=tmp.distanceTo(cameraPos);if(distance>62)return false;let destination=ctx.destination,panNode=null;try{if(typeof ctx.createStereoPanner==="function"){panNode=ctx.createStereoPanner();const fwd=new THREE.Vector3(),rightward=new THREE.Vector3(),relative=tmp.clone().sub(cameraPos);camera.getWorldDirection(fwd);rightward.crossVectors(fwd,new THREE.Vector3(0,0,1)).normalize();panNode.pan.value=relative.lengthSq()>.01?clamp(relative.normalize().dot(rightward),-.85,.85):0;panNode.connect(ctx.destination);destination=panNode;}}catch{panNode=null;destination=ctx.destination;}const distanceGain=clamp(1-distance/68,.10,1),played=playCombatAudio(ctx,"scream",{destination,gain:.075*distanceGain*audioSettings.fxVolume/100,playbackRate:.92+u(seed,17)*.18,minIntervalMs:300});if(played){lastPanicScreamAt=now;panicScreams++;record.nextPanicScreamAt=now+2900+u(seed,18)*2200;setTimeout(()=>{try{panNode?.disconnect();}catch{}},1000);}else try{panNode?.disconnect();}catch{}return played;}\nfunction triggerPedestrianPanic(detail,kind="gunshot",now=performance.now()){const danger=dangerPosition(detail);if(!danger)return 0;let affected=0;for(const record of records){if(record.kind!=="person"||record.deadUntil||record.group.visible===false)continue;record.group.getWorldPosition(tmp);const distance=Math.hypot(tmp.x-danger.x,tmp.y-danger.y);if(!pedestrianShouldPanic({kind,distanceM:distance}))continue;const seed=hashText(`${record.id}:${kind}:${Math.floor(now/350)}`);if(record.panicState!=="panic"){record.panicX=record.group.position.x;record.panicY=record.group.position.y;}record.panicState="panic";record.panicFromX=danger.x;record.panicFromY=danger.y;record.panicHeading=pedestrianFleeHeading({personX:record.panicX,personY:record.panicY,dangerX:danger.x,dangerY:danger.y,jitterRad:range(seed,7,-.28,.28)});record.panicSpeed=pedestrianPanicSpeedMps(u(seed,8));record.panicUntil=Math.max(record.panicUntil,now+pedestrianPanicDurationMs(u(seed,9)));record.panicLastAt=now;record.group.userData.worldPedestrianFsm="panic";setPersonPanicPose(record,1,Date.now()/1000);if(u(seed,10)<.58)playPanicScream(record,now,seed);affected++;}if(affected){panicEvents++;const v=viewport();if(v){v.dataset.worldPedestrianPanicLastKind=kind;v.dataset.worldPedestrianPanicLastAffected=String(affected);v.dataset.worldPedestrianPanicEvents=String(panicEvents);}}return affected;}\nfunction updatePanicRecord(record,epoch,now){if(record.panicState==="panic"&&now<record.panicUntil){const dt=clamp((now-record.panicLastAt)/1000,0,.05);record.panicLastAt=now;const desired=pedestrianFleeHeading({personX:record.panicX,personY:record.panicY,dangerX:record.panicFromX,dangerY:record.panicFromY,jitterRad:.10*Math.sin(epoch*2.1+record.index)});record.panicHeading=turnToward(record.panicHeading,desired,2.8*dt);let nx=record.panicX+Math.cos(record.panicHeading)*record.panicSpeed*dt,ny=record.panicY+Math.sin(record.panicHeading)*record.panicSpeed*dt;if(panicBlocked(nx,ny)){const sign=record.index&1?1:-1,alternate=record.panicHeading+sign*1.18,nx=record.panicX+Math.cos(alternate)*record.panicSpeed*dt,ny=record.panicY+Math.sin(alternate)*record.panicSpeed*dt;if(!panicBlocked(nx,ny))record.panicHeading=alternate;else{nx=record.panicX;ny=record.panicY;record.panicHeading+=sign*.55;}}record.panicX=nx;record.panicY=ny;record.group.position.set(nx,ny,.018*Math.sin(epoch*13+record.index));record.group.rotation.set(0,0,record.panicHeading);setPersonPanicPose(record,1,epoch);record.group.visible=true;return true;}if(record.panicState==="panic"){record.panicState="recover";record.panicRecoverAt=now;record.panicRecoverX=record.panicX;record.panicRecoverY=record.panicY;record.group.userData.worldPedestrianFsm="recover";}if(record.panicState==="recover"){const elapsed=now-record.panicRecoverAt,weight=pedestrianRecoveryWeight(elapsed),blend=1-weight,target=rectSample(record,epoch),x=record.panicRecoverX+(target.x-record.panicRecoverX)*blend,y=record.panicRecoverY+(target.y-record.panicRecoverY)*blend;record.group.position.set(x,y,.01*Math.sin(epoch*6+record.index));const dx=target.x-x,dy=target.y-y;record.group.rotation.set(0,0,Math.hypot(dx,dy)>.01?Math.atan2(dy,dx):target.yaw);setPersonPanicPose(record,weight,epoch);record.group.visible=true;if(elapsed>=PEDESTRIAN_PANIC_RECOVER_MS){record.panicState="calm";record.panicUntil=0;record.group.userData.worldPedestrianFsm="calm";setPersonPanicPose(record,0,epoch);}return true;}return false;}\n\n'''
          s=s.replace(marker,panic_code+marker,1)

          old_update=re.search(r'function updateRecord\(record,epoch,now\)\{.*?\}\n\nfunction styleMap',s,flags=re.S)
          if not old_update: raise SystemExit('updateRecord function not found')
          new_update='''function updateRecord(record,epoch,now){if(record.kind==="car"||record.kind==="bus"){updatePhysicalVehicle(record,epoch,now);return;}if(!respawnAllowed(record)){record.group.visible=false;return;}if(record.kind==="person"&&updatePanicRecord(record,epoch,now))return;if(shouldRecycleRecord(record,now))recycleRecord(record);if(record.kind==="bird"){const m=record.motion,a=epoch*m.omega+m.phase,flap=.82+.2*Math.sin(epoch*10+record.index),base=recordAnchor(record);record.group.position.set(base.x+m.cx+Math.cos(a)*m.rx,base.y+m.cy+Math.sin(a*.94)*m.ry,m.z+Math.sin(a*2.3+record.index)*2.1);record.group.rotation.set(.08*Math.sin(a*3),0,a+Math.PI/2);record.group.scale.set(1,flap,1);record.group.visible=true;return;}const p=rectSample(record,epoch),z=.01*Math.sin(epoch*6+record.index);record.group.position.set(p.x,p.y,z);record.group.rotation.set(0,0,p.yaw);if(record.kind==="person")setPersonPanicPose(record,0,epoch);record.group.visible=true;}\n\nfunction styleMap'''
          s=s[:old_update.start()]+new_update+s[old_update.end():]

          s=s.replace('if(record.kind==="person"){record.deadUntil=now+10000;','if(record.kind==="person"){record.panicState="calm";record.panicUntil=0;setPersonPanicPose(record,0,now/1000);record.deadUntil=now+10000;',1)
          s=s.replace('let alive=0,physicalVehicles=0,lowestVehicleZ=Infinity;for(const record of records){updateRecord(record,epoch,now);if(record.group.visible)alive++;','let alive=0,physicalVehicles=0,lowestVehicleZ=Infinity,panicking=0;for(const record of records){updateRecord(record,epoch,now);if(record.group.visible)alive++;if(record.kind==="person"&&record.panicState!=="calm")panicking++;',1)
          s=s.replace('v.dataset.worldPopulationRecycles=String(populationRecycleCount);','v.dataset.worldPopulationRecycles=String(populationRecycleCount);v.dataset.worldPedestrianPanic="gunshot+explosion-flee+hands-up+scream-v1";v.dataset.worldPedestrianPanicCount=String(panicking);v.dataset.worldPedestrianPanicScreams=String(panicScreams);v.dataset.worldPedestrianPanicGunshotRadiusM=String(PEDESTRIAN_PANIC_GUNSHOT_RADIUS_M);v.dataset.worldPedestrianPanicExplosionRadiusM=String(PEDESTRIAN_PANIC_EXPLOSION_RADIUS_M);',1)
          old_install='export function installWorldProceduralPopulation(){if(installed)return;installed=true;globalThis.addEventListener(VS_FX_EVENT,handleRemoteFx);requestAnimationFrame(frame);}'
          new_install='export function installWorldProceduralPopulation(){if(installed)return;installed=true;globalThis.addEventListener(VS_FX_EVENT,handleRemoteFx);globalThis.addEventListener(WORLD_GUNSHOT_EVENT,event=>triggerPedestrianPanic(event?.detail||{},"gunshot"));globalThis.addEventListener(WORLD_EXPLOSION_EVENT,event=>triggerPedestrianPanic(event?.detail||{},"explosion"));globalThis.addEventListener(AUDIO_SETTINGS_EVENT,event=>{audioSettings=normalizeAudioSettings(event.detail?.settings||loadAudioSettings());});requestAnimationFrame(frame);}'
          s=must_replace(s,old_install,new_install,'population install')
          p.write_text(s)

          p=Path('sim/gameplay_final_runtime_v2.mjs'); s=p.read_text()
          old='flashWeapon();audioShot(footWeapon==="smg"?.16:.24);\n'
          new='flashWeapon();audioShot(footWeapon==="smg"?.16:.24);window.dispatchEvent(new CustomEvent("arondight:world-gunshot",{detail:{position:[ray.origin.x,ray.origin.y,ray.origin.z],end:[end.x,end.y,end.z],source:"player",weapon:footWeapon}}));\n'
          s=must_replace(s,old,new,'gameplay foot shot')
          p.write_text(s)

          p=Path('sim/wanted_police_drones.mjs'); s=p.read_text()
          old='showTracer(drone,drone.root.position,tmpPosition,now);playTone({frequency:310,endFrequency:145,duration:.075,gain:.015,type:"square"});const damaged='
          new='showTracer(drone,drone.root.position,tmpPosition,now);playTone({frequency:310,endFrequency:145,duration:.075,gain:.015,type:"square"});window.dispatchEvent(new CustomEvent("arondight:world-gunshot",{detail:{position:[drone.root.position.x,drone.root.position.y,drone.root.position.z],end:[tmpPosition.x,tmpPosition.y,tmpPosition.z],source:"police-drone",weapon:"police"}}));const damaged='
          s=must_replace(s,old,new,'police shot')
          p.write_text(s)

          Path('tests/pedestrian_panic_contract_test.mjs').write_text('''import assert from "node:assert/strict";import {readFileSync} from "node:fs";import {PEDESTRIAN_PANIC_GUNSHOT_RADIUS_M,PEDESTRIAN_PANIC_EXPLOSION_RADIUS_M,PEDESTRIAN_PANIC_RECOVER_MS,pedestrianFleeHeading,pedestrianPanicDurationMs,pedestrianPanicSpeedMps,pedestrianRecoveryWeight,pedestrianShouldPanic} from "../sim/world_pedestrian_panic_logic.mjs";\nassert.equal(PEDESTRIAN_PANIC_GUNSHOT_RADIUS_M,36);assert.equal(PEDESTRIAN_PANIC_EXPLOSION_RADIUS_M,52);assert.ok(PEDESTRIAN_PANIC_EXPLOSION_RADIUS_M>PEDESTRIAN_PANIC_GUNSHOT_RADIUS_M);assert.equal(pedestrianShouldPanic({kind:"gunshot",distanceM:35.9}),true);assert.equal(pedestrianShouldPanic({kind:"gunshot",distanceM:36.1}),false);assert.equal(pedestrianShouldPanic({kind:"explosion",distanceM:51.9}),true);assert.ok(Math.abs(pedestrianFleeHeading({personX:10,personY:0,dangerX:0,dangerY:0}))<1e-9);assert.ok(pedestrianPanicSpeedMps(0)>=3.4&&pedestrianPanicSpeedMps(1)<=5.2);assert.ok(pedestrianPanicDurationMs(0)>=4800&&pedestrianPanicDurationMs(1)<=7600);assert.equal(pedestrianRecoveryWeight(0),1);assert.equal(pedestrianRecoveryWeight(PEDESTRIAN_PANIC_RECOVER_MS),0);\nconst pop=readFileSync("sim/world_procedural_population.mjs","utf8"),game=readFileSync("sim/gameplay_final_runtime_v2.mjs","utf8"),police=readFileSync("sim/wanted_police_drones.mjs","utf8");for(const marker of ["calm+panic+recover-v1","WORLD_PERSON_ARM_L","WORLD_PERSON_ARM_R","panicBlocked","playPanicScream","gunshot+explosion-flee+hands-up+scream-v1"])assert.ok(pop.includes(marker),`missing panic runtime marker ${marker}`);assert.ok(game.includes("arondight:world-gunshot"),"player shots do not emit danger event");assert.ok(police.includes("arondight:world-gunshot"),"police shots do not emit danger event");console.log("Pedestrian panic contract passed: gunshots/explosions trigger flee FSM, hands-up animation, recovery and throttled scream audio.");\n''')
          PY
          node --check sim/world_pedestrian_panic_logic.mjs
          node --check sim/world_procedural_population.mjs
          node --check sim/gameplay_final_runtime_v2.mjs
          node --check sim/wanted_police_drones.mjs
          node tests/pedestrian_panic_contract_test.mjs
          git config user.name 'Christian Heinrich Hohlfeld'
          git config user.email 'chris.hohlfeld@gmail.com'
          git add sim tests
          git commit -m 'Make pedestrians panic during firefights'
          git push origin HEAD:main
