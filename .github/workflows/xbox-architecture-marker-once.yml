name: One-shot Xbox architecture marker

on:
  push:
    branches: [main]
    paths: ['.github/xbox-architecture-marker.trigger']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh permanent Xbox lifecycle invariants
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          old='requireText("sim/simulator.mjs",\'import {findXboxGamepad,sampleXboxGamepad} from "./xbox_gamepad.mjs";\');'
          new='requireText("sim/simulator.mjs",\'import {findXboxGamepad,isXboxCompatibleGamepad,sampleXboxGamepad} from "./xbox_gamepad.mjs";\');'
          if old not in s: raise SystemExit('stale Xbox import invariant missing')
          s=s.replace(old,new,1)
          marker='requireText("sim/simulator.mjs","pollXboxGamepad(renderNow)");\n'
          if marker not in s: raise SystemExit('Xbox polling invariant missing')
          p.write_text(s)
          PY
          node tests/architecture_invariants.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/architecture_invariants.mjs
          git commit -m 'Refresh Xbox lifecycle architecture invariants'
          git push origin HEAD:main
