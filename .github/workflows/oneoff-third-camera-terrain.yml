name: One-off third camera and terrain patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-third-camera-terrain.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch simulator camera and terrain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("sim/simulator.mjs")
          s = path.read_text()

          replacements = [
              (
                  'const STATE_FAULT = 4;\nconst $ = id => document.getElementById(id);',
                  'const STATE_FAULT = 4;\nconst TERRAIN_SIZE = 600;\nconst TERRAIN_HALF = TERRAIN_SIZE / 2;\nconst $ = id => document.getElementById(id);'
              ),
              (
                  'b3.b3CreateBoxShape(ground,groundShape,60,60,.05);',
                  'b3.b3CreateBoxShape(ground,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);'
              ),
              (
                  'const scene=new THREE.Scene();scene.background=daylightSky();scene.fog=new THREE.Fog(0xd7e8f2,35,150);',
                  'const scene=new THREE.Scene();scene.background=daylightSky();scene.fog=new THREE.Fog(0xd7e8f2,90,700);'
              ),
              (
                  'const camera=new THREE.PerspectiveCamera(52,1,.01,300);',
                  'const camera=new THREE.PerspectiveCamera(52,1,.01,1500);'
              ),
              (
                  'const grid=new THREE.GridHelper(120,60,0x6b7d89,0xa7b6bd);grid.rotation.x=Math.PI/2;grid.position.z=.002;scene.add(grid);const groundMesh=new THREE.Mesh(new THREE.BoxGeometry(120,120,.1),new THREE.MeshStandardMaterial({color:0xa9b99a,roughness:.96,metalness:0}));',
                  'const grid=new THREE.GridHelper(TERRAIN_SIZE,120,0x6b7d89,0xa7b6bd);grid.rotation.x=Math.PI/2;grid.position.z=.002;scene.add(grid);const groundMesh=new THREE.Mesh(new THREE.BoxGeometry(TERRAIN_SIZE,TERRAIN_SIZE,.1),new THREE.MeshStandardMaterial({color:0xa9b99a,roughness:.96,metalness:0}));'
              ),
              (
                  'cameraHud.innerHTML=\'<button id="camFollow" type="button">FOLLOW</button><button id="camFpv" type="button">FPV</button><button id="camSolo" type="button">1 PHONE</button>\';',
                  'cameraHud.innerHTML=\'<button id="camFollow" type="button">FOLLOW</button><button id="camFpv" type="button">FPV</button><button id="camThird" type="button">THIRD</button><button id="camSolo" type="button">1 PHONE</button>\';'
              ),
              (
                  'let cameraMode=localStorage.getItem("arondight45CameraMode")==="fpv"?"fpv":"follow",cameraFollowInitialized=false;\nconst followHeading=new THREE.Vector3(-1,0,0);',
                  'const savedCameraMode=localStorage.getItem("arondight45CameraMode");\nlet cameraMode=["follow","fpv","third"].includes(savedCameraMode)?savedCameraMode:"follow",cameraFollowInitialized=false;\nconst followHeading=new THREE.Vector3(-1,0,0),thirdHeading=new THREE.Vector3(-1,0,0);'
              ),
              (
                  '  cameraMode=next==="fpv"?"fpv":"follow";cameraFollowInitialized=false;localStorage.setItem("arondight45CameraMode",cameraMode);$("viewport").dataset.cameraMode=cameraMode;\n  for(const [id,value] of [["camFollow","follow"],["camFpv","fpv"]]){',
                  '  cameraMode=["follow","fpv","third"].includes(next)?next:"follow";cameraFollowInitialized=false;localStorage.setItem("arondight45CameraMode",cameraMode);$("viewport").dataset.cameraMode=cameraMode;\n  for(const [id,value] of [["camFollow","follow"],["camFpv","fpv"],["camThird","third"]]){'
              ),
              (
                  '  const horizontal=bodyForward.clone();horizontal.z=0;\n  if(horizontal.lengthSq()>.04){horizontal.normalize();followHeading.lerp(horizontal,.12).normalize();}\n  const desired=position.clone().addScaledVector(followHeading,-1.65);desired.z+=.78;',
                  '  const horizontal=bodyForward.clone();horizontal.z=0;\n  if(horizontal.lengthSq()>.04)horizontal.normalize();\n  if(cameraMode==="third"){\n    if(horizontal.lengthSq()>.04)thirdHeading.lerp(horizontal,.22).normalize();\n    const desired=position.clone().addScaledVector(thirdHeading,-3.0);desired.z+=1.35;\n    const look=position.clone().addScaledVector(thirdHeading,.55);look.z+=.18;\n    camera.up.set(0,0,1);\n    if(!cameraFollowInitialized){camera.position.copy(desired);cameraFollowInitialized=true;}else camera.position.lerp(desired,.16);\n    camera.lookAt(look);\n    if(camera.fov!==62){camera.fov=62;camera.updateProjectionMatrix();}\n    return;\n  }\n  if(horizontal.lengthSq()>.04)followHeading.lerp(horizontal,.12).normalize();\n  const desired=position.clone().addScaledVector(followHeading,-1.65);desired.z+=.78;'
              ),
              (
                  '$("camFollow").onclick=()=>setCameraMode("follow");$("camFpv").onclick=()=>setCameraMode("fpv");setCameraMode(cameraMode);',
                  '$("camFollow").onclick=()=>setCameraMode("follow");$("camFpv").onclick=()=>setCameraMode("fpv");$("camThird").onclick=()=>setCameraMode("third");setCameraMode(cameraMode);'
              ),
              (
                  '$("soloCamera").onclick=()=>{setCameraMode(cameraMode==="follow"?"fpv":"follow");$("soloCamera").textContent=cameraMode.toUpperCase();};',
                  '$("soloCamera").onclick=()=>{const next=cameraMode==="follow"?"third":cameraMode==="third"?"fpv":"follow";setCameraMode(next);$("soloCamera").textContent=cameraMode.toUpperCase();};'
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old[:100]}")
              s = s.replace(old, new, 1)

          path.write_text(s)
          PY
      - name: Verify patch markers
        shell: bash
        run: |
          grep -q 'id="camThird"' sim/simulator.mjs
          grep -q 'cameraMode==="third"' sim/simulator.mjs
          grep -q 'const TERRAIN_SIZE = 600;' sim/simulator.mjs
          grep -q 'TERRAIN_HALF,TERRAIN_HALF' sim/simulator.mjs
          node --check sim/simulator.mjs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/simulator.mjs
          git commit -m "Add third-person camera and larger terrain"
          git push
