name: RESTORE DESCENT THRUST RESERVE

on:
  push:
    branches: [main]
    paths:
      - '.github/restore-descent-thrust-reserve-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply and unit-test descent thrust reserve
        run: |
          set -euxo pipefail
          python3 .github/restore-descent-thrust-reserve.py
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          node tests/architecture_invariants.mjs
      - name: Commit tested product tree
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore descent attitude thrust reserve'
          git push origin HEAD:main
