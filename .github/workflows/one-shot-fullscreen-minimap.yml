name: Fullscreen minimap top-down zoom

on:
  push:
    branches: ["fix/fullscreen-minimap-topdown"]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/fullscreen-minimap-topdown
          fetch-depth: 0
      - name: Apply top-down fullscreen minimap zoom
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sim/real_world_bootstrap.mjs')
          s=p.read_text()
          replacements=[
            ('this.minimapExpanded=false;this.minimapPointers=new Map();',
             'this.minimapExpanded=false;this.minimapZoom=1;this.minimapPointers=new Map();'),
            ('#worldLookHud.expanded{width:min(72vw,560px);height:min(68dvh,430px);border-radius:18px;background:#071522f8}#worldLookHud.expanded .world-look-stage{border-radius:16px}#worldLookHud.expanded .world-look-cardinal{font-size:10px}',
             '#worldLookHud.expanded{width:min(72vw,560px);height:min(68dvh,430px);border-radius:18px;background:#071522f8}#worldLookHud.expanded .world-look-stage{border-radius:16px;perspective:none}#worldLookHud.expanded .world-look-plane{display:none}#worldLookHud.expanded .world-look-cardinal{font-size:10px}'),
            ('if(this.minimapPointers.size>=2){const distance=pointerDistance();if(!this.minimapPinch)this.minimapPinch={distance:Math.max(1,distance),fov:this.viewFovDeg};const ratio=distance/Math.max(1,this.minimapPinch.distance),next=clamp(this.minimapPinch.fov/Math.max(.35,ratio),50,120);this.viewFovDeg=next;setCameraFovDeg(next);this.minimapLastDrawMs=-Infinity;event.preventDefault();return;}',
             'if(this.minimapPointers.size>=2){const distance=pointerDistance();if(!this.minimapPinch)this.minimapPinch={distance:Math.max(1,distance),fov:this.viewFovDeg,zoom:this.minimapZoom};const ratio=distance/Math.max(1,this.minimapPinch.distance);if(this.minimapExpanded){this.minimapZoom=clamp(this.minimapPinch.zoom*ratio,.45,4);this.minimapLastDrawMs=-Infinity;this.drawMinimap(performance.now());}else{const next=clamp(this.minimapPinch.fov/Math.max(.35,ratio),50,120);this.viewFovDeg=next;setCameraFovDeg(next);this.minimapLastDrawMs=-Infinity;}event.preventDefault();return;}'),
            ('this.minimapPinch={distance:Math.max(1,pointerDistance()),fov:this.viewFovDeg};',
             'this.minimapPinch={distance:Math.max(1,pointerDistance()),fov:this.viewFovDeg,zoom:this.minimapZoom};'),
            ('toggleMinimapExpanded(){this.minimapExpanded=!this.minimapExpanded;this.lookHud?.classList.toggle("expanded",this.minimapExpanded);if(this.minimapCanvas){this.minimapCanvas.width=this.minimapExpanded?392:196;this.minimapCanvas.height=this.minimapExpanded?344:172;}this.minimapLastDrawMs=-Infinity;this.drawMinimap(performance.now());return this.minimapExpanded;}',
             'toggleMinimapExpanded(){this.minimapExpanded=!this.minimapExpanded;if(!this.minimapExpanded)this.minimapZoom=1;this.lookHud?.classList.toggle("expanded",this.minimapExpanded);if(this.minimapCanvas){this.minimapCanvas.width=this.minimapExpanded?392:196;this.minimapCanvas.height=this.minimapExpanded?344:172;}this.minimapLastDrawMs=-Infinity;this.drawMinimap(performance.now());return this.minimapExpanded;}'),
            ('const canvas=this.minimapCanvas,ctx=this.minimapCtx,w=canvas.width,h=canvas.height,position=airframe.position,viewport=$("viewport"),miniBearing=0,rad=0,c=1,si=0,fovScale=clamp(this.viewFovDeg/105,.48,1.25),radius=clamp((55+Math.max(0,position.z)*2)*fovScale,42,190),scale=w/(radius*2),baseY=h*.62;',
             'const canvas=this.minimapCanvas,ctx=this.minimapCtx,w=canvas.width,h=canvas.height,position=airframe.position,viewport=$("viewport"),miniBearing=0,rad=0,c=1,si=0,expanded=this.minimapExpanded,fovScale=clamp(this.viewFovDeg/105,.48,1.25),radius=clamp(((55+Math.max(0,position.z)*2)*fovScale)/(expanded?this.minimapZoom:1),expanded?15:42,expanded?380:190),scale=w/(radius*2),baseY=expanded?h*.5:h*.62;'),
            ('const projectLocal=(east,north,height=0)=>{const dx=east-position.x,dy=north-position.y,rx=dx*c-dy*si,ry=dx*si+dy*c;return[w/2+rx*scale,baseY-ry*scale*.60-height*scale*.13];};',
             'const projectLocal=(east,north,height=0)=>{const dx=east-position.x,dy=north-position.y,rx=dx*c-dy*si,ry=dx*si+dy*c;return[w/2+rx*scale,baseY-ry*scale*(expanded?1:.60)-height*scale*(expanded?0:.13)];};'),
            ('viewport.dataset.worldMinimapMode="north";viewport.dataset.worldMinimapBearing="0.00";viewport.dataset.worldMinimapFov=this.viewFovDeg.toFixed(1);',
             'viewport.dataset.worldMinimapMode="north";viewport.dataset.worldMinimapBearing="0.00";viewport.dataset.worldMinimapFov=this.viewFovDeg.toFixed(1);viewport.dataset.worldMinimapProjection=expanded?"topdown":"perspective";viewport.dataset.worldMinimapZoom=(expanded?this.minimapZoom:1).toFixed(2);')
          ]
          for old,new in replacements:
              count=s.count(old)
              assert count==1, f'bootstrap replacement count {count}: {old[:90]}'
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/real_world_ui_smoke.mjs')
          s=p.read_text()
          needle='  const expanded=await page.evaluate(()=>{const h=document.querySelector("#worldLookHud"),r=h.getBoundingClientRect(),v=document.querySelector("#viewport");return{w:r.width,h:r.height,mode:v.dataset.worldMinimapMode,bearing:Number(v.dataset.worldMinimapBearing||99)};});if(expanded.w<250||expanded.h<200||expanded.mode!=="north"||Math.abs(expanded.bearing)>.01)throw new Error(`expanded minimap contract failed: ${JSON.stringify(expanded)}`);\n'
          addition='''  const expanded=await page.evaluate(()=>{const h=document.querySelector("#worldLookHud"),r=h.getBoundingClientRect(),v=document.querySelector("#viewport");return{w:r.width,h:r.height,mode:v.dataset.worldMinimapMode,bearing:Number(v.dataset.worldMinimapBearing||99),projection:v.dataset.worldMinimapProjection};});if(expanded.w<250||expanded.h<200||expanded.mode!=="north"||Math.abs(expanded.bearing)>.01||expanded.projection!=="topdown")throw new Error(`expanded minimap contract failed: ${JSON.stringify(expanded)}`);\n  const expandedZoom=await page.evaluate(()=>{const h=document.querySelector("#worldLookHud"),r=h.getBoundingClientRect(),v=document.querySelector("#viewport"),cx=r.left+r.width/2,cy=r.top+r.height/2,send=(type,id,x,y)=>h.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",clientX:x,clientY:y,button:0})),fov0=Number(v.dataset.worldMinimapFov),zoom0=Number(v.dataset.worldMinimapZoom||1);send("pointerdown",91,cx-25,cy);send("pointerdown",92,cx+25,cy);send("pointermove",92,cx+85,cy);send("pointerup",92,cx+85,cy);send("pointerup",91,cx-25,cy);globalThis.__arondightRealWorld.drawMinimap(performance.now());return{fov0,fov1:Number(v.dataset.worldMinimapFov),zoom0,zoom1:Number(v.dataset.worldMinimapZoom),projection:v.dataset.worldMinimapProjection};});if(expandedZoom.projection!=="topdown"||Math.abs(expandedZoom.fov1-expandedZoom.fov0)>.01||expandedZoom.zoom1-expandedZoom.zoom0<.5)throw new Error(`expanded minimap pinch did not zoom map independently: ${JSON.stringify(expandedZoom)}`);\n'''
          assert s.count(needle)==1
          p.write_text(s.replace(needle,addition,1))
          PY
          rm -f .github/workflows/one-shot-fullscreen-minimap.yml
      - name: Validate source and architecture
        run: |
          set -euxo pipefail
          node --check sim/real_world_bootstrap.mjs
          node --check tests/real_world_ui_smoke.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          git diff --exit-code -- .github/workflows/deploy.yml .github/workflows/s31-hil.yml
      - name: Commit validated patch
        run: |
          set -euxo pipefail
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Make expanded minimap top-down and pinch-zoomable'
          git push origin HEAD:fix/fullscreen-minimap-topdown
