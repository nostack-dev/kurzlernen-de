name: GAME physical response window

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-game-response-window.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce physical response without lowering thresholds
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changes={
            'tests/dual_phone_smoke.mjs':[
              ('const forwardStart=await simTime(view);await waitSim(view,forwardStart+.55,30000);','const forwardStart=await simTime(view);await waitSim(view,forwardStart+1.0,45000);'),
              ('moving.forward>.15&&moving.pitch<-6.0','moving.forward>.30&&moving.pitch<-6.0'),
              ('const strafeStart=await simTime(view);await waitSim(view,strafeStart+.55,30000);','const strafeStart=await simTime(view);await waitSim(view,strafeStart+1.0,45000);'),
            ],
            'tests/browser_sim_smoke.mjs':[
              ('const moveStart=await simTime();await waitForSimTime(moveStart+.55,30000);','const moveStart=await simTime();await waitForSimTime(moveStart+1.0,45000);'),
              ('const strafeStart=await simTime();await waitForSimTime(strafeStart+.55,30000);','const strafeStart=await simTime();await waitForSimTime(strafeStart+1.0,45000);'),
            ],
          }
          for path,repls in changes.items():
            p=Path(path);s=p.read_text()
            for old,new in repls:
              assert s.count(old)==1,(path,old,s.count(old))
              s=s.replace(old,new,1)
            p.write_text(s)
          PY
          node --check tests/dual_phone_smoke.mjs
          node --check tests/browser_sim_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit tests and remove one-off workflow
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add tests/dual_phone_smoke.mjs tests/browser_sim_smoke.mjs
          git rm .github/workflows/oneoff-game-response-window.yml
          git commit -m "Validate GAME motion over physical response window"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
