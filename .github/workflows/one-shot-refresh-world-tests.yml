name: One-shot refresh WORLD tests

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align tests with fine height nudge and validated speed envelope
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('tests/dual_phone_smoke.mjs');s=p.read_text()
          old='''  await controller.click("#gameUp");\n  await controller.waitForFunction(()=>Math.abs(Number(document.querySelector("#gameClearance")?.dataset.targetAglM)-2.2)<.06,{timeout:5000});\n  await controller.click("#gameDown");\n  await controller.waitForFunction(()=>Math.abs(Number(document.querySelector("#gameClearance")?.dataset.targetAglM)-2.0)<.06,{timeout:5000});'''
          new='''  await controller.click("#gameUp");\n  await controller.waitForFunction(()=>Math.abs(Number(document.querySelector("#gameClearance")?.dataset.targetAglM)-2.1)<.06,{timeout:5000});\n  await controller.click("#gameDown");\n  await controller.waitForFunction(()=>Math.abs(Number(document.querySelector("#gameClearance")?.dataset.targetAglM)-2.0)<.06,{timeout:5000});'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text();s=s.replace('50m range, 12m/s shared FC envelope','50m range, validated 5m/s shared FC envelope');p.write_text(s)
          Path('.github/workflows/one-shot-refresh-world-tests.yml').unlink()
          subprocess.run(['node','--check','tests/dual_phone_smoke.mjs'],check=True)
          subprocess.run(['node','--check','tests/real_world_ui_smoke.mjs'],check=True)
          PY
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Align WORLD E2E with fine height controls"
          git push origin HEAD:main
