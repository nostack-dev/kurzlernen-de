name: One-shot YAML-safe SIL hotpath patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-hotpath-safe.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch product hotpath and self-clean
        shell: bash
        run: |
          set -euxo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Remove non-authoritative work from 1kHz SIL hot path"
          git push origin HEAD:main
