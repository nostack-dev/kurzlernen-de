name: One-off closer third-person camera patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-third-camera-closer.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move third-person camera closer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/simulator.mjs')
          s=p.read_text()
          old='const desired=position.clone().addScaledVector(thirdHeading,-3.0);desired.z+=1.35;'
          new='const desired=position.clone().addScaledVector(thirdHeading,-2.25);desired.z+=1.05;'
          if old not in s:
              raise SystemExit('expected third-person camera marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -F 'addScaledVector(thirdHeading,-2.25);desired.z+=1.05' sim/simulator.mjs
          node --check sim/simulator.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/simulator.mjs
          git commit -m "Move third-person camera closer"
          git push origin HEAD:main
