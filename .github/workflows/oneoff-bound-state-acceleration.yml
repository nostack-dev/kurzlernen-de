name: Bound GAME state acceleration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-bound-state-acceleration.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bound physical state acceleration
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('esp32/Arondight45_StateControl.hpp')
          s=p.read_text()
          old='''    static constexpr float kHorizontalVelocityGain = 2.0f;  // 1/s
    static constexpr float kMaxHorizontalAccelerationMps2 = 4.5f;
'''
          new='''    static constexpr float kHorizontalVelocityGain = 2.0f;  // 1/s
    // GAME commands a velocity vector, not an instantaneous attitude step. Bound
    // dv/dt so a target-vector reversal remains inside the quadrotor's achievable
    // rigid-body/rotor response instead of demanding an immediate ±25° thrust flip.
    // The 5 m/s velocity authority is unchanged; this only limits acceleration.
    static constexpr float kMaxHorizontalAccelerationMps2 = 2.0f;
'''
          assert s.count(old)==1,('acceleration constants',s.count(old))
          p.write_text(s.replace(old,new,1))

          p=Path('tests/state_control_test.cpp')
          s=p.read_text()
          s=s.replace('CHECK(controller.debug().forward_accel_mps2 > 4.0f);','CHECK(controller.debug().forward_accel_mps2 > 1.9f);',1)
          s=s.replace('CHECK(accel_norm > 4.3f && accel_norm < 4.6f);','CHECK(accel_norm > 1.9f && accel_norm < 2.1f);',1)
          s=s.replace('CHECK(controller.debug().right_accel_mps2 > 4.0f);','CHECK(controller.debug().right_accel_mps2 > 1.9f);',1)
          p.write_text(s)
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit and self-remove
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add esp32/Arondight45_StateControl.hpp tests/state_control_test.cpp
          git rm .github/workflows/oneoff-bound-state-acceleration.yml
          git commit -m "Bound GAME velocity-vector acceleration"
          git pull --rebase origin main
          git push origin HEAD:main
