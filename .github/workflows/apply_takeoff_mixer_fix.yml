name: Apply takeoff-safe mixer fix

on:
  push:
    branches: ["takeoff-mixer-rail-fix"]
    paths: [".github/workflows/apply_takeoff_mixer_fix.yml"]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: takeoff-mixer-rail-fix
          fetch-depth: 0

      - name: Apply low-rail-safe desaturation and regressions
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core = Path('esp32/Arondight45_DroneFC_Core.hpp')
          text = core.read_text()
          start = text.index('inline Mix mix(float t, float roll, float pitch, float yaw) {')
          end = text.index('\nconstexpr uint16_t pulse', start)
          new_mix = r'''inline Mix mix(float t, float roll, float pitch, float yaw) {
              t = clamp(t, 0.0f, 1.0f);

              // Rail-aware mixer contract:
              // - upper rail: collective may move DOWN to preserve roll/pitch;
              // - lower rail: collective must NEVER move UP above the FC request.
              //   Instead attitude correction is reduced into the available lower
              //   headroom. This makes t == 0 an absolute zero-thrust command even
              //   when the attitude loop still carries residual error on the pad.
              std::array<float, 4> roll_pitch{{pitch - roll,
                                                pitch + roll,
                                                -pitch + roll,
                                                -pitch - roll}};
              auto bounds = [](const std::array<float, 4>& values) {
                  float lo = values[0];
                  float hi = values[0];
                  for (size_t i = 1; i < values.size(); ++i) {
                      lo = std::min(lo, values[i]);
                      hi = std::max(hi, values[i]);
                  }
                  return std::array<float, 2>{{lo, hi}};
              };

              auto rp_bounds = bounds(roll_pitch);
              const float rp_span = rp_bounds[1] - rp_bounds[0];
              if (rp_span > 1.0f && rp_span > 1.0e-6f) {
                  const float scale = 1.0f / rp_span;
                  for (float& value : roll_pitch) value *= scale;
              }

              const std::array<float, 4> yaw_mix{{-0.65f * yaw,
                                                   0.65f * yaw,
                                                  -0.65f * yaw,
                                                   0.65f * yaw}};
              auto correction_for_yaw_scale = [&](float yaw_scale) {
                  std::array<float, 4> values{};
                  for (size_t i = 0; i < values.size(); ++i)
                      values[i] = roll_pitch[i] + yaw_scale * yaw_mix[i];
                  return values;
              };

              // Yaw is lower priority than roll/pitch whenever the requested
              // differential span itself exceeds the motor window.
              float yaw_scale = 1.0f;
              auto correction = correction_for_yaw_scale(yaw_scale);
              auto correction_bounds = bounds(correction);
              if (correction_bounds[1] - correction_bounds[0] > 1.0f) {
                  float feasible = 0.0f;
                  float infeasible = 1.0f;
                  for (int i = 0; i < 16; ++i) {
                      const float candidate = 0.5f * (feasible + infeasible);
                      const auto candidate_bounds = bounds(correction_for_yaw_scale(candidate));
                      if (candidate_bounds[1] - candidate_bounds[0] <= 1.0f)
                          feasible = candidate;
                      else
                          infeasible = candidate;
                  }
                  yaw_scale = feasible;
                  correction = correction_for_yaw_scale(yaw_scale);
                  correction_bounds = bounds(correction);
              }

              // Lower rail is authoritative: never manufacture extra collective
              // just to satisfy attitude error while sitting on / descending to
              // the ground. Scale the differential instead.
              if (correction_bounds[0] < -t) {
                  const float scale = t > 0.0f ? t / -correction_bounds[0] : 0.0f;
                  for (float& value : correction) value *= clamp(scale, 0.0f, 1.0f);
                  correction_bounds = bounds(correction);
              }

              // At the upper rail there is real thrust available, so translate
              // collective downward to keep the requested attitude differential.
              // Because the differential now fits the lower rail, this shift can
              // never push a motor below zero.
              const float collective = std::min(t, 1.0f - correction_bounds[1]);

              Mix out;
              for (size_t i = 0; i < 4; ++i)
                  out.motor[i] = clamp(collective + correction[i], 0.0f, 1.0f);
              return out;
          }
          '''
          core.write_text(text[:start] + new_mix + text[end:])

          test = Path('tests/drone_fc_core_test.cpp')
          t = test.read_text()
          old = '''    // Strong descent still needs differential motor authority. GAME's
              // flight controller never commands below 0.08 while airborne.
              const auto low_rail_pitch = fc::mix(0.08f, 0.0f, 0.25f, 0.0f);
              CHECK(low_rail_pitch.motor[0] > low_rail_pitch.motor[2] + 0.45f);
              CHECK(low_rail_pitch.motor[1] > low_rail_pitch.motor[3] + 0.45f);
              for (float value : low_rail_pitch.motor) CHECK(value >= 0.0f && value <= 1.0f);

              // Neutral attitude at full collective must remain full collective.
          '''
          new = '''    // The lower rail must never manufacture collective. This is the
              // takeoff/landing safety contract: residual attitude error on the pad
              // may use only the thrust already requested by the state controller.
              const auto zero_rail_pitch = fc::mix(0.0f, 0.0f, 0.25f, 0.0f);
              for (float value : zero_rail_pitch.motor) CHECK(std::fabs(value) < 1.0e-6f);

              const auto low_rail_pitch = fc::mix(0.08f, 0.0f, 0.25f, 0.0f);
              float low_sum = 0.0f;
              for (float value : low_rail_pitch.motor) {
                  CHECK(value >= 0.0f && value <= 1.0f);
                  low_sum += value;
              }
              CHECK(low_rail_pitch.motor[0] > low_rail_pitch.motor[2] + 0.15f);
              CHECK(low_rail_pitch.motor[1] > low_rail_pitch.motor[3] + 0.15f);
              CHECK(low_sum / 4.0f <= 0.0801f);

              // Neutral attitude at full collective must remain full collective.
          '''
          if t.count(old) != 1:
              raise SystemExit(f'expected one old low-rail regression block, found {t.count(old)}')
          test.write_text(t.replace(old, new))
          PY

          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test

      - name: Commit tested patch and remove one-shot workflow
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply_takeoff_mixer_fix.yml
          git add esp32/Arondight45_DroneFC_Core.hpp tests/drone_fc_core_test.cpp
          git commit -m 'Keep low-throttle mixer from lifting the airframe'
          git push origin HEAD:takeoff-mixer-rail-fix
