name: Integrate state-vector control

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/state-control-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch simulator and production adapter
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              assert count==1, f"{path}: expected one match, got {count}: {old[:80]!r}"
              p.write_text(text.replace(old,new,1))

          sim='sim/simulator.mjs'
          replace_once(sim,
          '''const FLAG_IMU_VALID = 1;
          const FLAG_RESET = 2;
          const STATE_ARMED = 1;
          const STATE_CALIBRATING = 2;
          const STATE_FAULT = 4;''',
          '''const FLAG_IMU_VALID = 1;
          const FLAG_RESET = 2;
          const FLAG_NAVIGATION_VALID = 4;
          const STATE_ARMED = 1;
          const STATE_CALIBRATING = 2;
          const STATE_FAULT = 4;
          const STATE_NAVIGATION_VALID = 1 << 5;
          const STATE_GAME_MODE = 1 << 6;''')

          replace_once(sim,
          '''function makeInput(sequence, imu, sbus, flags, dtUs=1000) {
            const bytes = new Uint8Array(INPUT_BYTES);
            const view = new DataView(bytes.buffer);
            view.setUint32(0,INPUT_MAGIC,true);
            view.setUint32(4,sequence,true);
            view.setUint32(8,dtUs,true);
            bytes.set(imu,12);
            bytes.set(sbus,26);
            bytes[51]=flags;
            view.setUint32(60,crc32(bytes,60),true);
            return bytes;
          }''',
          '''function makeInput(sequence, imu, sbus, flags, dtUs=1000, navigation=null) {
            const bytes = new Uint8Array(INPUT_BYTES);
            const view = new DataView(bytes.buffer);
            view.setUint32(0,INPUT_MAGIC,true);
            view.setUint32(4,sequence,true);
            view.setUint32(8,dtUs,true);
            bytes.set(imu,12);
            bytes.set(sbus,26);
            if(navigation?.valid){
              const s16=value=>clamp(Math.round(value),-32767,32767);
              flags|=FLAG_NAVIGATION_VALID;
              view.setInt16(52,s16(navigation.vx*100),true);
              view.setInt16(54,s16(navigation.vy*100),true);
              view.setInt16(56,s16(navigation.vz*100),true);
              view.setUint16(58,clamp(Math.round(navigation.agl*1000),0,65535),true);
            }
            bytes[51]=flags;
            view.setUint32(60,crc32(bytes,60),true);
            return bytes;
          }''')

          replace_once(sim,'if (this.module._fc_protocol_version() !== 1) throw Error("WASM HIL protocol version mismatch");','if (this.module._fc_protocol_version() !== 2) throw Error("WASM HIL protocol version mismatch");')
          replace_once(sim,'label(){return "shared fc::Runtime / WASM";}','label(){return "shared fc::StateRuntime → fc::Runtime / WASM";}')

          marker='''class Noise {
            constructor(seed=0x45a31f27){this.s=seed>>>0;this.spare=null;this.gyroBias=[0.08,-0.05,0.04];this.accBias=[0.001,-0.0015,0.002];}
            uniform(){let x=this.s;x^=x<<13;x^=x>>>17;x^=x<<5;this.s=x>>>0;return(this.s+1)/4294967297;}
            gaussian(){if(this.spare!==null){const z=this.spare;this.spare=null;return z;}const u=Math.max(1e-12,this.uniform()),v=this.uniform(),r=Math.sqrt(-2*Math.log(u));this.spare=r*Math.sin(2*Math.PI*v);return r*Math.cos(2*Math.PI*v);}
            stepBias(dt){for(let i=0;i<3;i++){this.gyroBias[i]+=this.gaussian()*0.002*Math.sqrt(dt);this.accBias[i]+=this.gaussian()*0.00002*Math.sqrt(dt);}}
          }
          '''
          insertion=marker+'''\n// Sensor simulation is deliberately separated from rigid-body truth. The flight\n// controller only receives these sampled, noisy, quantized measurements through\n// the same HIL packet contract a real navigation source uses.\nclass SimNavigationSensors {\n  constructor(){this.reset();}\n  reset(){this.noise=new Noise(0x7193ab21);this.elapsed=.02;this.filtered=[0,0,0];this.last={vx:0,vy:0,vz:0,agl:0,valid:false};}\n  sample(model,dt=DT){\n    this.elapsed+=dt;if(this.elapsed<.01)return this.last;this.elapsed=0;\n    const truth=model.linear(),alpha=.42;\n    for(let i=0;i<3;i++){const measured=truth[i]+this.noise.gaussian()*.025;this.filtered[i]+=alpha*(measured-this.filtered[i]);}\n    const position=model.position(),down=model.worldVector([0,0,-1]),verticalProjection=-down[2];\n    let valid=verticalProjection>.55,agl=0;\n    if(valid){\n      const slant=Math.max(0,position[2])/verticalProjection;valid=slant>=.015&&slant<=12;\n      if(valid){const measuredSlant=Math.max(0,slant+this.noise.gaussian()*.004);agl=measuredSlant*verticalProjection;}\n    }\n    this.last={vx:this.filtered[0],vy:this.filtered[1],vz:this.filtered[2],agl,valid};return this.last;\n  }\n}\n'''
          replace_once(sim,marker,insertion)

          replace_once(sim,
          '''let physics=new PhysicsModel(defaultParams(),{graphics:true,scene});''',
          '''let physics=new PhysicsModel(defaultParams(),{graphics:true,scene});
          const navigationSensors=new SimNavigationSensors();
          let latestNavigation={vx:0,vy:0,vz:0,agl:0,valid:false};''')

          replace_once(sim,
          '''    const desired=position.clone().addScaledVector(thirdHeading,-2.25);desired.z+=1.05;
              const look=position.clone().addScaledVector(thirdHeading,.55);look.z+=.18;''',
          '''    const viewPitch=effectiveInput?.gameMode?clamp(Number(effectiveInput.lookPitch)||0,-1,1):0;
              const desired=position.clone().addScaledVector(thirdHeading,-2.25);desired.z+=1.05+viewPitch*.32;
              const look=position.clone().addScaledVector(thirdHeading,.55);look.z+=.18+viewPitch*1.15;''')

          replace_once(sim,
          '''  if(mode==="sim")return "SIM · primary mode. The exact shared C++ fc::Runtime executes as WebAssembly; only sensors, motors and airframe are simulated.";
            if(mode==="hil")return "HIL · the same fc::Runtime executes on a physical ESP32-S31. Closed-loop time is simulated at 1 kHz; this is functional HIL, not a claim of real IMU-DRDY scheduling validation.";''',
          '''  if(mode==="sim")return "SIM · primary mode. The shared C++ state outer loop and exact fc::Runtime execute as WebAssembly; sensor measurements, motors and airframe are simulated.";
            if(mode==="hil")return "HIL · the same state outer loop + fc::Runtime execute on a physical ESP32-S31. Closed-loop time is simulated at 1 kHz; this is functional HIL, not a claim of real IMU-DRDY scheduling validation.";''')

          replace_once(sim,
          '''function resetSimulation(initial=null){
            physics.reset(defaultParams(),initial);raceTrack.reset();sequence=1;simTime=0;resetFlag=true;latest={motors:[1000,1000,1000,1000],attitude:[0,0,0],state:0,processingUs:0};soloControls=neutralControls();updateSoloSticks();localThrottle=throttle=0;localArm=arm=false;effectiveInput=neutralControls();replayIndex=0;sessionLog=[];''',
          '''function resetSimulation(initial=null){
            physics.reset(defaultParams(),initial);navigationSensors.reset();latestNavigation={vx:0,vy:0,vz:0,agl:0,valid:false};raceTrack.reset();sequence=1;simTime=0;resetFlag=true;latest={motors:[1000,1000,1000,1000],attitude:[0,0,0],state:0,processingUs:0};soloControls=neutralControls();updateSoloSticks();localThrottle=throttle=0;localArm=arm=false;effectiveInput=neutralControls();replayIndex=0;sessionLog=[];''')

          replace_once(sim,
          '''function controls(){
            const c=activeControlState(),channels=new Array(16).fill(992);channels[0]=Math.round(992+820*c.roll);channels[1]=Math.round(992+820*c.pitch);channels[2]=Math.round(172+1639*c.throttle);channels[3]=Math.round(992+820*c.yaw);channels[4]=c.arm?1811:172;return encodeSbus(channels);
          }''',
          '''function controls(){
            const c=activeControlState(),channels=new Array(16).fill(992);
            channels[0]=Math.round(992+820*clamp(c.roll||0,-1,1));
            channels[1]=Math.round(992+820*clamp(c.pitch||0,-1,1));
            channels[3]=Math.round(992+820*clamp(c.yaw||0,-1,1));
            channels[4]=c.arm?1811:172;
            if(c.gameMode){
              channels[2]=172;
              const clearance=clamp(Number(c.groundClearance)||2,.5,5),normalized=(clearance-.5)/4.5;
              channels[5]=Math.round(172+1639*normalized);channels[6]=1811;
            }else channels[2]=Math.round(172+1639*clamp(c.throttle||0,0,1));
            return encodeSbus(channels);
          }''')

          replace_once(sim,
          '''async function controllerStep(){
            const params=defaultParams(),seq=sequence++,packet=makeInput(seq,physics.imuRaw(DT),controls(),(params.imuValid?FLAG_IMU_VALID:0)|(resetFlag?FLAG_RESET:0));resetFlag=false;
            const started=performance.now(),out=await backend.exchange(packet,seq);ui.rtt.textContent=(performance.now()-started).toFixed(2)+" ms";return out;
          }''',
          '''async function controllerStep(){
            const params=defaultParams(),seq=sequence++;latestNavigation=navigationSensors.sample(physics,DT);
            const packet=makeInput(seq,physics.imuRaw(DT),controls(),(params.imuValid?FLAG_IMU_VALID:0)|(resetFlag?FLAG_RESET:0),1000,latestNavigation);resetFlag=false;
            const started=performance.now(),out=await backend.exchange(packet,seq);ui.rtt.textContent=(performance.now()-started).toFixed(2)+" ms";return out;
          }''')

          replace_once(sim,
          '''  const now=performance.now();if(now-lastRemoteTelemetry>=100){lastRemoteTelemetry=now;remoteLink.sendTelemetry({fc_state:stateText,mode,sim_time:simTime,altitude:Math.max(0,state.z),speed:state.speed,battery_v:physics.batteryVoltage,current_a:physics.batteryCurrent,motors:latest.motors,rpm:physics.motorOmega.map(w=>w*60/(2*Math.PI)),armed:Boolean(fcState&STATE_ARMED),fault});}''',
          '''  const now=performance.now();if(now-lastRemoteTelemetry>=100){lastRemoteTelemetry=now;remoteLink.sendTelemetry({fc_state:stateText,mode,sim_time:simTime,altitude:Math.max(0,state.z),agl_m:latestNavigation.agl,speed:state.speed,battery_v:physics.batteryVoltage,current_a:physics.batteryCurrent,motors:latest.motors,rpm:physics.motorOmega.map(w=>w*60/(2*Math.PI)),armed:Boolean(fcState&STATE_ARMED),fault,game_mode:Boolean(fcState&STATE_GAME_MODE),navigation_valid:Boolean(fcState&STATE_NAVIGATION_VALID),target_ground_clearance:effectiveInput?.gameMode?clamp(Number(effectiveInput.groundClearance)||2,.5,5):null});}''')

          s31='esp32/Arondight45_DroneFC_S31.cpp'
          replace_once(s31,'#include "Arondight45_DroneFC_Core.hpp"','#include "Arondight45_StateControl.hpp"')
          replace_once(s31,
          '''namespace hw {
          
          constexpr char kTag[] = "Arondight45-FC";''',
          '''extern "C" bool __attribute__((weak)) arondight45_navigation_sample(
              float* vx_mps, float* vy_mps, float* vz_mps, float* agl_m) {
              (void)vx_mps;(void)vy_mps;(void)vz_mps;(void)agl_m;
              return false;
          }
          
          namespace hw {
          
          constexpr char kTag[] = "Arondight45-FC";''')
          replace_once(s31,'    fc::Runtime runtime;','    fc::StateRuntime runtime;')
          replace_once(s31,
          '''        const fc::RuntimeOutput output = runtime.step(input);
          
                  if (output.fault != fc::kFaultNone) fatal(fc::Runtime::fault_name(output.fault));''',
          '''        fc::NavigationState navigation{};
                  float nav_vx=0.0f,nav_vy=0.0f,nav_vz=0.0f,nav_agl=0.0f;
                  if (arondight45_navigation_sample(&nav_vx,&nav_vy,&nav_vz,&nav_agl)) {
                      navigation.velocity_world_mps={nav_vx,nav_vy,nav_vz};navigation.agl_m=nav_agl;navigation.valid=true;
                      navigation.valid=fc::finite(navigation);
                  }
                  fc::StateRuntimeInput state_input{};state_input.flight=input;state_input.navigation=navigation;
                  const fc::RuntimeOutput output = runtime.step(state_input);
          
                  if (output.fault != fc::kFaultNone) fatal(fc::Runtime::fault_name(output.fault));''')

          deploy='.github/workflows/deploy.yml'
          replace_once(deploy,
          '''          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
                    /tmp/fc_core_test
                    g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil_test''',
          '''          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
                    /tmp/fc_core_test
                    g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
                    /tmp/state_control_test
                    g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil_test''')
          PY
          node --check sim/simulator.mjs
          node --check sim/controller.mjs
          node --check sim/p2p_link.mjs
          git diff --check
          git diff -- sim/simulator.mjs esp32/Arondight45_DroneFC_S31.cpp .github/workflows/deploy.yml
      - name: Compile state-control stack
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/core && /tmp/core
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state && /tmp/state
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil && /tmp/hil
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil && /tmp/sil
      - name: Commit integration
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim/simulator.mjs esp32/Arondight45_DroneFC_S31.cpp .github/workflows/deploy.yml
          git commit -m "Wire state-vector control through simulator and S31"
          git push origin HEAD:main
