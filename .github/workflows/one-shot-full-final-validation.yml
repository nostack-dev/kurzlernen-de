name: Full final digital twin validation

on:
  push:
    branches: ["fix/final-flight-safety-ux"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
      - name: Validate clean release architecture and host runtime
        run: |
          set -euxo pipefail
          rm -f .github/workflows/one-shot-final-flight-safety-ux.yml .github/workflows/one-shot-final-gates-v2.yml .github/workflows/one-shot-full-final-validation.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 2
          test -f .github/workflows/deploy.yml
          test -f .github/workflows/s31-hil.yml
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/hil_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil_test
          /tmp/sil_test
          node tests/control_semantics_test.mjs
          node tests/flight_logbook_test.mjs
          node tests/architecture_invariants.mjs
      - name: Build exact shared controller runtime to WebAssembly
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='node' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core_node.mjs
          node --check generated/flight_core.mjs
          node --check generated/flight_core_node.mjs
          node tests/sil_wasm_smoke.mjs generated/flight_core_node.mjs
      - name: Bundle exact static Pages
        run: |
          set -euxo pipefail
          BUILD_DIR=/tmp/arondight45-final-web
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-controller.bundle.mjs
          node --check /tmp/arondight45-simulator.bundle.mjs
          node --check /tmp/arondight45-controller.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          for html_name,marker,bundle_name in [
            ('drone_simulator.html','<script type="module" src="./sim/real_world_bootstrap.mjs"></script>','/tmp/arondight45-simulator.bundle.mjs'),
            ('drone_controller.html','<script type="module" src="./sim/controller.mjs"></script>','/tmp/arondight45-controller.bundle.mjs')]:
            p=Path(html_name);html=p.read_text();assert marker in html
            bundle=Path(bundle_name).read_text().replace('</script','<\\/script')
            p.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
          test "$(wc -c < drone_simulator.html)" -gt 100000
          test "$(wc -c < drone_controller.html)" -gt 10000
          ! grep -q 'src="./sim/real_world_bootstrap.mjs"' drone_simulator.html
          ! grep -q 'src="./sim/controller.mjs"' drone_controller.html
          ! grep -q 'cdn.jsdelivr.net' drone_simulator.html
          ! grep -q 'generated/flight_core.mjs' drone_simulator.html
          grep -q 'OpenFreeMap' drone_simulator.html
          grep -q 'calculateCameraOptionsFromTo' drone_simulator.html
          grep -q 'NAV DEGRADED' drone_simulator.html
          grep -q 'FLIGHT LOGBOOK' drone_simulator.html
          grep -q 'presentation-fire-stick' drone_simulator.html
      - name: Execute full browser E2E
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/arondight45-final-static.log 2>&1 &
          HTTP_PID=$!
          cleanup(){ kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules; }
          trap cleanup EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/solo_layout_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/real_world_ui_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/dual_phone_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/browser_sim_smoke.mjs http://127.0.0.1:4174/drone_simulator.html
      - name: Source syntax and hygiene
        run: |
          set -euxo pipefail
          for f in sim/real_world_bootstrap.mjs sim/simulator.mjs sim/controller.mjs sim/p2p_link.mjs sim/qr_pairing.mjs sim/control_semantics.mjs sim/control_settings.mjs sim/camera_settings.mjs sim/solo_layout.mjs sim/flight_logbook.mjs sim/presentation_fire.mjs tests/architecture_invariants.mjs tests/control_semantics_test.mjs tests/sil_wasm_smoke.mjs tests/browser_sim_smoke.mjs tests/dual_phone_smoke.mjs tests/solo_layout_smoke.mjs tests/real_world_ui_smoke.mjs tests/flight_logbook_test.mjs tools/s31_hil_bridge.mjs; do node --check "$f"; done
          git diff --check
