name: Final recovery and pairing fix

on:
  push:
    branches: [main]
    paths: ['.github/recovery-pairing-v3.trigger']

permissions:
  contents: write
  issues: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V2 patch plus corrected staged invariant
        id: fix
        shell: bash
        run: |
          set -euxo pipefail
          exec > >(tee /tmp/recovery-pairing-v3.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/fix-recovery-pairing-v2.yml').read_text()
          start=text.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=text.index("\n          PY\n",start)
          lines=text[start:end].splitlines()
          Path('/tmp/recovery_pairing_patch.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n')
          PY
          python3 /tmp/recovery_pairing_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/staged_vs_smoke.mjs');s=p.read_text()
          old='assert.deepEqual(firstStage.map(x=>x.roomId),["tap-current","tap-previous","net-exact"],"gesture rooms plus first trusted network room must be first");'
          new='assert.deepEqual(firstStage.map(x=>x.roomId),["net-exact","net-secondary","net-third"],"stable same-network/proximity rooms must be attempted before transient gesture rooms");'
          if s.count(old)!=1: raise SystemExit(f'staged invariant marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/settings_controller_nav.mjs
          node --check sim/control_settings.mjs
          node --check sim/p2p_link.mjs
          node --check sim/lan_vs.mjs
          node --check tests/xbox_gamepad_browser_smoke.mjs
          node tests/p2p_link_test.mjs
          node tests/xbox_gamepad_test.mjs
          node tests/lan_vs_smoke.mjs

      - name: Commit tested product fix and clean all one-shots
        if: steps.fix.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/recovery-pairing.trigger .github/recovery-pairing-v2.trigger .github/recovery-pairing-v3.trigger
          git rm -f .github/workflows/fix-recovery-pairing-once.yml .github/workflows/fix-recovery-pairing-diagnostic.yml .github/workflows/fix-recovery-pairing-v2.yml .github/workflows/fix-recovery-pairing-v3.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix controller crash recovery and robust same-network pairing'
          git push origin HEAD:main

      - name: Report V3 result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
        run: |
          set -euo pipefail
          tail_text="$(tail -n 120 /tmp/recovery-pairing-v3.log 2>/dev/null || true)"
          body="RECOVERY/PAIRING V3 · source=${GH_SHA} · fix=${FIX_OUTCOME}\n\n${tail_text}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
