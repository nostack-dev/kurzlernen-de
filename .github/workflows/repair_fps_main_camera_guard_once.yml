name: Repair FPS main-camera guard once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_fps_main_camera_guard_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict viewmodel presentation to player camera
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=p.read_text()
          old='renderHook=function(...args){previousSceneOnBeforeRender?.apply(this,args);const gun=scene.getObjectByName?.("WALK_PISTOL_3D");if(!gun)return;const mode=String(footWeapons()?.mode||"pistol"),camera=args[2]||bridge()?.threeCamera;setWeaponModeVisual(gun,mode);applyLatchedAimTransform(gun,camera,performance.now());};'
          new='renderHook=function(...args){previousSceneOnBeforeRender?.apply(this,args);const mainCamera=bridge()?.threeCamera,camera=args[2]||mainCamera;if(!mainCamera||camera!==mainCamera)return;const gun=scene.getObjectByName?.("WALK_PISTOL_3D");if(!gun)return;const mode=String(footWeapons()?.mode||"pistol");setWeaponModeVisual(gun,mode);applyLatchedAimTransform(gun,mainCamera,performance.now());const view=viewport();if(view)view.dataset.walkWeaponPresentationCamera="player-main-camera-only-v1";};'
          assert old in s, 'render hook contract changed'
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          grep -q 'camera!==mainCamera' sim/first_person_weapon_runtime_v3.mjs
          grep -q 'player-main-camera-only-v1' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Keep FPS aim latch on player camera only'
          git push origin HEAD:main
