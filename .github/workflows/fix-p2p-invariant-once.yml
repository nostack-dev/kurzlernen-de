name: One-shot P2P invariant correction

on:
  push:
    branches: [main]
    paths: ['.github/p2p-invariant.trigger']

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Replace obsolete direct-only invariant
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/architecture_invariants.mjs')
          s=p.read_text()
          old='requireText("sim/p2p_link.mjs","iceServers:[]");'
          new='requireText("sim/p2p_link.mjs","P2P_RTC_CONFIG");\nrequireText("sim/p2p_link.mjs",\'iceTransportPolicy:"all"\');\nrequireText("sim/p2p_link.mjs","stun:stun.cloudflare.com:3478");\nforbidText("sim/p2p_link.mjs","iceServers:[]","manual WebRTC pairing must retain STUN fallback while allowing direct LAN candidates");'
          if s.count(old)!=1: raise SystemExit(f'obsolete invariant marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/architecture_invariants.mjs
          node tests/architecture_invariants.mjs
          node tests/p2p_link_test.mjs
          node tests/lan_vs_smoke.mjs
      - name: Commit corrected invariant
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/architecture_invariants.mjs
          git commit -m 'Align P2P architecture invariant with STUN fallback'
          git push origin HEAD:main
      - name: Report invariant patch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.patch.outcome }}
        run: |
          body="P2P INVARIANT PATCH · source=${GH_SHA} · outcome=${OUTCOME}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
