name: Patch WORLD race UI to training-only

on:
  push:
    branches: ["fix/final-flight-safety-ux"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Make race HUD training-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
          fetch-depth: 0
      - name: Make laps and race timer training-only
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sim/real_world_bootstrap.mjs')
          s=p.read_text()
          anchor='''      body.solo-flight #viewport[data-world-mode="real"] #soloTopbar span,body.solo-flight #viewport[data-world-mode="real"] #soloTopbar button,body.solo-flight #viewport[data-world-mode="real"] #soloRaceHud,body.solo-flight #viewport[data-world-mode="real"] #soloClearance,body.solo-flight #viewport[data-world-mode="real"] .solo-action{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}\n'''
          rule='''      body.solo-flight #viewport[data-world-mode="real"] #soloRaceHud{display:none!important}\n'''
          assert s.count(anchor)==1, s.count(anchor)
          assert rule not in s
          p.write_text(s.replace(anchor,anchor+rule,1))

          p=Path('sim/simulator.mjs')
          s=p.read_text()
          anchor='''const raceTrack=new RaceTrack(scene,{laps:3});\n'''
          insert='''const raceTrack=new RaceTrack(scene,{laps:3});\nlet raceWorldActive=false;\nfunction updateTrainingRace(position){\n  const worldActive=$("viewport")?.dataset.worldMode==="real";\n  if(worldActive!==raceWorldActive){raceWorldActive=worldActive;raceTrack.reset();}\n  if(!worldActive)raceTrack.update(position,simTime,Boolean(latest.state&STATE_ARMED));\n}\n'''
          assert s.count(anchor)==1, s.count(anchor)
          s=s.replace(anchor,insert,1)
          old='''raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();'''
          new='''updateTrainingRace(physics.position());recordSession();'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))

          p=Path('tests/real_world_ui_smoke.mjs')
          s=p.read_text()
          marker='''  if(live.button!=="WORLD ✓"||live.active!=="1"||live.provider!=="openfreemap")throw new Error(`WORLD did not become live: ${JSON.stringify(live)}`);\n'''
          check='''  const worldRaceUi=await page.evaluate(()=>({display:getComputedStyle(document.querySelector("#soloRaceHud")).display,lap:document.querySelector("#soloLap")?.textContent||"",time:document.querySelector("#soloRaceTime")?.textContent||""}));\n  if(worldRaceUi.display!=="none")throw new Error(`WORLD must not show training laps/timer: ${JSON.stringify(worldRaceUi)}`);\n'''
          assert s.count(marker)==1, s.count(marker)
          assert check not in s
          p.write_text(s.replace(marker,marker+check,1))
          PY
          node --check sim/real_world_bootstrap.mjs
          node --check sim/simulator.mjs
          node --check tests/real_world_ui_smoke.mjs
          git diff --check
          rm .github/workflows/one-shot-world-training-race.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/real_world_bootstrap.mjs sim/simulator.mjs tests/real_world_ui_smoke.mjs .github/workflows/one-shot-world-training-race.yml
          git commit -m 'Make race HUD training-only'
          git push origin HEAD:fix/final-flight-safety-ux
