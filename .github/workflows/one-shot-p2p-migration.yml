name: One-shot simulator P2P migration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-p2p-migration.yml"
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic migration
        run: |
          set -euxo pipefail
          python3 tools/patch_simulator_to_p2p.py
          node --check sim/simulator.mjs
          grep -q 'new ViewPeerLink()' sim/simulator.mjs
          ! grep -q 'remoteRoom' sim/simulator.mjs
      - name: Commit migrated simulator
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/simulator.mjs
          git commit -m "Replace simulator relay input with serverless WebRTC P2P"
          git push
