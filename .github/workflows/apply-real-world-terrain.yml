          p=Path('sim/simulator.mjs');s=p.read_text()
          old='import {batteryOcvVoltage,batteryVoltageUnderLoad,scaleCurrentsToPackLimit,solveStaticPropulsionAuthority,MOTOR_BEARING_DRAG_NM_PER_RAD_S} from "./propulsion_authority.mjs";'
          new=old+'\nimport {normalizeWorldTerrainSnapshot,createWorldTerrainCollisionBody,destroyWorldTerrainCollisionBody} from "./world_terrain_physics.mjs";'
          assert old in s;s=s.replace(old,new,1)
          old='constructor(params,{graphics=false,scene=null}={}){this.graphics=graphics;this.scene=scene;this.noise=new Noise();this.world=null;this.body=null;this.group=null;this.rotors=[];this.worldBuildingCollisionSnapshot=normalizeBuildingCollisionSnapshot(null);this.worldBuildingCollisionState=null;this.worldBuildingCollisionRevision=0;'
          new='constructor(params,{graphics=false,scene=null}={}){this.graphics=graphics;this.scene=scene;this.noise=new Noise();this.world=null;this.body=null;this.group=null;this.rotors=[];this.worldTerrainSnapshot=normalizeWorldTerrainSnapshot(null);this.worldTerrainState=null;this.flatGroundBody=null;this.terrainSafetyBedBody=null;this.worldTerrainRevision=0;this.worldBuildingCollisionSnapshot=normalizeBuildingCollisionSnapshot(null);this.worldBuildingCollisionState=null;this.worldBuildingCollisionRevision=0;'
          assert old in s;s=s.replace(old,new,1)
          old='const groundDef=b3.b3DefaultBodyDef();groundDef.position=[0,0,-.05];const ground=b3.b3CreateBody(this.world,groundDef),groundShape=b3.b3DefaultShapeDef();groundShape.baseMaterial.friction=.75;groundShape.baseMaterial.restitution=.03;groundShape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,groupIndex:0};b3.b3CreateBoxShape(ground,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);'
          new='this.rebuildWorldTerrain();'
          assert old in s;s=s.replace(old,new,1)
          marker='  setWorldBuildingCollisions(value){const snapshot=normalizeBuildingCollisionSnapshot(value);'
          insert='''  setWorldTerrain(value){const snapshot=normalizeWorldTerrainSnapshot(value);if(snapshot.hash===this.worldTerrainSnapshot.hash)return false;this.worldTerrainSnapshot=snapshot;this.rebuildWorldTerrain();return true;}\n  rebuildWorldTerrain(){\n    if(!this.world)return;destroyWorldTerrainCollisionBody(b3,this.worldTerrainState);this.worldTerrainState=null;try{if(this.flatGroundBody&&b3.b3Body_IsValid(this.flatGroundBody))b3.b3DestroyBody(this.flatGroundBody);}catch{}this.flatGroundBody=null;try{if(this.terrainSafetyBedBody&&b3.b3Body_IsValid(this.terrainSafetyBedBody))b3.b3DestroyBody(this.terrainSafetyBedBody);}catch{}this.terrainSafetyBedBody=null;\n    const shape=b3.b3DefaultShapeDef();shape.baseMaterial.friction=.75;shape.baseMaterial.restitution=.03;shape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,groupIndex:0};\n    if(this.worldTerrainSnapshot.hash){this.worldTerrainState=createWorldTerrainCollisionBody(b3,this.world,this.worldTerrainSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA});const bedDef=b3.b3DefaultBodyDef();bedDef.position=[0,0,-120];this.terrainSafetyBedBody=b3.b3CreateBody(this.world,bedDef);b3.b3CreateBoxShape(this.terrainSafetyBedBody,shape,TERRAIN_HALF,TERRAIN_HALF,.25);}\n    else{const groundDef=b3.b3DefaultBodyDef();groundDef.position=[0,0,-.05];this.flatGroundBody=b3.b3CreateBody(this.world,groundDef);b3.b3CreateBoxShape(this.flatGroundBody,shape,TERRAIN_HALF,TERRAIN_HALF,.05);}\n    this.worldTerrainRevision++;\n  }\n'''
          assert marker in s;s=s.replace(marker,insert+marker,1)
          old='globalThis.__arondightRealWorld?.attachBuildingCollisionSink?.(snapshot=>physics.setWorldBuildingCollisions(snapshot));'
          new='globalThis.__arondightRealWorld?.attachTerrainCollisionSink?.(snapshot=>physics.setWorldTerrain(snapshot));\n'+old
          assert old in s;s=s.replace(old,new,1)
          old='const relative=this.localVector(sub(this.linear(),p.wind)),cdA=this.cdA,drag=relative.map((v,i)=>-.5*p.rho*cdA[i]*v*Math.abs(v));'
          new='const relative=this.localVector(sub(this.linear(),p.wind)),cdA=this.cdA,horizontalSpeed=Math.hypot(relative[0],relative[1]),drag=[-.5*p.rho*cdA[0]*relative[0]*horizontalSpeed,-.5*p.rho*cdA[1]*relative[1]*horizontalSpeed,-.5*p.rho*cdA[2]*relative[2]*Math.abs(relative[2])];'
          assert old in s;s=s.replace(old,new,1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/real_world_bootstrap.mjs');s=p.read_text()
          old='import {buildingFootprintsFromFeatures,buildingFootprintHash,buildingCollisionPrismsFromFootprints} from "./world_building_collisions.mjs";'
          new=old+'\nimport {buildWorldTerrainSnapshot,terrainHeightFromSnapshot} from "./world_terrain_physics.mjs";'
          assert old in s;s=s.replace(old,new,1)
          old='const WORLD_IMAGERY_MAX_ZOOM=19;'
          new='''const WORLD_IMAGERY_MAX_ZOOM=19;\nconst WORLD_TERRAIN_SOURCE_ID="arondight45-world-dem";\nconst WORLD_TERRAIN_HILLSHADE_LAYER_ID="arondight45-world-hillshade";\nconst WORLD_TERRAIN_TILEJSON="https://tiles.mapterhorn.com/tilejson.json";\nconst WORLD_TERRAIN_GRID_COUNT=25;\nconst WORLD_TERRAIN_CELL_M=20;\nconst WORLD_TERRAIN_SYNC_MS=900;\nconst WORLD_TERRAIN_MOVE_M=70;'''
          assert old in s;s=s.replace(old,new,1)
          old='this.buildingCollisionRevisions=0;this.cameraCollisionResolver=null;'
          new='this.buildingCollisionRevisions=0;this.cameraCollisionResolver=null;this.terrainCollisionSink=null;this.terrainSnapshot=null;this.terrainOriginElevationM=null;this.terrainLastSyncMs=-Infinity;this.terrainLastCenter=[Infinity,Infinity];this.terrainSyncPromise=null;this.terrainRevisions=0;this.terrainPatternsInstalled=false;'
          assert old in s;s=s.replace(old,new,1)
          marker='  attachBuildingCollisionSink(sink){this.buildingCollisionSink='
          insert='''  attachTerrainCollisionSink(sink){this.terrainCollisionSink=typeof sink==="function"?sink:null;if(this.terrainCollisionSink)this.terrainCollisionSink(this.terrainSnapshot);return Boolean(this.terrainCollisionSink);}\n  clearTerrainPhysics(){this.terrainSnapshot=null;this.terrainLastCenter=[Infinity,Infinity];this.terrainLastSyncMs=-Infinity;this.terrainCollisionSink?.(null);const viewport=$("viewport");if(viewport){viewport.dataset.worldTerrainStatus="inactive";viewport.dataset.worldTerrainTriangles="0";}return true;}\n  async waitForTerrainOrigin(timeoutMs=15000){const started=performance.now();while(performance.now()-started<timeoutMs){const value=this.map?.queryTerrainElevation?.([this.originLon,this.originLat]);if(Number.isFinite(value)){this.terrainOriginElevationM=value;const viewport=$("viewport");if(viewport)viewport.dataset.worldTerrainOriginElevationM=value.toFixed(3);return value;}await new Promise(resolve=>setTimeout(resolve,120));}throw Error("REAL WORLD DEM elevation did not load at GPS origin");}\n  terrainHeightLocal(x,y){if(!Number.isFinite(this.terrainOriginElevationM)||!this.map)return null;const ll=metersToLngLat(this.originLon,this.originLat,Number(x)||0,Number(y)||0),absolute=this.map.queryTerrainElevation?.(ll);return Number.isFinite(absolute)?absolute-this.terrainOriginElevationM:null;}\n  async syncTerrainPhysics(force=false){\n    if(!this.active||!this.map||!this.terrainCollisionSink||!Number.isFinite(this.terrainOriginElevationM))return false;if(this.terrainSyncPromise)return this.terrainSyncPromise;const now=performance.now(),airframe=this.airframeFor(this.threeScene),center=[Number(airframe?.position?.x)||0,Number(airframe?.position?.y)||0],moved=Math.hypot(center[0]-this.terrainLastCenter[0],center[1]-this.terrainLastCenter[1]);if(!force&&now-this.terrainLastSyncMs<WORLD_TERRAIN_SYNC_MS&&moved<WORLD_TERRAIN_MOVE_M)return false;\n    this.terrainSyncPromise=(async()=>{const samples=new Map(),half=(WORLD_TERRAIN_GRID