name: Apply real world terrain

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == 'RUN_REAL_WORLD_TERRAIN_FINAL'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Integrate real DEM, buildings and safe spawn
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # Preserve OSM tags on collision footprints so the visual layer can use
          # real material/levels/roof metadata instead of uniform grey blocks.
          p=Path('sim/world_building_collisions.mjs'); s=p.read_text()
          old="const candidate={key,outer,holes,base,top,center:centerPoint,distance,area};"
          new="const candidate={key,outer,holes,base,top,center:centerPoint,distance,area,properties:Object.freeze({...properties})};"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          # Respawn must be visibly displaced, then expand search if the first
          # ring is blocked by terrain/buildings.
          p=Path('sim/world_spawn_safety.mjs'); s=p.read_text()
          s=s.replace('export const WORLD_RESPAWN_MIN_OFFSET_M=8;','export const WORLD_RESPAWN_MIN_OFFSET_M=18;')
          s=s.replace('export const WORLD_RESPAWN_MAX_OFFSET_M=32;','export const WORLD_RESPAWN_MAX_OFFSET_M=35;')
          old="if(randomized){for(let i=0;i<n;i++){const radius=minOffsetM+(maxOffsetM-minOffsetM)*Math.sqrt(rnd()),angle=rnd()*Math.PI*2;out.push([origin[0]+Math.cos(angle)*radius,origin[1]+Math.sin(angle)*radius]);}}"
          new="if(randomized){for(let i=0;i<n;i++){const radius=minOffsetM+(maxOffsetM-minOffsetM)*Math.sqrt(rnd()),angle=rnd()*Math.PI*2;out.push([origin[0]+Math.cos(angle)*radius,origin[1]+Math.sin(angle)*radius]);}for(const radius of [50,70,95])for(let i=0;i<24;i++){const angle=(i/24+rnd()*.035)*Math.PI*2;out.push([origin[0]+Math.cos(angle)*radius,origin[1]+Math.sin(angle)*radius]);}}"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          # Physics: swap the flat training plane for the real DEM triangle mesh
          # only while WORLD is active. The same terrain category remains the
          # source for airframe collision, AGL and camera occlusion.
          p=Path('sim/simulator.mjs'); s=p.read_text()
          anchor='import {batteryOcvVoltage,batteryVoltageUnderLoad,scaleCurrentsToPackLimit,solveStaticPropulsionAuthority,MOTOR_BEARING_DRAG_NM_PER_RAD_S} from "./propulsion_authority.mjs";'
          if 'world_terrain_physics.mjs' not in s:
              s=replace_once(s,anchor,anchor+'\nimport {createWorldTerrainCollision,destroyWorldTerrainCollision} from "./world_terrain_physics.mjs";','terrain import')
          old='constructor(params,{graphics=false,scene=null}={}){this.graphics=graphics;this.scene=scene;this.noise=new Noise();this.world=null;this.body=null;this.group=null;this.rotors=[];this.worldBuildingCollisionSnapshot=normalizeBuildingCollisionSnapshot(null);'
          new='constructor(params,{graphics=false,scene=null}={}){this.graphics=graphics;this.scene=scene;this.noise=new Noise();this.world=null;this.body=null;this.group=null;this.rotors=[];this.worldTerrainSnapshot=null;this.worldTerrainCollisionState=null;this.flatGroundBody=null;this.worldTerrainRevision=0;this.worldBuildingCollisionSnapshot=normalizeBuildingCollisionSnapshot(null);'
          if old in s: s=s.replace(old,new,1)
          old='if(this.world){this.worldBuildingCollisionState=null;b3.b3DestroyWorld(this.world);}'
          new='if(this.world){this.worldBuildingCollisionState=null;this.worldTerrainCollisionState=null;this.flatGroundBody=null;b3.b3DestroyWorld(this.world);}'
          if old in s: s=s.replace(old,new,1)
          flat='const groundDef=b3.b3DefaultBodyDef();groundDef.position=[0,0,-.05];const ground=b3.b3CreateBody(this.world,groundDef),groundShape=b3.b3DefaultShapeDef();groundShape.baseMaterial.friction=.75;groundShape.baseMaterial.restitution=.03;groundShape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,groupIndex:0};b3.b3CreateBoxShape(ground,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);'
          if flat in s: s=s.replace(flat,'this.rebuildWorldTerrain();',1)
          marker='  setWorldBuildingCollisions(value){const snapshot=normalizeBuildingCollisionSnapshot(value);'
          if '  setWorldTerrain(value){' not in s:
              insert='''  setWorldTerrain(value){const snapshot=value?.hash?value:null;if((snapshot?.hash||"")===(this.worldTerrainSnapshot?.hash||""))return false;this.worldTerrainSnapshot=snapshot;this.rebuildWorldTerrain();return true;}\n  rebuildWorldTerrain(){\n    if(!this.world)return;destroyWorldTerrainCollision(b3,this.worldTerrainCollisionState);this.worldTerrainCollisionState=null;try{if(this.flatGroundBody&&b3.b3Body_IsValid(this.flatGroundBody))b3.b3DestroyBody(this.flatGroundBody);}catch{}this.flatGroundBody=null;\n    const groundShape=b3.b3DefaultShapeDef();groundShape.baseMaterial.friction=.75;groundShape.baseMaterial.restitution=.03;groundShape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,groupIndex:0};\n    if(this.worldTerrainSnapshot?.hash)this.worldTerrainCollisionState=createWorldTerrainCollision(b3,this.world,this.worldTerrainSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA});\n    else{const groundDef=b3.b3DefaultBodyDef();groundDef.position=[0,0,-.05];this.flatGroundBody=b3.b3CreateBody(this.world,groundDef);b3.b3CreateBoxShape(this.flatGroundBody,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);}\n    this.worldTerrainRevision++;\n  }\n  raycastWorldSpawn(x,y,terrainZ=0){const startZ=Math.max(Number(terrainZ)||0,0)+180,range=420,filter=b3.b3DefaultQueryFilter();filter.categoryBits=QUERY_CAMERA;filter.maskBits=COLLISION_TERRAIN;const hit=b3.b3World_CastRayClosest(this.world,[Number(x)||0,Number(y)||0,startZ],[0,0,-range],filter),fraction=Number(hit?.fraction);if(!hit?.hit||!Number.isFinite(fraction)||fraction<0||fraction>1)return null;const normal=Array.isArray(hit.normal)?hit.normal.map(Number):[0,0,1];return{z:startZ-range*fraction,normal};}\n  relocateWorld(position){if(!this.body||!Array.isArray(position)||position.length<3||!position.every(Number.isFinite))return false;const rotation=[0,0,0,1];try{b3.b3Body_GetRotation(rotation,this.body);}catch{}b3.b3Body_SetTransform(this.body,position,rotation);b3.b3Body_SetLinearVelocity(this.body,[0,0,0]);try{b3.b3Body_SetAngularVelocity(this.body,[0,0,0]);}catch{}this.renderPreviousPosition=[...position];this.renderCurrentPosition=[...position];this.renderPreviousVelocity=[0,0,0];this.renderCurrentVelocity=[0,0,0];if(this.group){this.group.position.set(...position);this.group.quaternion.set(rotation[0],rotation[1],rotation[2],rotation[3]);}return true;}\n'''
              s=replace_once(s,marker,insert+marker,'terrain methods')
          attach='globalThis.__arondightRealWorld?.attachBuildingCollisionSink?.(snapshot=>physics.setWorldBuildingCollisions(snapshot));'
          if 'attachTerrainCollisionSink' not in s:
              s=replace_once(s,attach,'globalThis.__arondightRealWorld?.attachTerrainCollisionSink?.(snapshot=>physics.setWorldTerrain(snapshot));\nglobalThis.__arondightRealWorld?.attachSpawnPhysics?.({raycastDown:(x,y,z)=>physics.raycastWorldSpawn(x,y,z),relocate:position=>physics.relocateWorld(position)});\n'+attach,'bridge physics attachments')
          p.write_text(s)

          # WORLD bridge: Mapterhorn DEM is the shared height source for MapLibre
          # terrain and the local Box3D mesh. OSM buildings are founded on the DEM.
          p=Path('sim/real_world_bootstrap.mjs'); s=p.read_text()
          base='import {buildingFootprintsFromFeatures,buildingFootprintHash,buildingCollisionPrismsFromFootprints} from "./world_building_collisions.mjs";'
          imports='''\nimport {buildTerrainSnapshot,terrainHeightAt,raycastTerrainSnapshot,WORLD_TERRAIN_HALF_EXTENT_M,WORLD_TERRAIN_GRID_SIZE,WORLD_TERRAIN_REBUILD_DISTANCE_M,WORLD_TERRAIN_SYNC_MIN_MS} from "./world_terrain.mjs";\nimport {WorldDemSampler,WORLD_DEM_TILE_URL,WORLD_DEM_TILE_SIZE,WORLD_DEM_ZOOM,WORLD_DEM_ENCODING,WORLD_DEM_ATTRIBUTION} from "./world_dem_sampler.mjs";\nimport {WorldBuildingVisualLayer} from "./world_building_visuals.mjs";\nimport {solveRaytracedSafeSpawn} from "./world_spawn_safety.mjs";'''
          if 'WorldDemSampler' not in s: s=replace_once(s,base,base+imports,'WORLD imports')
          c='const WORLD_IMAGERY_MAX_ZOOM=19;'
          if 'WORLD_DEM_SOURCE_ID' not in s:
              s=replace_once(s,c,c+'\nconst WORLD_DEM_SOURCE_ID="arondight45-world-dem";\nconst WORLD_HILLSHADE_LAYER_ID="arondight45-world-hillshade";','DEM constants')
          ctor='this.buildingSourceId=null;this.buildingCollisionSink=null;this.buildingCollisionSnapshot=Object.freeze({hash:"",footprintCount:0,prismCount:0,prisms:[]});this.buildingCollisionDirty=true;this.buildingCollisionLastSyncMs=-Infinity;this.buildingCollisionLastCenter=[Infinity,Infinity];this.buildingCollisionRevisions=0;this.cameraCollisionResolver=null;'
          if 'this.demSampler=new WorldDemSampler()' not in s:
              s=replace_once(s,ctor,ctor+'this.terrainCollisionSink=null;this.terrainSnapshot=null;this.terrainSyncing=false;this.terrainLastSyncMs=-Infinity;this.terrainLastCenter=[Infinity,Infinity];this.demSampler=new WorldDemSampler();this.spawnPhysics=null;this.worldSpawnInitialized=false;this.buildingVisualLayer=null;','bridge terrain ctor')
          attach_three='this.threeRenderer=renderer;this.threeScene=scene;this.threeCamera=camera;if(this.flightPixelRatio===null)this.flightPixelRatio=renderer.getPixelRatio();if(this.flightShadowEnabled===null)this.flightShadowEnabled=renderer.shadowMap.enabled;'
          if 'WorldBuildingVisualLayer(scene)' not in s:
              s=replace_once(s,attach_three,attach_three+'if(this.buildingVisualLayer?.scene!==scene){this.buildingVisualLayer?.destroy?.();this.buildingVisualLayer=new WorldBuildingVisualLayer(scene);}','visual layer attach')
          hook='  attachBuildingCollisionSink(sink){this.buildingCollisionSink=typeof sink==="function"?sink:null;'
          if '  attachTerrainCollisionSink(sink){' not in s:
              methods='''  attachTerrainCollisionSink(sink){this.terrainCollisionSink=typeof sink==="function"?sink:null;if(this.terrainCollisionSink)this.terrainCollisionSink(this.terrainSnapshot);return Boolean(this.terrainCollisionSink);}\n  attachSpawnPhysics(api){this.spawnPhysics=api&&typeof api.raycastDown==="function"&&typeof api.relocate==="function"?api:null;return Boolean(this.spawnPhysics);}\n  addWorldTerrain(){if(!this.map)return;try{if(!this.map.getSource(WORLD_DEM_SOURCE_ID))this.map.addSource(WORLD_DEM_SOURCE_ID,{type:"raster-dem",tiles:[WORLD_DEM_TILE_URL],tileSize:WORLD_DEM_TILE_SIZE,maxzoom:WORLD_DEM_ZOOM,encoding:WORLD_DEM_ENCODING,attribution:WORLD_DEM_ATTRIBUTION});this.map.setTerrain({source:WORLD_DEM_SOURCE_ID,exaggeration:1});if(!this.map.getLayer(WORLD_HILLSHADE_LAYER_ID)){const layer={id:WORLD_HILLSHADE_LAYER_ID,type:"hillshade",source:WORLD_DEM_SOURCE_ID,paint:{"hillshade-exaggeration":.22,"hillshade-shadow-color":"#15222a","hillshade-highlight-color":"#f4ead1","hillshade-accent-color":"#50656d"}};const before=this.map.getLayer(WORLD_IMAGERY_LAYER_ID)?WORLD_IMAGERY_LAYER_ID:undefined;if(before)this.map.addLayer(layer,before);else this.map.addLayer(layer);}}catch(error){throw new Error(`WORLD DEM terrain unavailable: ${error?.message||error}`);}}\n  async syncTerrain(force=false){if(this.terrainSyncing||!this.terrainCollisionSink||!Number.isFinite(this.originLon)||!Number.isFinite(this.originLat))return false;const now=performance.now(),airframe=this.airframeFor(this.threeScene),center=[Number(airframe?.position?.x)||0,Number(airframe?.position?.y)||0],moved=Math.hypot(center[0]-this.terrainLastCenter[0],center[1]-this.terrainLastCenter[1]);if(!force&&now-this.terrainLastSyncMs<WORLD_TERRAIN_SYNC_MIN_MS&&moved<WORLD_TERRAIN_REBUILD_DISTANCE_M)return false;this.terrainSyncing=true;try{const half=WORLD_TERRAIN_HALF_EXTENT_M,size=WORLD_TERRAIN_GRID_SIZE,step=2*half/(size-1),geo=[];for(let row=0;row<size;row++)for(let col=0;col<size;col++){const x=center[0]-half+col*step,y=center[1]-half+row*step;geo.push(metersToLngLat(this.originLon,this.originLat,x,y));}geo.push([this.originLon,this.originLat]);await this.demSampler.sampleMany(geo);const originElevation=Number(this.demSampler.sampleCached(this.originLon,this.originLat));if(!Number.isFinite(originElevation))throw new Error("origin DEM elevation missing");const snapshot=buildTerrainSnapshot({originElevationM:originElevation,center,halfExtentM:half,gridSize:size,sampleMsl:(x,y)=>{const ll=metersToLngLat(this.originLon,this.originLat,x,y);return this.demSampler.sampleCached(ll[0],ll[1]);}});if(!snapshot)throw new Error("DEM snapshot incomplete");this.terrainSnapshot=snapshot;this.terrainCollisionSink(snapshot);this.terrainLastCenter=center;this.terrainLastSyncMs=now;this.buildingCollisionDirty=true;const viewport=$("viewport");if(viewport){viewport.dataset.worldTerrainStatus="box3d-active";viewport.dataset.worldTerrainSource="mapterhorn-terrarium";viewport.dataset.worldTerrainTriangles=String(snapshot.indices.length/3);viewport.dataset.worldTerrainRangeM=(snapshot.maxZ-snapshot.minZ).toFixed(2);viewport.dataset.worldTerrainOriginElevationM=originElevation.toFixed(2);}return true;}finally{this.terrainSyncing=false;}}\n  relocateSafeSpawn({mode="initial",around=null,seed}={}){if(!this.terrainSnapshot||!this.spawnPhysics)return null;const airframe=this.airframeFor(this.threeScene),reference=Array.isArray(around)?around:[Number(airframe?.position?.x)||0,Number(airframe?.position?.y)||0,Number(airframe?.position?.z)||0],result=solveRaytracedSafeSpawn({reference,terrainHeightAt:(x,y)=>terrainHeightAt(this.terrainSnapshot,x,y),raycastDown:(x,y,z)=>this.spawnPhysics.raycastDown(x,y,z),prisms:this.buildingCollisionSnapshot?.prisms||[],randomized:mode==="respawn",seed,airframeSupportM:.022});if(!result)return null;if(!this.spawnPhysics.relocate([...result.position]))return null;if(airframe?.position)airframe.position.set(...result.position);const offsetM=Math.hypot(result.position[0]-reference[0],result.position[1]-reference[1]);this.worldSpawnInitialized=true;const viewport=$("viewport");if(viewport){viewport.dataset.worldSpawnSafe="1";viewport.dataset.worldSpawnMode=mode;viewport.dataset.worldSpawnOffsetM=offsetM.toFixed(2);viewport.dataset.worldSpawnGroundM=result.terrainZ.toFixed(3);}return{position:[...result.position],groundM:result.terrainZ,offsetM,candidateIndex:result.candidateIndex};}\n'''
              s=replace_once(s,hook,methods+hook,'bridge terrain methods')
          # Terrain-aware buildings: preserve real building height but put the base
          # on the local DEM elevation at each footprint centroid.
          old='const features=this.buildingCollisionFeatures();if(!features.length){const viewport=$("viewport");if(viewport)viewport.dataset.worldBuildingCollisionStatus="waiting-for-vector-tiles";return false;}const footprints=buildingFootprintsFromFeatures(features,{project:(longitude,latitude)=>lngLatToMeters(this.originLon,this.originLat,longitude,latitude),center}),hash=buildingFootprintHash(footprints);'
          new='const features=this.buildingCollisionFeatures();if(!features.length){const viewport=$("viewport");if(viewport)viewport.dataset.worldBuildingCollisionStatus="waiting-for-vector-tiles";return false;}const rawFootprints=buildingFootprintsFromFeatures(features,{project:(longitude,latitude)=>lngLatToMeters(this.originLon,this.originLat,longitude,latitude),center}),footprints=rawFootprints.map(footprint=>{const ground=this.terrainSnapshot?terrainHeightAt(this.terrainSnapshot,footprint.center[0],footprint.center[1]):0;return Number.isFinite(ground)?{...footprint,base:ground+Number(footprint.base||0),top:ground+Number(footprint.top||8)}:footprint;}),hash=buildingFootprintHash(footprints);'
          if old in s: s=s.replace(old,new,1)
          old='this.buildingCollisionSink(snapshot);this.buildingCollisionSnapshot=snapshot;this.buildingCollisionDirty=false;this.buildingCollisionLastCenter=center;this.buildingCollisionRevisions++;'
          new='this.buildingCollisionSink(snapshot);this.buildingCollisionSnapshot=snapshot;this.buildingVisualLayer?.update?.(footprints,hash);this.buildingVisualLayer?.setVisible?.(true);this.buildingCollisionDirty=false;this.buildingCollisionLastCenter=center;this.buildingCollisionRevisions++;const visualViewport=$("viewport");if(visualViewport)visualViewport.dataset.worldBuildingVisualMeshes=String(this.buildingVisualLayer?.meshCount||0);if(!this.worldSpawnInitialized&&this.terrainSnapshot)this.relocateSafeSpawn({mode:"initial",around:[0,0,0]});'
          if old in s: s=s.replace(old,new,1)
          # MapLibre uses absolute MSL altitude, while the flight plant remains
          # local relative-to-origin elevation.
          old='if(typeof this.map.calculateCameraOptionsFromTo!=="function")throw Error("MapLibre eye/target camera API unavailable");const eye=metersToLngLat(this.originLon,this.originLat,p.x,p.y),options=this.map.calculateCameraOptionsFromTo(new LngLat(eye[0],eye[1]),p.z,new LngLat(center[0],center[1]),target.z),zoom=Number(options.zoom),view={...options,center,elevation:target.z,roll:clamp(roll,-85,85)};viewport.dataset.worldMapEye=`${eye[0].toFixed(7)},${eye[1].toFixed(7)}`;viewport.dataset.worldMapEyeElevation=p.z.toFixed(3);'
          new='if(typeof this.map.calculateCameraOptionsFromTo!=="function")throw Error("MapLibre eye/target camera API unavailable");const eye=metersToLngLat(this.originLon,this.originLat,p.x,p.y),mslBase=Number(this.terrainSnapshot?.originElevationM)||0,options=this.map.calculateCameraOptionsFromTo(new LngLat(eye[0],eye[1]),p.z+mslBase,new LngLat(center[0],center[1]),target.z+mslBase),zoom=Number(options.zoom),view={...options,center,elevation:target.z+mslBase,roll:clamp(roll,-85,85)};viewport.dataset.worldMapEye=`${eye[0].toFixed(7)},${eye[1].toFixed(7)}`;viewport.dataset.worldMapEyeElevation=(p.z+mslBase).toFixed(3);'
          if old in s: s=s.replace(old,new,1)
          # Ground bullet/decal ray follows DEM rather than z=0.
          old='if(d.z<-.0001){const groundT=-o.z/d.z;if(groundT>0&&groundT<bestT&&groundT<1200)consider(groundT,0,0,1);}if(!Number.isFinite(bestT))return null;'
          new='if(this.terrainSnapshot){const terrainHit=raycastTerrainSnapshot(this.terrainSnapshot,o,d,1200);if(terrainHit&&terrainHit.distance<bestT)consider(terrainHit.distance,...terrainHit.normal);}else if(d.z<-.0001){const groundT=-o.z/d.z;if(groundT>0&&groundT<bestT&&groundT<1200)consider(groundT,0,0,1);}if(!Number.isFinite(bestT))return null;'
          if old in s: s=s.replace(old,new,1)
          # Add the DEM source before the final map presentation layers.
          old='this.applyFlightPalette();this.stripFlightClutter();this.addWorldImagery();'
          new='this.applyFlightPalette();this.stripFlightClutter();this.addWorldImagery();this.addWorldTerrain();'
          if old in s: s=s.replace(old,new,1)
          # When entering WORLD, DEM must be physical before the mode is declared live.
          old='await this.createMap(longitude,latitude);this.active=true;this.loading=false;'
          new='await this.createMap(longitude,latitude);await this.syncTerrain(true);this.active=true;this.loading=false;'
          if old in s: s=s.replace(old,new,1)
          # Existing building sync remains authoritative; then safe-spawn once tiles
          # are loaded (or immediately if no building feature exists nearby).
          old='this.minimapLastQueryMs=-Infinity;this.minimapLastDrawMs=-Infinity;this.minimapQueries=0;this.buildingCollisionDirty=true;this.renderLookHud();this.syncBuildingCollisions(true);'
          new='this.minimapLastQueryMs=-Infinity;this.minimapLastDrawMs=-Infinity;this.minimapQueries=0;this.buildingCollisionDirty=true;this.renderLookHud();for(let attempt=0;attempt<20;attempt++){this.syncBuildingCollisions(true);if(this.buildingCollisionSnapshot.footprintCount>0||this.map?.isSourceLoaded?.(this.buildingSourceId))break;await new Promise(resolve=>setTimeout(resolve,150));}if(!this.worldSpawnInitialized)this.relocateSafeSpawn({mode:"initial",around:[0,0,0]});'
          if old in s: s=s.replace(old,new,1)
          # Deactivation restores the deterministic flat training plane.
          old='this.active=false;this.loading=false;this.lastMapSyncFrameSerial=-1;this.clearBuildingCollisions();this.resetLook(true);'
          new='this.active=false;this.loading=false;this.lastMapSyncFrameSerial=-1;this.clearBuildingCollisions();this.terrainCollisionSink?.(null);this.terrainSnapshot=null;this.worldSpawnInitialized=false;this.buildingVisualLayer?.setVisible?.(false);this.resetLook(true);'
          if old in s: s=s.replace(old,new,1)
          # Keep terrain moving with the local flight bubble.
          old='if(!this.active)return false;\n    this.syncBuildingCollisions();\n    this.renderReal(scene,camera);'
          new='if(!this.active)return false;\n    this.syncTerrain().catch(error=>console.warn("WORLD DEM sync warning:",error));this.syncBuildingCollisions();\n    this.renderReal(scene,camera);'
          if old in s: s=s.replace(old,new,1)
          # Actual combat respawn: relocate away from the destruction point before
          # re-enabling the local player.
          old='if(killed){clearTimeout(this.vsRespawnTimer);this.vsRespawnTimer=setTimeout(()=>{if(!this.vsSession)return;this.vsLocalDead=false;this.vsLocalHealth=100;this.updateVsCombatHud(true);this.vsSession.sendCombat({type:"respawn",hp:100});},2200);}return;'
          new='if(killed){const own=this.airframeFor(this.threeScene),deathPoint=[Number(own?.position?.x)||0,Number(own?.position?.y)||0,Number(own?.position?.z)||0];clearTimeout(this.vsRespawnTimer);this.vsRespawnTimer=setTimeout(()=>{if(!this.vsSession)return;if(this.active)this.relocateSafeSpawn({mode:"respawn",around:deathPoint});this.vsLocalDead=false;this.vsLocalHealth=100;this.updateVsCombatHud(true);this.vsSession.sendCombat({type:"respawn",hp:100});},2200);}return;'
          if old in s: s=s.replace(old,new,1)
          # Minimap diagnostics should no longer describe a flat world.
          s=s.replace('viewport.dataset.worldMinimapHeightMode="flat-footprints"','viewport.dataset.worldMinimapHeightMode=this.terrainSnapshot?"dem-terrain":"flat-footprints"')
          p.write_text(s)
          PY

          node --check sim/world_building_collisions.mjs
          node --check sim/world_spawn_safety.mjs
          node --check sim/world_dem_sampler.mjs
          node --check sim/world_terrain.mjs
          node --check sim/world_terrain_physics.mjs
          node --check sim/world_building_style.mjs
          node --check sim/world_building_visuals.mjs
          node --check sim/simulator.mjs
          node --check sim/real_world_bootstrap.mjs
          node tests/world_terrain_test.mjs
          node tests/world_dem_sampler_test.mjs
          node tests/world_spawn_safety_test.mjs
          node tests/world_building_style_test.mjs
          node tests/component_mass_model_test.mjs
          node tests/propulsion_authority_test.mjs
          node tests/world_terrain_box3d_test.mjs node_modules/box3d.js/dist/box3d.inline.mjs
          node tests/world_spawn_box3d_test.mjs node_modules/box3d.js/dist/box3d.inline.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/world_building_collisions.mjs sim/world_spawn_safety.mjs sim/simulator.mjs sim/real_world_bootstrap.mjs
          if git diff --cached --quiet; then echo 'No integration changes'; else git commit -m 'Integrate real DEM terrain and safe combat respawn'; git push origin HEAD:main; fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "REAL_WORLD_TERRAIN_FINAL_OK $SOURCE_SHA"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "REAL_WORLD_TERRAIN_FINAL_FAILED"
