.addImage(name,ctx.getImageData(0,0,64,64),{pixelRatio:1});};pattern("facade-brick",{wall:"#9f765f",mortar:"#cdb5a6",window:"#233d4d",accent:"#6e4f42"});pattern("facade-plaster",{wall:"#d5c8ae",mortar:"#c0b397",window:"#365766",accent:"#eee3c9"});pattern("facade-concrete",{wall:"#9da3a1",mortar:"#777e7c",window:"#244553",accent:"#b7bcba"});pattern("facade-glass",{wall:"#507887",mortar:"#243f4b",window:"#8eb3bd",accent:"#b9d0d3"});this.terrainPatternsInstalled=true;}\n'''
