name: Apply real world terrain

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'RUN_REAL_WORLD_TERRAIN_PATCH'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build real DEM terrain and realistic building presentation
        run: |
          set -euxo pipefail
          cat > sim/world_terrain_physics.mjs <<'EOF'
          const finite=value=>Number.isFinite(Number(value));
          const clamp=(value,lo,hi)=>Math.max(lo,Math.min(hi,value));
          const EMPTY=Object.freeze({hash:'',gridCount:0,cellM:0,center:[0,0],originElevationM:0,minHeightM:0,maxHeightM:0,vertexCount:0,triangleCount:0,positions:new Float32Array(0),indices:new Uint32Array(0)});
          const checksum=values=>{let h=2166136261;for(const value of values){const q=Math.round(Number(value)*100);h^=q&255;h=Math.imul(h,16777619);h^=(q>>>8)&255;h=Math.imul(h,16777619);}return(h>>>0).toString(16).padStart(8,'0');};
          export function buildWorldTerrainSnapshot({center=[0,0],gridCount=25,cellM=20,originElevationM=0,sampleHeight}={}){
            const count=Math.floor(Number(gridCount)),cell=Number(cellM),cx=Number(center?.[0]),cy=Number(center?.[1]),origin=Number(originElevationM);
            if(!(count>=5&&count%2===1)||!(cell>0)||![cx,cy,origin].every(Number.isFinite)||typeof sampleHeight!=='function')throw new Error('invalid terrain snapshot inputs');
            const half=(count-1)/2,positions=new Float32Array(count*count*3),indices=new Uint32Array((count-1)*(count-1)*6),heights=new Float32Array(count*count);let p=0,min=Infinity,max=-Infinity;
            for(let iy=0;iy<count;iy++)for(let ix=0;ix<count;ix++){
              const x=cx+(ix-half)*cell,y=cy+(iy-half)*cell,z=Number(sampleHeight(x,y));if(!Number.isFinite(z))throw new Error(`terrain sample missing at ${x},${y}`);const index=iy*count+ix;heights[index]=z;positions[p++]=x;positions[p++]=y;positions[p++]=z;min=Math.min(min,z);max=Math.max(max,z);
            }
            let q=0;for(let iy=0;iy<count-1;iy++)for(let ix=0;ix<count-1;ix++){const a=iy*count+ix,b=a+1,c=a+count,d=c+1;indices[q++]=a;indices[q++]=b;indices[q++]=d;indices[q++]=a;indices[q++]=d;indices[q++]=c;}
            const hash=`dem-${Math.round(cx/cell)}-${Math.round(cy/cell)}-${checksum([min,max,...heights.filter((_,i)=>i%Math.max(1,Math.floor(heights.length/32))===0)])}`;
            return Object.freeze({hash,gridCount:count,cellM:cell,center:Object.freeze([cx,cy]),originElevationM:origin,minHeightM:min,maxHeightM:max,vertexCount:count*count,triangleCount:(count-1)*(count-1)*2,positions,indices});
          }
          export function normalizeWorldTerrainSnapshot(value){
            if(!value||!value.hash)return EMPTY;const count=Math.floor(Number(value.gridCount)),cell=Number(value.cellM),positions=value.positions,indices=value.indices;if(!(count>=5&&count%2===1)||!(cell>0)||!(positions instanceof Float32Array)||!(indices instanceof Uint32Array)||positions.length!==count*count*3||indices.length!==(count-1)*(count-1)*6)throw new Error('invalid world terrain snapshot');return value;
          }
          export function terrainHeightFromSnapshot(value,x,y){
            const s=normalizeWorldTerrainSnapshot(value);if(!s.hash)return null;const px=Number(x),py=Number(y),half=(s.gridCount-1)/2,minX=s.center[0]-half*s.cellM,minY=s.center[1]-half*s.cellM,fx=(px-minX)/s.cellM,fy=(py-minY)/s.cellM;if(fx<0||fy<0||fx>s.gridCount-1||fy>s.gridCount-1)return null;const ix=Math.min(s.gridCount-2,Math.max(0,Math.floor(fx))),iy=Math.min(s.gridCount-2,Math.max(0,Math.floor(fy))),tx=clamp(fx-ix,0,1),ty=clamp(fy-iy,0,1),z=index=>s.positions[index*3+2],a=iy*s.gridCount+ix,b=a+1,c=a+s.gridCount,d=c+1,za=z(a),zb=z(b),zc=z(c),zd=z(d);return tx>=ty?za+tx*(zb-za)+ty*(zd-zb):za+tx*(zd-zc)+ty*(zc-za);
          }
          export function createWorldTerrainCollisionBody(b3,world,value,{categoryBits=1n,maskBits=14n}={}){
            const snapshot=normalizeWorldTerrainSnapshot(value);if(!snapshot.hash)return null;const bodyDef=b3.b3DefaultBodyDef(),body=b3.b3CreateBody(world,bodyDef),shapeDef=b3.b3DefaultShapeDef();shapeDef.baseMaterial.friction=.78;shapeDef.baseMaterial.restitution=.025;shapeDef.filter={categoryBits,maskBits,groupIndex:0};const mesh=b3.b3CreateMesh(snapshot.positions,snapshot.indices);b3.b3CreateMeshShape(body,shapeDef,mesh,[1,1,1]);return{body,mesh,hash:snapshot.hash,triangleCount:snapshot.triangleCount};
          }
          export function destroyWorldTerrainCollisionBody(b3,state){if(!state)return;try{if(state.body&&b3.b3Body_IsValid(state.body))b3.b3DestroyBody(state.body);}catch{}try{if(typeof b3.b3DestroyMesh==='function'&&state.mesh)b3.b3DestroyMesh(state.mesh);else state.mesh?.delete?.();}catch{}}
          EOF

          cat > tests/world_terrain_physics_test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import {buildWorldTerrainSnapshot,terrainHeightFromSnapshot} from '../sim/world_terrain_physics.mjs';
          const height=(x,y)=>.012*x+.006*y+3*Math.sin(x/80)*Math.cos(y/95),snapshot=buildWorldTerrainSnapshot({center:[120,-80],gridCount:25,cellM:20,originElevationM:412.7,sampleHeight:height});
          assert.equal(snapshot.vertexCount,625);assert.equal(snapshot.triangleCount,1152);assert.ok(snapshot.maxHeightM-snapshot.minHeightM>10);assert.ok(snapshot.hash.startsWith('dem-'));
          for(const [x,y] of [[120,-80],[173,-41],[22,-177]]){const actual=terrainHeightFromSnapshot(snapshot,x,y);assert.ok(Number.isFinite(actual));assert.ok(Math.abs(actual-height(x,y))<.18,`${actual} vs ${height(x,y)}`);}
          assert.equal(terrainHeightFromSnapshot(snapshot,9999,9999),null);
          for(let i=0;i<snapshot.indices.length;i+=3){const a=snapshot.indices[i]*3,b=snapshot.indices[i+1]*3,c=snapshot.indices[i+2]*3,ax=snapshot.positions[a],ay=snapshot.positions[a+1],bx=snapshot.positions[b],by=snapshot.positions[b+1],cx=snapshot.positions[c],cy=snapshot.positions[c+1];assert.ok((bx-ax)*(cy-ay)-(by-ay)*(cx-ax)>0,'terrain triangle must face +Z');}
          console.log(`WORLD terrain snapshot passed: ${snapshot.vertexCount} real-height vertices / ${snapshot.triangleCount} triangles.`);
          EOF

          cat > tests/world_terrain_box3d_test.mjs <<'EOF'
          import assert from 'node:assert/strict';import{pathToFileURL}from'node:url';import{resolve}from'node:path';import{buildWorldTerrainSnapshot,createWorldTerrainCollisionBody,destroyWorldTerrainCollisionBody,terrainHeightFromSnapshot}from'../sim/world_terrain_physics.mjs';
          const modulePath=process.argv[2];if(!modulePath)throw new Error('usage: node tests/world_terrain_box3d_test.mjs <box3d.inline.mjs>');const imported=await import(pathToFileURL(resolve(modulePath)).href),b3=await imported.default(),worldDef=b3.b3DefaultWorldDef();worldDef.gravity=[0,0,-9.80665];worldDef.enableSleep=false;worldDef.enableContinuous=true;const world=b3.b3CreateWorld(worldDef),sample=(x,y)=>4*Math.exp(-((x-40)**2+(y+20)**2)/10000)-1.5*Math.exp(-((x+80)**2+(y-70)**2)/16000),snapshot=buildWorldTerrainSnapshot({center:[0,0],gridCount:25,cellM:20,sampleHeight:sample}),state=createWorldTerrainCollisionBody(b3,world,snapshot,{categoryBits:1n,maskBits:14n});assert.ok(state?.body&&state.triangleCount===1152);
          const rayFilter=b3.b3DefaultQueryFilter();rayFilter.categoryBits=4n;rayFilter.maskBits=1n;for(const[x,y]of[[0,0],[40,-20],[-80,70],[130,110]]){const expected=terrainHeightFromSnapshot(snapshot,x,y),ray=b3.b3World_CastRayClosest(world,[x,y,30],[0,0,-60],rayFilter);assert.equal(ray.hit,true);const actual=30-60*ray.fraction;assert.ok(Math.abs(actual-expected)<.035,`${x},${y}: ${actual} vs ${expected}`);}
          const x=40,y=-20,z=terrainHeightFromSnapshot(snapshot,x,y),bodyDef=b3.b3DefaultBodyDef();bodyDef.type=b3.b3BodyType.b3_dynamicBody;bodyDef.position=[x,y,z+5];bodyDef.enableSleep=false;const body=b3.b3CreateBody(world,bodyDef),shape=b3.b3DefaultShapeDef();shape.density=700;shape.filter={categoryBits:2n,maskBits:1n,groupIndex:0};b3.b3CreateSphereShape(body,shape,{center:[0,0,0],radius:.18});for(let i=0;i<2500;i++)b3.b3World_Step(world,.001,4);const pos=[0,0,0];b3.b3Body_GetPosition(pos,body);assert.ok(pos[2]>z+.13&&pos[2]<z+.55,`probe did not settle on DEM mesh ${pos[2]} / ${z}`);destroyWorldTerrainCollisionBody(b3,state);b3.b3DestroyWorld(world);console.log('WORLD terrain Box3D passed: rangefinder and dynamic contact share the DEM triangle mesh.');
          EOF

