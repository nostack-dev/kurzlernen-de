          replace_once(arch,
          '''requireText("drone_simulator.html",'id="cameraZmm" type="number" step="1" value="28"',"camera Z default must match the optical/mass mount");''',
          '''requireText("drone_simulator.html",'id="cameraZmm" type="number" step="1" value="28"',"camera Z default must match the physical camera/VTX mount center");''')

          # Unit regression: external visual pose attenuates rapid corrections while
          # remaining bounded during sustained acceleration.
          Path('tests/visual_pose_stabilization_test.mjs').write_text(r'''import assert from "node:assert/strict";
          import {StabilizedVisualPose,VISUAL_AIRFRAME_PROFILES} from "../sim/visual_pose_stabilization.mjs";

          const range=values=>Math.max(...values)-Math.min(...values);
          const yawQuat=yaw=>[0,0,Math.sin(yaw/2),Math.cos(yaw/2)];
          const quatYaw=q=>Math.atan2(2*(q[3]*q[2]),1-2*q[2]*q[2]);

          for(const mode of ["follow","third"]){
            const filter=new StabilizedVisualPose(),raw=[],filtered=[],dt=1/120,f=12,a=.03;
            for(let i=0;i<1440;i++){const t=i*dt,x=a*Math.sin(2*Math.PI*f*t),vx=a*2*Math.PI*f*Math.cos(2*Math.PI*f*t),state=filter.update({position:[x,0,2],velocity:[vx,0,0],quaternion:[0,0,0,1],mode,dt});if(i>240){raw.push(x);filtered.push(state.position[0]);}}
            const ratio=range(filtered)/range(raw);assert.ok(ratio<.55,`${mode} visual position passed too much 12 Hz correction: ${ratio}`);
          }

          for(const mode of ["follow","third"]){
            const filter=new StabilizedVisualPose(),raw=[],filtered=[],dt=1/120,f=10,a=2*Math.PI/180;
            for(let i=0;i<1440;i++){const t=i*dt,yaw=a*Math.sin(2*Math.PI*f*t),state=filter.update({position:[0,0,2],velocity:[0,0,0],quaternion:yawQuat(yaw),mode,dt});if(i>240){raw.push(yaw);filtered.push(quatYaw(state.quaternion));}}
            const ratio=range(filtered)/range(raw);assert.ok(ratio<.35,`${mode} visual attitude passed too much 10 Hz twitch: ${ratio}`);
          }

          for(const mode of ["follow","third"]){
            const filter=new StabilizedVisualPose(),dt=1/120,accel=8;let maxLag=0;
            for(let i=0;i<600;i++){const t=i*dt,accelerating=t<1,x=accelerating?.5*accel*t*t:.5*accel+accel*(t-1),vx=accelerating?accel*t:accel,state=filter.update({position:[x,0,2],velocity:[vx,0,0],quaternion:[0,0,0,1],mode,dt});maxLag=Math.max(maxLag,Math.abs(x-state.position[0]));}
            assert.ok(maxLag<VISUAL_AIRFRAME_PROFILES[mode].maxLagM+.08,`${mode} visual pose lagged sustained acceleration too far: ${maxLag}`);
          }

          const reset=new StabilizedVisualPose();reset.update({position:[0,0,1],velocity:[0,0,0],quaternion:[0,0,0,1],mode:"follow",dt:1/60});const switched=reset.update({position:[2,-1,3],velocity:[1,0,0],quaternion:yawQuat(.4),mode:"third",dt:1/60});assert.deepEqual([...switched.position],[2,-1,3],"camera-mode switch did not reset visual pose atomically");
          console.log("Visual airframe stabilization passed: external-view translation/attitude twitch attenuated with bounded acceleration lag");
          ''')

          Path('tests/combat_center_fire_test.mjs').write_text(r'''import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const fire=readFileSync("sim/flight_fire_fx.mjs","utf8"),sim=readFileSync("sim/simulator.mjs","utf8"),world=readFileSync("sim/real_world_bootstrap.mjs","utf8");
          for(const marker of ['fireAimMode="center-fixed"','fireCrosshairMode="center-fixed"','x=rect.width*.5,y=rect.height*.5','onRecoil(.18)','hitConfirmSound','combat-damage-vignette','arondight:combat-hit-confirm','arondight:combat-damage'])assert.ok(fire.includes(marker),`missing fixed-fire combat marker: ${marker}`);
          assert.ok(!fire.includes('return{x:Math.max(0,Math.min(rect.width,active.x))'),"gamepad aim still controls projectile screen ray");
          assert.ok(!fire.includes('const x=rotated?clientY-screenRect.top:clientX-screenRect.left'),"touch pointer still controls projectile screen ray");
          for(const marker of ['onRecoil:addFireCameraKick','applyFireCameraShake(dt)','visualAirframePoseFilter.update','physics.render(airframeRenderPose,presentationDt);updateCamera(presentationPose,renderNow);'])assert.ok(sim.includes(marker),`missing simulator presentation marker: ${marker}`);
          assert.ok(world.includes('window.dispatchEvent(new CustomEvent("arondight:combat-damage"'),"incoming VS hit does not drive damage indication");
          console.log("Combat center-fire contract passed: fixed center ray for touch/Xbox, recoil callback, hit confirm and damage feedback");
          ''')

          Path('tests/combat_center_fire_browser_smoke.mjs').write_text(r'''import puppeteer from "puppeteer-core";
          const input=process.argv[2]||"http://127.0.0.1:4174/drone_simulator.html",url=new URL(input,"http://127.0.0.1:4174"),baseOrigin=url.origin,cacheTag=process.env.GITHUB_SHA?`${url.search?"&":"?"}ci=${encodeURIComponent(process.env.GITHUB_SHA)}`:"",executablePath=process.env.CHROME_BIN;if(!executablePath)throw new Error("CHROME_BIN must point to Chrome/Chromium");
          const browser=await puppeteer.launch({headless:true,executablePath,args:["--no-sandbox","--disable-dev-shm-usage","--enable-webgl","--ignore-gpu-blocklist","--use-gl=angle","--use-angle=swiftshader"]}),page=await browser.newPage();
          try{
            await page.setViewport({width:844,height:390,deviceScaleFactor:1});await page.goto(`${baseOrigin}/drone_simulator.html${cacheTag}`,{waitUntil:"load",timeout:30000});await page.waitForFunction(()=>document.querySelector("#status")?.textContent?.includes("SIM ready"),{timeout:30000});await page.waitForFunction(()=>document.body.classList.contains("solo-flight")&&document.querySelector("#viewport")?.dataset.fireCrosshairMode==="center-fixed",{timeout:8000});
            const cross=await page.evaluate(()=>{const v=document.querySelector("#viewport"),c=document.querySelector(".xbox-crosshair"),r=c.getBoundingClientRect(),vr=v.getBoundingClientRect();return{display:getComputedStyle(c).display,cx:r.left+r.width/2-vr.left,cy:r.top+r.height/2-vr.top,w:v.clientWidth,h:v.clientHeight};});if(cross.display==="none"||Math.abs(cross.cx-cross.w/2)>2||Math.abs(cross.cy-cross.h/2)>2)throw new Error(`crosshair is not fixed at viewport center: ${JSON.stringify(cross)}`);
            const before=await page.$eval("#viewport",v=>Number(v.dataset.fireShots||0));await page.evaluate(()=>{const v=document.querySelector("#viewport"),r=v.getBoundingClientRect();v.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:77,pointerType:"touch",clientX:r.left+12,clientY:r.top+17,button:0}));});await page.waitForFunction(n=>Number(document.querySelector("#viewport")?.dataset.fireShots||0)>n,{timeout:3000},before);const fired=await page.$eval("#viewport",v=>({x:Number(v.dataset.fireAimX),y:Number(v.dataset.fireAimY),w:v.clientWidth,h:v.clientHeight,mode:v.dataset.fireAimMode,recoil:Number(v.dataset.fireRecoilImpulses||0)}));if(fired.mode!=="center-fixed"||Math.abs(fired.x-fired.w/2)>.6||Math.abs(fired.y-fired.h/2)>.6||fired.recoil<1)throw new Error(`touch shot did not use fixed center ray/recoil: ${JSON.stringify(fired)}`);await page.evaluate(()=>document.querySelector("#viewport").dispatchEvent(new PointerEvent("pointerup",{bubbles:true,cancelable:true,pointerId:77,pointerType:"touch",button:0})));
            await page.evaluate(()=>{dispatchEvent(new CustomEvent("arondight:combat-damage",{detail:{damage:25,hp:75}}));dispatchEvent(new CustomEvent("arondight:combat-hit-confirm",{detail:{source:"test"}}));});await page.waitForFunction(()=>Number(document.querySelector("#viewport")?.dataset.combatDamageFx||0)>=1&&Number(document.querySelector("#viewport")?.dataset.combatHitConfirmFx||0)>=1,{timeout:3000});
            await page.click("#camThird");await page.waitForFunction(()=>document.querySelector("#viewport")?.dataset.visualAirframeFilter==="third",{timeout:3000});await page.click("#camFollow");await page.waitForFunction(()=>document.querySelector("#viewport")?.dataset.visualAirframeFilter==="follow",{timeout:3000});await page.click("#camFpv");await page.waitForFunction(()=>{const v=document.querySelector("#viewport");return v?.dataset.fpvSelfCameraVisible==="0"&&Number(v.dataset.fpvCameraOpticalClearanceM)>.003&&v.dataset.visualAirframeFilter==="off";},{timeout:3000});
            console.log("Combat/camera browser E2E passed: fixed center fire, persistent crosshair, recoil, hit/damage FX, external visual filter and FPV self-occlusion guard.");
          }finally{await browser.close();}
          ''')

