        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/simulator.mjs sim/flight_fire_fx.mjs sim/real_world_bootstrap.mjs sim/visual_pose_stabilization.mjs tests/architecture_invariants.mjs tests/browser_sim_smoke.mjs tests/xbox_gamepad_browser_smoke.mjs tests/visual_pose_stabilization_test.mjs tests/combat_center_fire_test.mjs tests/combat_center_fire_browser_smoke.mjs .github/workflows/deploy.yml
          git commit -m 'Fix external view jitter and center-fire combat'
          git push origin HEAD:main

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          body="CAMERA COMBAT FIX · source=${SOURCE_SHA} · patch=${{ steps.patch.outcome }} · job=${{ job.status }} · run=${GITHUB_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
