          const cameraLookTarget=new THREE.Vector3();
          let fireCameraKick=0,fireCameraPhase=0;
          function addFireCameraKick(intensity=.18){fireCameraKick=Math.min(1,fireCameraKick+clamp(Number(intensity)||0,0,.35));const viewport=$("viewport");if(viewport){viewport.dataset.fireRecoilImpulses=String((Number(viewport.dataset.fireRecoilImpulses)||0)+1);viewport.dataset.fireCameraKick=fireCameraKick.toFixed(3);}}
