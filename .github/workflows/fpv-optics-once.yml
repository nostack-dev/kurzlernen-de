name: One-shot camera combat repair

on:
  push:
    branches: [main]
    paths: ['.github/fpv-optics.trigger']

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply camera, visual-pose and combat repair
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}: {old[:160]!r}')
              p.write_text(s.replace(old,new,1))

          # ------------------------------------------------------------------
          # Presentation-only visual pose stabilizer. Physics remains untouched.
          # ------------------------------------------------------------------
          Path('sim/visual_pose_stabilization.mjs').write_text(r'''const clamp=(value,min,max)=>Math.max(min,Math.min(max,Number(value)||0));

export const VISUAL_AIRFRAME_PROFILES=Object.freeze({
  follow:Object.freeze({positionRate:12,velocityRate:8,rotationRate:10,maxLagM:.06,lagRecoveryRate:20,teleportM:4}),
  third:Object.freeze({positionRate:10,velocityRate:7,rotationRate:8,maxLagM:.08,lagRecoveryRate:18,teleportM:4}),
});

export function visualDampingAlpha(ratePerSecond,dtSeconds){
  const rate=Math.max(0,Number(ratePerSecond)||0),dt=clamp(dtSeconds,0,.1);
  return rate>0&&dt>0?1-Math.exp(-rate*dt):0;
}

function finite3(value){return value?.length>=3&&value.slice(0,3).every(Number.isFinite);}
function finite4(value){return value?.length>=4&&value.slice(0,4).every(Number.isFinite);}
function copy3(target,source){target[0]=Number(source[0]);target[1]=Number(source[1]);target[2]=Number(source[2]);return target;}
function normalizeQuat(target,source){
  const x=Number(source?.[0]),y=Number(source?.[1]),z=Number(source?.[2]),w=Number(source?.[3]),length=Math.hypot(x,y,z,w);
  if(!(length>1e-9)){target[0]=target[1]=target[2]=0;target[3]=1;return target;}
  target[0]=x/length;target[1]=y/length;target[2]=z/length;target[3]=w/length;return target;
}
function slerpQuat(target,a,b,t){
  let bx=b[0],by=b[1],bz=b[2],bw=b[3],dot=a[0]*bx+a[1]*by+a[2]*bz+a[3]*bw;
  if(dot<0){dot=-dot;bx=-bx;by=-by;bz=-bz;bw=-bw;}
  dot=clamp(dot,-1,1);
  if(dot>.9995){target[0]=a[0]+(bx-a[0])*t;target[1]=a[1]+(by-a[1])*t;target[2]=a[2]+(bz-a[2])*t;target[3]=a[3]+(bw-a[3])*t;return normalizeQuat(target,target);}
  const theta=Math.acos(dot),sinTheta=Math.sin(theta),aScale=Math.sin((1-t)*theta)/sinTheta,bScale=Math.sin(t*theta)/sinTheta;
  target[0]=a[0]*aScale+bx*bScale;target[1]=a[1]*aScale+by*bScale;target[2]=a[2]*aScale+bz*bScale;target[3]=a[3]*aScale+bw*bScale;return normalizeQuat(target,target);
}

export class StabilizedVisualPose{
  constructor(profiles=VISUAL_AIRFRAME_PROFILES){this.profiles=profiles;this.position=[0,0,0];this.velocity=[0,0,0];this.quaternion=[0,0,0,1];this.mode='';this.initialized=false;}
  invalidate(){this.initialized=false;this.mode='';}
  reset({position,velocity=[0,0,0],quaternion=[0,0,0,1],mode='follow'}){
    if(!finite3(position)||!finite4(quaternion))throw new Error('visual pose must be finite');
    copy3(this.position,position);copy3(this.velocity,finite3(velocity)?velocity:[0,0,0]);normalizeQuat(this.quaternion,quaternion);this.mode=mode;this.initialized=true;return this.state();
  }
  update({position,velocity=[0,0,0],quaternion=[0,0,0,1],mode='follow',dt=1/60}){
    if(!finite3(position)||!finite4(quaternion))throw new Error('visual pose must be finite');
    const profile=this.profiles[mode]||this.profiles.follow,sourceVelocity=finite3(velocity)?velocity:[0,0,0],step=clamp(dt,0,.1),distance=Math.hypot(position[0]-this.position[0],position[1]-this.position[1],position[2]-this.position[2]);
    if(!this.initialized||this.mode!==mode||distance>profile.teleportM)return this.reset({position,velocity:sourceVelocity,quaternion,mode});
    const velocityAlpha=visualDampingAlpha(profile.velocityRate,step),positionAlpha=visualDampingAlpha(profile.positionRate,step),rotationAlpha=visualDampingAlpha(profile.rotationRate,step);
    for(let i=0;i<3;i++){this.velocity[i]+=(sourceVelocity[i]-this.velocity[i])*velocityAlpha;this.position[i]+=this.velocity[i]*step;this.position[i]+=(position[i]-this.position[i])*positionAlpha;}
    const lag=[position[0]-this.position[0],position[1]-this.position[1],position[2]-this.position[2]],lagLength=Math.hypot(...lag);
    if(lagLength>profile.maxLagM){const excess=lagLength-profile.maxLagM,recovery=visualDampingAlpha(profile.lagRecoveryRate,step),scale=excess*recovery/lagLength;for(let i=0;i<3;i++)this.position[i]+=lag[i]*scale;}
    slerpQuat(this.quaternion,this.quaternion,quaternion,rotationAlpha);return this.state();
  }
  state(){return{position:this.position,velocity:this.velocity,quaternion:this.quaternion,mode:this.mode};}
}
''')

          sim='sim/simulator.mjs'
          replace_once(sim,
