          '''let airframeRenderPose=presentationPose;const visualViewport=$("viewport");
              if(cameraMode==="fpv"){visualAirframePoseFilter.invalidate();visualAirframePosition.copy(presentationPose.position);visualAirframeQuaternion.copy(presentationPose.quaternion);visualAirframePose.velocity.copy(presentationPose.velocity);if(visualViewport){visualViewport.dataset.visualAirframeFilter="off";visualViewport.dataset.visualAirframeLagM="0.0000";}}
              else{const visualState=visualAirframePoseFilter.update({position:[presentationPose.position.x,presentationPose.position.y,presentationPose.position.z],velocity:[presentationPose.velocity.x,presentationPose.velocity.y,presentationPose.velocity.z],quaternion:[presentationPose.quaternion.x,presentationPose.quaternion.y,presentationPose.quaternion.z,presentationPose.quaternion.w],mode:cameraMode,dt:presentationDt});visualAirframePosition.set(...visualState.position);visualAirframeQuaternion.set(...visualState.quaternion);visualAirframePose.velocity.set(...visualState.velocity);airframeRenderPose=visualAirframePose;if(visualViewport){visualViewport.dataset.visualAirframeFilter=cameraMode;visualViewport.dataset.visualAirframeLagM=Math.hypot(presentationPose.position.x-visualState.position[0],presentationPose.position.y-visualState.position[1],presentationPose.position.z-visualState.position[2]).toFixed(4);}}
              physics.render(airframeRenderPose,presentationDt);updateCamera(presentationPose,renderNow);''')

          # ------------------------------------------------------------------
