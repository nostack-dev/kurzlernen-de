name: One-shot FPV self-occlusion repair

on:
  push:
    branches: [main]
    paths: ['.github/fpv-optics.trigger']

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Separate camera mount, lens and optical center
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          sim='sim/simulator.mjs'
          replace_once(sim,
          '''const FPV_CAMERA_FORWARD_OFFSET_M = .070;
          const FPV_CAMERA_UP_OFFSET_M = .028;''',
          '''const FPV_CAMERA_MOUNT_FORWARD_OFFSET_M = .070;
          const FPV_CAMERA_LENS_FORWARD_OFFSET_M = .093;
          const FPV_CAMERA_LENS_HALF_DEPTH_M = .004;
          const FPV_CAMERA_FORWARD_OFFSET_M = .101;
          const FPV_CAMERA_UP_OFFSET_M = .028;
          const FPV_CAMERA_OPTICAL_CLEARANCE_M = FPV_CAMERA_FORWARD_OFFSET_M - (FPV_CAMERA_LENS_FORWARD_OFFSET_M + FPV_CAMERA_LENS_HALF_DEPTH_M);''')

          replace_once(sim,
          '''    const fpvCameraBody=new THREE.Mesh(new THREE.BoxGeometry(.040,.030,.025),bodyMaterial);fpvCameraBody.position.set(-FPV_CAMERA_FORWARD_OFFSET_M,0,FPV_CAMERA_UP_OFFSET_M);fpvCameraBody.userData.arondightFpvCamera=true;fpvCameraBody.castShadow=true;this.group.add(fpvCameraBody);
              const fpvCameraLens=new THREE.Mesh(new THREE.CylinderGeometry(.010,.010,.008,18),new THREE.MeshStandardMaterial({color:0x111820,metalness:.15,roughness:.22}));fpvCameraLens.rotation.z=Math.PI/2;fpvCameraLens.position.set(-FPV_CAMERA_FORWARD_OFFSET_M-.023,0,FPV_CAMERA_UP_OFFSET_M);fpvCameraLens.userData.arondightFpvCameraLens=true;this.group.add(fpvCameraLens);''',
          '''    const fpvCameraBody=new THREE.Mesh(new THREE.BoxGeometry(.040,.030,.025),bodyMaterial);fpvCameraBody.position.set(-FPV_CAMERA_MOUNT_FORWARD_OFFSET_M,0,FPV_CAMERA_UP_OFFSET_M);fpvCameraBody.userData.arondightFpvCamera=true;fpvCameraBody.castShadow=true;this.group.add(fpvCameraBody);this.fpvCameraBody=fpvCameraBody;
              const fpvCameraLens=new THREE.Mesh(new THREE.CylinderGeometry(.010,.010,.008,18),new THREE.MeshStandardMaterial({color:0x111820,metalness:.15,roughness:.22}));fpvCameraLens.rotation.z=Math.PI/2;fpvCameraLens.position.set(-FPV_CAMERA_LENS_FORWARD_OFFSET_M,0,FPV_CAMERA_UP_OFFSET_M);fpvCameraLens.userData.arondightFpvCameraLens=true;this.group.add(fpvCameraLens);this.fpvCameraLens=fpvCameraLens;''')

          replace_once(sim,
          '''  const bodyForward=new THREE.Vector3(-1,0,0).applyQuaternion(q).normalize();
            if(cameraMode==="fpv"){''',
          '''  const bodyForward=new THREE.Vector3(-1,0,0).applyQuaternion(q).normalize();
            const showFpvSelfCamera=cameraMode!=="fpv";
            if(physics.fpvCameraBody)physics.fpvCameraBody.visible=showFpvSelfCamera;
            if(physics.fpvCameraLens)physics.fpvCameraLens.visible=showFpvSelfCamera;
            const fpvSelfViewport=$("viewport");if(fpvSelfViewport)fpvSelfViewport.dataset.fpvSelfCameraVisible=showFpvSelfCamera?"1":"0";
            if(cameraMode==="fpv"){''')

          replace_once(sim,
          '''viewport.dataset.fpvCameraForwardOffsetM=FPV_CAMERA_FORWARD_OFFSET_M.toFixed(3);viewport.dataset.fpvCameraUpOffsetM=FPV_CAMERA_UP_OFFSET_M.toFixed(3);''',
          '''viewport.dataset.fpvCameraMountForwardOffsetM=FPV_CAMERA_MOUNT_FORWARD_OFFSET_M.toFixed(3);viewport.dataset.fpvCameraForwardOffsetM=FPV_CAMERA_FORWARD_OFFSET_M.toFixed(3);viewport.dataset.fpvCameraOpticalClearanceM=FPV_CAMERA_OPTICAL_CLEARANCE_M.toFixed(3);viewport.dataset.fpvCameraUpOffsetM=FPV_CAMERA_UP_OFFSET_M.toFixed(3);''')

          arch='tests/architecture_invariants.mjs'
          replace_once(arch,
          '''for(const marker of ["const FPV_CAMERA_FORWARD_OFFSET_M = .070;","const FPV_CAMERA_UP_OFFSET_M = .028;","fpvCameraUpOffsetM=FPV_CAMERA_UP_OFFSET_M.toFixed(3)","fpvCameraBody.userData.arondightFpvCamera=true","fpvCameraLens.userData.arondightFpvCameraLens=true"])requireText("sim/simulator.mjs",marker);''',
          '''for(const marker of ["const FPV_CAMERA_MOUNT_FORWARD_OFFSET_M = .070;","const FPV_CAMERA_LENS_FORWARD_OFFSET_M = .093;","const FPV_CAMERA_LENS_HALF_DEPTH_M = .004;","const FPV_CAMERA_FORWARD_OFFSET_M = .101;","const FPV_CAMERA_UP_OFFSET_M = .028;","FPV_CAMERA_OPTICAL_CLEARANCE_M","fpvCameraMountForwardOffsetM=FPV_CAMERA_MOUNT_FORWARD_OFFSET_M.toFixed(3)","fpvCameraOpticalClearanceM=FPV_CAMERA_OPTICAL_CLEARANCE_M.toFixed(3)","fpvSelfCameraVisible=showFpvSelfCamera?\"1\":\"0\"","fpvCameraBody.userData.arondightFpvCamera=true","fpvCameraLens.userData.arondightFpvCameraLens=true"])requireText("sim/simulator.mjs",marker);
          forbidText("sim/simulator.mjs","fpvCameraBody.position.set(-FPV_CAMERA_FORWARD_OFFSET_M","FPV optical origin must not be reused as the camera-body center");''')
          replace_once(arch,
          '''requireText("sim/component_mass_model.mjs","cameraX:-0.070,cameraZ:0.028","camera/VTX mass placement must match the realistic forward/up mount");''',
          '''requireText("sim/component_mass_model.mjs","cameraX:-0.070,cameraZ:0.028","camera/VTX mass placement must match the physical camera mount center");''')
          replace_once(arch,
          '''requireText("drone_simulator.html",'id="cameraXmm" type="number" step="1" value="-70"',"camera X default must match the optical/mass mount");''',
          '''requireText("drone_simulator.html",'id="cameraXmm" type="number" step="1" value="-70"',"camera X default must match the physical camera/VTX mount center");''')

          browser='tests/browser_sim_smoke.mjs'
          replace_once(browser,
          '''    fpvCameraForward:Number(document.querySelector("#viewport")?.dataset.fpvCameraForwardOffsetM),
              fpvCameraUp:Number(document.querySelector("#viewport")?.dataset.fpvCameraUpOffsetM),''',
          '''    fpvCameraMountForward:Number(document.querySelector("#viewport")?.dataset.fpvCameraMountForwardOffsetM),
              fpvCameraForward:Number(document.querySelector("#viewport")?.dataset.fpvCameraForwardOffsetM),
              fpvCameraOpticalClearance:Number(document.querySelector("#viewport")?.dataset.fpvCameraOpticalClearanceM),
              fpvSelfCameraVisible:document.querySelector("#viewport")?.dataset.fpvSelfCameraVisible||"",
              fpvCameraUp:Number(document.querySelector("#viewport")?.dataset.fpvCameraUpOffsetM),''')
          replace_once(browser,
          '''  if(cameraBoot.mode!=="fpv"||cameraBoot.fpv!=="1"||cameraBoot.tilt!=="-15"||cameraBoot.auto!=="fpv"||cameraBoot.soloCamera!=="FPV"||cameraBoot.fpvCameraForward!==.070||cameraBoot.fpvCameraUp!==.028||cameraBoot.cameraMassX!==-70||cameraBoot.cameraMassZ!==28||cameraBoot.initialGroundPose!=="1"||cameraBoot.initialVisualBottom<0||cameraBoot.panel!=="none")''',
          '''  if(cameraBoot.mode!=="fpv"||cameraBoot.fpv!=="1"||cameraBoot.tilt!=="-15"||cameraBoot.auto!=="fpv"||cameraBoot.soloCamera!=="FPV"||cameraBoot.fpvCameraMountForward!==.070||cameraBoot.fpvCameraForward!==.101||cameraBoot.fpvCameraOpticalClearance<.003||cameraBoot.fpvSelfCameraVisible!=="0"||cameraBoot.fpvCameraUp!==.028||cameraBoot.cameraMassX!==-70||cameraBoot.cameraMassZ!==28||cameraBoot.initialGroundPose!=="1"||cameraBoot.initialVisualBottom<0||cameraBoot.panel!=="none")''')
          PY

          node tests/architecture_invariants.mjs
          CHROME_BIN=/usr/bin/google-chrome node tests/browser_sim_smoke.mjs

      - name: Commit product fix
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/simulator.mjs tests/architecture_invariants.mjs tests/browser_sim_smoke.mjs
          git commit -m 'Fix FPV camera self-occlusion'
          git push origin HEAD:main

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          body="FPV OPTICS FIX · source=${SOURCE_SHA} · patch=${{ steps.patch.outcome }} · job=${{ job.status }} · run=${GITHUB_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
