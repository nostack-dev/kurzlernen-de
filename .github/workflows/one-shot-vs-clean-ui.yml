name: one-shot-vs-clean-ui
on:
  push:
    branches: ["fix/vs-signaling-fallback"]
    paths: [".github/workflows/one-shot-vs-clean-ui.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove pair-code UI and move FIND MATE into topbar
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/real_world_bootstrap.mjs');s=p.read_text()
          old='import {LanVsSession,sameNetworkRoomKey,manualRoomKey} from "./lan_vs.mjs";'
          new='import {LanVsSession,sameNetworkRoomKey} from "./lan_vs.mjs";'
          assert s.count(old)==1,s.count(old);s=s.replace(old,new,1)

          start=s.index('  installVsUi(){')
          end=s.index('  acceptVsOrigin(origin,status){',start)
          new_block='''  installVsUi(){\n    const viewport=$("viewport");if(!viewport||$("lanVsButton"))return;const button=document.createElement("button");button.id="lanVsButton";button.type="button";button.textContent="FIND MATE";button.setAttribute("aria-label","Find nearby mate on the same network");button.style.cssText="border:1px solid #70ddff88;background:#071522e8;color:#dff7ff;font-weight:800;letter-spacing:.04em;touch-action:manipulation;white-space:nowrap";const attach=()=>{const topbar=$("soloTopbar");if(topbar&&button.parentNode!==topbar)topbar.appendChild(button);else if(!button.parentNode)viewport.appendChild(button);};attach();setTimeout(attach,0);button.onclick=()=>this.toggleVs();\n  }\n  toggleVs(){if(this.vsSession||this.vsStarting)this.stopVs();else this.startVs();}\n  async startVs(){\n    if(this.vsSession||this.vsStarting)return;this.vsStarting=true;const button=$("lanVsButton");if(button)button.textContent="FINDING…";\n    try{const roomId=await sameNetworkRoomKey();if(!this.vsStarting)return;const session=new LanVsSession({onTransport:()=>{if(button&&!this.vsConnected)button.textContent="FINDING…";},onPeer:()=>{this.vsConnected=true;if(button)button.textContent="MATE ✓";this.ensureVsPeerMesh();},onPose:pose=>this.applyVsPose(pose),onOrigin:origin=>this.acceptVsOrigin(origin,null),onLeave:()=>{const mateWorld=this.vsWorldFromMate;this.vsConnected=false;this.vsSharedOrigin=null;this.vsSharedWorldAttempted=false;this.vsWorldFromMate=false;this.clearVsPeerPresentation();if(mateWorld){if(this.active)this.deactivate();this.originLon=null;this.originLat=null;}if(button)button.textContent="WAITING…";},onError:()=>{if(button)button.textContent="RETRY MATE";}});this.vsSession=session;await session.start(roomId);if(!this.vsConnected&&button)button.textContent="WAITING…";}catch(error){this.vsSession?.stop();this.vsSession=null;if(button)button.textContent="RETRY MATE";console.warn("VS discovery unavailable:",error);}finally{this.vsStarting=false;}\n  }\n'''
          s=s[:start]+new_block+s[end:]
          assert 'PAIR CODE' not in s
          assert 'startVsWithCode' not in s
          p.write_text(s)

          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          old='requireText("sim/real_world_bootstrap.mjs","FIND MATE · VS","VS must be an explicit in-game action");'
          new='''requireText("sim/real_world_bootstrap.mjs","FIND MATE","VS must be an explicit in-game action");\nforbidText("sim/real_world_bootstrap.mjs","PAIR CODE","VS discovery must stay automatic without pair-code UX");\nforbidText("sim/lan_vs.mjs","manualRoomKey","manual room-code matching must not return");\nrequireText("sim/lan_vs.mjs","stun:stun.cloudflare.com:3478","same-network discovery must try WebRTC/STUN NAT identity before HTTP heuristics");\nrequireText("sim/lan_vs.mjs","@trystero-p2p/mqtt","VS must have a second serverless signaling strategy when Nostr is unavailable");'''
          assert s.count(old)==1,s.count(old);p.write_text(s.replace(old,new,1))
          PY
          node --check sim/real_world_bootstrap.mjs
          node --check sim/lan_vs.mjs
          node --check sim/solo_layout.mjs
          node --check tests/solo_layout_smoke.mjs
          node tests/lan_vs_smoke.mjs
      - name: Commit clean VS UI
        run: |
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sim/real_world_bootstrap.mjs tests/architecture_invariants.mjs
          git commit -m 'Simplify VS to automatic topbar discovery'
          git push
