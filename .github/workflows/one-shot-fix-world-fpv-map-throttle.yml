name: One-shot fix WORLD FPV map throttle

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Retry one-shot WORLD FPV jitter fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Stabilize FPV MapLibre camera cadence
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('sim/real_world_bootstrap.mjs')
          s = p.read_text()
          old = 'if(!forceMode&&!fpv&&now-this.lastMapSyncMs<this.mapFrameMs)return;'
          new = 'if(!forceMode&&now-this.lastMapSyncMs<this.mapFrameMs)return;'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/real_world_ui_smoke.mjs')
          s = p.read_text()
          needle = '  if(Math.abs(eyeHeights.low.eye-5)>.01||Math.abs(eyeHeights.high.eye-50)>.01||eyeHeights.low.sync!=="rigid-eye-target"||eyeHeights.high.sync!=="rigid-eye-target"||eyeHeights.high.eye-eyeHeights.low.eye<44.9)throw new Error(`FPV eye altitude not preserved: ${JSON.stringify(eyeHeights)}`);\n\n'
          insert = '''  if(Math.abs(eyeHeights.low.eye-5)>.01||Math.abs(eyeHeights.high.eye-50)>.01||eyeHeights.low.sync!=="rigid-eye-target"||eyeHeights.high.sync!=="rigid-eye-target"||eyeHeights.high.eye-eyeHeights.low.eye<44.9)throw new Error(`FPV eye altitude not preserved: ${JSON.stringify(eyeHeights)}`);\n\n  // FPV must obey the same adaptive MapLibre cadence as every other camera. A\n  // single render burst must not hammer jumpTo() once per THREE frame.\n  const fpvCadence=await page.evaluate(()=>{\n    const b=globalThis.__arondightRealWorld,c=b.threeCamera,v=document.querySelector("#viewport"),saved={p:c.position.clone(),q:c.quaternion.clone(),u:c.up.clone(),mode:v.dataset.cameraMode,worldMode:v.dataset.worldCameraMode};\n    v.dataset.cameraMode="fpv";v.dataset.worldCameraMode="fpv";c.position.set(12,-7,18);c.quaternion.set(0,0,0,1);c.up.set(0,1,0);b.lastMapSyncMs=-Infinity;const before=b.mapUpdates;b.syncMapCamera(c);const first=b.mapUpdates;for(let i=0;i<20;i++)b.syncMapCamera(c);const burst=b.mapUpdates;c.position.copy(saved.p);c.quaternion.copy(saved.q);c.up.copy(saved.u);v.dataset.cameraMode=saved.mode;if(saved.worldMode===undefined)delete v.dataset.worldCameraMode;else v.dataset.worldCameraMode=saved.worldMode;b.lastMapSyncMs=-Infinity;return{before,first,burst,mapFrameMs:b.mapFrameMs};\n  });\n  if(fpvCadence.first!==fpvCadence.before+1||fpvCadence.burst!==fpvCadence.first||fpvCadence.mapFrameMs<30)throw new Error(`FPV MapLibre cadence regression: ${JSON.stringify(fpvCadence)}`);\n\n'''
          assert s.count(needle) == 1, s.count(needle)
          s = s.replace(needle, insert, 1)
          s = s.replace('REAL WORLD E2E passed: exact 5/50m FPV eye pose, shared north-up minimap, pinch FOV, double-tap expansion, mobile-safe fire FX and local flight logbook.', 'REAL WORLD E2E passed: exact 5/50m FPV eye pose, bounded FPV MapLibre cadence, shared north-up minimap, pinch FOV, double-tap expansion, mobile-safe fire FX and local flight logbook.')
          p.write_text(s)
          PY

          # Remove this temporary workflow before architecture tests: production
          # intentionally allows only deploy.yml and s31-hil.yml.
          rm -f .github/workflows/one-shot-fix-world-fpv-map-throttle.yml
          node --check sim/real_world_bootstrap.mjs
          node --check tests/real_world_ui_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check

      - name: Commit verified fix to main
        run: |
          set -euxo pipefail
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Stabilize WORLD FPV map camera cadence'
          git push origin HEAD:main
