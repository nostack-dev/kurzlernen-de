name: Repair walk capture contract once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_walk_capture_contract_once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make lost capture non-terminal for move input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['sim/gameplay_final_runtime_v2.mjs','sim/gameplay_final_runtime.mjs']:
              p=Path(name)
              s=p.read_text()
              if name.endswith('_v2.mjs'):
                  old='document.addEventListener("lostpointercapture",event=>{if(event.pointerId===activeMovePointer)forceMoveRelease("lostpointercapture");},true);'
                  new='document.addEventListener("lostpointercapture",event=>{const view=viewport();if(view)view.dataset.walkMoveStickCaptureState=event.pointerId===activeMovePointer?"lost-await-terminal":"foreign-ignored";},true);'
                  assert s.count(old)==1, f'{name}: v2 lost-capture handler occurrences={s.count(old)}'
                  s=s.replace(old,new,1)
                  s=s.replace('pointerup+cancel+owned-lostcapture+blur+visibility+pagehide+orientation-v3','pointerup+cancel+touch-terminal+blur+visibility+pagehide+orientation-v4')
              else:
                  old='document.addEventListener("lostpointercapture",()=>forceMoveRelease("lostpointercapture"),true);'
                  new='document.addEventListener("lostpointercapture",event=>{const view=viewport();if(view)view.dataset.walkMoveStickCaptureState=event.pointerId===activeMovePointer?"lost-await-terminal":"foreign-ignored";},true);'
                  assert s.count(old)==1, f'{name}: legacy lost-capture handler occurrences={s.count(old)}'
                  s=s.replace(old,new,1)
                  s=s.replace('pointerup+cancel+lostcapture+blur+visibility-v1','pointerup+cancel+blur+visibility-v2')
              p.write_text(s)
          PY
          node --check sim/gameplay_final_runtime_v2.mjs
          node --check sim/gameplay_final_runtime.mjs
          ! grep -q 'forceMoveRelease("lostpointercapture")' sim/gameplay_final_runtime_v2.mjs
          ! grep -q 'forceMoveRelease("lostpointercapture")' sim/gameplay_final_runtime.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/gameplay_final_runtime_v2.mjs sim/gameplay_final_runtime.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Make walk capture loss non-terminal'
          git push origin HEAD:main
