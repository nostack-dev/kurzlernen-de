name: One-shot in-flight tilt cutoff fix

on:
  push:
    branches: [main]
    paths: ['.github/fix-inflight-tilt-cut.trigger']

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Remove angle-only in-flight motor cutoff and add regression
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}')
              p.write_text(s.replace(old,new,1))

          core='esp32/Arondight45_DroneFC_Core.hpp'
          old='''        if (!armed_) controller_.reset();
        if (armed_) {
            if (std::fabs(controller_.attitude.roll) > 68.0f ||
                std::fabs(controller_.attitude.pitch) > 68.0f) {
                set_fault(kFaultTilt);
                armed_ = false;
                controller_.reset();
            } else {
                Mix mixed{};
                if (cmd.throttle <= 0.02f) {
                    controller_.reset();
                } else {
                    mixed = controller_.run(imu, cmd, dt, cmd.throttle > 0.05f);
                }
                for (size_t i = 0; i < 4; ++i) out.motor_us[i] = pulse(mixed.motor[i], true);
            }
        }
'''
          new='''        if (!armed_) controller_.reset();
        if (armed_) {
            // Extreme attitude is recoverable flight state, not a reason to kill
            // every motor. Keep the attitude loop alive so the aircraft can right
            // itself. Hard motor shutdown remains reserved for explicit disarm,
            // invalid control/failsafe, IMU/rate/timing/protocol faults.
            Mix mixed{};
            if (cmd.throttle <= 0.02f) {
                controller_.reset();
            } else {
                mixed = controller_.run(imu, cmd, dt, cmd.throttle > 0.05f);
            }
            for (size_t i = 0; i < 4; ++i) out.motor_us[i] = pulse(mixed.motor[i], true);
        }
'''
          replace_once(core,old,new)

          test='tests/drone_fc_core_test.cpp'
          p=Path(test); s=p.read_text()
          anchor='''    const auto throttle_out = runtime.step(throttle);
    CHECK(throttle_out.armed);
    for (auto pulse : throttle_out.motor_us) CHECK(pulse > fc::kEscIdleUs);
'''
          addition=anchor+'''\n    // A large in-flight attitude must never hard-cut all motors. The old 68-degree\n    // tilt fault converted a recoverable upset into guaranteed free fall. Drive the\n    // estimator past that old threshold with a valid sub-rate-limit gyro input and\n    // verify the FC remains armed and continues producing motor authority.\n    fc::Runtime upset_runtime;\n    uint64_t upset_us = 0;\n    calibrate(upset_runtime, upset_us);\n    arm_runtime(upset_runtime, upset_us);\n    fc::RuntimeOutput upset_out{};\n    for (int i = 0; i < 900; ++i) {\n        auto upset = stationary_input(upset_us += 1000);\n        upset.rc.ch[4] = 1811;\n        upset.rc.ch[2] = 1050;\n        upset.raw.a = {0.0f, 0.0f, 2.0f}; // disable accel leveling during the upset\n        upset.raw.g.x = 90.0f;\n        upset_out = upset_runtime.step(upset);\n        CHECK(upset_out.fault == fc::kFaultNone);\n        CHECK(upset_out.armed);\n        for (auto pulse : upset_out.motor_us) CHECK(pulse > fc::kEscMinUs);\n    }\n    CHECK(std::abs(upset_out.attitude_cdeg[0]) > 6800);\n    CHECK(upset_out.fault == fc::kFaultNone);\n    CHECK(upset_out.armed);\n'''
          if s.count(anchor)!=1: raise SystemExit('core test anchor mismatch')
          p.write_text(s.replace(anchor,addition,1))
          PY

          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core-tests
          /tmp/fc-core-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state-control-tests
          /tmp/state-control-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil-host-tests
          /tmp/sil-host-tests

      - name: Commit product fix
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esp32/Arondight45_DroneFC_Core.hpp tests/drone_fc_core_test.cpp
          git commit -m 'Keep motors active through recoverable flight attitude'
          git push origin HEAD:main

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          body="INFLIGHT TILT CUT FIX · source=${SOURCE_SHA} · patch=${{ steps.patch.outcome }} · job=${{ job.status }} · run=${GITHUB_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
