name: One-shot final realtime hotpath cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-final-realtime-hotpath.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Remove non-authoritative 1kHz overhead
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              assert n==1, f"{path}: expected one occurrence, got {n}: {old[:160]!r}"
              p.write_text(s.replace(old,new,1))

          # 1) Box3D integration stays exactly 1 ms / 4 substeps. Avoid a full
          # position+rotation+velocity+Euler readback after every step when the
          # realtime loop discards the return value. Replay/fitting reads state
          # once after the requested integration duration instead.
          one('sim/simulator.mjs', '''  step(pulses,dt=DT){
    this.applyForces(pulses,dt);
    const before=this.linear();
    b3.b3World_Step(this.world,dt,4);
    this.worldAcceleration=scale(sub(this.linear(),before),1/dt);
    return this.state();
  }
''', '''  step(pulses,dt=DT){
    this.applyForces(pulses,dt);
    const before=this.linear();
    b3.b3World_Step(this.world,dt,4);
    this.worldAcceleration=scale(sub(this.linear(),before),1/dt);
  }
''')
          one('sim/simulator.mjs', '''function integrateDuration(model,pulses,duration){
  if(!(duration>0))return model.state();
  let remaining=duration,state=model.state();
  while(remaining>1e-9){const step=Math.min(DT,remaining);state=model.step(pulses,step);remaining-=step;}
  return state;
}
''', '''function integrateDuration(model,pulses,duration){
  if(!(duration>0))return model.state();
  let remaining=duration;
  while(remaining>1e-9){const step=Math.min(DT,remaining);model.step(pulses,step);remaining-=step;}
  return model.state();
}
''')

          # 2) Race HUD and downloadable diagnostic log are not control authority.
          # Sample them at 100 Hz; the plant + raw ICM/SBUS/NAV1 + FirmwareRuntime
          # still execute every 1 ms. This removes two redundant Box3D state
          # readback paths from every inner-loop tick.
          one('sim/simulator.mjs', 'const SIM_MAX_STEPS_PER_FRAME = Math.ceil(SIM_MAX_CATCHUP_MS / SIM_FIXED_STEP_MS);', 'const SIM_MAX_STEPS_PER_FRAME = Math.ceil(SIM_MAX_CATCHUP_MS / SIM_FIXED_STEP_MS);\nconst SIM_AUX_INTERVAL_S = .01;')
          one('sim/simulator.mjs', '''async function loop(){
  let schedulerWallMs=performance.now(),accumulatorMs=0;
  while(running){
''', '''async function loop(){
  let schedulerWallMs=performance.now(),accumulatorMs=0,auxAccumulatorS=0;
  while(running){
''')
          one('sim/simulator.mjs', '''    for(let i=0;i<due&&running;i++){
      latest=wasmFastPath?controllerStepSync():await controllerStep();physics.step(latest.motors,DT);simTime+=DT;raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();accumulatorMs-=SIM_FIXED_STEP_MS;
    }
''', '''    for(let i=0;i<due&&running;i++){
      latest=wasmFastPath?controllerStepSync():await controllerStep();physics.step(latest.motors,DT);simTime+=DT;auxAccumulatorS+=DT;accumulatorMs-=SIM_FIXED_STEP_MS;
      if(auxAccumulatorS+1e-12>=SIM_AUX_INTERVAL_S){auxAccumulatorS-=SIM_AUX_INTERVAL_S;raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();}
    }
''')

          # 3) RTT timing is diagnostics, not authority. Sample it at 50 Hz rather
          # than calling performance.now() twice at every 1 kHz SIL tick.
          one('sim/simulator.mjs', '''function controllerStepSync(){
  const {packet}=prepareControllerStep(),started=performance.now(),out=backend.exchangeSync(packet);latestControllerRttMs=performance.now()-started;return out;
}
''', '''function controllerStepSync(){
  const {seq,packet}=prepareControllerStep();
  if((seq%20)===0){const started=performance.now(),out=backend.exchangeSync(packet);latestControllerRttMs=performance.now()-started;return out;}
  return backend.exchangeSync(packet);
}
''')

          # Regression gates: the physical inner loop remains 1 kHz and Box3D
          # remains 1 ms / 4 substeps, while non-authoritative work cannot creep
          # back into every tick.
          p=Path('tests/architecture_invariants.mjs'); s=p.read_text()
          anchor='''requireText("sim/simulator.mjs","backend instanceof WasmBackend");
requireText("sim/simulator.mjs","physics.p.imuValid");
forbidText("sim/simulator.mjs","(sequence&7)===0", "simulator fixed-step cadence must not be display-Hz divided");
'''
          replacement='''requireText("sim/simulator.mjs","backend instanceof WasmBackend");
requireText("sim/simulator.mjs","physics.p.imuValid");
requireText("sim/simulator.mjs","b3.b3World_Step(this.world,dt,4)");
requireText("sim/simulator.mjs","SIM_AUX_INTERVAL_S = .01");
requireText("sim/simulator.mjs","auxAccumulatorS+=DT");
requireText("sim/simulator.mjs","(seq%20)===0");
forbidText("sim/simulator.mjs","(sequence&7)===0", "simulator fixed-step cadence must not be display-Hz divided");
const physicsStepStart=simulatorSource.indexOf("  step(pulses,dt=DT){"),physicsStepEnd=simulatorSource.indexOf("  state(){",physicsStepStart);
if(physicsStepStart<0||physicsStepEnd<=physicsStepStart)fail("cannot isolate PhysicsModel.step hot path");
if(simulatorSource.slice(physicsStepStart,physicsStepEnd).includes("this.state()"))fail("1 kHz PhysicsModel.step performs redundant full-state readback");
'''
          assert s.count(anchor)==1, 'architecture hot-path anchor missing'
          p.write_text(s.replace(anchor,replacement,1))

          p=Path('REAL_WORLD_DIGITAL_TWIN.md'); doc=p.read_text().rstrip()
          note='''

Realtime browser SIL keeps the physical authority path at 1 kHz: raw IMU generation, asynchronous 100 Hz SBUS/NAV1 arrivals, the exact compiled `fc::FirmwareRuntime`, motor-pulse output, motor/prop dynamics and Box3D integration at 1 ms with four solver substeps are unchanged. Race-HUD bookkeeping and downloadable diagnostic logging are sampled at 100 Hz, and RTT instrumentation at 50 Hz, because none of those channels feeds the controller or plant. `PhysicsModel.step()` no longer performs a redundant full-state readback that the realtime loop discarded; replay/fitting still reads the resulting state after each requested integration duration.
'''
          if 'Race-HUD bookkeeping and downloadable diagnostic logging are sampled at 100 Hz' not in doc:
              p.write_text(doc+note)

          # Validate the product tree without the temporary workflow present.
          scaffold=Path('.github/workflows/one-shot-final-realtime-hotpath.yml'); raw=scaffold.read_bytes(); scaffold.unlink()
          try:
              for path in ['sim/simulator.mjs','tests/architecture_invariants.mjs','tests/browser_sim_smoke.mjs','tests/dual_phone_smoke.mjs','tests/real_world_ui_smoke.mjs']:
                  subprocess.run(['node','--check',path],check=True)
              subprocess.run(['node','tests/control_semantics_test.mjs'],check=True)
              subprocess.run(['node','tests/architecture_invariants.mjs'],check=True)
              subprocess.run(['g++','-std=c++17','-O2','-Wall','-Wextra','-Wpedantic','-Werror','-Iesp32','tests/state_control_test.cpp','-o','/tmp/state-control-final'],check=True)
              subprocess.run(['/tmp/state-control-final'],check=True)
              subprocess.run(['git','diff','--check'],check=True)
          finally:
              scaffold.write_bytes(raw)
          PY
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim/simulator.mjs tests/architecture_invariants.mjs REAL_WORLD_DIGITAL_TWIN.md
          git commit -m "Remove non-authoritative work from 1kHz SIL hot path"
          git pull --rebase origin main
          git push origin HEAD:main
