name: Fix real-world smoke browser context

on:
  push:
    branches: ["fix/final-flight-safety-ux"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix real-world smoke browser context'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
          fetch-depth: 0
      - name: Patch test and push
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke.mjs')
          s=p.read_text()
          old='''    keepLook:document.querySelector('.phone-settings-dialog [data-world-keep-look]')?.checked,\n    note:document.querySelector('[data-world-settings="openfreemap-osm-3d"]')?.textContent||""'''
          new='''    keepLook:document.querySelector('.phone-settings-dialog [data-world-keep-look]')?.checked,\n    minimapFollowPresent:!!document.querySelector('.phone-settings-dialog [data-world-minimap-follow]'),\n    note:document.querySelector('[data-world-settings="openfreemap-osm-3d"]')?.textContent||""'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old2='''config.keepLook!==false||document.querySelector('.phone-settings-dialog [data-world-minimap-follow]')||!config.note.includes'''
          new2='''config.keepLook!==false||config.minimapFollowPresent||!config.note.includes'''
          assert s.count(old2)==1, s.count(old2)
          p.write_text(s.replace(old2,new2,1))
          PY
          node --check tests/real_world_ui_smoke.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/real_world_ui_smoke.mjs
          git commit -m 'Fix real-world smoke browser context'
          git push origin HEAD:fix/final-flight-safety-ux
