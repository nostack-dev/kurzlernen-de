name: Fix car enter authority once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-car-enter-authority-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Box3D-authoritative entry
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/player_car_mode.mjs'); s=p.read_text()
          old='function nearestVehicle(now=performance.now()){if(active)return vehicle;if(now-lastNearestScan<240)return nearest;lastNearestScan=now;nearest=null;const w=walk();if(w?.mode!=="foot"||!w.position)return null;let best=ENTER_RADIUS_M;for(const record of vehicleRoots()){record.root.getWorldPosition(tmp);const d=Math.hypot(tmp.x-w.position.x,tmp.y-w.position.y);if(d<best){best=d;nearest={...record,distance:d};}}return nearest;}'
          new='function authoritativeVehiclePoint(record){const pose=record?.id?physics()?.pose?.(record.id):null;if(pose?.position)return{x:Number(pose.position[0])||0,y:Number(pose.position[1])||0,pose};record?.root?.getWorldPosition?.(tmp);return{x:tmp.x,y:tmp.y,pose:null};}\nfunction nearestVehicle(now=performance.now()){if(active)return vehicle;if(now-lastNearestScan<240)return nearest;lastNearestScan=now;nearest=null;const w=walk();if(w?.mode!=="foot"||!w.position)return null;let best=ENTER_RADIUS_M;for(const record of vehicleRoots()){const point=authoritativeVehiclePoint(record),d=Math.hypot(point.x-w.position.x,point.y-w.position.y);if(d<best){best=d;nearest={...record,distance:d,physicsPose:point.pose};}}return nearest;}'
          assert old in s
          s=s.replace(old,new,1)
          old='function vehicleAtScreenPoint(clientX,clientY){if(active||walk()?.mode!=="foot")return null;const camera=bridge()?.threeCamera,point=logicalScreenPoint(clientX,clientY),w=walk();if(!camera||!point||!w?.position)return null;const roots=vehicleRoots();if(!roots.length)return null;pickNdc.set(point.x/point.width*2-1,1-point.y/point.height*2);raycaster.setFromCamera(pickNdc,camera);const hits=raycaster.intersectObjects(roots.map(item=>item.root),true);for(const hit of hits){let node=hit.object,id="";while(node&&!id){id=String(node.userData?.worldPopulationId||node.userData?.worldProceduralId||"");node=node.parent;}if(!id)continue;const record=roots.find(item=>item.id===id);if(!record)continue;record.root.getWorldPosition(tmp);const distance=Math.hypot(tmp.x-w.position.x,tmp.y-w.position.y);if(distance<=ENTER_RADIUS_M)return{...record,distance,screenHitDistance:Number(hit.distance)||0};}return null;}'
          new='function vehicleAtScreenPoint(clientX,clientY){if(active||walk()?.mode!=="foot")return null;const camera=bridge()?.threeCamera,point=logicalScreenPoint(clientX,clientY),w=walk();if(!camera||!point||!w?.position)return null;const roots=vehicleRoots();if(!roots.length)return null;pickNdc.set(point.x/point.width*2-1,1-point.y/point.height*2);raycaster.setFromCamera(pickNdc,camera);const hits=raycaster.intersectObjects(roots.map(item=>item.root),true);for(const hit of hits){let node=hit.object,id="";while(node&&!id){id=String(node.userData?.worldPopulationId||node.userData?.worldProceduralId||"");node=node.parent;}if(!id)continue;const record=roots.find(item=>item.id===id);if(!record)continue;const physical=authoritativeVehiclePoint(record),distance=Math.hypot(physical.x-w.position.x,physical.y-w.position.y);if(distance<=ENTER_RADIUS_M)return{...record,distance,physicsPose:physical.pose,screenHitDistance:Number(hit.distance)||0};}return null;}'
          assert old in s
          s=s.replace(old,new,1)
          old='view.dataset.vehicleEnterInteraction="screen-raycast+keyboard-e+gamepad-y-v1";'
          new='view.dataset.vehicleEnterInteraction="screen-raycast+keyboard-e+gamepad-y-v1";view.dataset.vehicleEnterAuthority="box3d-position-v1";'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check sim/player_car_mode.mjs
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/player_car_mode.mjs
          git commit -m 'Use Box3D position for car entry authority'
          git push origin HEAD:main
