name: Update native layout test once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-native-layout-test-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update native-orientation browser expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/solo_layout_smoke.mjs'); s=p.read_text()
          s=s.replace('''    await page.waitForFunction(()=>{const viewport=document.querySelector("#viewport");return viewport?.dataset.orientationPolicy==="landscape"&&Boolean(viewport.dataset.soloOrientation);},{timeout:5000});''','''    await page.waitForFunction(()=>{const viewport=document.querySelector("#viewport");return viewport?.dataset.orientationPolicy==="native-never-rotate-v1"&&viewport.dataset.soloOrientation==="native";},{timeout:5000});''')
          old='''    if(g.orientationPolicy!=="landscape"||g.rotateBlocker)throw new Error(`${viewport.name}: landscape policy/blocker contract failed: ${JSON.stringify({policy:g.orientationPolicy,blocker:g.rotateBlocker})}`);\n    if(portrait){\n      if(g.orientation!=="css-landscape"||g.width!==viewport.height||g.height!==viewport.width)throw new Error(`${viewport.name}: portrait did not become a logical landscape viewport: ${JSON.stringify({orientation:g.orientation,width:g.width,height:g.height})}`);\n      const r=g.viewportPhysical;if(Math.abs(r.left)>1||Math.abs(r.top)>1||Math.abs(r.right-g.screenWidth)>1||Math.abs(r.bottom-g.screenHeight)>1)throw new Error(`${viewport.name}: rotated simulator does not cover screen: ${JSON.stringify({screen:[g.screenWidth,g.screenHeight],viewport:r})}`);\n      if(g.leftOpacity<.99||g.armOpacity<.99)throw new Error(`${viewport.name}: flight controls were dimmed by portrait mode: ${JSON.stringify({left:g.leftOpacity,arm:g.armOpacity})}`);\n    }else if(g.orientation!=="native-landscape")throw new Error(`${viewport.name}: native landscape policy was not detected: ${g.orientation}`);'''
          new='''    if(g.orientationPolicy!=="native-never-rotate-v1"||g.orientation!=="native"||g.rotateBlocker)throw new Error(`${viewport.name}: native orientation contract failed: ${JSON.stringify({policy:g.orientationPolicy,orientation:g.orientation,blocker:g.rotateBlocker})}`);\n    if(g.width!==viewport.width||g.height!==viewport.height)throw new Error(`${viewport.name}: viewport geometry was altered instead of staying native: ${JSON.stringify({actual:[g.width,g.height],expected:[viewport.width,viewport.height]})}`);\n    const r=g.viewportPhysical;if(Math.abs(r.left)>1||Math.abs(r.top)>1||Math.abs(r.right-g.screenWidth)>1||Math.abs(r.bottom-g.screenHeight)>1)throw new Error(`${viewport.name}: native simulator does not cover screen: ${JSON.stringify({screen:[g.screenWidth,g.screenHeight],viewport:r})}`);\n    if(portrait&&(g.leftOpacity<.99||g.armOpacity<.99))throw new Error(`${viewport.name}: flight controls were dimmed by portrait mode: ${JSON.stringify({left:g.leftOpacity,arm:g.armOpacity})}`);'''
          if old not in s: raise SystemExit('old orientation assertion block not found')
          s=s.replace(old,new,1)
          old='''    if(portrait){\n      const stick=g.leftPhysical,cx=(stick.left+stick.right)/2,cy=(stick.top+stick.bottom)/2;\n      await page.mouse.move(cx,cy);await page.mouse.down();await page.mouse.move(cx,cy+stick.height*.25,{steps:3});\n      const stickAxes=await page.$eval("#soloLeft .solo-knob",e=>({left:parseFloat(e.style.left),top:parseFloat(e.style.top)}));\n      await page.mouse.up();\n      if(!(stickAxes.left>60&&Math.abs(stickAxes.top-50)<2))throw new Error(`${viewport.name}: rotated pointer axes are wrong: ${JSON.stringify(stickAxes)}`);\n      const pad=g.heightPadPhysical,px=(pad.left+pad.right)/2,py=(pad.top+pad.bottom)/2;\n      await page.mouse.move(px,py);await page.mouse.down();await page.mouse.move(px+pad.width*.30,py,{steps:3});\n      const climbRate=await page.$eval("#soloHeightPad",e=>Number(e.dataset.rateMps));await page.mouse.up();\n      if(!(climbRate>0))throw new Error(`${viewport.name}: rotated altitude control does not command CLIMB: ${climbRate}`);\n    }'''
          new='''    if(portrait){\n      const stick=g.leftPhysical,cx=(stick.left+stick.right)/2,cy=(stick.top+stick.bottom)/2,targetX=cx+stick.width*.34;\n      await page.evaluate(({x,y})=>document.querySelector("#soloLeft").dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:901,pointerType:"touch",clientX:x,clientY:y,button:0})),{x:targetX,y:cy});\n      const stickAxes=await page.$eval("#soloLeft .solo-knob",e=>({left:parseFloat(e.style.left),top:parseFloat(e.style.top)}));\n      await page.evaluate(({x,y})=>document.querySelector("#soloLeft").dispatchEvent(new PointerEvent("pointerup",{bubbles:true,cancelable:true,pointerId:901,pointerType:"touch",clientX:x,clientY:y,button:0})),{x:targetX,y:cy});\n      if(!(stickAxes.left>75&&Math.abs(stickAxes.top-50)<3))throw new Error(`${viewport.name}: absolute native pointer mapping is wrong: ${JSON.stringify(stickAxes)}`);\n      const pad=g.heightPadPhysical,px=(pad.left+pad.right)/2,py=(pad.top+pad.bottom)/2,targetY=py-pad.height*.30;\n      await page.evaluate(({x,y})=>document.querySelector("#soloHeightPad").dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:902,pointerType:"touch",clientX:x,clientY:y,button:0})),{x:px,y:targetY});\n      const climbRate=await page.$eval("#soloHeightPad",e=>Number(e.dataset.rateMps));\n      await page.evaluate(({x,y})=>document.querySelector("#soloHeightPad").dispatchEvent(new PointerEvent("pointerup",{bubbles:true,cancelable:true,pointerId:902,pointerType:"touch",clientX:x,clientY:y,button:0})),{x:px,y:targetY});\n      if(!(climbRate>0))throw new Error(`${viewport.name}: native altitude control does not command CLIMB: ${climbRate}`);\n    }'''
          if old not in s: raise SystemExit('old rotated pointer block not found')
          s=s.replace(old,new,1)
          s=s.replace('''    console.log(`Solo layout ${viewport.name} passed: always-landscape FPV startup, clear race-free HUD, mapped controls, and EXIT-only menu reveal.`);''','''    console.log(`Solo layout ${viewport.name} passed: native-orientation FPV startup, clear race-free HUD, mapped controls, and EXIT-only menu reveal.`);''')
          p.write_text(s)
          PY
          node --check tests/solo_layout_smoke.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/solo_layout_smoke.mjs
          git commit -m 'Test native mobile orientation without CSS rotation'
          git push origin HEAD:main
