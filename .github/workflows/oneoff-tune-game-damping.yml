name: Tune GAME velocity damping

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-tune-game-damping.yml"

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Increase measured-attitude lead compensation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('esp32/Arondight45_StateControl.hpp')
          s=p.read_text()
          old='    static constexpr float kAttitudeLead = 0.40f;         // unload current tilt / accelerate reversals\n'
          new='    static constexpr float kAttitudeLead = 0.85f;         // compensate attitude/motor lag; damp velocity reversals\n'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state-control-tests
          /tmp/state-control-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core-tests
          /tmp/fc-core-tests
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit damping change
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add esp32/Arondight45_StateControl.hpp
          git commit -m "Damp GAME velocity loop with measured attitude lead"
          git push origin HEAD:main
