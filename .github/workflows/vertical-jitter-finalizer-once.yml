name: One-shot finalize UP DOWN and jitter fix

on:
  push:
    branches: [main]
    paths: ['.github/vertical-jitter-finalizer.trigger']

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Patch product and permanent release gates
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, got {count}: {old[:160]!r}')
              p.write_text(s.replace(old,new,1))

          replace_once(
              'sim/simulator.mjs',
              'stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,.01)',
              'stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,DT)'
          )

          p=Path('tests/architecture_invariants.mjs'); s=p.read_text()
          marker='requireText("sim/simulator.mjs","let soloGroundClearance=phoneSettings.defaultHoverAgl");\n'
          addition='requireText("sim/simulator.mjs","stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,DT)","Solo/Xbox AGL target slew must use the 1 kHz simulation DT");\nforbidText("sim/simulator.mjs","stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,.01)","10 ms height integration inside the 1 kHz loop makes UP/DOWN 10x too fast");\n'
          if addition not in s:
              if marker not in s: raise SystemExit('architecture height marker missing')
              s=s.replace(marker,marker+addition,1)
          p.write_text(s)

          p=Path('tests/takeoff_agl_browser_smoke.mjs'); s=p.read_text()
          old='''  if(Math.abs(final.roll)>10||Math.abs(final.pitch)>10)throw new Error(`airframe did not settle level after takeoff: ${JSON.stringify(final)}`);

  console.log(`Takeoff AGL E2E passed: AGL valid continuously, max altitude ${maxAltitude.toFixed(2)} m, final AGL ${final.agl.toFixed(2)} m, max tilt ${maxTilt.toFixed(1)} deg.`);'''
          new='''  if(Math.abs(final.roll)>10||Math.abs(final.pitch)>10)throw new Error(`airframe did not settle level after takeoff: ${JSON.stringify(final)}`);

  const targetAgl=()=>page.$eval("#soloClearance",el=>Number(el.dataset.targetAglM));
  const holdHeight=async(direction,durationMs)=>{
    const point=await page.$eval("#soloHeightPad",(pad,dir)=>{const r=pad.getBoundingClientRect(),rotated=document.querySelector("#viewport")?.dataset.soloOrientation==="css-landscape";return rotated?{x:dir>0?r.right-3:r.left+3,y:r.top+r.height/2}:{x:r.left+r.width/2,y:dir>0?r.top+3:r.bottom-3};},direction);
    await page.mouse.move(point.x,point.y);await page.mouse.down();await wait(durationMs);await page.mouse.up();await wait(120);
  };
  const target0=await targetAgl();
  await holdHeight(+1,300);
  const targetUp=await targetAgl(),upDelta=targetUp-target0;
  if(!(upDelta>1.05&&upDelta<2.05))throw new Error(`UP height slew timebase is wrong: start=${target0} up=${targetUp} delta=${upDelta}; expected ~1.5 m in 300 ms at 5 m/s`);
  await wait(1200);
  await holdHeight(-1,650);
  const targetDown=await targetAgl();
  if(!(targetDown>=.49&&targetDown<=.75))throw new Error(`DOWN did not stop at the safe AGL floor: target=${targetDown}`);

  const verticalSamples=[];
  for(let i=0;i<50;i++){verticalSamples.push(await read());await wait(100);}
  const verticalBad=verticalSamples.find(s=>s.state!=="ARMED"||!s.navValid||s.navDegraded||!Number.isFinite(s.agl)||s.agl<.30||s.rangeText.includes("DEGRADED")||s.rangeText.includes("LOST"));
  if(verticalBad)throw new Error(`UP/DOWN maneuver lost control or struck the ground: ${JSON.stringify(verticalBad)}`);
  const verticalMaxTilt=Math.max(...verticalSamples.flatMap(s=>[Math.abs(s.roll),Math.abs(s.pitch)]).filter(Number.isFinite));
  const verticalFinal=verticalSamples.at(-1);
  if(verticalMaxTilt>30)throw new Error(`UP/DOWN maneuver attitude exceeded 30 degrees: maxTilt=${verticalMaxTilt.toFixed(1)} final=${JSON.stringify(verticalFinal)}`);
  if(!(verticalFinal.agl>.35&&verticalFinal.agl<1.00))throw new Error(`DOWN did not settle safely near the 0.5 m target: ${JSON.stringify(verticalFinal)}`);

  console.log(`Takeoff + UP/DOWN AGL E2E passed: 300 ms UP target delta ${upDelta.toFixed(2)} m, safe DOWN final AGL ${verticalFinal.agl.toFixed(2)} m, max tilt ${Math.max(maxTilt,verticalMaxTilt).toFixed(1)} deg.`);'''
          if old not in s: raise SystemExit('takeoff browser marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('.github/workflows/deploy.yml'); s=p.read_text()
          marker='          CHROME_BIN="$CHROME_BIN" node tests/android_render_browser_smoke.mjs http://127.0.0.1:4174\n'
          line='          CHROME_BIN="$CHROME_BIN" node tests/world_fpv_frame_lock_smoke.mjs http://127.0.0.1:4174\n'
          if line not in s:
              if marker not in s: raise SystemExit('deploy browser marker missing')
              s=s.replace(marker,marker+line,1)
          p.write_text(s)
          PY

          node --check sim/simulator.mjs
          node --check tests/takeoff_agl_browser_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/camera_stabilization_test.mjs
          node tests/render_stability_test.mjs
          node tests/architecture_invariants.mjs

          rm -f .github/vertical-jitter-fix.trigger .github/vertical-jitter-finalizer.trigger
          rm -f .github/workflows/vertical-jitter-fix-once.yml .github/workflows/vertical-jitter-finalizer-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sim/simulator.mjs tests/takeoff_agl_browser_smoke.mjs tests/architecture_invariants.mjs .github/workflows/deploy.yml .github
          git diff --cached --check
          git commit -m 'Fix UP DOWN height timebase and gate camera jitter'
          git push origin HEAD:main

      - name: Report finalizer result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="VERTICAL FINALIZER · source=${GH_SHA} · patch=${PATCH_OUTCOME} · job=${JOB_STATUS} · https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
