name: one-shot-throttle-gate
on:
  push:
    branches: ["fix/browser-throttle-gate"]
    paths: [".github/workflows/one-shot-throttle-gate.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make local throttle browser gate observe updated presentation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_sim_smoke.mjs');s=p.read_text()
          old='''  await page.$eval("#touchThrottle",e=>{e.value=".25";});\n  const throttleStart=await simTime();await waitForSimTime(throttleStart+.1,15000);\n  const throttleMotors=await page.$eval("#motors",e=>(e.textContent||"").trim().split(/\\s+/).map(Number));\n  if(!throttleMotors.every(v=>Number.isFinite(v)&&v>1050))throw new Error(`local throttle failed: ${throttleMotors.join(" ")}`);'''
          new='''  await page.$eval("#touchThrottle",e=>{e.value=".25";});\n  const throttleStart=await simTime();await waitForSimTime(throttleStart+.1,15000);\n  await page.waitForFunction(()=>{const values=(document.querySelector("#motors")?.textContent||"").trim().split(/\\s+/).map(Number);return values.length===4&&values.every(v=>Number.isFinite(v)&&v>1050);},{timeout:2000});\n  const throttleMotors=await page.$eval("#motors",e=>(e.textContent||"").trim().split(/\\s+/).map(Number));\n  if(!throttleMotors.every(v=>Number.isFinite(v)&&v>1050))throw new Error(`local throttle failed: ${throttleMotors.join(" ")}`);'''
          assert s.count(old)==1,s.count(old);p.write_text(s.replace(old,new,1))
          PY
          node --check tests/browser_sim_smoke.mjs
      - name: Commit gate fix
        run: |
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/browser_sim_smoke.mjs
          git commit -m 'Stabilize local throttle browser release gate'
          git push
