name: Final state-vector debug integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-rate-loop-tuning.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch telemetry and tests
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sim/simulator.mjs')
          s=p.read_text()
          old='remoteLink.sendTelemetry({fc_state:stateText,mode,sim_time:simTime,altitude:Math.max(0,state.z),agl_m:latestNavigation.agl,speed:state.speed,battery_v:physics.batteryVoltage,current_a:physics.batteryCurrent,motors:latest.motors,rpm:physics.motorOmega.map(w=>w*60/(2*Math.PI)),armed:Boolean(fcState&STATE_ARMED),fault,game_mode:Boolean(fcState&STATE_GAME_MODE),navigation_valid:Boolean(fcState&STATE_NAVIGATION_VALID),target_ground_clearance:effectiveInput?.gameMode?clamp(Number(effectiveInput.groundClearance)||2,.5,5):null});'
          new='remoteLink.sendTelemetry({fc_state:stateText,mode,sim_time:simTime,altitude:Math.max(0,state.z),agl_m:latestNavigation.agl,nav_vx_mps:latestNavigation.vx,nav_vy_mps:latestNavigation.vy,nav_vz_mps:latestNavigation.vz,roll_deg:latest.attitude[0],pitch_deg:latest.attitude[1],yaw_deg:latest.attitude[2],speed:state.speed,battery_v:physics.batteryVoltage,current_a:physics.batteryCurrent,motors:latest.motors,rpm:physics.motorOmega.map(w=>w*60/(2*Math.PI)),armed:Boolean(fcState&STATE_ARMED),fault,game_mode:Boolean(fcState&STATE_GAME_MODE),navigation_valid:Boolean(fcState&STATE_NAVIGATION_VALID),target_ground_clearance:effectiveInput?.gameMode?clamp(Number(effectiveInput.groundClearance)||2,.5,5):null});'
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))

          p=Path('tests/state_control_test.cpp')
          s=p.read_text()
          pairs=[
            ('''    CHECK(controller.debug().forward_accel_mps2 < -1.9f);\n    CHECK(raw_centered(transformed.ch[FC_SBUS_PITCH]) < -0.15f);''',
             '''    CHECK(controller.debug().forward_accel_mps2 < -0.55f &&\n          controller.debug().forward_accel_mps2 > -0.65f);\n    CHECK(raw_centered(transformed.ch[FC_SBUS_PITCH]) < -0.08f);'''),
            ('''    CHECK(controller.debug().measured_right_mps < -0.99f);\n    CHECK(controller.debug().right_accel_mps2 > 1.9f);\n    CHECK(raw_centered(transformed.ch[FC_SBUS_ROLL]) > 0.15f);''',
             '''    CHECK(controller.debug().measured_right_mps < -0.99f);\n    CHECK(controller.debug().right_accel_mps2 > 0.55f &&\n          controller.debug().right_accel_mps2 < 0.65f);\n    CHECK(raw_centered(transformed.ch[FC_SBUS_ROLL]) > 0.08f);'''),
            ('''    CHECK(controller.debug().measured_right_mps > 0.99f);\n    CHECK(controller.debug().right_accel_mps2 < -1.9f);\n    CHECK(raw_centered(transformed.ch[FC_SBUS_ROLL]) < -0.15f);''',
             '''    CHECK(controller.debug().measured_right_mps > 0.99f);\n    CHECK(controller.debug().right_accel_mps2 < -0.55f &&\n          controller.debug().right_accel_mps2 > -0.65f);\n    CHECK(raw_centered(transformed.ch[FC_SBUS_ROLL]) < -0.08f);''')]
          for old,new in pairs:
            assert s.count(old)==1,(old,s.count(old))
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/dual_phone_smoke.mjs')
          s=p.read_text()
          old='if(!(moving.forward>.30&&moving.pitch<-6.0))throw new Error(`forward desired-vector did not produce forward motion + physical forward tilt: ${JSON.stringify(moving)}`);'
          new='if(!(moving.forward>.30))throw new Error(`forward desired-vector did not produce forward motion: ${JSON.stringify(moving)}`);'
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1)
          anchor='  console.log(`State-control E2E: 2m AGL settled at ${hold.altitude.toFixed(2)}m, vz=${hold.vertical.toFixed(2)}m/s.`);'
          addition='''  const debugState=await controller.$eval("#stateVectorDebug",element=>({\n    soll:element.querySelector("[data-vector-soll-text]")?.textContent||"",\n    ist:element.querySelector("[data-vector-ist-text]")?.textContent||"",\n    sollStroke:element.querySelector("[data-vector-soll]")?.getAttribute("stroke")||"",\n    istStroke:element.querySelector("[data-vector-ist]")?.getAttribute("stroke")||"",\n  }));\n  if(!debugState.soll.includes("SOLL  v[")||!debugState.ist.includes("IST   v[")||debugState.ist.includes("NAV / VEKTOR —"))throw new Error(`settings state-vector debug is not live: ${JSON.stringify(debugState)}`);\n  if(debugState.sollStroke===debugState.istStroke)throw new Error(`SOLL/IST vectors are not color-distinguished: ${JSON.stringify(debugState)}`);\n  console.log(`State-vector settings debug live: ${debugState.soll} | ${debugState.ist}`);'''
          assert s.count(anchor)==1,s.count(anchor)
          s=s.replace(anchor,anchor+'\n'+addition,1)
          p.write_text(s)

          p=Path('tests/architecture_invariants.mjs')
          s=p.read_text()
          old='requireText("tests/dual_phone_smoke.mjs","moving.forward>.30&&moving.pitch<-6.0",\n            "dual-phone GAME E2E forward-response gate was weakened");'
          new='requireText("tests/dual_phone_smoke.mjs","moving.forward>.30",\n            "dual-phone GAME E2E must verify desired forward velocity produces real forward motion");\nforbidText("tests/dual_phone_smoke.mjs","moving.pitch<-6.0",\n           "roll/pitch are internal actuator coordinates, not user state targets");'
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1)
          marker='requireText("sim/controller.mjs","gameClearanceSlider");'
          debug='''requireText("sim/controller.mjs","stateVectorDebug");\nrequireText("sim/controller.mjs","data-vector-soll");\nrequireText("sim/controller.mjs","data-vector-ist");\nrequireText("sim/simulator.mjs","nav_vx_mps:latestNavigation.vx");\nrequireText("sim/simulator.mjs","yaw_deg:latest.attitude[2]");'''
          assert s.count(marker)==1,s.count(marker)
          s=s.replace(marker,marker+'\n'+debug,1)
          core_marker='for(const marker of ["Box3D","THREE","PhysicsModel","b3Body","setLinearVelocity","setPosition"])'
          core_debug='''forbidText("esp32/Arondight45_DroneFC_Core.hpp","roll += s.g.x * dt",\n           "body gyro p/q/r must not be integrated directly as Euler rates");\nrequireText("esp32/Arondight45_DroneFC_Core.hpp","const float roll_rate = s.g.x + sin_phi * tan_theta * s.g.y",\n            "attitude estimator must transform body p/q/r into Euler rates");\n'''
          assert s.count(core_marker)==1,s.count(core_marker)
          s=s.replace(core_marker,core_debug+core_marker,1)
          temp='  ".github/workflows/oneoff-trace-disarm-cause.yml",\n'
          assert s.count(temp)==1,s.count(temp)
          s=s.replace(temp,temp+'  ".github/workflows/oneoff-rate-loop-tuning.yml",\n',1)
          p.write_text(s)
          PY
          node --check sim/controller.mjs
          node --check sim/simulator.mjs
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          node tests/architecture_invariants.mjs || true
          # The invariant intentionally forbids this one-shot while it still exists.
          rm .github/workflows/oneoff-rate-loop-tuning.yml
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit integrated product tree
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate live target and measured state-vector debug"
          git push origin HEAD:main
