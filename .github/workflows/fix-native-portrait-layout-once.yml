name: Fix native portrait layout contract once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-native-portrait-layout-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update native portrait center-clearance invariant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/solo_layout_smoke.mjs')
          s=p.read_text()
          old='''    if(g.clearance.right>=g.width*.40)throw new Error(`${viewport.name}: height control still blocks center view: ${JSON.stringify(g.clearance)}`);'''
          new='''    if(g.clearance.right>=g.width*.5-20)throw new Error(`${viewport.name}: height control crosses the native center safe gap: ${JSON.stringify({width:g.width,clearance:g.clearance})}`);'''
          if old not in s:
              raise SystemExit('legacy landscape center threshold not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/solo_layout_smoke.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/solo_layout_smoke.mjs
          git commit -m 'Use native portrait center-safe layout invariant'
          git push origin HEAD:main
