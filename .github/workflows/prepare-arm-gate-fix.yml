name: Prepare authoritative local ARM gate fix
on:
  push:
    branches:
      - diagnostic/local-arm-root-cause-v3
    paths:
      - '.github/workflows/prepare-arm-gate-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch full gate without weakening physical path
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_sim_smoke.mjs');s=p.read_text()
          old='''  const localArmStart=await simTime();await page.keyboard.press("Space");await waitForSimTime(localArmStart+1.1,45000);\n  state=await page.$eval("#fcState",e=>e.textContent||"");\n  if(state!=="ARMED")throw new Error(`local fallback ARM failed: ${JSON.stringify(await snapshot())}`);\n'''
          new='''  // Space must arm through the same local SBUS -> FirmwareRuntime -> ArmState path.\n  // Use the authoritative FC state bit for arming completion; #fcState is a\n  // deliberately rate-limited 20 Hz presentation surface and may lag one frame.\n  const localArmStart=await simTime();await page.keyboard.press("Space");\n  await page.waitForFunction(({start,limit})=>{const d=globalThis.__arondightDiagnostics,sim=Number(d?.simTime),fc=Number(d?.fcState)||0;return Boolean(fc&1)||(Number.isFinite(sim)&&sim>=start+limit);},{timeout:15000},{start:localArmStart,limit:1.25});\n  const localArmReached=await page.evaluate(()=>({sim:Number(globalThis.__arondightDiagnostics?.simTime),fc:Number(globalThis.__arondightDiagnostics?.fcState)||0}));\n  if(!(localArmReached.fc&1)||localArmReached.sim-localArmStart>1.25)throw new Error(`local fallback ARM authority failed: start=${localArmStart} reached=${JSON.stringify(localArmReached)} snapshot=${JSON.stringify(await snapshot())}`);\n  await page.waitForFunction(()=>document.querySelector("#fcState")?.textContent==="ARMED",{timeout:1500});\n  state=await page.$eval("#fcState",e=>e.textContent||"");\n'''
          if s.count(old)!=1: raise SystemExit(f'expected exact legacy ARM block once, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/browser_sim_smoke.mjs
          git diff --check
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/browser_sim_smoke.mjs
          git commit -m 'Use authoritative FC state for local ARM release gate'
          git push origin HEAD:diagnostic/local-arm-root-cause-v3
