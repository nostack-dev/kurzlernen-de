name: Box3D building fire diagnostic

on:
  push:
    branches: ["diag/target-fire-root-cause"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compare live Box3D hits against rendered map geometry
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          BUILD_DIR=/tmp/box3d-building-diag
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          CHROME_BIN="$CHROME_BIN" node tests/box3d_building_fire_root_cause_diag.mjs "https://kurzlernen.de/drone_simulator.html"
