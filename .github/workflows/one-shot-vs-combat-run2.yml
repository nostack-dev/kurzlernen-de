name: one-shot-vs-combat-run2
on:
  push:
    branches:
      - fix/vs-signaling-fallback
    paths:
      - .github/workflows/one-shot-vs-combat-run2.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply combat patch
        run: |
          python3 tools/fix_apply_vs_combat_patch.py
          python3 tools/apply_vs_combat_patch.py
      - name: Deterministic source gates
        run: |
          set -euxo pipefail
          node --check sim/lan_vs.mjs
          node --check sim/real_world_bootstrap.mjs
          node --check sim/flight_fire_fx.mjs
          node --check sim/solo_layout.mjs
          node --check tests/vs_combat_browser_smoke.mjs
          node tests/lan_vs_smoke.mjs
          node tests/architecture_invariants.mjs
      - name: Build exact production browser runtime
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' -o generated/flight_core.mjs
          BUILD_DIR=/tmp/arondight45-vs-combat-build
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.1 @trystero-p2p/mqtt@0.25.1
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          python3 -c 'from pathlib import Path; p=Path("drone_simulator.html"); h=p.read_text(); m="<script type=\"module\" src=\"./sim/real_world_bootstrap.mjs\"></script>"; assert m in h; b=Path("/tmp/arondight45-simulator.bundle.mjs").read_text().replace("</script","<\\\\/script"); p.write_text(h.replace(m,"<script type=\"module\">\n"+b+"\n</script>"))'
      - name: Browser gates
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/vs-combat-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/solo_layout_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/vs_combat_browser_smoke.mjs http://127.0.0.1:4174
      - name: Commit validated product changes
        run: |
          set -euxo pipefail
          git checkout -- drone_simulator.html
          rm -rf generated
          rm -f node_modules
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sim/lan_vs.mjs sim/real_world_bootstrap.mjs sim/flight_fire_fx.mjs sim/solo_layout.mjs tests/lan_vs_smoke.mjs tests/architecture_invariants.mjs tests/solo_layout_smoke.mjs tests/vs_combat_browser_smoke.mjs .github/workflows/deploy.yml
          git commit -m 'Add VS health explosions respawn and kill count'
          git push
