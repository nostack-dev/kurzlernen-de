name: One-shot cleanup browser V5 migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-refresh-browser-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove completed migration scaffold
        run: |
          set -euxo pipefail
          rm .github/workflows/one-shot-refresh-browser-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove completed browser V5 migration scaffold"
          git push origin HEAD:main
