name: Repair camera and pedestrian collisions once
on:
  push:
    paths:
      - '.github/workflows/repair-camera-pedestrians-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch pedestrian lifetime and building navigation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sim/world_procedural_population.mjs')
          s=p.read_text()
          def once(old,new,label):
              global s
              if old not in s: raise SystemExit(f'missing {label}: {old[:120]!r}')
              s=s.replace(old,new,1)

          panic_import='import {PEDESTRIAN_PANIC_GUNSHOT_RADIUS_M,PEDESTRIAN_PANIC_EXPLOSION_RADIUS_M,PEDESTRIAN_PANIC_RECOVER_MS,pedestrianFleeHeading,pedestrianPanicDurationMs,pedestrianPanicSpeedMps,pedestrianRecoveryWeight,pedestrianShouldPanic} from "./world_pedestrian_panic_logic.mjs";\n'
          once(panic_import,panic_import+'import {pedestrianPointBlocked,projectPedestrianOutsideBuildings,steerPedestrianStep} from "./world_pedestrian_navigation.mjs";\n','pedestrian navigation import')

          once('nextPanicScreamAt:0};}','nextPanicScreamAt:0,pedestrianX:NaN,pedestrianY:NaN,pedestrianHeading:NaN,pedestrianLastAt:0,pedestrianCollisionCount:0};}','pedestrian state fields')
          once('record.panicState="calm";record.panicUntil=0;record.panicLastAt=0;record.routeDirection=record.seed&1?-1:1;','record.panicState="calm";record.panicUntil=0;record.panicLastAt=0;record.pedestrianX=NaN;record.pedestrianY=NaN;record.pedestrianHeading=NaN;record.pedestrianLastAt=0;record.pedestrianCollisionCount=0;record.routeDirection=record.seed&1?-1:1;','configure pedestrian reset')

          old_stream='function streamPosition(record){if(record.physicsPose?.position)return{x:record.physicsPose.position[0],y:record.physicsPose.position[1],z:record.physicsPose.position[2]};if(record.group.visible)return{x:record.group.position.x,y:record.group.position.y,z:record.group.position.z};const a=recordAnchor(record);return{x:a.x,y:a.y,z:0};}'
          new_stream='function streamPosition(record){if(record.physicsPose?.position)return{x:record.physicsPose.position[0],y:record.physicsPose.position[1],z:record.physicsPose.position[2]};if(record.kind==="person"&&Number.isFinite(record.pedestrianX)&&Number.isFinite(record.pedestrianY))return{x:record.pedestrianX,y:record.pedestrianY,z:Number(record.group?.position?.z)||0};const gp=record.group?.position;if(Number.isFinite(gp?.x)&&Number.isFinite(gp?.y)&&Number.isFinite(gp?.z))return{x:gp.x,y:gp.y,z:gp.z};const a=recordAnchor(record);return{x:a.x,y:a.y,z:0};}'
          once(old_stream,new_stream,'stream position visibility decoupling')

          old_recycle='function shouldRecycleRecord(record,now){if(record.group.userData.playerDriven||record.group.userData.remotePlayerDriven){record.outsideSince=0;record.lastViewProtectedAt=now;return false;}const p=streamPosition(record),decision=retentionDecision({distanceM:minFocusDistance(p.x,p.y),nowMs:now,outsideSinceMs:record.outsideSince,lastProtectedAtMs:record.lastViewProtectedAt,retentionRadiusM:ENTITY_RETENTION_RADIUS_M,recycleRadiusM:ENTITY_RECYCLE_RADIUS_M,recycleGraceMs:ENTITY_RECYCLE_GRACE_MS,viewGraceMs:VIEW_RECYCLE_GRACE_MS,protectedNow:pointProtectedByView(p.x,p.y,p.z,record.kind==="bus"?7:record.kind==="bird"?2.5:4)});record.outsideSince=decision.outsideSinceMs;record.lastViewProtectedAt=decision.lastProtectedAtMs;return decision.recycle;}'
          new_recycle='function shouldRecycleRecord(record,now){if(record.group.userData.playerDriven||record.group.userData.remotePlayerDriven||record.kind==="person"&&record.panicState!=="calm"){record.outsideSince=0;record.lastViewProtectedAt=now;return false;}const p=streamPosition(record),decision=retentionDecision({distanceM:minFocusDistance(p.x,p.y),nowMs:now,outsideSinceMs:record.outsideSince,lastProtectedAtMs:record.lastViewProtectedAt,retentionRadiusM:ENTITY_RETENTION_RADIUS_M,recycleRadiusM:ENTITY_RECYCLE_RADIUS_M,recycleGraceMs:ENTITY_RECYCLE_GRACE_MS,viewGraceMs:VIEW_RECYCLE_GRACE_MS,protectedNow:pointProtectedByView(p.x,p.y,p.z,record.kind==="bus"?7:record.kind==="bird"?2.5:4)});record.outsideSince=decision.outsideSinceMs;record.lastViewProtectedAt=decision.lastProtectedAtMs;return decision.recycle;}'
          once(old_recycle,new_recycle,'panic retention')

          recycle_pattern=r'function recycleRecord\(record\)\{.*?\}\nfunction maintainDecorContinuity'
          recycle_repl='''function recycleRecord(record){record.streamGeneration=(record.streamGeneration||0)+1;record.streamAnchor=focusCell(focusForSeed(record.id||`${record.kind}:${record.index}`,record.streamGeneration));record.outsideSince=0;record.routeKey="";record.parkPose=null;if(record.physicsRegistered){rigidBodies()?.removeBody?.(record.id);record.physicsRegistered=false;}record.physicsPose=null;if(record.kind==="person"){record.pedestrianX=NaN;record.pedestrianY=NaN;record.pedestrianHeading=NaN;record.pedestrianLastAt=0;record.panicState="calm";record.panicUntil=0;}populationRecycleCount++;const v=viewport();if(v)v.dataset.worldPopulationRecycles=String(populationRecycleCount);}\nfunction maintainDecorContinuity'''
          s,n=re.subn(recycle_pattern,recycle_repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('recycleRecord replacement failed')

          point_pattern=r'function pointInPolygon\(x,y,points\)\{.*?\}\nfunction panicBlocked\(x,y\)\{.*?\}\n'
          s,n=re.subn(point_pattern,'function buildingPrisms(){return bridge()?.buildingCollisionSnapshot?.prisms||[];}\nfunction panicBlocked(x,y){return pedestrianPointBlocked(x,y,buildingPrisms(),.30);}\n',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('panicBlocked replacement failed')

          turn_marker='function turnToward(current,target,maxStep){'
          nav_helper='''function stepPersonNavigation(record,target,now,{speedMps=record.speed||1.25,clearanceM=.30}={}){const prisms=buildingPrisms(),hasPosition=Number.isFinite(record.pedestrianX)&&Number.isFinite(record.pedestrianY);if(!hasPosition){const spawn=projectPedestrianOutsideBuildings(target.x,target.y,prisms,{clearanceM:clearanceM+.04});record.pedestrianX=spawn.x;record.pedestrianY=spawn.y;record.pedestrianHeading=Number.isFinite(target.yaw)?target.yaw:0;record.pedestrianLastAt=now;if(spawn.moved)record.pedestrianCollisionCount++;}else{const dt=clamp((now-record.pedestrianLastAt)/1000,0,.05);record.pedestrianLastAt=now;const step=steerPedestrianStep({x:record.pedestrianX,y:record.pedestrianY,targetX:target.x,targetY:target.y,speedMps,dtS:dt,prisms,clearanceM,sideBias:record.index&1?1:-1,headingHint:record.pedestrianHeading});record.pedestrianX=step.x;record.pedestrianY=step.y;record.pedestrianHeading=step.heading;if(step.blocked||step.ejected)record.pedestrianCollisionCount++;}record.group.position.set(record.pedestrianX,record.pedestrianY,.01*Math.sin(Date.now()/1000*6+record.index));record.group.rotation.set(0,0,Number.isFinite(record.pedestrianHeading)?record.pedestrianHeading:(target.yaw||0));return{x:record.pedestrianX,y:record.pedestrianY,yaw:record.group.rotation.z};}\n'''
          if turn_marker not in s: raise SystemExit('turnToward marker missing')
          s=s.replace(turn_marker,nav_helper+turn_marker,1)

          panic_pattern=r'function updatePanicRecord\(record,epoch,now\)\{.*?\}\n\nfunction respawnAllowed'
          panic_repl='''function updatePanicRecord(record,epoch,now){if(record.panicState==="panic"&&now<record.panicUntil){const dt=clamp((now-record.panicLastAt)/1000,0,.05);record.panicLastAt=now;const desired=pedestrianFleeHeading({personX:record.panicX,personY:record.panicY,dangerX:record.panicFromX,dangerY:record.panicFromY,jitterRad:.10*Math.sin(epoch*2.1+record.index)});record.panicHeading=turnToward(record.panicHeading,desired,2.8*dt);const distanceTarget=9,step=steerPedestrianStep({x:record.panicX,y:record.panicY,targetX:record.panicX+Math.cos(record.panicHeading)*distanceTarget,targetY:record.panicY+Math.sin(record.panicHeading)*distanceTarget,speedMps:record.panicSpeed,dtS:dt,prisms:buildingPrisms(),clearanceM:.32,sideBias:record.index&1?1:-1,headingHint:record.panicHeading});record.panicX=step.x;record.panicY=step.y;record.panicHeading=step.heading;record.pedestrianX=step.x;record.pedestrianY=step.y;record.pedestrianHeading=step.heading;record.pedestrianLastAt=now;if(step.blocked||step.ejected)record.pedestrianCollisionCount++;record.group.position.set(step.x,step.y,.018*Math.sin(epoch*13+record.index));record.group.rotation.set(0,0,step.heading);setPersonPanicPose(record,1,epoch);record.group.visible=true;return true;}if(record.panicState==="panic"){record.panicState="recover";record.panicRecoverAt=now;record.panicLastAt=now;record.panicRecoverX=record.panicX;record.panicRecoverY=record.panicY;record.group.userData.worldPedestrianFsm="recover";}if(record.panicState==="recover"){const elapsed=now-record.panicRecoverAt,weight=pedestrianRecoveryWeight(elapsed),target=rectSample(record,epoch),nav=stepPersonNavigation(record,target,now,{speedMps:Math.max(1.6,(record.speed||1.2)*1.35),clearanceM:.30});record.panicX=nav.x;record.panicY=nav.y;setPersonPanicPose(record,weight,epoch);record.group.visible=true;if(elapsed>=PEDESTRIAN_PANIC_RECOVER_MS){record.panicState="calm";record.panicUntil=0;record.group.userData.worldPedestrianFsm="calm";setPersonPanicPose(record,0,epoch);}return true;}return false;}\n\nfunction respawnAllowed'''
          s,n=re.subn(panic_pattern,panic_repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('updatePanicRecord replacement failed')

          update_pattern=r'function updateRecord\(record,epoch,now\)\{.*?\}\n\nfunction styleMap'
          update_repl='''function updateRecord(record,epoch,now){if(record.kind==="car"||record.kind==="bus"){updatePhysicalVehicle(record,epoch,now);return;}if(!respawnAllowed(record)){record.group.visible=false;return;}if(record.kind==="person"&&updatePanicRecord(record,epoch,now))return;if(shouldRecycleRecord(record,now))recycleRecord(record);if(record.kind==="bird"){const m=record.motion,a=epoch*m.omega+m.phase,flap=.82+.2*Math.sin(epoch*10+record.index),base=recordAnchor(record);record.group.position.set(base.x+m.cx+Math.cos(a)*m.rx,base.y+m.cy+Math.sin(a*.94)*m.ry,m.z+Math.sin(a*2.3+record.index)*2.1);record.group.rotation.set(.08*Math.sin(a*3),0,a+Math.PI/2);record.group.scale.set(1,flap,1);record.group.visible=true;return;}const p=rectSample(record,epoch);if(record.kind==="person"){stepPersonNavigation(record,p,now,{speedMps:record.speed||1.25,clearanceM:.30});setPersonPanicPose(record,0,epoch);}else{const z=.01*Math.sin(epoch*6+record.index);record.group.position.set(p.x,p.y,z);record.group.rotation.set(0,0,p.yaw);}record.group.visible=true;}\n\nfunction styleMap'''
          s,n=re.subn(update_pattern,update_repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('updateRecord replacement failed')

          once('record.panicState="calm";record.panicUntil=0;setPersonPanicPose(record,0,now/1000);record.deadUntil=now+10000;','record.panicState="calm";record.panicUntil=0;record.pedestrianX=NaN;record.pedestrianY=NaN;record.pedestrianHeading=NaN;record.pedestrianLastAt=0;setPersonPanicPose(record,0,now/1000);record.deadUntil=now+10000;','death pedestrian nav reset')

          once('v.dataset.worldPopulationStreaming="distance-hysteresis+view-veto-v2";','v.dataset.worldPopulationStreaming="distance-hysteresis+visibility-veto-only-v3";v.dataset.worldPedestrianLifetime="world-position+distance-retention+panic-pin-v2";v.dataset.worldPedestrianCollision="building-footprint-steering-v2";','streaming telemetry')

          old_frame='let alive=0,physicalVehicles=0,lowestVehicleZ=Infinity,panicking=0;for(const record of records){updateRecord(record,epoch,now);if(record.group.visible)alive++;if(record.kind==="person"&&record.panicState!=="calm")panicking++;if((record.kind==="car"||record.kind==="bus")&&record.physicsPose){physicalVehicles++;lowestVehicleZ=Math.min(lowestVehicleZ,record.group.position.z);}}'
          new_frame='let alive=0,physicalVehicles=0,lowestVehicleZ=Infinity,panicking=0,pedestrianCollisionEvents=0;for(const record of records){updateRecord(record,epoch,now);if(record.group.visible)alive++;if(record.kind==="person"){if(record.panicState!=="calm")panicking++;pedestrianCollisionEvents+=record.pedestrianCollisionCount||0;}if((record.kind==="car"||record.kind==="bus")&&record.physicsPose){physicalVehicles++;lowestVehicleZ=Math.min(lowestVehicleZ,record.group.position.z);}}'
          once(old_frame,new_frame,'frame pedestrian counters')
          once('v.dataset.worldPopulationRecycles=String(populationRecycleCount);v.dataset.worldDecorRecycles=String(decorRecycleCount);','v.dataset.worldPopulationRecycles=String(populationRecycleCount);v.dataset.worldDecorRecycles=String(decorRecycleCount);v.dataset.worldPedestrianPanic="gunshot+explosion-flee+hands-up+scream-v1";v.dataset.worldPedestrianPanicCount=String(panicking);v.dataset.worldPedestrianPanicScreams=String(panicScreams);v.dataset.worldPedestrianPanicGunshotRadiusM=String(PEDESTRIAN_PANIC_GUNSHOT_RADIUS_M);v.dataset.worldPedestrianPanicExplosionRadiusM=String(PEDESTRIAN_PANIC_EXPLOSION_RADIUS_M);v.dataset.worldPedestrianCollisionEvents=String(pedestrianCollisionEvents);v.dataset.worldPedestrianLifetime="world-position+distance-retention+panic-pin-v2";','frame telemetry')

          p.write_text(s)
          PY
          node --check sim/world_procedural_population.mjs
          node --check sim/camera_collision_guard.mjs
          node tests/world_pedestrian_navigation_test.mjs
          ! grep -R "camera_box3d_spring\|CameraBox3dSpring\|box3d-dynamic-spring" sim tests --exclude-dir=node_modules
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim/world_procedural_population.mjs
          git commit -m "Decouple pedestrian lifetime from visibility"
          git push origin HEAD:main
