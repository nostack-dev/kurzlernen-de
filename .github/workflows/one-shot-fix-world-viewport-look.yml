name: Fix obsolete viewport look regression
on:
  push:
    branches: ["fix/final-flight-safety-ux"]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Remove obsolete free-viewport look test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          old='''  await page.mouse.move(250,145);await page.mouse.down();await page.mouse.move(330,125,{steps:5});await page.mouse.up();
            await page.waitForFunction(()=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0))>8,{timeout:3000});
            await page.waitForFunction(()=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0))<1,{timeout:3000});
          '''
          assert s.count(old)==1
          p.write_text(s.replace(old,'',1))
          PY
          node --check tests/real_world_ui_smoke.mjs
          git diff --check
          rm .github/workflows/one-shot-fix-world-viewport-look.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/real_world_ui_smoke.mjs .github/workflows/one-shot-fix-world-viewport-look.yml
          git commit -m 'Remove obsolete free-viewport look test'
          git push origin HEAD:fix/final-flight-safety-ux
