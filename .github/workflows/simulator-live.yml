name: Simulator live verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install browser harness
        run: npm install --prefix /tmp/live-deps --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0 && ln -s /tmp/live-deps/node_modules node_modules
      - name: Await exact deployed SHA
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 72); do
            if curl -fsSL --max-time 15 "https://kurzlernen.de/build.json?verify=${GH_SHA}-${attempt}" -o /tmp/live-build.json && jq -e --arg sha "$GH_SHA" '.sha == $sha' /tmp/live-build.json; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Verify renderer, terrain and console
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node tests/simulator_live_regression_smoke.mjs "https://kurzlernen.de/drone_simulator.html?verify=${GH_SHA}"
