name: one-shot-vs-proximity
on:
  push:
    branches: ["fix/vs-real-proximity-discovery"]
    paths:
      - "tools/patch_vs_proximity.py"
      - ".github/workflows/one-shot-vs-proximity.yml"
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply multi-signal discovery patch and test
        run: |
          set -euxo pipefail
          python3 tools/patch_vs_proximity.py
          node --check sim/lan_vs.mjs
          node --check sim/real_world_bootstrap.mjs
          node --check tests/lan_vs_smoke.mjs
          node tests/lan_vs_smoke.mjs
          node tests/architecture_invariants.mjs
      - name: Commit product and permanent regression tests
        run: |
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sim/lan_vs.mjs sim/real_world_bootstrap.mjs tests/lan_vs_smoke.mjs tests/architecture_invariants.mjs
          git commit -m 'Make VS discovery proximity and LAN multi-signal'
          git push
