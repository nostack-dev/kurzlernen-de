name: One-shot authoritative cadence gate

on:
  push:
    branches: [perf/authoritative-cadence-gate]
    paths:
      - ".github/workflows/one-shot-authoritative-cadence.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch read-only authoritative clock diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sim=Path('sim/simulator.mjs')
          s=sim.read_text()
          old='''let lastPresentationHudMs=-Infinity,lastPresentationAudioMs=-Infinity,lastPresentationDrawMs=-Infinity,lastPresentationShadowMs=-Infinity,presentationDraws=0;
          function render(){'''
          new='''let lastPresentationHudMs=-Infinity,lastPresentationAudioMs=-Infinity,lastPresentationDrawMs=-Infinity,lastPresentationShadowMs=-Infinity,presentationDraws=0;
          const simulatorDiagnostics={};
          Object.defineProperties(simulatorDiagnostics,{
            simTime:{get:()=>simTime,enumerable:true},
            simulationBacklogMs:{get:()=>simulationBacklogMs,enumerable:true},
            presentationDraws:{get:()=>presentationDraws,enumerable:true},
          });
          Object.freeze(simulatorDiagnostics);
          Object.defineProperty(globalThis,"__arondightDiagnostics",{value:simulatorDiagnostics,writable:false,configurable:false});
          function render(){'''
          assert s.count(old)==1, s.count(old)
          sim.write_text(s.replace(old,new,1))

          smoke=Path('tests/browser_sim_smoke.mjs')
          t=smoke.read_text()
          old='''  const cadenceStart=await page.evaluate(()=>({wall:performance.now(),sim:parseFloat(document.querySelector("#simTime")?.textContent||"0"),draws:Number(document.querySelector("#viewport")?.dataset.presentationDraws||0)}));
            await wait(2500);
            const cadenceEnd=await page.evaluate(()=>({wall:performance.now(),sim:parseFloat(document.querySelector("#simTime")?.textContent||"0"),draws:Number(document.querySelector("#viewport")?.dataset.presentationDraws||0),backlog:Number(document.querySelector("#viewport")?.dataset.presentationBacklogMs||0)}));
            const cadenceRatio=(cadenceEnd.sim-cadenceStart.sim)/Math.max(.001,(cadenceEnd.wall-cadenceStart.wall)/1000),presentationDraws=cadenceEnd.draws-cadenceStart.draws;
            console.log(`Realtime fixed-step cadence: ${cadenceRatio.toFixed(3)}x · presentation draws ${presentationDraws} · backlog ${cadenceEnd.backlog.toFixed(2)} ms`);
            if(!(cadenceRatio>.90&&cadenceRatio<1.10))throw new Error(`fixed-step simulation is not tracking wall time closely enough: ${cadenceRatio.toFixed(3)}x`);
            if(presentationDraws<35)throw new Error(`flight-first presentation starved visual output: only ${presentationDraws} draws in 2.5s`);'''
          new='''  const cadenceStart=await page.evaluate(()=>{const d=globalThis.__arondightDiagnostics;return{wall:performance.now(),sim:Number(d?.simTime),draws:Number(d?.presentationDraws||0),uiSim:parseFloat(document.querySelector("#simTime")?.textContent||"0")};});
            await wait(2500);
            const cadenceEnd=await page.evaluate(()=>{const d=globalThis.__arondightDiagnostics;return{wall:performance.now(),sim:Number(d?.simTime),draws:Number(d?.presentationDraws||0),backlog:Number(d?.simulationBacklogMs||0),uiSim:parseFloat(document.querySelector("#simTime")?.textContent||"0")};});
            if(!Number.isFinite(cadenceStart.sim)||!Number.isFinite(cadenceEnd.sim))throw new Error("authoritative simulator clock diagnostic unavailable");
            const cadenceRatio=(cadenceEnd.sim-cadenceStart.sim)/Math.max(.001,(cadenceEnd.wall-cadenceStart.wall)/1000),presentationDraws=cadenceEnd.draws-cadenceStart.draws,uiClockLag=Math.abs(cadenceEnd.sim-cadenceEnd.uiSim);
            console.log(`Realtime fixed-step cadence: ${cadenceRatio.toFixed(3)}x · presentation draws ${presentationDraws} · backlog ${cadenceEnd.backlog.toFixed(2)} ms · HUD lag ${uiClockLag.toFixed(3)} s`);
            if(!(cadenceRatio>.90&&cadenceRatio<1.10))throw new Error(`fixed-step simulation is not tracking wall time closely enough: ${cadenceRatio.toFixed(3)}x`);
            if(presentationDraws<35)throw new Error(`flight-first presentation starved visual output: only ${presentationDraws} draws in 2.5s`);
            if(!(uiClockLag<.12))throw new Error(`20 Hz HUD fell too far behind authoritative simulation clock: ${uiClockLag.toFixed(3)} s`);'''
          assert t.count(old)==1, t.count(old)
          smoke.write_text(t.replace(old,new,1))

          inv=Path('tests/architecture_invariants.mjs')
          a=inv.read_text()
          anchor='requireText("sim/simulator.mjs","viewport.dataset.presentationDraws");\n'
          extra=anchor+'requireText("sim/simulator.mjs",\'Object.defineProperty(globalThis,"__arondightDiagnostics"\');\nrequireText("sim/simulator.mjs","simTime:{get:()=>simTime");\n'
          assert a.count(anchor)==1, a.count(anchor)
          inv.write_text(a.replace(anchor,extra,1))
          PY
          rm .github/workflows/one-shot-authoritative-cadence.yml
          node --check sim/simulator.mjs
          node --check tests/browser_sim_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Measure realtime cadence from authoritative sim clock"
          git push origin HEAD:perf/authoritative-cadence-gate
