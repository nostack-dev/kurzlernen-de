name: Restore strict GAME E2E gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-restore-strict-game-e2e.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original physical response threshold
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          test=Path('tests/dual_phone_smoke.mjs')
          s=test.read_text()
          old='if(!(moving.forward>.15&&moving.pitch<-6.0))'
          new='if(!(moving.forward>.30&&moving.pitch<-6.0))'
          assert s.count(old)==1, f'expected exactly one weakened threshold, got {s.count(old)}'
          test.write_text(s.replace(old,new,1))

          inv=Path('tests/architecture_invariants.mjs')
          s=inv.read_text()
          marker='// Historical/self-mutating migration scaffolding must stay absent from production.\n'
          assert s.count(marker)==1
          guard='''// The physical GAME E2E gate is intentionally strict. Do not trade a controller
          // regression for a weaker test threshold.
          requireText("tests/dual_phone_smoke.mjs","moving.forward>.30&&moving.pitch<-6.0",
                      "dual-phone GAME E2E forward-response gate was weakened");

          '''
          inv.write_text(s.replace(marker,guard+marker,1))
          PY
          node --check tests/dual_phone_smoke.mjs
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit strict gate
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add tests/dual_phone_smoke.mjs tests/architecture_invariants.mjs
          git commit -m "Keep GAME physical response gate strict"
          git pull --rebase origin main
          git push origin HEAD:main
