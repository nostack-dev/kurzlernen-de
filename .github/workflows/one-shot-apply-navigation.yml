name: Apply navigation safety patch

on:
  workflow_dispatch:
  push:
    branches: ["fix/world-fpv-eye-altitude"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-eye-altitude
          fetch-depth: 0
      - name: Apply product patch
        run: |
          set -euxo pipefail
          python3 tools/apply_navigation_safety_patch.py
          rm -f .github/workflows/one-shot-axis-balance.yml
          rm -f .github/workflows/one-shot-product-core.yml
          rm -f .github/workflows/one-shot-apply-navigation.yml
          rm -f tools/apply_navigation_safety_patch.py
      - name: Core regression gates
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/drone_fc_core_test
          /tmp/drone_fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/drone_hil_protocol_test
          /tmp/drone_hil_protocol_test
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit clean product tree
        run: |
          set -euxo pipefail
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Keep flight stable through navigation sensor loss'
          git push origin HEAD:fix/world-fpv-eye-altitude
