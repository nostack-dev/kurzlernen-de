name: Apply Xbox beacon routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch Xbox beacon routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Xbox Y beacon and Xbox-mode touch beacon routing
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sim/xbox_gamepad.mjs')
          s=p.read_text()
          old='''    camera:buttonValue(gamepad,XBOX_STANDARD_BUTTON.X)>.5,\n  });'''
          new='''    camera:buttonValue(gamepad,XBOX_STANDARD_BUTTON.X)>.5,\n    target:buttonValue(gamepad,XBOX_STANDARD_BUTTON.Y)>.5,\n  });'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('sim/vs_combat_presentation.mjs')
          s=p.read_text()
          old='''function handleBeaconPointerUp(event){if(viewport()?.dataset.fireTouchGestureArbiter==="1")return;if(!bridge()?.vsConnected)return;'''
          new='''function handleBeaconPointerUp(event){const view=viewport();if(view?.dataset.fireTouchGestureArbiter==="1"&&view.dataset.controlSource!=="xbox")return;if(!bridge()?.vsConnected)return;'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('sim/simulator.mjs')
          s=p.read_text()
          old='''  <div id=\"soloGamepadHelp\" hidden>LS MOVE · RS TURN/PITCH · LT/RT ALT −/+ · LB+RS AIM · LB+RB FIRE · A ARM · B KILL · X CAM</div>`;'''
          new='''  <div id=\"soloGamepadHelp\" hidden>LS MOVE · RS TURN/PITCH · LT/RT ALT −/+ · LB+RS AIM · LB+RB FIRE · Y TARGET · A ARM · B KILL · X CAM</div>`;'''
          assert old in s
          s=s.replace(old,new,1)
          old='''  if(!justActivated&&sample.arm&&!xboxPrevious?.arm)toggleSoloArm();if(!justActivated&&sample.kill&&!xboxPrevious?.kill)killSolo();if(!justActivated&&sample.camera&&!xboxPrevious?.camera)cycleSoloCamera();xboxPrevious={arm:sample.arm,kill:sample.kill,camera:sample.camera};'''
          new='''  if(!justActivated&&sample.arm&&!xboxPrevious?.arm)toggleSoloArm();if(!justActivated&&sample.kill&&!xboxPrevious?.kill)killSolo();if(!justActivated&&sample.camera&&!xboxPrevious?.camera)cycleSoloCamera();if(!justActivated&&sample.target&&!xboxPrevious?.target&&globalThis.__arondightRealWorld?.vsConnected){const rect=viewport.getBoundingClientRect();viewport.dispatchEvent(new CustomEvent("flightfiredoubletap",{detail:{clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2,pointerType:"gamepad"}}));viewport.dataset.gamepadBeaconCount=String((Number(viewport.dataset.gamepadBeaconCount)||0)+1);}xboxPrevious={arm:sample.arm,kill:sample.kill,camera:sample.camera,target:sample.target};'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('tests/xbox_gamepad_test.mjs')
          s=p.read_text()
          marker='''buttons[XBOX_STANDARD_BUTTON.RIGHT_TRIGGER]={pressed:true,value:1};\nsample=sampleXboxGamepad(pad);\nassert.ok(sample.heightAxis>.34,"RT must remain height up even while RB is the fire button");\n'''
          insert='''buttons[XBOX_STANDARD_BUTTON.RIGHT_TRIGGER]={pressed:true,value:1};\nsample=sampleXboxGamepad(pad);\nassert.ok(sample.heightAxis>.34,"RT must remain height up even while RB is the fire button");\n\nbuttons[XBOX_STANDARD_BUTTON.Y]={pressed:true,value:1};\nsample=sampleXboxGamepad(pad);\nassert.equal(sample.target,true,"Y must expose multiplayer target/beacon action");\nbuttons[XBOX_STANDARD_BUTTON.Y]={pressed:false,value:0};\n'''
          assert marker in s
          s=s.replace(marker,insert,1)
          s=s.replace('LB+RB fire contract.','LB+RB fire and Y target contract.',1)
          p.write_text(s)

          p=Path('tests/xbox_gamepad_browser_smoke.mjs')
          s=p.read_text()
          old='''  if(active.source!=="xbox"||active.connected!=="1"||active.left!=="none"||active.right!=="none"||active.height!=="none"||active.arm!=="none"||active.kill!=="none"||active.status||active.help||!active.helpText.includes("LB+RB FIRE"))throw new Error(`Xbox ON did not remove every touch flight control: ${JSON.stringify(active)}`);'''
          new='''  if(active.source!=="xbox"||active.connected!=="1"||active.left!=="none"||active.right!=="none"||active.height!=="none"||active.arm!=="none"||active.kill!=="none"||active.status||active.help||!active.helpText.includes("LB+RB FIRE")||!active.helpText.includes("Y TARGET"))throw new Error(`Xbox ON did not remove every touch flight control or expose target mapping: ${JSON.stringify(active)}`);'''
          assert old in s
          s=s.replace(old,new,1)
          marker='''  // Standard Gamepad indices: LT=6 and RT=7. Triggers alter only the altitude\n'''
          block='''  // Multiplayer target: Xbox Y (standard button 3) sets the same shared beacon\n  // at the screen/crosshair center and must not fire. Touch double-tap remains\n  // available as a beacon gesture even while Xbox owns the flight controls.\n  const xboxBeacon=await page.evaluate(()=>{const bridge=globalThis.__arondightRealWorld,v=document.querySelector("#viewport"),sent=[];bridge.vsConnected=true;bridge.vsSession={setOrigin(){return true;},setPose(){return true;},sendCombat(packet){sent.push(JSON.parse(JSON.stringify(packet)));return true;},stop(){}};bridge.resetVsCombat(true);globalThis.__xboxBeaconSent=sent;return{shots:Number(v.dataset.fireShots||0)};});\n  await setButton(3,1);await page.waitForFunction(()=>Number(document.querySelector("#viewport")?.dataset.gamepadBeaconCount||0)>0,{timeout:3000});await setButton(3,0);await pause(120);\n  const yTarget=await page.evaluate(()=>{const v=document.querySelector("#viewport"),sent=globalThis.__xboxBeaconSent||[];return{shots:Number(v.dataset.fireShots||0),beacon:sent.find(packet=>packet.type==="beacon")||null,source:v.dataset.vsBeaconSource||"",count:Number(v.dataset.gamepadBeaconCount||0)};});\n  if(yTarget.shots!==xboxBeacon.shots||yTarget.beacon?.type!=="beacon"||!Array.isArray(yTarget.beacon?.p)||yTarget.beacon.p.length!==3||yTarget.source!=="you"||yTarget.count<1)throw new Error(`Xbox Y target did not set a zero-shot shared beacon: ${JSON.stringify({xboxBeacon,yTarget})}`);\n  const touchBeaconBefore=await page.evaluate(()=>{const v=document.querySelector("#viewport");return{shots:Number(v.dataset.fireShots||0),sets:Number(v.dataset.vsBeaconSetCount||0)};});\n  await page.evaluate(async()=>{const v=document.querySelector("#viewport"),r=v.getBoundingClientRect(),sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms)),tap=async(x,y,id)=>{v.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",clientX:x,clientY:y,button:0}));await sleep(120);v.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",clientX:x,clientY:y,button:0}));};const x=r.left+r.width*.5,y=r.top+r.height*.78;await tap(x,y,81);await sleep(90);await tap(x+10,y+8,82);});await pause(180);\n  const touchTarget=await page.evaluate(()=>{const v=document.querySelector("#viewport");return{shots:Number(v.dataset.fireShots||0),sets:Number(v.dataset.vsBeaconSetCount||0)};});\n  if(touchTarget.shots!==touchBeaconBefore.shots||touchTarget.sets<=touchBeaconBefore.sets)throw new Error(`Touch double-tap beacon was dead in Xbox mode: ${JSON.stringify({touchBeaconBefore,touchTarget})}`);\n\n  // Standard Gamepad indices: LT=6 and RT=7. Triggers alter only the altitude\n'''
          assert marker in s
          s=s.replace(marker,block,1)
          s=s.replace('LB+RB right-shoulder fire.','LB+RB right-shoulder fire, Y shared target, and touch double-tap target while Xbox is active.',1)
          p.write_text(s)
          PY
          node --check sim/xbox_gamepad.mjs
          node --check sim/vs_combat_presentation.mjs
          node --check sim/simulator.mjs
          node --check tests/xbox_gamepad_test.mjs
          node --check tests/xbox_gamepad_browser_smoke.mjs
          node tests/xbox_gamepad_test.mjs
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          BUILD_DIR=/tmp/arondight45-web-build
          mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1 qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html')
          marker='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>'
          html=p.read_text(); assert marker in html
          bundle=Path('/tmp/arondight45-simulator.bundle.mjs').read_text().replace('</script','<\\/script')
          p.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/static.log 2>&1 &
          HTTP_PID=$!
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/xbox_gamepad_browser_smoke.mjs http://127.0.0.1:4174
          kill "$HTTP_PID" 2>/dev/null || true
          git checkout -- drone_simulator.html generated/flight_core.mjs || true
          git clean -f generated/flight_core.mjs || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/xbox_gamepad.mjs sim/vs_combat_presentation.mjs sim/simulator.mjs tests/xbox_gamepad_test.mjs tests/xbox_gamepad_browser_smoke.mjs
          git commit -m 'Fix Xbox and touch multiplayer beacon routing'
          git push origin HEAD:main
