name: One-shot fine control and FPV camera
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fine-fpv.yml'
      - 'tools/patch_fine_fpv.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch simulator camera and browser regression
        run: |
          set -euxo pipefail
          python3 tools/patch_fine_fpv.py
          git diff --check
          node --check sim/simulator.mjs
          node --check tests/browser_sim_smoke.mjs
          node tests/control_semantics_test.mjs
          git diff -- sim/simulator.mjs tests/browser_sim_smoke.mjs
      - name: Commit product integration
        run: |
          set -euxo pipefail
          git config user.name 'Christian Heinrich Hohlfeld'
          git config user.email 'chris.hohlfeld@gmail.com'
          git add sim/simulator.mjs tests/browser_sim_smoke.mjs
          git commit -m 'Add maximum fine phone control and realistic FPV uptilt'
          git push
