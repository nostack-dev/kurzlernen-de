name: Final flight safety UX transaction

on:
  push:
    branches: ["fix/final-flight-safety-ux"]

permissions:
  contents: read

jobs:
  axis-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
      - name: Build SIL and measure equal-axis transient
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          BUILD_DIR=/tmp/axis-probe
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/sim.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/controller.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          for path,marker,bundle in [('drone_simulator.html','<script type="module" src="./sim/real_world_bootstrap.mjs"></script>','/tmp/sim.bundle.mjs'),('drone_controller.html','<script type="module" src="./sim/controller.mjs"></script>','/tmp/controller.bundle.mjs')]:
              p=Path(path);s=p.read_text();b=Path(bundle).read_text().replace('</script','<\\/script');assert marker in s;p.write_text(s.replace(marker,'<script type="module">\n'+b+'\n</script>'))
          p=Path('tests/dual_phone_smoke.mjs');s=p.read_text()
          old='''  await controller.mouse.move(lcx,lcy);await controller.mouse.down();await controller.mouse.move(lcx,lcy-lr*.72,{steps:5});
            const forwardStart=await simTime(view);await waitSim(view,forwardStart+1.0,45000);const moving=await liveMotion(view,controller);
          '''
          new='''  await controller.mouse.move(lcx,lcy);await controller.mouse.down();await controller.mouse.move(lcx,lcy-lr*.70,{steps:5});
            const forwardStart=await simTime(view);const forwardCommandTrace=await liveTrace(view,controller,forwardStart,[0,.1,.2,.35,.5,.65,.8,1.0],45000);const moving=forwardCommandTrace[forwardCommandTrace.length-1];console.log(`AXIS PROBE forward FC trace: ${JSON.stringify(forwardCommandTrace)}`);const forwardPhysics=traceAtOffsets(await flightSamples(view),forwardStart,[0,.1,.2,.35,.5,.65,.8,1.0]);console.log(`AXIS PROBE forward PHYS trace: ${JSON.stringify(forwardPhysics)}`);
          '''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          assert s.count('lcx+lr*.65,lcy')==1
          s=s.replace('lcx+lr*.65,lcy','lcx+lr*.70,lcy',1)
          old2='''const strafeStart=await simTime(view);const strafeCommandTrace=await liveTrace(view,controller,strafeStart,[0,.1,.2,.35,.5,.65,.8,1.0],45000);const strafing=strafeCommandTrace[strafeCommandTrace.length-1];console.log(`State-control strafe command trace: ${JSON.stringify(strafeCommandTrace)}`);'''
          new2='''const strafeStart=await simTime(view);const strafeCommandTrace=await liveTrace(view,controller,strafeStart,[0,.1,.2,.35,.5,.65,.8,1.0],45000);const strafing=strafeCommandTrace[strafeCommandTrace.length-1];console.log(`AXIS PROBE strafe FC trace: ${JSON.stringify(strafeCommandTrace)}`);const strafePhysics=traceAtOffsets(await flightSamples(view),strafeStart,[0,.1,.2,.35,.5,.65,.8,1.0]);console.log(`AXIS PROBE strafe PHYS trace: ${JSON.stringify(strafePhysics)}`);'''
          assert s.count(old2)==1
          p.write_text(s.replace(old2,new2,1))
          PY
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/axis-http.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true; rm -f node_modules' EXIT; sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/dual_phone_smoke.mjs http://127.0.0.1:4174
