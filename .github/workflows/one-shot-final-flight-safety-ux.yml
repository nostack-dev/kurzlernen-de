name: Final flight safety UX transaction

on:
  push:
    branches: ["fix/final-flight-safety-ux"]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message != 'Apply NAV1 component validity and sensor continuity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
          fetch-depth: 0
      - name: Patch NAV1 hardware contract and simulator sensor source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p=Path(path); s=p.read_text(); n=s.count(old)
              assert n==1, f'{label}: expected 1, got {n}'
              p.write_text(s.replace(old,new,1))

          patch('esp32/Arondight45_HardwareSensors.hpp',
          '''constexpr uint16_t kNavigationValid = 1u << 0;
          constexpr uint32_t kNavigationTimeoutUs = 60000;
          ''',
          '''constexpr uint16_t kNavigationValid = 1u << 0;
          constexpr uint16_t kNavigationVelocityValid = 1u << 1;
          constexpr uint16_t kNavigationAglValid = 1u << 2;
          // New producers set this marker and publish velocity/AGL validity independently.
          // Legacy NAV1 modules omit it; their bit 0 remains "all navigation valid".
          constexpr uint16_t kNavigationSplitValidity = 1u << 15;
          constexpr uint32_t kNavigationTimeoutUs = 60000;
          ''','NAV1 constants')

          patch('esp32/Arondight45_HardwareSensors.hpp',
          '''    out.agl_m = frame.agl_mm * 0.001f;
              out.valid = (frame.flags & kNavigationValid) != 0;
              return !out.valid || fc::finite(out);
          }
          ''',
          '''    out.agl_m = frame.agl_mm * 0.001f;
              const bool split = (frame.flags & kNavigationSplitValidity) != 0;
              const bool legacy_valid = (frame.flags & kNavigationValid) != 0;
              out.velocity_valid = split ? (frame.flags & kNavigationVelocityValid) != 0 : legacy_valid;
              out.agl_valid = split ? (frame.flags & kNavigationAglValid) != 0 : legacy_valid;
              out.valid = out.velocity_valid && out.agl_valid;
              return (!out.velocity_valid || fc::finite(out.velocity_world_mps)) &&
                     (!out.agl_valid || (std::isfinite(out.agl_m) && out.agl_m >= 0.0f && out.agl_m < 1000.0f));
          }
          ''','NAV1 decode')

          patch('esp32/Arondight45_HardwareSensors.hpp',
          '''inline NavigationWireFrame encode_navigation_wire(uint16_t sequence,
                                                            float vx_mps, float vy_mps, float vz_mps,
                                                            float agl_m, bool valid) {
          ''',
          '''inline NavigationWireFrame encode_navigation_wire(uint16_t sequence,
                                                            float vx_mps, float vy_mps, float vz_mps,
                                                            float agl_m, bool velocity_valid, bool agl_valid) {
          ''','NAV1 encoder signature')

          patch('esp32/Arondight45_HardwareSensors.hpp',
          '''    frame.flags = valid ? kNavigationValid : 0u;
          ''',
          '''    frame.flags = kNavigationSplitValidity |
                            (velocity_valid ? kNavigationVelocityValid : 0u) |
                            (agl_valid ? kNavigationAglValid : 0u) |
                            ((velocity_valid && agl_valid) ? kNavigationValid : 0u);
          ''','NAV1 encoder flags')

          patch('esp32/Arondight45_HardwareSensors.hpp',
          '''    return frame;
          }

          class NavigationWireParser {
          ''',
          '''    return frame;
          }

          inline NavigationWireFrame encode_navigation_wire(uint16_t sequence,
                                                            float vx_mps, float vy_mps, float vz_mps,
                                                            float agl_m, bool valid) {
              return encode_navigation_wire(sequence, vx_mps, vy_mps, vz_mps, agl_m, valid, valid);
          }

          class NavigationWireParser {
          ''','NAV1 legacy encoder overload')

          patch('esp32/Arondight45_FirmwareRuntime.hpp',
          '''            navigation.valid = false;
          ''',
          '''            navigation.valid = false;
                      navigation.velocity_valid = false;
                      navigation.agl_valid = false;
          ''','NAV freshness components')

          patch('sim/p2p_link.mjs',
          '''    if(!this.pc||["failed","disconnected","closed"].includes(this.pc.connectionState)){
          ''',
          '''    // "disconnected" is transient in WebRTC. Freshness is independently enforced by
              // CONTROL_STALE_MS, so only terminal peer states erase the last control sample here.
              if(!this.pc||["failed","closed"].includes(this.pc.connectionState)){
          ''','transient WebRTC state')

          patch('sim/simulator.mjs',
          '''const STATE_NAVIGATION_VALID = 1 << 5;
          const STATE_GAME_MODE = 1 << 6;
          const TERRAIN_SIZE = 600;
          const TERRAIN_HALF = TERRAIN_SIZE / 2;
          ''',
          '''const STATE_NAVIGATION_VALID = 1 << 5;
          const STATE_GAME_MODE = 1 << 6;
          const STATE_NAVIGATION_DEGRADED = 1 << 7;
          const TERRAIN_SIZE = 600;
          const TERRAIN_HALF = TERRAIN_SIZE / 2;
          // TERRAIN_SIZE is only the visible training-grid size. Sensor/collision truth must not
          // end at the drawing edge and fabricate NAV loss during long WORLD flights.
          const PHYSICS_GROUND_HALF = 10000;
          ''','sim state constants')

          patch('sim/simulator.mjs',
          '''b3.b3CreateBoxShape(ground,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);''',
          '''b3.b3CreateBoxShape(ground,groundShape,PHYSICS_GROUND_HALF,PHYSICS_GROUND_HALF,.05);''','physics ground extent')

          patch('sim/simulator.mjs',
          '''  view.setUint16(14,clamp(Math.round(Math.max(0,measurement.agl)*1000),0,65535),true);view.setUint16(16,measurement.valid?1:0,true);
          ''',
          '''  const velocityValid=measurement.velocityValid??measurement.valid,aglValid=measurement.aglValid??measurement.valid;
            const navFlags=(1<<15)|(velocityValid?(1<<1):0)|(aglValid?(1<<2):0)|((velocityValid&&aglValid)?1:0);
            view.setUint16(14,clamp(Math.round(Math.max(0,measurement.agl)*1000),0,65535),true);view.setUint16(16,navFlags,true);
          ''','sim NAV1 flags')

          patch('sim/simulator.mjs',
          '''  reset(){this.noise=new Noise(0x7193ab21);this.elapsed=.01;this.filtered=[0,0,0];this.sequence=1;this.last={vx:0,vy:0,vz:0,agl:0,valid:false};}
          ''',
          '''  reset(){this.noise=new Noise(0x7193ab21);this.elapsed=.01;this.filtered=[0,0,0];this.sequence=1;this.last={vx:0,vy:0,vz:0,agl:0,valid:false,velocityValid:false,aglValid:false};}
          ''','sim NAV reset')

          patch('sim/simulator.mjs',
          '''    const range=model.groundRange(NAV_AGL_RAY_MAX_M);let valid=range.valid,agl=0;
              if(valid){const measuredSlant=Math.max(0,range.slant+this.noise.gaussian()*.004);agl=measuredSlant*range.verticalProjection;}
              this.last={vx:this.filtered[0],vy:this.filtered[1],vz:this.filtered[2],agl,valid};
          ''',
          '''    const range=model.groundRange(NAV_AGL_RAY_MAX_M),velocityValid=this.filtered.every(Number.isFinite);let aglValid=range.valid,agl=0;
              if(aglValid){const measuredSlant=Math.max(0,range.slant+this.noise.gaussian()*.004);agl=measuredSlant*range.verticalProjection;if(!Number.isFinite(agl)||agl>65.4)aglValid=false;}
              this.last={vx:this.filtered[0],vy:this.filtered[1],vz:this.filtered[2],agl:aglValid?agl:0,valid:velocityValid&&aglValid,velocityValid,aglValid};
          ''','sim component validity')

          patch('sim/simulator.mjs',
          '''let latestNavigation={vx:0,vy:0,vz:0,agl:0,valid:false};''',
          '''let latestNavigation={vx:0,vy:0,vz:0,agl:0,valid:false,velocityValid:false,aglValid:false};''','latest nav state')

          # Hardware-wire contract tests: legacy frame compatibility + component validity.
          p=Path('tests/drone_hil_protocol_test.cpp'); s=p.read_text()
          marker='''    const auto high_wire = hwcontract::encode_navigation_wire(78, 0, 0, 0, 50.0f, true);
              CHECK(hwcontract::decode_navigation_wire(high_wire, nav));
              CHECK(nav.valid);
              CHECK(std::fabs(nav.agl_m - 50.0f) < 0.002f);
          '''
          assert s.count(marker)==1, 'wire test marker'
          addition=marker+'''    const auto agl_lost_wire = hwcontract::encode_navigation_wire(79, 1.0f, -0.5f, 0.1f, 0.0f, true, false);
              CHECK(hwcontract::decode_navigation_wire(agl_lost_wire, nav));
              CHECK(!nav.valid);
              CHECK(nav.velocity_valid);
              CHECK(!nav.agl_valid);
              CHECK(std::fabs(nav.velocity_world_mps.x - 1.0f) < 0.011f);
              auto legacy_wire = wire;
              legacy_wire.flags = hwcontract::kNavigationValid;
              legacy_wire.crc16 = hwcontract::crc16_ccitt(&legacy_wire, offsetof(hwcontract::NavigationWireFrame, crc16));
              CHECK(hwcontract::decode_navigation_wire(legacy_wire, nav));
              CHECK(nav.valid && nav.velocity_valid && nav.agl_valid);
          '''
          s=s.replace(marker,addition,1)
          p.write_text(s)
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/drone_hil_protocol_test
          /tmp/drone_hil_protocol_test
          node --check sim/simulator.mjs
          node --check sim/p2p_link.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esp32/Arondight45_HardwareSensors.hpp esp32/Arondight45_FirmwareRuntime.hpp sim/simulator.mjs sim/p2p_link.mjs tests/drone_hil_protocol_test.cpp
          git commit -m 'Apply NAV1 component validity and sensor continuity'
          git push origin HEAD:fix/final-flight-safety-ux
