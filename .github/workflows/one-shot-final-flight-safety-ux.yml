name: Final flight safety UX transaction

on:
  push:
    branches: ["fix/final-flight-safety-ux"]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message != 'Wire final flight observer and presentation UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
          fetch-depth: 0
      - name: Wire logbook fire feedback degraded HUD and P2P safety
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(path,old,new,label):
              p=Path(path);s=p.read_text();n=s.count(old);assert n==1,f'{label}: {n}';p.write_text(s.replace(old,new,1))

          one('sim/simulator.mjs',
          '''import {HybridMotorSound} from "./motor_sound.mjs";
          ''',
          '''import {HybridMotorSound} from "./motor_sound.mjs";
          import {FlightLogbook} from "./flight_logbook.mjs";
          import {installPresentationFire} from "./presentation_fire.mjs";
          ''','sim imports')

          one('sim/simulator.mjs',
          '''mountCameraSettings({dialog:soloSettingsMount.dialog,onChange:applyCameraSettings});
          async function enterSolo(){
          ''',
          '''mountCameraSettings({dialog:soloSettingsMount.dialog,onChange:applyCameraSettings});
          const flightLogbook=new FlightLogbook({parent:$("soloTopbar")});
          const presentationRaycaster=new THREE.Raycaster(),presentationPointer=new THREE.Vector2();
          function trainingPresentationHit({x,y}){
            const viewport=$("viewport"),rect=viewport.getBoundingClientRect();if(!(rect.width>0&&rect.height>0))return false;
            presentationPointer.set(x/rect.width*2-1,-(y/rect.height*2-1));presentationRaycaster.setFromCamera(presentationPointer,camera);
            const hit=presentationRaycaster.intersectObject(groundMesh,false)[0];if(!hit)return false;
            const material=new THREE.MeshBasicMaterial({color:0x65ffa8,transparent:true,opacity:.82,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}),decal=new THREE.Mesh(new THREE.RingGeometry(.035,.065,14),material);decal.position.copy(hit.point);decal.position.z+=.004;decal.renderOrder=30;scene.add(decal);const started=performance.now();
            const fade=now=>{const t=(now-started)/900;if(t>=1){scene.remove(decal);decal.geometry.dispose();material.dispose();return;}material.opacity=.82*(1-t);decal.scale.setScalar(1+t*.9);requestAnimationFrame(fade);};requestAnimationFrame(fade);return true;
          }
          const presentationFire=installPresentationFire({viewport:$("viewport"),onShot:shot=>{if(globalThis.__arondightRealWorld?.active)globalThis.__arondightRealWorld.presentationHit?.(shot);else trainingPresentationHit(shot);}});
          Object.defineProperty(globalThis,"__arondightPresentationFire",{value:presentationFire,writable:false,configurable:false});
          async function enterSolo(){
          ''','wire observer/presentation')

          one('sim/simulator.mjs',
          '''function resetSimulation(initial=null){
            phoneSettings=loadPhoneControlSettings();soloGroundClearance=phoneSettings.defaultHoverAgl;setSoloHeightAxis(0);
            physics.reset(defaultParams(),initial);navigationSensors.reset();sbusReceiver.reset();latestNavigation={vx:0,vy:0,vz:0,agl:0,valid:false};raceTrack.reset();sequence=1;simTime=0;resetFlag=true;latest={motors:[1000,1000,1000,1000],attitude:[0,0,0],state:0,processingUs:0};soloControls=neutralSoloControls();updateSoloSticks();localThrottle=throttle=0;localArm=arm=false;effectiveInput=neutralControls();replayIndex=0;sessionLog=[];
          ''',
          '''function resetSimulation(initial=null){
            if(flightLogbook.active)flightLogbook.finish("SIM_RESET");
            phoneSettings=loadPhoneControlSettings();soloGroundClearance=phoneSettings.defaultHoverAgl;setSoloHeightAxis(0);
            physics.reset(defaultParams(),initial);navigationSensors.reset();sbusReceiver.reset();latestNavigation={vx:0,vy:0,vz:0,agl:0,valid:false,velocityValid:false,aglValid:false};raceTrack.reset();sequence=1;simTime=0;resetFlag=true;latest={motors:[1000,1000,1000,1000],attitude:[0,0,0],state:0,processingUs:0};soloControls=neutralSoloControls();updateSoloSticks();localThrottle=throttle=0;localArm=arm=false;effectiveInput=neutralControls();replayIndex=0;sessionLog=[];flightLogAuxTicks=0;
          ''','reset logbook/nav')

          one('sim/simulator.mjs',
          '''function recordSession(){
            const state=physics.state();
            sessionLog.push({time_s:simTime,motor1_us:latest.motors[0],motor2_us:latest.motors[1],motor3_us:latest.motors[2],motor4_us:latest.motors[3],x:state.x,y:state.y,z:state.z,vx:state.vx,vy:state.vy,vz:state.vz,roll_deg:state.attitude[0],pitch_deg:state.attitude[1],yaw_deg:state.attitude[2],fc_roll_deg:latest.attitude[0],fc_pitch_deg:latest.attitude[1],fc_yaw_deg:latest.attitude[2],battery_v:state.battery_v,current_a:state.current_a,fc_state:latest.state});
          }
          let simulationBacklogMs=0;
          ''',
          '''function recordSession(){
            const state=physics.state();
            sessionLog.push({time_s:simTime,motor1_us:latest.motors[0],motor2_us:latest.motors[1],motor3_us:latest.motors[2],motor4_us:latest.motors[3],x:state.x,y:state.y,z:state.z,vx:state.vx,vy:state.vy,vz:state.vz,roll_deg:state.attitude[0],pitch_deg:state.attitude[1],yaw_deg:state.attitude[2],fc_roll_deg:latest.attitude[0],fc_pitch_deg:latest.attitude[1],fc_yaw_deg:latest.attitude[2],battery_v:state.battery_v,current_a:state.current_a,fc_state:latest.state});
          }
          function flightLogSample(){
            const state=physics.state(),fcState=latest.state,fault=fcState>>8&255,remoteMissing=inputSource==="remote"&&!remoteLink.current();let disarmReason="FC_DISARM";if(fault)disarmReason=`FAULT_${fault}`;else if(!arm)disarmReason="ARM_OFF";else if(remoteMissing)disarmReason="CONTROL_LOSS";
            const bridge=globalThis.__arondightRealWorld;return{simTime,x:state.x,y:state.y,z:state.z,vx:state.vx,vy:state.vy,vz:state.vz,speed:state.speed,yawDeg:state.attitude[2],agl:latestNavigation.agl,aglValid:latestNavigation.aglValid!==false,batteryV:state.battery_v,armed:Boolean(fcState&STATE_ARMED),navDegraded:Boolean(fcState&STATE_NAVIGATION_DEGRADED),worldMode:bridge?.active?"real":"training",worldOrigin:bridge?.active&&Number.isFinite(bridge.originLat)&&Number.isFinite(bridge.originLon)?{lat:bridge.originLat,lon:bridge.originLon}:null,disarmReason};
          }
          let flightLogAuxTicks=0,simulationBacklogMs=0;
          ''','logbook sampling')

          one('sim/simulator.mjs',
          '''if(auxAccumulatorS+1e-12>=SIM_AUX_INTERVAL_S){auxAccumulatorS-=SIM_AUX_INTERVAL_S;raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();}
          ''',
          '''if(auxAccumulatorS+1e-12>=SIM_AUX_INTERVAL_S){auxAccumulatorS-=SIM_AUX_INTERVAL_S;raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();if(++flightLogAuxTicks>=10){flightLogAuxTicks=0;flightLogbook.observe(flightLogSample());}}
          ''','observe logbook')

          one('sim/simulator.mjs',
          '''remoteLink.sendTelemetry({fc_state:stateText,mode,sim_time:simTime,altitude:Math.max(0,state.z),agl_m:latestNavigation.agl,nav_vx_mps:latestNavigation.vx,nav_vy_mps:latestNavigation.vy,nav_vz_mps:latestNavigation.vz,roll_deg:latest.attitude[0],pitch_deg:latest.attitude[1],yaw_deg:latest.attitude[2],speed:state.speed,battery_v:physics.batteryVoltage,current_a:physics.batteryCurrent,motors:latest.motors,rpm:physics.motorOmega.map(w=>w*60/(2*Math.PI)),armed:Boolean(fcState&STATE_ARMED),fault,game_mode:Boolean(fcState&STATE_GAME_MODE),navigation_valid:Boolean(fcState&STATE_NAVIGATION_VALID),target_ground_clearance:effectiveInput?.gameMode?clamp(Number(effectiveInput.groundClearance)||2,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M):null,body_pitch_input:effectiveInput?.gameMode?clamp(Number(effectiveInput.bodyPitch)||0,-1,1):0});''',
          '''remoteLink.sendTelemetry({fc_state:stateText,mode,sim_time:simTime,altitude:Math.max(0,state.z),agl_m:latestNavigation.agl,nav_vx_mps:latestNavigation.vx,nav_vy_mps:latestNavigation.vy,nav_vz_mps:latestNavigation.vz,roll_deg:latest.attitude[0],pitch_deg:latest.attitude[1],yaw_deg:latest.attitude[2],speed:state.speed,battery_v:physics.batteryVoltage,current_a:physics.batteryCurrent,motors:latest.motors,rpm:physics.motorOmega.map(w=>w*60/(2*Math.PI)),armed:Boolean(fcState&STATE_ARMED),fault,game_mode:Boolean(fcState&STATE_GAME_MODE),navigation_valid:Boolean(fcState&STATE_NAVIGATION_VALID),navigation_degraded:Boolean(fcState&STATE_NAVIGATION_DEGRADED),navigation_velocity_valid:latestNavigation.velocityValid!==false,navigation_agl_valid:latestNavigation.aglValid!==false,target_ground_clearance:effectiveInput?.gameMode?clamp(Number(effectiveInput.groundClearance)||2,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M):null,body_pitch_input:effectiveInput?.gameMode?clamp(Number(effectiveInput.bodyPitch)||0,-1,1):0});''','remote degraded telemetry')

          old='''$("soloState").textContent=stateText;$("soloAlt").textContent=`AGL ${latestNavigation.valid?latestNavigation.agl.toFixed(1):"—"} m`;soloRangeStatus.textContent=latestNavigation.valid?`AGL ${latestNavigation.agl.toFixed(1)} m`:"NAV INVALID";soloRangeStatus.style.color=latestNavigation.valid?"#64e0ae":"#ffd06d";'''
          new='''$("soloState").textContent=stateText;const navDegraded=Boolean(fcState&STATE_NAVIGATION_DEGRADED),aglOk=latestNavigation.aglValid!==false;$("soloAlt").textContent=`AGL ${aglOk?latestNavigation.agl.toFixed(1):"—"} m`;soloRangeStatus.textContent=aglOk?`AGL ${latestNavigation.agl.toFixed(1)} m`:navDegraded?"NAV DEGRADED · AGL LOST":"NAV INVALID";soloRangeStatus.style.color=aglOk?"#64e0ae":"#ffd06d";'''
          one('sim/simulator.mjs',old,new,'solo degraded HUD')

          # Controller: telemetry can remain useful with AGL degraded; transient link states must not synthesize ARM-low.
          one('sim/controller.mjs',
          '''function measuredGameState(){
            const vx=Number(lastTelemetry.nav_vx_mps),vy=Number(lastTelemetry.nav_vy_mps),vz=Number(lastTelemetry.nav_vz_mps),yaw=Number(lastTelemetry.yaw_deg),agl=Number(lastTelemetry.agl_m);
            if(lastTelemetry.navigation_valid!==true||![vx,vy,vz,yaw,agl].every(Number.isFinite))return{valid:false};
            const radians=yaw*Math.PI/180,c=Math.cos(radians),s=Math.sin(radians);
            return{valid:true,forward:-c*vx-s*vy,right:-s*vx+c*vy,vertical:vz,agl,yaw};
          }
          ''',
          '''function measuredGameState(){
            const vx=Number(lastTelemetry.nav_vx_mps),vy=Number(lastTelemetry.nav_vy_mps),vz=Number(lastTelemetry.nav_vz_mps),yaw=Number(lastTelemetry.yaw_deg),agl=Number(lastTelemetry.agl_m),velocityValid=lastTelemetry.navigation_velocity_valid??lastTelemetry.navigation_valid,aglValid=lastTelemetry.navigation_agl_valid??lastTelemetry.navigation_valid;
            if(velocityValid!==true||![vx,vy,vz,yaw].every(Number.isFinite))return{valid:false,aglValid:false};
            const radians=yaw*Math.PI/180,c=Math.cos(radians),s=Math.sin(radians);
            return{valid:true,aglValid:aglValid===true&&Number.isFinite(agl),forward:-c*vx-s*vy,right:-s*vx+c*vy,vertical:vz,agl,yaw};
          }
          ''','controller split nav')
          one('sim/controller.mjs',
          '''  ui.gameSensorStatus.textContent=`AGL ${nav.agl.toFixed(1)} m`;
            ui.gameSensorStatus.style.color="#64e0ae";
          ''',
          '''  ui.gameSensorStatus.textContent=nav.aglValid?`AGL ${nav.agl.toFixed(1)} m`:"NAV DEGRADED · AGL LOST";
            ui.gameSensorStatus.style.color=nav.aglValid?"#64e0ae":"#ffd06d";
          ''','controller degraded label')
          one('sim/controller.mjs',
          '''  ui.gameClearance.dataset.aglM=String(nav.agl);
          ''',
          '''  if(nav.aglValid)ui.gameClearance.dataset.aglM=String(nav.agl);else delete ui.gameClearance.dataset.aglM;
          ''','controller AGL dataset')
          one('sim/controller.mjs',
          '''peer.onState=()=>{updateConnection();if(!peer.linked)safetyNeutral(false);};
          ''',
          '''// A transient WebRTC state change must not synthesize ARM-low. The VIEW-side
          // 350ms control freshness contract remains the authoritative real link-loss failsafe.
          peer.onState=()=>{updateConnection();};
          ''','controller transient P2P')

          one('sim/control_settings.mjs','''    <h3>PHONE CONTROLS</h3>''','''    <h3>FLIGHT CONTROLS</h3>''','settings heading')

          # WORLD presentation-only map-anchored fading acknowledgement.
          p=Path('sim/real_world_bootstrap.mjs');s=p.read_text()
          s=s.replace('''import {Map as MapLibreMap} from "maplibre-gl";''','''import {Map as MapLibreMap,Marker} from "maplibre-gl";''',1)
          anchor='''  status(text,kind=""){const el=$("realWorldStatus");if(!el)return;el.textContent=text;el.className=`statusline ${kind}`;}
          '''
          assert s.count(anchor)==1,'WORLD status anchor'
          method='''  presentationHit({x,y}={}){
              if(!this.active||!this.map||!this.geoContainer)return false;const rect=$("viewport")?.getBoundingClientRect();if(!rect)return false;const point=[clamp(Number(x)||0,0,rect.width),clamp(Number(y)||0,0,rect.height)];let lngLat;try{lngLat=this.map.unproject(point);}catch{return false;}
              const element=document.createElement("div");element.className="world-presentation-hit";Object.assign(element.style,{width:"9px",height:"9px",borderRadius:"50%",border:"1px solid #d9ffe8",background:"#62ffa6",boxShadow:"0 0 9px #44ff99",opacity:".9",transition:"opacity .8s ease,transform .8s ease",pointerEvents:"none"});const marker=new Marker({element,anchor:"center"}).setLngLat(lngLat).addTo(this.map);requestAnimationFrame(()=>{element.style.opacity="0";element.style.transform="scale(2.1)";});setTimeout(()=>marker.remove(),850);const viewport=$("viewport");if(viewport)viewport.dataset.worldPresentationHits=String((Number(viewport.dataset.worldPresentationHits)||0)+1);return true;
            }
          '''
          s=s.replace(anchor,method+anchor,1);p.write_text(s)
          PY
          node --check sim/simulator.mjs
          node --check sim/controller.mjs
          node --check sim/control_settings.mjs
          node --check sim/real_world_bootstrap.mjs
          node --check sim/flight_logbook.mjs
          node --check sim/presentation_fire.mjs
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/drone_hil_protocol_test
          /tmp/drone_hil_protocol_test
          grep -q 'NAV DEGRADED · AGL LOST' sim/simulator.mjs
          grep -q 'presentationHit' sim/real_world_bootstrap.mjs
          grep -q 'FlightLogbook' sim/simulator.mjs
          grep -q 'installPresentationFire' sim/simulator.mjs
          ! grep -q 'if(!peer.linked)safetyNeutral' sim/controller.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/simulator.mjs sim/controller.mjs sim/control_settings.mjs sim/real_world_bootstrap.mjs
          git commit -m 'Wire final flight observer and presentation UX'
          git push origin HEAD:fix/final-flight-safety-ux
