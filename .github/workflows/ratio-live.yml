name: Ratio feed 45 of 45

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/ratio_feed*.py"
      - "ratio.html"
      - ".github/workflows/ratio-live.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build complete source-backed feed
        run: |
          set -euxo pipefail
          python3 scripts/ratio_feed_all.py --output /tmp/ratio-data.json --min-complete 45

      - name: Validate 45 of 45 contract
        run: |
          python3 - <<'PY'
          import json, math
          p=json.load(open('/tmp/ratio-data.json', encoding='utf-8'))
          assert p['schemaVersion'] == 3
          assert p['trackedCount'] == 45
          assert p['completeCount'] == 45, p.get('excluded')
          assert p['excludedCount'] == 0, p.get('excluded')
          assert p['errors'] == [], p['errors']
          assert len(p['stocks']) == 45
          required=('capexCurrentBn','capex2YBn','growthPct','demandBn','coverage','peg','price','score')
          by_ticker={s['ticker']:s for s in p['stocks']}
          for s in p['stocks']:
              for k in required:
                  assert isinstance(s.get(k),(int,float)) and math.isfinite(s[k]), (s['ticker'],k,s.get(k))
              assert s['sources']['capex']['url'].startswith('https://data.sec.gov/')
              assert 'sec.gov/' in s['sources']['demand']['url']
              assert s['sources']['price']['url']
              assert s['sources']['peg']['url']
          nvda=by_ticker['NVDA']
          assert 400 <= nvda['growthPct'] <= 550, nvda
          assert 0.2 <= nvda['coverage'] <= 1.0, nvda
          for ticker in ('ADI','DLR','TXN','CEG','HPE','SMCI','SMR'):
              assert ticker in by_ticker
          assert 0 < by_ticker['CEG']['peg'] < 5, by_ticker['CEG']
          assert 0 < by_ticker['HPE']['peg'] < 5, by_ticker['HPE']
          assert 0 < by_ticker['SMCI']['peg'] < 5, by_ticker['SMCI']
          assert math.isfinite(by_ticker['SMR']['peg']) and not by_ticker['SMR']['pegMeaningful'], by_ticker['SMR']
          print('VALIDATED 45/45')
          print('NVDA', nvda['growthPct'], nvda['coverage'], nvda['peg'])
          for ticker in ('CEG','HPE','SMCI','SMR'):
              s=by_ticker[ticker]
              print(ticker, s['peg'], s['pegMeaningful'], s['sources']['peg']['provider'])
          PY

      - name: Publish immutable-valid feed branch
        run: |
          set -euxo pipefail
          git config user.name "ratio-data-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/ratio-data-branch
          if git ls-remote --exit-code --heads origin ratio-data >/dev/null 2>&1; then
            git fetch origin ratio-data
            git worktree add /tmp/ratio-data-branch origin/ratio-data
            cd /tmp/ratio-data-branch
            git switch -C ratio-data
          else
            git worktree add --detach /tmp/ratio-data-branch
            cd /tmp/ratio-data-branch
            git switch --orphan ratio-data
            git rm -rf . || true
          fi
          cp /tmp/ratio-data.json ratio-data.json
          cat > README.md <<'EOF'
          # Ratio data feed
          Generated from real SEC filings and named market sources for https://kurzlernen.de/ratio.html.
          The branch is updated only after the complete 45/45 validation contract passes.
          No synthetic/random values and no incomplete publication.
          EOF
          git add ratio-data.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh verified 45-of-45 ratio data"
          git push origin HEAD:ratio-data
