name: Remove aim magnifier and default imagery off once

on:
  push:
    paths:
      - '.github/workflows/remove-aim-magnifier-and-default-imagery-off-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply clean runtime changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'marker missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          # Real default: OFF only when there is no stored user choice.
          replace_once('sim/real_world_bootstrap.mjs',
              'this.imageryEnabled=loadBool(WORLD_IMAGERY_STORAGE,true)',
              'this.imageryEnabled=loadBool(WORLD_IMAGERY_STORAGE,false)')

          # Remove the old one-shot migration that could overwrite a stored preference.
          p=Path('sim/world_liveliness.mjs'); s=p.read_text()
          s=re.sub(r'^const IMAGERY_DEFAULT_OFF_MIGRATION=.*\n','',s,count=1,flags=re.M)
          s=s.replace(',forcedDefaultOff=false','')
          start=s.find('function forceSatelliteDefaultOff(){')
          call=s.find('forceSatelliteDefaultOff();',start)
          if start<0 or call<0:
              raise SystemExit('legacy imagery migration function markers missing')
          end=call+len('forceSatelliteDefaultOff();')
          if end<len(s) and s[end]=='\n': end+=1
          s=s[:start]+s[end:]
          if 'IMAGERY_DEFAULT_OFF_MIGRATION' in s or 'forceSatelliteDefaultOff' in s or 'forcedDefaultOff' in s:
              raise SystemExit('legacy imagery default migration still present')
          p.write_text(s)

          # Remove magnifier runtime import.
          replace_once('sim/foot_look_capture.mjs','import "./aim_magnifier_overlay.mjs";\n','')

          # Remove magnifier from the persistent first-person settings model.
          p=Path('sim/first_person_control_settings.mjs'); s=p.read_text()
          s=s.replace('  aimMagnifierEnabled:true,\n','')
          s=s.replace('    aimMagnifierEnabled:settings.aimMagnifierEnabled===undefined?DEFAULT_FIRST_PERSON_CONTROL_SETTINGS.aimMagnifierEnabled:Boolean(settings.aimMagnifierEnabled),\n','')
          if 'aimMagnifierEnabled' in s:
              raise SystemExit('magnifier still present in first-person settings model')
          p.write_text(s)

          # Remove magnifier UI setting and persistence wire.
          p=Path('sim/player_settings_sections.mjs'); s=p.read_text()
          s=s.replace('+toggleRow("AIM MAGNIFIER","aimMagnifierEnabled")','')
          s=re.sub(r'\n  const magnifier=fps\.querySelector\([^\n]+\);magnifier\?\.addEventListener\([^\n]+\);','',s,count=1)
          if 'aimMagnifierEnabled' in s or 'AIM MAGNIFIER' in s:
              raise SystemExit('magnifier still present in settings UI')
          p.write_text(s)

          # Update the combat contract: magnifier must stay removed, free-touch aim remains authoritative.
          p=Path('tests/combat_center_fire_test.mjs'); s=p.read_text()
          s=s.replace(',aimMagnifier=readFileSync("sim/aim_magnifier_overlay.mjs","utf8")','')
          s=s.replace('assert.ok(lookCapture.includes(\'import "./aim_magnifier_overlay.mjs";\'),"custom aim magnifier is not loaded by the FPS touch runtime");','assert.ok(!lookCapture.includes("aim_magnifier_overlay"),"removed aim magnifier was re-imported by FPS touch runtime");')
          start=s.find("for(const marker of ['custom-reticle-above-preview-v2'")
          end_marker='assert.ok(settingsSections.includes(\'saveFirstPersonControlSettings({...loadFirstPersonControlSettings(),aimMagnifierEnabled:magnifier.checked})\'),"aim magnifier setting is not persisted through the first-person settings model");\n'
          if start<0 or end_marker not in s[start:]:
              raise SystemExit('magnifier combat-test block markers missing')
          end=s.index(end_marker,start)+len(end_marker)
          replacement='assert.ok(!fpsSettings.includes("aimMagnifierEnabled"),"removed aim magnifier setting returned to FPS settings");assert.ok(!settingsSections.includes("AIM MAGNIFIER"),"removed aim magnifier toggle returned to settings UI");\n'
          s=s[:start]+replacement+s[end:]
          s=s.replace('console.log("Combat fire contract passed: free touch aim keeps the camera fixed, hip-grip aiming stays continuous, and the 100px clear magnifier tracks directly above the moving reticle with a persistent FPS on/off toggle and no native iOS loupe.");','console.log("Combat fire contract passed: free touch aim keeps the camera fixed, hip-grip aiming stays continuous, and the broken aim magnifier remains fully removed.");')
          if 'aimMagnifier=' in s or 'custom-reticle-above-preview' in s or 'MAGNIFIER_SIZE_CSS' in s:
              raise SystemExit('legacy magnifier assertions remain in combat test')
          p.write_text(s)
          PY

          git rm sim/aim_magnifier_overlay.mjs
          git rm .github/workflows/remove-aim-magnifier-and-default-imagery-off-once.yml

          node --check sim/real_world_bootstrap.mjs
          node --check sim/world_liveliness.mjs
          node --check sim/foot_look_capture.mjs
          node --check sim/first_person_control_settings.mjs
          node --check sim/player_settings_sections.mjs
          node --check tests/combat_center_fire_test.mjs

          ! grep -R -E 'aim_magnifier_overlay|aimMagnifierEnabled|AIM MAGNIFIER|footAimMagnifier|walkAimMagnifier' sim tests
          grep -F 'this.imageryEnabled=loadBool(WORLD_IMAGERY_STORAGE,false)' sim/real_world_bootstrap.mjs
          ! grep -F 'forceSatelliteDefaultOff' sim/world_liveliness.mjs

          git config user.name 'Christian Heinrich Hohlfeld'
          git config user.email 'chris.hohlfeld@gmail.com'
          git add sim tests .github/workflows
          git commit -m 'Remove broken aim magnifier and default imagery off'
          git push origin HEAD:main
