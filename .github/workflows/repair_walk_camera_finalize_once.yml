name: Repair walk camera finalize once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_walk_camera_finalize_once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize walk viewmodel after camera collision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sim/camera_collision_guard.mjs')
          s=p.read_text()
          old='const base=current,wrapper={__collisionGuard:true,__geometricCameraCollisionGuard:true,isActive:()=>Boolean(base?.isActive?.()),apply:args=>constrain(args,base?.apply?.(args))};'
          new='const base=current,wrapper={__collisionGuard:true,__geometricCameraCollisionGuard:true,isActive:()=>Boolean(base?.isActive?.()),apply:args=>{const result=base?.apply?.(args);const constrained=constrain(args,result);base?.afterCameraCollision?.(args);return constrained;}};'
          assert s.count(old)==1, f'camera wrapper occurrences={s.count(old)}'
          p.write_text(s.replace(old,new,1))

          p=Path('sim/player_walk_mode_v4.mjs')
          s=p.read_text()
          old='const WALK_CAMERA_PRESENTATION=Object.freeze({active:true,mode:"walk",origin:"player-eye"});\nconst walkCameraProvider=Object.freeze({isActive:()=>mode==="foot",apply:({camera,scene,now})=>{applyFootCamera(camera,now);const gun=placeWeapon(camera,scene,now);globalThis.__arondightFootWeaponPresentationV1?.apply?.({camera,scene,gun,now});return WALK_CAMERA_PRESENTATION;}});'
          new='const WALK_CAMERA_PRESENTATION=Object.freeze({active:true,mode:"walk",origin:"player-eye"});\nfunction finalizeWalkViewmodel(camera,scene,now){const gun=placeWeapon(camera,scene,now);globalThis.__arondightFootWeaponPresentationV1?.apply?.({camera,scene,gun,now});const view=viewport();if(view)view.dataset.walkViewmodelCameraPhase="after-camera-collision-v1";return gun;}\nconst walkCameraProvider=Object.freeze({isActive:()=>mode==="foot",apply:({camera,scene,now})=>{applyFootCamera(camera,now);if(bridge()?.presentationCameraProvider===walkCameraProvider)finalizeWalkViewmodel(camera,scene,now);return WALK_CAMERA_PRESENTATION;},afterCameraCollision:({camera,scene,now})=>finalizeWalkViewmodel(camera,scene,now)});'
          assert s.count(old)==1, f'walk camera provider occurrences={s.count(old)}'
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/camera_collision_guard.mjs
          node --check sim/player_walk_mode_v4.mjs
          grep -q 'afterCameraCollision' sim/camera_collision_guard.mjs
          grep -q 'walkViewmodelCameraPhase="after-camera-collision-v1"' sim/player_walk_mode_v4.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/camera_collision_guard.mjs sim/player_walk_mode_v4.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize walk viewmodel after camera collision'
          git push origin HEAD:main
