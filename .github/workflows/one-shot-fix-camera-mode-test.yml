name: Fix WORLD camera mode E2E
on:
  workflow_dispatch:
  push:
    branches: ["fix/world-fpv-eye-altitude"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-eye-altitude
          fetch-depth: 0
      - run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          old='''  for(const button of ["#camFollow","#camThird","#camFpv"]){\n    await page.click(button);await new Promise(r=>setTimeout(r,120));\n    const before=await page.evaluate(()=>Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0));\n    const box=await minimapBox();await page.mouse.move(box.x+box.w*.45,box.y+box.h*.58);await page.mouse.down();await page.mouse.move(box.x+box.w*.72,box.y+box.h*.46,{steps:4});await page.mouse.up();\n    await page.waitForFunction(start=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0)-start)>5,{timeout:3000},before);\n    const mode=await page.evaluate(()=>({mini:document.querySelector("#viewport")?.dataset.worldMinimapMode,bearing:Number(document.querySelector("#viewport")?.dataset.worldMinimapBearing||99)}));\n    if(mode.mini!=="north"||Math.abs(mode.bearing)>.01)throw new Error(`${button} changed minimap orientation: ${JSON.stringify(mode)}`);\n    await page.evaluate(()=>globalThis.__arondightRealWorld.resetLook(true));\n  }\n'''
          new='''  for(const expected of ["follow","third","fpv"]){\n    await page.waitForFunction(mode=>document.querySelector("#viewport")?.dataset.cameraMode===mode,{timeout:3000},expected);\n    const before=await page.evaluate(()=>Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0));\n    const box=await minimapBox();await page.mouse.move(box.x+box.w*.45,box.y+box.h*.58);await page.mouse.down();await page.mouse.move(box.x+box.w*.72,box.y+box.h*.46,{steps:4});await page.mouse.up();\n    await page.waitForFunction(start=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0)-start)>5,{timeout:3000},before);\n    const mode=await page.evaluate(()=>({camera:document.querySelector("#viewport")?.dataset.cameraMode,mini:document.querySelector("#viewport")?.dataset.worldMinimapMode,bearing:Number(document.querySelector("#viewport")?.dataset.worldMinimapBearing||99)}));\n    if(mode.camera!==expected||mode.mini!=="north"||Math.abs(mode.bearing)>.01)throw new Error(`${expected} changed minimap contract: ${JSON.stringify(mode)}`);\n    await page.evaluate(()=>globalThis.__arondightRealWorld.resetLook(true));\n    await page.click("#soloCamera");\n  }\n'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/one-shot-fix-camera-mode-test.yml
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Use visible solo camera control in WORLD E2E'
          git push origin HEAD:fix/world-fpv-eye-altitude
