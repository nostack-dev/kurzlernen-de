name: Enforce GAME target vector magnitude

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-cap-game-target-vector.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make desired speed a true vector magnitude
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('esp32/Arondight45_StateControl.hpp')
          s=p.read_text()
          old='''inline StateIntent state_intent(const RC& rc) {
    const float clearance01 = throttle(rc.ch[kStateClearanceChannel]);
    return {
        shape(centered(rc.ch[FC_SBUS_ROLL]), 0.035f, 0.25f) * kStateMaxHorizontalSpeedMps,
        shape(centered(rc.ch[FC_SBUS_PITCH]), 0.035f, 0.25f) * kStateMaxHorizontalSpeedMps,
        shape(centered(rc.ch[FC_SBUS_YAW]), 0.045f, 0.20f) * kStateMaxYawRateDps,
        kStateMinClearanceM + clearance01 * (kStateMaxClearanceM - kStateMinClearanceM),
        rc.ch[FC_SBUS_ARM] > 1300,
        rc.ch[kStateModeChannel] > 1300,
    };
}
'''
          new='''inline StateIntent state_intent(const RC& rc) {
    float right = shape(centered(rc.ch[FC_SBUS_ROLL]), 0.035f, 0.25f);
    float forward = shape(centered(rc.ch[FC_SBUS_PITCH]), 0.035f, 0.25f);
    // The stick defines one desired velocity vector. Its direction is (forward,right)
    // and its length is speed; diagonal input must never gain sqrt(2) authority.
    const float magnitude = std::sqrt(forward * forward + right * right);
    if (magnitude > 1.0f) {
        forward /= magnitude;
        right /= magnitude;
    }
    const float clearance01 = throttle(rc.ch[kStateClearanceChannel]);
    return {
        right * kStateMaxHorizontalSpeedMps,
        forward * kStateMaxHorizontalSpeedMps,
        shape(centered(rc.ch[FC_SBUS_YAW]), 0.045f, 0.20f) * kStateMaxYawRateDps,
        kStateMinClearanceM + clearance01 * (kStateMaxClearanceM - kStateMinClearanceM),
        rc.ch[FC_SBUS_ARM] > 1300,
        rc.ch[kStateModeChannel] > 1300,
    };
}
'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))

          t=Path('tests/state_control_test.cpp')
          x=t.read_text()
          marker='''    // Desired velocity minus measured velocity directly creates acceleration.\n'''
          insert='''    // The controller input is one velocity vector: direction comes from the\n    // two stick axes, length is speed. Even impossible square-corner transmitter\n    // input is normalized to the same 5 m/s maximum instead of sqrt(2) * 5.\n    {\n        auto diagonal = base_rc(true);\n        diagonal.ch[FC_SBUS_ROLL] = fc::centered_raw(1.0f);\n        diagonal.ch[FC_SBUS_PITCH] = fc::centered_raw(1.0f);\n        const auto intent = fc::state_intent(diagonal);\n        const float speed = std::sqrt(intent.forward_mps * intent.forward_mps +\n                                      intent.right_mps * intent.right_mps);\n        CHECK(std::fabs(speed - fc::kStateMaxHorizontalSpeedMps) < 0.01f);\n        CHECK(std::fabs(intent.forward_mps - intent.right_mps) < 0.01f);\n    }\n\n'''
          assert x.count(marker)==1
          t.write_text(x.replace(marker,insert+marker,1))
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state-control-tests
          /tmp/state-control-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core-tests
          /tmp/fc-core-tests
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit clean product change
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add esp32/Arondight45_StateControl.hpp tests/state_control_test.cpp
          git rm .github/workflows/oneoff-cap-game-target-vector.yml
          git commit -m "Make GAME speed the target vector magnitude"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
