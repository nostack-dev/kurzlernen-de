name: Apply multiplayer fight visibility and beacon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply multiplayer fight visibility and beacon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fight scale and shared beacon
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Combat transport accepts a shared beacon packet.
          path=Path('sim/lan_vs.mjs')
          text=path.read_text()
          old='''  if(packet.type==="respawn")return Number.isFinite(packet.hp)&&packet.hp>=0&&packet.hp<=100;\n  return false;'''
          new='''  if(packet.type==="respawn")return Number.isFinite(packet.hp)&&packet.hp>=0&&packet.hp<=100;\n  if(packet.type==="beacon")return idOk&&finiteArray(packet.p,3)&&(!("f" in packet)||typeof packet.f==="string"&&packet.f.length<=96);\n  return false;'''
          assert old in text and 'packet.type==="beacon"' not in text
          path.write_text(text.replace(old,new,1))

          # 2) Multiplayer presentation: much larger opponent + double-tap shared target beacon.
          path=Path('sim/vs_combat_presentation.mjs')
          text=path.read_text()
          assert 'const PEER_VISUAL_SCALE=2.25;' in text
          text=text.replace('const PEER_VISUAL_SCALE=2.25;','const PEER_VISUAL_SCALE=4.5;\nconst BEACON_DOUBLE_TAP_MS=330;\nconst BEACON_DOUBLE_TAP_PX=36;',1)

          marker='let lastPresentationMs=-Infinity;'
          state='''let lastPresentationMs=-Infinity;\nlet beaconGroup=null;\nlet beaconMarker=null;\nlet beaconState=null;\nlet hookedBridge=null;\nlet originalApplyVsCombat=null;\nlet previousVsConnected=false;\nlet lastBeaconTapAt=-Infinity;\nlet lastBeaconTapX=0;\nlet lastBeaconTapY=0;\nlet lastBeaconPointerType="";'''
          assert marker in text and 'let beaconState=null;' not in text
          text=text.replace(marker,state,1)

          marker='const cameraSpace=new THREE.Vector3();'
          vectors='''const cameraSpace=new THREE.Vector3();\nconst beaconWorldPosition=new THREE.Vector3();\nconst beaconProjected=new THREE.Vector3();\nconst beaconCameraSpace=new THREE.Vector3();\nconst beaconRaycaster=new THREE.Raycaster();\nconst beaconNdc=new THREE.Vector2();'''
          assert marker in text and 'beaconRaycaster' not in text
          text=text.replace(marker,vectors,1)

          marker='function respawnRemainingMs(deadSince){return Number.isFinite(deadSince)?Math.max(0,RESPAWN_MS-(performance.now()-deadSince)):0;}\n'
          helpers=r'''function respawnRemainingMs(deadSince){return Number.isFinite(deadSince)?Math.max(0,RESPAWN_MS-(performance.now()-deadSince)):0;}
function currentVsFrame(){return String(viewport()?.dataset.vsSharedFrame||"local-metric");}
function clearSharedBeacon(){beaconState=null;if(beaconGroup)beaconGroup.visible=false;if(beaconMarker)beaconMarker.hidden=true;const view=viewport();if(view){delete view.dataset.vsBeacon;delete view.dataset.vsBeaconDistanceM;delete view.dataset.vsBeaconSource;}}
function ensureBeaconVisual(currentBridge){const scene=currentBridge?.threeScene;if(!scene)return null;if(beaconGroup?.parent===scene)return beaconGroup;if(beaconGroup?.parent)beaconGroup.parent.remove(beaconGroup);if(!beaconGroup){const group=new THREE.Group(),ring=new THREE.Mesh(new THREE.TorusGeometry(.52,.055,8,28),new THREE.MeshBasicMaterial({color:0x55e6ff,transparent:true,opacity:.95,depthWrite:false,depthTest:true})),beam=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,5,8),new THREE.MeshBasicMaterial({color:0x55e6ff,transparent:true,opacity:.32,depthWrite:false,depthTest:true})),tip=new THREE.Mesh(new THREE.OctahedronGeometry(.18),new THREE.MeshBasicMaterial({color:0xb9f7ff,transparent:true,opacity:.96,depthWrite:false,depthTest:true}));beam.rotation.x=Math.PI/2;beam.position.z=2.5;tip.position.z=.34;for(const node of [ring,beam,tip]){node.userData.flightFireIgnore=true;node.raycast=()=>{};}group.add(ring,beam,tip);group.visible=false;group.renderOrder=11;group.userData.vsLocationBeacon=true;beaconGroup=group;}scene.add(beaconGroup);return beaconGroup;}
function applySharedBeaconPacket(currentBridge,packet,source="ally"){const p=Array.isArray(packet?.p)?packet.p.map(Number):null;if(!p||p.length!==3||!p.every(Number.isFinite))return false;const packetFrame=typeof packet.f==="string"?packet.f:"",frame=currentVsFrame();if(packetFrame&&frame&&packetFrame!==frame)return false;beaconState={id:String(packet.id||"beacon"),p,source:source==="you"?"you":"ally",frame:packetFrame||frame};const group=ensureBeaconVisual(currentBridge);if(group){group.position.set(...p);group.visible=Boolean(currentBridge?.vsConnected);}return true;}
function hookBeaconCombat(currentBridge){if(!currentBridge||hookedBridge===currentBridge)return;if(hookedBridge&&originalApplyVsCombat)hookedBridge.applyVsCombat=originalApplyVsCombat;hookedBridge=currentBridge;const original=typeof currentBridge.applyVsCombat==="function"?currentBridge.applyVsCombat.bind(currentBridge):null;originalApplyVsCombat=original;currentBridge.applyVsCombat=(packet,...args)=>{if(packet?.type==="beacon")return applySharedBeaconPacket(currentBridge,packet,"ally");return original?.(packet,...args);};}
function targetFromPointer(currentBridge,event){const view=viewport(),camera=currentBridge?.threeCamera;if(!view||!camera)return null;const rect=view.getBoundingClientRect();if(rect.width<2||rect.height<2)return null;const x=Number(event.clientX)-rect.left,y=Number(event.clientY)-rect.top;if(!Number.isFinite(x)||!Number.isFinite(y)||x<0||x>rect.width||y<0||y>rect.height)return null;beaconNdc.set(x/rect.width*2-1,-(y/rect.height)*2+1);camera.updateMatrixWorld?.(true);beaconRaycaster.setFromCamera(beaconNdc,camera);const ray=beaconRaycaster.ray,visual=currentBridge?.addVisualShotImpact?.(x,y,rect,ray),point=visual?.point;if(point&&[point.x,point.y,point.z].every(Number.isFinite))return[point.x,point.y,point.z];const dz=ray.direction.z;if(!(dz<-.00001))return null;const t=-ray.origin.z/dz;if(!(t>0)||t>1200)return null;return[ray.origin.x+ray.direction.x*t,ray.origin.y+ray.direction.y*t,0];}
function setSharedBeaconFromPointer(event){const currentBridge=bridge();if(!currentBridge?.vsConnected||!currentBridge?.vsSession?.sendCombat)return false;const p=targetFromPointer(currentBridge,event);if(!p)return false;const id=`b-${Date.now().toString(36)}-${Math.floor(performance.now()).toString(36)}`,packet={type:"beacon",id,p,f:currentVsFrame()};if(!currentBridge.vsSession.sendCombat(packet))return false;applySharedBeaconPacket(currentBridge,packet,"you");const view=viewport();if(view)view.dataset.vsBeaconSetCount=String(Number(view.dataset.vsBeaconSetCount||0)+1);try{navigator.vibrate?.(25);}catch{}return true;}
function handleBeaconPointerUp(event){if(!bridge()?.vsConnected)return;const target=event.target;if(target?.closest?.('button,input,select,textarea,a,label,[role="button"],#soloLeft,#soloRight,#soloHeight,#worldLookHud,#vsEnemyMarker,#vsBeaconMarker,.solo-action'))return;if(event.pointerType==="mouse"&&event.button!==0)return;const now=performance.now(),x=Number(event.clientX),y=Number(event.clientY),pointerType=String(event.pointerType||"pointer"),dt=now-lastBeaconTapAt,distance=Math.hypot(x-lastBeaconTapX,y-lastBeaconTapY),doubleTap=pointerType===lastBeaconPointerType&&dt>0&&dt<=BEACON_DOUBLE_TAP_MS&&distance<=BEACON_DOUBLE_TAP_PX;if(doubleTap){lastBeaconTapAt=-Infinity;setSharedBeaconFromPointer(event);return;}lastBeaconTapAt=now;lastBeaconTapX=x;lastBeaconTapY=y;lastBeaconPointerType=pointerType;}
function updateBeaconPresentation(currentBridge,now){const connected=Boolean(currentBridge?.vsConnected);if(previousVsConnected&&!connected)clearSharedBeacon();previousVsConnected=connected;if(!connected||!beaconState){if(beaconGroup)beaconGroup.visible=false;if(beaconMarker)beaconMarker.hidden=true;return;}const group=ensureBeaconVisual(currentBridge),camera=currentBridge?.threeCamera,view=viewport();if(!group||!camera||!view||!beaconMarker)return;group.position.set(...beaconState.p);group.visible=true;const pulse=1+.08*Math.sin(now*.006);group.scale.setScalar(pulse);const rect=view.getBoundingClientRect();if(rect.width<1||rect.height<1){beaconMarker.hidden=true;return;}beaconWorldPosition.set(...beaconState.p);beaconWorldPosition.z+=.35;camera.updateMatrixWorld?.(true);beaconProjected.copy(beaconWorldPosition).project(camera);beaconCameraSpace.copy(beaconWorldPosition).applyMatrix4(camera.matrixWorldInverse);const inFront=beaconCameraSpace.z<0;let nx=beaconProjected.x,ny=beaconProjected.y;if(!inFront){nx=-nx;ny=-ny;}const marginX=Math.min(70,rect.width*.14),marginY=Math.min(48,rect.height*.17),halfW=Math.max(1,rect.width/2-marginX),halfH=Math.max(1,rect.height/2-marginY);let sx=nx*rect.width/2,sy=-ny*rect.height/2;const scale=Math.min(1,halfW/Math.max(1,Math.abs(sx)),halfH/Math.max(1,Math.abs(sy)));sx*=scale;sy*=scale;const x=rect.width/2+sx,y=rect.height/2+sy,onScreen=inFront&&Math.abs(beaconProjected.x)<.94&&Math.abs(beaconProjected.y)<.88&&beaconProjected.z>-1&&beaconProjected.z<1;beaconMarker.hidden=false;beaconMarker.classList.toggle("offscreen",!onScreen);beaconMarker.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-50%)`;const pointer=beaconMarker.querySelector("i");if(pointer)pointer.style.transform=`rotate(${(Math.atan2(sy,sx)*180/Math.PI+90).toFixed(1)}deg)`;const distance=Math.max(0,ownDroneWorldPosition(currentBridge).distanceTo(beaconWorldPosition)),detail=beaconMarker.querySelector("small");if(detail)detail.textContent=`${beaconState.source==="you"?"YOU":"ALLY"} · ${distance<100?distance.toFixed(1):Math.round(distance)} m`;view.dataset.vsBeacon=onScreen?"onscreen":"offscreen";view.dataset.vsBeaconDistanceM=distance.toFixed(2);view.dataset.vsBeaconSource=beaconState.source;}
'''
          assert marker in text and 'function updateBeaconPresentation' not in text
          text=text.replace(marker,helpers,1)

          old='''function renderPresentation(now=performance.now(),force=false){if(!force&&now-lastPresentationMs<PRESENTATION_MS)return;lastPresentationMs=now;const currentBridge=bridge();if(currentBridge){enhancePeerVisual(currentBridge);const localDead=Boolean(currentBridge.vsLocalDead),peerDead=Boolean(currentBridge.vsPeerDead);if(localDead&&!previousLocalDead){localDeathAt=performance.now();playExplosion(true);flashExplosion(true);}if(peerDead&&!previousPeerDead){peerDeathAt=performance.now();playExplosion(false);flashExplosion(false);}if(!localDead)localDeathAt=-Infinity;if(!peerDead)peerDeathAt=-Infinity;previousLocalDead=localDead;previousPeerDead=peerDead;updateEnemyMarker(currentBridge,now);updateRespawnHud(currentBridge);}else{if(marker)marker.hidden=true;if(respawnHud)respawnHud.hidden=true;}}'''
          new='''function renderPresentation(now=performance.now(),force=false){if(!force&&now-lastPresentationMs<PRESENTATION_MS)return;lastPresentationMs=now;const currentBridge=bridge();if(currentBridge){hookBeaconCombat(currentBridge);enhancePeerVisual(currentBridge);const localDead=Boolean(currentBridge.vsLocalDead),peerDead=Boolean(currentBridge.vsPeerDead);if(localDead&&!previousLocalDead){localDeathAt=performance.now();playExplosion(true);flashExplosion(true);}if(peerDead&&!previousPeerDead){peerDeathAt=performance.now();playExplosion(false);flashExplosion(false);}if(!localDead)localDeathAt=-Infinity;if(!peerDead)peerDeathAt=-Infinity;previousLocalDead=localDead;previousPeerDead=peerDead;updateEnemyMarker(currentBridge,now);updateBeaconPresentation(currentBridge,now);updateRespawnHud(currentBridge);}else{if(marker)marker.hidden=true;if(beaconMarker)beaconMarker.hidden=true;if(respawnHud)respawnHud.hidden=true;}}'''
          assert old in text
          text=text.replace(old,new,1)

          old='''if(!explosionFlash){explosionFlash=document.createElement("div");explosionFlash.id="vsExplosionFlash";explosionFlash.setAttribute("aria-hidden","true");view.appendChild(explosionFlash);}bindCombatHudObserver();return true;}'''
          new='''if(!explosionFlash){explosionFlash=document.createElement("div");explosionFlash.id="vsExplosionFlash";explosionFlash.setAttribute("aria-hidden","true");view.appendChild(explosionFlash);}if(!beaconMarker){beaconMarker=document.createElement("div");beaconMarker.id="vsBeaconMarker";beaconMarker.hidden=true;beaconMarker.innerHTML='<i>▲</i><strong>TARGET</strong><small>YOU · 0 m</small>';view.appendChild(beaconMarker);}if(view.dataset.vsBeaconTapInstalled!=="1"){view.dataset.vsBeaconTapInstalled="1";view.addEventListener("pointerup",handleBeaconPointerUp,{passive:true});}bindCombatHudObserver();return true;}'''
          assert old in text
          text=text.replace(old,new,1)

          css_marker='#vsRespawnHud{position:absolute;'
          beacon_css='#vsBeaconMarker{position:absolute;z-index:12;left:0;top:0;width:106px;height:44px;pointer-events:none;will-change:transform;filter:drop-shadow(0 1px 3px #000) drop-shadow(0 0 9px #35dfff99);font-family:system-ui,-apple-system,sans-serif;text-align:center;color:#dffcff}#vsBeaconMarker[hidden]{display:none!important}#vsBeaconMarker strong{display:block;font:950 10px/1 system-ui,-apple-system,sans-serif;letter-spacing:.13em;color:#7eeeff;text-shadow:0 0 8px #2edcff}#vsBeaconMarker small{display:block;margin-top:3px;font:850 8px/1 system-ui,-apple-system,sans-serif;white-space:nowrap;background:#061823e8;border:1px solid #55e6ff88;border-radius:7px;padding:3px 4px}#vsBeaconMarker>i{display:none;position:absolute;left:50%;top:-12px;margin-left:-6px;font:900 14px/1 system-ui;color:#60e9ff;text-shadow:0 0 8px #28dfff;transform-origin:50% 50%}#vsBeaconMarker.offscreen>i{display:block}#vsBeaconMarker.offscreen strong{margin-top:12px}\n'
          assert css_marker in text and '#vsBeaconMarker{' not in text
          text=text.replace(css_marker,beacon_css+css_marker,1)
          path.write_text(text)

          # 3) Transport smoke: beacon is a validated peer packet.
          path=Path('tests/lan_vs_smoke.mjs')
          text=path.read_text()
          old='''assert.equal(b.sendCombat({type:"state",id:"hit-1",hp:75,killed:false}),true);await sleep(5);assert.deepEqual(aCombat,{type:"state",id:"hit-1",hp:75,killed:false});b.stop();'''
          new='''assert.equal(b.sendCombat({type:"state",id:"hit-1",hp:75,killed:false}),true);await sleep(5);assert.deepEqual(aCombat,{type:"state",id:"hit-1",hp:75,killed:false});assert.equal(a.sendCombat({type:"beacon",id:"beacon-1",p:[7,8,0],f:"local-metric"}),true);await sleep(5);assert.deepEqual(bCombat,{type:"beacon",id:"beacon-1",p:[7,8,0],f:"local-metric"});assert.equal(a.sendCombat({type:"beacon",id:"bad-beacon",p:[7,NaN,0],f:"local-metric"}),false);b.stop();'''
          assert old in text and 'beacon-1' not in text
          text=text.replace(old,new,1).replace('origin and combat.','origin, combat and shared beacon packets.',1)
          path.write_text(text)

          # 4) Browser E2E: 4.5x opponent and double-tap target + remote beacon presentation.
          path=Path('tests/vs_combat_browser_smoke.mjs')
          text=path.read_text()
          old='''const marker=document.querySelector("#vsEnemyMarker"),firstMesh=bridge.vsPeerMesh.children.find(child=>child.isMesh),distanceM=Number(viewport.dataset.vsEnemyDistanceM),hpFill=marker?.querySelector(".vs-enemy-hp>b");\n    const markerBefore={exists:Boolean(marker),hidden:Boolean(marker?.hidden),text:marker?.textContent||"",mode:viewport.dataset.vsEnemyMarker||"",distanceM,expectedDistanceM:10,hpFill:Boolean(hpFill),hpTransform:hpFill?.style?.transform||"",emissiveIntensity:Number(firstMesh?.material?.emissiveIntensity)||0,color:firstMesh?.material?.color?.getHex?.()||0,audioReady:viewport.dataset.vsExplosionAudioReady||"",audioState:viewport.dataset.vsExplosionAudioState||""};'''
          new='''const marker=document.querySelector("#vsEnemyMarker"),firstMesh=bridge.vsPeerMesh.children.find(child=>child.isMesh),distanceM=Number(viewport.dataset.vsEnemyDistanceM),hpFill=marker?.querySelector(".vs-enemy-hp>b");\n    const markerBefore={exists:Boolean(marker),hidden:Boolean(marker?.hidden),text:marker?.textContent||"",mode:viewport.dataset.vsEnemyMarker||"",distanceM,expectedDistanceM:10,hpFill:Boolean(hpFill),hpTransform:hpFill?.style?.transform||"",emissiveIntensity:Number(firstMesh?.material?.emissiveIntensity)||0,color:firstMesh?.material?.color?.getHex?.()||0,audioReady:viewport.dataset.vsExplosionAudioReady||"",audioState:viewport.dataset.vsExplosionAudioState||"",visualScale:Number(bridge.vsPeerMesh.scale.x)||0};\n    const rect=viewport.getBoundingClientRect(),tapX=rect.left+rect.width*.5,tapY=rect.top+rect.height*.82;viewport.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,pointerType:"touch",clientX:tapX,clientY:tapY}));await sleep(80);viewport.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,pointerType:"touch",clientX:tapX+2,clientY:tapY+2}));await sleep(140);const localBeaconPacket=sent.find(p=>p.type==="beacon"),beaconMarker=document.querySelector("#vsBeaconMarker"),localBeacon={packet:localBeaconPacket||null,hidden:Boolean(beaconMarker?.hidden),text:beaconMarker?.textContent||"",source:viewport.dataset.vsBeaconSource||"",distance:Number(viewport.dataset.vsBeaconDistanceM),setCount:Number(viewport.dataset.vsBeaconSetCount||0)};const sharedFrame=viewport.dataset.vsSharedFrame||"local-metric";bridge.applyVsCombat({type:"beacon",id:"peer-beacon",p:[ox+6,oy+3,0],f:sharedFrame});await sleep(100);const remoteBeacon={hidden:Boolean(beaconMarker?.hidden),text:beaconMarker?.textContent||"",source:viewport.dataset.vsBeaconSource||"",distance:Number(viewport.dataset.vsBeaconDistanceM)};'''
          assert old in text and 'localBeaconPacket' not in text
          text=text.replace(old,new,1)
          old='''bridge.stopVs();return{hitOk,shot,markerBefore,staleHold,killed,peerRespawn,hpAfterFirst,hpAfterDuplicate,state,localDeath,dataset};'''
          new='''bridge.stopVs();return{hitOk,shot,markerBefore,localBeacon,remoteBeacon,staleHold,killed,peerRespawn,hpAfterFirst,hpAfterDuplicate,state,localDeath,dataset};'''
          assert old in text
          text=text.replace(old,new,1)
          old='''if(!Number.isFinite(result.markerBefore.distanceM)||Math.abs(result.markerBefore.distanceM-result.markerBefore.expectedDistanceM)>.25)throw new Error(`enemy distance is not drone-to-drone: ${JSON.stringify(result.markerBefore)}`);'''
          new='''if(!Number.isFinite(result.markerBefore.distanceM)||Math.abs(result.markerBefore.distanceM-result.markerBefore.expectedDistanceM)>.25)throw new Error(`enemy distance is not drone-to-drone: ${JSON.stringify(result.markerBefore)}`);\n  if(Math.abs(result.markerBefore.visualScale-4.5)>.001)throw new Error(`enemy fight scale is not 4.5x: ${JSON.stringify(result.markerBefore)}`);\n  if(result.localBeacon.packet?.type!=="beacon"||!Array.isArray(result.localBeacon.packet?.p)||result.localBeacon.packet.p.length!==3||result.localBeacon.hidden||!result.localBeacon.text.includes("TARGET")||result.localBeacon.source!=="you"||result.localBeacon.setCount<1||!Number.isFinite(result.localBeacon.distance))throw new Error(`double-tap shared beacon failed: ${JSON.stringify(result.localBeacon)}`);\n  if(result.remoteBeacon.hidden||!result.remoteBeacon.text.includes("TARGET")||result.remoteBeacon.source!=="ally"||!Number.isFinite(result.remoteBeacon.distance))throw new Error(`remote shared beacon presentation failed: ${JSON.stringify(result.remoteBeacon)}`);'''
          assert old in text
          text=text.replace(old,new,1).replace('connected stale-pose mesh+tracker hold,','4.5x fight visibility, double-tap shared target beacon, connected stale-pose mesh+tracker hold,',1)
          path.write_text(text)
          PY

          node --check sim/lan_vs.mjs
          node --check sim/vs_combat_presentation.mjs
          node --check tests/lan_vs_smoke.mjs
          node --check tests/vs_combat_browser_smoke.mjs
          node tests/lan_vs_smoke.mjs
          grep -q 'const PEER_VISUAL_SCALE=4.5' sim/vs_combat_presentation.mjs
          grep -q 'function handleBeaconPointerUp' sim/vs_combat_presentation.mjs
          grep -q 'packet.type==="beacon"' sim/lan_vs.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/lan_vs.mjs sim/vs_combat_presentation.mjs tests/lan_vs_smoke.mjs tests/vs_combat_browser_smoke.mjs
          git commit -m 'Make multiplayer fights visible and add shared beacon'
          git push origin HEAD:main
