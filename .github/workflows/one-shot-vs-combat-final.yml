          mkdir -p /tmp/vs-combat-live
          cat >/tmp/vs-combat-live/entry.mjs <<'JS'
          import {LanVsSession,sameNetworkRoomKey} from '/workspace/sim/lan_vs.mjs';
          import * as mqtt from '@trystero-p2p/mqtt';
          globalThis.VS={networkKey:()=>sameNetworkRoomKey(),async start(suffix){const state={peer:false,combat:null,left:false};const base=await sameNetworkRoomKey();const session=new LanVsSession({loadTransport:async()=>mqtt,loadFallbackTransport:null,onPeer:()=>state.peer=true,onCombat:p=>state.combat=p,onLeave:()=>state.left=true});await session.start(`${base}-${suffix}`);globalThis.__session=session;globalThis.__state=state;return base;},combat:p=>globalThis.__session.sendCombat(p),state:()=>globalThis.__state,stop:()=>globalThis.__session?.stop()};
