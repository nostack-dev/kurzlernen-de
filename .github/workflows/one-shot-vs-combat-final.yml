          printf '<!doctype html><meta charset="utf-8"><script src="app.js"></script>\n' >/tmp/vs-combat-live/index.html
          cat >/tmp/vs-combat-live/test.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const exe=process.env.CHROME_BIN,base='http://127.0.0.1:4188',suffix=`combat-${process.env.GITHUB_RUN_ID}`;const launch=()=>puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-dev-shm-usage']});const a=await launch(),b=await launch();const wait=async(page,predicate,ms=20000)=>{const end=Date.now()+ms;while(Date.now()<end){const s=await page.evaluate(()=>VS.state());if(predicate(s))return s;await new Promise(r=>setTimeout(r,100));}throw Error('timeout');};
          try{const pa=await a.newPage(),pb=await b.newPage();await Promise.all([pa.goto(base),pb.goto(base)]);const [ka,kb]=await Promise.all([pa.evaluate(()=>VS.networkKey()),pb.evaluate(()=>VS.networkKey())]);if(ka!==kb)throw Error(`network keys differ ${ka} ${kb}`);await Promise.all([pa.evaluate(s=>VS.start(s),suffix),pb.evaluate(s=>VS.start(s),suffix)]);await Promise.all([wait(pa,s=>s.peer),wait(pb,s=>s.peer)]);const sent=await pa.evaluate(()=>VS.combat({type:'hit',id:'live-hit',damage:25}));if(!sent)throw Error('combat send rejected');const rx=await wait(pb,s=>s.combat?.id==='live-hit');if(rx.combat.damage!==25)throw Error('combat payload corrupted');await pb.evaluate(()=>VS.combat({type:'state',id:'live-hit',hp:75,killed:false}));const ack=await wait(pa,s=>s.combat?.type==='state');if(ack.combat.hp!==75)throw Error('combat ack corrupted');console.log('LIVE VS same-network -> MQTT -> WebRTC combat PASS',JSON.stringify({room:ka,hit:rx.combat,ack:ack.combat}));}finally{await a.close();await b.close();}
          JS
          cd /tmp/vs-combat-live
          python3 -m http.server 4188 --bind 127.0.0.1 >/tmp/vs-combat-live-http.log 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 1
