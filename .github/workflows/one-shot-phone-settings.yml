name: One-shot phone settings integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phone-settings.yml'
      - 'tools/patch_phone_control_settings.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate one-phone settings and browser regression
        run: |
          set -euxo pipefail
          python3 tools/patch_phone_control_settings.py
          git diff --check
          node --check sim/simulator.mjs
          node --check tests/browser_sim_smoke.mjs
          git diff -- sim/simulator.mjs tests/browser_sim_smoke.mjs
      - name: Commit product integration
        run: |
          set -euxo pipefail
          git config user.name 'Christian Heinrich Hohlfeld'
          git config user.email 'chris.hohlfeld@gmail.com'
          git add sim/simulator.mjs tests/browser_sim_smoke.mjs
          git commit -m 'Add human-scale phone control settings to solo mode'
          git push
