name: Fix vehicle occupant and physical passage once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-vehicle-occupant-passage-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vehicle occupant and passage contracts
