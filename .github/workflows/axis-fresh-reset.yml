name: Fresh reset axis probe
on:
  workflow_dispatch:
  push:
    branches: ["diagnostic/equal-axis-fresh-reset"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: diagnostic/equal-axis-fresh-reset
      - name: Build exact browser SIL
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          BUILD_DIR=/tmp/axis-fresh-reset;rm -rf "$BUILD_DIR";mkdir -p "$BUILD_DIR";cd "$BUILD_DIR";npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules";cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/sim.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html');s=p.read_text();m='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>';b=Path('/tmp/sim.bundle.mjs').read_text().replace('</script','<\\/script');assert m in s;p.write_text(s.replace(m,'<script type="module">\n'+b+'\n</script>'))
          PY
          rm -rf generated
      - name: Measure identical fresh-reset axis response
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4180 --bind 127.0.0.1 >/tmp/axis-http.log 2>&1 &
          HTTP_PID=$!;trap 'kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules' EXIT;sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/axis_fresh_reset_probe.mjs http://127.0.0.1:4180
