name: Wire state-control browser E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/state-e2e-wire.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch controller safety and dual-phone E2E
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controller=Path('sim/controller.mjs')
          s=controller.read_text()
          old='''function armReady(){return sharedArmReady(lastTelemetry.fc_state,controls,peer.linked,phoneSettings);}'''
          new='''function armReady(){\n  if(gameMode&&lastTelemetry.navigation_valid!==true)return false;\n  return sharedArmReady(lastTelemetry.fc_state,controls,peer.linked,phoneSettings);\n}'''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          unused='''  const labels={leftTop:document.querySelector("#leftStick~.axis-top"),leftBottom:document.querySelector("#leftStick~.axis-bottom")};\n'''
          assert s.count(unused)==1
          s=s.replace(unused,'',1)
          controller.write_text(s)

          test=Path('tests/dual_phone_smoke.mjs')
          s=test.read_text()
          start=s.index('  // Remote pairing must auto-start SIM; there is no extra Start click.')
          end=s.index('  // Stall the controller JS for longer than the 350 ms freshness window')
          replacement=r'''  // Remote pairing must auto-start SIM; there is no extra Start click.
  await waitSim(view,0.05,15000);
  await waitSim(view,2.2,60000);
  let state=await view.$eval("#fcState",element=>element.textContent||"");
  if(state!=="DISARMED")throw new Error(`calibration failed: ${JSON.stringify(await snapshot(view))}`);

  // GAME/STATE is the primary controller mode. Arming is forbidden until the
  // shared C++ runtime reports a valid measured navigation state.
  await waitText(controller,"#gameModeButton","MODE · GAME",10000);
  const clearance=await controller.$eval("#gameClearanceSlider",element=>Number(element.value));
  if(Math.abs(clearance-2)>0.01)throw new Error(`unexpected default ground clearance ${clearance}`);
  await controller.waitForFunction(()=>document.querySelector("#gameSensorStatus")?.textContent?.includes("AGL"),{timeout:15000});
  await controller.waitForFunction(()=>{const b=document.querySelector("#arm");return b&&!b.disabled&&b.textContent.trim()==="ARM";},{timeout:15000});

  const armStart=await simTime(view);await controller.click("#arm");await waitSim(view,armStart+1.1,45000);
  state=await view.$eval("#fcState",element=>element.textContent||"");
  if(state!=="ARMED")throw new Error(`GAME remote arming failed: ${JSON.stringify(await snapshot(view))}`);
  await waitText(controller,"#arm","ARMED ✓",10000);

  // With neutral motion sticks, the 2.0 m AGL slider is now the vertical state
  // target. The aircraft must get there only through motor pulses + Box3D physics.
  await view.waitForFunction(()=>{const z=parseFloat(document.querySelector("#altitude")?.textContent||"0");return z>1.55&&z<2.45;},{timeout:60000});
  const holdStart=await simTime(view);await waitSim(view,holdStart+.8,40000);
  const holdAltitude=await view.$eval("#altitude",element=>parseFloat(element.textContent||"0"));
  if(!(holdAltitude>1.35&&holdAltitude<2.65))throw new Error(`2m AGL hold did not settle: ${holdAltitude}`);
  const liftPulses=await view.$eval("#motors",element=>(element.textContent||"").trim().split(/\s+/).map(Number));
  if(!liftPulses.some(value=>Number.isFinite(value)&&value>1050))throw new Error(`AGL controller produced no physical motor thrust: ${liftPulses.join(" ")}`);
  console.log(`State-control E2E: neutral input physically converged to 2m AGL (${holdAltitude.toFixed(2)}m).`);

  async function stickBox(selector){return controller.$eval(selector,element=>{const r=element.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height};});}
  async function speed(){return view.$eval("#velocity",element=>parseFloat(element.textContent||"0"));}
  async function yaw(){return view.$eval("#attitude",element=>{const parts=(element.textContent||"").match(/-?\d+(?:\.\d+)?/g)||[];return Number(parts[2]||0);});}

  // Forward intent: left stick up requests desired forward velocity, not throttle.
  // The C++ outer loop must tilt the real rigid body and generate acceleration.
  const left=await stickBox("#leftStick"),lcx=left.x+left.w/2,lcy=left.y+left.h/2,lr=Math.min(left.w,left.h)*.42;
  await controller.mouse.move(lcx,lcy);await controller.mouse.down();await controller.mouse.move(lcx,lcy-lr*.72,{steps:5});
  const forwardStart=await simTime(view);await waitSim(view,forwardStart+.55,30000);
  const movingSpeed=await speed();
  if(movingSpeed<0.65)throw new Error(`forward desired-vector command did not accelerate physical model: ${movingSpeed} m/s`);
  await controller.mouse.up();

  // Releasing the motion stick requests zero horizontal velocity. The feedback
  // loop must actively brake rather than teleporting or clamping velocity.
  const brakeStart=await simTime(view);await waitSim(view,brakeStart+1.6,50000);
  const brakedSpeed=await speed();
  if(brakedSpeed>Math.max(.75,movingSpeed*.72))throw new Error(`zero-velocity target did not brake enough: moving=${movingSpeed}, after=${brakedSpeed}`);
  console.log(`State-control E2E: forward vector ${movingSpeed.toFixed(2)}m/s -> active braking ${brakedSpeed.toFixed(2)}m/s.`);

  // Right-stick horizontal integrates desired heading. Verify actual FC yaw moves;
  // right-stick vertical remains camera free-look and never bypasses flight physics.
  const yawBefore=await yaw();
  const right=await stickBox("#rightStick"),rcx=right.x+right.w/2,rcy=right.y+right.h/2,rr=Math.min(right.w,right.h)*.42;
  await controller.mouse.move(rcx,rcy);await controller.mouse.down();await controller.mouse.move(rcx+rr*.45,rcy,{steps:4});
  const turnStart=await simTime(view);await waitSim(view,turnStart+.22,25000);await controller.mouse.up();
  const yawAfter=await yaw();
  let yawDelta=(yawAfter-yawBefore)%360;if(yawDelta>180)yawDelta-=360;if(yawDelta<-180)yawDelta+=360;
  if(Math.abs(yawDelta)<4)throw new Error(`heading feedback did not rotate aircraft: before=${yawBefore}, after=${yawAfter}`);
  console.log(`State-control E2E: heading command rotated real attitude by ${yawDelta.toFixed(1)}°.`);

'''
          s=s[:start]+replacement+s[end:]
          s=s.replace('Serverless dual-phone E2E passed: QR UX, autorun, arm gate, relative throttle control, telemetry, session recovery, hard-loss disarm.','Serverless dual-phone GAME/STATE E2E passed: QR UX, measured-nav arm gate, 2m AGL convergence, vector acceleration/braking, heading control, session recovery, hard-loss disarm.')
          test.write_text(s)
          PY
          node --check sim/controller.mjs
          node --check tests/dual_phone_smoke.mjs
          git diff --check
      - name: Commit browser E2E
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim/controller.mjs tests/dual_phone_smoke.mjs
          git commit -m "Test GAME state control end to end"
          git push origin HEAD:main
