name: Repair walk viewmodel lifecycle once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_walk_viewmodel_lifecycle_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make walk mode own viewmodel lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/player_walk_mode_v4.mjs')
          s=p.read_text()
          old='function frame(now=performance.now()){const elapsed=clamp((now-lastFrame)/1000,0,LOOK_CATCHUP_MAX_S),dt=Math.min(.05,elapsed);lastFrame=now;mountHud();mountModeButton();renderModeButton();attachCameraProvider();update(now,dt,elapsed);requestAnimationFrame(frame);}'
          new='function frame(now=performance.now()){const elapsed=clamp((now-lastFrame)/1000,0,LOOK_CATCHUP_MAX_S),dt=Math.min(.05,elapsed);lastFrame=now;mountHud();mountModeButton();renderModeButton();const scene=bridge()?.threeScene;if(mode==="foot"&&scene)ensureWeapon(scene);attachCameraProvider();update(now,dt,elapsed);requestAnimationFrame(frame);}'
          assert old in s, 'frame lifecycle contract changed'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check sim/player_walk_mode_v4.mjs
          grep -q 'if(mode==="foot"&&scene)ensureWeapon(scene)' sim/player_walk_mode_v4.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/player_walk_mode_v4.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Own walk viewmodel lifecycle in walk runtime'
          git push origin HEAD:main
