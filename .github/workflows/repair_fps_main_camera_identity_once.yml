name: Repair FPS main camera identity once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_fps_main_camera_identity_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate FPS presentation to exact player camera
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=p.read_text()
          old='const camera=args[2];if(!camera?.isPerspectiveCamera)return;'
          new='const camera=args[2],mainCamera=bridge()?.threeCamera;if(!camera||camera!==mainCamera)return;'
          assert old in s, 'perspective-only render camera gate changed'
          s=s.replace(old,new,1)
          s=s.replace('player-perspective-render-camera-v3','player-main-render-camera-identity-v4',1)
          p.write_text(s)
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          grep -q 'camera!==mainCamera' sim/first_person_weapon_runtime_v3.mjs
          ! grep -q 'camera?.isPerspectiveCamera' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Gate FPS aim presentation to player camera'
          git push origin HEAD:main