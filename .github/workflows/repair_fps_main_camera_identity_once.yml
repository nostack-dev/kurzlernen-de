name: Repair FPS exact visible hip grip once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_fps_main_camera_identity_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latch exact visible hip grip before aim
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=p.read_text()
          old='if(!aimPivotLatched||aimPivotMode!==mode)latchAimPivot(gun,pivot,camera,mode);'
          new='if(!aimPivotLatched||aimPivotMode!==mode){lastHipPivotValid=false;latchAimPivot(gun,pivot,camera,mode);}'
          assert old in s, 'visible pivot latch contract changed'
          s=s.replace(old,new,1)
          old_aim='if(updateScreenVector(d,d.source||"touch-screen-drag",true))document.body.classList.add("foot-ads-active");'
          new_aim='latchVisibleAimPivot();if(updateScreenVector(d,d.source||"touch-screen-drag",true))document.body.classList.add("foot-ads-active");'
          assert old_aim in s, 'screen aim start contract changed'
          s=s.replace(old_aim,new_aim,1)
          p.write_text(s)
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          grep -q 'lastHipPivotValid=false;latchAimPivot' sim/first_person_weapon_runtime_v3.mjs
          grep -q 'latchVisibleAimPivot();if(updateScreenVector' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Latch exact visible FPS hip grip on aim start'
          git push origin HEAD:main