name: Apply WORLD terrain v3

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == 'RUN_WORLD_TERRAIN_INTEGRATION_V3'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply integration patch
        run: |
          set -o pipefail
          python3 scripts/apply_world_integration.py 2>&1 | tee /tmp/world-v3.log

      - name: Static and unit gates
        run: |
          set -o pipefail
          {
            node --check sim/simulator.mjs
            node --check sim/real_world_bootstrap.mjs
            node --check sim/world_building_collisions.mjs
            node --check sim/world_dem_sampler.mjs
            node --check sim/world_terrain.mjs
            node --check sim/world_terrain_physics.mjs
            node --check sim/safe_spawn.mjs
            node --check tests/vs_combat_browser_smoke.mjs
            node --check tests/world_real_terrain_browser_smoke.mjs
            node tests/world_dem_sampler_test.mjs
            node tests/world_terrain_test.mjs
            node tests/world_building_style_test.mjs
            node tests/safe_spawn_test.mjs
            node tests/component_mass_model_test.mjs
            node tests/propulsion_authority_test.mjs
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
            /tmp/state_control_test
          } 2>&1 | tee -a /tmp/world-v3.log

      - name: Install browser and Box3D dependencies
        run: |
          set -o pipefail
          {
            BUILD_DIR=/tmp/arondight-world-v3
            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR"
            cd "$BUILD_DIR"
            npm init -y >/dev/null
            npm install --ignore-scripts --no-audit --no-fund \
              three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1 \
              qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3
            ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          } 2>&1 | tee -a /tmp/world-v3.log

      - name: Real Box3D terrain and spawn gates
        run: |
          set -o pipefail
          {
            BUILD_DIR=/tmp/arondight-world-v3
            node tests/world_terrain_box3d_test.mjs "$BUILD_DIR/node_modules/box3d.js/dist/box3d.inline.mjs"
            node tests/safe_spawn_box3d_test.mjs "$BUILD_DIR/node_modules/box3d.js/dist/box3d.inline.mjs"
          } 2>&1 | tee -a /tmp/world-v3.log

      - name: Build shared WASM core
        run: |
          set -o pipefail
          {
            mkdir -p generated
            docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
              em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
                -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
                -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
                -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
                -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
                -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
                -o generated/flight_core.mjs
            node --check generated/flight_core.mjs
          } 2>&1 | tee -a /tmp/world-v3.log

      - name: Browser integration gates
        run: |
          set -o pipefail
          {
            ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify \
              --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight-world-v3.bundle.mjs
            python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html')
          marker='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>'
          html=p.read_text(); assert marker in html
          bundle=Path('/tmp/arondight-world-v3.bundle.mjs').read_text().replace('</script','<\\/script')
          p.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
            test -n "$CHROME_BIN"
            python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/world-v3-http.log 2>&1 &
            HTTP_PID=$!
            trap 'kill "$HTTP_PID" 2>/dev/null || true' EXIT
            sleep 1
            CHROME_BIN="$CHROME_BIN" node tests/vs_combat_browser_smoke.mjs http://127.0.0.1:4174
            CHROME_BIN="$CHROME_BIN" node tests/world_real_terrain_browser_smoke.mjs http://127.0.0.1:4174/drone_simulator.html
            kill "$HTTP_PID" 2>/dev/null || true
            trap - EXIT
            git checkout -- drone_simulator.html
          } 2>&1 | tee -a /tmp/world-v3.log

      - name: Publish verified source
        run: |
          set -o pipefail
          {
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sim/simulator.mjs sim/real_world_bootstrap.mjs sim/world_building_collisions.mjs tests/vs_combat_browser_smoke.mjs
            git commit -m 'Integrate real DEM terrain and safe combat spawning'
            git push origin HEAD:main
            git rev-parse HEAD > /tmp/world-v3-source-sha
          } 2>&1 | tee -a /tmp/world-v3.log

      - name: Report success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const sha=fs.readFileSync('/tmp/world-v3-source-sha','utf8').trim();
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`WORLD_TERRAIN_V3_OK source=${sha}`});

      - name: Report exact failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            let text='';
            try{text=fs.readFileSync('/tmp/world-v3.log','utf8')}catch{}
            text=text.slice(-18000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`WORLD_TERRAIN_V3_FAILED\n\n\`\`\`text\n${text}\n\`\`\``});
