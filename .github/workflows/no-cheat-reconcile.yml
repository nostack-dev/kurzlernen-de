name: Final no-cheat reconciliation gate

on:
  push:
    branches: [no-cheat-digital-twin]

permissions:
  contents: write

jobs:
  functional:
    if: github.event.head_commit.message != 'Materialize latest-main raw hardware twin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile latest main without shortcuts
        run: |
          set -euxo pipefail
          python3 tools/reconcile_no_cheat_latest.py
          git diff --check
          ! grep -q 'Arondight45_Navigation.hpp' esp32/Arondight45_DroneFC_S31.cpp
          ! grep -q 'nav_vx_cms' esp32/Arondight45_HIL_Protocol.hpp
          grep -q 'fc::FirmwareRuntime runtime' esp32/Arondight45_DroneFC_S31.cpp
          grep -q 'kProtocolVersion = 3' esp32/Arondight45_HIL_Protocol.hpp
          grep -q 'sizeof(InputPacket) == 80' esp32/Arondight45_HIL_Protocol.hpp
          grep -q 'raw sensor wire → shared fc::FirmwareRuntime → shared fc::StateRuntime → fc::Runtime / WASM' sim/simulator.mjs

      - name: Compile and validate shared firmware stack
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core
          /tmp/fc-core
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state-control
          /tmp/state-control
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil
          ASAN_OPTIONS=detect_leaks=1 /tmp/hil
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil
          /tmp/sil
          node --check sim/simulator.mjs
          node --check sim/controller.mjs
          node --check sim/p2p_link.mjs
          node --check sim/control_semantics.mjs
          node --check sim/control_settings.mjs
          node --check sim/solo_layout.mjs
          node --check tests/architecture_invariants.mjs
          node --check tests/control_semantics_test.mjs
          node --check tests/sil_wasm_smoke.mjs
          node --check tests/browser_sim_smoke.mjs
          node --check tests/dual_phone_smoke.mjs
          node --check tests/solo_layout_smoke.mjs
          node --check tools/s31_hil_bridge.mjs
          mv .github/workflows/no-cheat-reconcile.yml /tmp/no-cheat-reconcile.yml
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          mv /tmp/no-cheat-reconcile.yml .github/workflows/no-cheat-reconcile.yml

      - name: Compile exact raw firmware boundary to WebAssembly
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='node' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core_node.mjs
          node tests/sil_wasm_smoke.mjs generated/flight_core_node.mjs

      - name: Bundle exact self-contained pages
        run: |
          set -euxo pipefail
          BUILD_DIR=/tmp/arondight45-no-cheat-final
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/simulator.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-controller.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          builds=[
            ('drone_simulator.html','<script type="module" src="./sim/simulator.mjs"></script>','/tmp/arondight45-simulator.bundle.mjs'),
            ('drone_controller.html','<script type="module" src="./sim/controller.mjs"></script>','/tmp/arondight45-controller.bundle.mjs'),
          ]
          for html_name,marker,bundle_name in builds:
            p=Path(html_name);html=p.read_text();assert marker in html
            bundle=Path(bundle_name).read_text().replace('</script','<\\/script')
            p.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
          test "$(wc -c < drone_simulator.html)" -gt 100000
          test "$(wc -c < drone_controller.html)" -gt 10000
          ! grep -q 'src="./sim/simulator.mjs"' drone_simulator.html
          ! grep -q 'src="./sim/controller.mjs"' drone_controller.html

      - name: Run latest strict browser flight gates
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/arondight45-static.log 2>&1 &
          HTTP_PID=$!
          cleanup(){ kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules; }
          trap cleanup EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/solo_layout_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/dual_phone_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/browser_sim_smoke.mjs http://127.0.0.1:4174/drone_simulator.html
          kill "$HTTP_PID" 2>/dev/null || true
          rm -f node_modules
          trap - EXIT

      - name: Restore build products and materialize exact tested source changes
        run: |
          set -euxo pipefail
          git restore --source=HEAD -- drone_simulator.html drone_controller.html
          rm -rf generated
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/simulator.mjs tools/s31_hil_bridge.mjs tests/architecture_invariants.mjs
          git diff --cached --check
          git commit -m 'Materialize latest-main raw hardware twin'
          git push origin HEAD:no-cheat-digital-twin

  esp-idf:
    needs: functional
    runs-on: ubuntu-latest
    container: espressif/idf@sha256:68085df693b34bacfd69984ae05bb1e3b475ea3d4684943cfeed5a39954850e7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: no-cheat-digital-twin
      - name: Build production firmware on ESP32-S31
        shell: bash
        run: |
          set -euxo pipefail
          . "$IDF_PATH/export.sh"
          rm -rf /tmp/arondight45-production && mkdir -p /tmp/arondight45-production/main
          cp esp32/Arondight45_DroneFC_Core.hpp esp32/Arondight45_StateControl.hpp esp32/Arondight45_HardwareSensors.hpp esp32/Arondight45_FirmwareRuntime.hpp esp32/Arondight45_DroneFC_S31.cpp /tmp/arondight45-production/main/
          cat > /tmp/arondight45-production/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(arondight45_s31_production)
          EOF
          cat > /tmp/arondight45-production/main/CMakeLists.txt <<'EOF'
          idf_component_register(SRCS "Arondight45_DroneFC_S31.cpp" INCLUDE_DIRS ".")
          EOF
          cd /tmp/arondight45-production
          python "$IDF_PATH/tools/idf.py" --preview set-target esp32s31
          python "$IDF_PATH/tools/idf.py" --preview build

      - name: Build physical HIL firmware on ESP32-S31
        shell: bash
        run: |
          set -euxo pipefail
          . "$IDF_PATH/export.sh"
          rm -rf /tmp/arondight45-hil && mkdir -p /tmp/arondight45-hil/main
          cp esp32/Arondight45_DroneFC_Core.hpp esp32/Arondight45_StateControl.hpp esp32/Arondight45_HardwareSensors.hpp esp32/Arondight45_FirmwareRuntime.hpp esp32/Arondight45_HIL_Protocol.hpp esp32/Arondight45_DroneFC_HIL_S31.cpp /tmp/arondight45-hil/main/
          cat > /tmp/arondight45-hil/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          include($ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(arondight45_s31_hil)
          EOF
          cat > /tmp/arondight45-hil/main/CMakeLists.txt <<'EOF'
          idf_component_register(SRCS "Arondight45_DroneFC_HIL_S31.cpp" INCLUDE_DIRS ".")
          EOF
          cd /tmp/arondight45-hil
          python "$IDF_PATH/tools/idf.py" --preview set-target esp32s31
          python "$IDF_PATH/tools/idf.py" --preview build
