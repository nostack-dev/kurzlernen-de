name: Repair aim grip latch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_aim_grip_latch_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep exact camera-local grip anchor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=p.read_text()
          old='function latchedPivotLocal(camera,out=desiredPivotCameraLocal){const fov=THREE.MathUtils.degToRad(clamp(Number(camera?.fov)||78,45,120)),halfHeight=Math.tan(fov*.5)*latchedPivotDepthM,aspect=Math.max(.4,Number(camera?.aspect)||1);return out.set(latchedPivotNdc.x*halfHeight*aspect,latchedPivotNdc.y*halfHeight,-latchedPivotDepthM);}'
          new='function latchedPivotLocal(camera,out=desiredPivotCameraLocal){return out.copy(latchedPivotCameraLocal);}'
          assert old in s, 'aim latch reconstruction contract changed'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          grep -q 'return out.copy(latchedPivotCameraLocal)' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Keep FPS aim grip fixed in camera space'
          git push origin HEAD:main
