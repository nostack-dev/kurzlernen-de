name: Apply authoritative local ARM gate
on:
  push:
    branches: ['fix/final-authoritative-arm']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Replace HUD-timed ARM assertion with authoritative FC timing
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_sim_smoke.mjs');s=p.read_text()
          old='''  await page.click("#touchArm");\n  localArmText=await page.$eval("#touchArm",e=>e.textContent||"");\n  if(!localArmText.includes("ON"))throw new Error(`local ARM button did not set request ON: ${localArmText}`);\n  const localArmStart=await simTime();await waitForSimTime(localArmStart+1.2,45000);\n  state=await page.$eval("#fcState",e=>e.textContent||"");\n  if(state!=="ARMED")throw new Error(`local fallback ARM failed through visible ARM control: ${JSON.stringify(await snapshot())}`);\n'''
          new='''  await page.click("#touchArm");\n  localArmText=await page.$eval("#touchArm",e=>e.textContent||"");\n  if(!localArmText.includes("ON"))throw new Error(`local ARM button did not set request ON: ${localArmText}`);\n  const localArmStart=await simTime();\n  await page.waitForFunction(()=>Boolean((Number(globalThis.__arondightDiagnostics?.fcState)||0)&1),{timeout:5000});\n  const authoritativeArmTime=await page.evaluate(()=>Number(globalThis.__arondightDiagnostics?.simTime||0));\n  const localArmLatency=authoritativeArmTime-localArmStart;\n  if(!(localArmLatency>=.95&&localArmLatency<=1.15))throw new Error(`local fallback ARM timing violated: ${localArmLatency.toFixed(3)} s · ${JSON.stringify(await snapshot())}`);\n  await page.waitForFunction(()=>(document.querySelector("#fcState")?.textContent||"")==="ARMED",{timeout:1000});\n  state=await page.$eval("#fcState",e=>e.textContent||"");\n  if(state!=="ARMED")throw new Error(`local fallback ARM HUD failed after authoritative ARM: ${JSON.stringify(await snapshot())}`);\n'''
          if s.count(old)!=1: raise SystemExit(f'expected one current ARM block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/browser_sim_smoke.mjs
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-authoritative-arm-gate.yml
          git add tests/browser_sim_smoke.mjs
          git commit -m 'Assert local ARM on authoritative FC timing'
          git push origin HEAD:fix/final-authoritative-arm
