name: One-shot presentation budget v2

on:
  push:
    branches: [perf/presentation-budget-v2]
    paths:
      - ".github/workflows/one-shot-presentation-budget-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reduce observer cost without touching simulation authority
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/simulator.mjs')
          s=p.read_text()
          replacements={
            'const PRESENTATION_HUD_INTERVAL_MS = 50;':'const PRESENTATION_HUD_INTERVAL_MS = 75;',
            'const PRESENTATION_AUDIO_INTERVAL_MS = 33;':'const PRESENTATION_AUDIO_INTERVAL_MS = 50;',
            'const PRESENTATION_SHADOW_INTERVAL_MS = 100;':'const PRESENTATION_SHADOW_INTERVAL_MS = 250;',
            'renderer.shadowMap.type=THREE.PCFSoftShadowMap;':'renderer.shadowMap.type=THREE.BasicShadowMap;',
          }
          for old,new in replacements.items():
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new,1)
          p.write_text(s)

          d=Path('REAL_WORLD_DIGITAL_TWIN.md')
          t=d.read_text()
          old='HUD refresh is capped at 20 Hz, continuous motor-audio parameter refresh at about 30 Hz, and shadow-map refresh at 10 Hz while the normal image renderer remains adaptive.'
          new='HUD refresh is capped at about 13 Hz, continuous motor-audio parameter refresh at 20 Hz, and shadow-map refresh at 4 Hz while the normal image renderer remains adaptive; WebGL uses the lower-cost basic shadow sampler so shadow presentation cannot dominate the 1 kHz authority path.'
          assert t.count(old)==1,t.count(old)
          d.write_text(t.replace(old,new,1))

          a=Path('tests/architecture_invariants.mjs')
          u=a.read_text()
          old='requireText("sim/simulator.mjs","renderer.shadowMap.autoUpdate=false");\n'
          new=old+'requireText("sim/simulator.mjs","renderer.shadowMap.type=THREE.BasicShadowMap");\n'
          assert u.count(old)==1,u.count(old)
          a.write_text(u.replace(old,new,1))
          PY
          rm .github/workflows/one-shot-presentation-budget-v2.yml
          node --check sim/simulator.mjs
          node --check tests/browser_sim_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Lower presentation cost without changing flight cadence"
          git push origin HEAD:perf/presentation-budget-v2
