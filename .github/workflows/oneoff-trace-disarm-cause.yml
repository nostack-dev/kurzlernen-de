name: Trace first GAME disarm cause
on:
  push:
    branches: [main]
    paths: [".github/workflows/oneoff-trace-disarm-cause.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Add first-transition trace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/dual_phone_smoke.mjs'); s=p.read_text()
          old='''  console.log(`State-control E2E: GAME armed after ${armingDuration.toFixed(3)} simulated seconds.`);\n\n  try{\n'''
          new='''  console.log(`State-control E2E: GAME armed after ${armingDuration.toFixed(3)} simulated seconds.`);\n\n  const stateTrace=[];\n  const traceTimer=setInterval(async()=>{\n    try{\n      const v=await snapshot(view);\n      const c=await controller.evaluate(()=>({arm:document.querySelector("#arm")?.textContent||"",sensor:document.querySelector("#gameSensorStatus")?.textContent||"",connection:document.querySelector("#connection")?.textContent||""}));\n      const point={wall:Date.now(),...v,controllerArm:c.arm,sensor:c.sensor,controllerConnection:c.connection};\n      const prev=stateTrace[stateTrace.length-1];\n      if(!prev||prev.state!==point.state||prev.remote!==point.remote||prev.armSwitch!==point.armSwitch||prev.sensor!==point.sensor||prev.controllerArm!==point.controllerArm)stateTrace.push(point);\n    }catch{}\n  },75);\n\n  try{\n'''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='''    throw new Error(`2m AGL convergence timeout: snapshot=${JSON.stringify(await snapshot(view))} trace=${JSON.stringify(aglTrace)}`);\n  }\n'''
          new='''    clearInterval(traceTimer);\n    throw new Error(`2m AGL convergence timeout: snapshot=${JSON.stringify(await snapshot(view))} transitions=${JSON.stringify(stateTrace)} trace=${JSON.stringify(aglTrace)}`);\n  }\n  clearInterval(traceTimer);\n'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/dual_phone_smoke.mjs
      - name: Commit diagnostic and self-remove
        run: |
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add tests/dual_phone_smoke.mjs
          git rm .github/workflows/oneoff-trace-disarm-cause.yml
          git commit -m "Trace first GAME disarm transition"
          git pull --rebase origin main
          git push origin HEAD:main
