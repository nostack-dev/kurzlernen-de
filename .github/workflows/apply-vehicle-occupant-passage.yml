name: Apply vehicle occupant passage patch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-vehicle-occupant-passage.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_vehicle_occupant_passage_patch.py
      - name: Static contracts
        run: |
          node --check sim/player_human_rig.mjs
          node --check sim/player_car_mode.mjs
          node --check sim/first_person_weapon_runtime_v3.mjs
          node --check sim/vs_player_state_replication.mjs
          node tests/player_multiplayer_replication_contract_test.mjs
      - name: Box3D physical corridor
        run: |
          mkdir -p /tmp/vehicle-box3d
          cd /tmp/vehicle-box3d
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund box3d.js@0.1.1
          cd "$GITHUB_WORKSPACE"
          node tests/world_rigid_body_physics_box3d_test.mjs /tmp/vehicle-box3d/node_modules/box3d.js/dist/box3d.inline.mjs
      - name: Commit runtime patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/player_human_rig.mjs sim/player_car_mode.mjs sim/first_person_weapon_runtime_v3.mjs sim/vs_player_state_replication.mjs tests/player_multiplayer_replication_contract_test.mjs tests/world_rigid_body_physics_box3d_test.mjs
          git commit -m 'Seat player in vehicles and preserve physical passages'
          git push origin HEAD:main
