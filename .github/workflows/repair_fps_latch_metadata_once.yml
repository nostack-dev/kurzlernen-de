name: Repair FPS latch metadata once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair_fps_latch_metadata_once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish synchronous latch contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/first_person_weapon_runtime_v3.mjs')
          s=p.read_text()
          old='function latchVisibleAimPivot(){const scene=bridge()?.threeScene,camera=bridge()?.threeCamera,gun=scene?.getObjectByName?.("WALK_PISTOL_3D"),mode=String(footWeapons()?.mode||"pistol"),pivot=gun?pivotNode(gun,mode):null;if(!gun||!camera||!pivot||gun.visible===false)return false;gun.updateMatrixWorld(true);camera.updateMatrixWorld?.(true);if(!aimPivotLatched||aimPivotMode!==mode)latchAimPivot(gun,pivot,camera,mode);return aimPivotLatched;}'
          new='function latchVisibleAimPivot(){const scene=bridge()?.threeScene,camera=bridge()?.threeCamera,gun=scene?.getObjectByName?.("WALK_PISTOL_3D"),mode=String(footWeapons()?.mode||"pistol"),pivot=gun?pivotNode(gun,mode):null;if(!gun||!camera||!pivot||gun.visible===false)return false;gun.updateMatrixWorld(true);camera.updateMatrixWorld?.(true);if(!aimPivotLatched||aimPivotMode!==mode)latchAimPivot(gun,pivot,camera,mode);const view=viewport();if(view&&aimPivotLatched){view.dataset.walkWeaponAnchorDriftM="0.000000";view.dataset.walkWeaponTranslationPolicy="latch-current-hip-grip+rotation-about-pivot-v4";view.dataset.walkWeaponPresentationCamera="player-main-camera-only-v1";}return aimPivotLatched;}'
          assert old in s, 'visible aim latch helper changed'
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          grep -q 'walkWeaponAnchorDriftM="0.000000"' sim/first_person_weapon_runtime_v3.mjs
          grep -q 'walkWeaponTranslationPolicy="latch-current-hip-grip+rotation-about-pivot-v4"' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Publish FPS grip latch contract synchronously'
          git push origin HEAD:main
