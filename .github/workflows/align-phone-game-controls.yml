name: Align phone GAME controls

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/align-phone-game-controls.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unify GAME stick semantics
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              assert count==1, f"{path}: expected exactly one match, got {count}"
              p.write_text(text.replace(old,new,1))

          semantics=Path("sim/control_semantics.mjs")
          text=semantics.read_text()
          marker='export function applyStick(controls,kind,point,settings=DEFAULT_PHONE_SETTINGS){\n'
          assert marker in text
          shared='''export function applyGameStick(controls,kind,point,settings=DEFAULT_PHONE_SETTINGS){
  const cfg=normalizePhoneSettings(settings);
  if(kind==="left"){
    const x=cfg.invertLeftHorizontal?-point.x:point.x;
    controls.roll=cfg.lockLeftHorizontal?0:phoneAxis(x,cfg.leftFineness);
    controls.pitch=phoneAxis(-point.y,cfg.leftFineness);
    controls.throttle=0;
  }else{
    const x=cfg.invertRightHorizontal?-point.x:point.x;
    const y=cfg.invertRightVertical?-point.y:point.y;
    controls.yaw=phoneAxis(-x,cfg.rightFineness);
    controls.bodyPitch=cfg.lockRightHorizontal?0:phoneAxis(-y,cfg.rightFineness);
  }
  return controls;
}
export function gameKnobAxes(controls,kind,settings=DEFAULT_PHONE_SETTINGS){
  const cfg=normalizePhoneSettings(settings);
  if(kind==="left"){
    const rawX=cfg.lockLeftHorizontal?0:inversePhoneAxis(controls.roll,cfg.leftFineness);
    return{x:cfg.invertLeftHorizontal?-rawX:rawX,y:-inversePhoneAxis(controls.pitch,cfg.leftFineness)};
  }
  const rawX=-inversePhoneAxis(controls.yaw,cfg.rightFineness);
  const rawY=cfg.lockRightHorizontal?0:-inversePhoneAxis(controls.bodyPitch||0,cfg.rightFineness);
  return{x:cfg.invertRightHorizontal?-rawX:rawX,y:cfg.invertRightVertical?-rawY:rawY};
}

'''
          semantics.write_text(text.replace(marker,shared+marker,1))

          replace_once(
            "sim/controller.mjs",
            'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis}',
            'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes}'
          )
          replace_once(
            "sim/controller.mjs",
            '''    const leftRawX=phoneSettings.lockLeftHorizontal?0:inversePhoneAxis(controls.roll,phoneSettings.leftFineness);
    left={x:phoneSettings.invertLeftHorizontal?-leftRawX:leftRawX,y:-inversePhoneAxis(controls.pitch,phoneSettings.leftFineness)};
    const rawX=-inversePhoneAxis(controls.yaw,phoneSettings.rightFineness),rawY=phoneSettings.lockRightHorizontal?0:-inversePhoneAxis(controls.bodyPitch||0,phoneSettings.rightFineness);
    right={x:phoneSettings.invertRightHorizontal?-rawX:rawX,y:phoneSettings.invertRightVertical?-rawY:rawY};''',
            '''    left=gameKnobAxes(controls,"left",phoneSettings);
    right=gameKnobAxes(controls,"right",phoneSettings);'''
          )
          replace_once(
            "sim/controller.mjs",
            '''    if(gameMode){
      if(kind==="left"){
        const x=phoneSettings.invertLeftHorizontal?-point.x:point.x;
        controls.roll=phoneSettings.lockLeftHorizontal?0:phoneAxis(x,phoneSettings.leftFineness);
        controls.pitch=phoneAxis(-point.y,phoneSettings.leftFineness);
        controls.throttle=0;
      }else{
        const x=phoneSettings.invertRightHorizontal?-point.x:point.x;
        const y=phoneSettings.invertRightVertical?-point.y:point.y;
        controls.yaw=phoneAxis(-x,phoneSettings.rightFineness);
        controls.bodyPitch=phoneSettings.lockRightHorizontal?0:phoneAxis(-y,phoneSettings.rightFineness);
      }
    }else applyStick(controls,kind,point,phoneSettings);''',
            '''    if(gameMode)applyGameStick(controls,kind,point,phoneSettings);
    else applyStick(controls,kind,point,phoneSettings);'''
          )

          replace_once(
            "sim/simulator.mjs",
            'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis}',
            'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes}'
          )
          replace_once(
            "sim/simulator.mjs",
            '''  const left={x:phoneSettings.lockLeftHorizontal?0:inversePhoneAxis(soloControls.roll,phoneSettings.leftFineness),y:-inversePhoneAxis(soloControls.pitch,phoneSettings.leftFineness)};
  const rawX=-inversePhoneAxis(soloControls.yaw,phoneSettings.rightFineness),rawY=phoneSettings.lockRightHorizontal?0:-inversePhoneAxis(soloControls.bodyPitch||0,phoneSettings.rightFineness);
  const right={x:phoneSettings.invertRightHorizontal?-rawX:rawX,y:phoneSettings.invertRightVertical?-rawY:rawY};''',
            '''  const left=gameKnobAxes(soloControls,"left",phoneSettings);
  const right=gameKnobAxes(soloControls,"right",phoneSettings);'''
          )
          replace_once(
            "sim/simulator.mjs",
            '''  const apply=e=>{const point=normalizedPointer(el,e);if(kind==="left"){soloControls.roll=phoneSettings.lockLeftHorizontal?0:phoneAxis(point.x,phoneSettings.leftFineness);soloControls.pitch=phoneAxis(-point.y,phoneSettings.leftFineness);soloControls.throttle=0;}else{const x=phoneSettings.invertRightHorizontal?-point.x:point.x,y=phoneSettings.invertRightVertical?-point.y:point.y;soloControls.yaw=phoneAxis(-x,phoneSettings.rightFineness);soloControls.bodyPitch=phoneSettings.lockRightHorizontal?0:phoneAxis(-y,phoneSettings.rightFineness);}updateSoloSticks();e.preventDefault();};''',
            '''  const apply=e=>{const point=normalizedPointer(el,e);applyGameStick(soloControls,kind,point,phoneSettings);updateSoloSticks();e.preventDefault();};'''
          )

          replace_once(
            "tests/control_semantics_test.mjs",
            'knobAxes,phoneAxis,inversePhoneAxis,finenessToExpo,normalizedPointer,endPointerDrag',
            'knobAxes,phoneAxis,inversePhoneAxis,finenessToExpo,normalizedPointer,endPointerDrag,applyGameStick,gameKnobAxes'
          )
          test=Path("tests/control_semantics_test.mjs")
          text=test.read_text()
          marker='// Re-touching a retained throttle must not teleport it to the absolute touch point.\n'
          assert marker in text
          block='''// GAME mode is one shared semantic path for both 1-PHONE and 2-PHONE.
// Pointer geometry stays under the finger while each configured axis inversion
// changes only the commanded physical axis.
const gameDefault={...DEFAULT_PHONE_SETTINGS};
c=neutralControls();applyGameStick(c,"left",{x:.4,y:-.3},gameDefault);
near(c.roll,phoneAxis(.4,gameDefault.leftFineness));near(c.pitch,phoneAxis(.3,gameDefault.leftFineness));assert.equal(c.throttle,0);
let gameKnob=gameKnobAxes(c,"left",gameDefault);near(gameKnob.x,.4,3e-6);near(gameKnob.y,-.3,3e-6);
const gameInvertLeft={...gameDefault,invertLeftHorizontal:true};
c=neutralControls();applyGameStick(c,"left",{x:.4,y:-.3},gameInvertLeft);
near(c.roll,phoneAxis(-.4,gameInvertLeft.leftFineness));near(c.pitch,phoneAxis(.3,gameInvertLeft.leftFineness));
gameKnob=gameKnobAxes(c,"left",gameInvertLeft);near(gameKnob.x,.4,3e-6);near(gameKnob.y,-.3,3e-6);
const gameRightInvert={...gameDefault,invertRightHorizontal:true,invertRightVertical:true};
c=neutralControls();applyGameStick(c,"right",{x:.35,y:-.25},gameRightInvert);
near(c.yaw,phoneAxis(.35,gameRightInvert.rightFineness));near(c.bodyPitch,phoneAxis(-.25,gameRightInvert.rightFineness));
gameKnob=gameKnobAxes(c,"right",gameRightInvert);near(gameKnob.x,.35,3e-6);near(gameKnob.y,-.25,3e-6);
const gameLocked={...gameDefault,lockLeftHorizontal:true,lockRightHorizontal:true};
c=neutralControls();applyGameStick(c,"left",{x:.8,y:-.4},gameLocked);assert.equal(c.roll,0);near(c.pitch,phoneAxis(.4,gameLocked.leftFineness));
applyGameStick(c,"right",{x:.6,y:.7},gameLocked);near(c.yaw,phoneAxis(-.6,gameLocked.rightFineness));assert.equal(c.bodyPitch,0);

'''
          test.write_text(text.replace(marker,block+marker,1))
          PY

          node --check sim/control_semantics.mjs
          node --check sim/controller.mjs
          node --check sim/simulator.mjs
          node --check tests/control_semantics_test.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs

          # The final production tree must retain only the two real workflows.
          rm .github/workflows/align-phone-game-controls.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 2

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/control_semantics.mjs sim/controller.mjs sim/simulator.mjs tests/control_semantics_test.mjs .github/workflows/align-phone-game-controls.yml
          git diff --cached --check
          git commit -m "Unify one-phone and two-phone GAME controls"
          git push origin HEAD:main
