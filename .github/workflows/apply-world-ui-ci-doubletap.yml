name: Apply WORLD UI CI double-tap fix

on:
  push:
    branches: ["fix/world-ui-ci-doubletap"]

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch only the overloaded-CI timing dependency
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke_impl.mjs')
          s=p.read_text()
          old='send("pointerdown",71);send("pointerup",71);await new Promise(resolve=>setTimeout(resolve,120));send("pointerdown",72);send("pointerup",72);'
          new='send("pointerdown",71);send("pointerup",71);send("pointerdown",72);send("pointerup",72);'
          assert old in s, 'expected 120 ms minimap test sequence missing'
          s=s.replace(old,new,1)
          anchor='const bootstrap=readFileSync("sim/real_world_bootstrap.mjs","utf8");'
          assertion='\nif(!bootstrap.includes("now-this.lastMinimapTapMs<360"))throw new Error("minimap double-tap 360 ms runtime contract missing");'
          assert assertion.strip() not in s
          s=s.replace(anchor,anchor+assertion,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- tests/real_world_ui_smoke_impl.mjs
      - name: Build exact bundled simulator
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          BUILD_DIR=/tmp/arondight-world-ui-fix
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1 \
            qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html'); html=p.read_text(); marker='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>'; assert marker in html
          bundle=Path('/tmp/arondight45-simulator.bundle.mjs').read_text().replace('</script','<\\/script')
          p.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
      - name: Run exact WORLD UI gate
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome)"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/world-ui-static.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules; rm -rf generated' EXIT
          sleep 1
          ok=0
          for attempt in 1 2 3; do
            if timeout 180s env CHROME_BIN="$CHROME_BIN" node tests/real_world_ui_smoke.mjs http://127.0.0.1:4174; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
      - name: Commit verified test fix
        run: |
          set -euxo pipefail
          git checkout -- drone_simulator.html 2>/dev/null || true
          rm -rf generated
          rm -f node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/real_world_ui_smoke_impl.mjs
          git diff --cached --check
          git commit -m "Make WORLD minimap double-tap gate deterministic"
          git push origin HEAD:fix/world-ui-ci-doubletap
