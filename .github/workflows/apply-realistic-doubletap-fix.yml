name: Apply realistic double tap fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch realistic double tap touch timing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch realistic touch timing and run browser gate
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/flight_fire_fx.mjs')
          s=p.read_text()
          s=s.replace('const TOUCH_DOUBLE_TAP_MS=330;','const TOUCH_DOUBLE_TAP_MS=380;',1)
          s=s.replace('const TOUCH_DOUBLE_TAP_PX=36;','const TOUCH_DOUBLE_TAP_PX=56;',1)
          s=s.replace('const TOUCH_HOLD_FIRE_MS=115;','const TOUCH_HOLD_FIRE_MS=500;',1)
          p.write_text(s)

          p=Path('sim/vs_combat_presentation.mjs')
          s=p.read_text()
          s=s.replace('const BEACON_DOUBLE_TAP_MS=330;','const BEACON_DOUBLE_TAP_MS=380;',1)
          s=s.replace('const BEACON_DOUBLE_TAP_PX=36;','const BEACON_DOUBLE_TAP_PX=56;',1)
          p.write_text(s)

          p=Path('tests/vs_combat_browser_smoke.mjs')
          s=p.read_text()
          old='''const touchTap=async(x,y,id)=>{viewport.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,pointerType:"touch",pointerId:id,button:0,clientX:x,clientY:y}));await sleep(42);viewport.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,pointerType:"touch",pointerId:id,button:0,clientX:x,clientY:y}));};await touchTap(tapX,tapY,51);await sleep(80);await touchTap(tapX+2,tapY+2,52);'''
          new='''const touchTap=async(x,y,id)=>{viewport.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,pointerType:"touch",pointerId:id,button:0,clientX:x,clientY:y}));await sleep(220);viewport.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,pointerType:"touch",pointerId:id,button:0,clientX:x,clientY:y}));};await touchTap(tapX,tapY,51);await sleep(100);await touchTap(tapX+18,tapY+12,52);'''
          assert old in s, 'old synthetic tap timing not found'
          s=s.replace(old,new,1)
          s=s.replace('zero-shot double-tap shared target beacon,','realistic zero-shot double-tap shared target beacon,',1)
          p.write_text(s)
          PY
          node --check sim/flight_fire_fx.mjs
          node --check sim/vs_combat_presentation.mjs
          node --check tests/vs_combat_browser_smoke.mjs
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          BUILD_DIR=/tmp/arondight45-web-build
          mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1 qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drone_simulator.html')
          marker='<script type="module" src="./sim/real_world_bootstrap.mjs"></script>'
          html=p.read_text(); assert marker in html
          bundle=Path('/tmp/arondight45-simulator.bundle.mjs').read_text().replace('</script','<\\/script')
          p.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/static.log 2>&1 &
          HTTP_PID=$!
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/vs_combat_browser_smoke.mjs http://127.0.0.1:4174
          kill "$HTTP_PID" 2>/dev/null || true
          git checkout -- drone_simulator.html generated/flight_core.mjs || true
          git clean -f generated/flight_core.mjs || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/flight_fire_fx.mjs sim/vs_combat_presentation.mjs tests/vs_combat_browser_smoke.mjs
          git commit -m 'Fix real-device double tap fire arbitration'
          git push origin HEAD:main
