name: Align state runtime browser smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/state-test-maintenance.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact runtime label assertion
        run: |
          set -euxo pipefail
          python3 -c 'from pathlib import Path; p=Path("tests/browser_sim_smoke.mjs"); s=p.read_text(); old="shared fc::Runtime / WASM"; new="shared fc::StateRuntime → fc::Runtime / WASM"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          node --check tests/browser_sim_smoke.mjs
          git diff --check
      - name: Commit test alignment
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add tests/browser_sim_smoke.mjs
          git commit -m "Align browser smoke with state runtime"
          git push origin HEAD:main
