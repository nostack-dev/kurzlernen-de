name: Remove imagery migration once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-imagery-migration-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy imagery persistence migration
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/world_liveliness.mjs'); s=p.read_text()
          s=s.replace('const IMAGERY_STORAGE="arondight45WorldImageryV1";\nconst IMAGERY_DEFAULT_OFF_MIGRATION="arondight45WorldImageryDefaultOffV3";\n','')
          s=s.replace(',mapStyledFor=null,forcedDefaultOff=false;',',mapStyledFor=null;')
          block='''function forceSatelliteDefaultOff(){\n  try{\n    if(localStorage.getItem(IMAGERY_DEFAULT_OFF_MIGRATION)==="1")return false;\n    localStorage.setItem(IMAGERY_STORAGE,"0");\n    localStorage.setItem(IMAGERY_DEFAULT_OFF_MIGRATION,"1");\n    forcedDefaultOff=true;\n    return true;\n  }catch{return false;}\n}\nforceSatelliteDefaultOff();\n\n'''
          assert block in s
          s=s.replace(block,'',1)
          old='function syncDefaultOff(){const b=bridge();if(!b)return;if(forcedDefaultOff&&b.imageryEnabled!==false){b.setImageryEnabled?.(false);forcedDefaultOff=false;}const v=viewport();if(v){v.dataset.worldSatelliteDefault="off";v.dataset.worldImageryDefault="0";}}'
          new='function syncDefaultOff(){const v=viewport();if(v){v.dataset.worldSatelliteDefault="off";v.dataset.worldImageryDefault="0";}}'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check sim/world_liveliness.mjs
          ! grep -q 'arondight45WorldImageryDefaultOffV3' sim/world_liveliness.mjs
          ! grep -q 'localStorage.setItem(IMAGERY_STORAGE' sim/world_liveliness.mjs
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/world_liveliness.mjs
          git commit -m 'Remove legacy satellite storage migration'
          git push origin HEAD:main
