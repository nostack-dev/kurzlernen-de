name: Apply camera and enemy stability fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply camera and enemy stability fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch camera collision and VS stale hold
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Reusable Box3D camera segment resolver.
          path=Path('sim/world_building_collision_physics.mjs')
          text=path.read_text()
          marker='export function destroyWorldBuildingCollisionBodies(b3,state){if(state?.body&&b3.b3Body_IsValid(state.body))b3.b3DestroyBody(state.body);}'
          assert marker in text and 'resolveBox3dCameraPath' not in text
          helper='''export function resolveBox3dCameraPath(b3,world,anchor,desired,{queryCategoryBits=8n,terrainCategoryBits=1n,clearanceM=.08}={}){\n  const from=Array.isArray(anchor)?anchor.map(Number):[],to=Array.isArray(desired)?desired.map(Number):[];if(from.length!==3||to.length!==3||![...from,...to].every(Number.isFinite))return{position:to.length===3?to:[0,0,0],collided:false,fraction:1,hitDistanceM:0};\n  const delta=[to[0]-from[0],to[1]-from[1],to[2]-from[2]],distance=Math.hypot(...delta);if(!world||distance<1e-6)return{position:[...to],collided:false,fraction:1,hitDistanceM:distance};\n  const filter=b3.b3DefaultQueryFilter();filter.categoryBits=BigInt(queryCategoryBits);filter.maskBits=BigInt(terrainCategoryBits);const hit=b3.b3World_CastRayClosest(world,from,delta,filter),fraction=Number(hit?.fraction);\n  if(!hit?.hit||!Number.isFinite(fraction)||fraction<0||fraction>1)return{position:[...to],collided:false,fraction:1,hitDistanceM:distance};\n  const hitDistance=Math.max(0,Math.min(distance,fraction*distance)),safeDistance=Math.max(0,hitDistance-Math.max(.01,Number(clearanceM)||.08)),scale=safeDistance/distance;return{position:[from[0]+delta[0]*scale,from[1]+delta[1]*scale,from[2]+delta[2]*scale],collided:true,fraction,hitDistanceM:hitDistance};\n}\n\n'''
          path.write_text(text.replace(marker,helper+marker,1))

          # 2) Camera query category in the same physical Ground/Building world.
          path=Path('sim/simulator.mjs')
          text=path.read_text()
          old='import {normalizeBuildingCollisionSnapshot,createWorldBuildingCollisionBodies,destroyWorldBuildingCollisionBodies} from "./world_building_collision_physics.mjs";'
          new='import {normalizeBuildingCollisionSnapshot,createWorldBuildingCollisionBodies,destroyWorldBuildingCollisionBodies,resolveBox3dCameraPath} from "./world_building_collision_physics.mjs";'
          assert old in text and 'resolveBox3dCameraPath' not in text
          text=text.replace(old,new,1)
          old='const QUERY_RANGEFINDER = 4n;'
          new='const QUERY_RANGEFINDER = 4n;\nconst QUERY_CAMERA = 8n;'
          assert old in text and 'QUERY_CAMERA = 8n' not in text
          text=text.replace(old,new,1)
          old='groundShape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER,groupIndex:0};'
          new='groundShape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,groupIndex:0};'
          assert old in text
          text=text.replace(old,new,1)
          old='createWorldBuildingCollisionBodies(b3,this.world,this.worldBuildingCollisionSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER})'
          new='createWorldBuildingCollisionBodies(b3,this.world,this.worldBuildingCollisionSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA})'
          assert old in text
          text=text.replace(old,new,1)
          marker='  imuRaw(dt=DT){'
          method='  resolveCameraPath(anchor,desired){return resolveBox3dCameraPath(b3,this.world,anchor,desired,{queryCategoryBits:QUERY_CAMERA,terrainCategoryBits:COLLISION_TERRAIN,clearanceM:.08});}\n'
          assert marker in text and method not in text
          text=text.replace(marker,method+marker,1)
          marker='let physics=new PhysicsModel(defaultParams(),{graphics:true,scene});'
          attach=marker+'\nglobalThis.__arondightRealWorld?.attachCameraCollisionResolver?.((anchor,desired)=>physics.resolveCameraPath(anchor,desired));'
          assert marker in text and 'attachCameraCollisionResolver?.((anchor,desired)=>physics.resolveCameraPath' not in text
          text=text.replace(marker,attach,1)
          path.write_text(text)

          # 3) Universal render-time camera constraint, including free-look.
          path=Path('sim/real_world_bootstrap.mjs')
          text=path.read_text()
          old='this.buildingCollisionRevisions=0;'
          new='this.buildingCollisionRevisions=0;this.cameraCollisionResolver=null;'
          assert old in text and 'cameraCollisionResolver=null' not in text
          text=text.replace(old,new,1)
          start=text.index('  applyLookCamera(scene,camera){')
          end=text.index('  configureMinimapLayers(){',start)
          replacement='''  attachCameraCollisionResolver(resolver){this.cameraCollisionResolver=typeof resolver==="function"?resolver:null;}\n  constrainCameraToPhysics(anchor,camera){\n    if(typeof this.cameraCollisionResolver!=="function"||!anchor||!camera?.position)return false;let result=null;try{result=this.cameraCollisionResolver([anchor.x,anchor.y,anchor.z],[camera.position.x,camera.position.y,camera.position.z]);}catch{return false;}const position=result?.position;if(Array.isArray(position)&&position.length===3&&position.every(Number.isFinite))camera.position.set(...position);const viewport=$("viewport");if(viewport){viewport.dataset.cameraCollision=result?.collided?"blocked":"clear";viewport.dataset.cameraCollisionHitDistanceM=Number(result?.hitDistanceM||0).toFixed(3);}return Boolean(result?.collided);\n  }\n  applyLookCamera(scene,camera){\n    this.stepLook(performance.now());const mode=$("viewport")?.dataset.cameraMode||"follow",airframe=this.airframeFor(scene);if(!airframe)return;const target=airframe.position.clone();if(mode!=="fpv")target.z+=.10;const hasLook=Math.abs(this.lookYawDeg)>=.001||Math.abs(this.lookPitchDeg)>=.001;if(!hasLook){this.constrainCameraToPhysics(target,camera);return;}const yaw=THREE.MathUtils.degToRad(this.lookYawDeg),pitch=THREE.MathUtils.degToRad(this.lookPitchDeg),worldUp=new THREE.Vector3(0,0,1);\n    if(mode==="fpv"){const dir=new THREE.Vector3();camera.getWorldDirection(dir).normalize();const up=camera.up.clone().normalize(),yawQ=new THREE.Quaternion().setFromAxisAngle(worldUp,-yaw);dir.applyQuaternion(yawQ);up.applyQuaternion(yawQ);const right=new THREE.Vector3().crossVectors(dir,up).normalize(),pitchQ=new THREE.Quaternion().setFromAxisAngle(right,pitch);dir.applyQuaternion(pitchQ);up.applyQuaternion(pitchQ);camera.up.copy(up.normalize());this.constrainCameraToPhysics(target,camera);camera.lookAt(camera.position.clone().addScaledVector(dir,4));return;}\n    const relative=camera.position.clone().sub(target);relative.applyAxisAngle(worldUp,-yaw);const radial=relative.clone().normalize(),right=new THREE.Vector3().crossVectors(radial,worldUp);if(right.lengthSq()>.0001)relative.applyAxisAngle(right.normalize(),pitch);camera.position.copy(target).add(relative);this.constrainCameraToPhysics(target,camera);camera.up.copy(worldUp);camera.lookAt(target);\n  }\n'''
          text=text[:start]+replacement+text[end:]
          old='this.vsPeerTimeline.reset();this.vsPeerLastPoseMs=-Infinity;if(this.vsPeerMesh)this.vsPeerMesh.visible=false;const viewport=$("viewport");if(viewport){delete viewport.dataset.vsPoseMode;delete viewport.dataset.vsPoseAgeMs;}'
          new='this.vsPeerTimeline.reset();this.vsPeerLastPoseMs=-Infinity;if(this.vsPeerMesh)this.vsPeerMesh.visible=false;const viewport=$("viewport");if(viewport){delete viewport.dataset.vsPoseMode;delete viewport.dataset.vsPoseAgeMs;delete viewport.dataset.vsPoseHeld;}'
          assert old in text
          text=text.replace(old,new,1)
          old='this.updateVsExplosion();if(!this.vsPeerMesh)return;if(this.vsPeerDead){this.vsPeerMesh.visible=false;return;}const sample=this.vsPeerTimeline.sample(performance.now());if(!sample||sample.stale){this.vsPeerMesh.visible=false;return;}this.vsPeerMesh.position.set(...sample.p);this.vsPeerMesh.quaternion.set(...sample.q);this.vsPeerMesh.visible=true;const viewport=$("viewport");if(viewport){viewport.dataset.vsPoseMode=sample.mode;viewport.dataset.vsPoseAgeMs=sample.ageMs.toFixed(1);}'
          new='this.updateVsExplosion();if(!this.vsPeerMesh)return;if(this.vsPeerDead){this.vsPeerMesh.visible=false;return;}const sample=this.vsPeerTimeline.sample(performance.now());if(!sample){this.vsPeerMesh.visible=false;return;}if(sample.stale&&!this.vsConnected){this.vsPeerMesh.visible=false;return;}this.vsPeerMesh.position.set(...sample.p);this.vsPeerMesh.quaternion.set(...sample.q);this.vsPeerMesh.visible=true;const viewport=$("viewport");if(viewport){viewport.dataset.vsPoseMode=sample.stale?"stale-hold":sample.mode;viewport.dataset.vsPoseAgeMs=sample.ageMs.toFixed(1);viewport.dataset.vsPoseHeld=sample.stale?"1":"0";}'
          assert old in text
          text=text.replace(old,new,1)
          path.write_text(text)

          # 4) Enemy tracker follows session liveness, not an arbitrary 1.4 s pose timer.
          path=Path('sim/vs_combat_presentation.mjs')
          text=path.read_text()
          start=text.index('function updateEnemyMarker(currentBridge,now){')
          end=text.index('function updateRespawnHud(currentBridge){',start)
          replacement='''function updateEnemyMarker(currentBridge,now){if(!marker)return;const peer=currentBridge?.vsPeerMesh,camera=currentBridge?.threeCamera,view=viewport(),hasPose=Number.isFinite(currentBridge?.vsPeerLastPoseMs),poseAgeMs=hasPose?Math.max(0,now-currentBridge.vsPeerLastPoseMs):Infinity,signalHold=hasPose&&poseAgeMs>=STALE_PEER_MS;if(!currentBridge?.vsConnected||!peer||!camera||!view||(!hasPose&&!currentBridge.vsPeerDead)){marker.hidden=true;return;}const rect=view.getBoundingClientRect();if(rect.width<1||rect.height<1){marker.hidden=true;return;}peer.updateWorldMatrix?.(true,false);camera.updateMatrixWorld?.(true);peer.getWorldPosition(worldPosition);camera.getWorldPosition(cameraPosition);projected.copy(worldPosition).project(camera);cameraSpace.copy(worldPosition).applyMatrix4(camera.matrixWorldInverse);const inFront=cameraSpace.z<0;let nx=projected.x,ny=projected.y;if(!inFront){nx=-nx;ny=-ny;}const marginX=Math.min(74,rect.width*.14),marginY=Math.min(54,rect.height*.18),halfW=Math.max(1,rect.width/2-marginX),halfH=Math.max(1,rect.height/2-marginY);let sx=nx*rect.width/2,sy=-ny*rect.height/2;const scale=Math.min(1,halfW/Math.max(1,Math.abs(sx)),halfH/Math.max(1,Math.abs(sy)));sx*=scale;sy*=scale;const x=rect.width/2+sx,y=rect.height/2+sy,onScreen=inFront&&Math.abs(projected.x)<.92&&Math.abs(projected.y)<.84&&projected.z>-1&&projected.z<1;marker.hidden=false;marker.classList.toggle("offscreen",!onScreen);marker.classList.toggle("dead",Boolean(currentBridge.vsPeerDead));marker.classList.toggle("signal-hold",signalHold&&!currentBridge.vsPeerDead);marker.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-50%)`;const pointer=marker.querySelector(".vs-enemy-pointer");if(pointer)pointer.style.transform=`rotate(${(Math.atan2(sy,sx)*180/Math.PI+90).toFixed(1)}deg)`;const distance=Math.max(0,ownDroneWorldPosition(currentBridge).distanceTo(worldPosition)),health=clamp(Math.round(Number(currentBridge.vsPeerHealth)||0),0,100),label=marker.querySelector("strong"),detail=marker.querySelector("small"),hpFill=marker.querySelector(".vs-enemy-hp>b");if(label)label.textContent=currentBridge.vsPeerDead?"ENEMY DOWN":signalHold?"ENEMY · HOLD":"ENEMY";if(detail){if(currentBridge.vsPeerDead){const remaining=respawnRemainingMs(peerDeathAt);detail.textContent=remaining>0?`RESPAWN ${(remaining/1000).toFixed(1)}s`:"RESPAWNING…";}else detail.textContent=signalHold?`LINK HOLD · ${distance<100?distance.toFixed(1):Math.round(distance)} m`:`HP ${health} · ${distance<100?distance.toFixed(1):Math.round(distance)} m`;}if(hpFill)hpFill.style.transform=`scaleX(${health/100})`;view.dataset.vsEnemyMarker=onScreen?"onscreen":"offscreen";view.dataset.vsEnemyDistanceM=distance.toFixed(2);view.dataset.vsEnemyHealth=String(health);view.dataset.vsEnemySignal=signalHold?"hold":"live";}\n'''
          text=text[:start]+replacement+text[end:]
          css='#vsEnemyMarker.dead strong,#vsEnemyMarker.dead small{color:#ffc070}'
          assert css in text and '#vsEnemyMarker.signal-hold' not in text
          text=text.replace(css,css+'#vsEnemyMarker.signal-hold strong,#vsEnemyMarker.signal-hold small{color:#ffd36e}#vsEnemyMarker.signal-hold .vs-enemy-reticle{border-color:#ffc44d;box-shadow:0 0 0 1px #2b1b00,0 0 14px #ffb51c99,inset 0 0 10px #ffb51c33}',1)
          path.write_text(text)

          # 5) Real Box3D regression: camera is pulled in front of building/ground.
          path=Path('tests/world_building_collision_box3d_test.mjs')
          text=path.read_text()
          old='import {createWorldBuildingCollisionBodies,destroyWorldBuildingCollisionBodies,findClearBuildingLaunchPoint} from "../sim/world_building_collision_physics.mjs";'
          new='import {createWorldBuildingCollisionBodies,destroyWorldBuildingCollisionBodies,findClearBuildingLaunchPoint,resolveBox3dCameraPath} from "../sim/world_building_collision_physics.mjs";'
          assert old in text
          text=text.replace(old,new,1).replace('groundShape.filter={categoryBits:1n,maskBits:6n,groupIndex:0};','groundShape.filter={categoryBits:1n,maskBits:14n,groupIndex:0};',1).replace('maskBits:6n,rangefinderCategoryBits:4n','maskBits:14n,rangefinderCategoryBits:4n',1)
          marker='function makeProbe({position=[0,0,1],velocity=[8,0,0]}={}){'
          camera_test='''const wallCamera=resolveBox3dCameraPath(b3,world,[1.5,0,1],[3.5,0,1],{queryCategoryBits:8n,terrainCategoryBits:1n,clearanceM:.08});\nassert.equal(wallCamera.collided,true);assert.ok(wallCamera.position[0]>1.5&&wallCamera.position[0]<1.95,`camera crossed building wall: ${JSON.stringify(wallCamera)}`);\nconst groundCamera=resolveBox3dCameraPath(b3,world,[0,0,1],[0,0,-1],{queryCategoryBits:8n,terrainCategoryBits:1n,clearanceM:.08});\nassert.equal(groundCamera.collided,true);assert.ok(groundCamera.position[2]>=.075,`camera clipped ground: ${JSON.stringify(groundCamera)}`);\nconst clearCamera=resolveBox3dCameraPath(b3,world,[0,0,1],[0,0,2],{queryCategoryBits:8n,terrainCategoryBits:1n,clearanceM:.08});assert.equal(clearCamera.collided,false);assert.deepEqual(clearCamera.position,[0,0,2]);\n\n'''
          assert marker in text and 'wallCamera=resolveBox3dCameraPath' not in text
          text=text.replace(marker,camera_test+marker,1)
          text=text.replace('stable ground-only GAME AGL, unrelated wall contact','stable ground-only GAME AGL, camera ground/wall occlusion, unrelated wall contact',1)
          path.write_text(text)

          # 6) Browser regression: force 5 s pose gap while connected; mesh + tracker must remain.
          path=Path('tests/vs_combat_browser_smoke.mjs')
          text=path.read_text()
          marker='    const hitOk=bridge.registerVsHit({object:firstMesh||bridge.vsPeerMesh.children[0]}),shot=sent.find(p=>p.type==="hit");if(!hitOk||!shot)throw new Error("local peer hit was not emitted");'
          stale='''    const latestSnapshot=bridge.vsPeerTimeline.snapshots.at(-1);latestSnapshot.receivedMs-=5000;bridge.vsPeerLastPoseMs-=5000;bridge.updateVsPeerRender();await sleep(120);const staleHold={peerVisible:Boolean(bridge.vsPeerMesh.visible),markerHidden:Boolean(marker?.hidden),markerText:marker?.textContent||"",signal:viewport.dataset.vsEnemySignal||"",poseMode:viewport.dataset.vsPoseMode||"",poseHeld:viewport.dataset.vsPoseHeld||""};bridge.applyVsPose({p:[ox+10,oy,oz],q:[0,0,0,1]});await sleep(80);\n'''
          assert marker in text and 'const staleHold=' not in text
          text=text.replace(marker,stale+marker,1)
          old='bridge.stopVs();return{hitOk,shot,markerBefore,killed,peerRespawn,hpAfterFirst,hpAfterDuplicate,state,localDeath,dataset};'
          new='bridge.stopVs();return{hitOk,shot,markerBefore,staleHold,killed,peerRespawn,hpAfterFirst,hpAfterDuplicate,state,localDeath,dataset};'
          assert old in text
          text=text.replace(old,new,1)
          marker='  if(!Number.isFinite(result.markerBefore.distanceM)||Math.abs(result.markerBefore.distanceM-result.markerBefore.expectedDistanceM)>.25)throw new Error(`enemy distance is not drone-to-drone: ${JSON.stringify(result.markerBefore)}`);'
          assertion=marker+'\n  if(!result.staleHold.peerVisible||result.staleHold.markerHidden||!result.staleHold.markerText.includes("ENEMY")||result.staleHold.signal!=="hold"||result.staleHold.poseMode!=="stale-hold"||result.staleHold.poseHeld!=="1")throw new Error(`connected stale-pose hold failed: ${JSON.stringify(result.staleHold)}`);'
          assert marker in text
          text=text.replace(marker,assertion,1)
          text=text.replace('enemy HP/marker/contrast, real AudioContext','enemy HP/marker/contrast, connected stale-pose mesh+tracker hold, real AudioContext',1)
          path.write_text(text)
          PY
          node --check sim/world_building_collision_physics.mjs
          node --check sim/simulator.mjs
          node --check sim/real_world_bootstrap.mjs
          node --check sim/vs_combat_presentation.mjs
          node --check tests/world_building_collision_box3d_test.mjs
          node --check tests/vs_combat_browser_smoke.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/world_building_collision_physics.mjs sim/simulator.mjs sim/real_world_bootstrap.mjs sim/vs_combat_presentation.mjs tests/world_building_collision_box3d_test.mjs tests/vs_combat_browser_smoke.mjs
          git commit -m "Fix camera clipping and VS peer flicker"
          git push
