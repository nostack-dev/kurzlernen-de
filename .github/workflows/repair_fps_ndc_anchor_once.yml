name: Repair FPS screen anchor once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_fps_ndc_anchor_once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anchor FPS grip in screen space
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sim/first_person_weapon_runtime_v3.mjs')
          s = p.read_text()
          old = 'latchedPivotLocal(camera,desiredPivotCameraLocal);desiredPivotWorld.copy(desiredPivotCameraLocal);camera.localToWorld(desiredPivotWorld);keepPivotAt(gun,pivot,desiredPivotWorld);'
          new = 'desiredPivotWorld.set(latchedPivotNdc.x,latchedPivotNdc.y,.5).unproject(camera).sub(camera.position).normalize().multiplyScalar(Math.max(.05,latchedPivotCameraLocal.length())).add(camera.position);desiredPivotCameraLocal.copy(desiredPivotWorld);camera.worldToLocal(desiredPivotCameraLocal);keepPivotAt(gun,pivot,desiredPivotWorld);'
          assert old in s, 'camera-local anchor expression changed'
          p.write_text(s.replace(old, new, 1))
          PY
          node --check sim/first_person_weapon_runtime_v3.mjs
          grep -q 'multiplyScalar(Math.max(.05,latchedPivotCameraLocal.length()))' sim/first_person_weapon_runtime_v3.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/first_person_weapon_runtime_v3.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Anchor FPS aim grip in screen space'
          git push origin HEAD:main