name: One-shot solo mobile polish
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-solo-polish.yml"
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply solo mobile polish
        run: |
          set -euxo pipefail
          python3 tools/patch_solo_mobile_polish.py
          node --check sim/simulator.mjs
          grep -q '#soloLeft .solo-knob{top:88%}' sim/simulator.mjs
          grep -q 'apple-mobile-web-app-capable' drone_simulator.html
      - name: Commit polished solo mode
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/simulator.mjs drone_simulator.html
          git commit -m "Polish landscape single-phone mobile flight mode"
          git push
