name: Fix thrust-vector actuator map

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-fix-thrust-vector-map.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map required thrust to rotor-speed command
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('esp32/Arondight45_StateControl.hpp')
          s=p.read_text()
          old='''        const float throttle_command = clamp(\n            hover_trim_ * required_specific_force / kGravityMps2,\n            kMinFlightThrottle, kMaxFlightThrottle);\n'''
          new='''        // Propeller thrust is approximately proportional to rotor speed squared.\n        // Runtime throttle maps linearly onto the ESC pulse above idle, which is\n        // much closer to rotor-speed command than to thrust. Convert the required\n        // specific-force ratio through sqrt() before commanding the actuator; a\n        // linear force->throttle map over-commands transients and excites Z ringing.\n        const float thrust_ratio = required_specific_force / kGravityMps2;\n        const float hover_motor_command = kEscCommandOffset + kEscCommandScale * hover_trim_;\n        const float required_motor_command = hover_motor_command * std::sqrt(thrust_ratio);\n        const float throttle_command = clamp(\n            (required_motor_command - kEscCommandOffset) / kEscCommandScale,\n            kMinFlightThrottle, kMaxFlightThrottle);\n'''
          assert s.count(old)==1,('StateControl throttle map marker',s.count(old))
          s=s.replace(old,new,1)
          marker='''    static constexpr float kHeadingKp = 2.2f;                // deg/s per deg heading error\n'''
          constants='''    // pulse() maps Runtime throttle t to 1050 + 950*t us. Expressed on the\n    // ESC's 1000..2000 us command interval that is 0.05 + 0.95*t.\n    static constexpr float kEscCommandOffset =\n        static_cast<float>(kEscIdleUs - kEscMinUs) / static_cast<float>(kEscMaxUs - kEscMinUs);\n    static constexpr float kEscCommandScale =\n        static_cast<float>(kEscMaxUs - kEscIdleUs) / static_cast<float>(kEscMaxUs - kEscMinUs);\n\n'''
          assert s.count(marker)==1
          s=s.replace(marker,constants+marker,1)
          p.write_text(s)

          p=Path('tests/state_control_test.cpp')
          s=p.read_text()
          old='''    CHECK(controller.debug().vertical_accel_mps2 > 3.0f);\n    CHECK(climb_throttle > 0.50f);\n'''
          new='''    CHECK(controller.debug().vertical_accel_mps2 > 3.0f);\n    // More than hover, but not the old linear force->throttle over-command.\n    CHECK(climb_throttle > 0.43f && climb_throttle < 0.50f);\n'''
          assert s.count(old)==1,('state test climb marker',s.count(old))
          p.write_text(s.replace(old,new,1))

          p=Path('tests/architecture_invariants.mjs')
          s=p.read_text()
          marker='''requireText("esp32/Arondight45_StateControl.hpp","required_specific_force");\n'''
          extra='''requireText("esp32/Arondight45_StateControl.hpp","required_specific_force");\nrequireText("esp32/Arondight45_StateControl.hpp","std::sqrt(thrust_ratio)",\n            "thrust magnitude must map through rotor-speed physics instead of linearly to throttle");\nrequireText("esp32/Arondight45_StateControl.hpp","kEscCommandOffset");\nrequireText("esp32/Arondight45_StateControl.hpp","kEscCommandScale");\n'''
          assert s.count(marker)==1
          p.write_text(s.replace(marker,extra,1))
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit physical mapping and remove workflow
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add esp32/Arondight45_StateControl.hpp tests/state_control_test.cpp tests/architecture_invariants.mjs
          git rm .github/workflows/oneoff-fix-thrust-vector-map.yml
          git commit -m "Map thrust vector magnitude through rotor speed"
          git pull --rebase origin main
          git push origin HEAD:main