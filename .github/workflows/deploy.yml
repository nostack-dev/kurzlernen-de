name: Deploy static site

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Host-test controller runtime
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -DFC_HOST_TEST esp32/Arondight45_DroneFC_S31.cpp -o /tmp/fc_test
          /tmp/fc_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -DHIL_HOST_TEST esp32/Arondight45_DroneFC_HIL_S31.cpp -o /tmp/hil_test
          /tmp/hil_test

      - name: Generate SIL WebAssembly glue
        run: |
          cat > /tmp/sil_glue.cpp <<'CPP'
          #define HIL_HOST_TEST 1
          #include "/src/esp32/Arondight45_DroneFC_HIL_S31.cpp"
          #undef HIL_HOST_TEST
          #include <emscripten/emscripten.h>
          namespace { hil::Runtime runtime; hil::InputPacket in{}; hil::OutputPacket out{}; }
          extern "C" {
          EMSCRIPTEN_KEEPALIVE unsigned char* fc_input_buffer(){ return reinterpret_cast<unsigned char*>(&in); }
          EMSCRIPTEN_KEEPALIVE const unsigned char* fc_output_buffer(){ return reinterpret_cast<const unsigned char*>(&out); }
          EMSCRIPTEN_KEEPALIVE unsigned fc_input_size(){ return sizeof(in); }
          EMSCRIPTEN_KEEPALIVE unsigned fc_output_size(){ return sizeof(out); }
          EMSCRIPTEN_KEEPALIVE void fc_reset(){ runtime.reset(); in={}; out={}; }
          EMSCRIPTEN_KEEPALIVE int fc_process(){ out=runtime.process(in,0); return 0; }
          }
          CPP

      - name: Build exact controller runtime for SIM
        run: |
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -v /tmp/sil_glue.cpp:/tmp/sil_glue.cpp -w /src emscripten/emsdk:4.0.10 \
            em++ /tmp/sil_glue.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web,node' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process"]' \
              -o generated/flight_core.mjs

      - name: Validate digital twin
        run: |
          node --check sim/simulator.mjs
          node --check tools/s31_hil_bridge.mjs
          test -s generated/flight_core.mjs
          test -s generated/flight_core.wasm
          grep -q 'modeSim' drone_simulator.html
          grep -q 'modeHil' drone_simulator.html
          grep -q 'modeReplay' drone_simulator.html
          grep -q 'class WasmBackend' sim/simulator.mjs
          grep -q 'class HardwareBackend' sim/simulator.mjs
          grep -q 'class PhysicsModel' sim/simulator.mjs
          grep -q 'fitPhysics' sim/simulator.mjs
          echo 'SIM/HIL/REAL architecture validation passed'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
