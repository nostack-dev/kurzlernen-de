name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Report deploy start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          body="START · sha=${GH_SHA} · run=${GH_RUN_ID} · number=${GH_RUN_NUMBER} · https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deterministic critical gates
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          node tests/fps_control_test.mjs
          node tests/first_person_control_settings_test.mjs
          node tests/xbox_gamepad_test.mjs
          node tests/player_vitals_logic_test.mjs
          node tests/wanted_system_test.mjs
          node tests/gameplay_fun_logic_test.mjs
          node tests/editor3d_contract_test.mjs
          node tests/nuke_weapon_contract_test.mjs
          node tools/build-intrinsic-orcl.mjs --check
          node tests/stockstrend_data_test.mjs
          node tests/market_clock_test.cjs
          node tests/price_shock_test.cjs
          node --check sim/player_walk_mode_v4.mjs
          node --check sim/gameplay_final_runtime_v2.mjs
          node --check sim/flight_fire_fx.mjs
          node --check sim/nuke_weapon.mjs
          node --check sim/world_rigid_body_runtime.mjs
          node --check sim/wanted_police_drones.mjs
          node --check sim/auto_flight_start.mjs
          grep -q 'kMaxHorizontalAccelerationMps2 = 7.5f' esp32/Arondight45_StateControl.hpp
          grep -q 'box3d_hitscan.mjs' sim/flight_fire_fx.mjs

      - name: Build exact shared controller runtime to WebAssembly
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='node' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core_node.mjs
          node tests/sil_wasm_smoke.mjs generated/flight_core_node.mjs

      - name: Bundle self-contained Pages
        run: |
          set -euxo pipefail
          BUILD_DIR=/tmp/arondight45-web-build
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cp -a . "$BUILD_DIR/repo"
          rm -rf "$BUILD_DIR/repo/.git"
          cd "$BUILD_DIR/repo"
          npm ci --ignore-scripts
          node tools/build-pages.mjs
          node tests/world_building_collision_box3d_test.mjs ./node_modules/box3d.js/dist/box3d.inline.mjs
          node tests/world_rigid_body_physics_box3d_test.mjs ./node_modules/box3d.js/dist/box3d.inline.mjs
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-controller.bundle.mjs
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.')
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  data=path.read_bytes()
              except OSError:
                  continue
              if b'__BUILD_SHA__' in data:
                  path.write_bytes(data.replace(b'__BUILD_SHA__',os.environ.get('GITHUB_SHA','unknown').encode()))
          PY
          rm -rf node_modules
          cd "$GITHUB_WORKSPACE"
          rm -rf public
          mv "$BUILD_DIR/repo" public

      - name: Build ORCL minute feed
        run: node tools/build-orcl-minute-feed.mjs

      - name: Fast browser boot gate
        run: node tests/solo_layout_smoke.mjs

      - name: Advisory FPS regression smoke
        continue-on-error: true
        run: node tests/solo_fps_smoke.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Run actions/deploy-pages@v4
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deploy final
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="FINAL · status=${JOB_STATUS} · sha=${GH_SHA} · run=${GH_RUN_ID} · number=${GH_RUN_NUMBER} · https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null

  live-e2e:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify exact live build
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          for i in $(seq 1 24); do
            html="$(curl -fsSL --max-time 20 https://kurzlernen.de/ || true)"
            if printf '%s' "$html" | grep -Fq "$GH_SHA"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Report live E2E final
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="LIVE-E2E · status=${JOB_STATUS} · sha=${GH_SHA} · run=${GH_RUN_ID} · number=${GH_RUN_NUMBER} · https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
