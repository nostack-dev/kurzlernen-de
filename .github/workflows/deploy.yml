name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Host-test shared Production HIL and SIL runtime
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 \
            tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 \
            tests/drone_hil_protocol_test.cpp -o /tmp/hil_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/hil_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 \
            sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil_test
          /tmp/sil_test

      - name: Build exact shared controller runtime to WebAssembly
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='node' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core_node.mjs
          node --check generated/flight_core.mjs
          node --check generated/flight_core_node.mjs
          node tests/sil_wasm_smoke.mjs generated/flight_core_node.mjs

      - name: Bundle a true single-file browser simulator
        run: |
          set -euxo pipefail
          BUILD_DIR=/tmp/arondight45-web-build
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            three@0.185.1 box3d.js@0.1.1 esbuild@0.25.8
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/simulator.mjs \
            --bundle --format=esm --platform=browser --target=es2022 --minify \
            --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline \
            --outfile=/tmp/arondight45-simulator.bundle.mjs
          rm node_modules
          node --check /tmp/arondight45-simulator.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          html_path = Path('drone_simulator.html')
          html = html_path.read_text()
          marker = '<script type="module" src="./sim/simulator.mjs"></script>'
          assert marker in html, 'simulator source module tag missing'
          bundle = Path('/tmp/arondight45-simulator.bundle.mjs').read_text().replace('</script', '<\\/script')
          html = html.replace(marker, '<script type="module">\n' + bundle + '\n</script>')
          html_path.write_text(html)
          PY
          test -s drone_simulator.html
          test "$(wc -c < drone_simulator.html)" -gt 100000
          ! grep -q 'src="./sim/simulator.mjs"' drone_simulator.html
          ! grep -q 'cdn.jsdelivr.net' drone_simulator.html
          ! grep -q 'generated/flight_core.mjs' drone_simulator.html
          grep -q 'Export run' drone_simulator.html
          grep -q 'functional HIL' drone_simulator.html
          rm -rf generated

      - name: Validate digital-twin architecture
        run: |
          set -euxo pipefail
          node --check sim/simulator.mjs
          node --check tests/sil_wasm_smoke.mjs
          node --check tools/s31_hil_bridge.mjs
          ! grep -R --line-number -E '#[[:space:]]*include[[:space:]]+["<][^">]*\.cpp[">]' esp32 sim
          ! grep -R --line-number -E '#[[:space:]]*define[[:space:]]+main' esp32 sim
          grep -q 'class Runtime' esp32/Arondight45_DroneFC_Core.hpp
          grep -q 'fc::Runtime runtime' esp32/Arondight45_DroneFC_S31.cpp
          grep -q 'fc::Runtime runtime_' esp32/Arondight45_HIL_Protocol.hpp
          grep -q 'Arondight45_HIL_Protocol.hpp' sim/Arondight45_DroneFC_SIL_WASM.cpp
          grep -q '(pulses\[i\]-1000)/1000' sim/simulator.mjs
          grep -q 'previous.motor1_us' sim/simulator.mjs
          grep -q 'state.current_a' sim/simulator.mjs
          echo 'Shared Production/HIL/SIL runtime and self-contained simulator validation passed.'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
