name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Report deploy start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          body="START · sha=${GH_SHA} · run=${GH_RUN_ID} · number=${GH_RUN_NUMBER} · https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify standalone Kurzlernen sources and stamp site build
        run: |
          set -euo pipefail
          test -s index.html
          test -s drone_simulator_old.html
          test ! -e drone_simulator.html
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > build.json

      - name: Build ORCL minute feed
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          URL1='https://query1.finance.yahoo.com/v8/finance/chart/ORCL?range=5d&interval=1m&includePrePost=true&events=div%2Csplits'
          URL2='https://query2.finance.yahoo.com/v8/finance/chart/ORCL?range=5d&interval=1m&includePrePost=true&events=div%2Csplits'
          if ! curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$URL1" -o orcl-minute.json; then
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$URL2" -o orcl-minute.json
          fi
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('orcl-minute.json','utf8'));
          const r=p?.chart?.result?.[0];
          const ts=r?.timestamp||[];
          const q=r?.indicators?.quote?.[0]||{};
          const good=ts.filter((_,i)=>Number.isFinite(Number(q.close?.[i]))&&Number(q.close[i])>0);
          if(good.length<25) throw new Error('ORCL minute feed has fewer than 25 valid bars');
          if(p?.chart?.error) throw new Error('Yahoo chart error: '+JSON.stringify(p.chart.error));
          console.log('ORCL minute feed OK:',good.length,'bars');
          NODE

          FX1='https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X?range=10y&interval=1d&includePrePost=false&events=div%2Csplits'
          FX2='https://query2.finance.yahoo.com/v8/finance/chart/EURUSD=X?range=10y&interval=1d&includePrePost=false&events=div%2Csplits'
          if ! curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$FX1" -o eurusd-history.json; then
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' "$FX2" -o eurusd-history.json
          fi
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('eurusd-history.json','utf8'));
          const r=p?.chart?.result?.[0],ts=r?.timestamp||[],q=r?.indicators?.quote?.[0]||{};
          const good=ts.filter((_,i)=>Number.isFinite(Number(q.close?.[i]))&&Number(q.close[i])>0);
          if(good.length<500) throw new Error('EURUSD history feed has fewer than 500 valid bars');
          if(p?.chart?.error) throw new Error('Yahoo chart error: '+JSON.stringify(p.chart.error));
          console.log('EURUSD history feed OK:',good.length,'bars');
          NODE

      - name: Verify Kurzlernen website assets without legacy game browser tests
        run: |
          set -euo pipefail
          test -s index.html
          test -s build.json
          test -s drone_simulator_old.html
          test -s drone_controller.html
          grep -q "$GITHUB_SHA" build.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            count="$(curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GH_REPO}/actions/runs/${GH_RUN_ID}/artifacts?per_page=100"               | jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length')"
            if [ "${count}" -ge 1 ]; then
              echo "github-pages artifact is visible"
              exit 0
            fi
            sleep 2
          done
          echo "github-pages artifact never became visible to deploy-pages" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deploy final
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          body="FINAL · sha=${GH_SHA} · run=${GH_RUN_ID} · job=${JOB_STATUS} · deploy=${DEPLOY_OUTCOME:-not-run} · url=${PAGE_URL:-n/a} · https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null

  live-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify live Kurzlernen build and home page
        id: live_probes
        timeout-minutes: 3
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetched=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --retry 1 --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' \
              "https://kurzlernen.de/build.json?ci=${GH_SHA}-${attempt}" -o /tmp/kurzlernen-build.json \
              && jq -e --arg sha "${GH_SHA}" '.sha == $sha' /tmp/kurzlernen-build.json; then
              fetched=1
              break
            fi
            sleep 3
          done
          test "$fetched" = 1
          curl -fsSL --retry 2 --connect-timeout 8 --max-time 20 https://kurzlernen.de/ -o /tmp/kurzlernen-index.html
          grep -qi '<html' /tmp/kurzlernen-index.html

      - name: Report live E2E final
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          LIVE_OUTCOME: ${{ steps.live_probes.outcome }}
        run: |
          set -euo pipefail
          body="LIVE FINAL · sha=${GH_SHA} · run=${GH_RUN_ID} · live-e2e=${LIVE_OUTCOME} · https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
