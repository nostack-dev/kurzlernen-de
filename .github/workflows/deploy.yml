name: Deploy static site

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build responsive drone simulator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path("drone_simulator.html")
          html = html_path.read_text(encoding="utf-8")
          css = Path("drone_simulator_mobile_patch.css").read_text(encoding="utf-8")
          js = Path("drone_simulator_mobile_patch.js").read_text(encoding="utf-8")

          marker = "data-arondight45-mobile-fix-v2"
          assert marker not in html, "mobile fix already present in source HTML"
          html = html.replace(
              "</head>",
              f'<style {marker}="css">\n{css}\n</style>\n</head>',
              1,
          )
          html = html.replace(
              "</body>",
              f'<script type="module" {marker}="js">\n{js}\n</script>\n</body>',
              1,
          )

          assert marker in html
          assert 'USB unavailable on this device' in html
          assert '@media (max-width: 900px)' in html
          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Validate generated simulator
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("drone_simulator.html").read_text(encoding="utf-8")
          modules = re.findall(r'<script(?:\s+type="module")?[^>]*>(.*?)</script>', html, re.S)
          assert len(modules) >= 2
          for index, module in enumerate(modules):
              Path(f"/tmp/drone-module-{index}.mjs").write_text(module, encoding="utf-8")
          PY
          for file in /tmp/drone-module-*.mjs; do node --check "$file"; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
