name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ALIGN_MIGRATION_BEGIN
      - name: One-time unify 1-PHONE and 2-PHONE GAME semantics
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              assert count==1, f"{path}: expected exactly one match, got {count}"
              p.write_text(text.replace(old,new,1))

          semantics=Path("sim/control_semantics.mjs")
          text=semantics.read_text()
          marker='export function applyStick(controls,kind,point,settings=DEFAULT_PHONE_SETTINGS){\n'
          assert marker in text
          shared='''export function applyGameStick(controls,kind,point,settings=DEFAULT_PHONE_SETTINGS){
  const cfg=normalizePhoneSettings(settings);
  if(kind==="left"){
    const x=cfg.invertLeftHorizontal?-point.x:point.x;
    controls.roll=cfg.lockLeftHorizontal?0:phoneAxis(x,cfg.leftFineness);
    controls.pitch=phoneAxis(-point.y,cfg.leftFineness);
    controls.throttle=0;
  }else{
    const x=cfg.invertRightHorizontal?-point.x:point.x;
    const y=cfg.invertRightVertical?-point.y:point.y;
    controls.yaw=phoneAxis(-x,cfg.rightFineness);
    controls.bodyPitch=cfg.lockRightHorizontal?0:phoneAxis(-y,cfg.rightFineness);
  }
  return controls;
}
export function gameKnobAxes(controls,kind,settings=DEFAULT_PHONE_SETTINGS){
  const cfg=normalizePhoneSettings(settings);
  if(kind==="left"){
    const rawX=cfg.lockLeftHorizontal?0:inversePhoneAxis(controls.roll,cfg.leftFineness);
    return{x:cfg.invertLeftHorizontal?-rawX:rawX,y:-inversePhoneAxis(controls.pitch,cfg.leftFineness)};
  }
  const rawX=-inversePhoneAxis(controls.yaw,cfg.rightFineness);
  const rawY=cfg.lockRightHorizontal?0:-inversePhoneAxis(controls.bodyPitch||0,cfg.rightFineness);
  return{x:cfg.invertRightHorizontal?-rawX:rawX,y:cfg.invertRightVertical?-rawY:rawY};
}

'''
          semantics.write_text(text.replace(marker,shared+marker,1))

          replace_once("sim/controller.mjs",'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis}','applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes}')
          replace_once("sim/controller.mjs",'''    const leftRawX=phoneSettings.lockLeftHorizontal?0:inversePhoneAxis(controls.roll,phoneSettings.leftFineness);
    left={x:phoneSettings.invertLeftHorizontal?-leftRawX:leftRawX,y:-inversePhoneAxis(controls.pitch,phoneSettings.leftFineness)};
    const rawX=-inversePhoneAxis(controls.yaw,phoneSettings.rightFineness),rawY=phoneSettings.lockRightHorizontal?0:-inversePhoneAxis(controls.bodyPitch||0,phoneSettings.rightFineness);
    right={x:phoneSettings.invertRightHorizontal?-rawX:rawX,y:phoneSettings.invertRightVertical?-rawY:rawY};''','''    left=gameKnobAxes(controls,"left",phoneSettings);
    right=gameKnobAxes(controls,"right",phoneSettings);''')
          replace_once("sim/controller.mjs",'''    if(gameMode){
      if(kind==="left"){
        const x=phoneSettings.invertLeftHorizontal?-point.x:point.x;
        controls.roll=phoneSettings.lockLeftHorizontal?0:phoneAxis(x,phoneSettings.leftFineness);
        controls.pitch=phoneAxis(-point.y,phoneSettings.leftFineness);
        controls.throttle=0;
      }else{
        const x=phoneSettings.invertRightHorizontal?-point.x:point.x;
        const y=phoneSettings.invertRightVertical?-point.y:point.y;
        controls.yaw=phoneAxis(-x,phoneSettings.rightFineness);
        controls.bodyPitch=phoneSettings.lockRightHorizontal?0:phoneAxis(-y,phoneSettings.rightFineness);
      }
    }else applyStick(controls,kind,point,phoneSettings);''','''    if(gameMode)applyGameStick(controls,kind,point,phoneSettings);
    else applyStick(controls,kind,point,phoneSettings);''')

          replace_once("sim/simulator.mjs",'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis}','applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes}')
          replace_once("sim/simulator.mjs",'''  const left={x:phoneSettings.lockLeftHorizontal?0:inversePhoneAxis(soloControls.roll,phoneSettings.leftFineness),y:-inversePhoneAxis(soloControls.pitch,phoneSettings.leftFineness)};
  const rawX=-inversePhoneAxis(soloControls.yaw,phoneSettings.rightFineness),rawY=phoneSettings.lockRightHorizontal?0:-inversePhoneAxis(soloControls.bodyPitch||0,phoneSettings.rightFineness);
  const right={x:phoneSettings.invertRightHorizontal?-rawX:rawX,y:phoneSettings.invertRightVertical?-rawY:rawY};''','''  const left=gameKnobAxes(soloControls,"left",phoneSettings);
  const right=gameKnobAxes(soloControls,"right",phoneSettings);''')
          replace_once("sim/simulator.mjs",'''  const apply=e=>{const point=normalizedPointer(el,e);if(kind==="left"){soloControls.roll=phoneSettings.lockLeftHorizontal?0:phoneAxis(point.x,phoneSettings.leftFineness);soloControls.pitch=phoneAxis(-point.y,phoneSettings.leftFineness);soloControls.throttle=0;}else{const x=phoneSettings.invertRightHorizontal?-point.x:point.x,y=phoneSettings.invertRightVertical?-point.y:point.y;soloControls.yaw=phoneAxis(-x,phoneSettings.rightFineness);soloControls.bodyPitch=phoneSettings.lockRightHorizontal?0:phoneAxis(-y,phoneSettings.rightFineness);}updateSoloSticks();e.preventDefault();};''','''  const apply=e=>{const point=normalizedPointer(el,e);applyGameStick(soloControls,kind,point,phoneSettings);updateSoloSticks();e.preventDefault();};''')

          replace_once("tests/control_semantics_test.mjs",'knobAxes,phoneAxis,inversePhoneAxis,finenessToExpo,normalizedPointer,endPointerDrag','knobAxes,phoneAxis,inversePhoneAxis,finenessToExpo,normalizedPointer,endPointerDrag,applyGameStick,gameKnobAxes')
          test=Path("tests/control_semantics_test.mjs")
          text=test.read_text(); marker='// Re-touching a retained throttle must not teleport it to the absolute touch point.\n'; assert marker in text
          block='''// GAME mode is one shared semantic path for both 1-PHONE and 2-PHONE.
const gameDefault={...DEFAULT_PHONE_SETTINGS};
c=neutralControls();applyGameStick(c,"left",{x:.4,y:-.3},gameDefault);
near(c.roll,phoneAxis(.4,gameDefault.leftFineness));near(c.pitch,phoneAxis(.3,gameDefault.leftFineness));assert.equal(c.throttle,0);
let gameKnob=gameKnobAxes(c,"left",gameDefault);near(gameKnob.x,.4,3e-6);near(gameKnob.y,-.3,3e-6);
const gameInvertLeft={...gameDefault,invertLeftHorizontal:true};
c=neutralControls();applyGameStick(c,"left",{x:.4,y:-.3},gameInvertLeft);
near(c.roll,phoneAxis(-.4,gameInvertLeft.leftFineness));near(c.pitch,phoneAxis(.3,gameInvertLeft.leftFineness));
gameKnob=gameKnobAxes(c,"left",gameInvertLeft);near(gameKnob.x,.4,3e-6);near(gameKnob.y,-.3,3e-6);
const gameRightInvert={...gameDefault,invertRightHorizontal:true,invertRightVertical:true};
c=neutralControls();applyGameStick(c,"right",{x:.35,y:-.25},gameRightInvert);
near(c.yaw,phoneAxis(.35,gameRightInvert.rightFineness));near(c.bodyPitch,phoneAxis(-.25,gameRightInvert.rightFineness));
gameKnob=gameKnobAxes(c,"right",gameRightInvert);near(gameKnob.x,.35,3e-6);near(gameKnob.y,-.25,3e-6);
const gameLocked={...gameDefault,lockLeftHorizontal:true,lockRightHorizontal:true};
c=neutralControls();applyGameStick(c,"left",{x:.8,y:-.4},gameLocked);assert.equal(c.roll,0);near(c.pitch,phoneAxis(.4,gameLocked.leftFineness));
applyGameStick(c,"right",{x:.6,y:.7},gameLocked);near(c.yaw,phoneAxis(-.6,gameLocked.rightFineness));assert.equal(c.bodyPitch,0);

'''
          test.write_text(text.replace(marker,block+marker,1))

          workflow=Path('.github/workflows/deploy.yml')
          w=workflow.read_text()
          begin='      # ALIGN_MIGRATION_BEGIN\n'; end='      # ALIGN_MIGRATION_END\n'
          a=w.index(begin); b=w.index(end,a)+len(end)
          w=w[:a]+w[b:]
          w=w.replace('      contents: write\n      pages: write\n','      contents: read\n      pages: write\n',1)
          workflow.write_text(w)
          PY

          node --check sim/control_semantics.mjs
          node --check sim/controller.mjs
          node --check sim/simulator.mjs
          node --check tests/control_semantics_test.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 2

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/control_semantics.mjs sim/controller.mjs sim/simulator.mjs tests/control_semantics_test.mjs .github/workflows/deploy.yml
          git diff --cached --check
          git commit -m "Unify one-phone and two-phone GAME controls"
          git push origin HEAD:main
      # ALIGN_MIGRATION_END

      - name: Host-test shared Production HIL and SIL runtime
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/hil_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil_test
          /tmp/sil_test
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs

      - name: Build exact shared controller runtime to WebAssembly
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='node' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core_node.mjs
          node --check generated/flight_core.mjs
          node --check generated/flight_core_node.mjs
          node tests/sil_wasm_smoke.mjs generated/flight_core_node.mjs

      - name: Bundle two self-contained GitHub Pages
        run: |
          set -euxo pipefail
          BUILD_DIR=/tmp/arondight45-web-build
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            three@0.185.1 box3d.js@0.1.1 esbuild@0.25.8 puppeteer-core@24.16.0 \
            qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/simulator.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-controller.bundle.mjs
          node --check /tmp/arondight45-simulator.bundle.mjs
          node --check /tmp/arondight45-controller.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          builds=[
              ('drone_simulator.html','<script type="module" src="./sim/simulator.mjs"></script>','/tmp/arondight45-simulator.bundle.mjs'),
              ('drone_controller.html','<script type="module" src="./sim/controller.mjs"></script>','/tmp/arondight45-controller.bundle.mjs'),
          ]
          for html_name,marker,bundle_name in builds:
              path=Path(html_name);html=path.read_text();assert marker in html,f'{html_name}: source module tag missing'
              bundle=Path(bundle_name).read_text().replace('</script','<\\/script')
              path.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
          test -s drone_simulator.html
          test -s drone_controller.html
          test "$(wc -c < drone_simulator.html)" -gt 100000
          test "$(wc -c < drone_controller.html)" -gt 10000
          ! grep -q 'src="./sim/simulator.mjs"' drone_simulator.html
          ! grep -q 'src="./sim/controller.mjs"' drone_controller.html
          ! grep -q 'cdn.jsdelivr.net' drone_simulator.html
          ! grep -q 'generated/flight_core.mjs' drone_simulator.html
          grep -q 'RTCPeerConnection' drone_simulator.html
          grep -q 'RTCPeerConnection' drone_controller.html
          grep -q 'SCAN CONTROLLER OFFER' drone_simulator.html
          grep -q 'SCAN VIEW ANSWER' drone_controller.html
          ! grep -q '/control' drone_controller.html
          rm -rf generated

      - name: Execute static-only GAME and standalone browser E2E
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/arondight45-static.log 2>&1 &
          HTTP_PID=$!
          cleanup(){ kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules; }
          trap cleanup EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/solo_layout_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/dual_phone_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/browser_sim_smoke.mjs http://127.0.0.1:4174/drone_simulator.html

      - name: Validate JavaScript sources after browser E2E
        run: |
          set -euxo pipefail
          node --check sim/simulator.mjs
          node --check sim/controller.mjs
          node --check sim/p2p_link.mjs
          node --check sim/qr_pairing.mjs
          node --check sim/control_semantics.mjs
          node --check sim/control_settings.mjs
          node --check sim/solo_layout.mjs
          node --check tests/architecture_invariants.mjs
          node --check tests/control_semantics_test.mjs
          node --check tests/sil_wasm_smoke.mjs
          node --check tests/browser_sim_smoke.mjs
          node --check tests/dual_phone_smoke.mjs
          node --check tests/solo_layout_smoke.mjs
          node --check tools/s31_hil_bridge.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
