name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Host-test shared Production HIL and SIL runtime
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/hil_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil_test
          /tmp/sil_test
          node tests/control_semantics_test.mjs
          node tests/xbox_gamepad_test.mjs
          node tests/camera_stabilization_test.mjs
          node tests/render_stability_test.mjs
          node tests/vs_pose_sync_test.mjs
          node tests/physics_validation_test.mjs
          node tests/world_building_collisions_test.mjs
          node tests/world_dem_sampler_test.mjs
          node tests/world_terrain_test.mjs
          node tests/world_building_style_test.mjs
          node tests/safe_spawn_test.mjs
          node tests/s31_digital_twin_audit_test.mjs
          node tests/architecture_invariants.mjs
          node tests/lan_vs_smoke.mjs

      - name: Build exact shared controller runtime to WebAssembly
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='node' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core_node.mjs
          node --check generated/flight_core.mjs
          node --check generated/flight_core_node.mjs
          node tests/sil_wasm_smoke.mjs generated/flight_core_node.mjs

      - name: Bundle two self-contained GitHub Pages
        run: |
          set -euxo pipefail
          BUILD_DIR=/tmp/arondight45-web-build
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1 \
            qrcode-generator@1.4.4 jsqr@1.4.0 trystero@0.25.3 @trystero-p2p/mqtt@0.25.3 @trystero-p2p/torrent@0.25.3
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          node tests/world_building_collision_box3d_test.mjs ./node_modules/box3d.js/dist/box3d.inline.mjs
          node tests/world_terrain_box3d_test.mjs ./node_modules/box3d.js/dist/box3d.inline.mjs
          node tests/safe_spawn_box3d_test.mjs ./node_modules/box3d.js/dist/box3d.inline.mjs
          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-controller.bundle.mjs
          node --check /tmp/arondight45-simulator.bundle.mjs
          node --check /tmp/arondight45-controller.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          builds=[
              ('drone_simulator.html','<script type="module" src="./sim/real_world_bootstrap.mjs"></script>','/tmp/arondight45-simulator.bundle.mjs'),
              ('drone_controller.html','<script type="module" src="./sim/controller.mjs"></script>','/tmp/arondight45-controller.bundle.mjs'),
          ]
          for html_name,marker,bundle_name in builds:
              path=Path(html_name);html=path.read_text();assert marker in html,f'{html_name}: source module tag missing'
              bundle=Path(bundle_name).read_text().replace('</script','<\\/script')
              path.write_text(html.replace(marker,'<script type="module">\n'+bundle+'\n</script>'))
          PY
          test -s drone_simulator.html
          test -s drone_controller.html
          test "$(wc -c < drone_simulator.html)" -gt 100000
          test "$(wc -c < drone_controller.html)" -gt 10000
          ! grep -q 'src="./sim/real_world_bootstrap.mjs"' drone_simulator.html
          ! grep -q 'src="./sim/controller.mjs"' drone_controller.html
          ! grep -q 'cdn.jsdelivr.net' drone_simulator.html
          ! grep -q 'esm.run/trystero' drone_simulator.html
          ! grep -q 'import("trystero")' drone_simulator.html
          ! grep -q 'generated/flight_core.mjs' drone_simulator.html
          grep -q 'REAL WORLD' drone_simulator.html
          grep -q 'soloWorld' drone_simulator.html
          grep -q 'USE MY GPS LOCATION' drone_simulator.html
          grep -q 'tiles.openfreemap.org/styles/liberty' drone_simulator.html
          grep -q 'tiles.mapterhorn.com' drone_simulator.html
          grep -q 'services.arcgisonline.com/ArcGIS/rest/services/World_Imagery' drone_simulator.html
          grep -q 'REAL AERIAL / SATELLITE MAP' drone_simulator.html
          grep -q 'stabilized-inertial-anchor' drone_simulator.html
          grep -q 'stabilized-eye-target' drone_simulator.html
          grep -q 'presentationPoseInterpolation' drone_simulator.html
          grep -q 'OpenFreeMap' drone_simulator.html
          grep -q 'render_height' drone_simulator.html
          grep -q 'worldBuildingCollisionPrisms' drone_simulator.html
          grep -q 'worldTerrainStatus' drone_simulator.html
          grep -q 'navigator.geolocation' drone_simulator.html
          grep -q 'RTCPeerConnection' drone_simulator.html
          grep -q 'RTCPeerConnection' drone_controller.html
          grep -q 'arondight45-kurzlernen-vs-v3' drone_simulator.html
          grep -q 'arondight45/vs-data/v1' drone_simulator.html
          grep -q 'relay-rpi.edufeed.org' drone_simulator.html
          grep -q 'relay2.angor.io' drone_simulator.html
          grep -q 'top.testrelay.top' drone_simulator.html
          grep -q 'api4.ipify.org' drone_simulator.html
          grep -q 'stun.cloudflare.com' drone_simulator.html
          grep -q 'SCAN CONTROLLER OFFER' drone_simulator.html
          grep -q 'SCAN VIEW ANSWER' drone_controller.html
          ! grep -q '/control' drone_controller.html
          rm -rf generated

      - name: Execute GAME, WORLD and standalone browser E2E
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          mkdir -p generated
          ./node_modules/.bin/esbuild sim/nostr_data_relay.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=generated/nostr_data_relay_probe.mjs
          node --check generated/nostr_data_relay_probe.mjs
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/arondight45-static.log 2>&1 &
          HTTP_PID=$!
          cleanup(){ kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules; rm -rf generated; }
          trap cleanup EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/nostr_data_relay_browser_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/solo_layout_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/xbox_gamepad_browser_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/android_render_browser_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/vs_combat_browser_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/network_logbook_browser_smoke.mjs http://127.0.0.1:4174
          world_ui_ok=0
          for attempt in 1 2 3; do
            if CHROME_BIN="$CHROME_BIN" node tests/real_world_ui_smoke.mjs http://127.0.0.1:4174; then
              world_ui_ok=1
              break
            fi
            echo "WORLD UI smoke attempt ${attempt}/3 failed; retrying with a fresh browser"
            sleep 2
          done
          test "$world_ui_ok" -eq 1
          CHROME_BIN="$CHROME_BIN" node tests/world_real_terrain_browser_smoke.mjs http://127.0.0.1:4174/drone_simulator.html
          CHROME_BIN="$CHROME_BIN" node tests/world_shot_decal_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/world_building_collision_browser_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/world_fpv_frame_lock_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/game_speed_envelope_smoke.mjs http://127.0.0.1:4174/drone_simulator.html
          CHROME_BIN="$CHROME_BIN" node tests/dual_phone_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/browser_sim_smoke.mjs http://127.0.0.1:4174/drone_simulator.html

      - name: Validate JavaScript sources after browser E2E
        run: |
          set -euxo pipefail
          node --check sim/real_world_bootstrap.mjs
          node --check sim/simulator.mjs
          node --check sim/world_dem_sampler.mjs
          node --check sim/world_terrain.mjs
          node --check sim/world_terrain_physics.mjs
          node --check sim/world_building_style.mjs
          node --check sim/safe_spawn.mjs
          node --check sim/world_building_collisions.mjs
          node --check sim/world_building_collision_physics.mjs
          node --check sim/camera_stabilization.mjs
          node --check sim/render_stability.mjs
          node --check sim/vs_pose_sync.mjs
          node --check sim/controller.mjs
          node --check sim/p2p_link.mjs
          node --check sim/qr_pairing.mjs
          node --check sim/control_semantics.mjs
          node --check sim/control_settings.mjs
          node --check sim/solo_layout.mjs
          node --check sim/flight_fire_fx.mjs
          node --check sim/xbox_gamepad.mjs
          node --check sim/flight_logbook.mjs
          node --check sim/physics_validation.mjs
          node --check sim/auto_flight_start.mjs
          node --check sim/lan_vs.mjs
          node --check sim/mqtt_data_relay.mjs
          node --check sim/nostr_data_relay.mjs
          node --check tests/architecture_invariants.mjs
          node --check tests/camera_stabilization_test.mjs
          node --check tests/render_stability_test.mjs
          node --check tests/vs_pose_sync_test.mjs
          node --check tests/control_semantics_test.mjs
          node --check tests/physics_validation_test.mjs
          node --check tests/s31_digital_twin_audit_test.mjs
          node --check tests/sil_wasm_smoke.mjs
          node --check tests/browser_sim_smoke.mjs
          node --check tests/dual_phone_smoke.mjs
          node --check tests/solo_layout_smoke.mjs
          node --check tests/xbox_gamepad_test.mjs
          node --check tests/xbox_gamepad_browser_smoke.mjs
          node --check tests/android_render_browser_smoke.mjs
          node --check tests/vs_combat_browser_smoke.mjs
          node --check tests/network_logbook_browser_smoke.mjs
          node --check tests/mqtt_data_relay_browser_smoke.mjs
          node --check tests/nostr_data_relay_browser_smoke.mjs
          node --check tests/real_world_ui_smoke.mjs
          node --check tests/world_real_terrain_browser_smoke.mjs
          node --check tests/world_shot_decal_smoke.mjs
          node --check tests/world_building_collisions_test.mjs
          node --check tests/world_building_collision_box3d_test.mjs
          node --check tests/world_terrain_box3d_test.mjs
          node --check tests/safe_spawn_box3d_test.mjs
          node --check tests/world_building_collision_browser_smoke.mjs
          node --check tests/world_fpv_frame_lock_smoke.mjs
          node --check tests/game_speed_envelope_smoke.mjs
          node --check tests/lan_vs_smoke.mjs
          node --check tests/staged_vs_smoke.mjs
          node --check tests/world_dem_sampler_test.mjs
          node --check tests/world_terrain_test.mjs
          node --check tests/world_building_style_test.mjs
          node --check tests/safe_spawn_test.mjs
          node --check tools/s31_hil_bridge.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
