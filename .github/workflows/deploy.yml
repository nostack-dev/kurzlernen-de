name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair shared GAME pointer handler
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("sim/controller.mjs")
          text=p.read_text()
          replacement='''function bindStick(element,kind){
            let pointer=null;
            element.addEventListener("pointerdown",event=>{pointer=event.pointerId;element.setPointerCapture(pointer);apply(event);event.preventDefault();});
            element.addEventListener("pointermove",event=>{if(event.pointerId===pointer)apply(event);});
            const release=event=>{
              if(event.pointerId!==pointer)return;
              endPointerDrag(element,event.pointerId);pointer=null;
              if(gameMode){
                if(kind==="left"){controls.roll=0;controls.pitch=0;controls.throttle=0;}
                else{controls.yaw=0;controls.bodyPitch=0;}
              }else releaseStick(controls,kind);
              updateSticks();publish();event.preventDefault();
            };
            element.addEventListener("pointerup",release);element.addEventListener("pointercancel",release);
            function apply(event){
              const point=normalizedPointer(element,event);
              if(gameMode)applyGameStick(controls,kind,point,phoneSettings);
              else applyStick(controls,kind,point,phoneSettings);
              updateSticks();publish();
            }
          }

          '''
          new,count=re.subn(r'function bindStick\(element,kind\)\{.*?\n\}\n\n(?=ui\.gameModeButton\.onclick)',replacement,text,count=1,flags=re.S)
          assert count==1,f"bindStick replacement count {count}"
          p.write_text(new)
          PY
          node --check sim/control_semantics.mjs
          node --check sim/controller.mjs
          node --check sim/simulator.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          grep -q 'if(gameMode)applyGameStick(controls,kind,point,phoneSettings)' sim/controller.mjs
          grep -q 'applyGameStick(soloControls,kind,point,phoneSettings)' sim/simulator.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/controller.mjs
          git diff --cached --check
          git commit -m "Repair shared GAME pointer handler [skip ci]"
          git push origin HEAD:main
