name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  align:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align 1-PHONE and 2-PHONE GAME controls
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if new in text:
                  return
              count=text.count(old)
              assert count==1, f"{path}: expected one match, got {count}"
              p.write_text(text.replace(old,new,1))

          semantics=Path("sim/control_semantics.mjs")
          text=semantics.read_text()
          if "export function applyGameStick" not in text:
              marker='export function applyStick(controls,kind,point,settings=DEFAULT_PHONE_SETTINGS){\n'
              assert marker in text
              shared='''export function applyGameStick(controls,kind,point,settings=DEFAULT_PHONE_SETTINGS){
            const cfg=normalizePhoneSettings(settings);
            if(kind==="left"){
              const x=cfg.invertLeftHorizontal?-point.x:point.x;
              // FC GAME convention: negative roll command is physical RIGHT strafe.
              controls.roll=cfg.lockLeftHorizontal?0:phoneAxis(-x,cfg.leftFineness);
              controls.pitch=phoneAxis(-point.y,cfg.leftFineness);
              controls.throttle=0;
            }else{
              const x=cfg.invertRightHorizontal?-point.x:point.x;
              const y=cfg.invertRightVertical?-point.y:point.y;
              controls.yaw=phoneAxis(-x,cfg.rightFineness);
              controls.bodyPitch=cfg.lockRightHorizontal?0:phoneAxis(-y,cfg.rightFineness);
            }
            return controls;
          }
          export function gameKnobAxes(controls,kind,settings=DEFAULT_PHONE_SETTINGS){
            const cfg=normalizePhoneSettings(settings);
            if(kind==="left"){
              const rawX=cfg.lockLeftHorizontal?0:-inversePhoneAxis(controls.roll,cfg.leftFineness);
              return{x:cfg.invertLeftHorizontal?-rawX:rawX,y:-inversePhoneAxis(controls.pitch,cfg.leftFineness)};
            }
            const rawX=-inversePhoneAxis(controls.yaw,cfg.rightFineness);
            const rawY=cfg.lockRightHorizontal?0:-inversePhoneAxis(controls.bodyPitch||0,cfg.rightFineness);
            return{x:cfg.invertRightHorizontal?-rawX:rawX,y:cfg.invertRightVertical?-rawY:rawY};
          }

          '''
              semantics.write_text(text.replace(marker,shared+marker,1))

          replace_once("sim/controller.mjs",
            'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis}',
            'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes}')
          replace_once("sim/controller.mjs",'''    const leftRawX=phoneSettings.lockLeftHorizontal?0:inversePhoneAxis(controls.roll,phoneSettings.leftFineness);
            left={x:phoneSettings.invertLeftHorizontal?-leftRawX:leftRawX,y:-inversePhoneAxis(controls.pitch,phoneSettings.leftFineness)};
            const rawX=-inversePhoneAxis(controls.yaw,phoneSettings.rightFineness),rawY=phoneSettings.lockRightHorizontal?0:-inversePhoneAxis(controls.bodyPitch||0,phoneSettings.rightFineness);
            right={x:phoneSettings.invertRightHorizontal?-rawX:rawX,y:phoneSettings.invertRightVertical?-rawY:rawY};''','''    left=gameKnobAxes(controls,"left",phoneSettings);
            right=gameKnobAxes(controls,"right",phoneSettings);''')
          replace_once("sim/controller.mjs",'''    if(gameMode){
              if(kind==="left"){
                const x=phoneSettings.invertLeftHorizontal?-point.x:point.x;
                controls.roll=phoneSettings.lockLeftHorizontal?0:phoneAxis(x,phoneSettings.leftFineness);
                controls.pitch=phoneAxis(-point.y,phoneSettings.leftFineness);
                controls.throttle=0;
              }else{
                const x=phoneSettings.invertRightHorizontal?-point.x:point.x;
                const y=phoneSettings.invertRightVertical?-point.y:point.y;
                controls.yaw=phoneAxis(-x,phoneSettings.rightFineness);
                controls.bodyPitch=phoneSettings.lockRightHorizontal?0:phoneAxis(-y,phoneSettings.rightFineness);
              }
            }else applyStick(controls,kind,point,phoneSettings);''','''    if(gameMode)applyGameStick(controls,kind,point,phoneSettings);
            else applyStick(controls,kind,point,phoneSettings);''')

          replace_once("sim/simulator.mjs",
            'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis}',
            'applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes}')
          replace_once("sim/simulator.mjs",'''  const left={x:phoneSettings.lockLeftHorizontal?0:inversePhoneAxis(soloControls.roll,phoneSettings.leftFineness),y:-inversePhoneAxis(soloControls.pitch,phoneSettings.leftFineness)};
            const rawX=-inversePhoneAxis(soloControls.yaw,phoneSettings.rightFineness),rawY=phoneSettings.lockRightHorizontal?0:-inversePhoneAxis(soloControls.bodyPitch||0,phoneSettings.rightFineness);
            const right={x:phoneSettings.invertRightHorizontal?-rawX:rawX,y:phoneSettings.invertRightVertical?-rawY:rawY};''','''  const left=gameKnobAxes(soloControls,"left",phoneSettings);
            const right=gameKnobAxes(soloControls,"right",phoneSettings);''')
          replace_once("sim/simulator.mjs",'''  const apply=e=>{const point=normalizedPointer(el,e);if(kind==="left"){soloControls.roll=phoneSettings.lockLeftHorizontal?0:phoneAxis(point.x,phoneSettings.leftFineness);soloControls.pitch=phoneAxis(-point.y,phoneSettings.leftFineness);soloControls.throttle=0;}else{const x=phoneSettings.invertRightHorizontal?-point.x:point.x,y=phoneSettings.invertRightVertical?-point.y:point.y;soloControls.yaw=phoneAxis(-x,phoneSettings.rightFineness);soloControls.bodyPitch=phoneSettings.lockRightHorizontal?0:phoneAxis(-y,phoneSettings.rightFineness);}updateSoloSticks();e.preventDefault();};''','''  const apply=e=>{const point=normalizedPointer(el,e);applyGameStick(soloControls,kind,point,phoneSettings);updateSoloSticks();e.preventDefault();};''')

          test=Path("tests/control_semantics_test.mjs")
          text=test.read_text()
          if "applyGameStick,gameKnobAxes" not in text:
              text=text.replace('knobAxes,phoneAxis,inversePhoneAxis,finenessToExpo,normalizedPointer,endPointerDrag','knobAxes,phoneAxis,inversePhoneAxis,finenessToExpo,normalizedPointer,endPointerDrag,applyGameStick,gameKnobAxes',1)
          marker='// Re-touching a retained throttle must not teleport it to the absolute touch point.\n'
          if "GAME left-stick physical strafe contract" not in text:
              assert marker in text
              block='''// GAME left-stick physical strafe contract. This is shared by 1-PHONE and 2-PHONE.
          // FC convention after the body-frame fix: +roll command produces LEFT strafe,
          // -roll command produces RIGHT strafe. Pointer direction must therefore map oppositely.
          let game=neutralControls();
          applyGameStick(game,"left",{x:-.60,y:0},DEFAULT_PHONE_SETTINGS);
          assert.ok(game.roll>0,"left-stick LEFT must command physical LEFT strafe");
          let gameKnob=gameKnobAxes(game,"left",DEFAULT_PHONE_SETTINGS);
          near(gameKnob.x,-.60,3e-6,"left-strife knob must remain under left pointer");
          game=neutralControls();
          applyGameStick(game,"left",{x:.60,y:0},DEFAULT_PHONE_SETTINGS);
          assert.ok(game.roll<0,"left-stick RIGHT must command physical RIGHT strafe");
          gameKnob=gameKnobAxes(game,"left",DEFAULT_PHONE_SETTINGS);
          near(gameKnob.x,.60,3e-6,"right-strafe knob must remain under right pointer");
          const gameInvertLeft={...DEFAULT_PHONE_SETTINGS,invertLeftHorizontal:true};
          game=neutralControls();applyGameStick(game,"left",{x:-.60,y:0},gameInvertLeft);
          assert.ok(game.roll<0,"invert-left-horizontal must swap LEFT to physical RIGHT strafe");
          game=neutralControls();applyGameStick(game,"left",{x:.60,y:0},gameInvertLeft);
          assert.ok(game.roll>0,"invert-left-horizontal must swap RIGHT to physical LEFT strafe");

          '''
              text=text.replace(marker,block+marker,1)
          test.write_text(text)
          PY
          node --check sim/control_semantics.mjs
          node --check sim/controller.mjs
          node --check sim/simulator.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/control_semantics.mjs sim/controller.mjs sim/simulator.mjs tests/control_semantics_test.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Unify GAME controls and lock strafe direction [skip ci]"
            git push origin HEAD:main
          fi
