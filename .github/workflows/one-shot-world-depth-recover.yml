name: one-shot WORLD visual depth recover

on:
  push:
    branches: ["fix/world-fpv-frame-lock"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-frame-lock
          fetch-depth: 0
      - name: Apply validated visual patch and update invariants
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/one-shot-world-depth.yml').read_text()
          start=workflow.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=workflow.index("\n          PY\n",start)
          patch=textwrap.dedent(workflow[start:end])
          Path('/tmp/world_depth_patch.py').write_text(patch)
          PY
          python3 /tmp/world_depth_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          old='setSky({\\"sky-color\\":\\"#0a2845\\"'
          new='setSky({\\"sky-color\\":\\"#071b2e\\"'
          assert s.count(old)==1,s.count(old);s=s.replace(old,new,1)
          old='for(const marker of ["TorusGeometry(.15","worldHalo.visible=worldActive&&cameraMode!==\\"fpv\\""])requireText("sim/simulator.mjs",marker);'
          new='for(const marker of ["TorusGeometry(.15","worldHaloBack","worldHeadingCue","showWorldMarker=worldActive&&cameraMode!==\\"fpv\\""])requireText("sim/simulator.mjs",marker);'
          assert s.count(old)==1,s.count(old);s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/one-shot-world-depth-recover.yml').unlink()
          PY
          node --check sim/real_world_bootstrap.mjs
          node --check sim/simulator.mjs
          node --check tests/real_world_ui_smoke.mjs
          node --check tests/architecture_invariants.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Improve WORLD visual depth and contrast"
          git push origin HEAD:fix/world-fpv-frame-lock
