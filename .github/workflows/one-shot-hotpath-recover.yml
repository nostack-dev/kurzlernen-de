name: One-shot recover SIL hotpath patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-hotpath-recover.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply validated product patch and remove scaffolds
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          source=Path('.github/workflows/one-shot-hotpath-safe.yml').read_text()
          m=re.search(r"echo '([^']+)' \| base64 -d",source)
          assert m,'embedded patch payload missing'
          script=base64.b64decode(m.group(1)).decode()
          lines=script.splitlines(True)
          fixed=[];skip=False
          for line in lines:
              if line.startswith('const physicsStepStart=simulatorSource.indexOf('):
                  skip=True
                  continue
              if skip:
                  if '1 kHz PhysicsModel.step performs redundant full-state readback' in line:
                      skip=False
                  continue
              fixed.append(line)
          assert not skip,'failed to close misplaced invariant block'
          Path('/tmp/patch.py').write_text(''.join(fixed))
          Path('.github/workflows/one-shot-hotpath-recover.yml').unlink()
          PY
          python3 /tmp/patch.py
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Remove non-authoritative work from 1kHz SIL hot path"
          git push origin HEAD:main
