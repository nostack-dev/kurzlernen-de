name: One-shot exact realtime scheduler

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-realtime-scheduler.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fix wall-time scheduler without changing flight truth
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def one(path, old, new):
              p=Path(path);s=p.read_text();n=s.count(old)
              assert n==1,f"{path}: expected one match, got {n}: {old[:140]!r}"
              p.write_text(s.replace(old,new,1))

          # Validate the production tree, not the transaction scaffold.
          Path('.github/workflows/one-shot-realtime-scheduler.yml').unlink()

          # A display frame is not a simulation clock. Keep exact 1 ms steps, retain
          # bounded backlog, and yield only CPU ownership -- never simulation time.
          one('sim/simulator.mjs',
              '''const SIM_FIXED_STEP_MS = DT * 1000;\nconst SIM_MAX_CATCHUP_MS = 50;\nconst SIM_MAX_STEPS_PER_FRAME = Math.ceil(SIM_MAX_CATCHUP_MS / SIM_FIXED_STEP_MS);\n''',
              '''const SIM_FIXED_STEP_MS = DT * 1000;\nconst SIM_MAX_BACKLOG_MS = 250;\nconst SIM_WORK_SLICE_MS = 7;\nconst SIM_MAX_STEPS_PER_SLICE = 64;\nconst SIM_HOUSEKEEPING_STEPS = 10;\nconst yieldToBrowser=()=>new Promise(resolve=>setTimeout(resolve,0));\n''')

          # Pure observation used to be computed twice per 1 ms tick. Physics state
          # reads do not affect Box3D integration, so return it only when a caller
          # actually asks (replay integration).
          one('sim/simulator.mjs',
              '''  step(pulses,dt=DT){\n    this.applyForces(pulses,dt);\n    const before=this.linear();\n    b3.b3World_Step(this.world,dt,4);\n    this.worldAcceleration=scale(sub(this.linear(),before),1/dt);\n    return this.state();\n  }\n''',
              '''  step(pulses,dt=DT){\n    this.applyForces(pulses,dt);\n    const before=this.linear();\n    b3.b3World_Step(this.world,dt,4);\n    this.worldAcceleration=scale(sub(this.linear(),before),1/dt);\n  }\n''')
          one('sim/simulator.mjs',
              '''function integrateDuration(model,pulses,duration){\n  if(!(duration>0))return model.state();\n  let remaining=duration,state=model.state();\n  while(remaining>1e-9){const step=Math.min(DT,remaining);state=model.step(pulses,step);remaining-=step;}\n  return state;\n}\n''',
              '''function integrateDuration(model,pulses,duration){\n  if(!(duration>0))return model.state();\n  let remaining=duration;\n  while(remaining>1e-9){const step=Math.min(DT,remaining);model.step(pulses,step);remaining-=step;}\n  return model.state();\n}\n''')

          # FC + sensor + motor + Box3D authority remains at 1 kHz. Race crossing
          # and session logging are observers only, sampled at 100 Hz. Gate crossing
          # itself remains segment-based, so this does not alter aircraft motion.
          old='''async function loop(){\n  let schedulerWallMs=performance.now(),accumulatorMs=0;\n  while(running){\n    if(mode==="replay"){await replayStep();continue;}\n    await new Promise(requestAnimationFrame);\n    const now=performance.now(),elapsedMs=clamp(now-schedulerWallMs,0,SIM_MAX_CATCHUP_MS);schedulerWallMs=now;\n    accumulatorMs=Math.min(accumulatorMs+elapsedMs,SIM_MAX_CATCHUP_MS);\n    const due=Math.min(Math.floor(accumulatorMs/SIM_FIXED_STEP_MS),SIM_MAX_STEPS_PER_FRAME),wasmFastPath=mode==="sim"&&backend instanceof WasmBackend;\n    for(let i=0;i<due&&running;i++){\n      latest=wasmFastPath?controllerStepSync():await controllerStep();physics.step(latest.motors,DT);simTime+=DT;raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();accumulatorMs-=SIM_FIXED_STEP_MS;\n    }\n  }\n}\n'''
          new='''async function loop(){\n  let schedulerWallMs=performance.now(),accumulatorMs=0,housekeepingSteps=0;\n  while(running){\n    if(mode==="replay"){await replayStep();continue;}\n    const now=performance.now(),elapsedMs=Math.max(0,now-schedulerWallMs);schedulerWallMs=now;\n    accumulatorMs=Math.min(accumulatorMs+elapsedMs,SIM_MAX_BACKLOG_MS);\n    if(accumulatorMs<SIM_FIXED_STEP_MS){await new Promise(requestAnimationFrame);continue;}\n    const sliceStart=performance.now(),wasmFastPath=mode==="sim"&&backend instanceof WasmBackend;let steps=0;\n    while(accumulatorMs>=SIM_FIXED_STEP_MS&&steps<SIM_MAX_STEPS_PER_SLICE&&running){\n      latest=wasmFastPath?controllerStepSync():await controllerStep();physics.step(latest.motors,DT);simTime+=DT;accumulatorMs-=SIM_FIXED_STEP_MS;steps++;\n      if(++housekeepingSteps>=SIM_HOUSEKEEPING_STEPS){housekeepingSteps=0;raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();}\n      if(performance.now()-sliceStart>=SIM_WORK_SLICE_MS)break;\n    }\n    if(accumulatorMs>=SIM_FIXED_STEP_MS)await yieldToBrowser();else await new Promise(requestAnimationFrame);\n  }\n}\n'''
          one('sim/simulator.mjs',old,new)

          # Tighten runtime proof: real-time means near real-time, not merely >0.7x.
          p=Path('tests/browser_sim_smoke.mjs');s=p.read_text()
          s=s.replace('cadenceRatio>.70&&cadenceRatio<1.30','cadenceRatio>.90&&cadenceRatio<1.10')
          p.write_text(s)

          # Permanent architecture proof: no rAF tax when the simulator is behind,
          # and no physical integration work is downsampled.
          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          s=s.replace('requireText("sim/simulator.mjs","accumulatorMs=Math.min(accumulatorMs+elapsedMs,SIM_MAX_CATCHUP_MS)");',
                      'requireText("sim/simulator.mjs","accumulatorMs=Math.min(accumulatorMs+elapsedMs,SIM_MAX_BACKLOG_MS)");\nrequireText("sim/simulator.mjs","SIM_WORK_SLICE_MS = 7");\nrequireText("sim/simulator.mjs","yieldToBrowser()");\nrequireText("sim/simulator.mjs","while(accumulatorMs>=SIM_FIXED_STEP_MS");\nrequireText("sim/simulator.mjs","SIM_HOUSEKEEPING_STEPS = 10");')
          p.write_text(s)

          p=Path('REAL_WORLD_DIGITAL_TWIN.md');doc=p.read_text().rstrip()+'''\n\nThe fixed-step scheduler does not pay one display-frame wait after every simulation batch. It accumulates actual wall time, executes exact 1 ms FC/sensor/Box3D steps in bounded CPU slices, yields the JavaScript main thread when backlog remains, and waits for `requestAnimationFrame` only when caught up. A bounded 250 ms backlog prevents a spiral after long browser suspension without silently converting 60/120 Hz display cadence into slower simulated time. Non-authoritative race crossing and session-log observation run at 100 Hz; controller, raw sensors, motor pulses and rigid-body integration remain 1 kHz.\n''';p.write_text(doc)

          for path in ['sim/simulator.mjs','tests/browser_sim_smoke.mjs','tests/architecture_invariants.mjs']:
              subprocess.run(['node','--check',path],check=True)
          subprocess.run(['node','tests/control_semantics_test.mjs'],check=True)
          subprocess.run(['node','tests/architecture_invariants.mjs'],check=True)
          subprocess.run(['g++','-std=c++17','-O2','-Wall','-Wextra','-Wpedantic','-Werror','-Iesp32','tests/state_control_test.cpp','-o','/tmp/state-control'],check=True)
          subprocess.run(['/tmp/state-control'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          PY
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Make 1kHz simulation track wall time without shortcuts"
          git push origin HEAD:main
