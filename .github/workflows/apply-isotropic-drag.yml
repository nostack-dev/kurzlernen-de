name: Apply verified isotropic drag

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'RUN_ISOTROPIC_DRAG_PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact verified plant drag correction
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/simulator.mjs')
          s=p.read_text()
          old='''const relative=this.localVector(sub(this.linear(),p.wind)),cdA=this.cdA,drag=relative.map((v,i)=>-.5*p.rho*cdA[i]*v*Math.abs(v));'''
          new='''const relative=this.localVector(sub(this.linear(),p.wind)),cdA=this.cdA,horizontalSpeed=Math.hypot(relative[0],relative[1]),drag=[-.5*p.rho*cdA[0]*relative[0]*horizontalSpeed,-.5*p.rho*cdA[1]*relative[1]*horizontalSpeed,-.5*p.rho*cdA[2]*relative[2]*Math.abs(relative[2])];'''
          assert old in s, 'verified old separable drag formula not found'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/architecture_invariants.mjs')
          s=p.read_text()
          marker='''requireText("sim/simulator.mjs","physics.step(latest.motors");'''
          insert=marker+'''\nrequireText("sim/simulator.mjs","horizontalSpeed=Math.hypot(relative[0],relative[1])","horizontal drag must use total body-plane airspeed");\nforbidText("sim/simulator.mjs","drag=relative.map((v,i)=>-.5*p.rho*cdA[i]*v*Math.abs(v))","separable x/y quadratic drag makes diagonal flight artificially low-drag");'''
          assert marker in s, 'architecture insertion marker missing'
          p.write_text(s.replace(marker,insert,1))
          PY
          node --check sim/simulator.mjs
          node --check tests/architecture_invariants.mjs
          node tests/architecture_invariants.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/simulator.mjs tests/architecture_invariants.mjs
          git commit -m 'Use isotropic horizontal aerodynamic drag'
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Report source commit
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`ISOTROPIC_DRAG_PATCH_OK source=${process.env.SOURCE_SHA}`});
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'ISOTROPIC_DRAG_PATCH_FAILED'});
