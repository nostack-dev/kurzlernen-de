name: Nostr data relay probe

on:
  push:
    branches:
      - fix/nostr-data-relay

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build Nostr data relay browser probe
        run: |
          set -euxo pipefail
          TMP=/tmp/nostr-relay-node
          mkdir -p "$TMP" generated
          cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund nostr-tools@2.24.1 esbuild@0.25.8 puppeteer-core@24.16.0
          ln -s "$TMP/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          node --check sim/nostr_data_relay.mjs
          node --check tests/nostr_data_relay_browser_smoke.mjs
          ./node_modules/.bin/esbuild sim/nostr_data_relay.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=generated/nostr_data_relay_probe.mjs
          node --check generated/nostr_data_relay_probe.mjs
      - name: Real two-browser Nostr E2EE data path
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/nostr-probe-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/nostr_data_relay_browser_smoke.mjs http://127.0.0.1:4174
