name: One-shot WORLD orbit grid speed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply WORLD orbit grid speed patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              s=p.read_text()
              actual=s.count(old)
              assert actual==count, f"{path}: expected {count} occurrences of {old!r}, got {actual}"
              p.write_text(s.replace(old,new,count))

          # Shared FC command envelope: this is not a simulator multiplier. The
          # same 12 m/s target cap compiles into Production, HIL and WASM.
          replace('esp32/Arondight45_StateControl.hpp',
                  'constexpr float kStateMaxHorizontalSpeedMps = 5.0f;',
                  '// 5 m/s was a training-range UX cap. WORLD uses the same real FC path,\n// so enlarge the shared command envelope instead of adding a simulator speed hack.\nconstexpr float kStateMaxHorizontalSpeedMps = 12.0f;')

          # WORLD adapter owns camera-only orbit/look and the render-only grid.
          p=Path('sim/real_world_bootstrap.mjs')
          s=p.read_text()
          s=s.replace('const WORLD_MAP_ANGLE_EPS_DEG=.18;\n', '''const WORLD_MAP_ANGLE_EPS_DEG=.18;\nconst WORLD_GRID_STORAGE="arondight45WorldGridV1";\nconst WORLD_KEEP_LOOK_STORAGE="arondight45WorldKeepLookV1";\nconst WORLD_LOOK_SNAP_RATE=8;\n''',1)
          s=s.replace('const angularDistanceDeg=(a,b)=>Math.abs((((a-b)+540)%360)-180);\n', '''const angularDistanceDeg=(a,b)=>Math.abs((((a-b)+540)%360)-180);\nconst loadBool=(key,fallback)=>{try{const raw=localStorage.getItem(key);return raw===null?fallback:raw==="1";}catch{return fallback;}};\n''',1)
          old='this.active=false;this.loading=false;this.map=null;this.originLon=null;this.originLat=null;this.threeRenderer=null;this.threeScene=null;this.threeCamera=null;this.flightPixelRatio=null;this.flightShadowEnabled=null;this.geoContainer=null;this.worldCard=null;this.savedBackground=null;this.savedFog=null;this.trainingObjects=new Set();this.frameVisibility=new Map();this.lastLocation=null;this.lastViewportSize="";this.lastMapSyncMs=-Infinity;this.lastMapView=null;this.realFrames=0;this.mapUpdates=0;\n    this.installUi();'
          new='this.active=false;this.loading=false;this.map=null;this.originLon=null;this.originLat=null;this.threeRenderer=null;this.threeScene=null;this.threeCamera=null;this.flightPixelRatio=null;this.flightShadowEnabled=null;this.geoContainer=null;this.worldCard=null;this.savedBackground=null;this.savedFog=null;this.trainingObjects=new Set();this.frameVisibility=new Map();this.lastLocation=null;this.lastViewportSize="";this.lastMapSyncMs=-Infinity;this.lastMapView=null;this.realFrames=0;this.mapUpdates=0;this.gridEnabled=loadBool(WORLD_GRID_STORAGE,true);this.keepLookOrientation=loadBool(WORLD_KEEP_LOOK_STORAGE,false);this.lookYawDeg=0;this.lookPitchDeg=0;this.lookDragging=false;this.lookSnapping=false;this.lookPointer=null;this.lookFrameMs=performance.now();this.lookHud=null;this.lookPlane=null;this.lookReadout=null;this.airframe=null;\n    this.installUi();this.installLookHud();'
          assert s.count(old)==1; s=s.replace(old,new,1)
          s=s.replace('''      #geoViewport .geo-attribution{position:absolute;right:4px;bottom:3px;z-index:4;padding:2px 5px;border-radius:4px;background:#07101acc;color:#d8e0ea;font:8px/1.25 system-ui,-apple-system,sans-serif;pointer-events:none}\n      #realWorldStatus{line-height:1.4}''', '''      #geoViewport .geo-attribution{position:absolute;right:4px;bottom:3px;z-index:4;padding:2px 5px;border-radius:4px;background:#07101acc;color:#d8e0ea;font:8px/1.25 system-ui,-apple-system,sans-serif;pointer-events:none}\n      #worldLookHud{display:none;position:absolute;z-index:4;right:max(10px,env(safe-area-inset-right));top:max(48px,calc(env(safe-area-inset-top) + 42px));width:116px;height:116px;border:1px solid #8cdcff88;border-radius:16px;background:#071522d9;box-shadow:0 8px 26px #0008,inset 0 0 22px #2f9bd322;backdrop-filter:blur(7px);touch-action:none;user-select:none;overflow:hidden;color:#dff7ff}\n      body.solo-flight #viewport[data-world-mode="real"] #worldLookHud{display:block}\n      #worldLookHud .world-look-title{position:absolute;left:7px;right:7px;top:5px;z-index:3;display:flex;justify-content:space-between;font:800 7px/1.1 system-ui,-apple-system,sans-serif;letter-spacing:.09em;color:#aeeaff;pointer-events:none}\n      #worldLookHud .world-look-stage{position:absolute;left:9px;right:9px;top:22px;bottom:8px;perspective:110px;border-radius:50%;overflow:hidden;border:1px solid #8cdcff55;background:radial-gradient(circle at 50% 44%,#274c6288 0 7%,#0a2134dd 48%,#06121ddd 72%);pointer-events:none}\n      #worldLookHud .world-look-plane{position:absolute;inset:17px 8px 5px;background:repeating-linear-gradient(0deg,#7bdcff42 0 1px,transparent 1px 11px),repeating-linear-gradient(90deg,#7bdcff42 0 1px,transparent 1px 11px);border:1px solid #7bdcff66;transform-origin:50% 58%;transform:rotateX(60deg) rotateZ(0deg);box-shadow:0 0 14px #55cfff22}\n      #worldLookHud .world-look-drone{position:absolute;left:50%;top:51%;width:23px;height:23px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 5px #a9eeff);pointer-events:none}\n      #worldLookHud .world-look-drone:before,#worldLookHud .world-look-drone:after{content:"";position:absolute;left:2px;right:2px;top:10px;height:3px;border-radius:3px;background:#d8f7ff}\n      #worldLookHud .world-look-drone:after{transform:rotate(90deg)}\n      #worldLookHud .world-look-nose{position:absolute;left:9px;top:-4px;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:8px solid #ff5c76}\n      #worldLookHud .world-look-cardinal{position:absolute;font:900 7px system-ui,-apple-system,sans-serif;color:#72d9ff;opacity:.85;pointer-events:none}.world-look-n{top:22px;left:53px}.world-look-e{top:62px;right:12px}.world-look-s{bottom:9px;left:54px}.world-look-w{top:62px;left:12px}\n      #realWorldStatus{line-height:1.4}''',1)
          marker='''  status(text,kind=""){const el=$("realWorldStatus");if(!el)return;el.textContent=text;el.className=`statusline ${kind}`;}'''
          methods='''  installLookHud(){\n    const viewport=$("viewport");if(!viewport||this.lookHud)return;\n    const hud=document.createElement("div");hud.id="worldLookHud";hud.setAttribute("aria-label","WORLD free 360 degree camera look");hud.innerHTML='<div class="world-look-title"><span>360° LOOK</span><span data-world-look-readout>SNAP</span></div><div class="world-look-stage"><div class="world-look-plane"></div><div class="world-look-drone"><i class="world-look-nose"></i></div></div><b class="world-look-cardinal world-look-n">N</b><b class="world-look-cardinal world-look-e">E</b><b class="world-look-cardinal world-look-s">S</b><b class="world-look-cardinal world-look-w">W</b>';\n    viewport.appendChild(hud);this.lookHud=hud;this.lookPlane=hud.querySelector(".world-look-plane");this.lookReadout=hud.querySelector("[data-world-look-readout]");\n    const update=(event)=>{if(!this.lookDragging||event.pointerId!==this.lookPointer?.id)return;const dx=event.clientX-this.lookPointer.x,dy=event.clientY-this.lookPointer.y;this.lookYawDeg=((this.lookPointer.yaw+dx*.85+540)%360)-180;this.lookPitchDeg=clamp(this.lookPointer.pitch-dy*.62,-75,60);this.lookSnapping=false;this.renderLookHud();};\n    hud.addEventListener("pointerdown",event=>{event.preventDefault();hud.setPointerCapture?.(event.pointerId);this.lookDragging=true;this.lookSnapping=false;this.lookPointer={id:event.pointerId,x:event.clientX,y:event.clientY,yaw:this.lookYawDeg,pitch:this.lookPitchDeg};this.renderLookHud();});\n    hud.addEventListener("pointermove",update);\n    const release=event=>{if(event.pointerId!==this.lookPointer?.id)return;this.lookDragging=false;this.lookPointer=null;if(!this.keepLookOrientation)this.lookSnapping=true;this.renderLookHud();};\n    hud.addEventListener("pointerup",release);hud.addEventListener("pointercancel",release);hud.addEventListener("dblclick",()=>this.resetLook(true));this.renderLookHud();\n  }\n  renderLookHud(){\n    if(this.lookPlane)this.lookPlane.style.transform=`rotateX(${clamp(60-this.lookPitchDeg*.28,38,78)}deg) rotateZ(${-this.lookYawDeg}deg)`;\n    if(this.lookReadout)this.lookReadout.textContent=this.lookDragging?`${Math.round(this.lookYawDeg)}°`:this.keepLookOrientation?`KEEP · ${Math.round(this.lookYawDeg)}°`:this.lookSnapping?"SNAP ↺":"SNAP";\n    const viewport=$("viewport");if(viewport){viewport.dataset.worldLookYaw=this.lookYawDeg.toFixed(2);viewport.dataset.worldLookPitch=this.lookPitchDeg.toFixed(2);viewport.dataset.worldLookKeep=this.keepLookOrientation?"1":"0";viewport.dataset.worldGrid=this.gridEnabled?"1":"0";}\n  }\n  setGridEnabled(value){this.gridEnabled=Boolean(value);try{localStorage.setItem(WORLD_GRID_STORAGE,this.gridEnabled?"1":"0");}catch{}this.renderLookHud();return this.gridEnabled;}\n  setKeepLookOrientation(value){this.keepLookOrientation=Boolean(value);try{localStorage.setItem(WORLD_KEEP_LOOK_STORAGE,this.keepLookOrientation?"1":"0");}catch{}if(!this.keepLookOrientation&&!this.lookDragging&&(Math.abs(this.lookYawDeg)>.05||Math.abs(this.lookPitchDeg)>.05))this.lookSnapping=true;this.renderLookHud();return this.keepLookOrientation;}\n  resetLook(immediate=false){this.lookDragging=false;this.lookPointer=null;if(immediate){this.lookYawDeg=0;this.lookPitchDeg=0;this.lookSnapping=false;}else this.lookSnapping=true;this.renderLookHud();}\n  stepLook(now){const dt=clamp((now-this.lookFrameMs)/1000,0,.05);this.lookFrameMs=now;if(this.lookSnapping&&!this.lookDragging){const decay=Math.exp(-WORLD_LOOK_SNAP_RATE*dt);this.lookYawDeg*=decay;this.lookPitchDeg*=decay;if(Math.abs(this.lookYawDeg)<.08&&Math.abs(this.lookPitchDeg)<.08){this.lookYawDeg=0;this.lookPitchDeg=0;this.lookSnapping=false;}this.renderLookHud();}}\n  airframeFor(scene){if(this.airframe?.parent)return this.airframe;scene.traverse(node=>{if(!this.airframe&&node.userData?.arondightAirframe)this.airframe=node;});return this.airframe;}\n  applyLookCamera(scene,camera){\n    this.stepLook(performance.now());if(Math.abs(this.lookYawDeg)<.001&&Math.abs(this.lookPitchDeg)<.001)return;const airframe=this.airframeFor(scene);if(!airframe)return;const mode=$("viewport")?.dataset.cameraMode||"follow",yaw=THREE.MathUtils.degToRad(this.lookYawDeg),pitch=THREE.MathUtils.degToRad(this.lookPitchDeg),worldUp=new THREE.Vector3(0,0,1);\n    if(mode==="fpv"){const qYaw=new THREE.Quaternion().setFromAxisAngle(worldUp,-yaw);camera.quaternion.premultiply(qYaw);const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion).normalize(),qPitch=new THREE.Quaternion().setFromAxisAngle(right,pitch);camera.quaternion.premultiply(qPitch);return;}\n    const target=airframe.position.clone();target.z+=.10;const relative=camera.position.clone().sub(target);relative.applyAxisAngle(worldUp,-yaw);const radial=relative.clone().normalize(),right=new THREE.Vector3().crossVectors(radial,worldUp);if(right.lengthSq()>.0001)relative.applyAxisAngle(right.normalize(),pitch);camera.position.copy(target).add(relative);camera.up.copy(worldUp);camera.lookAt(target);\n  }\n'''+marker
          assert s.count(marker)==1; s=s.replace(marker,methods,1)
          s=s.replace('hideTrainingWorld(scene){this.identifyTrainingObjects(scene);this.frameVisibility.clear();for(const child of this.trainingObjects){this.frameVisibility.set(child,child.visible);child.visible=false;}}', 'hideTrainingWorld(scene){this.identifyTrainingObjects(scene);this.frameVisibility.clear();for(const child of this.trainingObjects){if(child.isGridHelper&&this.gridEnabled)continue;this.frameVisibility.set(child,child.visible);child.visible=false;}}',1)
          s=s.replace('viewport.dataset.worldMapUpdates="0";', 'viewport.dataset.worldMapUpdates="0";viewport.dataset.worldGrid=this.gridEnabled?"1":"0";viewport.dataset.worldLookKeep=this.keepLookOrientation?"1":"0";this.renderLookHud();',1)
          s=s.replace('this.active=false;this.loading=false;if(this.geoContainer)', 'this.active=false;this.loading=false;this.resetLook(true);if(this.geoContainer)',1)
          s=s.replace('delete viewport.dataset.worldFlightPixelRatio;delete viewport.dataset.worldSymbolsRemoved;}', 'delete viewport.dataset.worldFlightPixelRatio;delete viewport.dataset.worldSymbolsRemoved;delete viewport.dataset.worldLookYaw;delete viewport.dataset.worldLookPitch;delete viewport.dataset.worldLookKeep;delete viewport.dataset.worldGrid;}',1)
          s=s.replace('''    const now=performance.now(),viewport=$("viewport"),cameraMode=viewport.dataset.cameraMode||"follow",forceMode=cameraMode!==(viewport.dataset.worldCameraMode||"");\n    if(!forceMode&&now-this.lastMapSyncMs<WORLD_MAP_FRAME_MS)return;''', '''    const now=performance.now(),viewport=$("viewport"),cameraMode=viewport.dataset.cameraMode||"follow",forceMode=cameraMode!==(viewport.dataset.worldCameraMode||"");\n    if(forceMode&&viewport.dataset.worldCameraMode)this.resetLook(true);\n    if(!forceMode&&now-this.lastMapSyncMs<WORLD_MAP_FRAME_MS)return;''',1)
          s=s.replace('''  renderReal(scene,camera){\n    this.syncMapCamera(camera);const renderer=this.threeRenderer;if(!renderer)return;''', '''  renderReal(scene,camera){\n    this.applyLookCamera(scene,camera);this.syncMapCamera(camera);const renderer=this.threeRenderer;if(!renderer)return;''',1)
          p.write_text(s)

          # Add the WORLD render settings to the existing phone settings modal.
          p=Path('sim/control_settings.mjs');s=p.read_text()
          old='''    <div class="world-settings-status" data-world-status>TRAINING RANGE · local metric world</div>\n    <div class="world-settings-actions"><button type="button" data-world-use>USE MY GPS LOCATION</button><button type="button" data-world-training>TRAINING RANGE</button></div>\n    <p class="phone-settings-note">OSM map/building data is render/geospatial context only. Motor, sensor, FC and rigid-body physics stay on the same hardware-fit digital-twin path; map geometry is not collision truth.</p>`;'''
          new='''    <div class="world-settings-status" data-world-status>TRAINING RANGE · local metric world</div>\n    <div class="world-settings-actions"><button type="button" data-world-use>USE MY GPS LOCATION</button><button type="button" data-world-training>TRAINING RANGE</button></div>\n    <label class="phone-settings-toggle"><span>WORLD GRID</span><input data-world-grid type="checkbox"></label>\n    <label class="phone-settings-toggle"><span>KEEP 360° LOOK ORIENTATION</span><input data-world-keep-look type="checkbox"></label>\n    <p class="phone-settings-note">WORLD GRID is a render-only local metre reference. 360° LOOK is camera-only: OFF snaps smoothly back on release; ON keeps the released orientation. Neither changes flight state or map tile traffic.</p>\n    <p class="phone-settings-note">OSM map/building data is render/geospatial context only. Motor, sensor, FC and rigid-body physics stay on the same hardware-fit digital-twin path; map geometry is not collision truth.</p>`;'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='''  const status=section.querySelector("[data-world-status]"),use=section.querySelector("[data-world-use]"),training=section.querySelector("[data-world-training]");'''
          new='''  const status=section.querySelector("[data-world-status]"),use=section.querySelector("[data-world-use]"),training=section.querySelector("[data-world-training]"),grid=section.querySelector("[data-world-grid]"),keepLook=section.querySelector("[data-world-keep-look]");'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='''  const renderButton=()=>{worldButton.dataset.active=bridge.active?"1":"0";worldButton.dataset.loading=bridge.loading?"1":"0";worldButton.textContent=bridge.loading?"WORLD…":bridge.active?"WORLD ✓":"WORLD";syncStatus();};'''
          new='''  const renderButton=()=>{worldButton.dataset.active=bridge.active?"1":"0";worldButton.dataset.loading=bridge.loading?"1":"0";worldButton.textContent=bridge.loading?"WORLD…":bridge.active?"WORLD ✓":"WORLD";grid.checked=bridge.gridEnabled!==false;keepLook.checked=Boolean(bridge.keepLookOrientation);syncStatus();};'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='''  use.addEventListener("click",activate);training.addEventListener("click",()=>{bridge.deactivate();renderButton();});'''
          new='''  use.addEventListener("click",activate);training.addEventListener("click",()=>{bridge.deactivate();renderButton();});grid.addEventListener("change",()=>{bridge.setGridEnabled?.(grid.checked);renderButton();});keepLook.addEventListener("change",()=>{bridge.setKeepLookOrientation?.(keepLook.checked);renderButton();});dialog.querySelector("[data-reset]")?.addEventListener("click",()=>{bridge.setGridEnabled?.(true);bridge.setKeepLookOrientation?.(false);bridge.resetLook?.(true);renderButton();});'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          p.write_text(s)

          # Architecture/tests lock the new behavior to the render boundary.
          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          needle='requireText("esp32/Arondight45_StateControl.hpp","kStateMaxYawRateDps = 140.0f");'
          assert s.count(needle)==1;s=s.replace(needle,needle+'\nrequireText("esp32/Arondight45_StateControl.hpp","kStateMaxHorizontalSpeedMps = 12.0f");',1)
          needle='for(const marker of ["WORLD_MAP_FRAME_MS=1000/30","WORLD_MAP_PIXEL_RATIO=1.0","WORLD_FLIGHT_PIXEL_RATIO=1.25","maxTileCacheZoomLevels:2","refreshExpiredTiles:false","validateStyle:false","setSky({\\"sky-color\\":\\"#0a2845\\"","worldMapUpdates","angularDistanceDeg"])requireText("sim/real_world_bootstrap.mjs",marker);'
          replacement='for(const marker of ["WORLD_MAP_FRAME_MS=1000/30","WORLD_MAP_PIXEL_RATIO=1.0","WORLD_FLIGHT_PIXEL_RATIO=1.25","maxTileCacheZoomLevels:2","refreshExpiredTiles:false","validateStyle:false","crossSourceCollisions:false","trackResize:false","setSky({\\"sky-color\\":\\"#0a2845\\"","worldMapUpdates","angularDistanceDeg","WORLD_GRID_STORAGE","WORLD_KEEP_LOOK_STORAGE","installLookHud()","applyLookCamera(scene,camera)","child.isGridHelper&&this.gridEnabled"])requireText("sim/real_world_bootstrap.mjs",marker);'
          assert s.count(needle)==1;s=s.replace(needle,replacement,1)
          needle='requireText("sim/control_settings.mjs","No account, API key, billing setup, backend or proxy is required.");'
          assert s.count(needle)==1;s=s.replace(needle,needle+'\nrequireText("sim/control_settings.mjs","WORLD GRID");\nrequireText("sim/control_settings.mjs","KEEP 360° LOOK ORIENTATION");',1)
          p.write_text(s)

          p=Path('tests/state_control_test.cpp');s=p.read_text()
          needle='    fc::StateController controller;\n'
          assert s.count(needle)==1;s=s.replace(needle,'    CHECK(std::fabs(fc::kStateMaxHorizontalSpeedMps - 12.0f) < 0.001f);\n'+needle,1)
          p.write_text(s)

          # Extend the existing browser WORLD smoke with settings + actual pointer orbit.
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          old='''    training:document.querySelector("[data-world-training]")?.textContent?.trim()||"",\n    note:document.querySelector('[data-world-settings="openfreemap-osm-3d"]')?.textContent||""\n  }));\n  if(!config.section||config.key||config.forget||config.use!=="USE MY GPS LOCATION"||config.training!=="TRAINING RANGE"||!config.note.includes("No account, API key, billing setup, backend or proxy"))throw new Error(`REAL WORLD settings incomplete: ${JSON.stringify(config)}`);'''
          new='''    training:document.querySelector("[data-world-training]")?.textContent?.trim()||"",\n    grid:document.querySelector("[data-world-grid]")?.checked,\n    keepLook:document.querySelector("[data-world-keep-look]")?.checked,\n    note:document.querySelector('[data-world-settings="openfreemap-osm-3d"]')?.textContent||""\n  }));\n  if(!config.section||config.key||config.forget||config.use!=="USE MY GPS LOCATION"||config.training!=="TRAINING RANGE"||config.grid!==true||config.keepLook!==false||!config.note.includes("No account, API key, billing setup, backend or proxy"))throw new Error(`REAL WORLD settings incomplete: ${JSON.stringify(config)}`);'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='''      geoBackground:getComputedStyle(document.querySelector("#geoViewport")).backgroundImage\n    };'''
          new='''      geoBackground:getComputedStyle(document.querySelector("#geoViewport")).backgroundImage,\n      grid:viewport?.dataset.worldGrid||"",keepLook:viewport?.dataset.worldLookKeep||"",lookHud:getComputedStyle(document.querySelector("#worldLookHud")).display\n    };'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='''  if(!(live.mapUpdates>0&&live.mapUpdates<live.frames)||live.mapFpsCap!==30||live.mapPixelRatio!==1||live.flightPixelRatio>1.25||!live.geoBackground.includes("gradient"))throw new Error(`WORLD render budget/contrast failed: ${JSON.stringify(live)}`);'''
          new='''  if(!(live.mapUpdates>0&&live.mapUpdates<live.frames)||live.mapFpsCap!==30||live.mapPixelRatio!==1||live.flightPixelRatio>1.25||!live.geoBackground.includes("gradient")||live.grid!=="1"||live.keepLook!=="0"||live.lookHud==="none")throw new Error(`WORLD render budget/contrast failed: ${JSON.stringify(live)}`);'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          anchor='''  const follow=await cameraSnapshot();'''
          orbit='''  const lookBox=await page.$eval("#worldLookHud",element=>{const r=element.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height};});\n  await page.mouse.move(lookBox.x+lookBox.w/2,lookBox.y+lookBox.h/2);await page.mouse.down();await page.mouse.move(lookBox.x+lookBox.w*.82,lookBox.y+lookBox.h*.30,{steps:5});await page.mouse.up();\n  await page.waitForFunction(()=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0))>8,{timeout:3000});\n  await page.waitForFunction(()=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0))<1&&Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookPitch||0))<1,{timeout:3000});\n  await page.click("#soloTopbar .phone-settings-button");await page.waitForFunction(()=>document.querySelector(".phone-settings-dialog")?.open,{timeout:5000});await page.click("[data-world-keep-look]");await page.click(".phone-settings-dialog [data-close]");\n  await page.mouse.move(lookBox.x+lookBox.w/2,lookBox.y+lookBox.h/2);await page.mouse.down();await page.mouse.move(lookBox.x+lookBox.w*.80,lookBox.y+lookBox.h*.58,{steps:5});await page.mouse.up();await page.waitForFunction(()=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0))>8,{timeout:3000});\n  await new Promise(resolve=>setTimeout(resolve,450));const keptLook=await page.$eval("#viewport",element=>({yaw:Number(element.dataset.worldLookYaw||0),keep:element.dataset.worldLookKeep||""}));if(Math.abs(keptLook.yaw)<8||keptLook.keep!=="1")throw new Error(`WORLD KEEP look did not persist after release: ${JSON.stringify(keptLook)}`);\n\n  const follow=await cameraSnapshot();'''
          assert s.count(anchor)==1;s=s.replace(anchor,orbit,1)
          s=s.replace('console.log("REAL WORLD explicit shared-frame smoke passed: 50m hardware-fit range, blue contrast sky, WORLD acquisition halo, 30Hz map budget over full-rate flight frames, live FOLLOW/THIRD/FPV sync, clean training fallback.");','console.log("REAL WORLD explicit shared-frame smoke passed: 50m range, 12m/s shared FC envelope, grid toggle, SNAP/KEEP 360 look HUD, blue contrast, stripped symbol clutter, 30Hz map budget, live camera sync, clean fallback.");',1)
          p.write_text(s)

