name: vs-live-network
on:
  push:
    branches: ["verify/vs-live-network"]
    paths: [".github/workflows/vs-live-network.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build tiny production VS browser harness
        run: |
          set -euxo pipefail
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund esbuild@0.25.8 puppeteer-core@24.16.0 trystero@0.25.1
          cat > .vs-live-entry.mjs <<'EOF'
          import {LanVsSession,sameNetworkRoomKey} from './sim/lan_vs.mjs';
          const run=new URL(location.href).searchParams.get('run')||'manual';
          globalThis.vsLive={peer:null,pose:null,left:false,error:null,room:null};
          try{
            const networkKey=await sameNetworkRoomKey();
            const room=`${networkKey}-ci-${run}`;
            globalThis.vsLive.room=room;
            const session=new LanVsSession({
              onPeer:peerId=>globalThis.vsLive.peer=peerId,
              onPose:(pose,peerId)=>globalThis.vsLive.pose={pose,peerId},
              onLeave:peerId=>{globalThis.vsLive.left=true;globalThis.vsLive.leftPeer=peerId;},
              onError:error=>globalThis.vsLive.error=String(error?.message||error)
            });
            globalThis.vsLive.session=session;
            globalThis.vsLive.send=pose=>session.setPose(pose);
            await session.start(room);
          }catch(error){globalThis.vsLive.error=String(error?.message||error);}
          EOF
          ./node_modules/.bin/esbuild .vs-live-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=vs-live.js
          printf '%s\n' '<!doctype html><meta charset="utf-8"><script type="module" src="/vs-live.js"></script>' > vs-live.html
      - name: Run two independent real browsers through Nostr to WebRTC
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euxo pipefail
          cat > .vs-live-test.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const chrome=process.env.CHROME_BIN||'/usr/bin/google-chrome';
          const run=encodeURIComponent(process.env.RUN_KEY||Date.now());
          const url=`http://127.0.0.1:4175/vs-live.html?run=${run}`;
          const launch=()=>puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-setuid-sandbox']});
          const a=await launch(),b=await launch();
          const pa=await a.newPage(),pb=await b.newPage();
          const logs=[];
          for(const [name,page] of [['A',pa],['B',pb]]){
            page.on('console',msg=>logs.push(`${name} ${msg.type()}: ${msg.text()}`));
            page.on('pageerror',err=>logs.push(`${name} pageerror: ${err.message}`));
          }
          const wait=async(page,predicate,label,timeout=45000)=>{
            try{await page.waitForFunction(predicate,{timeout});}
            catch(error){const state=await page.evaluate(()=>globalThis.vsLive);throw new Error(`${label} timeout: ${JSON.stringify(state)}\n${logs.join('\n')}`);}
          };
          try{
            await Promise.all([pa.goto(url,{waitUntil:'domcontentloaded'}),pb.goto(url,{waitUntil:'domcontentloaded'})]);
            await Promise.all([
              wait(pa,()=>Boolean(globalThis.vsLive?.peer),'peer A'),
              wait(pb,()=>Boolean(globalThis.vsLive?.peer),'peer B')
            ]);
            const rooms=await Promise.all([pa.evaluate(()=>vsLive.room),pb.evaluate(()=>vsLive.room)]);
            if(rooms[0]!==rooms[1])throw new Error(`room mismatch ${rooms.join(' != ')}`);
            await pa.evaluate(()=>vsLive.send({p:[1,2,3],q:[0,0,0,1],g:[9.17,47.66]}));
            await pb.evaluate(()=>vsLive.send({p:[4,5,6],q:[0,0,.1,.995],g:[9.171,47.661]}));
            await Promise.all([
              wait(pa,()=>globalThis.vsLive?.pose?.pose?.p?.[0]===4,'pose B→A',15000),
              wait(pb,()=>globalThis.vsLive?.pose?.pose?.p?.[0]===1,'pose A→B',15000)
            ]);
            const poses=await Promise.all([pa.evaluate(()=>vsLive.pose.pose),pb.evaluate(()=>vsLive.pose.pose)]);
            if(!(poses[0].seq>0&&poses[1].seq>0))throw new Error(`missing sequence ${JSON.stringify(poses)}`);
            await pb.evaluate(()=>vsLive.session.stop());
            await wait(pa,()=>globalThis.vsLive?.left===true,'peer leave',15000);
            console.log('LIVE VS two-browser Nostr→WebRTC→pose→leave PASS',JSON.stringify({room:rooms[0],aRx:poses[0],bRx:poses[1],diagnostics:logs.filter(x=>/error|warn/i.test(x)).slice(-8)}));
          }finally{await Promise.allSettled([a.close(),b.close()]);}
          EOF
          python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/vs-live-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node .vs-live-test.mjs
