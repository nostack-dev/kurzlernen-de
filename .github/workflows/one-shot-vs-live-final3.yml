name: one-shot-vs-live-final3
on:
  push:
    branches: ["fix/vs-signaling-fallback"]
    paths: [".github/workflows/one-shot-vs-live-final3.yml"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish clean topbar UI and deterministic gates
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/real_world_bootstrap.mjs');s=p.read_text()
          old='''  stopVs(){this.vsStarting=false;const mateWorld=this.vsWorldFromMate;this.vsSession?.stop();this.vsSession=null;this.vsConnected=false;this.vsSharedOrigin=null;this.vsSharedWorldAttempted=false;this.vsWorldFromMate=false;this.clearVsPeerPresentation();if(mateWorld){if(this.active)this.deactivate();this.originLon=null;this.originLat=null;}const b=$("lanVsButton"),s=$("lanVsStatus");if(b)b.textContent="FIND MATE · VS";if(s)s.style.display="none";}'''
          new='''  stopVs(){this.vsStarting=false;const mateWorld=this.vsWorldFromMate;this.vsSession?.stop();this.vsSession=null;this.vsConnected=false;this.vsSharedOrigin=null;this.vsSharedWorldAttempted=false;this.vsWorldFromMate=false;this.clearVsPeerPresentation();if(mateWorld){if(this.active)this.deactivate();this.originLon=null;this.originLat=null;}const b=$("lanVsButton");if(b)b.textContent="FIND MATE";}'''
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1);p.write_text(s)
          p=Path('tests/solo_layout_smoke.mjs');s=p.read_text()
          old='''        topbar:rect("#soloTopbar"),left:rect("#soloLeft"),right:rect("#soloRight"),clearance:rect("#soloClearance"),arm:rect("#soloArm"),kill:rect("#soloKill"),'''
          new='''        topbar:rect("#soloTopbar"),vs:rect("#lanVsButton"),vsParent:document.querySelector("#lanVsButton")?.parentElement?.id||"",left:rect("#soloLeft"),right:rect("#soloRight"),clearance:rect("#soloClearance"),arm:rect("#soloArm"),kill:rect("#soloKill"),'''
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1)
          old='''    for(const key of ["topbar","left","right","clearance","arm","kill"])if(!g[key])throw new Error(`${viewport.name}: missing ${key}`);'''
          new='''    for(const key of ["topbar","vs","left","right","clearance","arm","kill"])if(!g[key])throw new Error(`${viewport.name}: missing ${key}`);\n    if(g.vsParent!=="soloTopbar")throw new Error(`${viewport.name}: FIND MATE is not in the topbar: ${JSON.stringify({parent:g.vsParent,vs:g.vs,topbar:g.topbar})}`);\n    if(g.topbar.left<-1||g.topbar.right>g.width+1||g.vs.left<g.topbar.left-1||g.vs.right>g.topbar.right+1)throw new Error(`${viewport.name}: FIND MATE/topbar escapes viewport: ${JSON.stringify({width:g.width,topbar:g.topbar,vs:g.vs})}`);'''
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/real_world_bootstrap.mjs
          node --check sim/lan_vs.mjs
          node --check sim/solo_layout.mjs
          node --check tests/solo_layout_smoke.mjs
          node tests/lan_vs_smoke.mjs
          ! grep -R -n -E 'PAIR CODE|manualRoomKey|startVsWithCode|FIND MATE · VS' sim tests/lan_vs_smoke.mjs tests/solo_layout_smoke.mjs
      - name: Install real P2P dependencies
        run: |
          set -euxo pipefail
          mkdir -p /tmp/vs-live && cd /tmp/vs-live
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund esbuild@0.25.8 puppeteer-core@24.16.0 trystero@0.25.1 @trystero-p2p/mqtt@0.25.1
          ln -s /tmp/vs-live/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Real two-browser MQTT WebRTC gate
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          cat >/tmp/vs-live/entry.mjs <<'JS'
          import {LanVsSession,sameNetworkRoomKey} from '/workspace/sim/lan_vs.mjs';
          import * as mqtt from '@trystero-p2p/mqtt';
          globalThis.VS={
            networkKey:()=>sameNetworkRoomKey(),
            async start(suffix){
              const state={peer:false,pose:null,left:false};const base=await sameNetworkRoomKey();
              const session=new LanVsSession({loadTransport:async()=>mqtt,loadFallbackTransport:null,onPeer:()=>state.peer=true,onPose:p=>state.pose=p,onLeave:()=>state.left=true});
              await session.start(`${base}-${suffix}`);globalThis.__session=session;globalThis.__state=state;return base;
            },
            pose:p=>globalThis.__session.setPose({p,q:[0,0,0,1]}),state:()=>globalThis.__state,stop:()=>globalThis.__session?.stop()
          };
          JS
          sed -i "s#/workspace#$GITHUB_WORKSPACE#" /tmp/vs-live/entry.mjs
          "$GITHUB_WORKSPACE/node_modules/.bin/esbuild" /tmp/vs-live/entry.mjs --bundle --format=iife --platform=browser --target=es2022 --outfile=/tmp/vs-live/app.js
          printf '<!doctype html><meta charset="utf-8"><script src="app.js"></script>\n' >/tmp/vs-live/index.html
          cat >/tmp/vs-live/test.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const exe=process.env.CHROME_BIN,base='http://127.0.0.1:4188',suffix=`live-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const launch=()=>puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-dev-shm-usage']});
          const a=await launch(),b=await launch();
          const wait=async(page,predicate,ms=20000)=>{const end=Date.now()+ms;while(Date.now()<end){const state=await page.evaluate(()=>globalThis.VS.state());if(predicate(state))return state;await new Promise(r=>setTimeout(r,100));}throw Error('timeout waiting for P2P state');};
          try{
            const pa=await a.newPage(),pb=await b.newPage();await Promise.all([pa.goto(base),pb.goto(base)]);
            const [ka,kb]=await Promise.all([pa.evaluate(()=>globalThis.VS.networkKey()),pb.evaluate(()=>globalThis.VS.networkKey())]);if(ka!==kb)throw Error(`same NAT rooms differ: ${ka} ${kb}`);
            await Promise.all([pa.evaluate(s=>globalThis.VS.start(s),suffix),pb.evaluate(s=>globalThis.VS.start(s),suffix)]);
            await Promise.all([wait(pa,s=>s.peer),wait(pb,s=>s.peer)]);
            await Promise.all([pa.evaluate(()=>globalThis.VS.pose([1,2,3])),pb.evaluate(()=>globalThis.VS.pose([4,5,6]))]);
            const [ar,br]=await Promise.all([wait(pa,s=>s.pose?.p?.[0]===4),wait(pb,s=>s.pose?.p?.[0]===1)]);
            await pb.evaluate(()=>globalThis.VS.stop());await wait(pa,s=>s.left,5000);
            console.log('LIVE VS same-network -> MQTT -> WebRTC -> bidirectional pose -> leave PASS',JSON.stringify({room:ka,a:ar.pose,b:br.pose}));
          }finally{await a.close();await b.close();}
          JS
          cd /tmp/vs-live
          python3 -m http.server 4188 --bind 127.0.0.1 >/tmp/vs-http.log 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true; rm -f "$GITHUB_WORKSPACE/node_modules"' EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" node test.mjs
      - name: Commit final UI assertions
        run: |
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sim/real_world_bootstrap.mjs tests/solo_layout_smoke.mjs
          git commit -m 'Finish automatic VS topbar UX and clear flight HUD'
          git push
