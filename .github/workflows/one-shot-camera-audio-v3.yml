name: One-shot final camera audio migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-camera-audio-v3.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/camera_audio_patch.py
      - name: Remove temporary workflow before architecture gates
        run: rm .github/workflows/one-shot-camera-audio-v3.yml
      - name: Validate
        run: |
          node --check sim/simulator.mjs
          node --check sim/camera_settings.mjs
          node --check sim/control_settings.mjs
          node --check tests/browser_sim_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit
        run: |
          rm tools/camera_audio_patch.py
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Add live camera optics settings and finalize audio E2E"
          git push
