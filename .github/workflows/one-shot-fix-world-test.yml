name: Fix WORLD regression test scope
on:
  push:
    branches: ["fix/final-flight-safety-ux"]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix WORLD minimap test scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          old='''    keepLook:document.querySelector('.phone-settings-dialog [data-world-keep-look]')?.checked,
              note:document.querySelector('[data-world-settings] .phone-settings-note')?.textContent||"",
          '''
          new='''    keepLook:document.querySelector('.phone-settings-dialog [data-world-keep-look]')?.checked,
              minimapFollowPresent:!!document.querySelector('.phone-settings-dialog [data-world-minimap-follow]'),
              note:document.querySelector('[data-world-settings] .phone-settings-note')?.textContent||"",
          '''
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='''config.keepLook!==false||document.querySelector('.phone-settings-dialog [data-world-minimap-follow]')||!config.note.includes'''
          new='''config.keepLook!==false||config.minimapFollowPresent||!config.note.includes'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/real_world_ui_smoke.mjs
          git diff --check
          rm .github/workflows/one-shot-fix-world-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/real_world_ui_smoke.mjs .github/workflows/one-shot-fix-world-test.yml
          git commit -m 'Fix WORLD minimap test scope'
          git push origin HEAD:fix/final-flight-safety-ux
