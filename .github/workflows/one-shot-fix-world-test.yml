name: one-shot fix WORLD smoke marker

on:
  push:
    branches: ["fix/world-fpv-frame-lock"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-frame-lock
          fetch-depth: 0
      - run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text();old='setSky({\\"sky-color\\":\\"#0a2845\\"';new='setSky({\\"sky-color\\":\\"#071b2e\\"';assert s.count(old)==1,s.count(old);p.write_text(s.replace(old,new,1))
          Path('.github/workflows/one-shot-fix-world-test.yml').unlink()
          Path('.github/workflows/one-shot-world-release-validation.yml').unlink(missing_ok=True)
          PY
          node --check tests/real_world_ui_smoke.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Align WORLD smoke test with depth palette"
          git push origin HEAD:fix/world-fpv-frame-lock
