          node --check sim/player_car_mode.mjs
          node --check sim/world_rigid_body_physics.mjs
          node --check sim/real_world_bootstrap.mjs
          node --check sim/control_settings.mjs
          node --check tests/player_car_touch_browser_smoke.mjs
          node tests/world_defaults_contract_test.mjs
      - name: Run actual Box3D steering regression
        run: |
          set -euxo pipefail
          TMP=/tmp/car-steering-box3d
          rm -rf "$TMP"; mkdir -p "$TMP"; cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund box3d.js@0.1.1 >/dev/null
          ln -s "$TMP/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          node tests/world_rigid_body_physics_box3d_test.mjs ./node_modules/box3d.js/dist/box3d.inline.mjs
          rm -f node_modules
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/player_car_mode.mjs sim/world_rigid_body_physics.mjs sim/real_world_bootstrap.mjs sim/control_settings.mjs tests/world_rigid_body_physics_box3d_test.mjs tests/player_car_touch_browser_smoke.mjs tests/world_defaults_contract_test.mjs
          git commit -m 'Make car steering physically authoritative and keep satellite off'
          git push origin HEAD:main
