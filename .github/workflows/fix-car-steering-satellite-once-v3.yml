name: Fix car steering and imagery once v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-car-steering-satellite-once-v3.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime and regression tests
        run: |
          set -euxo pipefail
          python3 - <<'PY'
