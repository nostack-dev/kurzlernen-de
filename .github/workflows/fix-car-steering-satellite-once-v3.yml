mber(beforePose?.yaw),yawDelta=Math.atan2(Math.sin(during.bodyYaw-yaw0),Math.cos(during.bodyYaw-yaw0));'''; assert a in s; s=s.replace(a,b,1); a='if(!during.active||during.throttle<.45||during.steer<.2||during.speedKmh<=0||!during.gasHeld)throw new Error(`real multitouch driving did not reach vehicle controller: ${JSON.stringify({positioned,boxes,during})}`);'; b='if(!during.active||during.throttle<.45||during.steer<.2||during.speedKmh<=0||!during.gasHeld||!Number.isFinite(yaw0)||!Number.isFinite(during.bodyYaw)||Math.abs(yawDelta)<.035||during.headingSource!=="box3d-body-yaw-v1"||during.steeringPhysics!=="box3d-bicycle-yaw-rate-v1")throw new Error(`real multitouch driving did not physically steer the Box3D car: ${JSON.stringify({positioned,boxes,beforePose,during,yawDelta})}`);'; assert a in s; s=s.replace(a,b,1); a='console.log(`Mobile car touch smoke passed: ${during.speedKmh.toFixed(1)} km/h, steer=${during.steer.toFixed(2)}, parkedSource=${positioned.parked}.`);'; b='console.log(`Mobile car touch smoke passed: ${during.speedKmh.toFixed(1)} km/h, steer=${during.steer.toFixed(2)}, physicalYawDelta=${yawDelta.toFixed(3)} rad, parkedSource=${positioned.parked}.`);'; assert a in s; p.write_text(s.replace(a,b,1))

          Path('tests/world_defaults_contract_test.mjs').write_text('''import assert from "node:assert/strict";\nimport {readFileSync} from "node:fs";\nconst world=readFileSync("sim/real_world_bootstrap.mjs","utf8"),settings=readFileSync("sim/control_settings.mjs","utf8"),car=readFileSync("sim/player_car_mode.mjs","utf8"),physics=readFileSync("sim/world_rigid_body_physics.mjs","utf8");\nassert.ok(world.includes("this.imageryEnabled=false;try{localStorage.removeItem(WORLD_IMAGERY_STORAGE);}catch{}"));\nassert.ok(!world.includes("this.imageryEnabled=loadBool(WORLD_IMAGERY_STORAGE"));\nassert.ok(world.includes("this.imageryEnabled=Boolean(value);try{localStorage.removeItem(WORLD_IMAGERY_STORAGE);}catch{}"));\nassert.ok(settings.includes("bridge.setImageryEnabled?.(false);bridge.setGridEnabled?.(true)"));\nassert.ok(car.includes("box3d-body-yaw-v1"));\nassert.ok(car.includes("signedSpeedMps:commandSpeed,steer:input.steer"));\nassert.ok(physics.includes("desiredYawRate=driveSpeed/wheelbase*Math.tan(steerAngle)"));\nconsole.log("World defaults contract passed: satellite starts OFF and player steering is rigid-body authoritative.");\n''')
