          a='if(record.target){const offset=record.target.position.map((value,index)=>value-position[index]),horizontal=Math.hypot(offset[0],offset[1]),distance=record.drone?length3(offset):horizontal;if(distance>.03){const targetYaw=record.target.yaw??Math.atan2(offset[1],offset[0]),vertical=record.drone?offset[2]/Math.max(.01,distance):0,horizontalScale=record.drone?Math.sqrt(Math.max(0,1-vertical*vertical)):1,desired=[Math.cos(targetYaw)*record.target.speedMps*horizontalScale,Math.sin(targetYaw)*record.target.speedMps*horizontalScale,vertical*record.target.speedMps],gain=record.target.response,maxForce=record.massKg*record.target.maxAccelerationMps2,force=limitedVector([(desired[0]-velocity[0])*record.massKg*gain,(desired[1]-velocity[1])*record.massKg*gain,record.drone?(desired[2]-velocity[2])*record.massKg*gain:0],maxForce);b3.b3Body_ApplyForceToCenter(body,force,true);const rotation=b3.b3Body_GetRotation([0,0,0,1],body),currentYaw=quaternionYaw(rotation),yawError=wrap(targetYaw-currentYaw),torqueZ=clamp((yawError*7-angular[2]*2.8)*record.massKg,-record.massKg*12,record.massKg*12);if(record.drone){'
          b='if(record.target){const offset=record.target.position.map((value,index)=>value-position[index]),horizontal=Math.hypot(offset[0],offset[1]),distance=record.drone?length3(offset):horizontal;if(distance>.03){const rotation=b3.b3Body_GetRotation([0,0,0,1],body),currentYaw=quaternionYaw(rotation),vehicleSteer=!record.drone&&Number.isFinite(record.target.steer)?record.target.steer:null,driveSpeed=vehicleSteer!==null&&Number.isFinite(record.target.signedSpeedMps)?record.target.signedSpeedMps:record.target.speedMps,targetYaw=vehicleSteer!==null?currentYaw:(record.target.yaw??Math.atan2(offset[1],offset[0])),vertical=record.drone?offset[2]/Math.max(.01,distance):0,horizontalScale=record.drone?Math.sqrt(Math.max(0,1-vertical*vertical)):1,desired=[Math.cos(targetYaw)*driveSpeed*horizontalScale,Math.sin(targetYaw)*driveSpeed*horizontalScale,vertical*record.target.speedMps],gain=record.target.response,maxForce=record.massKg*record.target.maxAccelerationMps2,force=limitedVector([(desired[0]-velocity[0])*record.massKg*gain,(desired[1]-velocity[1])*record.massKg*gain,record.drone?(desired[2]-velocity[2])*record.massKg*gain:0],maxForce);b3.b3Body_ApplyForceToCenter(body,force,true);const yawError=wrap(targetYaw-currentYaw);let torqueZ=clamp((yawError*7-angular[2]*2.8)*record.massKg,-record.massKg*12,record.massKg*12);if(vehicleSteer!==null){const wheelbase=Math.max(1.2,record.halfExtents[0]*1.55),steerAngle=vehicleSteer*(record.target.maxSteerAngleRad??.5585053606381855),desiredYawRate=driveSpeed/wheelbase*Math.tan(steerAngle),yawRateError=desiredYawRate-angular[2];torqueZ=clamp((yawRateError*6.4-angular[2]*.35)*record.massKg,-record.massKg*14,record.massKg*14);}if(record.drone){'; assert a in s; s=s.replace(a,b,1); p.write_text(s)

