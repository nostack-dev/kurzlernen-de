name: Apply immediate shared beacon presentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply immediate shared beacon presentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch beacon presentation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/vs_combat_presentation.mjs')
          s=p.read_text()
          old='group.position.set(...p);group.visible=Boolean(currentBridge?.vsConnected);}return true;}'
          new='group.position.set(...p);group.visible=Boolean(currentBridge?.vsConnected);}updateBeaconPresentation(currentBridge,performance.now());return true;}'
          assert old in s
          assert new not in s
          p.write_text(s.replace(old,new,1))
          PY
          node --check sim/vs_combat_presentation.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/vs_combat_presentation.mjs
          git commit -m 'Present shared beacon immediately'
          git push origin HEAD:main
