name: Trace GAME AGL convergence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-agl-trace.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add AGL convergence diagnostics
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/dual_phone_smoke.mjs')
          s=p.read_text()
          old='''  await view.waitForFunction(()=>{const z=parseFloat(document.querySelector("#altitude")?.textContent||"0"),v=parseFloat(document.querySelector("#velocity")?.textContent||"99");return z>1.55&&z<2.45&&v<.55;},{timeout:90000});\n'''
          new='''  try{\n    await view.waitForFunction(()=>{const z=parseFloat(document.querySelector("#altitude")?.textContent||"0"),v=parseFloat(document.querySelector("#velocity")?.textContent||"99");return z>1.55&&z<2.45&&v<.55;},{timeout:90000});\n  }catch{\n    const aglSamples=await flightSamples(view),aglTrace=traceAtOffsets(aglSamples,armEnd,[0,.5,1,1.5,2,2.5,3,3.5,4,5,6,8,10]);\n    throw new Error(`2m AGL convergence timeout: snapshot=${JSON.stringify(await snapshot(view))} trace=${JSON.stringify(aglTrace)}`);\n  }\n'''
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/dual_phone_smoke.mjs
          git diff --check
      - name: Commit diagnostic and remove helper
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add tests/dual_phone_smoke.mjs
          git rm .github/workflows/oneoff-agl-trace.yml
          git commit -m "Report GAME AGL convergence trace"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
