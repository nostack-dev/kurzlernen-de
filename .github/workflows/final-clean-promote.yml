name: Final clean GAME promote

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-clean-promote.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply coherent production fixes
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          state=Path('esp32/Arondight45_StateControl.hpp')
          s=state.read_text()
          old='constexpr float kStateMaxYawRateDps = 100.0f;'
          new='constexpr float kStateMaxYawRateDps = 180.0f;'
          if new not in s:
              assert s.count(old)==1,s.count(old)
              s=s.replace(old,new,1)
          state.write_text(s)

          controller=Path('sim/controller.mjs')
          s=controller.read_text()
          old='yawRate:stateShape(quantizedCentered(controls.yaw),.045,.20)*100'
          new='yawRate:stateShape(quantizedCentered(controls.yaw),.045,.20)*180'
          if new not in s:
              assert s.count(old)==1,s.count(old)
              s=s.replace(old,new,1)
          controller.write_text(s)

          sim=Path('sim/simulator.mjs')
          s=sim.read_text()
          old='function exportSession(){downloadJson(`arondight45-${mode}-${new Date().toISOString().replace(/[:.]/g,"-")}.json`,{schema:"arondight45-flight-log-v1",mode,samples:sessionLog,physics:defaultParams()});}'
          new='''function exportSession(){
            if((latest.state&STATE_ARMED)&&inputSource==="remote"){
              setStatus("Disarm before exporting a full flight log during P2P control.","warn");
              return;
            }
            downloadJson(`arondight45-${mode}-${new Date().toISOString().replace(/[:.]/g,"-")}.json`,{schema:"arondight45-flight-log-v1",mode,samples:sessionLog,physics:defaultParams()});
          }'''
          if new not in s:
              assert s.count(old)==1,s.count(old)
              s=s.replace(old,new,1)
          sim.write_text(s)

          test=Path('tests/dual_phone_smoke.mjs').read_text()
          assert 'await controller.mouse.move(rcx+rr*.65,rcy,{steps:4});' in test
          assert 'const turnStart=await simTime(view);await waitSim(view,turnStart+.22,25000);await controller.mouse.up();' in test
          assert 'if(Math.abs(yawDelta)<4)' in test
          armed=test[test.index('const left=await stickBox(controller,"#leftStick")'):test.index('const stall=controller.evaluate')]
          assert 'flightSamples(view)' not in armed
          assert 'latestFlightSample(view)' not in armed
          PY

      - name: Stage exact clean production tree
        run: |
          set -euxo pipefail
          git rm -f --ignore-unmatch .github/workflows/nonblocking-final.yml
          git rm -f --ignore-unmatch .github/workflows/strict-final-flight-validation.yml
          git rm -f --ignore-unmatch .github/workflows/yaw-path-diagnostic.yml
          git rm -f --ignore-unmatch .github/workflows/armed-telemetry-final.yml
          git rm -f --ignore-unmatch .github/workflows/yaw-p-strict-validation.yml
          git rm -f --ignore-unmatch .github/workflows/final-clean-promote.yml
          git rm -f --ignore-unmatch tools/apply_nonblocking_e2e_patch.py
          git diff --check

      - name: Validate shared runtime and architecture
        run: |
          set -euxo pipefail
          git diff --check
          node --check sim/controller.mjs
          node --check sim/simulator.mjs
          node --check tests/dual_phone_smoke.mjs
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core
          /tmp/fc-core
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state-control
          /tmp/state-control
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil
          ASAN_OPTIONS=detect_leaks=1 /tmp/hil
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil
          /tmp/sil
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs

      - name: Build exact self-contained browser pair
        run: |
          set -euxo pipefail
          mkdir -p generated
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 \
            em++ sim/Arondight45_DroneFC_SIL_WASM.cpp -std=c++17 -O3 \
              -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT='web' \
              -s INVOKE_RUN=0 -s EXIT_RUNTIME=0 -s FILESYSTEM=0 -s SINGLE_FILE=1 \
              -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=16777216 \
              -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -s EXPORTED_FUNCTIONS='["_fc_input_buffer","_fc_output_buffer","_fc_input_size","_fc_output_size","_fc_reset","_fc_process","_fc_protocol_version"]' \
              -o generated/flight_core.mjs
          BUILD_DIR=/tmp/arondight45-final-clean
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 box3d.js@0.1.1 esbuild@0.25.8 puppeteer-core@24.16.0 qrcode-generator@1.4.4 jsqr@1.4.0
          ln -s "$BUILD_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/simulator.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs
          ./node_modules/.bin/esbuild sim/controller.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-controller.bundle.mjs
          python3 - <<'PY'
          from pathlib import Path
          for html_name,marker,bundle_name in [
              ('drone_simulator.html','<script type="module" src="./sim/simulator.mjs"></script>','/tmp/arondight45-simulator.bundle.mjs'),
              ('drone_controller.html','<script type="module" src="./sim/controller.mjs"></script>','/tmp/arondight45-controller.bundle.mjs'),
          ]:
              p=Path(html_name); h=p.read_text(); assert marker in h
              b=Path(bundle_name).read_text().replace('</script','<\\/script')
              p.write_text(h.replace(marker,'<script type="module">\n'+b+'\n</script>'))
          PY
          test -s drone_simulator.html
          test -s drone_controller.html
          test "$(wc -c < drone_simulator.html)" -gt 100000
          test "$(wc -c < drone_controller.html)" -gt 10000
          ! grep -q 'src="./sim/simulator.mjs"' drone_simulator.html
          ! grep -q 'src="./sim/controller.mjs"' drone_controller.html
          ! grep -q 'cdn.jsdelivr.net' drone_simulator.html
          rm -rf generated

      - name: Run strict full browser flight
        run: |
          set -euxo pipefail
          grep -F 'rcx+rr*.65' tests/dual_phone_smoke.mjs
          grep -F 'turnStart+.22' tests/dual_phone_smoke.mjs
          grep -F 'Math.abs(yawDelta)<4' tests/dual_phone_smoke.mjs
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/arondight45-static.log 2>&1 &
          HTTP_PID=$!
          cleanup(){ kill "$HTTP_PID" 2>/dev/null || true; rm -f node_modules; }
          trap cleanup EXIT
          sleep 1
          CHROME_BIN="$CHROME_BIN" node tests/dual_phone_smoke.mjs http://127.0.0.1:4174
          CHROME_BIN="$CHROME_BIN" node tests/browser_sim_smoke.mjs http://127.0.0.1:4174/drone_simulator.html

      - name: Promote exact green tree to main
        run: |
          set -euxo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize GAME flight control and clean validation tree"
          git push origin HEAD:main
