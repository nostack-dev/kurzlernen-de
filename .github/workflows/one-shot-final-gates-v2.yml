name: Final regression gate update v2

on:
  push:
    branches: ["fix/final-flight-safety-ux"]

permissions:
  contents: write

jobs:
  update-gates:
    if: github.event.head_commit.message != 'Update final digital twin regression gates v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-flight-safety-ux
          fetch-depth: 0
      - name: Patch tests robustly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def need(s,old,label):
              n=s.count(old);assert n==1,f'{label}: expected 1 got {n}';return s.replace(old,'',1)
          def repl(s,old,new,label):
              n=s.count(old);assert n==1,f'{label}: expected 1 got {n}';return s.replace(old,new,1)

          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          s=repl(s,"if(!bootstrapSource.includes('fpvTargetDistanceMeters(this.originLat,height,verticalFov,WORLD_MAP_MAX_ZOOM)')||!bootstrapSource.includes('setVerticalFieldOfView(verticalFov)')||!bootstrapSource.includes('elevation:fpv?target.z:0'))throw new Error(\"WORLD FPV stable 3D camera model missing\");","if(!bootstrapSource.includes('fpvTargetDistanceMeters(this.originLat,height,verticalFov,WORLD_MAP_MAX_ZOOM)')||!bootstrapSource.includes('setVerticalFieldOfView(verticalFov)')||!bootstrapSource.includes('calculateCameraOptionsFromTo(eye,p.z,aim,target.z)'))throw new Error(\"WORLD FPV exact-eye 3D camera model missing\");",'camera source marker')
          s=need(s,"    minimapFollow:document.querySelector('.phone-settings-dialog [data-world-minimap-follow]')?.checked,\n",'minimap config field')
          s=repl(s,'config.keepLook!==false||config.minimapFollow!==true||!config.note.includes','config.keepLook!==false||document.querySelector(\'.phone-settings-dialog [data-world-minimap-follow]\')||!config.note.includes','minimap settings expectation')
          s=repl(s,'syncMode:viewport?.dataset.worldMapSyncMode||""','syncMode:viewport?.dataset.worldMapSyncMode||"",\n    eyeElevation:viewport?.dataset.worldMapEyeElevation||""','camera snapshot eye')
          s=repl(s,'minimapMode:viewport?.dataset.worldMinimapMode||"",minimapFollow:viewport?.dataset.worldMinimapFollow||"",legend:','minimapMode:viewport?.dataset.worldMinimapMode||"",minimapExpanded:viewport?.dataset.worldMinimapExpanded||"",legend:','live minimap fields')
          s=repl(s,'live.minimapMode!=="camera"||live.minimapFollow!=="1"','live.minimapMode!=="north"||live.minimapExpanded!=="0"','live north-up expectation')
          s=repl(s,'miniFixture.mode!=="camera"','miniFixture.mode!=="north"','fixture north-up')
          start=s.index('  await page.click("#soloTopbar .phone-settings-button");await page.waitForFunction(()=>document.querySelector(".phone-settings-dialog")?.open,{timeout:5000});await page.click(".phone-settings-dialog [data-world-minimap-follow]");')
          end=s.index('\n\n  const follow=await cameraSnapshot();',start)
          replacement='''  const northMini=await page.$eval("#viewport",e=>({mode:e.dataset.worldMinimapMode||"",bearing:Number(e.dataset.worldMinimapBearing||99)}));if(northMini.mode!=="north"||Math.abs(northMini.bearing)>.01)throw new Error(`north-up mini-map failed: ${JSON.stringify(northMini)}`);
          const initialFov=await page.evaluate(()=>JSON.parse(localStorage.getItem("arondight45CameraSettingsV1")||"{}").fpvFovDeg||105);
          const pinchResult=await page.$eval("#worldLookHud",(hud,initial)=>{hud.setPointerCapture=()=>{};const fire=(type,id,x,y)=>hud.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",button:0,clientX:x,clientY:y}));const r=hud.getBoundingClientRect(),cy=r.top+r.height/2;fire("pointerdown",41,r.left+35,cy);fire("pointerdown",42,r.right-35,cy);fire("pointermove",42,r.right-5,cy);fire("pointerup",42,r.right-5,cy);fire("pointerup",41,r.left+35,cy);return{before:initial,after:JSON.parse(localStorage.getItem("arondight45CameraSettingsV1")||"{}").fpvFovDeg};},initialFov);
          if(!Number.isFinite(pinchResult.after)||Math.abs(pinchResult.after-pinchResult.before)<2)throw new Error(`minimap pinch did not change shared FOV: ${JSON.stringify(pinchResult)}`);
          await page.click("#soloTopbar .phone-settings-button");await page.waitForFunction(()=>document.querySelector(".phone-settings-dialog")?.open,{timeout:5000});const syncedFov=await page.$eval('.phone-settings-dialog [data-camera-slider="fov"]',e=>Number(e.value));await page.click('.phone-settings-dialog [data-close]');if(Math.abs(syncedFov-pinchResult.after)>.01)throw new Error(`settings FOV did not synchronize with minimap pinch: ${JSON.stringify({syncedFov,pinchResult})}`);
          await page.$eval("#worldLookHud",hud=>hud.dispatchEvent(new MouseEvent("dblclick",{bubbles:true,cancelable:true})));await page.waitForFunction(()=>document.querySelector("#viewport")?.dataset.worldMinimapExpanded==="1",{timeout:2000});await page.$eval("#worldLookHud",hud=>hud.dispatchEvent(new MouseEvent("dblclick",{bubbles:true,cancelable:true})));await page.waitForFunction(()=>document.querySelector("#viewport")?.dataset.worldMinimapExpanded==="0",{timeout:2000});'''
          s=s[:start]+replacement+s[end:]
          s=repl(s,'if(fpv.syncMode!=="rigid-3d-target"||!Number.isFinite(Number(fpv.targetElevation)))throw new Error(`FPV WORLD camera did not use stable elevated 3D target: ${JSON.stringify(fpv)}`);','if(fpv.syncMode!=="exact-eye-to-target"||!Number.isFinite(Number(fpv.targetElevation))||!Number.isFinite(Number(fpv.eyeElevation)))throw new Error(`FPV WORLD camera did not use exact eye-to-target pose: ${JSON.stringify(fpv)}`);','FPV exact eye')
          s=repl(s,'if(fpvSyncEnd.mode!=="rigid-3d-target"||fpvMapDelta<fpvFrameDelta-1)','if(fpvSyncEnd.mode!=="exact-eye-to-target"||fpvMapDelta<fpvFrameDelta-1)','FPV frame lock')
          old='''  const fpvLookBefore=await page.$eval("#viewport",e=>Number(e.dataset.worldLookYaw||0));await page.mouse.move(250,145);await page.mouse.down();await page.mouse.move(350,120,{steps:5});await page.mouse.up();await new Promise(resolve=>setTimeout(resolve,180));const fpvLookAfter=await page.$eval("#viewport",e=>Number(e.dataset.worldLookYaw||0));if(Math.abs(fpvLookAfter-fpvLookBefore)>.1)throw new Error(`rigid FPV was virtually panned: ${JSON.stringify({fpvLookBefore,fpvLookAfter})}`);'''
          new='''  const fpvEyeProbe=await page.evaluate(()=>{const bridge=globalThis.__arondightRealWorld,cam=bridge.threeCamera,viewport=document.querySelector("#viewport"),saved=cam.position.clone();cam.position.z=5;bridge.syncMapCamera(cam);const five=Number(viewport.dataset.worldMapEyeElevation);cam.position.z=50;bridge.syncMapCamera(cam);const fifty=Number(viewport.dataset.worldMapEyeElevation);cam.position.copy(saved);return{five,fifty};});if(Math.abs(fpvEyeProbe.five-5)>.02||Math.abs(fpvEyeProbe.fifty-50)>.02)throw new Error(`FPV eye altitude was reconstructed instead of preserved: ${JSON.stringify(fpvEyeProbe)}`);
          const shotsBefore=await page.$eval("#viewport",e=>Number(e.dataset.presentationShots||0));await page.mouse.click(250,220);await page.waitForFunction(before=>Number(document.querySelector("#viewport")?.dataset.presentationShots||0)>before,{timeout:2000},shotsBefore);const lookBefore=await page.$eval("#viewport",e=>Number(e.dataset.worldLookYaw||0));await page.mouse.move(lookBox.x+lookBox.w/2,lookBox.y+lookBox.h/2);await page.mouse.down();await page.mouse.move(lookBox.x+lookBox.w*.80,lookBox.y+lookBox.h*.30,{steps:5});await page.mouse.up();await page.waitForFunction(before=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0)-before)>8,{timeout:3000},lookBefore);'''
          s=repl(s,old,new,'FPV look/fire')
          s=s.replace('rigid elevated FPV camera target','exact-eye FPV pose').replace('SNAP/KEEP 360 look HUD','NORTH-UP expandable SNAP/KEEP minimap with shared FOV')
          p.write_text(s)

          p=Path('tests/dual_phone_smoke.mjs');s=p.read_text()
          s=repl(s,'return Math.abs(pitch)<2.0&&speed<.55;','return Math.abs(pitch)<2.0&&speed<.12;','neutral speed')
          s=repl(s,'recovered.speed>=.55','recovered.speed>=.12','recovered speed')
          s=repl(s,'await controller.mouse.move(lcx,lcy);await controller.mouse.down();await controller.mouse.move(lcx,lcy-lr*.72,{steps:5});\n  const forwardStart=await simTime(view);await waitSim(view,forwardStart+1.0,45000);const moving=await liveMotion(view,controller);','const forwardBaseline=await liveMotion(view,controller);await controller.mouse.move(lcx,lcy);await controller.mouse.down();await controller.mouse.move(lcx,lcy-lr*.70,{steps:5});\n  const forwardStart=await simTime(view);await waitSim(view,forwardStart+1.0,45000);const moving=await liveMotion(view,controller);','forward equal command')
          s=repl(s,'await controller.mouse.move(lcx,lcy);await controller.mouse.down();await controller.mouse.move(lcx+lr*.65,lcy,{steps:5});\n  const strafeStart=await simTime(view);','await view.waitForFunction(()=>parseFloat(document.querySelector("#velocity")?.textContent||"99")<.12,{timeout:90000});const strafeBaseline=await liveMotion(view,controller);await controller.mouse.move(lcx,lcy);await controller.mouse.down();await controller.mouse.move(lcx+lr*.70,lcy,{steps:5});\n  const strafeStart=await simTime(view);','strafe equal command')
          s=repl(s,'if(strafing.right<.35)throw new Error(`strafe desired-vector sign/response wrong: final=${JSON.stringify(strafing)} trace=${JSON.stringify(strafeCommandTrace)}`);\n  await controller.mouse.up();','if(strafing.right<.35)throw new Error(`strafe desired-vector sign/response wrong: final=${JSON.stringify(strafing)} trace=${JSON.stringify(strafeCommandTrace)}`);const forwardGain=moving.forward-forwardBaseline.forward,strafeGain=strafing.right-strafeBaseline.right,axisRatio=Math.min(Math.abs(forwardGain),Math.abs(strafeGain))/Math.max(Math.abs(forwardGain),Math.abs(strafeGain));console.log(`Equal-axis response: forward Δ=${forwardGain.toFixed(3)} m/s · strafe Δ=${strafeGain.toFixed(3)} m/s · ratio=${axisRatio.toFixed(3)}`);if(axisRatio<.65)throw new Error(`equal physical stick commands are materially axis-asymmetric: ${JSON.stringify({forwardBaseline,moving,strafeBaseline,strafing,forwardGain,strafeGain,axisRatio})}`);\n  await controller.mouse.up();','axis comparison')
          p.write_text(s)

          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          s=repl(s,'requireText("sim/control_settings.mjs","MINIMAP FOLLOWS 360° CAMERA");','forbidText("sim/control_settings.mjs","MINIMAP FOLLOWS 360° CAMERA");','minimap toggle architecture')
          lines=s.splitlines();idx=next(i for i,line in enumerate(lines) if line.startswith('for(const marker of ["WORLD_MAP_FRAME_MS=1000/30"'))
          lines[idx]='for(const marker of ["WORLD_MAP_FRAME_MS=1000/30","WORLD_MAP_FRAME_MS_CONSTRAINED=1000/20","WORLD_MAP_FRAME_MS_CRITICAL=1000/15","WORLD_MAP_PIXEL_RATIO=1.0","WORLD_FLIGHT_PIXEL_RATIO=1.25","maxTileCacheZoomLevels:2","refreshExpiredTiles:false","validateStyle:false","crossSourceCollisions:false","trackResize:false","setSky({\\"sky-color\\":\\"#071b2e\\"","WORLD_MAP_MAX_PITCH=120","fpvTargetDistanceMeters(this.originLat,height,verticalFov,WORLD_MAP_MAX_ZOOM)","setVerticalFieldOfView(verticalFov)","calculateCameraOptionsFromTo(eye,p.z,aim,target.z)","worldMapEyeElevation","worldMapUpdates","worldFlightFps","setPerfMode(mode)","applyFlightPalette()","angularDistanceDeg","WORLD_GRID_STORAGE","WORLD_KEEP_LOOK_STORAGE","WORLD_MINIMAP_QUERY_MS=1000","queryRenderedFeatures(undefined,{layers:this.minimapLayerIds})","world-mini-canvas","worldMinimapMode=\\"north\\"","toggleMinimapExpanded()","applyLookCamera(scene,camera)","camera.position.copy(basePosition)","this.airframe=null;scene.traverse","if(child.isGridHelper){child.visible=this.gridEnabled;continue;}"])requireText("sim/real_world_bootstrap.mjs",marker);'
          s='\n'.join(lines)+'\n'
          s=repl(s,'forbidText("sim/real_world_bootstrap.mjs",\'if(mode==="fpv"){const qYaw\',"WORLD must never virtually pan rigid FPV optics");','requireText("sim/real_world_bootstrap.mjs","One orientation-only look transform for FOLLOW, THIRD and FPV");','unified look architecture')
          anchor='requireText("tools/s31_hil_bridge.mjs",\'pathname!=="/hil"\');'
          insert='''requireText("esp32/Arondight45_StateControl.hpp","kStateNavigationDegraded = 1u << 7");
          requireText("esp32/Arondight45_StateControl.hpp","Full NAV is required to enter flight");
          requireText("esp32/Arondight45_StateControl.hpp","NAV loss while airborne");
          requireText("esp32/Arondight45_HardwareSensors.hpp","kNavigationSplitValidity = 1u << 15");
          requireText("esp32/Arondight45_HardwareSensors.hpp","kNavigationVelocityValid = 1u << 1");
          requireText("esp32/Arondight45_HardwareSensors.hpp","kNavigationAglValid = 1u << 2");
          requireText("sim/simulator.mjs","PHYSICS_GROUND_HALF = 10000");
          requireText("sim/simulator.mjs","FlightLogbook");
          requireText("sim/simulator.mjs","installPresentationFire");
          requireText("sim/presentation_fire.mjs","-webkit-touch-callout:none");
          requireText("sim/presentation_fire.mjs","document.body.classList.contains(\\"solo-flight\\")");
          for(const dirty of ["PhysicsModel","StateController","motorOmega","physics.step","backend.exchange","applyForces("])forbidText("sim/presentation_fire.mjs",dirty,`presentation fire crossed flight authority boundary: ${dirty}`);
          requireText("sim/flight_logbook.mjs","Logging is observer-only");
          for(const dirty of ["PhysicsModel","StateController","motorOmega","physics.step","backend.exchange","applyForces("])forbidText("sim/flight_logbook.mjs",dirty,`flight logbook crossed flight authority boundary: ${dirty}`);
          forbidText("sim/controller.mjs","if(!peer.linked)safetyNeutral(false)","transient WebRTC state must not synthesize ARM-low");
          requireText("sim/p2p_link.mjs",\'["failed","closed"].includes(this.pc.connectionState)\');'''
          assert s.count(anchor)==1;s=s.replace(anchor,insert+'\n'+anchor,1)
          p.write_text(s)
          PY
          node --check tests/real_world_ui_smoke.mjs
          node --check tests/dual_phone_smoke.mjs
          node --check tests/architecture_invariants.mjs
          rm -f .github/workflows/one-shot-final-flight-safety-ux.yml .github/workflows/one-shot-final-gates-v2.yml
          node tests/architecture_invariants.mjs
          git diff --check
          git checkout -- .github/workflows/one-shot-final-flight-safety-ux.yml .github/workflows/one-shot-final-gates-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/real_world_ui_smoke.mjs tests/dual_phone_smoke.mjs tests/architecture_invariants.mjs
          git commit -m 'Update final digital twin regression gates v2'
          git push origin HEAD:fix/final-flight-safety-ux
