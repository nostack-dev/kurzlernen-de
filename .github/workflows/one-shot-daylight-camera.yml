name: One-shot daylight camera migration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-daylight-camera.yml"
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply daylight and camera patch
        run: |
          set -euxo pipefail
          python3 tools/patch_daylight_camera_modes.py
          node --check sim/simulator.mjs
          node --check tests/browser_sim_smoke.mjs
          grep -q 'scene.background=daylightSky()' sim/simulator.mjs
          grep -q 'cameraMode==="fpv"' sim/simulator.mjs
          grep -q 'FOLLOW camera is not default' tests/browser_sim_smoke.mjs
      - name: Commit migrated simulator and test
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/simulator.mjs tests/browser_sim_smoke.mjs
          git commit -m "Add daylight world and FOLLOW FPV camera modes"
          git push
