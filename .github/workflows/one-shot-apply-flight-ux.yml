name: Apply unified flight UX

on:
  workflow_dispatch:
  push:
    branches: ["fix/world-fpv-eye-altitude"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-eye-altitude
          fetch-depth: 0
      - name: Apply UX product patch
        run: |
          set -euxo pipefail
          python3 tools/apply_flight_ux_patch.py
          rm -f .github/workflows/one-shot-apply-flight-ux.yml tools/apply_flight_ux_patch.py
      - name: Static and architecture gates
        run: |
          set -euxo pipefail
          node --check sim/simulator.mjs
          node --check sim/controller.mjs
          node --check sim/real_world_bootstrap.mjs
          node --check sim/camera_settings.mjs
          node --check sim/flight_logbook.mjs
          node --check sim/flight_fire_fx.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/drone_hil_protocol_test
          /tmp/drone_hil_protocol_test
          git diff --check
      - name: Commit clean product tree
        run: |
          set -euxo pipefail
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Unify WORLD flight view and mobile telemetry UX'
          git push origin HEAD:fix/world-fpv-eye-altitude
