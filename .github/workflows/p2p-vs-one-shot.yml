name: p2p-vs-one-shot
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/p2p-vs-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 tools/patch_p2p_vs.py
      - run: node --check sim/lan_vs.mjs && node --check sim/real_world_bootstrap.mjs
      - run: |
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sim/real_world_bootstrap.mjs sim/lan_vs.mjs
          git commit -m 'Add simple nearby P2P VS mode' || true
          git push
