name: Diagnose GAME braking

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-diagnose-game-brake.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add diagnostic context
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/dual_phone_smoke.mjs')
          s=p.read_text()
          old='if(brakedSpeed>Math.max(.75,movingSpeed*.72))throw new Error(`zero-velocity target did not brake enough: moving=${movingSpeed}, after=${brakedSpeed}`);'
          new='if(brakedSpeed>Math.max(.75,movingSpeed*.72))throw new Error(`zero-velocity target did not brake enough: moving=${movingSpeed}, after=${brakedSpeed} · ${JSON.stringify(await snapshot(view))}`);'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/dual_phone_smoke.mjs
          git diff --check
      - name: Commit diagnostic
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add tests/dual_phone_smoke.mjs
          git commit -m "Expose GAME braking state in E2E"
          git push origin HEAD:main
