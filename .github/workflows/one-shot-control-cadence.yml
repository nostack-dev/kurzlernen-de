name: One-shot control cadence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decouple height semantics from display FPS
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def one(path,old,new):
            p=Path(path);s=p.read_text();n=s.count(old);assert n==1,f"{path}: expected one, got {n}: {old[:120]!r}";p.write_text(s.replace(old,new,1))

          # Remote controller: altitude target advances on the same 20 ms cadence
          # that actually publishes control packets, never on visual RAF cadence.
          one('sim/controller.mjs','let heightAxis=0,heightPointer=null,heightLastMs=performance.now();','let heightAxis=0,heightPointer=null;')
          one('sim/controller.mjs',
              'function stepHeightTarget(now){const dt=Math.max(0,(now-heightLastMs)/1000);heightLastMs=now;if(gameMode&&Math.abs(heightAxis)>1e-4)setGroundClearance(stepGroundClearanceTarget(groundClearance,heightAxis,dt),false);requestAnimationFrame(stepHeightTarget);}\nrequestAnimationFrame(stepHeightTarget);\n',
              'function publishControlTick(){if(gameMode&&Math.abs(heightAxis)>1e-4)setGroundClearance(stepGroundClearanceTarget(groundClearance,heightAxis,SEND_INTERVAL_MS/1000),false);publish();}\n')
          one('sim/controller.mjs','setInterval(()=>publish(),SEND_INTERVAL_MS);','setInterval(publishControlTick,SEND_INTERVAL_MS);')

          # One-phone: altitude target advances only when a real simulated SBUS
          # frame is sampled (100 Hz). The render loop merely draws the current value.
          one('sim/simulator.mjs','let soloHeightAxis=0,soloHeightPointer=null,soloHeightLastMs=performance.now();','let soloHeightAxis=0,soloHeightPointer=null;')
          old='''function stepSoloHeightTarget(now){\n  const dt=Math.max(0,(now-soloHeightLastMs)/1000);soloHeightLastMs=now;if(!soloMode||Math.abs(soloHeightAxis)<1e-4)return;\n  const next=stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,dt);if(next===soloGroundClearance)return;soloGroundClearance=next;soloControls.groundClearance=next;renderSoloHeightControl();\n}\n'''
          one('sim/simulator.mjs',old,'')
          one('sim/simulator.mjs','setSoloHeightAxis(0);soloHeightLastMs=performance.now();soloControls=neutralSoloControls();','setSoloHeightAxis(0);soloControls=neutralSoloControls();')
          one('sim/simulator.mjs','phoneSettings=loadPhoneControlSettings();soloGroundClearance=phoneSettings.defaultHoverAgl;setSoloHeightAxis(0);soloHeightLastMs=performance.now();\n  physics.reset','phoneSettings=loadPhoneControlSettings();soloGroundClearance=phoneSettings.defaultHoverAgl;setSoloHeightAxis(0);\n  physics.reset')
          one('sim/simulator.mjs','''function controls(){\n  const c=activeControlState(),channels=new Array(16).fill(992);''','''function controls(){\n  if(soloMode&&Math.abs(soloHeightAxis)>1e-4){const next=stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,.01);soloGroundClearance=next;soloControls.groundClearance=next;}\n  const c=activeControlState(),channels=new Array(16).fill(992);''')
          one('sim/simulator.mjs','requestAnimationFrame(render);const renderNow=performance.now();stepSoloHeightTarget(renderNow);physics.render();updateCamera();const fcState=latest.state;','requestAnimationFrame(render);const renderNow=performance.now();physics.render();updateCamera();const fcState=latest.state;')

          # Reduce one redundant high-zoom building pass: the custom 3D extrusion
          # is the sole building visual in WORLD, avoiding hidden 2D fill overdraw.
          one('sim/real_world_bootstrap.mjs',
              'const symbolIds=(this.map.getStyle()?.layers||[]).filter(layer=>layer.type==="symbol").map(layer=>layer.id);\n    let removed=0;\n    for(const id of symbolIds){try{this.map.removeLayer(id);removed++;}catch(error){console.warn("OpenFreeMap symbol-layer removal warning:",id,error);}}',
              'const clutterIds=(this.map.getStyle()?.layers||[]).filter(layer=>layer.type==="symbol"||(layer.type==="fill"&&String(layer["source-layer"]||"").toLowerCase()==="building")).map(layer=>layer.id);\n    let removed=0;\n    for(const id of clutterIds){try{this.map.removeLayer(id);removed++;}catch(error){console.warn("OpenFreeMap flight-clutter layer removal warning:",id,error);}}')

          # Architecture explicitly locks input semantics to control transport clocks.
          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          anchor='requireText("sim/controller.mjs","stepGroundClearanceTarget(groundClearance,heightAxis,dt)");\nrequireText("sim/simulator.mjs","stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,dt)");'
          if anchor in s:
            s=s.replace(anchor,'requireText("sim/controller.mjs","stepGroundClearanceTarget(groundClearance,heightAxis,SEND_INTERVAL_MS/1000)");\nrequireText("sim/controller.mjs","setInterval(publishControlTick,SEND_INTERVAL_MS)");\nrequireText("sim/simulator.mjs","stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,.01)");',1)
          else:
            # Current source from prior pass may still use the exact older markers.
            old='requireText("sim/controller.mjs","stepGroundClearanceTarget(groundClearance,heightAxis,dt)");\nrequireText("sim/simulator.mjs","stepGroundClearanceTarget(soloGroundClearance,soloHeightAxis,dt)");'
            assert old in s
          s += '\nforbidText("sim/controller.mjs","requestAnimationFrame(stepHeightTarget)","height target semantics must not depend on visual FPS");\nforbidText("sim/simulator.mjs","stepSoloHeightTarget(renderNow)","solo height target semantics must not depend on visual FPS");\n'
          p.write_text(s)

          # Product and test labels are explicit about transport-timed target slew.
          p=Path('REAL_WORLD_DIGITAL_TWIN.md');doc=p.read_text().rstrip()+'''\n\nAltitude target slew is clocked by the control transport rather than rendering: 100 Hz SBUS sampling in one-phone SIM and the 20 ms P2P control publisher on the remote controller. Dropped visual frames therefore cannot change the intended height-control law.\n''';p.write_text(doc)

          Path('.github/workflows/one-shot-control-cadence.yml').unlink()
          for path in ['sim/controller.mjs','sim/simulator.mjs','sim/real_world_bootstrap.mjs','tests/architecture_invariants.mjs']:
            subprocess.run(['node','--check',path],check=True)
          PY
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Clock altitude input on real control cadence"
          git push origin HEAD:main
