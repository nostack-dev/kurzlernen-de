name: Apply safe building spawn once

on:
  push:
    branches: ["mp-visible-projectiles"]
    paths: [".github/workflows/apply-mp-spawn-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mp-visible-projectiles
          fetch-depth: 0
      - name: Apply deterministic outside-building launch
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f"{path}: expected 1 match, got {n}: {old[:120]!r}")
              p.write_text(s.replace(old,new,1))

          sim="sim/simulator.mjs"
          replace_one(sim,
            'import {normalizeBuildingCollisionSnapshot,createWorldBuildingCollisionBodies,destroyWorldBuildingCollisionBodies,resolveBox3dCameraPath} from "./world_building_collision_physics.mjs";',
            'import {normalizeBuildingCollisionSnapshot,createWorldBuildingCollisionBodies,destroyWorldBuildingCollisionBodies,findClearBuildingLaunchPoint,resolveBox3dCameraPath} from "./world_building_collision_physics.mjs";')
          replace_one(sim,
            '    this.noise=new Noise();\n    this.p={...p,wind:[...p.wind]};',
            '    this.noise=new Noise();\n    this.p={...p,wind:[...p.wind]};\n    this.worldBuildingLaunchResolved=false;this.worldBuildingLaunchPoint=[0,0];')
          old='''  setWorldBuildingCollisions(value){const snapshot=normalizeBuildingCollisionSnapshot(value);if(snapshot.hash===this.worldBuildingCollisionSnapshot.hash&&snapshot.prismCount===this.worldBuildingCollisionSnapshot.prismCount)return false;this.worldBuildingCollisionSnapshot=snapshot;this.rebuildWorldBuildingCollisions();return true;}\n  rebuildWorldBuildingCollisions(){if(!this.world)return;destroyWorldBuildingCollisionBodies(b3,this.worldBuildingCollisionState);this.worldBuildingCollisionState=createWorldBuildingCollisionBodies(b3,this.world,this.worldBuildingCollisionSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA});this.worldBuildingCollisionRevision++;}'''
          new='''  setWorldBuildingCollisions(value){const snapshot=normalizeBuildingCollisionSnapshot(value);if(snapshot.hash===this.worldBuildingCollisionSnapshot.hash&&snapshot.prismCount===this.worldBuildingCollisionSnapshot.prismCount)return false;this.worldBuildingCollisionSnapshot=snapshot;this.rebuildWorldBuildingCollisions();return true;}\n  resolveWorldBuildingLaunch(){\n    if(this.worldBuildingLaunchResolved||!this.body||!this.worldBuildingCollisionSnapshot.prismCount)return false;\n    const position=this.position(),velocity=this.linear(),angular=this.angular(),untouched=Math.hypot(position[0],position[1])<.14&&position[2]<=AIRFRAME_SPAWN_Z_M+.08&&norm(velocity)<.20&&norm(angular)<.80;\n    if(!untouched){this.worldBuildingLaunchResolved=true;this.worldBuildingLaunchPoint=[Infinity,Infinity];return false;}\n    const safe=findClearBuildingLaunchPoint(this.worldBuildingCollisionSnapshot,{point:[position[0],position[1]],clearanceM:.55,maxSearchM:80}),offset=Math.hypot(safe[0]-position[0],safe[1]-position[1]);\n    this.worldBuildingLaunchResolved=true;this.worldBuildingLaunchPoint=[safe[0],safe[1]];\n    const viewport=$("viewport");if(viewport){viewport.dataset.worldLaunchRelocated=offset>.01?"1":"0";viewport.dataset.worldLaunchOffsetM=offset.toFixed(3);viewport.dataset.worldLaunchX=Number(safe[0]).toFixed(3);viewport.dataset.worldLaunchY=Number(safe[1]).toFixed(3);}\n    if(offset<=.01)return false;\n    b3.b3Body_SetTransform(this.body,[safe[0],safe[1],AIRFRAME_SPAWN_Z_M],this.rotation());b3.b3Body_SetLinearVelocity(this.body,[0,0,0]);b3.b3Body_SetAngularVelocity(this.body,[0,0,0]);this.syncPresentationSnapshots();return true;\n  }\n  rebuildWorldBuildingCollisions(){if(!this.world)return;destroyWorldBuildingCollisionBodies(b3,this.worldBuildingCollisionState);this.resolveWorldBuildingLaunch();this.worldBuildingCollisionState=createWorldBuildingCollisionBodies(b3,this.world,this.worldBuildingCollisionSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,launchExclusionPoint:this.worldBuildingLaunchPoint||[Infinity,Infinity]});this.worldBuildingCollisionRevision++;}'''
          replace_one(sim,old,new)

          test="tests/world_building_collision_box3d_test.mjs"
          replace_one(test,
            'const buildings=createWorldBuildingCollisionBodies(b3,world,snapshot,{categoryBits:1n,maskBits:14n,rangefinderCategoryBits:4n});\nassert.equal(buildings.shapeCount,1);assert.equal(buildings.prismCount,3);assert.equal(buildings.skippedLaunchPrisms,2);assert.equal(buildings.skippedLaunchBuildings,1);assert.equal(buildings.activePrisms.length,1);assert.equal(buildings.activePrisms[0].buildingKey,"house");assert.ok(buildings.body&&b3.b3Body_IsValid(buildings.body));',
            'const buildings=createWorldBuildingCollisionBodies(b3,world,snapshot,{categoryBits:1n,maskBits:14n,rangefinderCategoryBits:4n,launchExclusionPoint:safeLaunch});\nassert.equal(buildings.shapeCount,3);assert.equal(buildings.prismCount,3);assert.equal(buildings.skippedLaunchPrisms,0);assert.equal(buildings.skippedLaunchBuildings,0);assert.equal(buildings.activePrisms.length,3);assert.ok(buildings.body&&b3.b3Body_IsValid(buildings.body));')
          replace_one(test,
            '// Regression: moving laterally away from an indoor launch must cross the old\n// triangle boundary without chatter or blockage from another prism of that house.\nconst lateral=makeProbe({velocity:[4,0,0]}),lateralPosition=advance(lateral,250);assert.ok(lateralPosition[0]>.80,`launch-building sibling prism still blocks lateral strafe: ${lateralPosition}`);assert.ok(lateralPosition.every(Number.isFinite));b3.b3DestroyBody(lateral);',
            '// Regression: the airframe starts outside the building, while the complete\n// launch building remains physically present. Moving farther away must stay clear.\nconst lateral=makeProbe({position:[safeLaunch[0],safeLaunch[1],1],velocity:[0,-4,0]}),lateralPosition=advance(lateral,250);assert.ok(lateralPosition[1]<safeLaunch[1]-.75,`relocated launch is not clear of the building: ${lateralPosition}`);assert.ok(lateralPosition.every(Number.isFinite));b3.b3DestroyBody(lateral);')
          replace_one(test,
            'console.log("WORLD Box3D building collision passed: nearest clear launch, full launch-building exclusion, lateral seam escape, stable ground-only GAME AGL, camera ground/wall occlusion, unrelated wall contact and collider teardown use real box3d.js 3D shapes.");',
            'console.log("WORLD Box3D building collision passed: indoor GPS launch relocates beside the building, the full building collider remains active, stable ground-only GAME AGL, camera ground/wall occlusion, unrelated wall contact and collider teardown use real box3d.js 3D shapes.");')

          staged="tests/staged_vs_smoke.mjs"
          replace_one(staged,
            'assert.ok(fireSource.indexOf("integrateProjectile(")<fireSource.indexOf("registerVsHit?.(sceneHit)"),"damage must only be emitted after projectile time-of-flight and segment collision");',
            'assert.ok(fireSource.includes("integrateProjectile(projectile.position,projectile.velocity,dt,projectile.nextPosition,projectile.nextVelocity);if(resolveProjectileHit(projectile,projectile.position,projectile.nextPosition,now))continue;"),"projectile time-of-flight must advance before segment collision resolution");assert.ok(fireSource.includes("registerVsHit?.(sceneHit)"),"VS damage must be emitted only from resolved projectile impact");')

          browser="tests/world_building_collision_browser_smoke.mjs"
          replace_one(browser,
            'for(const marker of ["createWorldBuildingCollisionBodies","setWorldBuildingCollisions","worldBuildingCollisionPrisms"])',
            'for(const marker of ["createWorldBuildingCollisionBodies","findClearBuildingLaunchPoint","resolveWorldBuildingLaunch","setWorldBuildingCollisions","worldBuildingCollisionPrisms"])')
          replace_one(browser,
            'const ring=[ll(8,-2),ll(12,-2),ll(12,2),ll(8,2),ll(8,-2)],feature={id:987654,properties:{render_height:9,render_min_height:1},geometry:{type:"Polygon",coordinates:[ring]}},courtyard={id:987655,properties:{render_height:12},geometry:{type:"Polygon",coordinates:[[ll(20,-5),ll(30,-5),ll(30,5),ll(20,5),ll(20,-5)],[ll(22,-3),ll(22,3),ll(28,3),ll(28,-3),ll(22,-3)]]}};',
            'const launchRing=[ll(-1,-1),ll(1,-1),ll(1,1),ll(-1,1),ll(-1,-1)],launch={id:987653,properties:{render_height:6,render_min_height:0},geometry:{type:"Polygon",coordinates:[launchRing]}},ring=[ll(8,-2),ll(12,-2),ll(12,2),ll(8,2),ll(8,-2)],feature={id:987654,properties:{render_height:9,render_min_height:1},geometry:{type:"Polygon",coordinates:[ring]}},courtyard={id:987655,properties:{render_height:12},geometry:{type:"Polygon",coordinates:[[ll(20,-5),ll(30,-5),ll(30,5),ll(20,5),ll(20,-5)],[ll(22,-3),ll(22,3),ll(28,3),ll(28,-3),ll(22,-3)]]}};')
          replace_one(browser,
            'const original=map.querySourceFeatures?.bind(map);bridge.buildingSourceId="fixture-buildings";map.querySourceFeatures=()=>[feature,courtyard];bridge.buildingCollisionDirty=true;const changed=bridge.syncBuildingCollisions(true);map.querySourceFeatures=original;\n    return{changed,status:viewport.dataset.worldBuildingCollisionStatus,footprints:Number(viewport.dataset.worldBuildingCollisionFootprints),prisms:Number(viewport.dataset.worldBuildingCollisionPrisms),physicsPrisms:Number(diagnostics.worldBuildingCollisionPrisms),revision:Number(diagnostics.worldBuildingCollisionRevision)};',
            'const original=map.querySourceFeatures?.bind(map);bridge.buildingSourceId="fixture-buildings";map.querySourceFeatures=()=>[launch,feature,courtyard];bridge.buildingCollisionDirty=true;const changed=bridge.syncBuildingCollisions(true);map.querySourceFeatures=original;\n    return{changed,status:viewport.dataset.worldBuildingCollisionStatus,footprints:Number(viewport.dataset.worldBuildingCollisionFootprints),prisms:Number(viewport.dataset.worldBuildingCollisionPrisms),physicsPrisms:Number(diagnostics.worldBuildingCollisionPrisms),revision:Number(diagnostics.worldBuildingCollisionRevision),launchRelocated:viewport.dataset.worldLaunchRelocated,launchOffset:Number(viewport.dataset.worldLaunchOffsetM)};')
          replace_one(browser,
            'if(!installed.changed||installed.status!=="box3d-active"||installed.footprints!==2||installed.prisms!==9||installed.physicsPrisms!==9)throw new Error(`OSM → bridge → Box3D installation failed: ${JSON.stringify(installed)}`);',
            'if(!installed.changed||installed.status!=="box3d-active"||installed.footprints!==3||installed.prisms!==10||installed.physicsPrisms!==10||installed.launchRelocated!=="1"||!(installed.launchOffset>1.45))throw new Error(`OSM → safe launch → Box3D installation failed: ${JSON.stringify(installed)}`);')
          replace_one(browser,
            'await page.click("#soloReset");await page.waitForFunction(previous=>globalThis.__arondightDiagnostics.worldBuildingCollisionRevision>previous&&globalThis.__arondightDiagnostics.worldBuildingCollisionPrisms===9,{timeout:5000},installed.revision);',
            'await page.click("#soloReset");await page.waitForFunction(previous=>globalThis.__arondightDiagnostics.worldBuildingCollisionRevision>previous&&globalThis.__arondightDiagnostics.worldBuildingCollisionPrisms===10,{timeout:5000},installed.revision);')
          replace_one(browser,
            'if(afterReset.prisms!==9||afterReset.revision<=installed.revision)throw new Error(`building colliders did not survive RESET: ${JSON.stringify({installed,afterReset})}`);',
            'if(afterReset.prisms!==10||afterReset.revision<=installed.revision)throw new Error(`building colliders did not survive RESET: ${JSON.stringify({installed,afterReset})}`);')
          replace_one(browser,
            'console.log(`WORLD browser collision pipeline passed: convex house + open courtyard installed as ${installed.physicsPrisms} Box3D prisms, survived RESET and cleared on TRAINING: ${JSON.stringify({installed,afterReset,cleared})}`);',
            'console.log(`WORLD browser collision pipeline passed: GPS inside a real building relocated beside it, all ${installed.physicsPrisms} Box3D prisms stayed physical, RESET repeated safely and TRAINING cleared them: ${JSON.stringify({installed,afterReset,cleared})}`);')
          PY

          rm .github/workflows/apply-mp-spawn-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/simulator.mjs tests/world_building_collision_box3d_test.mjs tests/world_building_collision_browser_smoke.mjs tests/staged_vs_smoke.mjs .github/workflows/apply-mp-spawn-once.yml
          git commit -m "Relocate indoor GPS launch beside building"
          git push origin HEAD:mp-visible-projectiles
