name: vs-explicit-start
on:
  push:
    branches: ["fix/vs-explicit-start"]
    paths: [".github/workflows/vs-explicit-start.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate VS network from normal flight startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/real_world_bootstrap.mjs')
          s=p.read_text()
          old='this.installUi();this.installLookHud();this.installFreeLookSurface();this.installVsUi();queueMicrotask(()=>this.startVs());window.addEventListener'
          new='this.installUi();this.installLookHud();this.installFreeLookSurface();this.installVsUi();window.addEventListener'
          assert s.count(old)==1, f'auto-start anchor count {s.count(old)}'
          s=s.replace(old,new,1)
          s=s.replace('button.textContent="VS · AUTO"','button.textContent="FIND MATE · VS"',1)
          s=s.replace('if(b)b.textContent="VS · AUTO"','if(b)b.textContent="FIND MATE · VS"',1)
          p.write_text(s)

          t=Path('tests/architecture_invariants.mjs')
          x=t.read_text()
          marker='console.log("Architecture invariants passed: raw hardware boundary, one C++ motor authority, radial configurable GAME velocity envelope, geospatial WGS84/ENU render adapter only, direct WebRTC control and HIL-only bridge.");'
          guards='''forbidText("sim/real_world_bootstrap.mjs","queueMicrotask(()=>this.startVs())","VS signaling must never auto-start with the flight simulator");\nrequireText("sim/real_world_bootstrap.mjs","FIND MATE · VS","VS must be an explicit in-game action");\n'''
          assert marker in x
          if 'VS signaling must never auto-start' not in x:x=x.replace(marker,guards+marker,1)
          t.write_text(x)
          PY
          node --check sim/real_world_bootstrap.mjs
          node --check sim/lan_vs.mjs
          node tests/architecture_invariants.mjs
          node tests/lan_vs_smoke.mjs
      - name: Commit reviewed fix
        run: |
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sim/real_world_bootstrap.mjs tests/architecture_invariants.mjs
          git commit -m 'Make VS an explicit isolated flight action'
          git push
