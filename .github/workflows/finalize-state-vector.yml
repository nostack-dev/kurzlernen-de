name: Finalize state-vector control contracts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-state-vector.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align strict tests and remove temporary validation workflows
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # The yaw gate remains >=4 degrees. Give it a command whose shaped
          # physical target can actually exceed 4 degrees in the 0.22 s window.
          p=Path('tests/dual_phone_smoke.mjs')
          s=p.read_text()
          old='await controller.mouse.move(rcx+rr*.45,rcy,{steps:4});'
          new='await controller.mouse.move(rcx+rr*.65,rcy,{steps:4});'
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)

          # Final measured-state gain is Kv=.80. Keep the unit contract strict,
          # but assert the actual chosen gain rather than the superseded 1.20 value.
          p=Path('tests/state_control_test.cpp')
          s=p.read_text()
          reps={
            '''CHECK(controller.debug().forward_accel_mps2 < -1.15f &&\n          controller.debug().forward_accel_mps2 > -1.25f);''':'''CHECK(controller.debug().forward_accel_mps2 < -0.75f &&\n          controller.debug().forward_accel_mps2 > -0.85f);''',
            '''CHECK(controller.debug().right_accel_mps2 > 1.15f &&\n          controller.debug().right_accel_mps2 < 1.25f);''':'''CHECK(controller.debug().right_accel_mps2 > 0.75f &&\n          controller.debug().right_accel_mps2 < 0.85f);''',
            '''CHECK(controller.debug().right_accel_mps2 < -1.15f &&\n          controller.debug().right_accel_mps2 > -1.25f);''':'''CHECK(controller.debug().right_accel_mps2 < -0.75f &&\n          controller.debug().right_accel_mps2 > -0.85f);''',
          }
          for old,new in reps.items():
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new,1)

          marker='''    // Yaw is the rotational component of the target state. Stick input integrates\n'''
          assert s.count(marker)==1,s.count(marker)
          roundtrip='''    // StateController outputs are already physical post-shape commands. The\n    // internal RC adapter must therefore invert receiver shaping exactly once so\n    // fc::Runtime reconstructs the requested roll/pitch/yaw command.\n    for (const float target : {-0.80f, -0.30f, 0.30f, 0.80f}) {\n        auto shaped = base_rc(true);\n        shaped.ch[FC_SBUS_YAW] = fc::shaped_raw(target, 0.045f, 0.20f);\n        CHECK(std::fabs(fc::command(shaped).yaw - target) < 0.003f);\n        shaped.ch[FC_SBUS_ROLL] = fc::shaped_raw(target, 0.035f, 0.30f);\n        CHECK(std::fabs(fc::command(shaped).roll - target) < 0.003f);\n    }\n\n'''
          s=s.replace(marker,roundtrip+marker,1)
          p.write_text(s)

          # Lock the corrected contracts into architecture validation and forbid
          # all current temporary tuning/diagnostic workflows from returning.
          p=Path('tests/architecture_invariants.mjs')
          s=p.read_text()
          anchor='''requireText("tests/dual_phone_smoke.mjs","moving.forward>.30",\n            "dual-phone GAME E2E must verify desired forward velocity produces real forward motion");\n'''
          assert s.count(anchor)==1,s.count(anchor)
          addition=anchor+'''requireText("tests/dual_phone_smoke.mjs","rcx+rr*.65",\n            "yaw E2E stimulus must request enough shaped yaw to make the unchanged 4-degree gate physically reachable");\nrequireText("esp32/Arondight45_StateControl.hpp","shaped_raw(yaw_command, 0.045f, 0.20f)",\n            "internal physical yaw command must survive Runtime receiver shaping exactly once");\nrequireText("esp32/Arondight45_StateControl.hpp","inverse_shape",\n            "StateController-to-Runtime adapter must invert receiver shaping for physical commands");\n'''
          s=s.replace(anchor,addition,1)
          list_anchor='''  ".github/workflows/oneoff-fusion-fix.yml",\n'''
          assert s.count(list_anchor)==1,s.count(list_anchor)
          s=s.replace(list_anchor,list_anchor+'''  ".github/workflows/fusion-single-temp.yml",\n  ".github/workflows/state-command-map-temp.yml",\n  ".github/workflows/finalize-state-vector.yml",\n''',1)
          p.write_text(s)
          PY

          git rm -f .github/workflows/fusion-single-temp.yml
          git rm -f .github/workflows/state-command-map-temp.yml
          git rm -f .github/workflows/finalize-state-vector.yml

          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc-core-tests
          /tmp/fc-core-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state-control-tests
          /tmp/state-control-tests
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil-tests
          /tmp/hil-tests
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          node --check sim/simulator.mjs
          node --check sim/controller.mjs
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize desired-state vector contracts"
          git push origin HEAD:main
