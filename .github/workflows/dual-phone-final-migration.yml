name: Final dual-phone startup migration
on:
  push:
    paths:
      - '.github/workflows/dual-phone-final-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Align P2P test with exit-only startup menu
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/dual_phone_smoke.mjs');s=p.read_text()
          old='''  await waitText(view,"#status","SIM ready",30000);\n  if(await view.$eval("#inputSource",element=>element.value)!=="remote")throw new Error("remote phone is not primary input");\n'''
          new='''  await waitText(view,"#status","SIM ready",30000);\n  await view.waitForFunction(()=>document.body.classList.contains("solo-flight")&&document.querySelector("#viewport")?.dataset.cameraMode==="fpv",{timeout:5000});\n  await invoke(view,"#soloExit");\n  await view.waitForFunction(()=>!document.body.classList.contains("solo-flight"),{timeout:5000});\n  const menuState=await view.evaluate(()=>({input:document.querySelector("#inputSource")?.value||"",panel:getComputedStyle(document.querySelector(".panel")).display}));\n  if(menuState.input!=="remote"||menuState.panel==="none")throw new Error(`EXIT did not restore the remote-first main menu: ${JSON.stringify(menuState)}`);\n'''
          if s.count(old)!=1: raise SystemExit(f'expected one startup marker, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/dual-phone-final-migration.yml
          node --check tests/dual_phone_smoke.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Align dual-phone gate with exit-only startup'
          git push origin HEAD:main
