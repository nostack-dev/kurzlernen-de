name: One-shot FC-driven ESC arming tones

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-arm-beeps.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply arming-tone patch
        run: python3 tools/one_shot_arm_beeps.py
      - name: Validate and commit
        run: |
          set -euxo pipefail
          node --check sim/simulator.mjs
          node tests/architecture_invariants.mjs
          git diff --check
          rm tools/one_shot_arm_beeps.py
          rm .github/workflows/one-shot-arm-beeps.yml
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim/simulator.mjs tests/architecture_invariants.mjs tools/one_shot_arm_beeps.py .github/workflows/one-shot-arm-beeps.yml
          git commit -m "Add FC-driven ESC arming tones"
          git push
