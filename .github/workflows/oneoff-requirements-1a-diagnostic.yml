name: Diagnose 1a host gate
on:
  push:
    branches: [fix/requirements-1a-complete]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose 1a host gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/requirements-1a-complete
      - name: Apply deterministic patch
        run: python3 tools/requirements_1a_patch.py
      - name: JS syntax
        run: |
          node --check sim/flight_fire_fx.mjs
          node --check sim/real_world_bootstrap.mjs
          node --check sim/simulator.mjs
          node --check tests/world_shot_decal_smoke.mjs
          node --check tests/real_world_ui_smoke.mjs
          node --check tests/architecture_invariants.mjs
      - name: FC core
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
      - name: State controller
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
      - name: Raw HIL protocol
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iesp32 tests/drone_hil_protocol_test.cpp -o /tmp/hil_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/hil_test
      - name: SIL host
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil_test
          /tmp/sil_test
      - name: Control semantics
        run: node tests/control_semantics_test.mjs
      - name: Architecture invariants
        run: node tests/architecture_invariants.mjs
