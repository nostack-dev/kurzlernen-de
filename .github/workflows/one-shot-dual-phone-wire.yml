name: One-shot dual phone wiring
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-dual-phone-wire.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic simulator patch
        run: |
          set -euxo pipefail
          python3 tools/patch_dual_phone.py
          node --check sim/simulator.mjs
      - name: Commit patched simulator
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/simulator.mjs
          git commit -m "Wire second-phone remote into simulator"
          git push
