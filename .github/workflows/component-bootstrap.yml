name: Component physics bootstrap

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'RUN_COMPONENT_PHYSICS_PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract and execute verified component patch
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/apply-component-derived-physics.yml').read_text().splitlines()
          start=None
          for i,line in enumerate(src):
              if line.strip()=='run: |' and i and 'Build component mass and physical authority model' in src[i-1]:
                  start=i+1
                  break
          if start is None: raise SystemExit('component patch run block not found')
          out=[]
          for line in src[start:]:
              if line.startswith('          '): out.append(line[10:])
              elif not line.strip(): out.append('')
              else: break
          script='\n'.join(out)+'\n'
          script=script.replace('assert.equal(base.components.length,16)','assert.equal(base.components.length,17)')
          script=script.replace("return n*(3.3+.9*s+.0375*Math.tanh((s-.12)*18));","return n*Math.min(4.2,3.2625+.9*s+.0375*Math.tanh((s-.12)*18));")
          Path('/tmp/component-patch.sh').write_text(script)
          PY
          bash -n /tmp/component-patch.sh
          if ! bash /tmp/component-patch.sh > /tmp/component-patch.log 2>&1; then
            tail -n 160 /tmp/component-patch.log
            exit 1
          fi
          tail -n 120 /tmp/component-patch.log
      - name: Clean temporary transport files
        if: success()
        run: |
          set -euxo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm -f .github/workflows/apply-component-derived-physics.yml .github/workflows/repair-component-patch-gate.yml .github/workflows/component-bootstrap.yml .component-repair-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release component-derived drone physics'
          git push origin HEAD:main
          echo "CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch normal Pages release
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/actions/workflows/deploy.yml/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'main'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `COMPONENT_PHYSICS_PATCH_OK clean=${process.env.CLEAN_SHA} deploy_dispatched=1`
            });
      - name: Report patch failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            let log=''; try{log=fs.readFileSync('/tmp/component-patch.log','utf8').slice(-6000);}catch{}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`COMPONENT_PHYSICS_PATCH_FAILED\n\n\`\`\`\n${log}\n\`\`\``});
