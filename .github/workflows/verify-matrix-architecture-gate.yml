name: Verify matrix architecture gate

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply asserted architecture-gate patch
        run: |
          set -euxo pipefail
          python3 tools/patch_matrix_architecture_gate.py
          node --check tests/architecture_invariants.mjs

      - name: Prove centralized matrix contract
        run: |
          set -euxo pipefail
          node tests/collision_filter_matrix_test.mjs
          node tests/architecture_invariants.mjs

      - name: Commit verified gate patch to branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/architecture_invariants.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Align architecture gate with collision matrix module"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
