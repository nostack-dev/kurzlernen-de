name: Final shared controls and physics audio migration

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-shot-final-controls-audio.yml"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final control and audio patch
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              actual=text.count(old)
              assert actual==count, f"{path}: expected {count} matches, got {actual}: {old[:100]!r}"
              p.write_text(text.replace(old,new,count))

          # Shared GAME semantics: pointer-right means positive FC right intent.
          replace_exact("sim/control_semantics.mjs",
          '''    // FC GAME body-frame convention: negative roll command is physical RIGHT strafe.\n    controls.roll=cfg.lockLeftHorizontal?0:phoneAxis(-x,cfg.leftFineness);''',
          '''    // FC GAME body-frame convention: positive roll channel is positive physical RIGHT intent.\n    controls.roll=cfg.lockLeftHorizontal?0:phoneAxis(x,cfg.leftFineness);''')
          replace_exact("sim/control_semantics.mjs",
          '''    const rawX=cfg.lockLeftHorizontal?0:-inversePhoneAxis(controls.roll,cfg.leftFineness);''',
          '''    const rawX=cfg.lockLeftHorizontal?0:inversePhoneAxis(controls.roll,cfg.leftFineness);''')

          # Unit contract: left pointer -> physical left, right pointer -> physical right.
          replace_exact("tests/control_semantics_test.mjs",
          '''// GAME left-stick physical strafe contract. Both 1-PHONE and 2-PHONE call this exact function.\n// After the FC body-frame correction, +roll is physical LEFT and -roll is physical RIGHT.\nlet game=neutralControls();\napplyGameStick(game,"left",{x:-.60,y:0},DEFAULT_PHONE_SETTINGS);\nassert.ok(game.roll>0,"LEFT stick motion must produce physical LEFT strafe");\nlet gameKnob=gameKnobAxes(game,"left",DEFAULT_PHONE_SETTINGS);\nnear(gameKnob.x,-.60,3e-6,"LEFT strafe knob must stay under the left pointer");\ngame=neutralControls();\napplyGameStick(game,"left",{x:.60,y:0},DEFAULT_PHONE_SETTINGS);\nassert.ok(game.roll<0,"RIGHT stick motion must produce physical RIGHT strafe");\ngameKnob=gameKnobAxes(game,"left",DEFAULT_PHONE_SETTINGS);\nnear(gameKnob.x,.60,3e-6,"RIGHT strafe knob must stay under the right pointer");\nconst gameInvertLeft={...DEFAULT_PHONE_SETTINGS,invertLeftHorizontal:true};\ngame=neutralControls();applyGameStick(game,"left",{x:-.60,y:0},gameInvertLeft);\nassert.ok(game.roll<0,"inverted LEFT motion must produce physical RIGHT strafe");\ngame=neutralControls();applyGameStick(game,"left",{x:.60,y:0},gameInvertLeft);\nassert.ok(game.roll>0,"inverted RIGHT motion must produce physical LEFT strafe");''',
          '''// GAME left-stick physical strafe contract. Both 1-PHONE and 2-PHONE call this exact function.\n// The FC decodes positive roll-channel intent as positive body-right velocity.\nlet game=neutralControls();\napplyGameStick(game,"left",{x:-.60,y:0},DEFAULT_PHONE_SETTINGS);\nassert.ok(game.roll<0,"LEFT stick motion must produce physical LEFT strafe");\nlet gameKnob=gameKnobAxes(game,"left",DEFAULT_PHONE_SETTINGS);\nnear(gameKnob.x,-.60,3e-6,"LEFT strafe knob must stay under the left pointer");\ngame=neutralControls();\napplyGameStick(game,"left",{x:.60,y:0},DEFAULT_PHONE_SETTINGS);\nassert.ok(game.roll>0,"RIGHT stick motion must produce physical RIGHT strafe");\ngameKnob=gameKnobAxes(game,"left",DEFAULT_PHONE_SETTINGS);\nnear(gameKnob.x,.60,3e-6,"RIGHT strafe knob must stay under the right pointer");\nconst gameInvertLeft={...DEFAULT_PHONE_SETTINGS,invertLeftHorizontal:true};\ngame=neutralControls();applyGameStick(game,"left",{x:-.60,y:0},gameInvertLeft);\nassert.ok(game.roll>0,"inverted LEFT motion must produce physical RIGHT strafe");\ngame=neutralControls();applyGameStick(game,"left",{x:.60,y:0},gameInvertLeft);\nassert.ok(game.roll<0,"inverted RIGHT motion must produce physical LEFT strafe");''')

          # Controller setting changes are live in GAME: neutral motion, preserve armed request.
          replace_exact("sim/controller.mjs",
          '''  onChange:next=>{phoneSettings=next;safetyNeutral(true);},''',
          '''  onChange:next=>{\n    phoneSettings=next;\n    const keepArm=gameMode&&controls.arm;\n    controls=neutralForMode();controls.arm=keepArm;\n    updateSticks();publish();\n  },''')

          # Solo setting changes use the same live behavior and shared mapping.
          replace_exact("sim/simulator.mjs",
          '''  onChange:next=>{phoneSettings=next;soloControls=neutralSoloControls();updateSoloSticks();arm=false;throttle=0;},''',
          '''  onChange:next=>{phoneSettings=next;const keepArm=soloControls.arm;soloControls=neutralSoloControls();soloControls.arm=keepArm;updateSoloSticks();arm=keepArm;throttle=0;},''')

          # Physics model exposes the actual instantaneous motor state used for audio.
          replace_exact("sim/simulator.mjs",
          '''    this.motorOmega=[0,0,0,0];this.batterySoc=1;this.batteryVoltage=16.8;this.batteryCurrent=0;this.worldAcceleration=[0,0,0];this.prevOmegaBody=[0,0,0];''',
          '''    this.motorOmega=[0,0,0,0];this.motorCurrent=[0,0,0,0];this.motorTorque=[0,0,0,0];this.propTorque=[0,0,0,0];this.motorPower=[0,0,0,0];this.batterySoc=1;this.batteryVoltage=16.8;this.batteryCurrent=0;this.worldAcceleration=[0,0,0];this.prevOmegaBody=[0,0,0];''')
          replace_exact("sim/simulator.mjs",
          '''    this.batteryCurrent=total;\n    this.batterySoc=clamp(this.batterySoc-total*dt/(p.capacity*3600),0,1);''',
          '''    this.batteryCurrent=total;this.motorCurrent=currents.slice();\n    this.batterySoc=clamp(this.batterySoc-total*dt/(p.capacity*3600),0,1);''')
          replace_exact("sim/simulator.mjs",
          '''      const revolutions=this.motorOmega[i]/(2*Math.PI),propTorque=p.Cq*p.rho*revolutions*revolutions*diameter**5,motorTorque=torqueConstant*currents[i];\n      this.motorOmega[i]=Math.max(0,this.motorOmega[i]+(motorTorque-propTorque-1.5e-7*this.motorOmega[i])*dt/p.J);''',
          '''      const revolutions=this.motorOmega[i]/(2*Math.PI),propTorque=p.Cq*p.rho*revolutions*revolutions*diameter**5,motorTorque=torqueConstant*currents[i];\n      this.motorTorque[i]=motorTorque;this.propTorque[i]=propTorque;this.motorPower[i]=Math.max(0,motorTorque*this.motorOmega[i]);\n      this.motorOmega[i]=Math.max(0,this.motorOmega[i]+(motorTorque-propTorque-1.5e-7*this.motorOmega[i])*dt/p.J);''')

          # Physics-derived WebAudio renderer. No stick/throttle/PWM values enter this sound path.
          anchor='''function integrateDuration(model,pulses,duration){\n  if(!(duration>0))return model.state();\n  let remaining=duration,state=model.state();\n  while(remaining>1e-9){const step=Math.min(DT,remaining);state=model.step(pulses,step);remaining-=step;}\n  return state;\n}\n\n'''
          sound='''class MotorSound {\n  constructor(viewport){this.viewport=viewport;this.ctx=null;this.master=null;this.voices=[];this.enabled=localStorage.getItem("arondight45MotorSound")!=="off";this.unlocked=false;this.viewport.dataset.motorAudioSource="motorOmega+motorTorque+propTorque";}\n  ensure(){\n    if(this.ctx)return true;const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return false;\n    this.ctx=new AudioCtx({latencyHint:"interactive"});this.master=this.ctx.createGain();this.master.gain.value=0;this.master.connect(this.ctx.destination);\n    for(let i=0;i<4;i++){\n      const gain=this.ctx.createGain(),fundamental=this.ctx.createOscillator(),harmonic=this.ctx.createOscillator(),harmonicGain=this.ctx.createGain();\n      fundamental.type="triangle";harmonic.type="sine";gain.gain.value=0;harmonicGain.gain.value=.32;fundamental.connect(gain);harmonic.connect(harmonicGain);harmonicGain.connect(gain);gain.connect(this.master);fundamental.start();harmonic.start();this.voices.push({fundamental,harmonic,gain});\n    }\n    return true;\n  }\n  async unlock(){if(!this.enabled||!this.ensure())return false;try{if(this.ctx.state!=="running")await this.ctx.resume();this.unlocked=this.ctx.state==="running";return this.unlocked;}catch{return false;}}\n  setEnabled(value){this.enabled=Boolean(value);localStorage.setItem("arondight45MotorSound",this.enabled?"on":"off");if(!this.enabled&&this.master&&this.ctx)this.master.gain.setTargetAtTime(0,this.ctx.currentTime,.025);}\n  update(model,cameraPosition){\n    const omega=model.motorOmega||[],motorTorque=model.motorTorque||[],propTorque=model.propTorque||[];let weightedHz=0,totalPropPower=0;\n    for(let i=0;i<4;i++){const w=Math.max(0,Number(omega[i])||0),rotorHz=w/(2*Math.PI),shaftPower=Math.max(0,(Number(propTorque[i])||0)*w),electromagneticPower=Math.max(0,(Number(motorTorque[i])||0)*w),weight=shaftPower+electromagneticPower*.15;weightedHz+=rotorHz*weight;totalPropPower+=shaftPower;const voice=this.voices[i];if(!voice||!this.ctx)continue;const now=this.ctx.currentTime,drive=rotorHz>2?Math.tanh((shaftPower+electromagneticPower*.20)/28):0;voice.fundamental.frequency.setTargetAtTime(Math.max(18,rotorHz),now,.012);voice.harmonic.frequency.setTargetAtTime(Math.max(36,rotorHz*2),now,.012);voice.gain.gain.setTargetAtTime(.015*drive,now,.018);}\n    const meanHz=totalPropPower>1e-9?weightedHz/Math.max(1e-9,totalPropPower):omega.reduce((s,w)=>s+Math.max(0,Number(w)||0)/(2*Math.PI),0)/4;this.viewport.dataset.motorAudioHz=String(meanHz);this.viewport.dataset.motorAudioPowerW=String(totalPropPower);\n    if(this.master&&this.ctx){const p=model.position(),distance=cameraPosition?Math.hypot(cameraPosition.x-p[0],cameraPosition.y-p[1],cameraPosition.z-p[2]):1,distanceGain=1/(1+.12*distance*distance),target=this.enabled&&this.unlocked?.72*distanceGain:0;this.master.gain.setTargetAtTime(target,this.ctx.currentTime,.035);}\n  }\n}\n\n'''
          replace_exact("sim/simulator.mjs",anchor,anchor+sound)

          replace_exact("sim/simulator.mjs",
          '''const cameraHud=document.createElement("div");cameraHud.id="cameraModes";cameraHud.setAttribute("aria-label","Camera mode");cameraHud.innerHTML='<button id="camFollow" type="button">FOLLOW</button><button id="camFpv" type="button">FPV</button><button id="camThird" type="button">THIRD</button><button id="camSolo" type="button">1 PHONE</button>';''',
          '''const cameraHud=document.createElement("div");cameraHud.id="cameraModes";cameraHud.setAttribute("aria-label","Camera mode");cameraHud.innerHTML='<button id="camFollow" type="button">FOLLOW</button><button id="camFpv" type="button">FPV</button><button id="camThird" type="button">THIRD</button><button id="camSolo" type="button">1 PHONE</button><button id="soundToggle" type="button">SOUND</button>';''')
          replace_exact("sim/simulator.mjs",
          '''let physics=new PhysicsModel(defaultParams(),{graphics:true,scene});\nconst navigationSensors=new SimNavigationSensors();''',
          '''let physics=new PhysicsModel(defaultParams(),{graphics:true,scene});\nconst motorSound=new MotorSound($("viewport"));\nfunction updateSoundButton(){const button=$("soundToggle");if(button)button.textContent=motorSound.enabled?(motorSound.unlocked?"SOUND ON":"SOUND TAP"):"SOUND OFF";}\n$("soundToggle").onclick=async()=>{if(!motorSound.enabled||!motorSound.unlocked){motorSound.setEnabled(true);await motorSound.unlock();}else motorSound.setEnabled(false);updateSoundButton();};\ndocument.addEventListener("pointerdown",event=>{if(event.target?.id!=="soundToggle"&&motorSound.enabled&&!motorSound.unlocked)motorSound.unlock().then(updateSoundButton);},{passive:true});\nupdateSoundButton();\nconst navigationSensors=new SimNavigationSensors();''')
          replace_exact("sim/simulator.mjs",
          '''  requestAnimationFrame(render);physics.render();updateCamera();const state=physics.state();''',
          '''  requestAnimationFrame(render);physics.render();updateCamera();motorSound.update(physics,camera.position);const state=physics.state();''')

          # Browser tests use the same +body-Y physical right convention as firmware telemetry.
          for path in ["tests/browser_sim_smoke.mjs","tests/dual_phone_smoke.mjs"]:
              replace_exact(path,
              '''right:s*vx-c*vy''',
              '''right:-s*vx+c*vy''')

          # Solo settings: verify left invert persists live, then restore before flight.
          replace_exact("tests/browser_sim_smoke.mjs",
          '''    invertX:document.querySelector('.phone-settings-dialog [data-invert-right-horizontal]')?.checked,\n    invertY:document.querySelector('.phone-settings-dialog [data-invert-right-vertical]')?.checked,''',
          '''    invertLeft:document.querySelector('.phone-settings-dialog [data-invert-left-horizontal]')?.checked,\n    invertX:document.querySelector('.phone-settings-dialog [data-invert-right-horizontal]')?.checked,\n    invertY:document.querySelector('.phone-settings-dialog [data-invert-right-vertical]')?.checked,''')
          replace_exact("tests/browser_sim_smoke.mjs",
          '''  if(defaults.left!=="7"||defaults.right!=="10"||defaults.lock!==false||defaults.lockLeft!==false||defaults.invertX!==false||defaults.invertY!==false||!defaults.rightLockLabel.includes("VERTICAL AXIS"))''',
          '''  if(defaults.left!=="7"||defaults.right!=="10"||defaults.lock!==false||defaults.lockLeft!==false||defaults.invertLeft!==false||defaults.invertX!==false||defaults.invertY!==false||!defaults.rightLockLabel.includes("VERTICAL AXIS"))''')
          replace_exact("tests/browser_sim_smoke.mjs",
          '''  await page.click('.phone-settings-dialog [data-invert-right-horizontal]');''',
          '''  await page.click('.phone-settings-dialog [data-invert-left-horizontal]');\n  let stored=await page.evaluate(()=>JSON.parse(localStorage.getItem("arondight45PhoneControlSettingsV4")||"{}"));\n  if(stored.invertLeftHorizontal!==true)throw new Error(`left horizontal invert did not persist live: ${JSON.stringify(stored)}`);\n  await page.click('.phone-settings-dialog [data-invert-left-horizontal]');\n  stored=await page.evaluate(()=>JSON.parse(localStorage.getItem("arondight45PhoneControlSettingsV4")||"{}"));\n  if(stored.invertLeftHorizontal!==false)throw new Error(`left horizontal invert restore failed: ${JSON.stringify(stored)}`);\n\n  await page.click('.phone-settings-dialog [data-invert-right-horizontal]');''')
          replace_exact("tests/browser_sim_smoke.mjs",
          '''  let stored=await page.evaluate(()=>JSON.parse(localStorage.getItem("arondight45PhoneControlSettingsV4")||"{}"));\n  if(stored.invertRightHorizontal!==true)''',
          '''  stored=await page.evaluate(()=>JSON.parse(localStorage.getItem("arondight45PhoneControlSettingsV4")||"{}"));\n  if(stored.invertRightHorizontal!==true)''')

          # Verify the sound renderer is fed by live physical motor state once airborne.
          replace_exact("tests/browser_sim_smoke.mjs",
          '''  if(!(hold.altitude>1.35&&hold.altitude<2.65&&Math.abs(hold.vertical)<.80))throw new Error(`solo 2m AGL hold failed: ${JSON.stringify(hold)}`);''',
          '''  if(!(hold.altitude>1.35&&hold.altitude<2.65&&Math.abs(hold.vertical)<.80))throw new Error(`solo 2m AGL hold failed: ${JSON.stringify(hold)}`);\n  const audioDrive=await page.$eval("#viewport",e=>({source:e.dataset.motorAudioSource,hz:Number(e.dataset.motorAudioHz),power:Number(e.dataset.motorAudioPowerW)}));\n  if(audioDrive.source!=="motorOmega+motorTorque+propTorque"||!(audioDrive.hz>20)||!(audioDrive.power>0))throw new Error(`motor sound is not driven by live rotor physics: ${JSON.stringify(audioDrive)}`);''')

          # Controller settings UI must change the actual shared GAME command immediately.
          marker='''  const clearance=await controller.$eval("#gameClearanceSlider",element=>Number(element.value));if(Math.abs(clearance-2)>0.01)throw new Error(`unexpected default ground clearance ${clearance}`);\n'''
          insertion='''  await controller.click(".phone-settings-button");await controller.waitForFunction(()=>document.querySelector(".phone-settings-dialog")?.open,{timeout:5000});\n  const leftInvertInitially=await controller.$eval('.phone-settings-dialog [data-invert-left-horizontal]',e=>e.checked);if(leftInvertInitially)throw new Error("left invert unexpectedly enabled by default");\n  await controller.click('.phone-settings-dialog [data-invert-left-horizontal]');\n  await controller.waitForFunction(()=>JSON.parse(localStorage.getItem("arondight45PhoneControlSettingsV4")||"{}").invertLeftHorizontal===true,{timeout:5000});\n  await controller.click('.phone-settings-dialog [data-close]');\n  const settingLeft=await stickBox(controller,"#leftStick"),settingX=settingLeft.x+settingLeft.w/2,settingY=settingLeft.y+settingLeft.h/2,settingR=Math.min(settingLeft.w,settingLeft.h)*.42;\n  await controller.mouse.move(settingX,settingY);await controller.mouse.down();await controller.mouse.move(settingX+settingR*.55,settingY,{steps:4});\n  await controller.waitForFunction(()=>/STR -[1-9]/.test(document.querySelector("#leftValue")?.textContent||""),{timeout:5000});await controller.mouse.up();\n  await controller.click(".phone-settings-button");await controller.waitForFunction(()=>document.querySelector(".phone-settings-dialog")?.open,{timeout:5000});await controller.click('.phone-settings-dialog [data-invert-left-horizontal]');\n  await controller.waitForFunction(()=>JSON.parse(localStorage.getItem("arondight45PhoneControlSettingsV4")||"{}").invertLeftHorizontal===false,{timeout:5000});await controller.click('.phone-settings-dialog [data-close]');\n'''
          replace_exact("tests/dual_phone_smoke.mjs",marker,marker+insertion)

          # Architecture gates: shared sign, live settings, and audio can only read physical motor state.
          replace_exact("tests/architecture_invariants.mjs",
          '''requireText("sim/control_semantics.mjs","cfg.invertLeftHorizontal?-point.x:point.x");''',
          '''requireText("sim/control_semantics.mjs","cfg.invertLeftHorizontal?-point.x:point.x");\nrequireText("sim/control_semantics.mjs","controls.roll=cfg.lockLeftHorizontal?0:phoneAxis(x,cfg.leftFineness)");''')
          replace_exact("tests/architecture_invariants.mjs",
          '''requireText("sim/simulator.mjs","FPV optics are rigidly mounted to the airframe");''',
          '''requireText("sim/simulator.mjs","FPV optics are rigidly mounted to the airframe");\nfor(const marker of ["class MotorSound","model.motorOmega","model.motorTorque","model.propTorque","motorAudioPowerW"])requireText("sim/simulator.mjs",marker);\nrequireText("sim/simulator.mjs",'this.viewport.dataset.motorAudioSource="motorOmega+motorTorque+propTorque"');''')
          replace_exact("tests/architecture_invariants.mjs",
          '''requireText("sim/controller.mjs","applyGameStick(controls,kind,point,phoneSettings)");''',
          '''requireText("sim/controller.mjs","applyGameStick(controls,kind,point,phoneSettings)");\nrequireText("sim/controller.mjs","const keepArm=gameMode&&controls.arm");\nrequireText("sim/simulator.mjs","const keepArm=soloControls.arm");''')

          # Remove this migration workflow from the final tree.
          Path(".github/workflows/one-shot-final-controls-audio.yml").unlink()
          PY

          node --check sim/control_semantics.mjs
          node --check sim/controller.mjs
          node --check sim/simulator.mjs
          node tests/control_semantics_test.mjs
          node tests/architecture_invariants.mjs
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test

          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix shared strafe semantics and add physics-driven motor audio"
          git push origin HEAD:main
