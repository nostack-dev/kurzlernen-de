name: Fix native mobile touch coordinates once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-native-mobile-input-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch native orientation and absolute touch sticks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sim/simulator.mjs')
          s=p.read_text()
          old='''  /* iOS ignores Screen Orientation lock in normal browser tabs. Rotate the complete\n     simulator as a deterministic fallback so the flight UI is always landscape. */\n  @media(orientation:portrait){\n    body.solo-flight #viewport{inset:0 auto auto 100vw!important;width:100dvh!important;height:100vw!important;transform:rotate(90deg)!important;--solo-safe-top:env(safe-area-inset-right,0px);--solo-safe-right:env(safe-area-inset-bottom,0px);--solo-safe-bottom:env(safe-area-inset-left,0px);--solo-safe-left:env(safe-area-inset-top,0px)}\n    html.android-stable-webgl body.solo-flight #viewport{width:100svh!important;height:100vw!important}\n    body.solo-flight dialog[open]{transform:rotate(90deg);transform-origin:50% 50%}\n  }\n'''
          if old not in s:
              raise SystemExit('portrait rotate block not found')
          s=s.replace(old,'''  /* Native orientation only. Never rotate the simulator with CSS: pointer coordinates\n     and the rendered controls must stay in the same browser coordinate system. */\n''',1)
          old_fn='''function syncSoloPresentationOrientation(){\n  const viewport=$("viewport"),solo=document.body.classList.contains("solo-flight");\n  if(!solo){delete viewport.dataset.soloOrientation;delete viewport.dataset.orientationPolicy;return false;}\n  const cssLandscape=globalThis.matchMedia?.("(orientation: portrait)")?.matches===true;\n  viewport.dataset.orientationPolicy="landscape";\n  viewport.dataset.soloOrientation=cssLandscape?"css-landscape":"native-landscape";\n  return cssLandscape;\n}'''
          new_fn='''function syncSoloPresentationOrientation(){\n  const viewport=$("viewport"),solo=document.body.classList.contains("solo-flight");\n  if(!solo){delete viewport.dataset.soloOrientation;delete viewport.dataset.orientationPolicy;return false;}\n  viewport.dataset.orientationPolicy="native-never-rotate-v1";\n  viewport.dataset.soloOrientation="native";\n  return false;\n}'''
          if old_fn not in s:
              raise SystemExit('orientation function not found')
          s=s.replace(old_fn,new_fn,1)
          old_height='''function applySoloHeightPointer(event){const r=soloHeightPad.getBoundingClientRect(),rotated=$("viewport").dataset.soloOrientation==="css-landscape";const center=rotated?r.left+r.width/2:r.top+r.height/2,span=Math.max(1,(rotated?r.width:r.height)*.40),position=rotated?event.clientX:event.clientY;setSoloHeightAxis((rotated?position-center:center-position)/span);event.preventDefault();}'''
          new_height='''function applySoloHeightPointer(event){const r=soloHeightPad.getBoundingClientRect(),center=r.top+r.height/2,span=Math.max(1,r.height*.40);setSoloHeightAxis((center-event.clientY)/span);event.preventDefault();}'''
          if old_height not in s:
              raise SystemExit('height pointer function not found')
          s=s.replace(old_height,new_height,1)
          p.write_text(s)

          p=Path('sim/control_semantics.mjs')
          s=p.read_text()
          start=s.index('const pointerDrags=new WeakMap();')
          end=s.index('\nexport function applyGameStick',start)
          replacement='''export function normalizedPointer(element,event){\n  const rect=element.getBoundingClientRect();\n  const radius=Math.max(1,Math.min(rect.width,rect.height)*.42);\n  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;\n  return constrainUnit((Number(event.clientX)-cx)/radius,(Number(event.clientY)-cy)/radius);\n}\nexport function endPointerDrag(_element,_pointerId){}\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          Path('tests/mobile_native_touch_contract_test.mjs').write_text('''import assert from "node:assert/strict";\nimport {normalizedPointer} from "../sim/control_semantics.mjs";\n\nconst element={\n  getBoundingClientRect(){return{left:100,top:50,width:200,height:200};},\n};\nconst center=normalizedPointer(element,{type:"pointerdown",pointerId:1,clientX:200,clientY:150});\nassert.ok(Math.abs(center.x)<1e-9&&Math.abs(center.y)<1e-9,"center touch must center stick");\nconst right=normalizedPointer(element,{type:"pointerdown",pointerId:2,clientX:284,clientY:150});\nassert.ok(right.x>.99&&Math.abs(right.y)<.01,"pointerdown must immediately map to touched right edge");\nconst upperLeft=normalizedPointer(element,{type:"pointermove",pointerId:2,clientX:140,clientY:90});\nassert.ok(upperLeft.x<-.49&&upperLeft.y<-.49,"drag must follow absolute finger position");\nconst sim=await import("node:fs").then(fs=>fs.readFileSync("sim/simulator.mjs","utf8"));\nassert.ok(!sim.includes("transform:rotate(90deg)!important"),"simulator must never CSS-rotate viewport");\nassert.ok(sim.includes('orientationPolicy="native-never-rotate-v1"'),"native orientation contract missing");\nassert.ok(sim.includes('soloOrientation="native"'),"native orientation dataset missing");\nconsole.log("Mobile native touch contract passed: display never rotates and sticks map absolute touch coordinates on pointerdown/drag.");\n''')
          PY
          node --check sim/simulator.mjs
          node --check sim/control_semantics.mjs
          node tests/mobile_native_touch_contract_test.mjs
          node tests/control_semantics_test.mjs
          node tests/player_car_touch_contract_test.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/simulator.mjs sim/control_semantics.mjs tests/mobile_native_touch_contract_test.mjs
          git commit -m 'Use native mobile coordinates for all touch controls'
          git push origin HEAD:main
