name: One-shot final WORLD release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-final-world-release.yml"
      - "tools/apply_world_minimap_rigid_fpv.py"
      - "tools/fix_minimap_patcher.py"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply final product transaction
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          # Make the migration tolerant of already-cleaned instrumentation from
          # concurrent product passes. Product behavior remains strictly asserted
          # by permanent architecture + browser gates below.
          patch=Path('tools/apply_world_minimap_rigid_fpv.py')
          s=patch.read_text()
          start=s.find("old = 'delete viewport.dataset.worldPerfMode;delete viewport.dataset.worldPaletteLayers;}'")
          if start<0:start=s.find("old = 'delete viewport.dataset.worldPaletteLayers;'")
          if start>=0:
              end=s.find('s = s.replace(old, new, 1)',start)
              if end<0:raise RuntimeError('minimap deactivation patch end missing')
              end=s.find('\n',end)+1
              block='''marker = 'delete viewport.dataset.worldPaletteLayers;'\nif marker in s:\n    s = s.replace(marker, marker + 'delete viewport.dataset.worldMinimapMode;delete viewport.dataset.worldMinimapBearing;delete viewport.dataset.worldMinimapFeatures;delete viewport.dataset.worldMinimapQueries;delete viewport.dataset.worldMinimapFollow;', 1)\n'''
              s=s[:start]+block+s[end:]
          s=s.replace('Path(".github/workflows/one-shot-apply-world-minimap.yml").unlink()','Path(".github/workflows/one-shot-apply-world-minimap.yml").unlink(missing_ok=True)')
          patch.write_text(s)

          subprocess.run(['python3','tools/apply_world_minimap_rigid_fpv.py'],check=True)

          # Exact 0.1 m nudge expectation: product already uses the fine nudge.
          p=Path('tests/dual_phone_smoke.mjs');s=p.read_text()
          s=s.replace('dataset.targetAglM)-2.2)<.06','dataset.targetAglM)-2.1)<.06')
          p.write_text(s)
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          s=s.replace('50m range, 12m/s shared FC envelope','50m range, validated 5m/s shared FC envelope')
          s=s.replace('50m range, hardware-validated 5m/s FC envelope','50m range, validated 5m/s shared FC envelope')
          p.write_text(s)

          # Runtime release gate: fixed 1 ms simulation must track wall time.
          p=Path('tests/browser_sim_smoke.mjs');s=p.read_text()
          if 'fixed-step simulation is not tracking wall time' not in s:
              anchor='''  await page.click("#camSolo");\n  await page.waitForFunction(()=>document.body.classList.contains("solo-flight"),{timeout:5000});\n  const soloUi=await page.evaluate(()=>({'''
              replacement='''  await page.click("#camSolo");\n  await page.waitForFunction(()=>document.body.classList.contains("solo-flight"),{timeout:5000});\n  const cadenceStart=await page.evaluate(()=>({wall:performance.now(),sim:parseFloat(document.querySelector("#simTime")?.textContent||"0")}));\n  await wait(1200);\n  const cadenceEnd=await page.evaluate(()=>({wall:performance.now(),sim:parseFloat(document.querySelector("#simTime")?.textContent||"0")}));\n  const cadenceRatio=(cadenceEnd.sim-cadenceStart.sim)/Math.max(.001,(cadenceEnd.wall-cadenceStart.wall)/1000);\n  if(!(cadenceRatio>.70&&cadenceRatio<1.30))throw new Error(`fixed-step simulation is not tracking wall time: ${cadenceRatio.toFixed(3)}x`);\n  const soloUi=await page.evaluate(()=>({'''
              if s.count(anchor)!=1:raise RuntimeError('browser cadence gate anchor missing')
              s=s.replace(anchor,replacement,1)
          p.write_text(s)

          # GRID and semantic palette are user-visible requirements, not comments.
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          if 'WORLD semantic palette/legend marker missing' not in s:
              anchor='''if(!simulatorSource.includes("MAX_GAME_CLEARANCE_M")||!simulatorSource.includes("NAV_AGL_RAY_MAX_M = 60")||!simulatorSource.includes("TorusGeometry(.15"))throw new Error("WORLD range/visual acquisition cues missing");\n'''
              extra='''for(const marker of ["#237db0","#4f7b55","#f0c85c","#bdcbd3","WATER","GREEN","ROADS","BUILDINGS"])if(!bootstrapSource.includes(marker))throw new Error(`WORLD semantic palette/legend marker missing: ${marker}`);\n'''
              if s.count(anchor)!=1:raise RuntimeError('palette gate anchor missing')
              s=s.replace(anchor,anchor+extra,1)
          p.write_text(s)

          # Remove all migration scaffolding before architecture validation.
          Path('tools/fix_minimap_patcher.py').unlink(missing_ok=True)
          Path('.github/workflows/one-shot-final-world-release.yml').unlink(missing_ok=True)
          Path('.github/workflows/one-shot-apply-world-minimap.yml').unlink(missing_ok=True)

          for path in ['sim/control_semantics.mjs','sim/controller.mjs','sim/simulator.mjs','sim/real_world_bootstrap.mjs','sim/control_settings.mjs','tests/control_semantics_test.mjs','tests/architecture_invariants.mjs','tests/browser_sim_smoke.mjs','tests/dual_phone_smoke.mjs','tests/real_world_ui_smoke.mjs']:
              subprocess.run(['node','--check',path],check=True)
          subprocess.run(['node','tests/control_semantics_test.mjs'],check=True)
          subprocess.run(['node','tests/architecture_invariants.mjs'],check=True)
          subprocess.run(['g++','-std=c++17','-O2','-Wall','-Wextra','-Wpedantic','-Werror','-Iesp32','tests/state_control_test.cpp','-o','/tmp/state-control-final'],check=True)
          subprocess.run(['/tmp/state-control-final'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          PY
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Complete flight-first WORLD UX and mini map"
          git push origin HEAD:main
