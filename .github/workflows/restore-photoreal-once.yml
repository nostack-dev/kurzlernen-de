name: Restore photoreal 3D world once

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/restore-photoreal-once.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Report photoreal restore start
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/${GH_REPO}/issues/53/comments" -f body="PHOTOREAL START · sha=${GITHUB_SHA} · run=${GITHUB_RUN_ID}" >/dev/null

      - name: Verify Maps Tiles browser key exists
        env:
          GOOGLE_MAP_TILES_BROWSER_KEY: ${{ secrets.GOOGLE_MAP_TILES_BROWSER_KEY }}
        run: test -n "${GOOGLE_MAP_TILES_BROWSER_KEY:-}"

      - name: Restore reviewed photoreal layer without flight changes
        run: |
          set -euxo pipefail
          git fetch origin finalize-flight-photoreal:refs/remotes/origin/finalize-flight-photoreal
          git show origin/finalize-flight-photoreal:sim/photorealistic_3d_tiles.mjs > sim/photorealistic_3d_tiles.mjs

          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f"{path}: expected one match, got {n}: {old[:140]!r}")
              p.write_text(s.replace(old,new,1))

          rw='sim/real_world_bootstrap.mjs'
          replace_one(rw,
          '''const MODE_STORAGE="arondight45WorldModeV2";''',
          '''const MODE_STORAGE="arondight45WorldModeV2";\nconst PHOTOREAL_BUNDLE_URL="./sim/photorealistic_3d_tiles.bundle.mjs";''')
          replace_one(rw,
          '''this.buildingCollisionRevisions=0;this.cameraCollisionResolver=null;''',
          '''this.buildingCollisionRevisions=0;this.cameraCollisionResolver=null;this.photorealistic=null;this.photorealisticPromise=null;this.photorealGeneration=0;this.photorealBuildingVisibility="visible";this.originAltitudeM=null;''')
          replace_one(rw,
          '''  clearBuildingCollisions(){''',
          '''  photorealApiKey(){return String(globalThis.__ARONDIGHT45_GOOGLE_MAP_TILES_API_KEY__||"").trim();}\n  setPhotorealBuildingFallback(photoVisible){\n    const visibility=photoVisible?"none":"visible";if(this.photorealBuildingVisibility===visibility)return;this.photorealBuildingVisibility=visibility;try{if(this.map?.getLayer("arondight45-buildings-3d"))this.map.setLayoutProperty("arondight45-buildings-3d","visibility",visibility);}catch(error){console.warn("WORLD building presentation fallback warning:",error);}\n  }\n  ensurePhotorealistic(){\n    if(this.photorealistic||this.photorealisticPromise||!this.active||!this.threeScene||!this.threeRenderer||!this.threeCamera)return;const key=this.photorealApiKey(),viewport=$("viewport");if(!key){if(viewport)viewport.dataset.worldPhotorealStatus="key-missing";return;}\n    const generation=++this.photorealGeneration;this.photorealisticPromise=import(PHOTOREAL_BUNDLE_URL).then(module=>{if(!this.active||generation!==this.photorealGeneration)return null;const layer=new module.PhotorealisticWorldLayer({scene:this.threeScene,renderer:this.threeRenderer,camera:this.threeCamera,viewport,latitude:this.originLat,longitude:this.originLon,altitudeM:this.originAltitudeM,apiKey:key});if(!layer.start())return null;this.photorealistic=layer;return layer;}).catch(error=>{console.warn("WORLD photorealistic 3D module warning:",error);if(viewport)viewport.dataset.worldPhotorealStatus="module-error";return null;}).finally(()=>{if(generation===this.photorealGeneration)this.photorealisticPromise=null;});\n  }\n  clearBuildingCollisions(){''')
          replace_one(rw,
          '''      const fix=locationFix?.coords?locationFix:await geolocate();this.lastLocation=fix;const {latitude,longitude,accuracy}=fix.coords;''',
          '''      const fix=locationFix?.coords?locationFix:await geolocate();this.lastLocation=fix;const {latitude,longitude,accuracy,altitude}=fix.coords;this.originAltitudeM=Number.isFinite(Number(altitude))?Number(altitude):null;''')
          replace_one(rw,
          '''      if(!this.threeRenderer)throw Error("Flight renderer is not ready");''',
          '''      if(!this.threeRenderer)throw Error("Flight renderer is not ready");this.ensurePhotorealistic();''')
          replace_one(rw,
          '''  deactivate(){\n    this.active=false;this.loading=false;this.lastMapSyncFrameSerial=-1;''',
          '''  deactivate(){\n    this.active=false;this.loading=false;this.photorealGeneration++;this.photorealisticPromise=null;this.photorealistic?.dispose();this.photorealistic=null;this.originAltitudeM=null;this.setPhotorealBuildingFallback(false);this.lastMapSyncFrameSerial=-1;''')
          replace_one(rw,
          '''    this.applyLookCamera(scene,camera);this.syncMapCamera(camera,this.presentationFrameSerial);this.drawMinimap(performance.now());const renderer=this.threeRenderer;''',
          '''    this.applyLookCamera(scene,camera);const frameNow=performance.now();if(!this.photorealistic)this.ensurePhotorealistic();const photoVisible=this.photorealistic?.update(this.perfMode,frameNow)===true;this.setPhotorealBuildingFallback(photoVisible);this.syncMapCamera(camera,this.presentationFrameSerial);this.drawMinimap(frameNow);const renderer=this.threeRenderer;''')

          deploy='.github/workflows/deploy.yml'; p=Path(deploy); d=p.read_text()
          dep_old='''three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1'''
          dep_new='''three@0.185.1 box3d.js@0.1.1 maplibre-gl@5.24.0 3d-tiles-renderer@0.5.0 esbuild@0.25.8 puppeteer-core@24.16.0 mqtt@5.15.2 nostr-tools@2.24.1'''
          if d.count(dep_old)!=1: raise SystemExit('deploy npm dependency line mismatch')
          d=d.replace(dep_old,dep_new,1)

          build_marker='''      - name: Bundle self-contained Pages and verify exact Box3D binding\n        run: |'''
          build_repl='''      - name: Bundle self-contained Pages and verify exact Box3D binding\n        env:\n          GOOGLE_MAP_TILES_BROWSER_KEY: ${{ secrets.GOOGLE_MAP_TILES_BROWSER_KEY }}\n        run: |'''
          if d.count(build_marker)!=1: raise SystemExit('deploy build step marker mismatch')
          d=d.replace(build_marker,build_repl,1)

          esbuild_marker='''          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs\n          ./node_modules/.bin/esbuild sim/controller.mjs'''
          esbuild_repl='''          ./node_modules/.bin/esbuild sim/real_world_bootstrap.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --alias:box3d.js/dist/box3d.inline.mjs=box3d.js/inline --outfile=/tmp/arondight45-simulator.bundle.mjs\n          ./node_modules/.bin/esbuild sim/photorealistic_3d_tiles.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=sim/photorealistic_3d_tiles.bundle.mjs\n          ./node_modules/.bin/esbuild sim/controller.mjs'''
          if d.count(esbuild_marker)!=1: raise SystemExit('deploy esbuild marker mismatch')
          d=d.replace(esbuild_marker,esbuild_repl,1)

          check_marker='''          node --check /tmp/arondight45-simulator.bundle.mjs\n          node --check /tmp/arondight45-controller.bundle.mjs'''
          check_repl='''          node --check /tmp/arondight45-simulator.bundle.mjs\n          node --check sim/photorealistic_3d_tiles.bundle.mjs\n          node --check /tmp/arondight45-controller.bundle.mjs'''
          if d.count(check_marker)!=1: raise SystemExit('deploy bundle check marker mismatch')
          d=d.replace(check_marker,check_repl,1)

          py_marker="""          sha=os.environ['GITHUB_SHA']\n          builds=["""
          py_repl="""          sha=os.environ['GITHUB_SHA']\n          key=os.environ.get('GOOGLE_MAP_TILES_BROWSER_KEY','').strip()\n          assert key, 'GOOGLE_MAP_TILES_BROWSER_KEY secret is empty'\n          key_bootstrap='<script>globalThis.__ARONDIGHT45_GOOGLE_MAP_TILES_API_KEY__='+__import__('json').dumps(key)+'</script>\\n'\n          builds=["""
          if d.count(py_marker)!=1: raise SystemExit('deploy python key marker mismatch')
          d=d.replace(py_marker,py_repl,1)

          html_marker="""              built=html.replace(marker,'<script type=\"module\">\\n'+bundle+'\\n</script>')\n              path.write_text(f'<!-- ARONDIGHT45_BUILD_SHA:{sha} -->\\n'+built)"""
          html_repl="""              built=html.replace(marker,'<script type=\"module\">\\n'+bundle+'\\n</script>')\n              path.write_text(f'<!-- ARONDIGHT45_BUILD_SHA:{sha} -->\\n'+key_bootstrap+built)"""
          if d.count(html_marker)!=1: raise SystemExit('deploy html injection marker mismatch')
          d=d.replace(html_marker,html_repl,1)

          size_marker='''          test -s drone_simulator.html\n          test -s drone_controller.html'''
          size_repl='''          test -s drone_simulator.html\n          test -s sim/photorealistic_3d_tiles.bundle.mjs\n          test "$(wc -c < sim/photorealistic_3d_tiles.bundle.mjs)" -gt 100000\n          grep -q 'GoogleCloudAuthPlugin' sim/photorealistic_3d_tiles.mjs\n          grep -q 'import(PHOTOREAL_BUNDLE_URL)' sim/real_world_bootstrap.mjs\n          test -s drone_controller.html'''
          if d.count(size_marker)!=1: raise SystemExit('deploy size marker mismatch')
          d=d.replace(size_marker,size_repl,1)
          p.write_text(d)
          PY

      - name: Validate photoreal source and pinned bundle
        run: |
          set -euxo pipefail
          node --check sim/real_world_bootstrap.mjs
          node --check sim/photorealistic_3d_tiles.mjs
          BUILD=/tmp/arondight45-photo-check
          rm -rf "$BUILD" && mkdir -p "$BUILD" && cd "$BUILD"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund three@0.185.1 3d-tiles-renderer@0.5.0 esbuild@0.25.8
          ln -s "$BUILD/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          ./node_modules/.bin/esbuild sim/photorealistic_3d_tiles.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/arondight45-photo.bundle.mjs
          node --check /tmp/arondight45-photo.bundle.mjs
          test "$(wc -c < /tmp/arondight45-photo.bundle.mjs)" -gt 100000
          grep -q 'GoogleCloudAuthPlugin' sim/photorealistic_3d_tiles.mjs
          grep -q 'import(PHOTOREAL_BUNDLE_URL)' sim/real_world_bootstrap.mjs
          rm node_modules

      - name: Commit restored photoreal product and remove one-shot workflow
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-photoreal-once.yml
          git add sim/photorealistic_3d_tiles.mjs sim/real_world_bootstrap.mjs .github/workflows/deploy.yml
          git commit -m 'Restore photoreal 3D building textures'
          git push origin HEAD:main

      - name: Report photoreal restore final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/${GH_REPO}/issues/53/comments" -f body="PHOTOREAL FINAL · sha=${GITHUB_SHA} · run=${GITHUB_RUN_ID} · status=${{ job.status }}" >/dev/null
