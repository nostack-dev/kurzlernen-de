name: Add S31 result reporting
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/add_s31_report.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/s31-hil.yml')
          s=p.read_text()
          old='permissions:\n  contents: read\n\njobs:\n'
          new='permissions:\n  contents: read\n  issues: write\n\njobs:\n'
          if s.count(old)!=1:
              raise SystemExit(f'permissions anchor count={s.count(old)}')
          s=s.replace(old,new)
          report='''

  report:
    if: always()
    needs: [host-tests, esp-idf-build]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report S31 final status
        env:
          GH_TOKEN: __GH_TOKEN__
          GH_REPO: __GH_REPO__
          GH_SHA: __GH_SHA__
          GH_RUN_ID: __GH_RUN_ID__
          GH_RUN_NUMBER: __GH_RUN_NUMBER__
          HOST_RESULT: __HOST_RESULT__
          IDF_RESULT: __IDF_RESULT__
        run: |
          set -euo pipefail
          body="S31 FINAL · sha=${GH_SHA} · run=${GH_RUN_ID} · number=${GH_RUN_NUMBER} · host=${HOST_RESULT} · idf=${IDF_RESULT} · https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
'''
          dollar='$'
          replacements={
            '__GH_TOKEN__':dollar+'{{ github.token }}',
            '__GH_REPO__':dollar+'{{ github.repository }}',
            '__GH_SHA__':dollar+'{{ github.sha }}',
            '__GH_RUN_ID__':dollar+'{{ github.run_id }}',
            '__GH_RUN_NUMBER__':dollar+'{{ github.run_number }}',
            '__HOST_RESULT__':dollar+'{{ needs.host-tests.result }}',
            '__IDF_RESULT__':dollar+'{{ needs.esp-idf-build.result }}',
          }
          for a,b in replacements.items(): report=report.replace(a,b)
          if '\n  report:\n' in s:
              raise SystemExit('S31 report job already exists')
          p.write_text(s.rstrip()+report+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add_s31_report.yml
          git add .github/workflows/s31-hil.yml
          git commit -m 'Report complete S31 CI results'
          git push origin HEAD:main
