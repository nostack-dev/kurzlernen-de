name: Add S31 result reporting
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/add_s31_report.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/s31-hil.yml')
          s=p.read_text()
          old='''permissions:\n  contents: read\n\njobs:\n'''
          new='''permissions:\n  contents: read\n  issues: write\n\njobs:\n'''
          if s.count(old)!=1:
              raise SystemExit(f'permissions anchor count={s.count(old)}')
          s=s.replace(old,new)
          report='''\n  report:\n    if: always()\n    needs: [host-tests, esp-idf-build]\n    runs-on: ubuntu-latest\n    permissions:\n      issues: write\n    steps:\n      - name: Report S31 final status\n        env:\n          GH_TOKEN: ${{ github.token }}\n          GH_REPO: ${{ github.repository }}\n          GH_SHA: ${{ github.sha }}\n          GH_RUN_ID: ${{ github.run_id }}\n          GH_RUN_NUMBER: ${{ github.run_number }}\n          HOST_RESULT: ${{ needs.host-tests.result }}\n          IDF_RESULT: ${{ needs.esp-idf-build.result }}\n        run: |\n          set -euo pipefail\n          body="S31 FINAL · sha=${GH_SHA} · run=${GH_RUN_ID} · number=${GH_RUN_NUMBER} · host=${HOST_RESULT} · idf=${IDF_RESULT} · https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}"\n          payload="$(jq -cn --arg body "$body" '{body:$body}')"\n          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null\n'''
          if '\n  report:\n' in s:
              raise SystemExit('S31 report job already exists')
          p.write_text(s.rstrip()+report+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add_s31_report.yml
          git add .github/workflows/s31-hil.yml
          git commit -m 'Report complete S31 CI results'
          git push origin HEAD:main
