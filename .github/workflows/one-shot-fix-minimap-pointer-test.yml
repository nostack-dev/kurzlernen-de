name: Fix minimap pointer E2E
on:
  workflow_dispatch:
  push:
    branches: ["fix/world-fpv-eye-altitude"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/world-fpv-eye-altitude
          fetch-depth: 0
      - run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          old='''    const before=await page.evaluate(()=>Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0));\n    const box=await minimapBox();await page.mouse.move(box.x+box.w*.45,box.y+box.h*.58);await page.mouse.down();await page.mouse.move(box.x+box.w*.72,box.y+box.h*.46,{steps:4});await page.mouse.up();\n    await page.waitForFunction(start=>Math.abs(Number(document.querySelector("#viewport")?.dataset.worldLookYaw||0)-start)>5,{timeout:3000},before);\n'''
          new='''    const look=await page.evaluate(()=>{const hud=document.querySelector("#worldLookHud"),v=document.querySelector("#viewport"),r=hud.getBoundingClientRect(),sx=r.left+r.width*.45,sy=r.top+r.height*.58,send=(type,x,y)=>hud.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:31,pointerType:"touch",clientX:x,clientY:y,button:0})),before=Number(v?.dataset.worldLookYaw||0);send("pointerdown",sx,sy);send("pointermove",r.left+r.width*.72,r.top+r.height*.46);send("pointerup",r.left+r.width*.72,r.top+r.height*.46);return{before,after:Number(v?.dataset.worldLookYaw||0)};});\n    if(Math.abs(look.after-look.before)<=5)throw new Error(`${expected} minimap look gesture did not move camera orientation: ${JSON.stringify(look)}`);\n'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/one-shot-fix-minimap-pointer-test.yml
          git config user.name 'Arondight45 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Exercise minimap with direct touch pointer sequence'
          git push origin HEAD:fix/world-fpv-eye-altitude
