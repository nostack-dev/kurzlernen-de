          requireText("sim/control_settings.mjs","openfreemap-osm-3d");
          requireText("sim/control_settings.mjs","No account, API key, billing setup, backend or proxy is required.");

          '''.replace("\n          ","\n").lstrip()
          s=s[:start]+block+s[end:]
          s=s.replace('requireText("sim/control_semantics.mjs","defaultHoverAgl:2");','requireText("sim/control_semantics.mjs","defaultHoverAgl:1.2");')
          write(p,s)

          # Functional semantics test: new defaults, same full-stick authority and physical mapping.
          p="tests/control_semantics_test.mjs";s=read(p)
          s=must_replace(s,'assert.equal(DEFAULT_PHONE_SETTINGS.leftFineness,1);','assert.equal(DEFAULT_PHONE_SETTINGS.leftFineness,10);',"test left default")
          s=must_replace(s,'assert.equal(DEFAULT_PHONE_SETTINGS.rightFineness,1);','assert.equal(DEFAULT_PHONE_SETTINGS.rightFineness,10);',"test right default")
          s=must_replace(s,'assert.equal(DEFAULT_PHONE_SETTINGS.invertRightVertical,false);','assert.equal(DEFAULT_PHONE_SETTINGS.invertRightVertical,true);',"test vertical invert default")
          s=must_replace(s,'assert.equal(DEFAULT_PHONE_SETTINGS.defaultHoverAgl,2);','assert.equal(DEFAULT_PHONE_SETTINGS.defaultHoverAgl,1.2);',"test hover default")
          anchor='assert.equal(DEFAULT_PHONE_SETTINGS.lockRightHorizontal,false);\n'
