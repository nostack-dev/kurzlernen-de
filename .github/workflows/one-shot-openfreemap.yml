          s=s.replace('near(c.pitch,phoneAxis(-.2,DEFAULT_PHONE_SETTINGS.rightFineness));','near(c.pitch,phoneAxis(.2,DEFAULT_PHONE_SETTINGS.rightFineness));')
          s=s.replace('near(c.roll,phoneAxis(-.3,invertX.rightFineness));near(c.pitch,phoneAxis(-.2,invertX.rightFineness));','near(c.roll,phoneAxis(-.3,invertX.rightFineness));near(c.pitch,phoneAxis(.2,invertX.rightFineness));')
          s=s.replace('Phone controls passed: direct production defaults,','Phone controls passed: requested 10/10 production defaults,')
          write(p,s)

          # Standalone browser gate: assert all screenshot defaults and account for default right-Y inversion.
          p="tests/browser_sim_smoke.mjs";s=read(p)
          s=s.replace('fpv.tilt!=="30"','fpv.tilt!=="-15"')
          s=s.replace('Math.abs(soloUi.clearanceValue-2)>.01','Math.abs(soloUi.clearanceValue-1.2)>.01')
          old='''    rightLockLabel:document.querySelector('.phone-settings-dialog [data-lock-horizontal]')?.parentElement?.textContent||"",\n    v1:localStorage.getItem("arondight45PhoneControlSettingsV1"),'''
          new='''    rightLockLabel:document.querySelector('.phone-settings-dialog [data-lock-horizontal]')?.parentElement?.textContent||"",\n    hover:document.querySelector('.phone-settings-dialog [data-slider="hover"]')?.value,\n    cameraTilt:document.querySelector('.phone-settings-dialog [data-camera-slider="tilt"]')?.value,\n    cameraFov:document.querySelector('.phone-settings-dialog [data-camera-slider="fov"]')?.value,\n    cameraThird:document.querySelector('.phone-settings-dialog [data-camera-slider="third"]')?.value,\n    v1:localStorage.getItem("arondight45PhoneControlSettingsV1"),'''
