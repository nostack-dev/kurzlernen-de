name: One-shot gravity fusion fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-fusion-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gyro-dominant gravity correction
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('esp32/Arondight45_DroneFC_Core.hpp')
          s=p.read_text()
          old='const float tau = 1.0f / (2.0f * kPi * 1.4f);'
          new='const float tau = 1.0f / (2.0f * kPi * 0.20f);'
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit product fix
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add esp32/Arondight45_DroneFC_Core.hpp
          git commit -m "Use gyro-dominant gravity correction in attitude estimator"
          git push origin HEAD:main
