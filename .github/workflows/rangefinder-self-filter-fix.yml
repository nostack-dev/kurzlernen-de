name: Apply physical rangefinder self-filter fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rangefinder-self-filter-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter airframe out of down rangefinder
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/simulator.mjs')
          s=p.read_text()
          old='''const TERRAIN_SIZE = 600;\nconst TERRAIN_HALF = TERRAIN_SIZE / 2;\n'''
          new='''const TERRAIN_SIZE = 600;\nconst TERRAIN_HALF = TERRAIN_SIZE / 2;\nconst COLLISION_TERRAIN = 1n;\nconst COLLISION_AIRFRAME = 2n;\nconst QUERY_RANGEFINDER = 4n;\n'''
          assert s.count(old)==1,('constants marker',s.count(old))
          s=s.replace(old,new,1)
          old='''const groundDef=b3.b3DefaultBodyDef();groundDef.position=[0,0,-.05];const ground=b3.b3CreateBody(this.world,groundDef),groundShape=b3.b3DefaultShapeDef();groundShape.baseMaterial.friction=.75;groundShape.baseMaterial.restitution=.03;b3.b3CreateBoxShape(ground,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);\n'''
          new='''const groundDef=b3.b3DefaultBodyDef();groundDef.position=[0,0,-.05];const ground=b3.b3CreateBody(this.world,groundDef),groundShape=b3.b3DefaultShapeDef();groundShape.baseMaterial.friction=.75;groundShape.baseMaterial.restitution=.03;groundShape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER,groupIndex:0};b3.b3CreateBoxShape(ground,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);\n'''
          assert s.count(old)==1,('ground marker',s.count(old))
          s=s.replace(old,new,1)
          old='''const shapeDef=b3.b3DefaultShapeDef();shapeDef.density=100;shapeDef.baseMaterial.friction=.65;shapeDef.baseMaterial.restitution=.08;b3.b3CreateBoxShape(this.body,shapeDef,.055,.045,.022);\n'''
          new='''const shapeDef=b3.b3DefaultShapeDef();shapeDef.density=100;shapeDef.baseMaterial.friction=.65;shapeDef.baseMaterial.restitution=.08;shapeDef.filter={categoryBits:COLLISION_AIRFRAME,maskBits:COLLISION_TERRAIN,groupIndex:0};b3.b3CreateBoxShape(this.body,shapeDef,.055,.045,.022);\n'''
          assert s.count(old)==1,('airframe marker',s.count(old))
          s=s.replace(old,new,1)
          old='''const filter=b3.b3DefaultQueryFilter(),hit=b3.b3World_CastRayClosest(this.world,origin,scale(down,range),filter),fraction=Number(hit?.fraction);\n'''
          new='''const filter=b3.b3DefaultQueryFilter();filter.categoryBits=QUERY_RANGEFINDER;filter.maskBits=COLLISION_TERRAIN;const hit=b3.b3World_CastRayClosest(this.world,origin,scale(down,range),filter),fraction=Number(hit?.fraction);\n'''
          assert s.count(old)==1,('ray marker',s.count(old))
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/architecture_invariants.mjs')
          s=p.read_text()
          marker='''requireText("sim/simulator.mjs","b3World_CastRayClosest");\n'''
          extra='''requireText("sim/simulator.mjs","b3World_CastRayClosest");\nrequireText("sim/simulator.mjs","COLLISION_TERRAIN = 1n");\nrequireText("sim/simulator.mjs","COLLISION_AIRFRAME = 2n");\nrequireText("sim/simulator.mjs","QUERY_RANGEFINDER = 4n");\nrequireText("sim/simulator.mjs","filter.maskBits=COLLISION_TERRAIN",\n            "down rangefinder must query terrain only, never the airframe");\n'''
          assert s.count(marker)==1
          p.write_text(s.replace(marker,extra,1))
          PY
          node --check sim/simulator.mjs
          node tests/architecture_invariants.mjs
          git diff --check
      - name: Commit product fix
        run: |
          set -euxo pipefail
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add sim/simulator.mjs tests/architecture_invariants.mjs
          git commit -m "Exclude airframe from ground rangefinder"
          git pull --rebase origin main
          git push origin HEAD:main
