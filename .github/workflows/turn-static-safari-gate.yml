name: Static TURN Safari validation gate

on:
  push:
    branches:
      - fix/turn-static-safari

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/turn-static-safari

      - name: Guard
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[turn-safari-fixed]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Patch network transport
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lan=Path('sim/lan_vs.mjs')
          s=lan.read_text()
          old='''const STUN_ICE_SERVERS=[\n  {urls:["stun:stun.cloudflare.com:3478","stun:stun.cloudflare.com:53"]},\n  {urls:"stun:stun.l.google.com:19302"}\n];'''
          new=old+'''\nconst TURN_CONFIG=[\n  {urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}\n];'''
          assert old in s and 'const TURN_CONFIG=' not in s
          s=s.replace(old,new,1)
          old_join='room=joinRoom({appId:APP_ID,relayConfig:{redundancy:this.relayRedundancy}},this.roomId,{onJoinError});'
          new_join='room=joinRoom({appId:APP_ID,relayConfig:{redundancy:this.relayRedundancy},turnConfig:TURN_CONFIG},this.roomId,{onJoinError});'
          assert old_join in s
          s=s.replace(old_join,new_join,1)
          lan.write_text(s)

          relay=Path('sim/mqtt_data_relay.mjs')
          s=relay.read_text()
          assert '"wss://public:public@public.cloud.shiftr.io"' in s
          s=s.replace('"wss://public:public@public.cloud.shiftr.io"','"wss://public.cloud.shiftr.io"',1)
          old_connect='const client=mqtt.connect(url,{clientId:`a45relay-${randomId().slice(0,20)}-${index}`,clean:true,reconnectPeriod:1000,connectTimeout:5000,keepalive:20,protocolVersion:4,resubscribe:true});'
          new_connect='const auth=url==="wss://public.cloud.shiftr.io"?{username:"public",password:"public"}:{};\n    const client=mqtt.connect(url,{...auth,forceNativeWebSocket:true,clientId:`a45-${randomId().slice(0,18)}`,clean:true,reconnectPeriod:1000,connectTimeout:8000,keepalive:20,protocolVersion:4,resubscribe:true});'
          assert old_connect in s
          s=s.replace(old_connect,new_connect,1)
          relay.write_text(s)
          PY
          node --check sim/lan_vs.mjs
          node --check sim/mqtt_data_relay.mjs
          grep -Fq 'turnConfig:TURN_CONFIG' sim/lan_vs.mjs
          grep -Fq 'forceNativeWebSocket:true' sim/mqtt_data_relay.mjs

      - name: Real browser relay probes
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          TMP=/tmp/a45-relay-probe
          rm -rf "$TMP"
          mkdir -p "$TMP"
          cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0 mqtt@5.15.2 esbuild@0.25.8
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          cat > turn_probe.mjs <<'EOF'
          import puppeteer from 'puppeteer-core'
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']})
          const page=await browser.newPage()
          try {
            const result=await page.evaluate(async()=>{
              const pc=new RTCPeerConnection({iceTransportPolicy:'relay',iceServers:[{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]})
              pc.createDataChannel('probe')
              const candidates=[]
              let finish
              const done=new Promise(resolve=>finish=resolve)
              pc.onicecandidate=e=>{if(e.candidate)candidates.push({type:e.candidate.type||'',candidate:e.candidate.candidate});else finish()}
              await pc.setLocalDescription(await pc.createOffer())
              await Promise.race([done,new Promise(resolve=>setTimeout(resolve,15000))])
              pc.close()
              return candidates
            })
            if(!result.some(c=>c.type==='relay'||/ typ relay /.test(` ${c.candidate} `)))throw new Error(`no TURN relay candidate: ${JSON.stringify(result)}`)
            console.log('TURN relay candidate OK',result)
          } finally { await browser.close() }
          EOF
          CHROME_BIN="$CHROME_BIN" node turn_probe.mjs

          cat > mqtt_probe.mjs <<'EOF'
          import puppeteer from 'puppeteer-core'
          import {build} from 'esbuild'
          import {writeFile} from 'node:fs/promises'
          const dir='/tmp/a45-mqtt-page'
          await import('node:fs/promises').then(fs=>fs.mkdir(dir,{recursive:true}))
          await writeFile(`${dir}/entry.js`,`import mqtt from 'mqtt'; globalThis.probe=()=>new Promise((resolve,reject)=>{const c=mqtt.connect('wss://public.cloud.shiftr.io',{username:'public',password:'public',forceNativeWebSocket:true,clientId:'a45probe-'+Math.random().toString(36).slice(2,12),clean:true,connectTimeout:10000,reconnectPeriod:0,protocolVersion:4}); const t=setTimeout(()=>{c.end(true);reject(Error('timeout'))},12000); c.on('connect',()=>{clearTimeout(t);c.end(true);resolve(true)}); c.on('error',e=>{clearTimeout(t);c.end(true);reject(e)})})`)
          await build({entryPoints:[`${dir}/entry.js`],bundle:true,format:'iife',platform:'browser',outfile:`${dir}/bundle.js`})
          await writeFile(`${dir}/index.html`,'<script src="bundle.js"></script>')
          const {spawn}=await import('node:child_process')
          const srv=spawn('python3',['-m','http.server','4188','--bind','127.0.0.1'],{cwd:dir,stdio:'ignore'})
          await new Promise(r=>setTimeout(r,700))
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']})
          try {const p=await browser.newPage();await p.goto('http://127.0.0.1:4188');await p.evaluate(()=>globalThis.probe());console.log('WSS 443 MQTT OK')} finally {await browser.close();srv.kill()}
          EOF
          CHROME_BIN="$CHROME_BIN" node mqtt_probe.mjs

      - name: Commit validated transport fix
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/lan_vs.mjs sim/mqtt_data_relay.mjs
          git commit -m 'Add TURN and Safari-safe broker transport [turn-safari-fixed]'
          git push origin HEAD:fix/turn-static-safari
