name: Repair gameplay physics once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-gameplay-physics-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch real player car physics
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---- WorldRigidBodyPhysics: add an on-demand four-wheel Box3D rig for the LOCAL player car only.
          p=Path('sim/world_rigid_body_physics.mjs'); s=p.read_text()
          old='setTarget(id,{position,speedMps=0,signedSpeedMps=null,response=3.2,maxAccelerationMps2,yaw=null,steer=null,maxSteerAngleRad=null}={}){const record=this.records.get(String(id||""));if(!record||!finiteVector(position))return false;record.target={position:[...position],speedMps:Math.max(0,Number(speedMps)||0),signedSpeedMps:Number.isFinite(signedSpeedMps)?Number(signedSpeedMps):null,response:clamp(response,.2,10),maxAccelerationMps2:clamp(maxAccelerationMps2??(record.drone?13:6),.5,30),yaw:Number.isFinite(yaw)?Number(yaw):null,steer:Number.isFinite(steer)?clamp(steer,-1,1):null,maxSteerAngleRad:Number.isFinite(maxSteerAngleRad)?clamp(maxSteerAngleRad,.15,.8):null};return true;}'
          new='setTarget(id,{position,speedMps=0,signedSpeedMps=null,response=3.2,maxAccelerationMps2,yaw=null,steer=null,maxSteerAngleRad=null,brake=false}={}){const record=this.records.get(String(id||""));if(!record||!finiteVector(position))return false;record.target={position:[...position],speedMps:Math.max(0,Number(speedMps)||0),signedSpeedMps:Number.isFinite(signedSpeedMps)?Number(signedSpeedMps):null,response:clamp(response,.2,10),maxAccelerationMps2:clamp(maxAccelerationMps2??(record.drone?13:6),.5,30),yaw:Number.isFinite(yaw)?Number(yaw):null,steer:Number.isFinite(steer)?clamp(steer,-1,1):null,maxSteerAngleRad:Number.isFinite(maxSteerAngleRad)?clamp(maxSteerAngleRad,.15,.8):null,brake:Boolean(brake)};return true;}'
          assert old in s
          s=s.replace(old,new,1)

          marker='  clearTarget(id){const record=this.records.get(String(id||""));if(!record)return false;record.target=null;return true;}\n'
          assert marker in s
          methods=r'''  vehicleRigSupported(){const b3=this.b3;return ["b3DefaultWheelJointDef","b3CreateWheelJoint","b3WheelJoint_SetSpinMotorSpeed","b3WheelJoint_SetMaxSpinTorque","b3WheelJoint_SetTargetSteeringAngle","b3WheelJoint_SetMaxSteeringTorque","b3CreateCapsuleShape","b3Body_AllowFastRotation"].every(name=>typeof b3?.[name]==="function");}
  enableVehicleRig(id,{wheelRadius=.32,wheelHalfWidth=.095,wheelMassKg=24,suspensionHertz=5.2,suspensionDamping=.82}={}){
    const record=this.records.get(String(id||""));if(!record||record.drone)return false;if(record.vehicleRig)return true;if(!this.vehicleRigSupported())return false;const b3=this.b3,position=b3.b3Body_GetPosition([0,0,0],record.body),rotation=b3.b3Body_GetRotation([0,0,0,1],record.body),yaw=quaternionYaw(rotation),radius=clamp(wheelRadius,.24,.45),halfWidth=clamp(wheelHalfWidth,.055,.16),mass=Math.max(8,Number(wheelMassKg)||24),front=Math.max(.72,record.halfExtents[0]*.67),side=Math.max(.48,record.halfExtents[1]*1.02),mountZ=-record.halfExtents[2]+radius*.92,c=Math.cos(yaw),sn=Math.sin(yaw),frameQ={v:{x:-.5,y:-.5,z:-.5},s:.5},wheels=[];
    // Give the suspension a few centimetres of working clearance instead of resting the chassis box on the floor.
    const lifted=[position[0],position[1],position[2]+.055];b3.b3Body_SetTransform(record.body,lifted,rotation);b3.b3Body_SetAwake?.(record.body,true);
    const mounts=[{x:front,y:-side,front:true},{x:front,y:side,front:true},{x:-front,y:-side,front:false},{x:-front,y:side,front:false}];
    try{for(const mount of mounts){const wx=lifted[0]+c*mount.x-sn*mount.y,wy=lifted[1]+sn*mount.x+c*mount.y,wz=lifted[2]+mountZ,bodyDef=b3.b3DefaultBodyDef();bodyDef.type=b3.b3BodyType.b3_dynamicBody;bodyDef.position=[wx,wy,wz];bodyDef.rotation=[...rotation];bodyDef.linearDamping=.04;bodyDef.angularDamping=.025;bodyDef.gravityScale=1;bodyDef.enableSleep=true;bodyDef.allowFastRotation=true;const wheelBody=b3.b3CreateBody(this.world,bodyDef);b3.b3Body_AllowFastRotation(wheelBody,true);const shapeDef=b3.b3DefaultShapeDef(),cylinderLength=halfWidth*2,volume=Math.PI*radius*radius*cylinderLength+4/3*Math.PI*radius*radius*radius;shapeDef.density=mass/Math.max(.01,volume);shapeDef.baseMaterial.friction=1.25;shapeDef.baseMaterial.restitution=.015;shapeDef.enableContactEvents=false;shapeDef.enableHitEvents=false;shapeDef.filter={categoryBits:WORLD_PHYSICS_CATEGORIES.vehicle,maskBits:WORLD_PHYSICS_CATEGORIES.terrain|ALL_DYNAMIC,groupIndex:0};b3.b3CreateCapsuleShape(wheelBody,shapeDef,{center1:{x:0,y:-halfWidth,z:0},center2:{x:0,y:halfWidth,z:0},radius});const def=b3.b3DefaultWheelJointDef();def.base.bodyIdA=record.body;def.base.bodyIdB=wheelBody;def.base.localFrameA={p:{x:mount.x,y:mount.y,z:mountZ},q:frameQ};def.base.localFrameB={p:{x:0,y:0,z:0},q:frameQ};def.base.collideConnected=false;def.enableSuspensionSpring=true;def.suspensionHertz=clamp(suspensionHertz,2,10);def.suspensionDampingRatio=clamp(suspensionDamping,.2,1.5);def.enableSuspensionLimit=true;def.lowerSuspensionLimit=-.16;def.upperSuspensionLimit=.13;def.enableSpinMotor=true;def.maxSpinTorque=520;def.spinSpeed=0;def.enableSteering=mount.front;def.steeringHertz=8;def.steeringDampingRatio=.9;def.targetSteeringAngle=0;def.maxSteeringTorque=850;const joint=b3.b3CreateWheelJoint(this.world,def);wheels.push({body:wheelBody,joint,front:mount.front,mount});}
      record.vehicleRig={kind:"box3d-wheel-joint-4x-v1",wheels,radius,halfWidth,front,side,mountZ,lastSteer:0,lastMotorSpeed:0};b3.b3Body_SetAwake?.(record.body,true);return true;
    }catch(error){for(const wheel of wheels)if(wheel.body&&b3.b3Body_IsValid(wheel.body))b3.b3DestroyBody(wheel.body);record.vehicleRig=null;return false;}
  }
  disableVehicleRig(id){const record=this.records.get(String(id||""));if(!record?.vehicleRig)return false;for(const wheel of record.vehicleRig.wheels||[])if(wheel.body&&this.b3.b3Body_IsValid(wheel.body))this.b3.b3DestroyBody(wheel.body);record.vehicleRig=null;this.b3.b3Body_SetAwake?.(record.body,true);return true;}
  updateVehicleRig(record){const rig=record.vehicleRig,target=record.target,b3=this.b3;if(!rig||!target)return false;const signed=Number.isFinite(target.signedSpeedMps)?target.signedSpeedMps:target.speedMps,steer=Number.isFinite(target.steer)?clamp(target.steer,-1,1):0,steerAngle=VEHICLE_STEER_SIGN*steer*(target.maxSteerAngleRad??.5585053606381855),motorSpeed=target.brake?0:signed/Math.max(.05,rig.radius),motorTorque=target.brake?1700:520;for(const wheel of rig.wheels){b3.b3WheelJoint_SetSpinMotorSpeed(wheel.joint,motorSpeed);b3.b3WheelJoint_SetMaxSpinTorque(wheel.joint,motorTorque);if(wheel.front){b3.b3WheelJoint_SetTargetSteeringAngle(wheel.joint,steerAngle);b3.b3WheelJoint_SetMaxSteeringTorque(wheel.joint,950);}}rig.lastSteer=steerAngle;rig.lastMotorSpeed=motorSpeed;b3.b3Body_SetAwake?.(record.body,true);return true;}
'''
          s=s.replace(marker,marker+methods,1)

          # ensure a chassis removal cannot orphan wheel bodies
          old='  removeBody(id){const key=String(id||""),record=this.records.get(key);if(!record)return false;this.records.delete(key);this.shapeRecords.delete(shapeKey(record.shape));if(record.body&&this.b3.b3Body_IsValid(record.body))this.b3.b3DestroyBody(record.body);return true;}'
          new='  removeBody(id){const key=String(id||""),record=this.records.get(key);if(!record)return false;if(record.vehicleRig)this.disableVehicleRig(key);this.records.delete(key);this.shapeRecords.delete(shapeKey(record.shape));if(record.body&&this.b3.b3Body_IsValid(record.body))this.b3.b3DestroyBody(record.body);return true;}'
          assert old in s
          s=s.replace(old,new,1)

          # expose rig state in authoritative pose
          old='return{position:[...position],rotation:[...rotation],velocity:[...velocity],angularVelocity:[...angularVelocity],yaw:quaternionYaw(rotation),lateralSlipMps:record.lateralSlipMps||0};}'
          new='return{position:[...position],rotation:[...rotation],velocity:[...velocity],angularVelocity:[...angularVelocity],yaw:quaternionYaw(rotation),lateralSlipMps:record.lateralSlipMps||0,vehicleRig:record.vehicleRig?.kind||"single-chassis",vehicleWheelCount:record.vehicleRig?.wheels?.length||0,vehicleSteerAngleRad:record.vehicleRig?.lastSteer||0,vehicleWheelMotorRadS:record.vehicleRig?.lastMotorSpeed||0};}'
          assert old in s
          s=s.replace(old,new,1)

          # wheel-rig path: wheel motors/steering own longitudinal/lateral vehicle dynamics; no synthetic chassis yaw torque/side-force.
          start=s.index('  controlBody(record,dt){')
          end=s.index('  step(dt=1/60',start)
          old_control=s[start:end]
          new_control=r'''  controlBody(record,dt){
    const b3=this.b3,body=record.body,sleeping=!record.drone&&typeof b3.b3Body_IsAwake==="function"&&!b3.b3Body_IsAwake(body);if(sleeping&&(record.target?.speedMps||0)<=0&&length3(record.pendingImpulse)<=.0001){record.preVelocity[0]=record.preVelocity[1]=record.preVelocity[2]=0;return;}const position=b3.b3Body_GetPosition([0,0,0],body),velocity=b3.b3Body_GetLinearVelocity([0,0,0],body),angular=b3.b3Body_GetAngularVelocity([0,0,0],body);record.preVelocity=[...velocity];
    const wheelDriven=Boolean(record.vehicleRig&&record.target&&Number.isFinite(record.target.steer));if(wheelDriven){this.updateVehicleRig(record);record.lateralSlipMps=0;}else if(record.target){const offset=record.target.position.map((value,index)=>value-position[index]),horizontal=Math.hypot(offset[0],offset[1]),distance=record.drone?length3(offset):horizontal;if(distance>.03){const rotation=b3.b3Body_GetRotation([0,0,0,1],body),currentYaw=quaternionYaw(rotation),vehicleSteer=!record.drone&&Number.isFinite(record.target.steer)?record.target.steer:null,driveSpeed=vehicleSteer!==null&&Number.isFinite(record.target.signedSpeedMps)?record.target.signedSpeedMps:record.target.speedMps,targetYaw=vehicleSteer!==null?currentYaw:(record.target.yaw??Math.atan2(offset[1],offset[0])),vertical=record.drone?offset[2]/Math.max(.01,distance):0,horizontalScale=record.drone?Math.sqrt(Math.max(0,1-vertical*vertical)):1,desired=[Math.cos(targetYaw)*driveSpeed*horizontalScale,Math.sin(targetYaw)*driveSpeed*horizontalScale,vertical*record.target.speedMps],gain=record.target.response,maxForce=record.massKg*record.target.maxAccelerationMps2,force=limitedVector([(desired[0]-velocity[0])*record.massKg*gain,(desired[1]-velocity[1])*record.massKg*gain,record.drone?(desired[2]-velocity[2])*record.massKg*gain:0],maxForce);b3.b3Body_ApplyForceToCenter(body,force,true);const yawError=wrap(targetYaw-currentYaw);let torqueZ=clamp((yawError*7-angular[2]*2.8)*record.massKg,-record.massKg*12,record.massKg*12);if(vehicleSteer!==null){const wheelbase=Math.max(1.2,record.halfExtents[0]*1.55),steerAngle=VEHICLE_STEER_SIGN*vehicleSteer*(record.target.maxSteerAngleRad??.5585053606381855),effectiveDriveSpeed=Math.abs(driveSpeed)>.08?driveSpeed:Math.max(-2,Math.min(2,velocity[0]*Math.cos(currentYaw)+velocity[1]*Math.sin(currentYaw))),desiredYawRate=effectiveDriveSpeed/wheelbase*Math.tan(steerAngle),yawRateError=desiredYawRate-angular[2];torqueZ=clamp((yawRateError*13.5-angular[2]*.45)*record.massKg,-record.massKg*22,record.massKg*22);}if(record.drone){const[qx,qy,qz,qw]=rotation,upX=2*(qx*qz+qw*qy),upY=2*(qy*qz-qw*qx),torqueX=clamp((upY*10-angular[0]*3.4)*record.massKg,-record.massKg*12,record.massKg*12),torqueY=clamp((-upX*10-angular[1]*3.4)*record.massKg,-record.massKg*12,record.massKg*12);b3.b3Body_ApplyTorque(body,[torqueX,torqueY,torqueZ],true);}else{const rightX=-Math.sin(currentYaw),rightY=Math.cos(currentYaw),lateralSpeed=velocity[0]*rightX+velocity[1]*rightY,speed=Math.hypot(velocity[0],velocity[1]),maxGripAccel=clamp(7.2+speed*.20,7.2,11.5),lateralAccel=clamp(-lateralSpeed*9.5,-maxGripAccel,maxGripAccel);record.lateralSlipMps=lateralSpeed;b3.b3Body_ApplyForceToCenter(body,[rightX*record.massKg*lateralAccel,rightY*record.massKg*lateralAccel,0],true);b3.b3Body_ApplyTorque(body,[0,0,torqueZ],true);}}}
    if(length3(record.pendingImpulse)>.0001){const force=record.pendingImpulse.map(value=>value/Math.max(.001,dt));if(record.impulsePoint)b3.b3Body_ApplyForce(body,force,record.impulsePoint,true);else b3.b3Body_ApplyForceToCenter(body,force,true);record.pendingImpulse=[0,0,0];record.impulsePoint=null;}
  }
'''
          assert 'desiredYawRate' in old_control
          s=s[:start]+new_control+s[end:]
          p.write_text(s)

          # ---- Runtime wrapper: explicit local-player rig lease API.
          p=Path('sim/world_rigid_body_runtime.mjs'); s=p.read_text()
          old='function applyImpulse(id,impulse,options){return ensureEngine()?.applyImpulse(String(id||""),impulse,options)??false;}\nfunction pose(id){return ensureEngine()?.pose(String(id||""))||null;}'
          new='function applyImpulse(id,impulse,options){return ensureEngine()?.applyImpulse(String(id||""),impulse,options)??false;}\nfunction enableVehicleRig(id,options={}){return ensureEngine()?.enableVehicleRig(String(id||""),options)??false;}\nfunction disableVehicleRig(id){return ensureEngine()?.disableVehicleRig(String(id||""))??false;}\nfunction pose(id){return ensureEngine()?.pose(String(id||""))||null;}'
          assert old in s
          s=s.replace(old,new,1)
          old='Object.freeze({upsertBody,setTarget,clearTarget,setPose,setGravityScale,removeBody,applyImpulse,pose,targetOwner,'
          new='Object.freeze({upsertBody,setTarget,clearTarget,setPose,setGravityScale,removeBody,applyImpulse,enableVehicleRig,disableVehicleRig,pose,targetOwner,'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # ---- Player car: enable the four-wheel rig on entry, disable when returning to ambient AI.
          p=Path('sim/player_car_mode.mjs'); s=p.read_text()
          old='clearFootKeys();resetPads();suppressFootGamepad(true);setDrivingUi(true);active=true;'
          new='clearFootKeys();resetPads();const wheelRig=physics()?.enableVehicleRig?.(vehicle.id,{wheelRadius:.32,wheelHalfWidth:.095,wheelMassKg:24,suspensionHertz:5.2,suspensionDamping:.82});suppressFootGamepad(true);setDrivingUi(true);active=true;const rigView=viewport();if(rigView){rigView.dataset.vehiclePhysicsRig=wheelRig?"box3d-wheel-joint-4x-v1":"box3d-wheel-joint-unavailable";rigView.dataset.vehiclePhysicsWheelCount=wheelRig?"4":"0";}'
          assert old in s
          s=s.replace(old,new,1)
          old='physics()?.clearTarget?.(id,{owner:DRIVE_OWNER});active=false;'
          new='physics()?.clearTarget?.(id,{owner:DRIVE_OWNER});physics()?.disableVehicleRig?.(id);active=false;'
          assert old in s
          s=s.replace(old,new,1)
          old='maxAccelerationMps2:input.brake?18:11.5,owner:DRIVE_OWNER'
          new='maxAccelerationMps2:input.brake?18:11.5,brake:input.brake,owner:DRIVE_OWNER'
          assert old in s
          s=s.replace(old,new,1)
          old='view.dataset.vehicleDriveSteeringPhysics="box3d-bicycle-yaw-rate-v1";'
          new='view.dataset.vehicleDriveSteeringPhysics=pose.vehicleRig==="box3d-wheel-joint-4x-v1"?"box3d-wheel-joint-suspension+spin+steering-v1":"box3d-fallback-yaw-rate-v1";view.dataset.vehiclePhysicsRig=pose.vehicleRig||"single-chassis";view.dataset.vehiclePhysicsWheelCount=String(pose.vehicleWheelCount||0);'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # ---- Footstep source that ignored vehicle mode: hard gate it.
          p=Path('sim/player_vehicle_runtime_v2.mjs'); s=p.read_text()
          needle='function updateHumanVelocity(now=performance.now()){'
          assert needle in s
          s=s.replace(needle,'function updateHumanVelocity(now=performance.now()){const driving=Boolean(globalThis.__arondightVehicleDrive?.active);',1)
          s=s.replace('if(currentMode()==="foot"&&dt>.001&&dt<.5)','if(!driving&&currentMode()==="foot"&&dt>.001&&dt<.5)',1)
          s=s.replace('if(currentMode()==="foot"){const speed=','if(!driving&&currentMode()==="foot"){const speed=',1)
          p.write_text(s)

          # ---- Physics regression: player rig must really be four wheel joints, steer the rigid body, and reverse.
          p=Path('tests/world_rigid_body_physics_box3d_test.mjs'); s=p.read_text()
          marker='physics.addBody({id:"car-a",kind:"car"'
          assert marker in s
          block=r'''physics.addBody({id:"wheel-rig-car",kind:"car",position:[0,-22,.48],yaw:0,halfExtents:[1.78,.82,.42],massKg:1420});
assert.equal(physics.vehicleRigSupported(),true,"box3d.js build lacks the upstream vehicle WheelJoint API");
assert.equal(physics.enableVehicleRig("wheel-rig-car",{wheelRadius:.32}),true,"could not install four physical wheel joints");
physics.setTarget("wheel-rig-car",{position:[80,-22,.48],speedMps:10,signedSpeedMps:10,steer:.62,maxSteerAngleRad:.56,brake:false});
for(let index=0;index<210;index++)physics.step(1/60,4,10000+index*1000/60);
const wheelForward=physics.pose("wheel-rig-car");
assert.equal(wheelForward.vehicleRig,"box3d-wheel-joint-4x-v1");assert.equal(wheelForward.vehicleWheelCount,4);
assert.ok(Math.hypot(wheelForward.position[0],wheelForward.position[1]+22)>2.2,`wheel-motor car did not physically travel: ${JSON.stringify(wheelForward)}`);
assert.ok(Math.abs(wheelForward.yaw)>.06,`front WheelJoint steering did not rotate the chassis: ${JSON.stringify(wheelForward)}`);
physics.setTarget("wheel-rig-car",{position:[-80,-22,.48],speedMps:6,signedSpeedMps:-6,steer:0,brake:false});
for(let index=0;index<260;index++)physics.step(1/60,4,14000+index*1000/60);
const wheelReverse=physics.pose("wheel-rig-car"),fwdX=Math.cos(wheelReverse.yaw),fwdY=Math.sin(wheelReverse.yaw),signedVelocity=wheelReverse.velocity[0]*fwdX+wheelReverse.velocity[1]*fwdY;
assert.ok(signedVelocity<-.35,`negative wheel motor speed did not produce reverse travel: ${JSON.stringify({wheelReverse,signedVelocity})}`);
assert.equal(physics.disableVehicleRig("wheel-rig-car"),true);physics.removeBody("wheel-rig-car");

'''
          s=s.replace(marker,block+marker,1)
          p.write_text(s)

          Path('tests/player_car_physics_contract_test.mjs').write_text(r'''import assert from "node:assert/strict";import {readFileSync} from "node:fs";
const car=readFileSync("sim/player_car_mode.mjs","utf8"),physics=readFileSync("sim/world_rigid_body_physics.mjs","utf8"),runtime=readFileSync("sim/world_rigid_body_runtime.mjs","utf8"),player=readFileSync("sim/player_vehicle_runtime_v2.mjs","utf8");
for(const marker of ["b3DefaultWheelJointDef","b3CreateWheelJoint","b3WheelJoint_SetSpinMotorSpeed","b3WheelJoint_SetTargetSteeringAngle","b3Body_AllowFastRotation","box3d-wheel-joint-4x-v1"])assert.ok(physics.includes(marker),`missing real wheel physics: ${marker}`);
assert.ok(runtime.includes("enableVehicleRig")&&runtime.includes("disableVehicleRig"));assert.ok(car.includes("enableVehicleRig?.(vehicle.id")&&car.includes("disableVehicleRig?.(id)"));assert.ok(car.includes("brake:input.brake"));assert.ok(player.includes("const driving=Boolean(globalThis.__arondightVehicleDrive?.active)"));assert.ok(player.includes('if(!driving&&currentMode()==="foot"'));
console.log("Player car contract passed: local car uses four Box3D wheel joints and vehicle mode suppresses footsteps.");
''')
          PY
          node --check sim/world_rigid_body_physics.mjs
          node --check sim/world_rigid_body_runtime.mjs
          node --check sim/player_car_mode.mjs
          node --check sim/player_vehicle_runtime_v2.mjs
          node tests/player_car_physics_contract_test.mjs
      - name: Run Box3D wheel-joint regression
        run: |
          set -euxo pipefail
          TMP=/tmp/box3d-test
          rm -rf "$TMP" && mkdir -p "$TMP" && cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund box3d.js@0.1.1 >/dev/null
          cd "$GITHUB_WORKSPACE"
          node tests/world_rigid_body_physics_box3d_test.mjs "$TMP/node_modules/box3d.js/dist/box3d.inline.mjs"
      - name: Commit runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/world_rigid_body_physics.mjs sim/world_rigid_body_runtime.mjs sim/player_car_mode.mjs sim/player_vehicle_runtime_v2.mjs tests/world_rigid_body_physics_box3d_test.mjs tests/player_car_physics_contract_test.mjs
          git commit -m 'Use real Box3D wheel joints for player cars'
          git push origin HEAD:main
