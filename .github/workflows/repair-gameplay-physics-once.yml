name: Repair gameplay physics once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-gameplay-physics-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/player_car_mode.mjs');s=p.read_text();current='clearFootKeys();resetPads();suppressFootGamepad(true);active=true;showLocalDriver(vehicle.root);setDrivingUi(true);';normalized='clearFootKeys();resetPads();suppressFootGamepad(true);setDrivingUi(true);active=true;showLocalDriver(vehicle.root);';s=s.replace(current,normalized,1) if current in s else s;p.write_text(s)
          p=Path('sim/player_vehicle_runtime_v2.mjs');s=p.read_text();s=s.replace('function updateHumanVelocity(now){','function updateHumanVelocity(now=performance.now()){',1) if 'function updateHumanVelocity(now){' in s else s;p.write_text(s)
          s=Path('sim/world_rigid_body_physics.mjs').read_text();a=s.index('  controlBody(record,dt){');b=s.index('  step(dt=1/60',a);Path('/tmp/original-control-body.txt').write_text(s[a:b])
          PY
          python3 .github/repair_gameplay_physics_once.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/world_rigid_body_physics.mjs');s=p.read_text();a=s.index('  controlBody(record,dt){');b=s.index('  step(dt=1/60',a);original=Path('/tmp/original-control-body.txt').read_text();injection='''  controlBody(record,dt){\n    if(record.vehicleRig&&record.target&&Number.isFinite(record.target.steer)){const b3=this.b3,body=record.body,velocity=b3.b3Body_GetLinearVelocity([0,0,0],body);record.preVelocity=[...velocity];this.updateVehicleRig(record);record.lateralSlipMps=0;if(length3(record.pendingImpulse)>.0001){const force=record.pendingImpulse.map(value=>value/Math.max(.001,dt));if(record.impulsePoint)b3.b3Body_ApplyForce(body,force,record.impulsePoint,true);else b3.b3Body_ApplyForceToCenter(body,force,true);record.pendingImpulse=[0,0,0];record.impulsePoint=null;}return;}\n''';assert original.startswith('  controlBody(record,dt){\n');preserved=injection+original[len('  controlBody(record,dt){\n'):];s=s[:a]+preserved+s[b:]
          s=s.replace(',"b3Body_AllowFastRotation"].every','].every',1).replace('b3.b3Body_AllowFastRotation(wheelBody,true);','',1);p.write_text(s)
          p=Path('tests/player_car_physics_contract_test.mjs');t=p.read_text().replace('"b3Body_AllowFastRotation",','"allowFastRotation=true",');p.write_text(t)
          PY
          node --check sim/world_rigid_body_physics.mjs
          node --check sim/world_rigid_body_runtime.mjs
          node --check sim/player_car_mode.mjs
          node --check sim/player_vehicle_runtime_v2.mjs
          node tests/player_car_physics_contract_test.mjs
      - name: Run Box3D wheel-joint regression
        run: |
          set -euxo pipefail
          TMP=/tmp/box3d-test
          rm -rf "$TMP" && mkdir -p "$TMP" && cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund box3d.js@0.1.1 >/dev/null
          cd "$GITHUB_WORKSPACE"
          node tests/world_rigid_body_physics_box3d_test.mjs "$TMP/node_modules/box3d.js/dist/box3d.inline.mjs"
      - name: Commit runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/world_rigid_body_physics.mjs sim/world_rigid_body_runtime.mjs sim/player_car_mode.mjs sim/player_vehicle_runtime_v2.mjs tests/world_rigid_body_physics_box3d_test.mjs tests/player_car_physics_contract_test.mjs
          git commit -m 'Use real Box3D wheel joints for player cars'
          git push origin HEAD:main
