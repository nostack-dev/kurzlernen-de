name: One-shot final twin integrity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix timing height precision and WORLD instrumentation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def one(path, old, new):
              p=Path(path);s=p.read_text();n=s.count(old)
              assert n==1,f"{path}: expected one match, got {n}: {old[:140]!r}"
              p.write_text(s.replace(old,new,1))

          # 1) Do not compensate a display/scheduler bug by widening the real FC
          # command envelope. Keep the last validated hardware-side speed ceiling.
          one('esp32/Arondight45_StateControl.hpp',
              '''// 5 m/s was a training-range UX cap. WORLD uses the same real FC path,\n// so enlarge the shared command envelope instead of adding a simulator speed hack.\nconstexpr float kStateMaxHorizontalSpeedMps = 12.0f;''',
              '''// Shared Production/HIL/WASM speed envelope. Do not widen this to mask\n// simulator frame pacing; retune only from measured physical-airframe evidence.\nconstexpr float kStateMaxHorizontalSpeedMps = 5.0f;''')
          one('tests/state_control_test.cpp','CHECK(std::fabs(fc::kStateMaxHorizontalSpeedMps - 12.0f) < 0.001f);','CHECK(std::fabs(fc::kStateMaxHorizontalSpeedMps - 5.0f) < 0.001f);')
          one('tests/architecture_invariants.mjs','requireText("esp32/Arondight45_StateControl.hpp","kStateMaxHorizontalSpeedMps = 12.0f");','requireText("esp32/Arondight45_StateControl.hpp","kStateMaxHorizontalSpeedMps = 5.0f");')

          # 2) Height target integration keeps full floating-point state. Display and
          # SBUS transport may quantize, but render-frame rounding must never stall a
          # fine human command.
          one('sim/control_semantics.mjs',
              'return Math.round(clampControl(base+clearanceRateMps(input)*dt,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M)*100)/100;',
              'return clampControl(base+clearanceRateMps(input)*dt,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);')
          one('sim/controller.mjs',
              'groundClearance=clamp(Math.round(numeric*20)/20,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);',
              'groundClearance=clamp(numeric,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);')
          one('sim/controller.mjs',
              'const nudge=()=>setGroundClearance(groundClearance+direction*.2);',
              'const nudge=()=>setGroundClearance(Math.round((groundClearance+direction*.1)*10)/10);')
          # Release capture after clearing the active pointer so lostpointercapture
          # cannot recursively process the same gesture.
          one('sim/controller.mjs',
              'const releaseHeightPointer=event=>{if(heightPointer===null||(event?.pointerId!=null&&event.pointerId!==heightPointer))return;try{ui.gameHeightPad.releasePointerCapture?.(heightPointer);}catch{}heightPointer=null;setHeightAxis(0);event?.preventDefault();};',
              'const releaseHeightPointer=event=>{if(heightPointer===null||(event?.pointerId!=null&&event.pointerId!==heightPointer))return;const released=heightPointer;heightPointer=null;setHeightAxis(0);try{ui.gameHeightPad.releasePointerCapture?.(released);}catch{}event?.preventDefault();};')
          one('sim/simulator.mjs',
              'const releaseSoloHeight=event=>{if(soloHeightPointer===null||(event?.pointerId!=null&&event.pointerId!==soloHeightPointer))return;try{soloHeightPad.releasePointerCapture?.(soloHeightPointer);}catch{}soloHeightPointer=null;setSoloHeightAxis(0);event?.preventDefault();};',
              'const releaseSoloHeight=event=>{if(soloHeightPointer===null||(event?.pointerId!=null&&event.pointerId!==soloHeightPointer))return;const released=soloHeightPointer;soloHeightPointer=null;setSoloHeightAxis(0);try{soloHeightPad.releasePointerCapture?.(released);}catch{}event?.preventDefault();};')

          # 3) Fixed 1 kHz physics/control must track elapsed wall time, not display Hz.
          # The old `8 steps then rAF` scheme produced ~480 Hz on a 60 Hz phone.
          one('sim/simulator.mjs',
              'const NAV_AGL_RAY_MAX_M = 60;\n',
              '''const NAV_AGL_RAY_MAX_M = 60;\nconst SIM_FIXED_STEP_MS = DT * 1000;\nconst SIM_MAX_CATCHUP_MS = 50;\nconst SIM_MAX_STEPS_PER_FRAME = Math.ceil(SIM_MAX_CATCHUP_MS / SIM_FIXED_STEP_MS);\n''')
          old='''async function loop(){\n  while(running){\n    if(mode==="replay") await replayStep();\n    else {latest=await controllerStep();physics.step(latest.motors,DT);simTime+=DT;raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();}\n    if((sequence&7)===0)await new Promise(requestAnimationFrame);\n  }\n}\n'''
          new='''async function loop(){\n  let schedulerWallMs=performance.now(),accumulatorMs=0;\n  while(running){\n    if(mode==="replay"){await replayStep();continue;}\n    await new Promise(requestAnimationFrame);\n    const now=performance.now(),elapsedMs=clamp(now-schedulerWallMs,0,SIM_MAX_CATCHUP_MS);schedulerWallMs=now;\n    accumulatorMs=Math.min(accumulatorMs+elapsedMs,SIM_MAX_CATCHUP_MS);\n    const due=Math.min(Math.floor(accumulatorMs/SIM_FIXED_STEP_MS),SIM_MAX_STEPS_PER_FRAME);\n    for(let i=0;i<due&&running;i++){\n      latest=await controllerStep();physics.step(latest.motors,DT);simTime+=DT;raceTrack.update(physics.position(),simTime,Boolean(latest.state&STATE_ARMED));recordSession();accumulatorMs-=SIM_FIXED_STEP_MS;\n    }\n  }\n}\n'''
          one('sim/simulator.mjs',old,new)

          # 4) WORLD instrumentation is initialized and completely removed on exit.
          one('sim/real_world_bootstrap.mjs',
              'viewport.dataset.worldMapUpdates="0";viewport.dataset.worldGridEnabled=this.gridEnabled?"1":"0";viewport.dataset.worldLookKeepEnabled=this.keepLookOrientation?"1":"0";this.renderLookHud();',
              'viewport.dataset.worldMapUpdates="0";viewport.dataset.worldGridEnabled=this.gridEnabled?"1":"0";viewport.dataset.worldLookKeepEnabled=this.keepLookOrientation?"1":"0";viewport.dataset.worldPerfMode=this.perfMode;viewport.dataset.worldFlightFps="0";this.renderLookHud();')
          one('sim/real_world_bootstrap.mjs',
              'delete viewport.dataset.worldFlightPixelRatio;delete viewport.dataset.worldSymbolsRemoved;}',
              'delete viewport.dataset.worldFlightPixelRatio;delete viewport.dataset.worldSymbolsRemoved;delete viewport.dataset.worldLookYaw;delete viewport.dataset.worldLookPitch;delete viewport.dataset.worldLookKeepEnabled;delete viewport.dataset.worldGridEnabled;delete viewport.dataset.worldFlightFps;delete viewport.dataset.worldPerfMode;delete viewport.dataset.worldPaletteLayers;}')

          # 5) Fine human altitude input must accumulate; this test specifically
          # catches the former per-frame rounding stall.
          p=Path('tests/control_semantics_test.mjs');s=p.read_text()
          anchor='if(stepGroundClearanceTarget(49.9,1,1)>50||stepGroundClearanceTarget(.6,-1,1)<.5)throw new Error("height target envelope failed");\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'''let fineHeight=1.2;for(let i=0;i<60;i++)fineHeight=stepGroundClearanceTarget(fineHeight,.2,1/60);if(!(fineHeight>1.25))throw new Error(`fine height input stalled instead of accumulating: ${fineHeight}`);\n''',1)
          p.write_text(s)

          # 6) Update stale one-phone browser E2E from removed absolute slider to
          # the real spring-centred target-rate control.
          p=Path('tests/browser_sim_smoke.mjs');s=p.read_text()
          old='''  await page.$eval("#soloClearanceSlider",e=>{e.value="2.7";e.dispatchEvent(new Event("input",{bubbles:true}));});\n  await page.waitForFunction(()=>document.querySelector("#soloClearanceValue")?.textContent?.includes("2.7 m"),{timeout:5000});\n  const clearanceStart=await simTime();await waitForSimTime(clearanceStart+.50,30000);\n  const clearanceRise=bodyMotion(await latestFlightSample());\n  if(!(clearanceRise.altitude>hold.altitude+.07||clearanceRise.vertical>.16))throw new Error(`solo clearance slider did not command climb: before=${JSON.stringify(hold)}, after=${JSON.stringify(clearanceRise)}`);\n  await page.$eval("#soloClearanceSlider",e=>{e.value="2";e.dispatchEvent(new Event("input",{bubbles:true}));});\n  await page.waitForFunction(()=>{const z=parseFloat(document.querySelector("#altitude")?.textContent||"0"),v=parseFloat(document.querySelector("#velocity")?.textContent||"99");return z>1.5&&z<2.5&&v<.75;},{timeout:90000});\n'''
          new='''  const heightPad=await stickGeometry("#soloHeightPad"),heightX=heightPad.x+heightPad.width/2,heightY=heightPad.y+heightPad.height/2,heightSpan=heightPad.height*.40;\n  const heightTargetBefore=await page.$eval("#soloClearance",e=>Number(e.dataset.targetAglM));\n  await page.mouse.move(heightX,heightY);await page.mouse.down();await page.mouse.move(heightX,heightY-heightSpan,{steps:4});await wait(220);await page.mouse.up();\n  const heightTargetAfter=await page.$eval("#soloClearance",e=>Number(e.dataset.targetAglM));if(!(heightTargetAfter>heightTargetBefore+.45))throw new Error(`solo spring height control did not slew target up: ${heightTargetBefore} -> ${heightTargetAfter}`);\n  const clearanceStart=await simTime();await waitForSimTime(clearanceStart+.50,30000);const clearanceRise=bodyMotion(await latestFlightSample());\n  if(!(clearanceRise.altitude>hold.altitude+.07||clearanceRise.vertical>.16))throw new Error(`solo height target did not command physical climb: before=${JSON.stringify(hold)}, after=${JSON.stringify(clearanceRise)}`);\n  await page.mouse.move(heightX,heightY);await page.mouse.down();await page.mouse.move(heightX,heightY+heightSpan,{steps:4});await wait(220);await page.mouse.up();\n  await page.waitForFunction(()=>{const z=parseFloat(document.querySelector("#altitude")?.textContent||"0"),v=parseFloat(document.querySelector("#velocity")?.textContent||"99");return z>1.5&&z<3.0&&v<.85;},{timeout:90000});\n'''
          assert s.count(old)==1,'stale solo clearance E2E block not found'
          p.write_text(s.replace(old,new,1))

          # 7) Two-phone exact nudge helper still works after fluid pad input: button
          # nudges snap to 0.1 m, while the pad remains continuous.
          p=Path('tests/dual_phone_smoke.mjs');s=p.read_text()
          s=s.replace('if(Math.abs(current-target)<=.051)return current;', 'if(Math.abs(current-target)<=.051)return current;',1)
          s=s.replace('ground-clearance slider did not command physical climb', 'ground-clearance target did not command physical climb')
          p.write_text(s)

          # 8) WORLD E2E requires initialized perf mode and at least one semantic
          # palette change in the deterministic fixture.
          p=Path('tests/real_world_ui_smoke.mjs');s=p.read_text()
          old='||!["nominal","constrained","critical"].includes(live.perfMode))throw new Error(`WORLD render budget/contrast failed: ${JSON.stringify(live)}`);'
          new='||!["nominal","constrained","critical"].includes(live.perfMode)||live.paletteLayers<1)throw new Error(`WORLD render budget/contrast failed: ${JSON.stringify(live)}`);'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))

          # 9) Architecture locks the wall-time fixed-step scheduler and forbids the
          # known display-Hz pacing bug from returning.
          p=Path('tests/architecture_invariants.mjs');s=p.read_text()
          anchor='for(const dirty of ["FLAG_NAVIGATION_VALID","stateControllerMotor"]\n  forbidText("sim/simulator.mjs",dirty,`simulator contains decoded/control shortcut: ${dirty}`);\n'
          if anchor not in s:
              # formatting is usually one-line for this loop; use stable nearby marker.
              marker='for(const dirty of ["FLAG_NAVIGATION_VALID","stateControllerMotor"])\n  forbidText("sim/simulator.mjs",dirty,`simulator contains decoded/control shortcut: ${dirty}`);\n'
              anchor=marker
          assert anchor in s,'architecture simulator dirty marker not found'
          addition='''requireText("sim/simulator.mjs","SIM_FIXED_STEP_MS = DT * 1000");\nrequireText("sim/simulator.mjs","accumulatorMs=Math.min(accumulatorMs+elapsedMs,SIM_MAX_CATCHUP_MS)");\nrequireText("sim/simulator.mjs","Math.floor(accumulatorMs/SIM_FIXED_STEP_MS)");\nforbidText("sim/simulator.mjs","(sequence&7)===0", "simulator fixed-step cadence must not be display-Hz divided");\n'''
          s=s.replace(anchor,anchor+addition,1)
          p.write_text(s)

          # 10) Documentation explicitly records why the 12 m/s workaround was
          # removed and what now guarantees real-time motion.
          p=Path('REAL_WORLD_DIGITAL_TWIN.md');doc=p.read_text()
          doc=doc.replace('The shared GAME horizontal speed command envelope is **12 m/s** in Production, HIL and WASM. This replaces the former 5 m/s training-range cap; it is not a WORLD-only velocity multiplier and the physical plant still decides what speed the configured airframe can actually achieve under its 25° tilt, thrust and drag limits. Phone fineness/expo remains unchanged, so full stick still reaches the full command envelope while centre stick remains precise.', 'The shared GAME horizontal speed command envelope remains **5 m/s** in Production, HIL and WASM until measured physical-airframe data justifies a retune. WORLD never multiplies physical speed for visual effect. The simulator instead runs the same 1 ms controller/physics step from a wall-time accumulator, independent of 60/120 Hz display refresh, with a bounded 50 ms catch-up window to avoid a post-stall spiral. Phone fineness/expo remains unchanged, so full stick reaches the full validated command envelope while centre stick remains precise.')
          p.write_text(doc)

          # Final source tree contains only permanent workflows.
          Path('.github/workflows/one-shot-final-twin-integrity.yml').unlink()

          # Source checks plus exact no-old-control/no-old-pacer guards.
          for path in ['sim/control_semantics.mjs','sim/controller.mjs','sim/simulator.mjs','sim/real_world_bootstrap.mjs','tests/control_semantics_test.mjs','tests/architecture_invariants.mjs','tests/browser_sim_smoke.mjs','tests/dual_phone_smoke.mjs','tests/real_world_ui_smoke.mjs']:
              subprocess.run(['node','--check',path],check=True)
          for path in ['sim/simulator.mjs','tests/browser_sim_smoke.mjs']:
              assert 'soloClearanceSlider' not in Path(path).read_text(),path
          for path in ['sim/controller.mjs','drone_controller.html','tests/dual_phone_smoke.mjs']:
              assert 'gameClearanceSlider' not in Path(path).read_text(),path
          PY
          git diff --check
          git config user.name "Christian Heinrich Hohlfeld"
          git config user.email "chris.hohlfeld@gmail.com"
          git add -A
          git commit -m "Fix real-time pacing and preserve hardware twin integrity"
          git push origin HEAD:main
