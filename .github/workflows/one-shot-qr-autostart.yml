name: One-shot QR and autorun migration
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-qr-autostart.yml"
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply QR autorun migration
        run: |
          set -euxo pipefail
          python3 tools/patch_qr_autorun.py
          node --check sim/simulator.mjs
          grep -q 'new QrScanner' sim/simulator.mjs
          grep -q 'function startRun()' sim/simulator.mjs
          grep -q 'automatic recovery, no re-pairing' sim/simulator.mjs
      - name: Commit migrated simulator
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/simulator.mjs
          git commit -m "Add QR pairing and remote autorun to simulator"
          git push
