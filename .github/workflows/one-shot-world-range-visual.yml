name: One-shot WORLD range visual smoothness

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply WORLD range, visual and render-performance patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              s=p.read_text()
              actual=s.count(old)
              assert actual==count, f"{path}: expected {count} occurrences of {old!r}, got {actual}"
              p.write_text(s.replace(old,new,count))

          # One browser-side authority for the GAME/solo height envelope.
          replace('sim/control_semantics.mjs',
                  'export const MAX_PHONE_EXPO=0.70;\n',
                  'export const MAX_PHONE_EXPO=0.70;\nexport const MIN_GAME_CLEARANCE_M=0.5;\nexport const MAX_GAME_CLEARANCE_M=50.0;\n')
          replace('sim/control_semantics.mjs',
                  'groundClearance:Number.isFinite(groundClearance)?clampControl(groundClearance,.5,5):2,',
                  'groundClearance:Number.isFinite(groundClearance)?clampControl(groundClearance,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M):2,')
          replace('sim/control_semantics.mjs',
                  'defaultHoverAgl:Math.round(clampControl(Number(settings.defaultHoverAgl??DEFAULT_PHONE_SETTINGS.defaultHoverAgl),.5,5)*10)/10,',
                  'defaultHoverAgl:Math.round(clampControl(Number(settings.defaultHoverAgl??DEFAULT_PHONE_SETTINGS.defaultHoverAgl),MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M)*10)/10,')

          replace('sim/control_settings.mjs',
                  '<input data-slider="hover" type="range" min="0.5" max="5" step="0.1">',
                  '<input data-slider="hover" type="range" min="0.5" max="50" step="0.1">')
          replace('sim/control_settings.mjs',
                  '<span>0.5 m</span><span>5.0 m</span>',
                  '<span>0.5 m</span><span>50.0 m</span>')

          replace('sim/controller.mjs',
                  'import {neutralControls,armReady as sharedArmReady,normalizedPointer,endPointerDrag,applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes} from "./control_semantics.mjs";',
                  'import {neutralControls,armReady as sharedArmReady,normalizedPointer,endPointerDrag,applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M} from "./control_semantics.mjs";')
          replace('sim/controller.mjs',
                  'groundClearance=clamp(Math.round(numeric*10)/10,.5,5);',
                  'groundClearance=clamp(Math.round(numeric*10)/10,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);')

          replace('drone_controller.html',
                  'id="gameClearanceSlider" type="range" min="0.5" max="5" step="0.1" value="2"',
                  'id="gameClearanceSlider" type="range" min="0.5" max="50" step="0.1" value="2"')

          # FC owns the same 50 m target envelope. NAV1 carries AGL in uint16 mm,
          # so 50 m remains below the 65.535 m wire ceiling with useful margin.
          replace('esp32/Arondight45_StateControl.hpp',
                  'constexpr float kStateMaxClearanceM = 5.00f;',
                  '// NAV1 represents AGL in uint16 millimetres (65.535 m wire ceiling).\n// Keep margin below that hardware boundary instead of inventing a wider protocol.\nconstexpr float kStateMaxClearanceM = 50.00f;')

          # Simulator UI + raw SBUS boundary use the same shared range. The local
          # NAV AGL twin ray reaches 60 m: at 50 m AGL and 25 deg max GAME tilt,
          # the ground slant is ~55.2 m, so the measurement stays physically valid.
          replace('sim/simulator.mjs',
                  'import {neutralControls,copyControls,armReady as sharedArmReady,normalizedPointer,endPointerDrag,applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes} from "./control_semantics.mjs";',
                  'import {neutralControls,copyControls,armReady as sharedArmReady,normalizedPointer,endPointerDrag,applyStick,releaseStick,knobAxes,knobPercent,phoneAxis,inversePhoneAxis,applyGameStick,gameKnobAxes,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M} from "./control_semantics.mjs";')
          replace('sim/simulator.mjs',
                  'const TERRAIN_HALF = TERRAIN_SIZE / 2;\n',
                  'const TERRAIN_HALF = TERRAIN_SIZE / 2;\nconst NAV_AGL_RAY_MAX_M = 60;\n')
          replace('sim/simulator.mjs','const range=model.groundRange(12);','const range=model.groundRange(NAV_AGL_RAY_MAX_M);')
          replace('sim/simulator.mjs',
                  'id="soloClearanceSlider" type="range" min="0.5" max="5" step="0.1"',
                  'id="soloClearanceSlider" type="range" min="0.5" max="50" step="0.1"')
          replace('sim/simulator.mjs',
                  'soloGroundClearance=clamp(Number(soloClearanceSlider.value),.5,5);',
                  'soloGroundClearance=clamp(Number(soloClearanceSlider.value),MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M);')
          replace('sim/simulator.mjs',
                  'const clearance=clamp(Number(c.groundClearance)||2,.5,5),normalized=(clearance-.5)/4.5;',
                  'const clearance=clamp(Number(c.groundClearance)||2,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M),normalized=(clearance-MIN_GAME_CLEARANCE_M)/(MAX_GAME_CLEARANCE_M-MIN_GAME_CLEARANCE_M);')
          replace('sim/simulator.mjs',
                  'target_ground_clearance:effectiveInput?.gameMode?clamp(Number(effectiveInput.groundClearance)||2,.5,5):null',
                  'target_ground_clearance:effectiveInput?.gameMode?clamp(Number(effectiveInput.groundClearance)||2,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M):null')

          # Human visual contrast: the aircraft remains the same geometry/physics,
          # but its materials are readable against a real map and a WORLD-only
          # orientation halo makes target acquisition immediate outside FPV.
          replace('sim/simulator.mjs',
                  'this.group=new THREE.Group();this.scene.add(this.group);this.rotors=[];',
                  'this.group=new THREE.Group();this.group.userData.arondightAirframe=true;this.scene.add(this.group);this.rotors=[];')
          replace('sim/simulator.mjs',
                  'const frameMaterial=new THREE.MeshStandardMaterial({color:0x252d3b,metalness:.35,roughness:.35}),bodyMaterial=new THREE.MeshStandardMaterial({color:0x121820,metalness:.5,roughness:.25});',
                  'const frameMaterial=new THREE.MeshStandardMaterial({color:0x6f8399,emissive:0x10273b,emissiveIntensity:.18,metalness:.30,roughness:.38}),bodyMaterial=new THREE.MeshStandardMaterial({color:0x26394e,emissive:0x0d2235,emissiveIntensity:.20,metalness:.42,roughness:.30});')
          replace('sim/simulator.mjs',
                  'const nose=new THREE.Mesh(new THREE.ConeGeometry(.018,.06,16),new THREE.MeshStandardMaterial({color:0xff4f65}));nose.rotation.z=-Math.PI/2;nose.position.x=-.075;this.group.add(nose);',
                  'const nose=new THREE.Mesh(new THREE.ConeGeometry(.018,.06,16),new THREE.MeshStandardMaterial({color:0xff4f65,emissive:0x66121f,emissiveIntensity:.35}));nose.rotation.z=-Math.PI/2;nose.position.x=-.075;this.group.add(nose);\n    const worldHalo=new THREE.Mesh(new THREE.TorusGeometry(.15,.0045,8,48),new THREE.MeshBasicMaterial({color:0xbdefff,transparent:true,opacity:.88,depthTest:false,depthWrite:false}));worldHalo.position.z=.035;worldHalo.visible=false;worldHalo.renderOrder=1000;this.group.add(worldHalo);this.worldHalo=worldHalo;')
          replace('sim/simulator.mjs',
                  'render(){if(!this.graphics||!this.group)return;const p=this.position(),q=this.rotation();this.group.position.set(...p);this.group.quaternion.set(q[0],q[1],q[2],q[3]);this.rotors.forEach((rotor,i)=>rotor.rotation.z+=(i%2?-1:1)*this.motorOmega[i]/60);}',
                  'render(){if(!this.graphics||!this.group)return;const p=this.position(),q=this.rotation();this.group.position.set(...p);this.group.quaternion.set(q[0],q[1],q[2],q[3]);this.rotors.forEach((rotor,i)=>rotor.rotation.z+=(i%2?-1:1)*this.motorOmega[i]/60);if(this.worldHalo){const worldActive=Boolean(globalThis.__arondightRealWorld?.active),cameraMode=$("viewport")?.dataset.cameraMode||"follow";this.worldHalo.visible=worldActive&&cameraMode!=="fpv";}}')

          # WORLD rendering: keep flight rendering every display frame; only the
          # geospatial backdrop is capped. This removes MapLibre camera/tile churn
          # from the flight frame loop without changing simulation dt or controller.
          p=Path('sim/real_world_bootstrap.mjs')
          s=p.read_text()
          s=s.replace('const EARTH_RADIUS_M=6378137;\n', '''const EARTH_RADIUS_M=6378137;\nconst WORLD_MAP_FRAME_MS=1000/30;\nconst WORLD_MAP_MAX_ZOOM=20;\nconst WORLD_MAP_PIXEL_RATIO=1.0;\nconst WORLD_FLIGHT_PIXEL_RATIO=1.25;\nconst WORLD_MAP_CENTER_EPS_M=.06;\nconst WORLD_MAP_ZOOM_EPS=.008;\nconst WORLD_MAP_ANGLE_EPS_DEG=.18;\n''',1)
          s=s.replace('const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));\n', 'const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));\nconst angularDistanceDeg=(a,b)=>Math.abs((((a-b)+540)%360)-180);\n',1)
          old='this.active=false;this.loading=false;this.map=null;this.originLon=null;this.originLat=null;this.threeRenderer=null;this.threeScene=null;this.threeCamera=null;this.geoContainer=null;this.worldCard=null;this.savedBackground=null;this.savedFog=null;this.trainingObjects=new Set();this.frameVisibility=new Map();this.lastLocation=null;this.lastViewportSize="";this.realFrames=0;'
          new='this.active=false;this.loading=false;this.map=null;this.originLon=null;this.originLat=null;this.threeRenderer=null;this.threeScene=null;this.threeCamera=null;this.flightPixelRatio=null;this.flightShadowEnabled=null;this.geoContainer=null;this.worldCard=null;this.savedBackground=null;this.savedFog=null;this.trainingObjects=new Set();this.frameVisibility=new Map();this.lastLocation=null;this.lastViewportSize="";this.lastMapSyncMs=-Infinity;this.lastMapView=null;this.realFrames=0;this.mapUpdates=0;'
          assert s.count(old)==1; s=s.replace(old,new,1)
          s=s.replace('#geoViewport{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0b1018}', '#geoViewport{position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#081a2d 0%,#103453 48%,#173d5c 68%,#142638 100%)}',1)
          old='''    this.threeRenderer=renderer;this.threeScene=scene;this.threeCamera=camera;\n    renderer.domElement.style.position="absolute";renderer.domElement.style.inset="0";renderer.domElement.style.zIndex="2";renderer.domElement.style.pointerEvents="none";'''
          new='''    this.threeRenderer=renderer;this.threeScene=scene;this.threeCamera=camera;if(this.flightPixelRatio===null)this.flightPixelRatio=renderer.getPixelRatio();if(this.flightShadowEnabled===null)this.flightShadowEnabled=renderer.shadowMap.enabled;\n    renderer.domElement.style.position="absolute";renderer.domElement.style.inset="0";renderer.domElement.style.zIndex="2";renderer.domElement.style.pointerEvents="none";'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          s=s.replace('"fill-extrusion-color":"#b9b6ad"', '"fill-extrusion-color":"#a8bdcc"',1)
          s=s.replace('"fill-extrusion-opacity":.84', '"fill-extrusion-opacity":.91',1)
          old='this.map=new MapLibreMap({container,style:OPENFREEMAP_STYLE,center:[longitude,latitude],zoom:19,pitch:55,bearing:0,roll:0,maxPitch:85,interactive:false,attributionControl:false,maplibreLogo:false,fadeDuration:0,renderWorldCopies:false,centerClampedToGround:false,canvasContextAttributes:{antialias:true}});'
          new='this.map=new MapLibreMap({container,style:OPENFREEMAP_STYLE,center:[longitude,latitude],zoom:19,pitch:55,bearing:0,roll:0,maxPitch:85,maxZoom:WORLD_MAP_MAX_ZOOM,interactive:false,attributionControl:false,maplibreLogo:false,fadeDuration:0,renderWorldCopies:false,centerClampedToGround:false,pixelRatio:Math.min(devicePixelRatio||1,WORLD_MAP_PIXEL_RATIO),maxTileCacheZoomLevels:2,maxCanvasSize:[2048,2048],cancelPendingTileRequestsWhileZooming:true,refreshExpiredTiles:false,validateStyle:false,canvasContextAttributes:{antialias:false,powerPreference:"high-performance",desynchronized:true}});'
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='''    await Promise.race([new Promise(resolve=>this.map.once("load",resolve)),new Promise((_,reject)=>setTimeout(()=>reject(Error("OpenFreeMap style load timeout")),20000))]);\n    this.addBuildings();return this.map;'''
          new='''    await Promise.race([new Promise(resolve=>this.map.once("load",resolve)),new Promise((_,reject)=>setTimeout(()=>reject(Error("OpenFreeMap style load timeout")),20000))]);\n    try{this.map.setSky({"sky-color":"#0a2845","sky-horizon-blend":.42,"horizon-color":"#477493","horizon-fog-blend":.22,"fog-color":"#274d68","fog-ground-blend":.08});}catch(error){console.warn("OpenFreeMap sky contrast unavailable:",error);}\n    this.addBuildings();return this.map;'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='''      if(!this.threeRenderer)throw Error("Flight renderer is not ready");\n      this.threeRenderer.domElement.style.visibility="visible";this.threeRenderer.domElement.style.display="block";this.geoContainer.hidden=false;'''
          new='''      if(!this.threeRenderer)throw Error("Flight renderer is not ready");\n      this.lastMapSyncMs=-Infinity;this.lastMapView=null;this.mapUpdates=0;\n      this.threeRenderer.setPixelRatio(Math.min(this.flightPixelRatio||devicePixelRatio||1,WORLD_FLIGHT_PIXEL_RATIO));this.threeRenderer.shadowMap.enabled=false;\n      this.threeRenderer.domElement.style.visibility="visible";this.threeRenderer.domElement.style.display="block";this.geoContainer.hidden=false;'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='viewport.dataset.worldMode="real";viewport.dataset.worldProvider="openfreemap";viewport.dataset.worldRenderPath="shared-three-renderer";viewport.dataset.worldLatitude=String(latitude);viewport.dataset.worldLongitude=String(longitude);'
          new='viewport.dataset.worldMode="real";viewport.dataset.worldProvider="openfreemap";viewport.dataset.worldRenderPath="shared-three-renderer";viewport.dataset.worldLatitude=String(latitude);viewport.dataset.worldLongitude=String(longitude);viewport.dataset.worldMapFpsCap="30";viewport.dataset.worldMapPixelRatio=String(WORLD_MAP_PIXEL_RATIO);viewport.dataset.worldFlightPixelRatio=String(Math.min(this.flightPixelRatio||devicePixelRatio||1,WORLD_FLIGHT_PIXEL_RATIO));viewport.dataset.worldMapUpdates="0";'
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='this.active=false;this.loading=false;if(this.geoContainer)this.geoContainer.hidden=true;if(this.threeRenderer){this.threeRenderer.domElement.style.visibility="visible";this.threeRenderer.domElement.style.display="block";this.threeRenderer.setClearAlpha(1);}if(this.threeScene){'
          new='this.active=false;this.loading=false;if(this.geoContainer)this.geoContainer.hidden=true;if(this.threeRenderer){this.threeRenderer.domElement.style.visibility="visible";this.threeRenderer.domElement.style.display="block";this.threeRenderer.setClearAlpha(1);if(this.flightPixelRatio!==null)this.threeRenderer.setPixelRatio(this.flightPixelRatio);if(this.flightShadowEnabled!==null)this.threeRenderer.shadowMap.enabled=this.flightShadowEnabled;}if(this.threeScene){'
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='delete viewport.dataset.worldMapBearing;delete viewport.dataset.worldThreeFrames;}'
          new='delete viewport.dataset.worldMapBearing;delete viewport.dataset.worldThreeFrames;delete viewport.dataset.worldMapUpdates;delete viewport.dataset.worldMapFpsCap;delete viewport.dataset.worldMapPixelRatio;delete viewport.dataset.worldFlightPixelRatio;}'
          assert s.count(old)==2; s=s.replace(old,new,2)

          start=s.index('  syncMapCamera(camera){')
          end=s.index('  renderReal(scene,camera){',start)
          old=s[start:end]
          new='''  syncMapCamera(camera){\n    if(!this.active||!this.map||!Number.isFinite(this.originLon)||!Number.isFinite(this.originLat))return;\n    const now=performance.now(),viewport=$("viewport"),cameraMode=viewport.dataset.cameraMode||"follow",forceMode=cameraMode!==(viewport.dataset.worldCameraMode||"");\n    if(!forceMode&&now-this.lastMapSyncMs<WORLD_MAP_FRAME_MS)return;\n    const p=camera.position,dir=new THREE.Vector3(),actualUp=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion).normalize();camera.getWorldDirection(dir).normalize();\n    let focusDistance=10;if(dir.z<-.02&&p.z>0){const ground=-p.z/dir.z;if(Number.isFinite(ground)&&ground>0)focusDistance=clamp(ground,2,250);}\n    const focus=p.clone().addScaledVector(dir,focusDistance),center=metersToLngLat(this.originLon,this.originLat,focus.x,focus.y),horizontal=Math.hypot(dir.x,dir.y);\n    const bearing=THREE.MathUtils.radToDeg(Math.atan2(dir.x,dir.y));const pitch=clamp(90+THREE.MathUtils.radToDeg(Math.atan2(dir.z,Math.max(1e-6,horizontal))),0,85);\n    let roll=0;if(horizontal>.02){const worldUp=new THREE.Vector3(0,0,1),right0=new THREE.Vector3().crossVectors(dir,worldUp).normalize(),up0=new THREE.Vector3().crossVectors(right0,dir).normalize();roll=THREE.MathUtils.radToDeg(Math.atan2(dir.dot(new THREE.Vector3().crossVectors(up0,actualUp)),up0.dot(actualUp)));}\n    const rect=viewport.getBoundingClientRect(),height=Math.max(1,rect.height),metersPerPixel=Math.max(.01,2*focusDistance*Math.tan(THREE.MathUtils.degToRad(clamp(camera.fov,10,120))/2)/height),cosLat=Math.max(.05,Math.cos(center[1]*Math.PI/180)),zoom=clamp(Math.log2(156543.03392804097*cosLat/metersPerPixel),14,WORLD_MAP_MAX_ZOOM),size=`${Math.round(rect.width)}x${Math.round(rect.height)}`;\n    if(size!==this.lastViewportSize){this.lastViewportSize=size;this.map.resize();}\n    const view={center,zoom,bearing,pitch,roll:clamp(roll,-85,85)},last=this.lastMapView;\n    if(last&&!forceMode){const latM=(center[1]-last.center[1])*Math.PI/180*EARTH_RADIUS_M,lonM=(center[0]-last.center[0])*Math.PI/180*EARTH_RADIUS_M*Math.max(.05,Math.cos(center[1]*Math.PI/180)),centerDelta=Math.hypot(latM,lonM);if(centerDelta<WORLD_MAP_CENTER_EPS_M&&Math.abs(zoom-last.zoom)<WORLD_MAP_ZOOM_EPS&&angularDistanceDeg(bearing,last.bearing)<WORLD_MAP_ANGLE_EPS_DEG&&Math.abs(pitch-last.pitch)<WORLD_MAP_ANGLE_EPS_DEG&&angularDistanceDeg(view.roll,last.roll)<WORLD_MAP_ANGLE_EPS_DEG){this.lastMapSyncMs=now;return;}}\n    this.lastMapSyncMs=now;this.lastMapView={...view,center:[...center]};this.map.jumpTo(view);this.mapUpdates++;\n    viewport.dataset.worldCameraMode=cameraMode;viewport.dataset.worldMapCenter=`${center[0].toFixed(7)},${center[1].toFixed(7)}`;viewport.dataset.worldMapZoom=zoom.toFixed(4);viewport.dataset.worldMapPitch=pitch.toFixed(3);viewport.dataset.worldMapBearing=bearing.toFixed(3);viewport.dataset.worldMapUpdates=String(this.mapUpdates);\n  }\n'''
          s=s[:start]+new+s[end:]
          p.write_text(s)

          # Tests: lock the 50 m envelope, raw NAV1 capability and WORLD render budget.
          replace('tests/control_semantics_test.mjs',
                  'DEFAULT_PHONE_SETTINGS,MAX_PHONE_EXPO,neutralControls,armReady,applyStick,releaseStick,',
                  'DEFAULT_PHONE_SETTINGS,MAX_PHONE_EXPO,MIN_GAME_CLEARANCE_M,MAX_GAME_CLEARANCE_M,neutralControls,copyControls,armReady,applyStick,releaseStick,')
          replace('tests/control_semantics_test.mjs',
                  'assert.equal(DEFAULT_PHONE_SETTINGS.defaultHoverAgl,1.2);',
                  'assert.equal(DEFAULT_PHONE_SETTINGS.defaultHoverAgl,1.2);\nassert.equal(MIN_GAME_CLEARANCE_M,.5);assert.equal(MAX_GAME_CLEARANCE_M,50);\nassert.equal(copyControls({groundClearance:999}).groundClearance,50);assert.equal(copyControls({groundClearance:-5}).groundClearance,.5);')

          replace('tests/drone_hil_protocol_test.cpp',
                  'CHECK(std::fabs(nav.agl_m - 2.35f) < 0.002f);',
                  'CHECK(std::fabs(nav.agl_m - 2.35f) < 0.002f);\n    const auto high_wire = hwcontract::encode_navigation_wire(78, 0, 0, 0, 50.0f, true);\n    CHECK(hwcontract::decode_navigation_wire(high_wire, nav));\n    CHECK(nav.valid);\n    CHECK(std::fabs(nav.agl_m - 50.0f) < 0.002f);')

          replace('tests/state_control_test.cpp',
                  '    {\n        auto diagonal = base_rc(true);',
                  '    {\n        auto high = base_rc(true);\n        high.ch[fc::kStateClearanceChannel] = 1811;\n        const auto intent = fc::state_intent(high);\n        CHECK(std::fabs(intent.clearance_m - 50.0f) < 0.02f);\n    }\n\n    {\n        auto diagonal = base_rc(true);')

          replace('tests/browser_sim_smoke.mjs',
                  'clearanceValue:Number(document.querySelector("#soloClearanceSlider")?.value||0),',
                  'clearanceValue:Number(document.querySelector("#soloClearanceSlider")?.value||0),\n    clearanceMax:Number(document.querySelector("#soloClearanceSlider")?.max||0),')
          replace('tests/browser_sim_smoke.mjs',
                  'if(soloUi.throttle!==0||Math.abs(soloUi.leftTop-50)>1||Math.abs(soloUi.clearanceValue-1.2)>.01||!soloUi.rightLabel.includes("PITCH"))',
                  'if(soloUi.throttle!==0||Math.abs(soloUi.leftTop-50)>1||Math.abs(soloUi.clearanceValue-1.2)>.01||soloUi.clearanceMax!==50||!soloUi.rightLabel.includes("PITCH"))')
          replace('tests/browser_sim_smoke.mjs',
                  'hover:document.querySelector(\'.phone-settings-dialog [data-slider="hover"]\')?.value,',
                  'hover:document.querySelector(\'.phone-settings-dialog [data-slider="hover"]\')?.value,\n    hoverMax:document.querySelector(\'.phone-settings-dialog [data-slider="hover"]\')?.max,')
          replace('tests/browser_sim_smoke.mjs',
                  'defaults.left!=="10"||defaults.right!=="10"||defaults.hover!=="1.2"||',
                  'defaults.left!=="10"||defaults.right!=="10"||defaults.hover!=="1.2"||defaults.hoverMax!=="50"||')

          replace('tests/dual_phone_smoke.mjs',
                  'const clearance=await controller.$eval("#gameClearanceSlider",element=>Number(element.value));if(Math.abs(clearance-1.2)>0.01)throw new Error(`unexpected default ground clearance ${clearance}`);',
                  'const clearance=await controller.$eval("#gameClearanceSlider",element=>({value:Number(element.value),max:Number(element.max)}));if(Math.abs(clearance.value-1.2)>0.01||clearance.max!==50)throw new Error(`unexpected ground-clearance config ${JSON.stringify(clearance)}`);')

          replace('tests/real_world_ui_smoke.mjs',
                  'if(!simulatorSource.includes("__arondightRealWorld?.renderFrame?.(renderer,scene,camera)"))throw new Error("simulator render loop does not explicitly call the REAL WORLD frame bridge");',
                  'if(!simulatorSource.includes("__arondightRealWorld?.renderFrame?.(renderer,scene,camera)"))throw new Error("simulator render loop does not explicitly call the REAL WORLD frame bridge");\nif(!bootstrapSource.includes("WORLD_MAP_FRAME_MS=1000/30")||!bootstrapSource.includes("pixelRatio:Math.min(devicePixelRatio||1,WORLD_MAP_PIXEL_RATIO)")||!bootstrapSource.includes("setSky({\\\"sky-color\\\":\\\"#0a2845\\\""))throw new Error("WORLD mobile render/contrast budget missing");\nif(!simulatorSource.includes("MAX_GAME_CLEARANCE_M")||!simulatorSource.includes("NAV_AGL_RAY_MAX_M = 60")||!simulatorSource.includes("TorusGeometry(.15"))throw new Error("WORLD range/visual acquisition cues missing");')
