name: Apply WORLD terrain integration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == 'RUN_WORLD_TERRAIN_INTEGRATION_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch, verify and publish
        id: integrate
        shell: bash
        run: |
          set +e
          (
            set -euxo pipefail
            python3 - <<'PY'
            from pathlib import Path

            # Preserve OSM properties and use levels when explicit metre heights are absent.
            p=Path('sim/world_building_collisions.mjs');s=p.read_text()
            old='''const properties=feature?.properties||{},top=clamp(Number(properties.render_height??properties.height??8)||8,.5,300),base=clamp(Number(properties.render_min_height??properties.min_height??0)||0,0,Math.max(0,top-.1)),featureId=stableFeatureId(feature);'''
            new='''const properties=feature?.properties||{},levels=Number(properties.levels??properties["building:levels"]),minLevels=Number(properties.min_level??properties["building:min_level"]),top=clamp(Number(properties.render_height??properties.height??(Number.isFinite(levels)?levels*3:8))||8,.5,300),base=clamp(Number(properties.render_min_height??properties.min_height??(Number.isFinite(minLevels)?minLevels*3:0))||0,0,Math.max(0,top-.1)),featureId=stableFeatureId(feature);'''
            assert old in s,'building height extraction marker missing';s=s.replace(old,new,1)
            old='''const candidate={key,outer,holes,base,top,center:centerPoint,distance,area};'''
            new='''const candidate={key,outer,holes,base,top,center:centerPoint,distance,area,properties:Object.freeze({...properties})};'''
            assert old in s,'building candidate marker missing';s=s.replace(old,new,1);p.write_text(s)

            # Make the Box3D plant consume DEM terrain and expose the physical safe-spawn resolver.
            p=Path('sim/simulator.mjs');s=p.read_text()
            marker='import {batteryOcvVoltage,batteryVoltageUnderLoad,scaleCurrentsToPackLimit,solveStaticPropulsionAuthority,MOTOR_BEARING_DRAG_NM_PER_RAD_S} from "./propulsion_authority.mjs";'
            addition=marker+'\nimport {normalizeTerrainSnapshot} from "./world_terrain.mjs";\nimport {createWorldTerrainCollision,destroyWorldTerrainCollision} from "./world_terrain_physics.mjs";\nimport {findSafeSpawn as searchSafeSpawn} from "./safe_spawn.mjs";'
            assert marker in s and 'world_terrain_physics.mjs' not in s;s=s.replace(marker,addition,1)
            old='''this.world=null;this.body=null;this.group=null;this.rotors=[];this.worldBuildingCollisionSnapshot=normalizeBuildingCollisionSnapshot(null);'''
            new='''this.world=null;this.body=null;this.group=null;this.rotors=[];this.worldTerrainSnapshot=null;this.worldTerrainCollisionState=null;this.flatGroundBody=null;this.worldTerrainRevision=0;this.worldBuildingCollisionSnapshot=normalizeBuildingCollisionSnapshot(null);'''
            assert old in s;s=s.replace(old,new,1)
            old='''if(this.world){this.worldBuildingCollisionState=null;b3.b3DestroyWorld(this.world);}'''
            new='''if(this.world){this.worldBuildingCollisionState=null;this.worldTerrainCollisionState=null;this.flatGroundBody=null;b3.b3DestroyWorld(this.world);}'''
            assert old in s;s=s.replace(old,new,1)
            old='''const groundDef=b3.b3DefaultBodyDef();groundDef.position=[0,0,-.05];const ground=b3.b3CreateBody(this.world,groundDef),groundShape=b3.b3DefaultShapeDef();groundShape.baseMaterial.friction=.75;groundShape.baseMaterial.restitution=.03;groundShape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,groupIndex:0};b3.b3CreateBoxShape(ground,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);'''
            assert old in s;s=s.replace(old,'this.rebuildWorldGround();',1)
            insert_at=s.index('  setWorldBuildingCollisions(value)')
            methods='''  setWorldTerrain(value){const snapshot=normalizeTerrainSnapshot(value);const oldHash=this.worldTerrainSnapshot?.hash||"",nextHash=snapshot?.hash||"";if(oldHash===nextHash)return false;this.worldTerrainSnapshot=snapshot;this.rebuildWorldGround();return true;}\n  rebuildWorldGround(){\n    if(!this.world)return;destroyWorldTerrainCollision(b3,this.worldTerrainCollisionState);this.worldTerrainCollisionState=null;try{if(this.flatGroundBody&&b3.b3Body_IsValid(this.flatGroundBody))b3.b3DestroyBody(this.flatGroundBody);}catch{}this.flatGroundBody=null;\n    if(this.worldTerrainSnapshot)this.worldTerrainCollisionState=createWorldTerrainCollision(b3,this.world,this.worldTerrainSnapshot,{categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,friction:.78,restitution:.02});\n    else{const groundDef=b3.b3DefaultBodyDef();groundDef.position=[0,0,-.05];this.flatGroundBody=b3.b3CreateBody(this.world,groundDef);const groundShape=b3.b3DefaultShapeDef();groundShape.baseMaterial.friction=.75;groundShape.baseMaterial.restitution=.03;groundShape.filter={categoryBits:COLLISION_TERRAIN,maskBits:COLLISION_AIRFRAME|QUERY_RANGEFINDER|QUERY_CAMERA,groupIndex:0};b3.b3CreateBoxShape(this.flatGroundBody,groundShape,TERRAIN_HALF,TERRAIN_HALF,.05);}\n    this.worldTerrainRevision++;\n  }\n  safeSpawnProbe(x,y){\n    if(!this.world)return null;const current=this.position?.()||[0,0,0],terrainMax=Number(this.worldTerrainSnapshot?.maxZ)||0,top=Math.max(250,terrainMax+160,Number(current[2]||0)+120),distance=Math.max(900,top+650),ray=[0,0,-distance],cast=category=>{const filter=b3.b3DefaultQueryFilter();filter.categoryBits=category;filter.maskBits=COLLISION_TERRAIN;return b3.b3World_CastRayClosest(this.world,[x,y,top],ray,filter);},terrain=cast(QUERY_RANGEFINDER),obstacle=cast(QUERY_CAMERA);if(!terrain?.hit||!obstacle?.hit)return null;const terrainZ=Number(terrain.point?.[2]),obstructionZ=Number(obstacle.point?.[2]),normalZ=Number(terrain.normal?.[2]);if(![terrainZ,obstructionZ,normalZ].every(Number.isFinite))return null;return{terrainZ,obstructionZ,normalZ};\n  }\n  findSafeSpawn({around=[0,0,0],mode="initial",seed=1}={}){const clearanceRadiusM=this.p.span/2+this.p.propD/2+.04;return searchSafeSpawn({around,mode,seed,clearanceRadiusM,supportM:AIRFRAME_GROUND_SUPPORT_M,separationM:.025,probe:(x,y)=>this.safeSpawnProbe(x,y)});}\n'''
            s=s[:insert_at]+methods+s[insert_at:]
            old='''globalThis.__arondightRealWorld?.attachCameraCollisionResolver?.((anchor,desired)=>physics.resolveCameraPath(anchor,desired));'''
            new=old+'\nglobalThis.__arondightRealWorld?.attachTerrainCollisionSink?.(snapshot=>physics.setWorldTerrain(snapshot));\nglobalThis.__arondightRealWorld?.attachSafeSpawnResolver?.(request=>physics.findSafeSpawn(request));\nglobalThis.__arondightRealWorld?.attachSpawnApplySink?.(initial=>{resetSimulation(initial);return initial;});'
            assert old in s;s=s.replace(old,new,1);p.write_text(s)

            # Integrate the real DEM, aerial draping, textured OSM meshes and safe spawning.
            p=Path('sim/real_world_bootstrap.mjs');s=p.read_text()
            marker='import {buildingFootprintsFromFeatures,buildingFootprintHash,buildingCollisionPrismsFromFootprints} from "./world_building_collisions.mjs";'
            addition=marker+'\nimport {buildTerrainSnapshot,terrainHeightAt,raycastTerrainSnapshot,WORLD_TERRAIN_HALF_EXTENT_M,WORLD_TERRAIN_GRID_SIZE,WORLD_TERRAIN_REBUILD_DISTANCE_M,WORLD_TERRAIN_SYNC_MIN_MS} from "./world_terrain.mjs";\nimport {WorldDemSampler,WORLD_DEM_ZOOM,WORLD_DEM_TILE_SIZE,WORLD_DEM_TILE_URL,WORLD_DEM_ENCODING,WORLD_DEM_ATTRIBUTION} from "./world_dem_sampler.mjs";\nimport {WorldBuildingVisualLayer} from "./world_building_visuals.mjs";'
            assert marker in s and 'WorldDemSampler' not in s;s=s.replace(marker,addition,1)
            old='''const WORLD_IMAGERY_MAX_ZOOM=19;'''
            new='''const WORLD_IMAGERY_MAX_ZOOM=19;\nconst WORLD_TERRAIN_SOURCE_ID="arondight45-world-dem";\nconst WORLD_TERRAIN_HILLSHADE_LAYER_ID="arondight45-world-hillshade";'''
            assert old in s;s=s.replace(old,new,1)
            old='''this.buildingSourceId=null;this.buildingCollisionSink=null;this.buildingCollisionSnapshot=Object.freeze({hash:"",footprintCount:0,prismCount:0,prisms:[]});this.buildingCollisionDirty=true;this.buildingCollisionLastSyncMs=-Infinity;this.buildingCollisionLastCenter=[Infinity,Infinity];this.buildingCollisionRevisions=0;this.cameraCollisionResolver=null;'''
            new='''this.buildingSourceId=null;this.buildingCollisionSink=null;this.buildingCollisionSnapshot=Object.freeze({hash:"",footprintCount:0,prismCount:0,prisms:[]});this.buildingCollisionDirty=true;this.buildingCollisionLastSyncMs=-Infinity;this.buildingCollisionLastCenter=[Infinity,Infinity];this.buildingCollisionRevisions=0;this.cameraCollisionResolver=null;this.terrainCollisionSink=null;this.safeSpawnResolver=null;this.spawnApplySink=null;this.demSampler=new WorldDemSampler();this.terrainSnapshot=null;this.terrainOriginElevationM=null;this.terrainLastSyncMs=-Infinity;this.terrainLastCenter=[Infinity,Infinity];this.terrainSyncPromise=null;this.terrainRevisions=0;this.buildingVisualLayer=null;this.lastSafeSpawn=null;'''
            assert old in s;s=s.replace(old,new,1)
            old='''this.threeRenderer=renderer;this.threeScene=scene;this.threeCamera=camera;if(this.flightPixelRatio===null)this.flightPixelRatio=renderer.getPixelRatio();if(this.flightShadowEnabled===null)this.flightShadowEnabled=renderer.shadowMap.enabled;'''
            new=old+'\n    if(this.buildingVisualLayer?.scene!==scene){this.buildingVisualLayer?.destroy?.();this.buildingVisualLayer=new WorldBuildingVisualLayer(scene);this.buildingVisualLayer.setVisible(this.active);}'
            assert old in s;s=s.replace(old,new,1)

            marker='  attachBuildingCollisionSink(sink){'
            idx=s.index(marker)
            terrain_methods='''  addTerrainPresentation(){\n    if(!this.map)return;try{if(!this.map.getSource(WORLD_TERRAIN_SOURCE_ID))this.map.addSource(WORLD_TERRAIN_SOURCE_ID,{type:"raster-dem",tiles:[WORLD_DEM_TILE_URL],encoding:WORLD_DEM_ENCODING,tileSize:WORLD_DEM_TILE_SIZE,maxzoom:WORLD_DEM_ZOOM,attribution:WORLD_DEM_ATTRIBUTION});this.map.setTerrain({source:WORLD_TERRAIN_SOURCE_ID,exaggeration:1});if(!this.map.getLayer(WORLD_TERRAIN_HILLSHADE_LAYER_ID)){const before=(this.map.getStyle()?.layers||[]).find(layer=>layer.type==="line")?.id,layer={id:WORLD_TERRAIN_HILLSHADE_LAYER_ID,type:"hillshade",source:WORLD_TERRAIN_SOURCE_ID,paint:{"hillshade-exaggeration":.18,"hillshade-shadow-color":"#273326","hillshade-highlight-color":"#f4edd7","hillshade-accent-color":"#596555"}};if(before)this.map.addLayer(layer,before);else this.map.addLayer(layer);}}catch(error){throw Error(`REAL WORLD DEM presentation failed: ${error?.message||error}`);}\n  }\n  attachTerrainCollisionSink(sink){this.terrainCollisionSink=typeof sink==="function"?sink:null;if(this.terrainCollisionSink)this.terrainCollisionSink(this.terrainSnapshot);return Boolean(this.terrainCollisionSink);}\n  attachSafeSpawnResolver(resolver){this.safeSpawnResolver=typeof resolver==="function"?resolver:null;return Boolean(this.safeSpawnResolver);}\n  attachSpawnApplySink(sink){this.spawnApplySink=typeof sink==="function"?sink:null;return Boolean(this.spawnApplySink);}\n  clearTerrainPhysics(){this.terrainSnapshot=null;this.terrainLastCenter=[Infinity,Infinity];this.terrainLastSyncMs=-Infinity;this.terrainCollisionSink?.(null);const viewport=$("viewport");if(viewport){viewport.dataset.worldTerrainStatus="inactive";viewport.dataset.worldTerrainTriangles="0";delete viewport.dataset.worldTerrainRangeM;}return true;}\n  async initializeTerrainOrigin(){if(!Number.isFinite(this.originLon)||!Number.isFinite(this.originLat))throw Error("WORLD DEM origin missing");const elevation=await this.demSampler.sample(this.originLon,this.originLat);if(!Number.isFinite(elevation))throw Error("WORLD DEM returned no origin elevation");this.terrainOriginElevationM=elevation;const viewport=$("viewport");if(viewport){viewport.dataset.worldTerrainOriginElevationM=elevation.toFixed(3);viewport.dataset.worldTerrainSource=`mapterhorn-z${WORLD_DEM_ZOOM}-terrarium`;}return elevation;}\n  async syncTerrainPhysics(force=false){\n    if(!this.terrainCollisionSink||!Number.isFinite(this.originLon)||!Number.isFinite(this.originLat)||!Number.isFinite(this.terrainOriginElevationM))return false;if(this.terrainSyncPromise)return this.terrainSyncPromise;const now=performance.now(),airframe=this.airframeFor(this.threeScene),center=[Number(airframe?.position?.x)||0,Number(airframe?.position?.y)||0],moved=Math.hypot(center[0]-this.terrainLastCenter[0],center[1]-this.terrainLastCenter[1]);if(!force&&now-this.terrainLastSyncMs<WORLD_TERRAIN_SYNC_MIN_MS&&moved<WORLD_TERRAIN_REBUILD_DISTANCE_M)return false;\n    const half=WORLD_TERRAIN_HALF_EXTENT_M,size=WORLD_TERRAIN_GRID_SIZE,step=2*half/(size-1),points=[];for(let row=0;row<size;row++)for(let col=0;col<size;col++){const x=center[0]-half+col*step,y=center[1]-half+row*step;points.push(metersToLngLat(this.originLon,this.originLat,x,y));}\n    this.terrainSyncPromise=(async()=>{const heights=await this.demSampler.sampleMany(points);if(heights.some(value=>!Number.isFinite(value)))throw Error("WORLD DEM grid has missing samples");let index=0;const snapshot=buildTerrainSnapshot({originElevationM:this.terrainOriginElevationM,center,halfExtentM:half,gridSize:size,sampleMsl:()=>heights[index++]});if(!snapshot)throw Error("WORLD DEM snapshot build failed");this.terrainSnapshot=snapshot;this.terrainCollisionSink(snapshot);this.terrainLastCenter=center;this.terrainLastSyncMs=performance.now();this.terrainRevisions++;this.buildingCollisionDirty=true;const viewport=$("viewport");if(viewport){viewport.dataset.worldTerrainStatus="box3d-active";viewport.dataset.worldTerrainTriangles=String(snapshot.indices.length/3);viewport.dataset.worldTerrainRangeM=(snapshot.maxZ-snapshot.minZ).toFixed(3);viewport.dataset.worldTerrainRevision=String(this.terrainRevisions);}return true;})().catch(error=>{const viewport=$("viewport");if(viewport)viewport.dataset.worldTerrainStatus="error";console.warn("WORLD DEM physics sync failed:",error);return false;}).finally(()=>{this.terrainSyncPromise=null;});return this.terrainSyncPromise;\n  }\n  async waitForBuildingCollisionData(timeoutMs=12000){if(!this.map||!this.buildingSourceId)throw Error("WORLD building vector source unavailable");const started=performance.now();while(performance.now()-started<timeoutMs){let loaded=false;try{loaded=this.map.isSourceLoaded?.(this.buildingSourceId)===true;}catch{}if(loaded){this.buildingCollisionDirty=true;this.syncBuildingCollisions(true);return true;}await new Promise(resolve=>setTimeout(resolve,120));}throw Error("WORLD building vector tiles did not become ready");}\n  relocateSafeSpawn({mode="initial",around=null,seed=1}={}){if(typeof this.safeSpawnResolver!=="function"||typeof this.spawnApplySink!=="function")return null;const airframe=this.airframeFor(this.threeScene),anchor=Array.isArray(around)?around:[Number(airframe?.position?.x)||0,Number(airframe?.position?.y)||0,Number(airframe?.position?.z)||0],resolved=this.safeSpawnResolver({around:anchor,mode,seed});const viewport=$("viewport");if(!resolved){if(viewport){viewport.dataset.worldSpawnSafe="0";viewport.dataset.worldSpawnMode=mode;}return null;}const yaw=mode==="respawn"?((Number(seed)>>>0)%360):0;this.spawnApplySink({x:resolved.x,y:resolved.y,z:resolved.z,yaw_deg:yaw});this.lastSafeSpawn=resolved;if(viewport){viewport.dataset.worldSpawnSafe="1";viewport.dataset.worldSpawnMode=mode;viewport.dataset.worldSpawnOffsetM=Number(resolved.offsetM||0).toFixed(3);viewport.dataset.worldSpawnGroundM=Number(resolved.groundZ||0).toFixed(3);if(mode==="respawn")viewport.dataset.vsLastRespawnOffsetM=Number(resolved.offsetM||0).toFixed(3);}return resolved;}\n'''
            s=s[:idx]+terrain_methods+s[idx:]

            # Building snapshot and visual layer must share terrain-relative bases.
            start=s.index('  clearBuildingCollisions(){');end=s.index('  buildingCollisionFeatures(){',start)
            s=s[:start]+'''  clearBuildingCollisions(){\n    const snapshot=Object.freeze({hash:"",footprintCount:0,prismCount:0,prisms:[]});this.buildingCollisionSnapshot=snapshot;this.buildingCollisionDirty=true;this.buildingCollisionLastCenter=[Infinity,Infinity];this.buildingCollisionSink?.(snapshot);this.buildingVisualLayer?.clear?.();this.buildingVisualLayer?.setVisible?.(false);const viewport=$("viewport");if(viewport){viewport.dataset.worldBuildingCollisionStatus="inactive";viewport.dataset.worldBuildingCollisionFootprints="0";viewport.dataset.worldBuildingCollisionPrisms="0";viewport.dataset.worldBuildingVisualMeshes="0";}return snapshot;\n  }\n'''+s[end:]
            start=s.index('  syncBuildingCollisions(force=false){');end=s.index('  addBuildings(){',start)
            s=s[:start]+'''  syncBuildingCollisions(force=false){\n    if(!this.active||!this.map||!this.buildingCollisionSink||!Number.isFinite(this.originLon)||!Number.isFinite(this.originLat)||!this.terrainSnapshot)return false;const now=performance.now();if(!force&&now-this.buildingCollisionLastSyncMs<WORLD_BUILDING_COLLISION_SYNC_MS)return false;const airframe=this.airframeFor(this.threeScene),center=[Number(airframe?.position?.x)||0,Number(airframe?.position?.y)||0],moved=Math.hypot(center[0]-this.buildingCollisionLastCenter[0],center[1]-this.buildingCollisionLastCenter[1]);if(!force&&!this.buildingCollisionDirty&&moved<20)return false;this.buildingCollisionLastSyncMs=now;\n    const features=this.buildingCollisionFeatures();if(!features.length){let loaded=false;try{loaded=this.map.isSourceLoaded?.(this.buildingSourceId)===true;}catch{}const viewport=$("viewport");if(!loaded){if(viewport)viewport.dataset.worldBuildingCollisionStatus="waiting-for-vector-tiles";return false;}const snapshot=Object.freeze({hash:"",footprintCount:0,prismCount:0,prisms:[]});this.buildingCollisionSink(snapshot);this.buildingCollisionSnapshot=snapshot;this.buildingVisualLayer?.clear?.();this.buildingVisualLayer?.setVisible?.(true);this.buildingCollisionDirty=false;this.buildingCollisionLastCenter=center;if(viewport){viewport.dataset.worldBuildingCollisionStatus="no-nearby-buildings";viewport.dataset.worldBuildingVisualMeshes="0";}return true;}\n    let footprints=buildingFootprintsFromFeatures(features,{project:(longitude,latitude)=>lngLatToMeters(this.originLon,this.originLat,longitude,latitude),center});footprints=footprints.map(footprint=>{const terrain=terrainHeightAt(this.terrainSnapshot,footprint.center[0],footprint.center[1]);if(!Number.isFinite(terrain))return footprint;return{...footprint,base:Number(footprint.base)+terrain,top:Number(footprint.top)+terrain};});const hash=buildingFootprintHash(footprints);if(hash===this.buildingCollisionSnapshot.hash){this.buildingCollisionDirty=false;this.buildingCollisionLastCenter=center;this.buildingVisualLayer?.setVisible?.(true);return false;}\n    const prisms=buildingCollisionPrismsFromFootprints(footprints,(outer,holes)=>THREE.ShapeUtils.triangulateShape(outer.map(point=>new THREE.Vector2(...point)),holes.map(ring=>ring.map(point=>new THREE.Vector2(...point))))),snapshot=Object.freeze({hash,footprintCount:footprints.length,prismCount:prisms.length,prisms});this.buildingCollisionSink(snapshot);this.buildingCollisionSnapshot=snapshot;this.buildingVisualLayer?.update?.(footprints,hash);this.buildingVisualLayer?.setVisible?.(true);this.buildingCollisionDirty=false;this.buildingCollisionLastCenter=center;this.buildingCollisionRevisions++;const viewport=$("viewport");if(viewport){viewport.dataset.worldBuildingCollisionStatus=prisms.length?"box3d-active":"no-nearby-buildings";viewport.dataset.worldBuildingCollisionFootprints=String(footprints.length);viewport.dataset.worldBuildingCollisionPrisms=String(prisms.length);viewport.dataset.worldBuildingCollisionRevision=String(this.buildingCollisionRevisions);viewport.dataset.worldBuildingVisualMeshes=String(this.buildingVisualLayer?.meshCount||0);}return true;\n  }\n'''+s[end:]
            start=s.index('  addBuildings(){');end=s.index('  addVisualShotImpact(',start)
            s=s[:start]+'''  addBuildings(){\n    if(!this.map)return;const style=this.map.getStyle(),sourceId=Object.entries(style.sources||{}).find(([,source])=>source?.type==="vector")?.[0];if(!sourceId){console.warn("OpenFreeMap style has no vector source for buildings");return;}this.buildingSourceId=sourceId;this.buildingCollisionDirty=true;const existing=this.map.getLayer("arondight45-buildings-3d");if(existing)return;const before=(style.layers||[]).find(layer=>layer.type==="symbol")?.id,layer={id:"arondight45-buildings-3d",type:"fill",source:sourceId,"source-layer":"building",minzoom:14,paint:{"fill-color":"#ffffff","fill-opacity":0}};try{if(before)this.map.addLayer(layer,before);else this.map.addLayer(layer);}catch(error){console.warn("OpenFreeMap building query layer unavailable:",error);}\n  }\n'''+s[end:]
            # Exact visual shot ray uses the same building prisms and DEM snapshot as Box3D.
            start=s.index('  addVisualShotImpact(');end=s.index('  async createMap(',start)
            s=s[:start]+'''  addVisualShotImpact(x,y,rect,ray){\n    if(!this.active||!ray?.origin||!ray?.direction)return null;const o=ray.origin,d=ray.direction;let bestT=Infinity,bestNx=0,bestNy=0,bestNz=1;const consider=(t,nx,ny,nz)=>{if(!(t>0)||t>=bestT||!Number.isFinite(t))return;const nLen=Math.hypot(nx,ny,nz)||1;nx/=nLen;ny/=nLen;nz/=nLen;if(nx*d.x+ny*d.y+nz*d.z>0){nx=-nx;ny=-ny;nz=-nz;}bestT=t;bestNx=nx;bestNy=ny;bestNz=nz;};this.worldShotQueries++;\n    for(const prism of this.buildingCollisionSnapshot?.prisms||[]){const ring=prism.points||[],base=Number(prism.base)||0,top=Number(prism.top)||0;if(ring.length<3)continue;if(Math.abs(d.z)>1e-7){const t=(top-o.z)/d.z,px=o.x+d.x*t,py=o.y+d.y*t;if(t>0&&t<bestT&&pointInRing(px,py,ring))consider(t,0,0,1);}for(let i=0,j=ring.length-1;i<ring.length;j=i++){const ax=ring[j][0],ay=ring[j][1],bx=ring[i][0],by=ring[i][1],sx=bx-ax,sy=by-ay,den=d.x*sy-d.y*sx;if(Math.abs(den)<1e-9)continue;const qpx=ax-o.x,qpy=ay-o.y,t=(qpx*sy-qpy*sx)/den,u=(qpx*d.y-qpy*d.x)/den;if(t<=0||t>=bestT||u<0||u>1)continue;const z=o.z+d.z*t;if(z<base-.02||z>top+.02)continue;consider(t,sy,-sx,0);}}\n    const terrain=raycastTerrainSnapshot(this.terrainSnapshot,o,d,1200);if(terrain&&terrain.distance<bestT)consider(terrain.distance,...terrain.normal);if(!Number.isFinite(bestT))return null;this.worldShotPoint.set(o.x+d.x*bestT,o.y+d.y*bestT,o.z+d.z*bestT);this.worldShotNormal.set(bestNx,bestNy,bestNz);const viewport=$("viewport");if(viewport)viewport.dataset.worldShotQueries=String(this.worldShotQueries);return this.worldShotHit;\n  }\n'''+s[end:]

            old='''this.applyFlightPalette();this.stripFlightClutter();this.addWorldImagery();'''
            new='''this.applyFlightPalette();this.stripFlightClutter();this.addWorldImagery();this.addTerrainPresentation();'''
            assert old in s;s=s.replace(old,new,1)
            old='''attribution.textContent="Imagery © Esri, Vantor, Earthstar Geographics, GIS User Community · Map © OpenFreeMap, OpenMapTiles, OpenStreetMap contributors";'''
            new='''attribution.textContent="Imagery © Esri, Vantor, Earthstar Geographics, GIS User Community · Terrain © Mapterhorn contributors · Map © OpenFreeMap, OpenMapTiles, OpenStreetMap contributors";'''
            assert old in s;s=s.replace(old,new,1)
