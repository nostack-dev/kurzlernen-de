name: One-shot flight stability correction

on:
  push:
    branches: [main]
    paths: ['.github/flight-stability.trigger']

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Restore stable FC envelope and remove angle motor cut
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_or_accept(path, old, new):
              p=Path(path); s=p.read_text()
              if old in s:
                  p.write_text(s.replace(old,new))
                  return
              if new in s:
                  return
              raise SystemExit(f'{path}: neither old nor new marker found: {old[:160]!r}')

          core='esp32/Arondight45_DroneFC_Core.hpp'
          old='''        if (armed_) {
            if (std::fabs(controller_.attitude.roll) > 68.0f ||
                std::fabs(controller_.attitude.pitch) > 68.0f) {
                set_fault(kFaultTilt);
                armed_ = false;
                controller_.reset();
            } else {
                Mix mixed{};
                if (cmd.throttle <= 0.02f) {
                    controller_.reset();
                } else {
                    mixed = controller_.run(imu, cmd, dt, cmd.throttle > 0.05f);
                }
                for (size_t i = 0; i < 4; ++i) out.motor_us[i] = pulse(mixed.motor[i], true);
            }
        }'''
          new='''        if (armed_) {
            // Attitude error is recoverable flight state, not a motor-cut condition.
            // Never turn all motors off merely because roll/pitch crosses an angle.
            // Explicit ARM/KILL, RC loss and genuine runtime/IMU/timing faults retain
            // their existing hard-disarm behavior.
            Mix mixed{};
            if (cmd.throttle <= 0.02f) {
                controller_.reset();
            } else {
                mixed = controller_.run(imu, cmd, dt, cmd.throttle > 0.05f);
            }
            for (size_t i = 0; i < 4; ++i) out.motor_us[i] = pulse(mixed.motor[i], true);
        }'''
          replace_or_accept(core,old,new)
          if 'set_fault(kFaultTilt)' in Path(core).read_text():
              raise SystemExit('angle-only tilt motor cut survived')

          state='esp32/Arondight45_StateControl.hpp'
          for old,new in {
            'static constexpr float kMaxTiltDeg = 40.0f;':'static constexpr float kMaxTiltDeg = 25.0f;',
            'static constexpr float kMaxTiltTangent = 0.83909963f;':'static constexpr float kMaxTiltTangent = 0.46630766f;',
            'static constexpr float kHorizontalIntegralGain = 0.55f;':'static constexpr float kHorizontalIntegralGain = 0.0f;',
            'static constexpr float kHorizontalIntegralLimitMps2 = 7.0f;':'static constexpr float kHorizontalIntegralLimitMps2 = 0.0f;',
            'static constexpr float kHorizontalNeutralDampingScale = 0.30f;':'static constexpr float kHorizontalNeutralDampingScale = 1.00f;',
            'static constexpr float kMaxHorizontalAccelerationMps2 = 7.5f;':'static constexpr float kMaxHorizontalAccelerationMps2 = 4.0f;',
          }.items(): replace_or_accept(state,old,new)

          replace_or_accept('sim/control_semantics.mjs','export const MAX_GAME_TILT_DEG=40.0;','export const MAX_GAME_TILT_DEG=25.0;')
          replace_or_accept('tests/control_semantics_test.mjs','assert.equal(MAX_GAME_TILT_DEG,40);','assert.equal(MAX_GAME_TILT_DEG,25);')

          arch='tests/architecture_invariants.mjs'
          replace_or_accept(arch,
            'requireText("esp32/Arondight45_StateControl.hpp","kMaxTiltDeg = 40.0f");',
            'requireText("esp32/Arondight45_StateControl.hpp","kMaxTiltDeg = 25.0f");')
          replace_or_accept(arch,
'''requireText("esp32/Arondight45_StateControl.hpp","kMaxHorizontalAccelerationMps2 = 7.5f");
requireText("esp32/Arondight45_StateControl.hpp","kHorizontalIntegralLimitMps2 = 7.0f");''',
'''requireText("esp32/Arondight45_StateControl.hpp","kMaxHorizontalAccelerationMps2 = 4.0f");
requireText("esp32/Arondight45_StateControl.hpp","kHorizontalIntegralGain = 0.0f");
requireText("esp32/Arondight45_StateControl.hpp","kHorizontalIntegralLimitMps2 = 0.0f");
requireText("esp32/Arondight45_StateControl.hpp","kHorizontalNeutralDampingScale = 1.00f");
forbidText("esp32/Arondight45_DroneFC_Core.hpp","set_fault(kFaultTilt)","airborne attitude must remain recoverable; angle alone may not cut all motors");
for(const aggressive of ["kMaxTiltDeg = 40.0f","kMaxHorizontalAccelerationMps2 = 7.5f","kHorizontalIntegralGain = 0.55f","kHorizontalNeutralDampingScale = 0.30f"])
  forbidText("esp32/Arondight45_StateControl.hpp",aggressive,`unstable GAME horizontal envelope returned: ${aggressive}`);''')

          test='tests/state_control_test.cpp'
          p=Path(test); s=p.read_text()
          replacements={
            'CHECK(controller.debug().forward_accel_mps2 > 7.4f);':'CHECK(controller.debug().forward_accel_mps2 > 3.9f);',
            '// Nominal hover plus the full 7.5 m/s^2 horizontal request must still leave':'// Nominal hover plus the stable 4.0 m/s^2 horizontal request must still leave',
            'CHECK(accel_norm > 7.4f && accel_norm < 7.6f);':'CHECK(accel_norm > 3.9f && accel_norm < 4.1f);',
            'CHECK(controller.debug().right_accel_mps2 > 7.4f);':'CHECK(controller.debug().right_accel_mps2 > 3.9f);',
          }
          for old,new in replacements.items():
              if old in s: s=s.replace(old,new)
              elif new not in s: raise SystemExit(f'{test}: neither old nor new marker found: {old!r}')
          # At 4 m/s² the commanded attitude is intentionally smaller than before.
          s=s.replace('CHECK(cmd.pitch < -0.60f);','CHECK(cmd.pitch < -0.35f);')
          s=s.replace('CHECK(cmd.roll < -0.60f);','CHECK(cmd.roll < -0.35f);')
          p.write_text(s)

          coretest='tests/drone_fc_core_test.cpp'
          p=Path(coretest); s=p.read_text()
          if 'Large attitude is recoverable.' not in s and 'A large in-flight attitude must never hard-cut all motors.' not in s:
              marker='''    // A single raw gyro spike is intentionally attenuated by the 100 Hz gyro
    // filter; a sustained physically impossible rotation must cross the 1750
    // deg/s filtered safety limit and latch kFaultRate.'''
              addition='''    // Large attitude is recoverable. A sustained sub-rate-limit roll must never
    // trigger an angle-only motor cut while ARM and throttle remain valid.
    fc::Runtime recovery_runtime;
    now_us = 0;
    calibrate(recovery_runtime, now_us);
    arm_runtime(recovery_runtime, now_us);
    fc::RuntimeOutput recovery_out{};
    for (int i = 0; i < 450; ++i) {
        auto rolling = stationary_input(now_us += 1000);
        rolling.rc.ch[4] = 1811;
        rolling.rc.ch[2] = 700;
        rolling.raw.g.x = 200.0f;
        recovery_out = recovery_runtime.step(rolling);
        CHECK(recovery_out.fault == fc::kFaultNone);
        CHECK(recovery_out.armed);
        for (auto pulse : recovery_out.motor_us) CHECK(pulse > fc::kEscMinUs);
    }
    CHECK(std::fabs(static_cast<float>(recovery_out.attitude_cdeg[0]) * 0.01f) > 68.0f);

'''+marker
              if marker not in s: raise SystemExit('core test insertion marker missing')
              p.write_text(s.replace(marker,addition,1))
          PY

          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/drone_fc_core_test.cpp -o /tmp/fc_core_test
          /tmp/fc_core_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 tests/state_control_test.cpp -o /tmp/state_control_test
          /tmp/state_control_test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iesp32 sim/Arondight45_DroneFC_SIL_WASM.cpp -o /tmp/sil_test
          /tmp/sil_test

      - name: Commit validated product fix
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esp32/Arondight45_DroneFC_Core.hpp esp32/Arondight45_StateControl.hpp sim/control_semantics.mjs tests/drone_fc_core_test.cpp tests/state_control_test.cpp tests/control_semantics_test.mjs tests/architecture_invariants.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Restore stable flight controller and remove angle motor cut'
          git push origin HEAD:main

      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          body="FLIGHT STABILITY V3 · source=${GH_SHA} · patch=${PATCH_OUTCOME} · job=${JOB_STATUS} · https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -cn --arg body "$body" '{body:$body}')"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPO}/issues/53/comments" -d "$payload" >/dev/null
