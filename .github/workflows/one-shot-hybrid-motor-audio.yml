name: One-shot hybrid motor audio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-hybrid-motor-audio.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace noise-only rotor audio with physics-driven hybrid source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = '.github/workflows/one-shot-hybrid-motor-audio.yml'
          previous = subprocess.check_output(['git','show',f'HEAD^:{workflow}'], text=True)
          marker = "module = r'''"
          if marker not in previous:
              raise SystemExit('previous workflow does not contain embedded audio module')
          module = previous.split(marker,1)[1].split("\n'''",1)[0] + '\n'
          Path('sim/motor_sound.mjs').write_text(module)

          sim_path = Path('sim/simulator.mjs')
          sim = sim_path.read_text()
          camera_import = 'import {loadCameraSettings,mountCameraSettings} from "./camera_settings.mjs";'
          hybrid_import = 'import {HybridMotorSound} from "./motor_sound.mjs";'
          if hybrid_import not in sim:
              sim = sim.replace(camera_import, camera_import + '\n' + hybrid_import)
          start = sim.index('class MotorSound {')
          end = sim.index('THREE.Object3D.DEFAULT_UP.set', start)
          sim = sim[:start] + sim[end:]
          sim = sim.replace('const motorSound=new MotorSound($("viewport"));','const motorSound=new HybridMotorSound($("viewport"));')
          sim_path.write_text(sim)

          browser = Path('tests/browser_sim_smoke.mjs')
          browser.write_text(browser.read_text().replace(
              'motorOmega+motorTorque+propTorque+tipSpeed:bladeImpulseNoise',
              'motorOmega+motorTorque+propTorque+tipSpeed:hybridBladeMotor'))

          inv = Path('tests/architecture_invariants.mjs')
          text = inv.read_text()
          old = 'for(const marker of ["class MotorSound","model.motorOmega","model.motorTorque","model.propTorque","motorAudioPowerW","escWindingTone","armToneSequence","motorAudioArmEvent","motorAudioEscToneCount","motorSound.syncFcState(fcState,arm)"])requireText("sim/simulator.mjs",marker);'
          new = 'for(const marker of ["class HybridMotorSound","model.motorOmega","model.motorTorque","model.propTorque","motorAudioPowerW","escWindingTone","armToneSequence","motorAudioArmEvent","motorAudioEscToneCount","playbackRate.setTargetAtTime"])requireText("sim/motor_sound.mjs",marker);\nrequireText("sim/simulator.mjs",\'import {HybridMotorSound} from "./motor_sound.mjs";\');\nrequireText("sim/simulator.mjs",\'const motorSound=new HybridMotorSound($("viewport"));\');'
          if old not in text:
              raise SystemExit('audio architecture marker block not found')
          text = text.replace(old, new)
          text = text.replace(
              'requireText("sim/simulator.mjs",\'this.viewport.dataset.motorAudioSource="motorOmega+motorTorque+propTorque+tipSpeed:bladeImpulseNoise"\');',
              'requireText("sim/motor_sound.mjs",\'this.viewport.dataset.motorAudioSource="motorOmega+motorTorque+propTorque+tipSpeed:hybridBladeMotor"\');')
          text = text.replace(
              'for(const marker of ["pulseLfo.connect(pulseDepth)","pulseDepth.connect(pulseGain.gain)","washNoise","tipSpeed"])requireText("sim/simulator.mjs",marker);',
              'for(const marker of ["bladeSource","motorSource","washNoise","tipSpeed","playbackRate.setTargetAtTime"])requireText("sim/motor_sound.mjs",marker);')
          inv.write_text(text)

          Path(workflow).unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore physical rotor and motor tone"
          git push
