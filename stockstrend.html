<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>BotBot · Aktien</title>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --soft: #f5f5f7;
    --line: #e8e8ed;
    --text: #1b1b1f;
    --muted: #6b6b76;
    --green: #00c761;
    --red: #ff3b30;
    --amber: #ff9500;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--soft); color: var(--text); }
  header { background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 0.82rem; }
  .ok { color: var(--green); font-weight: 700; }
  .bad { color: var(--red); font-weight: 700; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 14px 28px; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .row2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .row3, .row2 { grid-template-columns: 1fr; } }
  .label { color: var(--muted); font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .big { font-size: 1.65rem; font-weight: 750; letter-spacing: -0.03em; margin: 0 0 8px; line-height: 1.15; }
  .kpis { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.9rem; color: var(--muted); }
  .kpis b { color: var(--text); font-weight: 700; }
  .pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
  .pill.hold { background: #fff4e5; color: var(--amber); }
  .pill.buy { background: #e6f9ef; color: var(--green); }
  .pill.sell { background: #ffeaea; color: var(--red); }
  .pill.early { background: var(--soft); color: var(--muted); }
  .note { color: var(--muted); font-size: 0.9rem; line-height: 1.35; margin-top: 8px; }
  .range { display: flex; flex-wrap: wrap; gap: 6px; }
  .range button { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 7px 12px; font-weight: 650; font-size: 0.8rem; cursor: pointer; }
  .range button.active { background: var(--text); color: #fff; border-color: var(--text); }
  canvas { width: 100% !important; max-height: 190px; }
  .stimmen-box { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 14px; align-items: start; max-width: 720px; }
  @media (max-width: 800px) { .stimmen-box { grid-template-columns: 1fr; } }
  details.acc { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: #fff; }
  details.acc > summary { list-style: none; cursor: pointer; padding: 10px 12px; font-size: 0.85rem; font-weight: 700; display: flex; justify-content: space-between; }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc.bull > summary { color: var(--green); }
  details.acc.bear > summary { color: var(--red); }
  details.acc.mixed > summary { color: var(--amber); }
  .voice { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--text); line-height: 1.35; }
  .voice a { color: var(--green); text-decoration: none; font-weight: 650; margin-left: 6px; font-size: 0.78rem; }
  footer { max-width: 980px; margin: 0 auto; padding: 0 14px 24px; color: var(--muted); font-size: 0.75rem; }
  a.ext { color: var(--green); text-decoration: none; font-weight: 650; margin-right: 10px; }
  .voice-at { display:block; color: var(--muted); font-size: 11px; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>BotBot · Aktien</h1>
</header>
<div class="wrap">
  <div class="row3">
    <div class="card">
      <div class="label">Marktstimmung</div>
      <div class="big" id="biasDir">—</div>
      <div class="kpis">
        <span>Stärke <b id="biasMag">—</b></span>
        <span>Sicherheit <b id="biasConf">—</b></span>
        <span id="biasEarly"></span>
      </div>
      <div class="note" id="biasNote"></div>
    </div>
    <div class="card">
      <div class="label">Beobachtung · Oracle (ORCL)</div>
      <div class="big"><span class="pill" id="orclSig">—</span></div>
      <div class="kpis">
        <span title="Social-Buzz von −100 (sehr negativ) bis +100 (sehr positiv)">Social-Buzz <b id="orclImp">—</b></span>
        <span>Bullish <b id="orclBull" style="color:var(--green)">—</b></span>
        <span>Bearish <b id="orclBear" style="color:var(--red)">—</b></span>
        <span>Saldo <b id="orclNet">—</b></span>
      </div>
      <div class="note" id="orclWhy"></div>
      <div class="meta" style="margin-top:8px" id="orclLinks"></div>
    </div>
    <div class="card">
      <div class="label">Aktualität</div>
      <div class="big" id="freshAge">—</div>
      <div class="kpis">
        <span>Beiträge <b id="freshItems">—</b></span>
        <span>Stand <b id="freshAt">—</b></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">Zeitraum</div>
    <div class="range" id="rangeBar">
      <button type="button" data-range="today">Heute</button>
      <button type="button" data-range="1d">1T</button>
      <button type="button" data-range="1w" class="active">1W</button>
      <button type="button" data-range="5m">5M</button>
      <button type="button" data-range="year">1J</button>
      <button type="button" data-range="all">Gesamt</button>
    </div>
  </div>

  <div class="row2">
    <div class="card">
      <div class="label">Oracle · Stimmung über Zeit</div>
      <canvas id="hypeChart" height="170"></canvas>
    </div>
    <div class="card">
      <div class="label">Markt · Stärke über Zeit</div>
      <canvas id="magChart" height="170"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="label">Oracle · Meinungen <span class="meta" id="stimmenRange"></span></div>
    <div class="stimmen-box">
      <div>
        <canvas id="pie" width="150" height="150"></canvas>
        <div class="meta" id="pieLeg" style="text-align:center;margin-top:6px"></div>
      </div>
      <div id="stimmenList"></div>
    </div>
  </div>
</div>
<footer>BotBot · Social-Signal, keine Anlageberatung</footer>
<script>
var LS_RANGE='botbot_wl_range', LS_ACC='botbot_acc_open';
var wlRange=(function(){ try{ return localStorage.getItem(LS_RANGE)||'1w'; }catch(e){ return '1w'; } })();
var tickData=null, wlData=null, hypeChart=null, magChart=null, pieChart=null;
function saveRange(r){ try{ localStorage.setItem(LS_RANGE, r); }catch(e){} }
function loadAccOpen(){ try{ return JSON.parse(localStorage.getItem(LS_ACC)||'{}'); }catch(e){ return {}; } }
function saveAccOpen(map){ try{ localStorage.setItem(LS_ACC, JSON.stringify(map)); }catch(e){} }

var DIR_DE = {
  mixed_cautious: 'Gemischt, vorsichtig',
  leicht_bearish_risk_off: 'Leicht negativ',
  leicht_bullish_risk_on: 'Leicht positiv',
  bearish_risk_off: 'Negativ',
  bullish_risk_on: 'Positiv',
  mixed: 'Gemischt',
  neutral: 'Neutral'
};
var SIG_DE = { hold: 'Halten', buy: 'Kaufen', sell: 'Verkaufen' };
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cls(s){s=String(s||'').toLowerCase(); if(s.indexOf('buy')>=0||s==='kaufen')return 'buy'; if(s.indexOf('sell')>=0||s==='verkaufen')return 'sell'; return 'hold';}
function rangeCutoffMs(range){
  var now=Date.now(), d=new Date();
  if(range==='today') return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  if(range==='1d') return now-864e5;
  if(range==='1w') return now-7*864e5;
  if(range==='5m') return now-150*864e5;
  if(range==='year') return now-365*864e5;
  return 0;
}
function filterByAt(arr, getAt){
  if(!arr||!arr.length) return [];
  if(!wlRange||wlRange==='all') return arr.slice();
  var cut=rangeCutoffMs(wlRange);
  var out=arr.filter(function(x){var t=new Date(getAt(x)||0).getTime(); return !isNaN(t)&&t>=cut;});
  return out.length?out:arr.slice();
}
function fmtBerlin(iso){
  try{return new Date(iso).toLocaleString('de-DE',{timeZone:'Europe/Berlin',dateStyle:'short',timeStyle:'short'});}catch(e){return iso||'—';}
}
function euro(n){
  if(n==null||isNaN(n)) return '—';
  return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
}
function ageLabel(iso){
  try{
    var ms=Date.now()-new Date(iso).getTime();
    if(isNaN(ms)) return '—';
    var sec=Math.max(0,Math.round(ms/1000));
    if(sec<90) return sec+' Sek.';
    var min=Math.round(sec/60);
    if(min<60) return min+' Min.';
    var h=Math.round(min/60);
    if(h<48) return h+' Std.';
    return Math.round(h/24)+' Tage';
  }catch(e){return '—';}
}
function tipOpts(ySuffix){
  return {enabled:true, mode:'index', intersect:false,
    callbacks:{
      title:function(items){ return items&&items[0]?items[0].label:''; },
      label:function(ctx){ var v=ctx.parsed.y; if(v==null) return (ctx.dataset.label||'')+': —';
        return (ctx.dataset.label?ctx.dataset.label+': ':'')+v+(ySuffix||''); }
    }};
}
function chartInteract(){ return {mode:'index', intersect:false, axis:'x'}; }
function renderAll(){
  var t=(tickData&&tickData.tick)||{};
  var v=t.vector||{};
  var fr=t.freshness||{};
  var updated=tickData&&tickData.updated_at;
  // Prefer freshest social item age for "Aktualität", not page load lag text
  var age=ageLabel(updated);
  var stale=false;
  try{ stale=(Date.now()-new Date(updated).getTime())>20*60*1000; }catch(e){}
  document.getElementById('freshAge').textContent=age||'—';
  document.getElementById('freshItems').textContent=(t.totals&&t.totals.content_items_usable)!=null?t.totals.content_items_usable:'—';
  document.getElementById('freshAt').textContent=fmtBerlin(updated);
  var dir=String(v.direction||'');
  document.getElementById('biasDir').textContent=DIR_DE[dir]||dir||'—';
  document.getElementById('biasMag').textContent=v.magnitude!=null?v.magnitude:'—';
  document.getElementById('biasConf').textContent=v.confidence!=null?v.confidence:'—';
  document.getElementById('biasEarly').textContent=v.early_signal?'Frühsignal':'';
  document.getElementById('biasNote').textContent=t.early_signal_note||v.note||'';

  var orcl=((wlData&&wlData.stocks)||{}).ORCL||{};
  var lat=orcl.latest||{};
  var hyp=lat.hype||{};
  var ev=lat.evidence||{};
  var sig=String(lat.signal||'').toLowerCase();
  document.getElementById('orclSig').className='pill '+cls(sig);
  document.getElementById('orclSig').textContent=SIG_DE[sig]||String(lat.signal||'—').toUpperCase();
  (function(){ var n=lat.social_impulse; var el=document.getElementById('orclImp');
    if(n==null||n===''){ el.textContent='—'; return; }
    var s=Number(n); el.textContent=(s>0?'+':'')+s+' (−100…+100)'; })();
  document.getElementById('orclBull').textContent=hyp.bull!=null?(hyp.bull+' %'):'—';
  document.getElementById('orclBear').textContent=hyp.bear!=null?(hyp.bear+' %'):'—';
  document.getElementById('orclNet').textContent=hyp.net!=null?hyp.net:'—';
  document.getElementById('orclWhy').textContent=lat.why||'';
  var L=lat.links||{};
  document.getElementById('orclLinks').innerHTML=(L.yahoo?'<a class="ext" href="'+esc(L.yahoo)+'" target="_blank" rel="noopener">Yahoo</a>':'')+(L.tradingview?'<a class="ext" href="'+esc(L.tradingview)+'" target="_blank" rel="noopener">TradingView</a>':'');

  var hist=filterByAt(orcl.history||[], function(h){return h.at;});
  if(hypeChart) hypeChart.destroy();
  hypeChart=new Chart(document.getElementById('hypeChart'),{type:'line',data:{labels:hist.map(function(h){return fmtBerlin(h.at);}),datasets:[
    {label:'Bullish',data:hist.map(function(h){return h.hype_bull;}),borderColor:'#00c761',tension:.25,pointRadius:3,pointHoverRadius:6,borderWidth:2},
    {label:'Bearish',data:hist.map(function(h){return h.hype_bear!=null?-Math.abs(h.hype_bear):null;}),borderColor:'#ff3b30',tension:.25,pointRadius:3,pointHoverRadius:6,borderWidth:2},
    {label:'Saldo',data:hist.map(function(h){return h.hype_net!=null?h.hype_net:h.social_impulse;}),borderColor:'#1b1b1f',borderDash:[4,4],tension:.25,pointRadius:3,pointHoverRadius:6,borderWidth:1.5}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:chartInteract(),plugins:{legend:{labels:{color:'#6b6b76',boxWidth:8,font:{size:11}}},tooltip:tipOpts(' %')},scales:{x:{ticks:{color:'#6b6b76',maxTicksLimit:6,autoSkip:true},grid:{display:false}},y:{min:-100,max:100,ticks:{color:'#6b6b76'},grid:{color:'#f0f0f3'}}}}});

  var mhist=filterByAt(tickData.history||[], function(h){return h.scraped_at||h.tick_id||h.at;});
  if(!mhist.length && (t.mini_series||[]).length){
    mhist=filterByAt((t.mini_series||[]).map(function(m){return {scraped_at:m.at,magnitude:m.magnitude};}), function(h){return h.scraped_at;});
  }
  if(magChart) magChart.destroy();
  magChart=new Chart(document.getElementById('magChart'),{type:'line',data:{labels:mhist.map(function(h){return fmtBerlin(h.scraped_at||h.tick_id);}),datasets:[{label:'Stärke',data:mhist.map(function(h){return h.magnitude;}),borderColor:'#1b1b1f',backgroundColor:'rgba(0,199,97,.08)',fill:true,tension:.25,pointRadius:3,pointHoverRadius:6,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,interaction:chartInteract(),plugins:{legend:{display:false},tooltip:tipOpts('')},scales:{x:{ticks:{color:'#6b6b76',maxTicksLimit:6,autoSkip:true},grid:{display:false}},y:{min:0,max:100,ticks:{color:'#6b6b76'},grid:{color:'#f0f0f3'}}}}});

  var voices=filterByAt(ev.voices||orcl.voices_archive||[], function(v){return v.at;});
  var counts={bull:0,mixed:0,bear:0};
  voices.forEach(function(v){var l=String(v.lean||'mixed').toLowerCase(); if(l!=='bull'&&l!=='bear')l='mixed'; counts[l]++;});
  var total=counts.bull+counts.mixed+counts.bear;
  if(pieChart) pieChart.destroy();
  pieChart=new Chart(document.getElementById('pie'),{type:'doughnut',data:{labels:['Bullish','Unklar','Bearish'],datasets:[{data:[counts.bull,counts.mixed,counts.bear],backgroundColor:['#00c761','#ff9500','#ff3b30'],borderWidth:0}]},options:{plugins:{legend:{display:false}},cutout:'64%'}});
  document.getElementById('pieLeg').textContent=total?('Bullish '+counts.bull+' · Unklar '+counts.mixed+' · Bearish '+counts.bear):'Keine Meinungen';
  var rn={today:'Heute','1d':'1T','1w':'1W','5m':'5M',year:'1J',all:'Gesamt'}[wlRange]||wlRange;
  document.getElementById('stimmenRange').textContent='('+rn+')';
  var groups={bull:[],mixed:[],bear:[]};
  voices.slice().sort(function(a,b){return new Date(b.at||0)-new Date(a.at||0);}).forEach(function(v){
    var l=String(v.lean||'mixed').toLowerCase(); if(l!=='bull'&&l!=='bear')l='mixed'; groups[l].push(v);
  });
  var titles={bull:'Bullish',mixed:'Unklar',bear:'Bearish'};
  var html='';
  ['bull','mixed','bear'].forEach(function(g){
    var arr=groups[g]; if(!arr.length) return;
    html+='<details class="acc '+g+'"><summary>'+titles[g]+' <span>('+arr.length+')</span></summary>';
    arr.slice(0,8).forEach(function(v){
      html+='<div class="voice"><span class="voice-at">'+esc(fmtBerlin(v.at)||'ohne Datum')+' · '+esc((String(v.source||v.src||'Social')).toUpperCase())+'</span>'+esc(v.text||'')+(v.url?' <a href="'+esc(v.url)+'" target="_blank" rel="noopener">Öffnen</a>':'')+'</div>';
    });
    html+='</details>';
  });
  document.getElementById('stimmenList').innerHTML=html||'<div class="meta">Keine Meinungen in diesem Zeitraum.</div>';
  var accMap=loadAccOpen();
  Array.prototype.forEach.call(document.querySelectorAll('#stimmenList details.acc'), function(d){
    var key=(d.className||'').replace(/\s+/g,' ');
    if(accMap[key]) d.open=true;
    d.addEventListener('toggle', function(){
      var m=loadAccOpen();
      m[key]=d.open;
      saveAccOpen(m);
    });
  });
}
async function load(){
  var a=await fetch('stockstrend-data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();});
  var b=await fetch('watchlist-data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();});
  tickData=a; wlData=b;
  Array.prototype.forEach.call(document.querySelectorAll('#rangeBar button'), function(b){
    b.classList.toggle('active', b.getAttribute('data-range')===wlRange);
  });
  renderAll();
}
document.getElementById('rangeBar').onclick=function(e){
  var btn=e.target.closest('button[data-range]'); if(!btn) return;
  wlRange=btn.getAttribute('data-range');
  saveRange(wlRange);
  Array.prototype.forEach.call(document.querySelectorAll('#rangeBar button'), function(b){b.classList.toggle('active', b===btn);});
  renderAll();
};
var REFRESH_MS=60000;
load();
setInterval(function(){ load(); }, REFRESH_MS);
</script>
</body>
</html>
